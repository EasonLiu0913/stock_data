<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>月營收因子穩定性分析</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1580px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:16px;box-shadow:0 5px 18px rgba(15,23,42,.06)}.header,.toolbar{padding:18px}.header h1{margin:0 0 8px}.muted{color:#64748b}.toolbar{display:flex;gap:12px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:800;color:#475569}.field select{height:38px;border:1px solid #cbd5e1;border-radius:7px;padding:0 10px}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:16px}.card{border:1px solid #e2e8f0;border-radius:10px;padding:14px}.label{font-size:12px;color:#64748b;font-weight:700}.value{font-size:22px;font-weight:900;margin-top:5px}.section-title{padding:16px 18px 8px;font-weight:900;font-size:18px}.section-note{padding:0 18px 12px;color:#64748b;font-size:13px}.table-wrap{overflow:auto;border-top:1px solid #e2e8f0}table{border-collapse:collapse;width:100%;min-width:1280px}th,td{padding:9px 11px;border-bottom:1px solid #e2e8f0;text-align:right;white-space:nowrap;font-size:13px}th{background:#f8fafc;position:sticky;top:0;z-index:1}th:first-child,td:first-child{text-align:left}.positive{color:#b91c1c;font-weight:800}.negative{color:#047857;font-weight:800}.heat{font-weight:800;border-radius:6px}.error{display:none;padding:16px;color:#b91c1c;font-weight:800}@media(max-width:900px){.wrap{padding:10px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head>
<body><div class="wrap">
<section class="panel header"><h1>月營收因子穩定性分析</h1><div class="muted">YoY ≥20% 子因子 × 月度 universe uplift × 波動度 × 最差月份</div></section>
<section class="panel toolbar"><div class="field"><label>期間</label><select id="h"><option>d1</option><option>d3</option><option selected>d5</option><option>d10</option><option>d20</option></select></div><div class="field"><label>熱力圖指標</label><select id="metric"><option value="relative_win_rate_uplift_pp">勝率 uplift (pp)</option><option value="avg_excess_uplift_pct">平均超額 uplift (%)</option></select></div></section>
<div id="error" class="panel error"></div>
<section class="panel"><div id="cards" class="cards"></div></section>
<section class="panel"><div class="section-title">穩定性排名</div><div class="section-note">穩定性分數同時考慮正向月份比例、平均效果、樣本量與月度波動懲罰；僅用於研究優先順序。</div><div class="table-wrap"><table><thead><tr><th>因子</th><th>樣本</th><th>月份</th><th>穩定性</th><th>平均勝率 uplift</th><th>勝率標準差</th><th>平均超額 uplift</th><th>超額標準差</th><th>正勝率月份</th><th>正超額月份</th><th>最差勝率 uplift</th><th>最差超額 uplift</th><th>樣本效率</th></tr></thead><tbody id="rankBody"></tbody></table></div></section>
<section class="panel"><div class="section-title">月度 uplift 熱力圖</div><div class="section-note">每格顯示相對同月份全市場母體的 uplift；正值代表該因子優於母體。</div><div class="table-wrap"><table id="heatTable"></table></div></section>
</div>
<script>
const BASE=location.pathname.includes('/stock_data/')?'/stock_data':'';let data=null;const $=id=>document.getElementById(id);const fmt=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'—';const cls=v=>Number(v)>0?'positive':Number(v)<0?'negative':'';
function heatStyle(v){if(!Number.isFinite(Number(v)))return'';const x=Math.max(-10,Math.min(10,Number(v)));const a=.08+Math.abs(x)/10*.30;return x>=0?`background:rgba(185,28,28,${a})`:`background:rgba(4,120,87,${a})`}
function render(){const h=$('h').value,metric=$('metric').value,rows=(data?.rows||[]).filter(r=>r.horizon===h).sort((a,b)=>(b.stability_score??-1)-(a.stability_score??-1));const best=rows[0];$('cards').innerHTML=[['研究區間',`${data?.start_month||'—'}～${data?.end_month||'—'}`],['期間',h.toUpperCase()],['子因子數',rows.length],['最高穩定因子',best?.factor_name||'—'],['最高穩定分數',fmt(best?.stability_score)]].map(([l,v])=>`<div class="card"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');$('rankBody').innerHTML=rows.map(r=>`<tr><td style="font-weight:800">${r.factor_name}</td><td>${r.samples}</td><td>${r.covered_months}</td><td>${fmt(r.stability_score)}</td><td class="${cls(r.avg_monthly_win_uplift_pp)}">${fmt(r.avg_monthly_win_uplift_pp)}</td><td>${fmt(r.win_uplift_stddev_pp)}</td><td class="${cls(r.avg_monthly_excess_uplift_pct)}">${fmt(r.avg_monthly_excess_uplift_pct)}</td><td>${fmt(r.excess_uplift_stddev_pct)}</td><td>${fmt(r.positive_win_uplift_month_rate)}%</td><td>${fmt(r.positive_excess_uplift_month_rate)}%</td><td class="${cls(r.worst_month_win_uplift_pp)}">${fmt(r.worst_month_win_uplift_pp)}</td><td class="${cls(r.worst_month_excess_uplift_pct)}">${fmt(r.worst_month_excess_uplift_pct)}</td><td>${fmt(r.sample_efficiency_score)}</td></tr>`).join('');const months=[...new Set(rows.flatMap(r=>(r.monthly||[]).map(m=>m.month)))].sort();$('heatTable').innerHTML=`<thead><tr><th>因子</th>${months.map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>{const map=new Map((r.monthly||[]).map(m=>[m.month,m]));return `<tr><td style="font-weight:800">${r.factor_name}</td>${months.map(m=>{const v=map.get(m)?.[metric];return `<td class="heat ${cls(v)}" style="${heatStyle(v)}">${fmt(v)}</td>`}).join('')}</tr>`}).join('')}</tbody>`}
async function load(){try{const r=await fetch(`${BASE}/data_prediction_analysis/monthly-revenue/monthly-signals/factor-stability.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);data=await r.json();render()}catch(e){$('error').style.display='block';$('error').textContent=`無法載入穩定性資料：${e.message}`}}
$('h').onchange=render;$('metric').onchange=render;load();
</script></body></html>
