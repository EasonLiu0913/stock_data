<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日漲幅 5% 以上股票</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; }
    .wrap { max-width: 1500px; margin: 0 auto; padding: 20px 14px 48px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; box-shadow: 0 8px 24px rgba(15,23,42,.05); }
    header, .toolbar { padding: 18px; margin-bottom: 14px; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    .muted { color: #64748b; line-height: 1.55; }
    .toolbar { display: flex; gap: 12px; align-items: end; }
    .toolbar .summary { margin-left: auto; font-weight: 800; }
    label { display: block; font-weight: 800; margin-bottom: 6px; }
    select { min-width: 190px; padding: 9px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
    .status { padding: 12px 16px; margin-bottom: 14px; color: #475569; }
    .market-summary-card { padding: 18px; margin-bottom: 14px; }
    .market-summary-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
    .market-summary-title { font-size: 1.14rem; font-weight: 950; line-height: 1.45; }
    .summary-badge { flex: 0 0 auto; border-radius: 999px; padding: 5px 9px; font-size: .75rem; font-weight: 900; background: #f1f5f9; color: #475569; }
    .summary-badge.final { background: #dcfce7; color: #166534; }
    .summary-badge.preliminary { background: #fef3c7; color: #92400e; }
    .summary-metrics { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 8px; margin-bottom: 14px; }
    .summary-metric { background: #f8fafc; border: 1px solid #edf2f7; border-radius: 10px; padding: 10px; }
    .summary-metric b { display: block; color: #64748b; font-size: .72rem; margin-bottom: 4px; }
    .summary-metric strong { font-size: 1.08rem; }
    .summary-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; }
    .summary-block { background: #f8fafc; border-radius: 10px; padding: 12px; min-width: 0; }
    .summary-block h3 { margin: 0 0 8px; font-size: .9rem; }
    .theme-list, .watch-list { margin: 0; padding-left: 18px; color: #475569; line-height: 1.65; font-size: .87rem; }
    .market-summary-text { margin-top: 12px; color: #334155; line-height: 1.7; }
    .coverage-note { margin-top: 10px; font-size: .78rem; color: #64748b; }
    .stock-list { display: grid; gap: 14px; }
    .stock-card { overflow: hidden; }
    .stock-card-grid { display: grid; grid-template-columns: minmax(230px, .8fr) minmax(320px, 1.15fr) minmax(360px, 1.35fr); }
    .stock-pane { padding: 17px; min-width: 0; }
    .stock-pane + .stock-pane { border-left: 1px solid #e2e8f0; }
    .pane-label { font-size: .76rem; font-weight: 900; color: #64748b; letter-spacing: .05em; margin-bottom: 10px; }
    .stock-heading { display: flex; justify-content: space-between; gap: 10px; }
    .stock-name { font-size: 1.2rem; font-weight: 900; }
    .stock-code { font-size: .86rem; color: #64748b; font-weight: 800; }
    .gain { font-size: 1.25rem; font-weight: 950; color: #dc2626; text-align: right; }
    .small { font-size: .84rem; color: #64748b; }
    .metrics, .flow-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 12px; }
    .flow-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .metric { background: #f8fafc; border-radius: 8px; padding: 8px; }
    .metric b { display: block; font-size: .74rem; color: #64748b; margin-bottom: 3px; }
    .reason { font-weight: 850; line-height: 1.55; margin-bottom: 7px; }
    .detail { font-size: .9rem; color: #475569; line-height: 1.58; margin-top: 6px; overflow-wrap: anywhere; }
    .pill { display: inline-block; padding: 3px 8px; border-radius: 999px; background: #f1f5f9; font-size: .75rem; font-weight: 850; }
    .sources { display: flex; flex-wrap: wrap; gap: 7px 10px; margin-top: 9px; }
    .sources a { font-size: .84rem; color: #2563eb; text-decoration: none; }
    .empty, .error { padding: 28px; text-align: center; color: #64748b; }
    .error { color: #b91c1c; }

    @media (max-width: 1120px) {
      .stock-card-grid { grid-template-columns: minmax(240px, .8fr) minmax(0, 1.2fr); }
      .stock-pane-flow { grid-column: 1 / -1; border-left: 0 !important; border-top: 1px solid #e2e8f0; }
      .summary-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 760px) {
      .wrap { padding: 10px 8px 30px; }
      .toolbar { position: sticky; top: 0; z-index: 5; display: block; }
      .toolbar .summary { margin: 10px 0 0; }
      select { width: 100%; min-width: 0; min-height: 42px; }
      .market-summary-head { display: block; }
      .summary-badge { display: inline-block; margin-top: 8px; }
      .summary-metrics { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .summary-grid { display: block; }
      .summary-block + .summary-block { margin-top: 9px; }
      .stock-card-grid { display: block; }
      .stock-pane + .stock-pane { border-left: 0; border-top: 1px solid #e2e8f0; }
      .stock-pane-flow { border-top: 1px solid #e2e8f0 !important; }
      .flow-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 476px) {
      .wrap { padding: 8px 7px 26px; }
      .market-summary-card { padding: 14px 12px; }
      .stock-pane { padding: 14px 12px; }
      .flow-grid { gap: 5px; }
      .metric { padding: 7px; }
    }
  </style>
</head>
<body>
<main class="wrap">
  <header class="card">
    <h1>每日漲幅 5% 以上股票</h1>
    <div class="muted">Stage 1 有最新版 news-theme analysis 時先顯示題材與逐檔原因；Stage 2 Unified Analysis 完成後再補上籌碼與技術 facts，不混用舊 schema。</div>
    <div id="meta" class="muted">載入中…</div>
  </header>
  <section class="toolbar card">
    <div><label for="dateSelect">交易日</label><select id="dateSelect"></select></div>
    <div id="summary" class="summary"></div>
  </section>
  <section id="marketSummary" class="market-summary-card card"><div class="muted">載入整體市場總結…</div></section>
  <section id="status" class="status card">載入分析狀態…</section>
  <section class="stock-list" id="content"><div class="card empty">載入中…</div></section>
</main>
<script>
const ROOT='../data_daily_gain_over_5', ANALYSIS=`${ROOT}/analysis`, NEWS_ANALYSIS=`${ROOT}/analysis-news`, MARKET_SUMMARY=`${ROOT}/market-summary`;
const $=id=>document.getElementById(id), dateSelect=$('dateSelect'),content=$('content'),meta=$('meta'),summary=$('summary'),status=$('status'),marketSummary=$('marketSummary');
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const num=v=>v==null||!Number.isFinite(Number(v))?'—':Number(v).toLocaleString('zh-TW',{maximumFractionDigits:2});
const fmtDate=v=>v?.length===8?`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`:v||'—';
const pct=v=>v==null||!Number.isFinite(Number(v))?'—':`${Number(v).toFixed(1)}%`;
const TAG_LABELS={
  cause_type:{company_event:'公司事件',industry_theme:'產業／題材',fundamental:'基本面',institutional_flow:'法人／籌碼',technical_momentum:'技術動能',market_risk_on:'市場風險偏好',low_liquidity:'低流動性',mixed:'綜合因素',unknown:'未明確分類'},
  evidence_strength:{direct:'直接證據',corroborated:'交叉佐證',circumstantial:'間接佐證',none:'無明確證據'},
  confidence:{high:'高信心',medium:'中等信心',low:'低信心'}
};
const REGIME_LABELS={broad_risk_on:'全面 Risk-on',theme_rotation:'題材輪動',index_led_rally:'指數帶動',defensive_rotation:'防禦輪動',speculative_breadth:'投機廣度擴張',risk_off_with_pockets:'Risk-off 中局部強勢',mixed:'混合盤勢',unknown:'尚未判定'};
const tagLabel=(group,value)=>TAG_LABELS[group]?.[value]||value||'—';
async function json(url,optional=false){const r=await fetch(url,{cache:'no-store'});if(optional&&r.status===404)return null;if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return r.json()}
function actor(v){if(!v)return '—';if(v.record_status==='unavailable')return '資料未就緒';if(v.record_status==='no_record')return '官方無該股紀錄';if(v.net_lots==null)return v.record_status||'—';return `${Number(v.net_lots).toLocaleString('zh-TW')} 張`}
function sources(list){if(!Array.isArray(list)||!list.length)return'';return `<div class="sources">${list.map((s,i)=>{try{const u=new URL(s.url);if(!['http:','https:'].includes(u.protocol))return'';return `<a href="${esc(u.href)}" target="_blank" rel="noopener">${esc(s.title||`來源 ${i+1}`)}</a>`}catch{return''}}).join('')}</div>`}
function marketSummaryHtml(s){
  if(!s)return '<div class="muted">本日尚未產生新版整體市場總結；逐檔資料仍可正常查看。歷史回填完成後會自動出現。</div>';
  const b=s.breadth||{},t=s.theme_summary||{},c=s.catalyst_coverage||{},f=s.funding_summary||{};
  const change=b.stock_count_change==null?'—':`${b.stock_count_change>=0?'+':''}${num(b.stock_count_change)} 檔`;
  const themes=(t.theme_ranking||[]).slice(0,5);
  const watch=Array.isArray(s.next_day_watch)?s.next_day_watch:[];
  const badge=s.status==='final'?'完整總結':'初步總結';
  const semanticSource=s.source_lineage?.semantic_source;
  const semanticReady=s.status==='final'||(semanticSource==='news_theme_analysis'&&s.coverage?.news==='complete')||(semanticSource==='unified_analysis'&&s.coverage?.analysis==='complete');
  const catalystReady=semanticReady&&Number(c.unavailable||0)===0;
  const fundingReady=f.coverage_status&&f.coverage_status!=='missing';
  const funding=fundingReady?`${num(f.available_stock_count)}/${num(b.stock_count)} 檔可判讀`:'籌碼 facts 尚未完成';
  const themeHtml=semanticReady
    ? (themes.length?`<ol class="theme-list">${themes.map(x=>`<li><b>${esc(x.label)}</b> ${num(x.stock_count)} 檔 · ${pct(x.share_pct)} · ${esc(x.strength)}</li>`).join('')}</ol>`:'<div class="muted">已完成新版語意分析，但目前沒有形成足夠集中的 canonical 主流題材。</div>')
    : '<div class="muted"><b>新版題材結構化分析尚未完成。</b><br>尚無可用的 latest news-theme 或 Unified Analysis；因此此處不以 0 檔表示。</div>';
  const catalystHtml=catalystReady
    ? `<div class="detail">直接 ${num(c.direct)} · 交叉佐證 ${num(c.corroborated)} · 間接 ${num(c.circumstantial)} · 無明確證據 ${num(c.none)}</div><div class="detail">公開催化覆蓋：<b>${pct(c.public_catalyst_coverage_pct)}</b></div>`
    : '<div class="muted"><b>尚待最新版語意分析完成後統計。</b><br>目前缺的是結構化 evidence_strength，不代表今天公開催化為 0。</div>';
  const fundingHtml=fundingReady
    ? `<div class="detail">${esc(funding)}</div><div class="detail">法人偏多 ${num(f.institutional_support_count)} · 偏空 ${num(f.institutional_opposition_count)}</div><div class="detail">融資增加 ${num(f.margin_increase_count)} · 減少 ${num(f.margin_decrease_count)}</div>`
    : '<div class="muted"><b>籌碼 facts 尚未完成。</b><br>缺值不視為 0；待當日法人、融資、分點與 MI_INDEX 齊備後更新。</div>';
  const narrative=semanticReady?(s.market_summary||''):'目前僅完成市場廣度等 deterministic 摘要；題材與催化語意尚未完成。';
  return `<div class="market-summary-head"><div><div class="pane-label">今日強勢股總覽</div><div class="market-summary-title">${esc(s.headline||'市場總結')}</div></div><span class="summary-badge ${esc(s.status)}">${badge}</span></div>
    <div class="summary-metrics"><div class="summary-metric"><b>≥5% 強勢股</b><strong>${num(b.stock_count)} 檔</strong></div><div class="summary-metric"><b>≥9.5% 類漲停</b><strong>${num(b.gain_9_5_plus_count)} 檔</strong></div><div class="summary-metric"><b>較前交易日</b><strong>${change}</strong></div><div class="summary-metric"><b>市場結構</b><strong>${esc(REGIME_LABELS[s.market_context?.regime]||s.market_context?.regime||'—')}</strong></div></div>
    <div class="summary-grid"><div class="summary-block"><h3>主流題材</h3>${themeHtml}</div><div class="summary-block"><h3>催化可信度</h3>${catalystHtml}</div><div class="summary-block"><h3>籌碼結構</h3>${fundingHtml}</div></div>
    <div class="market-summary-text">${esc(narrative)}</div>${watch.length?`<div class="summary-block" style="margin-top:12px"><h3>下一交易日觀察</h3><ul class="watch-list">${watch.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}<div class="coverage-note">資料覆蓋：news ${esc(s.coverage?.news||'—')}、analysis ${esc(s.coverage?.analysis||'—')}、facts ${esc(s.coverage?.facts||'—')}、funding ${esc(s.coverage?.funding||'—')}；缺值不會以 0 或鄰日資料替代。</div>`;
}
function card(row,a,hasUnified){
  const change=Number(row.change_pct),pctText=Number.isFinite(change)?`${change>=0?'+':''}${change.toFixed(2)}%`:'—';
  const f=hasUnified?(a?.flow||{}):{},t=hasUnified?(a?.technical||{}):{},m=f.margin||{},b=f.broker||{};
  const evidence=Array.isArray(a?.evidence)?a.evidence.join('；'):'';
  const follow=Array.isArray(a?.follow_up)?a.follow_up.join('；'):'';
  const causeLabel=tagLabel('cause_type',a?.cause_type),evidenceLabel=tagLabel('evidence_strength',a?.evidence_strength),confidenceLabel=tagLabel('confidence',a?.confidence);
  return `<article class="stock-card card"><div class="stock-card-grid">
    <section class="stock-pane stock-pane-market"><div class="pane-label">股票與行情</div><div class="stock-heading"><div><div class="stock-code">${esc(row.code)}</div><div class="stock-name">${esc(row.name)}</div></div><div><div class="gain">${pctText}</div><div class="small">收盤 ${num(row.close)}</div></div></div><div class="metrics"><div class="metric"><b>前收</b>${num(row.previous_close)}</div><div class="metric"><b>開盤</b>${num(row.open)}</div><div class="metric"><b>最高</b>${num(row.high)}</div><div class="metric"><b>最低</b>${num(row.low)}</div></div><div class="detail">成交量：${num(row.volume)}</div></section>
    <section class="stock-pane stock-pane-reason"><div class="pane-label">上漲可能原因</div>${a?`<div class="reason">${esc(a.reason_summary)}</div><div><span class="pill">${esc(causeLabel)} / ${esc(evidenceLabel)} / ${esc(confidenceLabel)}</span></div>${evidence?`<div class="detail"><b>證據：</b>${esc(evidence)}</div>`:''}${follow?`<div class="detail"><b>後續：</b>${esc(follow)}</div>`:''}${sources(a.sources)}`:'<div class="muted">尚未產生最新版 news-theme 或 Unified Analysis。</div>'}</section>
    <section class="stock-pane stock-pane-flow"><div class="pane-label">籌碼與技術 facts</div>${hasUnified?`<div class="flow-grid"><div class="metric"><b>外資</b>${esc(actor(f.foreign))}</div><div class="metric"><b>投信</b>${esc(actor(f.investment_trust))}</div><div class="metric"><b>自營商</b>${esc(actor(f.dealer))}</div></div><div class="detail"><b>融資：</b>${m.margin_delta==null?'—':num(m.margin_delta)}；<b>融券：</b>${m.short_delta==null?'—':num(m.short_delta)}</div><div class="detail"><b>分點集中：</b>Top3 買 ${num(b.top3_buy_share_pct)}% / Top3 賣 ${num(b.top3_sell_share_pct)}%</div><div class="detail"><b>技術：</b>SMA5 ${num(t.sma5)}、SMA20 ${num(t.sma20)}、SMA60 ${num(t.sma60)}；量比前日 ${num(t.volume_ratio_vs_previous)}x</div>`:'<div class="muted">Stage 1 已有新聞題材分析；籌碼與技術 facts 待 Unified Analysis 完成後補上。</div>'}</section>
  </div></article>`;
}
async function load(date){
  content.innerHTML='<div class="card empty">載入中…</div>';
  marketSummary.innerHTML='<div class="muted">載入整體市場總結…</div>';
  const [raw,analysis,news,market]=await Promise.all([json(`${ROOT}/${date}.json`),json(`${ANALYSIS}/${date}.json`,true),json(`${NEWS_ANALYSIS}/${date}.json`,true),json(`${MARKET_SUMMARY}/${date}.json`,true)]);
  const rows=raw.stocks||[],finalMap=new Map((analysis?.analyses||[]).map(x=>[String(x.code),x])),newsMap=new Map((news?.analyses||[]).map(x=>[String(x.code),x]));
  meta.textContent=`比較 ${fmtDate(raw.previous_date)} → ${fmtDate(raw.target_date)}；門檻 ≥ ${raw.threshold_pct}%`;
  summary.textContent=`符合 ${rows.length} 檔`;
  marketSummary.innerHTML=marketSummaryHtml(market);
  status.innerHTML=analysis?`<b>正式分析：</b>${esc(analysis.methodology_version)}；模式 ${esc(analysis.generation_mode)}；${analysis.stock_count}/${rows.length} 檔。`:news?`<b>初步新聞題材分析：</b>${esc(news.methodology_version)}；${news.stock_count}/${rows.length} 檔。Unified Analysis 與籌碼 facts 尚待後續階段。`:'<b>分析狀態：</b>尚未產生最新版 news-theme 或 Unified Analysis。';
  content.innerHTML=rows.length?rows.map(r=>{const code=String(r.code),final=finalMap.get(code),stage1=newsMap.get(code);return card(r,final||stage1,Boolean(final))}).join(''):'<div class="card empty">本日沒有符合股票。</div>';
}
async function init(){try{const idx=await json(`${ROOT}/files.json`),files=idx.files||[];if(!files.length)throw new Error('目前沒有可用資料');dateSelect.innerHTML=files.map(f=>{const d=f.replace('.json','');return `<option value="${d}">${fmtDate(d)}</option>`}).join('');dateSelect.onchange=()=>load(dateSelect.value);await load(dateSelect.value)}catch(e){content.innerHTML=`<div class="card error">載入失敗：${esc(e.message)}</div>`}}
init();
</script>
</body>
</html>
