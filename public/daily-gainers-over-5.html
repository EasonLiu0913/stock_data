<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日漲幅 5% 以上股票</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 8px 24px rgba(15,23,42,.06); }
    header { padding: 20px; margin-bottom: 16px; }
    h1 { margin: 0 0 8px; font-size: 1.55rem; }
    .desc, .meta { color: #64748b; line-height: 1.6; }
    .toolbar { display: flex; gap: 12px; align-items: end; padding: 16px 20px; margin-bottom: 16px; }
    label { display: block; font-weight: 700; margin-bottom: 6px; }
    select { min-width: 180px; padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
    .summary { margin-left: auto; font-weight: 800; }
    .analysis-meta { padding: 14px 20px; margin-bottom: 16px; color: #475569; line-height: 1.6; }
    .analysis-meta strong { color: #0f172a; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 980px; }
    th, td { padding: 11px 14px; border-bottom: 1px solid #e2e8f0; text-align: right; white-space: nowrap; vertical-align: top; }
    th { background: #f8fafc; color: #475569; font-size: .9rem; }
    th:first-child, td:first-child, th:nth-child(2), td:nth-child(2), th:last-child, td:last-child { text-align: left; }
    .gain { font-weight: 900; color: #dc2626; }
    .reason { min-width: 320px; max-width: 520px; white-space: normal; line-height: 1.55; }
    .reason-title { font-weight: 800; margin-bottom: 6px; color: #0f172a; }
    .reason-detail { color: #475569; font-size: .92rem; }
    .reason-detail + .reason-detail { margin-top: 5px; }
    .sources { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 10px; }
    .sources a { color: #2563eb; text-decoration: none; font-size: .88rem; }
    .sources a:hover { text-decoration: underline; }
    .confidence { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: .78rem; font-weight: 800; }
    .confidence-high { background: #dcfce7; color: #166534; }
    .confidence-medium { background: #fef3c7; color: #92400e; }
    .confidence-low { background: #f1f5f9; color: #475569; }
    .pending { color: #64748b; font-style: italic; }
    .empty, .error { padding: 32px 20px; text-align: center; color: #64748b; }
    .error { color: #b91c1c; }
    @media (max-width: 640px) {
      .wrap { padding: 12px 8px 32px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .summary { margin-left: 0; }
      .analysis-meta { padding: 12px 14px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="card">
      <h1>每日漲幅 5% 以上股票</h1>
      <div class="desc">以 SMA 每日收盤資料計算：當日收盤價相對前一個交易日收盤價漲幅 ≥ 5%。下午 3 點後會另外載入 ChatGPT 研究的上漲可能原因。</div>
      <div class="meta" id="meta">載入資料中…</div>
    </header>

    <section class="toolbar card">
      <div>
        <label for="dateSelect">交易日</label>
        <select id="dateSelect"></select>
      </div>
      <div class="summary" id="summary"></div>
    </section>

    <section class="analysis-meta card" id="analysisMeta">
      <strong>上漲原因研究：</strong>載入中…
    </section>

    <section class="card table-wrap" id="content">
      <div class="empty">載入資料中…</div>
    </section>
  </main>

  <script>
    const DATA_ROOT = '../data_daily_gain_over_5';
    const ANALYSIS_ROOT = '../data_daily_gain_over_5/analysis';
    const dateSelect = document.getElementById('dateSelect');
    const content = document.getElementById('content');
    const meta = document.getElementById('meta');
    const summary = document.getElementById('summary');
    const analysisMeta = document.getElementById('analysisMeta');

    const formatNumber = (value) => value == null ? '—' : Number(value).toLocaleString('zh-TW');
    const formatPrice = (value) => value == null ? '—' : Number(value).toLocaleString('zh-TW', { maximumFractionDigits: 2 });
    const formatDate = (value) => value && value.length === 8 ? `${value.slice(0,4)}-${value.slice(4,6)}-${value.slice(6,8)}` : value;
    const formatDateTime = (value) => {
      if (!value) return '—';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('zh-TW', { hour12: false });
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function safeUrl(value) {
      try {
        const url = new URL(String(value || ''));
        return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
      } catch (_error) {
        return '';
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.json();
    }

    async function fetchAnalysis(date) {
      try {
        return await fetchJson(`${ANALYSIS_ROOT}/${date}.json`);
      } catch (error) {
        if (String(error.message).startsWith('404 ')) return null;
        throw error;
      }
    }

    function confidenceLabel(value) {
      const key = String(value || '').toLowerCase();
      if (key === 'high') return ['高', 'confidence-high'];
      if (key === 'medium') return ['中', 'confidence-medium'];
      return ['低', 'confidence-low'];
    }

    function renderSources(sources) {
      if (!Array.isArray(sources) || !sources.length) return '';
      const links = sources.map((source, index) => {
        const url = safeUrl(source?.url);
        if (!url) return '';
        const title = escapeHtml(source?.title || `來源 ${index + 1}`);
        return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${title}</a>`;
      }).filter(Boolean);
      return links.length ? `<div class="sources">${links.join('')}</div>` : '';
    }

    function renderReason(analysis) {
      if (!analysis) return '<span class="pending">分析尚未產生</span>';
      const [confidenceText, confidenceClass] = confidenceLabel(analysis.confidence);
      const evidence = Array.isArray(analysis.evidence)
        ? analysis.evidence.filter(Boolean).join('；')
        : String(analysis.evidence || '');
      return `
        <div class="reason-title">${escapeHtml(analysis.reason_summary || '未找到明確公開催化劑')}</div>
        <div class="reason-detail"><span class="confidence ${confidenceClass}">可信度 ${confidenceText}</span></div>
        ${evidence ? `<div class="reason-detail"><strong>證據：</strong>${escapeHtml(evidence)}</div>` : ''}
        ${analysis.follow_up ? `<div class="reason-detail"><strong>後續觀察：</strong>${escapeHtml(analysis.follow_up)}</div>` : ''}
        ${renderSources(analysis.sources)}`;
    }

    function render(payload, analysisPayload) {
      const rows = Array.isArray(payload.stocks) ? payload.stocks : [];
      const analyses = Array.isArray(analysisPayload?.analyses) ? analysisPayload.analyses : [];
      const analysisByCode = new Map(analyses.map(item => [String(item.code || ''), item]));

      meta.textContent = `比較 ${formatDate(payload.previous_date)} → ${formatDate(payload.target_date)}；門檻 ≥ ${payload.threshold_pct}%`;
      summary.textContent = `符合 ${rows.length} 檔`;
      analysisMeta.innerHTML = analysisPayload
        ? `<strong>上漲原因研究：</strong>已完成 ${analysisByCode.size}/${rows.length} 檔；更新時間 ${escapeHtml(formatDateTime(analysisPayload.generated_at))}`
        : '<strong>上漲原因研究：</strong>尚未產生；平日下午 3:00 排程完成後會自動顯示。';

      if (!rows.length) {
        content.innerHTML = '<div class="empty">這個交易日沒有漲幅達 5% 的股票。</div>';
        return;
      }

      content.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>代號</th>
              <th>名稱</th>
              <th>前收</th>
              <th>收盤</th>
              <th>單日漲幅</th>
              <th>開盤</th>
              <th>最高</th>
              <th>最低</th>
              <th>成交量</th>
              <th>上漲可能原因</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                <td>${escapeHtml(row.code)}</td>
                <td>${escapeHtml(row.name || '')}</td>
                <td>${formatPrice(row.previous_close)}</td>
                <td>${formatPrice(row.close)}</td>
                <td class="gain">+${Number(row.change_pct).toFixed(2)}%</td>
                <td>${formatPrice(row.open)}</td>
                <td>${formatPrice(row.high)}</td>
                <td>${formatPrice(row.low)}</td>
                <td>${formatNumber(row.volume)}</td>
                <td class="reason">${renderReason(analysisByCode.get(String(row.code)))}</td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    async function loadDate(date) {
      content.innerHTML = '<div class="empty">載入資料中…</div>';
      summary.textContent = '';
      analysisMeta.innerHTML = '<strong>上漲原因研究：</strong>載入中…';
      try {
        const [payload, analysisPayload] = await Promise.all([
          fetchJson(`${DATA_ROOT}/${date}.json`),
          fetchAnalysis(date),
        ]);
        render(payload, analysisPayload);
      } catch (error) {
        analysisMeta.innerHTML = '<strong>上漲原因研究：</strong>載入失敗';
        content.innerHTML = `<div class="error">無法載入 ${formatDate(date)}：${escapeHtml(error.message)}</div>`;
      }
    }

    async function init() {
      try {
        const index = await fetchJson(`${DATA_ROOT}/files.json`);
        const files = Array.isArray(index.files) ? index.files : [];
        if (!files.length) throw new Error('目前沒有可用資料');
        dateSelect.innerHTML = files.map(file => {
          const date = file.replace('.json', '');
          return `<option value="${date}">${formatDate(date)}</option>`;
        }).join('');
        dateSelect.addEventListener('change', () => loadDate(dateSelect.value));
        await loadDate(dateSelect.value);
      } catch (error) {
        meta.textContent = '尚無每日清單資料';
        analysisMeta.innerHTML = '<strong>上漲原因研究：</strong>無法取得交易日';
        content.innerHTML = `<div class="error">無法載入資料清單：${escapeHtml(error.message)}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
