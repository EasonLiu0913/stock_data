<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>每日漲幅 5% 以上股票</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#0f172a}.wrap{max-width:1500px;margin:auto;padding:20px 14px 48px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 8px 24px rgba(15,23,42,.05)}header,.toolbar{padding:18px;margin-bottom:14px}h1{margin:0 0 8px;font-size:1.5rem}.muted{color:#64748b;line-height:1.55}.toolbar{display:flex;gap:12px;align-items:end}.toolbar .summary{margin-left:auto;font-weight:800}label{display:block;font-weight:800;margin-bottom:6px}select{min-width:190px;padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.status{padding:12px 16px;margin-bottom:14px;color:#475569}.stock-list{display:grid;gap:14px}.stock-grid{display:grid;grid-template-columns:minmax(220px,.75fr) minmax(320px,1.2fr) minmax(360px,1.35fr)}.pane{padding:17px;min-width:0}.pane+.pane{border-left:1px solid #e2e8f0}.label{font-size:.76rem;font-weight:900;color:#64748b;letter-spacing:.05em;margin-bottom:10px}.head{display:flex;justify-content:space-between;gap:10px}.name{font-size:1.2rem;font-weight:900}.code{font-size:.86rem;color:#64748b;font-weight:800}.gain{font-size:1.25rem;font-weight:950;color:#dc2626;text-align:right}.small{font-size:.84rem;color:#64748b}.metrics,.flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px}.flow{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{background:#f8fafc;border-radius:8px;padding:8px}.metric b{display:block;font-size:.74rem;color:#64748b;margin-bottom:3px}.reason{font-weight:850;line-height:1.55;margin-bottom:7px}.detail{font-size:.9rem;color:#475569;line-height:1.58;margin-top:6px;overflow-wrap:anywhere}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#f1f5f9;font-size:.75rem;font-weight:850}.sources{display:flex;flex-wrap:wrap;gap:7px 10px;margin-top:9px}.sources a{font-size:.84rem;color:#2563eb;text-decoration:none}.empty,.error{padding:28px;text-align:center;color:#64748b}.error{color:#b91c1c}
@media(max-width:1050px){.stock-grid{grid-template-columns:1fr 1fr}.pane-flow{grid-column:1/-1;border-left:0!important;border-top:1px solid #e2e8f0}}@media(max-width:720px){.wrap{padding:10px 8px 30px}.toolbar{position:sticky;top:0;z-index:5;display:block}.toolbar .summary{margin:10px 0 0}select{width:100%;min-width:0;min-height:42px}.stock-grid{display:block}.pane+.pane{border-left:0;border-top:1px solid #e2e8f0}.flow{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body><main class="wrap">
<header class="card"><h1>每日漲幅 5% 以上股票</h1><div class="muted">正式頁面只讀最新版 unified analysis contract；歷史日期若尚未完成新版 AI，會明確標示 deterministic fallback，不混用舊 schema。</div><div id="meta" class="muted">載入中…</div></header>
<section class="toolbar card"><div><label for="dateSelect">交易日</label><select id="dateSelect"></select></div><div id="summary" class="summary"></div></section>
<section id="status" class="status card">載入分析狀態…</section><section id="content" class="stock-list"><div class="card empty">載入中…</div></section>
</main><script>
const ROOT='../data_daily_gain_over_5', ANALYSIS=`${ROOT}/analysis`;
const $=id=>document.getElementById(id), dateSelect=$('dateSelect'),content=$('content'),meta=$('meta'),summary=$('summary'),status=$('status');
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const num=v=>v==null||!Number.isFinite(Number(v))?'—':Number(v).toLocaleString('zh-TW',{maximumFractionDigits:2});
const fmtDate=v=>v?.length===8?`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`:v||'—';
async function json(url,optional=false){const r=await fetch(url,{cache:'no-store'});if(optional&&r.status===404)return null;if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return r.json()}
function actor(v){if(!v)return '—';if(v.record_status==='unavailable')return '資料未就緒';if(v.record_status==='no_record')return '官方無該股紀錄';if(v.net_lots==null)return v.record_status||'—';return `${Number(v.net_lots).toLocaleString('zh-TW')} 張`}
function sources(list){if(!Array.isArray(list)||!list.length)return'';return `<div class="sources">${list.map((s,i)=>{try{const u=new URL(s.url);if(!['http:','https:'].includes(u.protocol))return'';return `<a href="${esc(u.href)}" target="_blank" rel="noopener">${esc(s.title||`來源 ${i+1}`)}</a>`}catch{return''}}).join('')}</div>`}
function card(row,a){const change=Number(row.change_pct), pct=Number.isFinite(change)?`${change>=0?'+':''}${change.toFixed(2)}%`:'—';const f=a?.flow||{},t=a?.technical||{},m=f.margin||{},b=f.broker||{};const evidence=Array.isArray(a?.evidence)?a.evidence.join('；'):'';const follow=Array.isArray(a?.follow_up)?a.follow_up.join('；'):'';return `<article class="card"><div class="stock-grid">
<section class="pane"><div class="label">股票與行情</div><div class="head"><div><div class="code">${esc(row.code)}</div><div class="name">${esc(row.name)}</div></div><div><div class="gain">${pct}</div><div class="small">收盤 ${num(row.close)}</div></div></div><div class="metrics"><div class="metric"><b>前收</b>${num(row.previous_close)}</div><div class="metric"><b>開盤</b>${num(row.open)}</div><div class="metric"><b>最高</b>${num(row.high)}</div><div class="metric"><b>最低</b>${num(row.low)}</div></div><div class="detail">成交量：${num(row.volume)}</div></section>
<section class="pane"><div class="label">上漲可能原因</div>${a?`<div class="reason">${esc(a.reason_summary)}</div><div><span class="pill">${esc(a.cause_type)} / ${esc(a.evidence_strength)} / ${esc(a.confidence)}</span></div>${evidence?`<div class="detail"><b>證據：</b>${esc(evidence)}</div>`:''}${follow?`<div class="detail"><b>後續：</b>${esc(follow)}</div>`:''}${sources(a.sources)}`:'<div class="muted">尚未產生最新版 unified analysis。</div>'}</section>
<section class="pane pane-flow"><div class="label">籌碼與技術 facts</div>${a?`<div class="flow"><div class="metric"><b>外資</b>${esc(actor(f.foreign))}</div><div class="metric"><b>投信</b>${esc(actor(f.investment_trust))}</div><div class="metric"><b>自營商</b>${esc(actor(f.dealer))}</div></div><div class="detail"><b>融資：</b>${m.margin_delta==null?'—':num(m.margin_delta)}；<b>融券：</b>${m.short_delta==null?'—':num(m.short_delta)}</div><div class="detail"><b>分點集中：</b>Top3 買 ${num(b.top3_buy_share_pct)}% / Top3 賣 ${num(b.top3_sell_share_pct)}%</div><div class="detail"><b>技術：</b>SMA5 ${num(t.sma5)}、SMA20 ${num(t.sma20)}、SMA60 ${num(t.sma60)}；量比前日 ${num(t.volume_ratio_vs_previous)}x</div>`:'<div class="muted">尚無最新版 facts。</div>'}</section>
</div></article>`}
async function load(date){content.innerHTML='<div class="card empty">載入中…</div>';const [raw,analysis]=await Promise.all([json(`${ROOT}/${date}.json`),json(`${ANALYSIS}/${date}.json`,true)]);const rows=raw.stocks||[],map=new Map((analysis?.analyses||[]).map(x=>[String(x.code),x]));meta.textContent=`比較 ${fmtDate(raw.previous_date)} → ${fmtDate(raw.target_date)}；門檻 ≥ ${raw.threshold_pct}%`;summary.textContent=`符合 ${rows.length} 檔`;status.innerHTML=analysis?`<b>正式分析：</b>${esc(analysis.methodology_version)}；模式 ${esc(analysis.generation_mode)}；${analysis.stock_count}/${rows.length} 檔。`:'<b>正式分析：</b>尚未回填至最新版 contract。';content.innerHTML=rows.length?rows.map(r=>card(r,map.get(String(r.code)))).join(''):'<div class="card empty">本日沒有符合股票。</div>'}
async function init(){try{const idx=await json(`${ROOT}/files.json`),files=idx.files||[];if(!files.length)throw new Error('目前沒有可用資料');dateSelect.innerHTML=files.map(f=>{const d=f.replace('.json','');return `<option value="${d}">${fmtDate(d)}</option>`}).join('');dateSelect.onchange=()=>load(dateSelect.value);await load(dateSelect.value)}catch(e){content.innerHTML=`<div class="card error">載入失敗：${esc(e.message)}</div>`}}init();
</script></body></html>
