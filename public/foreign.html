<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法人連續買賣超股票</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:2rem}.container{max-width:2400px;margin:0 auto}.header,.sort-container,.table-container,.stat-card{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,.1)}.header{padding:2rem;border-radius:20px;margin-bottom:2rem}h1{margin:0 0 .5rem;color:#2d3748;font-size:2.5rem;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.subtitle{color:#667eea;font-weight:600;margin:.5rem 0 0}.data-status{display:inline-block;margin-top:.75rem;padding:.55rem .8rem;border-radius:10px;font-weight:700;font-size:.95rem}.data-status.updating{background:#fff7ed;color:#c05621}.data-status.ready{background:#f0fff4;color:#2f855a}.data-status.legacy{background:#edf2f7;color:#4a5568}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}.stat-card{padding:1.5rem;border-radius:15px;text-align:center}.stat-value{font-size:2.5rem;font-weight:bold;color:#667eea}.stat-label{color:#718096;font-size:.9rem}.sort-container{padding:1.5rem;border-radius:15px;margin-bottom:2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}.control{display:flex;align-items:center;gap:.5rem}.control label{color:#2d3748;font-weight:600}.control select,.search-container input{padding:.75rem 1rem;border:2px solid #e2e8f0;border-radius:10px;background:white;color:#2d3748;font-size:1rem;outline:none}.search-container{margin-left:auto;display:flex;gap:.5rem}.search-container input{width:200px}.search-container button{padding:.75rem 1.2rem;background:#667eea;color:white;border:0;border-radius:10px;cursor:pointer}.table-container{border-radius:20px;max-height:75vh;overflow:auto;position:relative}table{width:100%;border-collapse:collapse;min-width:900px;--summary-total-width:118px;--summary-average-width:108px}th{padding:1rem;text-align:left;color:white;background:#667eea;position:sticky;top:0;z-index:10;white-space:nowrap}td{padding:.85rem 1rem;color:#2d3748;border-bottom:1px solid #e2e8f0;white-space:nowrap}.serial-col{text-align:center;width:60px;color:#a0aec0}.stock-code{font-weight:600;color:#667eea}.stock-code a{color:#667eea;text-decoration:none}.positive{color:#e53e3e;font-weight:600}.negative{color:#38a169;font-weight:600}.neutral{color:#2d3748;font-weight:600}.daily-cell{font-weight:600;line-height:1.25}.daily-price{font-size:.78rem;color:#718096;font-weight:500;margin-top:.2rem}.daily-price.up{color:#e53e3e}.daily-price.down{color:#38a169}.summary-separator{border-left:2px solid #cbd5e0}.sticky-summary{position:sticky;background:#fff;z-index:6}.summary-total{right:var(--summary-average-width);min-width:var(--summary-total-width)}.summary-average{right:0;min-width:var(--summary-average-width)}th.sticky-summary{background:#667eea;z-index:16}.loading{text-align:center;padding:3rem;color:white;font-size:1.2rem}.error{background:#fed7d7;color:#742a2a;padding:1rem;border-radius:10px}.highlight-row{background:#fffaf0!important;outline:2px solid #ed8936}
@media(max-width:768px){body{padding:1rem .5rem}.header{padding:1.5rem}h1{font-size:1.5rem}.stats{grid-template-columns:1fr 1fr}.sort-container{flex-direction:column;align-items:stretch;padding:1rem}.control{justify-content:space-between}.control select{flex:1}.search-container{margin-left:0}.search-container input{width:100%}.sticky-summary{position:static}.summary-total,.summary-average{right:auto}th.sticky-summary{position:sticky;top:0}}
@media(max-width:480px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>🎯 法人連續買賣超股票</h1><p class="subtitle" id="dataDate"></p><div class="data-status legacy" id="dataStatus">資料狀態：讀取中…</div></div>
  <div class="stats" id="stats">
    <div class="stat-card"><div class="stat-value" id="totalStocks">-</div><div class="stat-label">符合條件股票數</div></div>
    <div class="stat-card"><div class="stat-value" id="totalBuy">-</div><div class="stat-label">累計買賣超</div></div>
    <div class="stat-card"><div class="stat-value" id="avgBuy">-</div><div class="stat-label">平均買賣超</div></div>
  </div>
  <div class="sort-container">
    <div class="control"><label for="typeSelect">類型：</label><select id="typeSelect" onchange="onTypeChanged()"><option value="foreign-buy">外資買超</option><option value="foreign-sell">外資賣超</option><option value="investment-trust-buy">投信買超</option><option value="investment-trust-sell">投信賣超</option><option value="dealers-buy">自營商買超</option><option value="dealers-sell">自營商賣超</option></select></div>
    <div class="control"><label for="dateSelect">日期：</label><select id="dateSelect" onchange="onDateChanged()"></select></div>
    <div class="control"><label for="sortSelect">排序：</label><select id="sortSelect" onchange="onSortChanged()"><option value="consecutive">連續最多天買超排行</option><option value="total">4日累計（從多到少）</option><option value="growth">第1天→第2天成長率（從大到小）</option><option value="three-days">四天中有三天在買（4日累計從大到小）</option></select></div>
    <div class="control"><label for="summaryMetricSelect">統計欄位：</label><select id="summaryMetricSelect" onchange="onSummaryMetricChanged()"><option value="value">累積值</option><option value="shares">累積張數</option></select></div>
    <div class="search-container"><input id="searchInput" placeholder="搜尋代號或名稱..." onkeyup="if(event.key==='Enter')searchStock()"><button onclick="searchStock()">🔍</button></div>
  </div>
  <div class="table-container"><div id="loading" class="loading">載入中...</div><div id="error" style="display:none"></div><table id="stockTable" style="display:none"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
</div>
<script>
let allFilteredStocks=[];let displayedStocks=[];let currentDataDateStr='';let currentType='foreign-buy';let currentSummaryMetric='value';let headerSort={key:null,direction:'desc'};let pendingDefaultHeaderSortKey=null;
const INSTITUTION_TYPES={foreign:{field:'ForeignInvestors',label:'外資'},'investment-trust':{field:'InvestmentTrust',label:'投信'},dealers:{field:'Dealers',label:'自營商'}};
function getTypeConfig(type=currentType){const parts=String(type||'').split('-');const direction=parts.pop();const institutionKey=parts.join('-')||'foreign';const institution=INSTITUTION_TYPES[institutionKey]||INSTITUTION_TYPES.foreign;return{institutionKey,field:institution.field,institutionLabel:institution.label,direction:direction==='sell'?'sell':'buy'}}
function normalizeTypeParam(type){if(type==='buy'||type==='sell')return`foreign-${type}`;const valid=Object.keys(INSTITUTION_TYPES).flatMap(k=>[`${k}-buy`,`${k}-sell`]);return valid.includes(type)?type:'foreign-buy'}
function getUrlParams(){const p=new URLSearchParams(location.search);return{sort:p.get('sort'),date:p.get('date'),type:p.get('type'),summary:p.get('summary')}}
function updateUrlParams(sort,date,type,summary){const p=new URLSearchParams(location.search);if(sort)p.set('sort',sort);if(date)p.set('date',date);if(type)p.set('type',type);if(summary)p.set('summary',summary);history.replaceState({},'',`${location.pathname}?${p}`)}
function isTargetValue(v){return getTypeConfig().direction==='sell'?Number(v)<0:Number(v)>0}function getComparableValue(v){return getTypeConfig().direction==='sell'?Math.abs(Number(v)||0):Number(v)||0}function getTypeLabel(){return getTypeConfig().direction==='sell'?'賣超':'買超'}function getInstitutionLabel(){return getTypeConfig().institutionLabel}
function updateTypeLabels(){const label=getTypeLabel(),inst=getInstitutionLabel();document.title=`${inst}連續${label}股票`;document.querySelector('h1').textContent=`🎯 ${inst}連續${label}股票`;document.querySelector('#sortSelect option[value="consecutive"]').textContent=`連續最多天${label}排行`;document.querySelector('#sortSelect option[value="total"]').textContent=`4日累計${label}（從多到少）`;document.querySelector('#sortSelect option[value="three-days"]').textContent=`四天中有三天在${label}（4日累計從大到小）`}
function formatPrice(v){return v||'-'}function adDateKey(s){return`${s.slice(0,4)}/${s.slice(4,6)}/${s.slice(6,8)}`}function rocToAd(s){const a=String(s||'').split('/');if(a.length!==3)return'';return`${Number(a[0])+1911}${a[1].padStart(2,'0')}${a[2].padStart(2,'0')}`}
async function loadSmaData(base,date){try{const r=await fetch(`${base}/data_fubon/fubon_${date}_sma.json`);return r.ok?await r.json():{}}catch{return{}}}
async function loadSmaMap(base,date){const d=await loadSmaData(base,date),k=adDateKey(date),m={};Object.entries(d).forEach(([code,v])=>m[code]=v?.[k]||{});return m}
async function loadDailyPriceMap(base,dates){const unique=[...new Set(dates.map(rocToAd).filter(Boolean))];const items=await Promise.all(unique.map(async date=>{const d=await loadSmaData(base,date),k=adDateKey(date),m={};Object.entries(d).forEach(([code,v])=>m[code]=v?.[k]?.Price||'');return[date,m]}));return Object.fromEntries(items)}
async function loadInstitutionalStatus(base,date){try{const r=await fetch(`${base}/data_fubon/fubon_${date}_institutional_status.json`,{cache:'no-store'});return r.ok?await r.json():null}catch{return null}}
function renderInstitutionalStatus(status){const el=document.getElementById('dataStatus');el.className='data-status';if(!status){el.classList.add('legacy');el.textContent='資料狀態：歷史資料（無完整度紀錄）';el.removeAttribute('title');return}const valid=Number(status.valid_count)||0,total=Number(status.universe_count)||0,rate=total?valid/total*100:Number(status.completion_rate)||0;if(status.status==='ready'){el.classList.add('ready');el.textContent=`資料狀態：已完成 ${valid} / ${total}（${rate.toFixed(1)}%）`}else{el.classList.add('updating');el.textContent=`資料狀態：更新中 ${valid} / ${total}（${rate.toFixed(1)}%）`}const reasons=status.reason_counts||{};const detail=Object.entries(reasons).filter(([,count])=>Number(count)>0).map(([reason,count])=>`${reason}: ${count}`).join('、');el.title=detail||`狀態：${status.status}`}
function getSmaRangeLabel(s){const p=parseFloat(s?.Price);if(Number.isNaN(p))return'-';const a=['SMA5','SMA20','SMA60','SMA240'].map(k=>({k,v:parseFloat(s?.[k])})).filter(x=>!Number.isNaN(x.v));if(!a.length)return'-';if(p>=a[0].v)return`> ${a[0].k}`;for(let i=1;i<a.length;i++)if(p>=a[i].v)return`${a[i-1].k} ~ ${a[i].k}`;return`< ${a[a.length-1].k}`}
function priceChange(price,prev){const c=parseFloat(price),p=parseFloat(prev);if(Number.isNaN(c)||Number.isNaN(p)||p===0)return{label:'',cls:''};const x=(c-p)/p*100;return x>0?{label:`(+${x.toFixed(2)}%)`,cls:'up'}:x<0?{label:`(${x.toFixed(2)}%)`,cls:'down'}:{label:'(0.00%)',cls:''}}
function renderDailyCell(v,p,prev){const c=priceChange(p,prev);return`<div class="daily-cell"><div>${(Number(v)||0).toLocaleString()}</div><div class="daily-price ${c.cls}">${formatPrice(p)}${c.label}</div></div>`}
function getTradeValueStats(stock,days){let total=0;for(let i=0;i<days;i++){const p=parseFloat(stock.dailyPrices?.[i]);if(!Number.isNaN(p))total+=p*(Number(stock.values?.[i])||0)}return{total:Math.round(total),average:Math.round(total/days)}}
async function loadFileList(){const base=location.hostname.includes('github.io')?'/stock_data':'..';const r=await fetch(`${base}/data_fubon/files.json`,{cache:'no-store'});if(!r.ok)throw new Error('無法載入檔案列表');const files=await r.json();const dates=[...new Set(files.map(f=>{const m=String(f).match(/^fubon_(\d{8})_institutional(?:_status)?\.json$/);return m?.[1]}).filter(Boolean))].sort().reverse();const sel=document.getElementById('dateSelect');sel.innerHTML='';dates.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=`${d.slice(0,4)}/${d.slice(4,6)}/${d.slice(6,8)}`;sel.appendChild(o)})}
async function loadData(date){if(!date)return;const loading=document.getElementById('loading'),table=document.getElementById('stockTable'),err=document.getElementById('error');loading.style.display='block';table.style.display='none';err.style.display='none';try{const base=location.hostname.includes('github.io')?'/stock_data':'..';const status=await loadInstitutionalStatus(base,date);renderInstitutionalStatus(status);const r=await fetch(`${base}/data_fubon/fubon_${date}_institutional.json`,{cache:'no-store'});let data={};if(r.ok)data=await r.json();else if(!status)throw new Error('無法載入法人資料');const sma=await loadSmaMap(base,date);const field=getTypeConfig().field;const allDates=Object.values(data).flatMap(x=>{const v=x[field];return v&&!Array.isArray(v)&&typeof v==='object'?Object.keys(v):[]});const latest=[...new Set(allDates)].sort().reverse().slice(0,11);const priceMap=await loadDailyPriceMap(base,latest);allFilteredStocks=[];for(const[code,row]of Object.entries(data)){let values=row[field],dates=[];if(values&&!Array.isArray(values)&&typeof values==='object'){dates=Object.keys(values).sort().reverse();values=dates.map(d=>values[d])}if(!values||values.length<4)continue;values=values.map(v=>Number(v)||0);const first=values.slice(0,4),total=first.reduce((s,v)=>s+v,0),average=Math.round(total/4);let consecutiveDays=0;for(const v of values){if(isTargetValue(v))consecutiveDays++;else break}const sm=sma[code]||{};allFilteredStocks.push({code,name:row.StockName||'',day1:first[0],day2:first[1],day3:first[2],day4:first[3],total,average,growthRate:first[1]!==0?((getComparableValue(first[0])-getComparableValue(first[1]))/Math.abs(getComparableValue(first[1]))*100):0,consecutiveDays,price:sm.Price||'',smaRange:getSmaRangeLabel(sm),values,dates,dailyPrices:dates.map(d=>priceMap[rocToAd(d)]?.[code]||'')})}currentDataDateStr=date;document.getElementById('dataDate').textContent=`資料日期：${date.slice(0,4)}/${date.slice(4,6)}/${date.slice(6,8)}`;updateUrlParams(null,date,currentType,currentSummaryMetric);sortStocks();loading.style.display='none';table.style.display='table'}catch(e){loading.style.display='none';err.style.display='block';err.className='error';err.textContent=`載入資料時發生錯誤: ${e.message}`}}
function consecutiveTieTotal(stock){return stock.values.slice(0,stock.consecutiveDays).reduce((s,v)=>s+v,0)}
function sortStocks(){const sortBy=document.getElementById('sortSelect').value;updateUrlParams(sortBy,currentDataDateStr,currentType,currentSummaryMetric);let s=[];if(sortBy==='total'){s=allFilteredStocks.filter(x=>[x.day1,x.day2,x.day3,x.day4].every(isTargetValue)).sort((a,b)=>getComparableValue(b.total)-getComparableValue(a.total))}else if(sortBy==='growth'){s=allFilteredStocks.filter(x=>[x.day1,x.day2,x.day3,x.day4].every(isTargetValue)).sort((a,b)=>b.growthRate-a.growthRate)}else if(sortBy==='three-days'){s=allFilteredStocks.filter(x=>[x.day1,x.day2,x.day3,x.day4].filter(isTargetValue).length>=3).sort((a,b)=>getComparableValue(b.total)-getComparableValue(a.total))}else{s=[...allFilteredStocks].sort((a,b)=>b.consecutiveDays-a.consecutiveDays||getComparableValue(consecutiveTieTotal(b))-getComparableValue(consecutiveTieTotal(a)))}const key=pendingDefaultHeaderSortKey;pendingDefaultHeaderSortKey=null;headerSort=key?{key,direction:'desc'}:{key:null,direction:'desc'};if(key)s.sort((a,b)=>getSortValue(b,key)-getSortValue(a,key));displayedStocks=s;renderTable(s,sortBy);updateStats(s,sortBy)}
function getSortValue(s,key){if(key==='code')return parseInt(s.code)||0;if(key==='name')return s.name||'';if(key==='consecutiveDays')return s.consecutiveDays;if(key==='price')return parseFloat(s.price)||0;if(key==='total')return getComparableValue(s.total);if(key==='average')return getComparableValue(s.average);if(key==='valueTotal')return getComparableValue(getTradeValueStats(s,4).total);if(key==='valueAverage')return getComparableValue(getTradeValueStats(s,4).average);if(key==='total10')return getComparableValue(s.values.slice(0,10).reduce((a,b)=>a+b,0));if(key==='avg10')return getComparableValue(Math.round(s.values.slice(0,10).reduce((a,b)=>a+b,0)/10));if(key==='valueTotal10')return getComparableValue(getTradeValueStats(s,10).total);if(key==='valueAvg10')return getComparableValue(getTradeValueStats(s,10).average);if(key.startsWith('day'))return getComparableValue(s.values[Number(key.slice(3))]||0);return 0}
function sortByHeader(key){headerSort=headerSort.key===key?{key,direction:headerSort.direction==='desc'?'asc':'desc'}:{key,direction:'desc'};const dir=headerSort.direction;displayedStocks=[...displayedStocks].sort((a,b)=>{const va=getSortValue(a,key),vb=getSortValue(b,key);if(typeof va==='string'||typeof vb==='string'){const c=String(va).localeCompare(String(vb));return dir==='desc'?-c:c}return dir==='desc'?vb-va:va-vb});renderTable(displayedStocks,document.getElementById('sortSelect').value);updateStats(displayedStocks,document.getElementById('sortSelect').value)}
function th(label,key,cls=''){const arrow=headerSort.key===key?(headerSort.direction==='desc'?' ▼':' ▲'):'';return`<th class="${cls}" onclick="sortByHeader('${key}')" style="cursor:pointer">${label}${arrow}</th>`}
function color(v){return v>0?(v>=1000?'positive':'neutral'):v<0?'negative':''}
function renderTable(stocks,sortBy){const head=document.getElementById('tableHead'),body=document.getElementById('tableBody');body.innerHTML='';const useValue=currentSummaryMetric==='value';if(sortBy==='consecutive'){const dates=stocks[0]?.dates?.slice(0,10)||[];head.innerHTML=`<tr><th class="serial-col">#</th>${th('股票代號','code')}${th('股票名稱','name')}${th('連續天數','consecutiveDays')}${th('股價','price')}<th>均線區間</th>${dates.map((d,i)=>th(d,`day${i}`)).join('')}${th(useValue?'10日累計值':'10日累計',useValue?'valueTotal10':'total10','summary-separator sticky-summary summary-total')}${th(useValue?'10日平均值':'10日平均',useValue?'valueAvg10':'avg10','sticky-summary summary-average')}</tr>`;stocks.forEach((s,i)=>{const t=s.values.slice(0,10).reduce((a,b)=>a+b,0),a=Math.round(t/10),v=getTradeValueStats(s,10),sum=useValue?v.total:t,avg=useValue?v.average:a;const cells=Array.from({length:10},(_,j)=>`<td class="${color(s.values[j]||0)}">${renderDailyCell(s.values[j]||0,s.dailyPrices[j],s.dailyPrices[j+1])}</td>`).join('');body.insertAdjacentHTML('beforeend',`<tr><td class="serial-col">${i+1}</td><td class="stock-code"><a target="_blank" href="https://fubon-ebrokerdj.fbs.com.tw/z/zc/zcw/zcw1_${s.code}.djhtm">${s.code}</a></td><td class="stock-code">${s.name}</td><td style="font-weight:bold;color:#667eea">${s.consecutiveDays}</td><td>${formatPrice(s.price)}</td><td>${s.smaRange}</td>${cells}<td class="${color(sum)} summary-separator sticky-summary summary-total">${sum.toLocaleString()}</td><td class="${color(avg)} sticky-summary summary-average">${avg.toLocaleString()}</td></tr>`)})}else{const dates=stocks[0]?.dates?.slice(0,4)||[];head.innerHTML=`<tr><th class="serial-col">#</th>${th('股票代號','code')}${th('股票名稱','name')}${[0,1,2,3].map(i=>th(dates[i]||`Day ${i+1}`,`day${i}`)).join('')}${th(useValue?'4日累計值':'4日累計',useValue?'valueTotal':'total','summary-separator sticky-summary summary-total')}${th(useValue?'4日平均值':'平均每日',useValue?'valueAverage':'average','sticky-summary summary-average')}</tr>`;stocks.forEach((s,i)=>{const v=getTradeValueStats(s,4),sum=useValue?v.total:s.total,avg=useValue?v.average:s.average;const cells=[0,1,2,3].map(j=>`<td class="${color(s.values[j])}">${renderDailyCell(s.values[j],s.dailyPrices[j],s.dailyPrices[j+1])}</td>`).join('');body.insertAdjacentHTML('beforeend',`<tr><td class="serial-col">${i+1}</td><td class="stock-code"><a target="_blank" href="https://fubon-ebrokerdj.fbs.com.tw/z/zc/zcw/zcw1_${s.code}.djhtm">${s.code}</a></td><td class="stock-code">${s.name}</td>${cells}<td class="${color(sum)} summary-separator sticky-summary summary-total">${sum.toLocaleString()}</td><td class="${color(avg)} sticky-summary summary-average">${avg.toLocaleString()}</td></tr>`)})}}
function updateStats(stocks,sortBy){const days=sortBy==='consecutive'?10:4,useValue=currentSummaryMetric==='value',inst=getInstitutionLabel(),label=getTypeLabel();const total=stocks.reduce((sum,s)=>sum+(useValue?getTradeValueStats(s,days).total:s.values.slice(0,days).reduce((a,b)=>a+b,0)),0),avg=stocks.length?Math.round(total/stocks.length):0;document.getElementById('totalStocks').textContent=stocks.length;document.getElementById('totalBuy').textContent=total.toLocaleString();document.getElementById('avgBuy').textContent=avg.toLocaleString();document.querySelector('#stats .stat-card:nth-child(2) .stat-label').textContent=useValue?`${days}日累計${inst}${label}值`:`${days}日累計${inst}${label}（張）`;document.querySelector('#stats .stat-card:nth-child(3) .stat-label').textContent=useValue?`平均${days}日${inst}${label}值`:`平均${days}日${inst}${label}（張）`}
async function onDateChanged(){pendingDefaultHeaderSortKey='day0';await loadData(document.getElementById('dateSelect').value)}async function onTypeChanged(){currentType=document.getElementById('typeSelect').value;updateTypeLabels();pendingDefaultHeaderSortKey='day0';await loadData(document.getElementById('dateSelect').value)}function onSortChanged(){pendingDefaultHeaderSortKey=null;sortStocks()}function onSummaryMetricChanged(){currentSummaryMetric=document.getElementById('summaryMetricSelect').value;updateUrlParams(document.getElementById('sortSelect').value,currentDataDateStr,currentType,currentSummaryMetric);renderTable(displayedStocks,document.getElementById('sortSelect').value);updateStats(displayedStocks,document.getElementById('sortSelect').value)}
function searchStock(){const q=document.getElementById('searchInput').value.trim().toUpperCase();if(!q)return;const rows=[...document.querySelectorAll('#tableBody tr')];for(const r of rows)r.classList.remove('highlight-row');const hit=rows.find(r=>(r.cells[1]?.textContent||'').toUpperCase().includes(q)||(r.cells[2]?.textContent||'').toUpperCase().includes(q));if(hit){hit.scrollIntoView({behavior:'smooth',block:'center'});hit.classList.add('highlight-row');setTimeout(()=>hit.classList.remove('highlight-row'),3000)}else alert('未找到符合的股票')}
async function init(){try{await loadFileList();const p=getUrlParams();currentType=normalizeTypeParam(p.type);currentSummaryMetric=p.summary==='shares'?'shares':'value';document.getElementById('typeSelect').value=currentType;document.getElementById('summaryMetricSelect').value=currentSummaryMetric;updateTypeLabels();const sort=['total','growth','three-days','consecutive'].includes(p.sort)?p.sort:'consecutive';document.getElementById('sortSelect').value=sort;const sel=document.getElementById('dateSelect');let d=p.date;if(!d||![...sel.options].some(o=>o.value===d))d=sel.options[0]?.value;if(d){sel.value=d;await loadData(d)}}catch(e){const err=document.getElementById('error');document.getElementById('loading').style.display='none';err.style.display='block';err.className='error';err.textContent=`初始化失敗: ${e.message}`}}
init();
</script>
</body>
</html>
