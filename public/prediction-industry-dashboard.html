<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>產業預測解讀 Dashboard</title>
  <style>
    *{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:#f6f8fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(100%,1440px);margin:0 auto;padding:24px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px;min-width:0}.eyebrow{font-size:13px;font-weight:800;color:#526173}.title{margin:4px 0 0;font-size:30px;line-height:1.2}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav select{border:1px solid #cdd6e3;background:#fff;border-radius:6px;padding:9px 12px;color:#1f3b57;text-decoration:none;font-weight:800;max-width:100%}.grid{display:grid;gap:14px;min-width:0}.layout{grid-template-columns:minmax(280px,360px) minmax(0,1fr)}.panel,.card{background:#fff;border:1px solid #dce3ec;border-radius:8px;box-shadow:0 1px 2px rgba(22,31,44,.04);min-width:0}.panel{padding:12px;max-height:calc(100vh - 130px);overflow:auto}.industry-btn{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border:0;border-bottom:1px solid #edf1f6;background:#fff;padding:12px;text-align:left;cursor:pointer}.industry-btn:hover,.industry-btn.active{background:#eff6ff}.industry-name{font-weight:900;color:#182334;overflow-wrap:anywhere}.small{font-size:12px;color:#66758a;overflow-wrap:anywhere}.score{font-weight:900;color:#1f4e7a}.content{display:grid;gap:14px;min-width:0}.card{padding:16px}.section-title{font-size:18px;margin:0 0 12px;line-height:1.35}.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.metric{border:1px solid #e2e8f0;border-radius:8px;padding:12px;background:#fbfcfe;min-width:0}.metric b{font-size:22px}.metric span{display:block;font-size:12px;color:#697789;margin-top:4px}.table-wrap{overflow-x:auto;overflow-y:hidden;border:1px solid #dce3ec;border-radius:8px;background:#fff;max-width:100%;min-width:0;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:10px 12px;border-bottom:1px solid #edf1f6;text-align:left;font-size:13px;white-space:nowrap}th{background:#f2f5f9;color:#475569;font-size:12px}.pill{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800;background:#eef2f7;color:#334155}.bull{background:#e8f7ef;color:#12623a}.bear{background:#fdeaea;color:#9e2f2f}.warn{background:#fff4db;color:#8a5a00}.link{color:#1d5f99;font-weight:800;text-decoration:none}.note{font-size:15px;line-height:1.7;color:#334155;background:#f8fbff;border:1px solid #d8e7f5;border-radius:8px;padding:12px;overflow-wrap:anywhere}@media(max-width:980px){.layout{grid-template-columns:1fr}.panel{max-height:360px}.metrics{grid-template-columns:1fr 1fr}.topbar{align-items:flex-start;flex-direction:column}}@media(max-width:620px){.shell{padding:14px}.metrics{grid-template-columns:1fr}.title{font-size:24px}.nav{width:100%}.nav a,.nav select{flex:1 1 auto;text-align:center}.card{padding:12px}table{min-width:860px}th,td{padding:9px 10px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div><div class="eyebrow" id="meta">載入中</div><h1 class="title">產業預測解讀 Dashboard</h1></div>
      <nav class="nav"><a href="prediction-dashboard.html">總覽</a><a href="prediction-groups.html">策略分類</a><a href="index.html">工具清單</a></nav>
    </div>
    <section class="grid layout">
      <aside class="panel" id="industryList"></aside>
      <section class="content">
        <div class="card"><h2 class="section-title" id="industryTitle">產業</h2><div class="note" id="interpretation"></div><div class="metrics" id="metrics" style="margin-top:12px"></div></div>
        <div class="card"><h2 class="section-title">產業內股票清單</h2><div class="table-wrap"><table><thead><tr><th>股票</th><th>方向</th><th>分數</th><th>風險</th><th>完整度</th><th>r1</th><th>r3</th><th>Gap SMA20</th><th>RSI</th><th>量比</th><th>翻轉訊號</th><th>法人</th><th>主力</th><th>融資</th><th>報告</th></tr></thead><tbody id="stockRows"></tbody></table></div></div>
      </section>
    </section>
  </main>
  <script>
    let dashboard, selected, currentManifest;
    const fmt=n=>Number.isFinite(n)?n.toFixed(2):'NA';
    const pct=n=>Number.isFinite(n)?`${n.toFixed(1)}%`:'NA';
    const cls=v=>String(v).includes('偏多')?'bull':String(v).includes('偏空')?'bear':String(v).includes('高')?'warn':'';
    const stockTechnicalUrl=code=>`https://tw.stock.yahoo.com/quote/${encodeURIComponent(code)}.TW/technical-analysis`;
    const stockLink=s=>`<a class="link" href="${stockTechnicalUrl(s.stock_code)}" target="_blank" rel="noopener noreferrer">${s.stock_name} <b>${s.stock_code}</b></a>`;
    const params=new URLSearchParams(location.search);
    let currentDate;
    async function loadDashboard(){const m=await fetch('../data_predictions/manifest.json').then(r=>r.json());currentManifest=m;currentDate=params.get('date')||m.latest_date||m.forecast_date_compact;const summaryPath=currentDate===m.latest_date&&m.latest_summary?m.latest_summary:`data_predictions/${currentDate}/summary.json`;dashboard=await fetch(`../${summaryPath}`).then(r=>{if(!r.ok)throw new Error(`找不到 ${summaryPath}`);return r.json();});const hash=decodeURIComponent(location.hash.slice(1));selected=dashboard.industry_summary.find(i=>i.industry===hash)||dashboard.industry_summary[0];render();}
    function withDate(file){return `${file}?date=${encodeURIComponent(currentDate)}`;}
    function render(){document.querySelector('.nav').innerHTML=`<select id="dateSelect" onchange="location.href='prediction-industry-dashboard.html?date='+this.value">${(currentManifest.available_dates||[currentDate]).map(date=>`<option value="${date}" ${date===currentDate?'selected':''}>${date}</option>`).join('')}</select><a href="${withDate('prediction-dashboard.html')}">總覽</a><a href="${withDate('prediction-groups.html')}">策略分類</a><a href="index.html">工具清單</a>`;document.getElementById('meta').textContent=`預測日 ${dashboard.forecast_date}；基準日 ${dashboard.base_trade_date}；${dashboard.industry_summary.length} 個產業`;document.getElementById('industryList').innerHTML=dashboard.industry_summary.map(i=>`<button class="industry-btn ${i.industry===selected.industry?'active':''}" onclick="selectIndustry('${encodeURIComponent(i.industry)}')"><span><span class="industry-name">${i.industry}</span><br><span class="small">${i.interpretation}</span></span><span class="score">${fmt(i.average_direction_score)}</span></button>`).join('');renderIndustry();}
    function selectIndustry(name){selected=dashboard.industry_summary.find(i=>i.industry===decodeURIComponent(name));location.hash=encodeURIComponent(selected.industry);render();}
    function renderIndustry(){document.getElementById('industryTitle').textContent=selected.industry;document.getElementById('interpretation').textContent=selected.interpretation;document.getElementById('metrics').innerHTML=[['檔數',selected.count],['平均分數',fmt(selected.average_direction_score)],['偏多比例',pct(selected.bullish_ratio)],['偏空比例',pct(selected.bearish_ratio)],['翻轉訊號',pct(selected.reversal_ratio)],['站上20MA',pct(selected.reclaim_sma20_ratio)],['站上60MA',pct(selected.reclaim_sma60_ratio)],['MACD轉強',pct(selected.macd_bullish_ratio)],['KD轉強',pct(selected.kd_bullish_ratio)],['三日動能',fmt(selected.average_r3)],['放量比例',pct(selected.volume_expansion_ratio)],['超跌比例',pct(selected.oversold_ratio)]].map(x=>`<div class="metric"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');const rows=dashboard.stocks.filter(s=>s.industry===selected.industry).sort((a,b)=>b.direction_score-a.direction_score);document.getElementById('stockRows').innerHTML=rows.map(s=>`<tr><td>${stockLink(s)}</td><td><span class="pill ${cls(s.final_direction_label)}">${s.final_direction_label}</span></td><td>${s.direction_score}</td><td><span class="pill ${cls(s.risk_label)}">${s.risk_label}</span></td><td>${s.data_completeness}%</td><td>${fmt(s.features.r1)}</td><td>${fmt(s.features.r3)}</td><td>${fmt(s.features.gap_sma20)}</td><td>${fmt(s.features.rsi14)}</td><td>${fmt(s.features.volume_ratio_1d)}</td><td>${s.reversal_signals.tags.join('、')||'—'}</td><td>${fmt(s.features.institutional_ratio)}</td><td>${fmt(s.features.main_net_ratio)}</td><td>${fmt(s.features.margin_change_rate)}</td><td><a class="link" href="${s.report_file}">個股</a></td></tr>`).join('');}
    loadDashboard().catch(err=>{document.getElementById('meta').textContent=`載入失敗：${err.message}`});
  </script>
</body>
</html>
