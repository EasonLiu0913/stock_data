<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V1 / V2 股票預測切換</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f6f8fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{width:min(100%,1440px);margin:0 auto;padding:24px}
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
    .eyebrow{font-size:13px;color:#607086;font-weight:800}
    .title{margin:4px 0 6px;font-size:30px}
    .note{color:#607086;line-height:1.55}
    .toolbar,.card,.table-wrap,.detail{background:#fff;border:1px solid #dce3ec;border-radius:10px;box-shadow:0 1px 2px rgba(22,31,44,.04)}
    .toolbar{padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
    .switch{display:inline-flex;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden;background:#fff}
    .switch button{appearance:none;border:0;border-right:1px solid #cbd5e1;background:#fff;padding:10px 16px;font-weight:900;color:#475569;cursor:pointer}
    .switch button:last-child{border-right:0}
    .switch button.active{background:#1d5f99;color:#fff}
    .switch button:disabled{cursor:not-allowed;opacity:.45}
    .toolbar input,.toolbar select{height:40px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;padding:0 11px;color:#172033}
    .toolbar input{flex:1 1 260px}
    .toolbar label{font-size:13px;font-weight:800;color:#526173}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
    .card{padding:15px}
    .label{font-size:12px;color:#697789;font-weight:800}
    .value{font-size:27px;font-weight:900;margin-top:5px}
    .sub{font-size:12px;color:#697789;margin-top:4px;line-height:1.4}
    .version-badge{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;background:#e9f2fc;color:#24547f}
    .version-badge.v2{background:#f2eafd;color:#63358d}
    .table-wrap{overflow:auto}
    .table-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 15px;border-bottom:1px solid #e7edf4}
    .table-head h2{margin:0;font-size:18px}
    .count{font-size:13px;color:#607086;font-weight:800}
    table{width:100%;border-collapse:collapse;min-width:1180px}
    th,td{padding:10px 12px;border-bottom:1px solid #edf1f6;text-align:left;font-size:13px;white-space:nowrap}
    th{position:sticky;top:0;background:#f2f5f9;color:#475569;font-size:12px;z-index:1}
    tbody tr{cursor:pointer}
    tbody tr:hover td,tbody tr.selected td{background:#eef6ff}
    .stock-link{color:#1d5f99;font-weight:900;text-decoration:none}
    .stock-link:hover{text-decoration:underline}
    .stock-link:focus-visible{outline:2px solid #1d5f99;outline-offset:3px;border-radius:2px}
    .pill{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:900;background:#eef2f7;color:#334155}
    .bull{background:#e8f7ef;color:#12623a}
    .bear{background:#fdeaea;color:#9e2f2f}
    .neutral{background:#eef2f7;color:#334155}
    .changed{background:#fff0ce;color:#805300}
    .delta-up{color:#08783f;font-weight:900}
    .delta-down{color:#aa2d2d;font-weight:900}
    .detail{margin-top:14px;padding:18px;display:none}
    .detail.open{display:block}
    .detail-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
    .detail h2{margin:0 0 5px}
    .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:14px 0}
    .mini{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:11px}
    .mini strong{display:block;margin-top:4px}
    .adjustments{display:grid;gap:8px}
    .adjustment{border:1px solid #e2e8f0;border-radius:8px;padding:11px}
    .raw-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
    .raw-links a,.home-link{display:inline-flex;align-items:center;min-height:38px;border:1px solid #cbd5e1;border-radius:7px;padding:0 12px;text-decoration:none;color:#1d5f99;font-weight:900;background:#fff}
    .empty{padding:40px;text-align:center;color:#607086;font-weight:800}
    .error{background:#fff1f1;border:1px solid #f0b9b9;color:#8e2626;border-radius:8px;padding:14px;margin-bottom:14px;display:none}
    .comparison-panel{display:grid;gap:14px}
    .section-card{background:#fff;border:1px solid #dce3ec;border-radius:10px;box-shadow:0 1px 2px rgba(22,31,44,.04);padding:16px;overflow:auto}
    .section-card h2{margin:0 0 5px;font-size:18px}
    .section-card .section-note{margin:0 0 14px;color:#607086;font-size:13px;line-height:1.55}
    .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
    .metric{border:1px solid #e2e8f0;background:#f8fafc;border-radius:8px;padding:12px}
    .metric strong{display:block;font-size:24px;margin-top:4px}
    .comparison-table{min-width:760px}
    .comparison-table tbody tr{cursor:default}
    .comparison-table .positive{color:#08783f;font-weight:900}
    .comparison-table .negative{color:#aa2d2d;font-weight:900}
    .comparison-table .winner{background:#e8f7ef;color:#12623a}
    .performance-table th:first-child,.performance-table td:first-child{min-width:210px}
    .indicator-name{display:block;font-weight:900;color:#334155}
    .compare-filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
    .compare-filters input,.compare-filters select{height:38px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;padding:0 10px}
    .compare-filters input{flex:1 1 240px}
    @media(max-width:720px){.shell{padding:14px}.topbar{flex-direction:column}.title{font-size:24px}.toolbar{align-items:stretch}.switch{width:100%}.switch button{flex:1}.toolbar input,.toolbar select{width:100%}.detail-head{flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div>
        <div class="eyebrow" id="meta">載入中</div>
        <h1 class="title" id="pageTitle">V1 / V2 股票預測切換</h1>
        <div class="note" id="pageNote">V1 是正式預測；V2 是實驗影子版本。此頁顯示預測差異，不等同事後命中率比較。</div>
      </div>
      <a class="home-link" href="index.html">回工具首頁</a>
    </div>

    <div class="error" id="errorBox"></div>

    <section class="toolbar">
      <div class="switch" aria-label="預測版本">
        <button type="button" id="v1Button" onclick="setVersion('v1')">V1 正式</button>
        <button type="button" id="v2Button" onclick="setVersion('v2')">V2 實驗</button>
        <button type="button" id="compareButton" onclick="setVersion('compare')">V1 / V2 比較分析</button>
      </div>
      <label for="dateSelect">預測日</label>
      <select id="dateSelect" onchange="changeDate()"></select>
      <input class="prediction-only" id="searchInput" type="search" placeholder="搜尋股票代號、名稱或產業" oninput="renderRows()">
      <select class="prediction-only" id="directionFilter" onchange="renderRows()"><option value="">全部方向</option></select>
      <select class="prediction-only" id="changedFilter" onchange="renderRows()"><option value="">全部股票</option><option value="changed">只看 V1/V2 方向不同</option><option value="same">只看方向相同</option></select>
      <select class="prediction-only" id="quadrantFilter" onchange="renderRows()"><option value="">全部籌碼×技術狀態</option></select>
    </section>

    <section class="kpis" id="kpis"></section>

    <section class="comparison-panel" id="comparisonPanel" hidden></section>

    <section class="table-wrap" id="predictionTableSection">
      <div class="table-head"><h2 id="tableTitle">股票清單</h2><div class="count" id="resultCount"></div></div>
      <table>
        <thead><tr><th>股票</th><th>產業</th><th>目前版本方向</th><th>目前分數</th><th>V1 方向</th><th>V2 方向</th><th>分數差</th><th>方向改變</th><th>RS 分組</th><th>籌碼×技術</th><th>RSI</th><th>7日相對強弱</th><th>風險</th><th>完整度</th></tr></thead>
        <tbody id="stockRows"></tbody>
      </table>
      <div class="empty" id="emptyState" hidden>沒有符合條件的股票</div>
    </section>

    <section class="detail" id="detailPanel"></section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    let manifest = null;
    let payload = null;
    let comparison = null;
    let currentVersion = ['v2', 'compare'].includes(params.get('version')) ? params.get('version') : 'v1';
    let selectedCode = params.get('code') || '';

    const esc = value => String(value ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
    const hasNumber = value => value !== null && value !== undefined && value !== '' && Number.isFinite(Number(value));
    const fmt = value => hasNumber(value) ? Number(value).toFixed(2) : 'NA';
    const fmt4 = value => hasNumber(value) ? Number(value).toFixed(4) : 'NA';
    const pct = value => hasNumber(value) ? `${Number(value).toFixed(1)}%` : 'NA';
    const directionClass = value => String(value || '').includes('偏多') ? 'bull' : String(value || '').includes('偏空') ? 'bear' : 'neutral';
    const currentData = row => currentVersion === 'v2' ? row.v2 : row.v1;
    const yahooStockUrl = code => `https://tw.stock.yahoo.com/quote/${encodeURIComponent(String(code))}.TW/technical-analysis`;

    function setQuery(values) {
      const next = new URL(location.href);
      Object.entries(values).forEach(([key, value]) => value ? next.searchParams.set(key, value) : next.searchParams.delete(key));
      history.replaceState(null, '', next);
    }

    async function fetchJson(file) {
      const response = await fetch(`../${file}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`讀取失敗：${file}（HTTP ${response.status}）`);
      return response.json();
    }

    async function init() {
      try {
        manifest = await fetchJson('data_prediction_ui/manifest.json');
        const requested = params.get('date');
        const date = requested && manifest.available_dates.includes(requested) ? requested : manifest.latest_date;
        document.getElementById('dateSelect').innerHTML = manifest.available_dates.slice().reverse().map(item => `<option value="${esc(item)}" ${item === date ? 'selected' : ''}>${item.slice(0,4)}-${item.slice(4,6)}-${item.slice(6,8)}</option>`).join('');
        await loadDate(date);
      } catch (error) {
        showError(error.message);
      }
    }

    async function loadDate(date) {
      payload = await fetchJson(`data_prediction_ui/${date}.json`);
      comparison = await fetchJson(`data_prediction_comparisons/${date}/comparison.json`).catch(() => null);
      if (currentVersion === 'v2' && !payload.versions.v2.available) currentVersion = 'v1';
      setQuery({ date, version: currentVersion, code: selectedCode });
      initializeFilters();
      updateHeader();
      renderKpis();
      renderRows();
      if (selectedCode) openDetail(selectedCode, false);
    }

    function showError(message) {
      const box = document.getElementById('errorBox');
      box.textContent = message;
      box.style.display = 'block';
    }

    function initializeFilters() {
      const directions = [...new Set(payload.rows.flatMap(row => [row.v1?.direction, row.v2?.direction]).filter(Boolean))].sort();
      const quadrants = [...new Set(payload.rows.map(row => row.v2?.chip_technical_quadrant).filter(Boolean))].sort();
      document.getElementById('directionFilter').innerHTML = '<option value="">全部方向</option>' + directions.map(item => `<option value="${esc(item)}">${esc(item)}</option>`).join('');
      document.getElementById('quadrantFilter').innerHTML = '<option value="">全部籌碼×技術狀態</option>' + quadrants.map(item => `<option value="${esc(item)}">${esc(item)}</option>`).join('');
    }

    function updateHeader() {
      const compareMode = currentVersion === 'compare';
      const version = compareMode ? null : payload.versions[currentVersion];
      document.getElementById('v1Button').classList.toggle('active', currentVersion === 'v1');
      document.getElementById('v2Button').classList.toggle('active', currentVersion === 'v2');
      document.getElementById('compareButton').classList.toggle('active', compareMode);
      document.getElementById('v2Button').disabled = !payload.versions.v2.available;
      document.getElementById('quadrantFilter').disabled = currentVersion !== 'v2';
      document.querySelectorAll('.prediction-only').forEach(element => { element.hidden = compareMode; });
      document.getElementById('predictionTableSection').hidden = compareMode;
      document.getElementById('comparisonPanel').hidden = !compareMode;
      document.getElementById('detailPanel').classList.toggle('open', !compareMode && Boolean(selectedCode));
      if (compareMode) {
        document.getElementById('pageTitle').textContent = 'V1 / V2 覆盤比較分析';
        document.getElementById('pageNote').textContent = '所有 V1 / V2 績效指標固定使用共同可判分樣本；版本專屬股票只在股票清單中分開顯示。';
        document.getElementById('meta').innerHTML = '資料基準日 ' + esc(payload.base_trade_date || 'NA') + ' · 預測日 ' + esc(payload.forecast_date || payload.forecast_date_compact) + ' · <span class="version-badge">COMPARE</span>';
      } else {
        document.getElementById('pageTitle').textContent = 'V1 / V2 股票預測切換';
        document.getElementById('pageNote').textContent = 'V1 是正式預測；V2 是實驗影子版本。可切換同一股票，或進入比較分析查看事後覆盤。';
        document.getElementById('meta').innerHTML = '資料基準日 ' + esc(payload.base_trade_date || 'NA') + ' · 預測日 ' + esc(payload.forecast_date || payload.forecast_date_compact) + ' · <span class="version-badge ' + currentVersion + '">' + currentVersion.toUpperCase() + ' ' + esc(version.methodology_version || '') + '</span>';
        document.getElementById('tableTitle').textContent = currentVersion.toUpperCase() + ' 股票預測清單';
      }
    }

    function setVersion(version) {
      if (version === 'v2' && !payload?.versions.v2.available) return;
      currentVersion = version;
      if (version !== 'v2') document.getElementById('quadrantFilter').value = '';
      setQuery({ version, date: payload.forecast_date_compact, code: version === 'compare' ? '' : selectedCode });
      updateHeader();
      renderKpis();
      renderRows();
      if (selectedCode && version !== 'compare') openDetail(selectedCode, false);
    }

    async function changeDate() {
      selectedCode = '';
      document.getElementById('detailPanel').classList.remove('open');
      try {
        await loadDate(document.getElementById('dateSelect').value);
      } catch (error) {
        showError(error.message);
      }
    }

    function renderKpis() {
      if (currentVersion === 'compare') {
        const accuracy = comparison?.accuracy_comparison;
        const changed = comparison?.paired_evaluation?.changed_evaluable_count ?? comparison?.forecast_difference?.changed_direction_count;
        const commonCount = accuracy?.common_sample_count ?? comparison?.paired_evaluation?.common_evaluable_count;
        const cards = [
          ['V1 命中率', accuracy ? pct(accuracy.v1.hit_rate) : 'NA', accuracy ? commonCount + ' 筆共同樣本' : '尚未覆盤'],
          ['V2 命中率', accuracy ? pct(accuracy.v2.hit_rate) : 'NA', accuracy ? commonCount + ' 筆共同樣本' : '尚未覆盤'],
          ['V2 − V1 命中率', accuracy ? (Number(accuracy.deltas.hit_rate) >= 0 ? '+' : '') + fmt(accuracy.deltas.hit_rate) + ' pp' : 'NA', '相同股票、相同判分規則'],
          ['共同預測', comparison?.shared_prediction_count ?? 'NA', '兩版都有預測輸出'],
          ['方向改變', comparison?.forecast_difference?.changed_direction_count ?? 'NA', pct(comparison?.forecast_difference?.changed_direction_rate)],
          ['方向改變可判分', changed ?? 'NA', '共同樣本中的方向差異']
        ];
        document.getElementById('kpis').innerHTML = cards.map(([label,value,sub]) => '<div class="card"><div class="label">' + esc(label) + '</div><div class="value">' + esc(value) + '</div><div class="sub">' + esc(sub) + '</div></div>').join('');
        renderComparison();
        return;
      }
      const version = payload.versions[currentVersion];
      const distribution = version.direction_distribution || {};
      const bullish = Object.entries(distribution).filter(([key]) => key.includes('偏多')).reduce((sum, [,value]) => sum + value, 0);
      const bearish = Object.entries(distribution).filter(([key]) => key.includes('偏空')).reduce((sum, [,value]) => sum + value, 0);
      const neutral = version.total_predictions - bullish - bearish;
      const cards = [
        ['預測股票', version.total_predictions, currentVersion.toUpperCase() + ' ' + (version.methodology_version || '')],
        ['偏多', bullish, pct(version.total_predictions ? bullish / version.total_predictions * 100 : null)],
        ['中性', neutral, pct(version.total_predictions ? neutral / version.total_predictions * 100 : null)],
        ['偏空', bearish, pct(version.total_predictions ? bearish / version.total_predictions * 100 : null)]
      ];
      if (currentVersion === 'v2') cards.push(['與 V1 方向不同', version.changed_direction_count || 0, pct(version.changed_direction_rate)]);
      document.getElementById('kpis').innerHTML = cards.map(([label,value,sub]) => '<div class="card"><div class="label">' + esc(label) + '</div><div class="value">' + esc(value) + '</div><div class="sub">' + esc(sub) + '</div></div>').join('');
    }

    function signed(value, suffix = '') {
      if (!hasNumber(value)) return 'NA';
      return (Number(value) > 0 ? '+' : '') + fmt(value) + suffix;
    }

    function factorLabel(value) {
      const labels = {
        nonlinear_relative_strength: '非線性相對強弱',
        chip_technical_interaction: '籌碼 × 技術交互作用',
        direction_mapping_or_threshold: '方向映射／門檻',
        no_direction_change: '方向未改變'
      };
      return labels[value] || value || '未分類';
    }

    function renderComparison() {
      const panel = document.getElementById('comparisonPanel');
      if (!comparison) {
        panel.innerHTML = '<section class="section-card empty">這個日期尚未產生 V1 / V2 覆盤比較。請先執行 Compare V1 and V2 replay results (manual) action。</section>';
        return;
      }
      const paired = comparison.paired_evaluation;
      const accuracy = comparison.accuracy_comparison;
      if (!paired) {
        panel.innerHTML = '<section class="section-card empty">已有整體比較，但尚未包含統一判分因素資料；請重新執行比較 action。</section>';
        return;
      }
      const exact = paired.exact_outcome || {};
      const closer = paired.closer_on_changed || {};
      const transitions = paired.transition_matrix || [];
      const factors = paired.adjustment_effectiveness || [];
      const volume = comparison.volume_filter_comparison;
      const scope = paired.common_evaluable_count
        ? '共同可判分 ' + paired.common_evaluable_count + ' 筆'
        : '目前先分析方向改變且可判分的 ' + paired.changed_evaluable_count + ' 筆';
      const metrics = [
        ['兩版都命中', exact.both_hit, '統一判分'],
        ['只有 V1 命中', exact.v1_only_hit, pct(exact.v1_hit_rate)],
        ['只有 V2 命中', exact.v2_only_hit, pct(exact.v2_hit_rate)],
        ['兩版都未命中', exact.neither_hit, '需再檢查'],
        ['V1 較接近真實', closer.v1_closer, pct(closer.v1_closer_rate)],
        ['V2 較接近真實', closer.v2_closer, pct(closer.v2_closer_rate)],
        ['距離相同', closer.tie, '方向類別距離']
      ];
      const transitionRows = transitions.map(row => '<tr><td><strong>' + esc(row.name) + '</strong></td><td>' + esc(row.count) + '</td><td>' + esc(row.v1_closer) + '</td><td>' + esc(row.v2_closer) + '</td><td>' + esc(row.v1_only_hit) + '</td><td>' + esc(row.v2_only_hit) + '</td><td>' + esc(row.neither_hit) + '</td><td class="' + (row.v2_minus_v1_closer > 0 ? 'positive' : row.v2_minus_v1_closer < 0 ? 'negative' : '') + '">' + esc(signed(row.v2_minus_v1_closer)) + '</td></tr>').join('');
      const factorRows = factors.map(row => '<tr><td><strong>' + esc(factorLabel(row.name)) + '</strong></td><td>' + esc(row.count) + '</td><td>' + esc(row.v1_closer) + '</td><td>' + esc(row.v2_closer) + '</td><td>' + esc(row.v1_only_hit) + '</td><td>' + esc(row.v2_only_hit) + '</td><td class="' + (row.v2_minus_v1_closer > 0 ? 'positive' : row.v2_minus_v1_closer < 0 ? 'negative' : '') + '">' + esc(signed(row.v2_minus_v1_closer)) + '</td></tr>').join('');
      const returnRows = accuracy ? [
        {
          label: '共同樣本命中率',
          v1: pct(accuracy.v1.hit_rate),
          v2: pct(accuracy.v2.hit_rate),
          delta: signed(accuracy.deltas.hit_rate, ' pp')
        },
        {
          label: '平均投報率',
          v1: pct(accuracy.v1.average_gross_signed_return),
          v2: pct(accuracy.v2.average_gross_signed_return),
          delta: signed(accuracy.deltas.average_gross_signed_return, ' pp')
        },
        {
          label: '平衡權重準確率',
          v1: pct(accuracy.v1.balanced_weight_accuracy ?? accuracy.v1.balanced_directional_accuracy),
          v2: pct(accuracy.v2.balanced_weight_accuracy ?? accuracy.v2.balanced_directional_accuracy),
          delta: signed(accuracy.deltas.balanced_weight_accuracy ?? accuracy.deltas.balanced_directional_accuracy, ' pp')
        },
        {
          label: '市場超額報酬 IC 率',
          v1: fmt4(accuracy.v1.score_vs_market_excess_spearman_ic),
          v2: fmt4(accuracy.v2.score_vs_market_excess_spearman_ic),
          delta: hasNumber(accuracy.deltas.score_vs_market_excess_spearman_ic)
            ? (Number(accuracy.deltas.score_vs_market_excess_spearman_ic) > 0 ? '+' : '') + fmt4(accuracy.deltas.score_vs_market_excess_spearman_ic)
            : 'NA'
        }
      ].map(row => {
        const deltaClass = String(row.delta).startsWith('+') ? 'positive' : String(row.delta).startsWith('-') ? 'negative' : '';
        return '<tr><td><span class="indicator-name">' + esc(row.label) + '</span></td><td>' + esc(row.v1) + '</td><td>' + esc(row.v2) + '</td><td class="' + deltaClass + '">' + esc(row.delta) + '</td></tr>';
      }).join('') : '';
      const volumeRows = volume ? [
        ['低量門檻（實際量 / 前20日均量）', volume.v1.threshold, volume.v2.threshold, '越低代表量縮'],
        ['排除前命中率', pct(volume.v1.baseline_hit_rate), pct(volume.v2.baseline_hit_rate), '原樣本'],
        ['排除低量後命中率', pct(volume.v1.after_excluding_low_volume_hit_rate), pct(volume.v2.after_excluding_low_volume_hit_rate), signed((volume.v2.after_excluding_low_volume_hit_rate ?? 0) - (volume.v1.after_excluding_low_volume_hit_rate ?? 0), ' pp')],
        ['各版命中率改善', signed(volume.v1.hit_rate_delta, ' pp'), signed(volume.v2.hit_rate_delta, ' pp'), '排除後 − 排除前'],
        ['排除筆數', volume.v1.removed_count, volume.v2.removed_count, '低量樣本']
      ].map(row => '<tr>' + row.map(cell => '<td>' + esc(cell) + '</td>').join('') + '</tr>').join('') : '';

      panel.innerHTML =
        '<section class="section-card"><h2>同一套命中定義：結果拆解</h2><p class="section-note">' + esc(scope) + '。' + esc(paired.definition?.actual_class || '') + ' ' + esc(paired.definition?.caveat || '') + '</p><div class="metric-grid">' +
        metrics.map(([label,value,sub]) => '<div class="metric"><div class="label">' + esc(label) + '</div><strong>' + esc(value ?? 'NA') + '</strong><div class="sub">' + esc(sub) + '</div></div>').join('') +
        '</div></section>' +
        '<section class="section-card"><h2>整體績效指標</h2><p class="section-note">所有指標均使用 V1、V2 共同可判分股票；平均投報率另限定兩版都有明確多空方向的共同子樣本。pp 代表百分點。</p><table class="comparison-table performance-table"><thead><tr><th>指標</th><th>V1</th><th>V2</th><th>V2 − V1 / 說明</th></tr></thead><tbody>' + returnRows + '</tbody></table></section>' +
        '<section class="section-card"><h2>方向轉換矩陣</h2><p class="section-note">直接看 V2 把哪一類 V1 判斷改成什麼，以及改動後誰更接近真實方向。</p><table class="comparison-table"><thead><tr><th>方向轉換</th><th>筆數</th><th>V1 較近</th><th>V2 較近</th><th>僅 V1 命中</th><th>僅 V2 命中</th><th>都未中</th><th>V2−V1 較近</th></tr></thead><tbody>' + transitionRows + '</tbody></table></section>' +
        '<section class="section-card"><h2>V2 調整因素成效</h2><p class="section-note">因素是診斷分組，不代表單一因果；同一規則需跨多個交易日才適合下結論。</p><table class="comparison-table"><thead><tr><th>主要因素</th><th>筆數</th><th>V1 較近</th><th>V2 較近</th><th>僅 V1 命中</th><th>僅 V2 命中</th><th>V2−V1 較近</th></tr></thead><tbody>' + factorRows + '</tbody></table></section>' +
        (volume ? '<section class="section-card"><h2>成交量排除測試</h2><p class="section-note">' + esc(volume.definition?.description || volume.definition?.rule || '測試排除低量樣本後，兩版命中率是否改善。') + '</p><table class="comparison-table"><thead><tr><th>指標</th><th>V1</th><th>V2</th><th>差異／說明</th></tr></thead><tbody>' + volumeRows + '</tbody></table></section>' : '') +
        '<section class="section-card"><h2>逐筆方向差異</h2><p class="section-note">可搜尋股票，或只看 V1 命中、V2 命中、哪一版較接近的股票。</p><div class="compare-filters"><input id="compareSearch" type="search" placeholder="搜尋股票代號、名稱、產業" oninput="renderComparisonRows()"><select id="compareOutcome" onchange="renderComparisonRows()"><option value="">全部命中結果</option><option value="v1_only">只有 V1 命中</option><option value="v2_only">只有 V2 命中</option><option value="neither">兩版都未命中</option><option value="both">兩版都命中</option></select><select id="compareCloser" onchange="renderComparisonRows()"><option value="">全部接近結果</option><option value="v1">V1 較接近</option><option value="v2">V2 較接近</option><option value="tie">距離相同</option></select></div><div class="count" id="compareCount"></div><table class="comparison-table"><thead><tr><th>股票</th><th>產業</th><th>實際報酬</th><th>實際類別</th><th>V1 方向</th><th>V2 方向</th><th>命中結果</th><th>較接近</th><th>主要因素</th></tr></thead><tbody id="comparisonRows"></tbody></table></section>';
      renderComparisonRows();
    }

    function renderComparisonRows() {
      const body = document.getElementById('comparisonRows');
      if (!body || !comparison?.paired_evaluation) return;
      const query = (document.getElementById('compareSearch')?.value || '').trim().toLowerCase();
      const outcome = document.getElementById('compareOutcome')?.value || '';
      const closer = document.getElementById('compareCloser')?.value || '';
      const allRows = comparison.paired_evaluation.changed_rows || [];
      const rows = allRows.filter(row => {
        const text = (row.stock_code + ' ' + (row.stock_name || '') + ' ' + (row.industry || '')).toLowerCase();
        const rowOutcome = row.v1_hit && row.v2_hit ? 'both' : row.v1_hit ? 'v1_only' : row.v2_hit ? 'v2_only' : 'neither';
        return (!query || text.includes(query)) && (!outcome || outcome === rowOutcome) && (!closer || closer === row.closer_version);
      });
      document.getElementById('compareCount').textContent = '顯示 ' + rows.length + ' / ' + allRows.length + ' 支';
      body.innerHTML = rows.map(row => {
        const outcome = row.v1_hit && row.v2_hit ? '兩版都命中' : row.v1_hit ? '只有 V1 命中' : row.v2_hit ? '只有 V2 命中' : '兩版都未命中';
        const closerText = row.closer_version === 'v1' ? 'V1' : row.closer_version === 'v2' ? 'V2' : '相同';
        return '<tr><td><a class="stock-link" href="' + esc(yahooStockUrl(row.stock_code)) + '" target="_blank" rel="noopener noreferrer">' + esc(row.stock_name || '') + ' <strong>' + esc(row.stock_code) + '</strong></a></td><td>' + esc(row.industry || 'NA') + '</td><td class="' + (Number(row.actual_return) > 0 ? 'positive' : Number(row.actual_return) < 0 ? 'negative' : '') + '">' + esc(signed(row.actual_return, '%')) + '</td><td>' + esc(row.actual_class) + '</td><td><span class="pill ' + directionClass(row.v1_direction) + '">' + esc(row.v1_direction) + '</span></td><td><span class="pill ' + directionClass(row.v2_direction) + '">' + esc(row.v2_direction) + '</span></td><td>' + esc(outcome) + '</td><td><span class="pill ' + (closerText === 'V2' ? 'bull' : closerText === 'V1' ? 'bear' : 'neutral') + '">' + esc(closerText) + '</span></td><td>' + esc(factorLabel(row.primary_factor)) + '</td></tr>';
      }).join('');
    }

    function filteredRows() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const direction = document.getElementById('directionFilter').value;
      const changed = document.getElementById('changedFilter').value;
      const quadrant = document.getElementById('quadrantFilter').value;
      return payload.rows.filter(row => {
        const current = currentData(row);
        if (!current) return false;
        const text = `${row.stock_code} ${row.stock_name} ${row.industry || ''}`.toLowerCase();
        const isChanged = Boolean(row.v1 && row.v2 && row.v1.direction !== row.v2.direction);
        return (!query || text.includes(query)) &&
          (!direction || current.direction === direction) &&
          (!changed || (changed === 'changed' ? isChanged : !isChanged)) &&
          (currentVersion !== 'v2' || !quadrant || row.v2?.chip_technical_quadrant === quadrant);
      }).sort((a,b) => {
        const scoreDiff = Number(currentData(b)?.score ?? -999) - Number(currentData(a)?.score ?? -999);
        return scoreDiff || String(a.stock_code).localeCompare(String(b.stock_code));
      });
    }

    function renderRows() {
      if (!payload || currentVersion === 'compare') return;
      const rows = filteredRows();
      document.getElementById('resultCount').textContent = `顯示 ${rows.length} / ${payload.rows.filter(row => currentData(row)).length} 支`;
      document.getElementById('emptyState').hidden = rows.length > 0;
      document.getElementById('stockRows').innerHTML = rows.map(row => {
        const current = currentData(row);
        const changed = Boolean(row.v1 && row.v2 && row.v1.direction !== row.v2.direction);
        const delta = row.v2?.score_delta;
        const deltaClass = Number(delta) > 0 ? 'delta-up' : Number(delta) < 0 ? 'delta-down' : '';
        const yahooUrl = yahooStockUrl(row.stock_code);
        return `<tr class="${row.stock_code === selectedCode ? 'selected' : ''}" onclick="openDetail('${esc(row.stock_code)}')">
          <td><a class="stock-link" href="${esc(yahooUrl)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="在 Yahoo 股市查看 ${esc(row.stock_name)}（${esc(row.stock_code)}）">${esc(row.stock_name)} <strong>${esc(row.stock_code)}</strong></a></td>
          <td>${esc(row.industry || 'NA')}</td>
          <td><span class="pill ${directionClass(current.direction)}">${esc(current.direction || 'NA')}</span></td>
          <td><strong>${esc(fmt(current.score))}</strong></td>
          <td>${row.v1 ? `<span class="pill ${directionClass(row.v1.direction)}">${esc(row.v1.direction || 'NA')}</span>` : 'NA'}</td>
          <td>${row.v2 ? `<span class="pill ${directionClass(row.v2.direction)}">${esc(row.v2.direction || 'NA')}</span>` : '尚未產生'}</td>
          <td class="${deltaClass}">${row.v2 ? esc(fmt(delta)) : 'NA'}</td>
          <td>${changed ? '<span class="pill changed">有改變</span>' : '相同'}</td>
          <td>${esc(row.v2?.relative_strength_bucket || 'NA')}</td>
          <td>${esc(row.v2?.chip_technical_quadrant || 'NA')}</td>
          <td>${esc(fmt(row.features.rsi14))}</td>
          <td>${hasNumber(row.features.relative_strength) ? `${esc(fmt(row.features.relative_strength))}%` : 'NA'}</td>
          <td>${esc(current.risk_label || 'NA')}</td>
          <td>${esc(pct(current.data_completeness))}</td>
        </tr>`;
      }).join('');
    }

    function openDetail(code, scroll = true) {
      if (currentVersion === 'compare') return;
      const row = payload.rows.find(item => String(item.stock_code) === String(code));
      if (!row) return;
      selectedCode = String(code);
      setQuery({ code: selectedCode, date: payload.forecast_date_compact, version: currentVersion });
      renderRows();
      const current = currentData(row);
      const adjustments = row.v2?.adjustments || [];
      const panel = document.getElementById('detailPanel');
      panel.innerHTML = `<div class="detail-head"><div><div class="eyebrow">${esc(row.industry || '未分類')}</div><h2>${esc(row.stock_name)}（${esc(row.stock_code)}）</h2><div class="note">目前顯示 ${currentVersion.toUpperCase()}；可直接切換版本觀察相同股票。</div></div><span class="pill ${directionClass(current?.direction)}">${esc(current?.direction || 'NA')} · ${esc(fmt(current?.score))}</span></div>
        <div class="detail-grid">
          <div class="mini">V1 分數／方向<strong>${esc(fmt(row.v1?.score))} · ${esc(row.v1?.direction || 'NA')}</strong></div>
          <div class="mini">V2 分數／方向<strong>${esc(fmt(row.v2?.score))} · ${esc(row.v2?.direction || '尚未產生')}</strong></div>
          <div class="mini">V2 分數差<strong>${esc(fmt(row.v2?.score_delta))}</strong></div>
          <div class="mini">籌碼×技術<strong>${esc(row.v2?.chip_technical_quadrant || 'NA')}</strong></div>
          <div class="mini">相對強弱分組<strong>${esc(row.v2?.relative_strength_bucket || 'NA')}</strong></div>
          <div class="mini">RSI / 7日RS<strong>${esc(fmt(row.features.rsi14))} / ${hasNumber(row.features.relative_strength) ? `${esc(fmt(row.features.relative_strength))}%` : 'NA'}</strong></div>
        </div>
        <h3>V2 規則調整</h3>
        <div class="adjustments">${adjustments.length ? adjustments.map(item => `<div class="adjustment"><strong>${esc(item.id)}</strong>　分數 ${esc(fmt(item.score))}<div class="note">${esc(item.explanation || '')}</div></div>`).join('') : '<div class="note">此股票沒有 V2 調整資料，或尚未產生 V2。</div>'}</div>
        <div class="raw-links"><a href="${esc(yahooStockUrl(row.stock_code))}" target="_blank" rel="noopener noreferrer">Yahoo 股市技術分析</a>${row.paths.v1 ? `<a href="../${esc(row.paths.v1)}" target="_blank" rel="noopener">開啟 V1 JSON</a>` : ''}${row.paths.v2 ? `<a href="../${esc(row.paths.v2)}" target="_blank" rel="noopener">開啟 V2 JSON</a>` : ''}</div>`;
      panel.classList.add('open');
      if (scroll) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    init();
  </script>
  <script src="prediction-back-to-top.js"></script>
</body>
</html>
