<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票預測覆盤 Dashboard</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}#viewer{display:none;width:100%;height:100%;border:0;background:#f4f6f8}.shell{min-height:100%;display:grid;place-items:center;padding:24px}.card{width:min(100%,560px);background:#fff;border:1px solid #d9e0e8;border-radius:10px;padding:24px;box-shadow:0 1px 2px rgba(23,32,51,.05)}h1{margin:0 0 10px;font-size:24px}.note{color:#667085;line-height:1.6}.error{color:#a33a3a}a{color:#1f5f98;font-weight:800}
  </style>
</head>
<body>
  <main class="shell" id="loader">
    <section class="card">
      <h1>股票預測覆盤 Dashboard</h1>
      <div class="note" id="status">正在尋找最新可用的覆盤日期…</div>
    </section>
  </main>
  <iframe id="viewer" title="股票預測覆盤 Dashboard"></iframe>
  <script>
    const loader = document.getElementById('loader');
    const statusElement = document.getElementById('status');
    const viewer = document.getElementById('viewer');
    const compact = value => String(value || '').replaceAll('-', '').replaceAll('/', '');

    async function fetchJson(path) {
      const response = await fetch(`../${path}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`找不到 ${path}`);
      return response.json();
    }

    async function replayFilesExist(date) {
      const base = `../data_predictions/${date}`;
      const paths = [`${base}/replay-summary.json`, `${base}/replay-dashboard.json`];
      try {
        const responses = await Promise.all(paths.map(path => fetch(path, { method: 'HEAD', cache: 'no-store' })));
        return responses.every(response => response.ok);
      } catch {
        return false;
      }
    }

    function replaceReplayDateSelect(documentRef, availableDates, selectedDate) {
      const current = documentRef.getElementById('dateSelect');
      if (!current) return;
      const replacement = current.cloneNode(false);
      replacement.innerHTML = availableDates.map(date =>
        `<option value="${date}" ${date === selectedDate ? 'selected' : ''}>${date}</option>`
      ).join('');
      replacement.addEventListener('change', event => {
        const next = new URL(location.href);
        next.searchParams.set('date', event.target.value);
        location.href = next;
      });
      current.replaceWith(replacement);
    }

    function promoteInternalLinks(documentRef) {
      documentRef.querySelectorAll('a[href]').forEach(link => {
        const href = link.getAttribute('href') || '';
        if (href && !href.startsWith('http:') && !href.startsWith('https:') && !href.startsWith('#')) {
          link.setAttribute('target', '_top');
        }
      });
    }

    function installReplayListEnhancement(documentRef) {
      if (documentRef.getElementById('replay-list-enhancement')) return;
      const script = documentRef.createElement('script');
      script.id = 'replay-list-enhancement';
      script.textContent = `
        (() => {
          if (window.__replayListEnhancementInstalled) return;
          window.__replayListEnhancementInstalled = true;

          const style = document.createElement('style');
          style.textContent = \`
            .case-toolbar{display:flex;flex-direction:column;align-items:flex-end;gap:7px}.view-tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.view-tab,.case-sort-button{min-height:34px;border:1px solid #c8d1dc;border-radius:7px;background:#fff;color:#3b5167;padding:6px 10px;cursor:pointer;font-weight:800}.view-tab.active{background:#2f6fae;border-color:#2f6fae;color:#fff}.view-tab:disabled{cursor:wait;opacity:.6}.case-sort-button{min-height:auto;border:0;border-radius:0;background:transparent;color:#506174;padding:0;font-size:12px;text-align:left;white-space:nowrap}.case-sort-button:hover{text-decoration:underline}.actual-close{font-weight:900;white-space:nowrap}.prediction-list-table{min-width:1640px}.replay-list-table{min-width:1120px}@media(max-width:720px){.case-toolbar{width:100%;align-items:stretch}.view-tabs{justify-content:flex-start}.view-tab{flex:1 1 auto}}
          \`;
          document.head.appendChild(style);

          const caseTabs = document.getElementById('caseTabs');
          const sectionHead = caseTabs?.closest('.section-head');
          const table = document.getElementById('caseRows')?.closest('table');
          const caseHead = table?.querySelector('thead');
          if (!caseTabs || !sectionHead || !table || !caseHead) return;
          caseHead.id = 'caseHead';

          const toolbar = document.createElement('div');
          toolbar.className = 'case-toolbar';
          const viewTabs = document.createElement('div');
          viewTabs.className = 'view-tabs';
          viewTabs.innerHTML = '<button class="view-tab active" data-case-view="replay" type="button">覆盤欄位</button><button class="view-tab" data-case-view="prediction" type="button">預測欄位＋實際收盤</button>';
          caseTabs.parentNode.insertBefore(toolbar, caseTabs);
          toolbar.append(viewTabs, caseTabs);

          state.caseViewMode = 'replay';
          state.caseSorts = {
            replay: { key: 'stock', dir: 'asc' },
            prediction: { key: 'relative7d', dir: 'desc' },
          };
          state.predictionRowsByCode = null;
          state.actualRowsByCode = null;
          state.detailLoadPromise = null;

          const valueMissing = value => value === null || value === undefined || value === '' || (typeof value === 'number' && !Number.isFinite(value));
          const formatNumber = value => Number.isFinite(num(value)) ? num(value).toFixed(2) : 'NA';
          const formatPrice = value => Number.isFinite(num(value)) ? num(value).toLocaleString('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : 'NA';
          const yahooUrl = code => \`https://tw.stock.yahoo.com/quote/\${encodeURIComponent(String(code))}.TW/technical-analysis\`;
          const predictionDetail = row => state.predictionRowsByCode?.get(String(row.stock_code)) || row.prediction || {};
          const actualDetail = row => state.actualRowsByCode?.get(String(row.stock_code))?.actual || row.actual || {};

          async function ensurePredictionViewData() {
            if (state.predictionRowsByCode && state.actualRowsByCode) return;
            if (state.detailLoadPromise) return state.detailLoadPromise;
            state.detailLoadPromise = Promise.all([
              fetchJson(\`data_predictions/\${state.date}/summary.json\`),
              fetchJson(\`data_predictions/\${state.date}/replay.json\`),
            ]).then(([predictionSummary, replayData]) => {
              state.predictionRowsByCode = new Map((predictionSummary.stocks || []).map(row => [String(row.stock_code), row]));
              state.actualRowsByCode = new Map((replayData.rows || []).map(row => [String(row.stock_code), row]));
            }).finally(() => {
              state.detailLoadPromise = null;
            });
            return state.detailLoadPromise;
          }

          function renderViewTabs() {
            viewTabs.querySelectorAll('[data-case-view]').forEach(button => {
              button.classList.toggle('active', button.dataset.caseView === state.caseViewMode);
            });
          }

          async function setCaseView(mode) {
            if (mode === state.caseViewMode) return;
            if (mode === 'prediction') {
              const button = viewTabs.querySelector('[data-case-view="prediction"]');
              button.disabled = true;
              button.textContent = '載入預測欄位中…';
              try {
                await ensurePredictionViewData();
              } catch (error) {
                document.getElementById('caseSummary').textContent = \`預測欄位載入失敗：\${error.message}\`;
                return;
              } finally {
                button.disabled = false;
                button.textContent = '預測欄位＋實際收盤';
              }
            }
            state.caseViewMode = mode;
            renderViewTabs();
            enhancedRenderCases();
          }

          function sortMark(key) {
            const sort = state.caseSorts[state.caseViewMode];
            return sort.key === key ? (sort.dir === 'desc' ? ' ↓' : ' ↑') : '';
          }

          function headerButton(key, label) {
            return \`<button type="button" class="case-sort-button" data-case-sort="\${key}">\${label}\${sortMark(key)}</button>\`;
          }

          function renderCaseHead() {
            const replayColumns = [
              ['stock', '股票'], ['industry', '產業'], ['direction', '事前方向'], ['actualReturn', '實際報酬'],
              ['mood', '實際氛圍'], ['result', '判定'], ['reasons', '原因標籤'], ['marketPosition', '市場相對位置'],
            ];
            const predictionColumns = [
              ['actualClose', '實際收盤'], ['report', '報告'], ['stock', '股票'], ['industry', '產業'], ['direction', '方向'],
              ['score', '分數'], ['risk', '個股風險'], ['completeness', '完整度'], ['r1', 'r1'], ['r3', 'r3'],
              ['relative7d', '7日RS'], ['rsMode', 'RS型態'], ['rsi', 'RSI'], ['volume', '量比'], ['chip', '籌碼'], ['signals', '翻轉訊號'],
            ];
            const columns = state.caseViewMode === 'prediction' ? predictionColumns : replayColumns;
            table.className = state.caseViewMode === 'prediction' ? 'prediction-list-table' : 'replay-list-table';
            caseHead.innerHTML = \`<tr>\${columns.map(([key, label]) => \`<th>\${headerButton(key, label)}</th>\`).join('')}</tr>\`;
          }

          function caseSortValue(row, key) {
            const prediction = predictionDetail(row);
            const actual = actualDetail(row);
            const signals = (prediction.reversal_signals?.tags || []).join('、');
            const common = {
              actualClose: actual.close,
              report: row.stock_code,
              stock: \`\${row.stock_name || prediction.stock_name || ''} \${row.stock_code}\`,
              industry: row.industry || prediction.industry,
              direction: prediction.final_direction_label || row.prediction?.final_direction_label,
              score: prediction.direction_score,
              risk: prediction.risk_label,
              completeness: prediction.data_completeness,
              r1: prediction.features?.r1,
              r3: prediction.features?.r3,
              relative7d: prediction.relative_strength_7d?.relative_strength_7d,
              rsMode: prediction.relative_strength_7d?.relative_strength_mode || 'NA',
              rsi: prediction.features?.rsi14,
              volume: prediction.features?.volume_ratio_1d,
              chip: prediction.chip_bias,
              signals,
              actualReturn: row.actual?.close_return,
              mood: row.actual?.mood_label,
              result: row.prediction_match_label,
              reasons: (row.reason_tags || []).join('、'),
              marketPosition: row.market_relative?.market_percentile,
            };
            return common[key];
          }

          function compareCaseRows(left, right) {
            const sort = state.caseSorts[state.caseViewMode];
            const leftValue = caseSortValue(left, sort.key);
            const rightValue = caseSortValue(right, sort.key);
            const missingLeft = valueMissing(leftValue);
            const missingRight = valueMissing(rightValue);
            if (missingLeft && missingRight) return String(left.stock_code).localeCompare(String(right.stock_code), 'zh-Hant', { numeric: true });
            if (missingLeft) return 1;
            if (missingRight) return -1;
            let result = Number.isFinite(Number(leftValue)) && Number.isFinite(Number(rightValue))
              ? Number(leftValue) - Number(rightValue)
              : String(leftValue).localeCompare(String(rightValue), 'zh-Hant', { numeric: true });
            if (result === 0) result = String(left.stock_code).localeCompare(String(right.stock_code), 'zh-Hant', { numeric: true });
            return sort.dir === 'desc' ? -result : result;
          }

          function renderReplayRows(rows) {
            return rows.map(item => {
              const returnValue = item.actual?.close_return;
              const directionLabel = item.prediction?.final_direction_label || '—';
              return \`<tr>
                <td><a class="stock-link" href="\${esc(item.report_file)}" target="_top">\${esc(item.stock_name)} <b>\${esc(item.stock_code)}</b></a></td>
                <td>\${esc(item.industry)}</td>
                <td><span class="pill \${directionClass(directionLabel)}">\${esc(directionLabel)}</span></td>
                <td class="\${num(returnValue) >= 0 ? 'positive' : 'negative'}"><b>\${signedPct(returnValue)}</b></td>
                <td>\${esc(item.actual?.mood_label || '—')}<br><span class="kpi-sub">\${esc((item.actual?.pattern_tags || []).join('、'))}</span></td>
                <td><span class="pill \${caseClass(item.prediction_match_label)}">\${esc(item.prediction_match_label)}</span></td>
                <td class="tags">\${esc((item.reason_tags || []).join('、') || '—')}</td>
                <td>\${esc(marketEffectLabels[item.market_relative?.classification] || item.market_relative?.classification || '—')}<br><span class="kpi-sub">市場百分位 \${num(item.market_relative?.market_percentile)?.toFixed(1) ?? 'NA'}</span></td>
              </tr>\`;
            }).join('');
          }

          function renderPredictionRows(rows) {
            return rows.map(item => {
              const prediction = predictionDetail(item);
              const actual = actualDetail(item);
              const returnValue = item.actual?.close_return;
              const directionLabel = prediction.final_direction_label || item.prediction?.final_direction_label || '—';
              const reportFile = prediction.report_file || item.report_file || '';
              const closeText = \`\${formatPrice(actual.close)} (\${signedPct(returnValue)})\`;
              return \`<tr>
                <td class="actual-close \${num(returnValue) >= 0 ? 'positive' : 'negative'}">\${closeText}</td>
                <td>\${reportFile ? \`<a class="stock-link" href="\${esc(reportFile)}" target="_top">個股</a>\` : '—'}</td>
                <td><a class="stock-link" href="\${esc(yahooUrl(item.stock_code))}" target="_blank" rel="noopener noreferrer">\${esc(prediction.stock_name || item.stock_name)} <b>\${esc(item.stock_code)}</b></a></td>
                <td>\${esc(prediction.industry || item.industry || '—')}</td>
                <td><span class="pill \${directionClass(directionLabel)}">\${esc(directionLabel)}</span></td>
                <td>\${formatNumber(prediction.direction_score)}</td>
                <td><span class="pill">\${esc(prediction.risk_label || '—')}</span></td>
                <td>\${Number.isFinite(num(prediction.data_completeness)) ? \`\${num(prediction.data_completeness).toFixed(0)}%\` : 'NA'}</td>
                <td>\${formatNumber(prediction.features?.r1)}</td>
                <td>\${formatNumber(prediction.features?.r3)}</td>
                <td>\${formatNumber(prediction.relative_strength_7d?.relative_strength_7d)}</td>
                <td>\${esc(prediction.relative_strength_7d?.relative_strength_mode || 'NA')}</td>
                <td>\${formatNumber(prediction.features?.rsi14)}</td>
                <td>\${formatNumber(prediction.features?.volume_ratio_1d)}</td>
                <td>\${esc(prediction.chip_bias || '—')}</td>
                <td class="tags">\${esc((prediction.reversal_signals?.tags || []).join('、') || '—')}</td>
              </tr>\`;
            }).join('');
          }

          function enhancedRenderCases() {
            document.querySelectorAll('#caseTabs .tab').forEach(button => {
              button.classList.toggle('active', button.dataset.cases === state.caseType);
            });
            renderViewTabs();
            renderCaseHead();

            const scopeRows = rowsInActiveScope();
            const hitCount = scopeRows.filter(item => item.prediction_match_label === '明顯準確').length;
            const missCount = scopeRows.filter(item => item.prediction_match_label === '明顯不準').length;
            document.getElementById('hitTabCount').textContent = \`(\${hitCount})\`;
            document.getElementById('missTabCount').textContent = \`(\${missCount})\`;
            document.getElementById('allTabCount').textContent = \`(\${scopeRows.length})\`;

            const activeScope = document.getElementById('activeScope');
            if (state.selection) {
              activeScope.classList.remove('hidden');
              document.getElementById('activeScopeTitle').textContent = \`目前範圍：\${state.selection.label}\`;
              document.getElementById('activeScopeDetail').textContent =
                \`共 \${scopeRows.length.toLocaleString()} 筆，可直接切換明顯準確 \${hitCount.toLocaleString()} 筆／明顯不準 \${missCount.toLocaleString()} 筆。\`;
            } else {
              activeScope.classList.add('hidden');
            }

            const source = state.caseType === 'hits'
              ? scopeRows.filter(item => item.prediction_match_label === '明顯準確')
              : state.caseType === 'misses'
                ? scopeRows.filter(item => item.prediction_match_label === '明顯不準')
                : scopeRows;
            const q = document.getElementById('caseSearch').value.trim().toLowerCase();
            const direction = document.getElementById('caseDirection').value;
            const industry = document.getElementById('caseIndustry').value;
            const rows = source.filter(item => {
              const prediction = predictionDetail(item);
              const haystack = [
                item.stock_code, item.stock_name, item.industry,
                prediction.stock_name, prediction.industry,
                ...(item.reason_tags || []),
                ...(item.actual?.pattern_tags || []),
                ...(prediction.reversal_signals?.tags || []),
              ].join(' ').toLowerCase();
              return (!q || haystack.includes(q))
                && (!direction || item.prediction?.final_direction_label === direction)
                && (!industry || item.industry === industry);
            }).sort(compareCaseRows);

            const typeLabel = state.caseType === 'hits' ? '明顯準確' : state.caseType === 'misses' ? '明顯不準' : '全部樣本';
            const fieldLabel = state.caseViewMode === 'prediction' ? '預測欄位＋實際收盤' : '覆盤欄位';
            document.getElementById('caseSummary').textContent =
              \`\${state.selection ? \`\${state.selection.label} · \` : ''}\${typeLabel}共 \${source.length.toLocaleString()} 筆，目前顯示 \${rows.length.toLocaleString()} 筆完整清單 · \${fieldLabel}。\`;
            document.getElementById('caseRows').innerHTML = state.caseViewMode === 'prediction'
              ? (renderPredictionRows(rows) || '<tr><td colspan="16">沒有符合條件的案例。</td></tr>')
              : (renderReplayRows(rows) || '<tr><td colspan="8">沒有符合條件的案例。</td></tr>');
          }

          renderCases = enhancedRenderCases;
          window.setCaseView = setCaseView;

          viewTabs.addEventListener('click', event => {
            const button = event.target.closest('[data-case-view]');
            if (button) setCaseView(button.dataset.caseView);
          });
          caseHead.addEventListener('click', event => {
            const button = event.target.closest('[data-case-sort]');
            if (!button) return;
            const sort = state.caseSorts[state.caseViewMode];
            if (sort.key === button.dataset.caseSort) sort.dir = sort.dir === 'desc' ? 'asc' : 'desc';
            else {
              sort.key = button.dataset.caseSort;
              sort.dir = 'desc';
            }
            enhancedRenderCases();
          });
          ['caseSearch', 'caseDirection', 'caseIndustry'].forEach(id => {
            const element = document.getElementById(id);
            element.addEventListener(id === 'caseSearch' ? 'input' : 'change', () => queueMicrotask(enhancedRenderCases));
          });

          enhancedRenderCases();
        })();
      `;
      documentRef.body.appendChild(script);
    }

    async function load() {
      const params = new URLSearchParams(location.search);
      const requestedDate = compact(params.get('date'));
      const manifest = await fetchJson('data_predictions/manifest.json');
      const dates = [...new Set([
        requestedDate,
        ...(manifest.available_dates || []),
        manifest.latest_date,
        manifest.forecast_date_compact,
      ].map(compact).filter(date => /^20\d{6}$/.test(date)))].sort().reverse();

      const availableDates = [];
      for (const date of dates) {
        if (await replayFilesExist(date)) availableDates.push(date);
      }

      if (!availableDates.length) {
        throw new Error('目前沒有已完成覆盤的日期。請先執行覆盤 Action 產生 replay-summary.json 與 replay-dashboard.json。');
      }

      const selectedDate = requestedDate && availableDates.includes(requestedDate)
        ? requestedDate
        : availableDates[0];

      const canonicalUrl = new URL(location.href);
      canonicalUrl.searchParams.set('date', selectedDate);
      history.replaceState(null, '', canonicalUrl);

      statusElement.textContent = requestedDate && requestedDate !== selectedDate
        ? `${requestedDate} 尚未完成覆盤，已切換到最新可用日期 ${selectedDate}。`
        : `正在載入 ${selectedDate} 覆盤資料…`;

      viewer.addEventListener('load', () => {
        try {
          const documentRef = viewer.contentDocument;
          replaceReplayDateSelect(documentRef, availableDates, selectedDate);
          promoteInternalLinks(documentRef);
          installReplayListEnhancement(documentRef);
        } catch (error) {
          console.warn('Unable to adjust embedded replay dashboard:', error);
        }
        loader.style.display = 'none';
        viewer.style.display = 'block';
      }, { once: true });

      viewer.src = `prediction-replay-dashboard-view.html?date=${encodeURIComponent(selectedDate)}`;
    }

    load().catch(error => {
      statusElement.className = 'note error';
      statusElement.innerHTML = `${error.message}<br><br><a href="index.html">回工具首頁</a>`;
    });
  </script>
</body>
</html>
