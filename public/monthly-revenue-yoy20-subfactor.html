<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>月營收 YoY≥20% 子因子實驗</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1500px;margin:0 auto;padding:20px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:16px;box-shadow:0 5px 18px rgba(15,23,42,.06)}.head{padding:20px}.head h1{margin:0 0 8px;font-size:26px}.muted,.note{color:#64748b}.bar{padding:14px 18px}.bar select{height:38px;border:1px solid #cbd5e1;border-radius:7px;padding:0 10px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1250px}th,td{padding:10px 12px;border-bottom:1px solid #e2e8f0;text-align:right;white-space:nowrap;font-size:13px}th{background:#f8fafc;position:sticky;top:0;cursor:pointer}th:nth-child(2),td:nth-child(2){text-align:left}.positive{color:#b91c1c;font-weight:800}.negative{color:#047857;font-weight:800}.top{background:#fffbeb}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px}.card{border:1px solid #e2e8f0;border-radius:10px;padding:14px}.card b{display:block;font-size:22px;margin-top:5px}.section-title{padding:16px 18px 8px;font-size:18px;font-weight:900}.note{padding:0 18px 14px;font-size:13px;line-height:1.6}.error{padding:14px 18px;color:#b91c1c;display:none}@media(max-width:900px){.wrap{padding:10px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div class="wrap">
<section class="panel head"><h1>月營收 YoY ≥20% 子因子實驗</h1><div class="muted">比較營收成長區間、持續性、MoM、加速與 3/6/12 月新高，全部相對同月份上市股票母體評估。</div></section>
<section class="panel bar">評估期間： <select id="h"><option>d1</option><option>d3</option><option selected>d5</option><option>d10</option><option>d20</option></select></section>
<div id="err" class="panel error"></div><section class="panel"><div id="cards" class="cards"></div></section>
<section class="panel"><div class="section-title">子因子排名</div><div class="note">研究分數只用來排序實驗優先級。12 月新高必須真的有完整 12 個月營收資料；目前資料不足時會保持 0 樣本，不會拿「目前可取得月份」冒充 12 月。</div><div class="table-wrap"><table><thead><tr><th>排名</th><th>子因子</th><th>研究分數</th><th>樣本</th><th>月份</th><th>因子勝率</th><th>母體勝率</th><th>勝率提升pp</th><th>因子平均超額%</th><th>母體平均超額%</th><th>超額提升%</th><th>勝率提升月份率</th><th>超額提升月份率</th><th>穩定度</th></tr></thead><tbody id="body"></tbody></table></div></section>
</div><script>
const BASE=location.pathname.includes('/stock_data/')?'/stock_data':'';let p=null;const $=id=>document.getElementById(id),fmt=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'—',cls=v=>Number(v)>0?'positive':Number(v)<0?'negative':'';
function render(){const h=$('h').value,rows=(p?.rankings||[]).filter(r=>r.horizon===h).sort((a,b)=>(b.ranking_score??-1)-(a.ranking_score??-1));const best=rows.find(r=>r.samples>0);$('cards').innerHTML=[['研究區間',`${p?.start_month||'—'}～${p?.end_month||'—'}`],['期間',h.toUpperCase()],['可比較子因子',rows.filter(r=>r.samples>0).length],['目前最高分',best?.factor_name||'—']].map(([l,v])=>`<div class="card"><span class="muted">${l}</span><b>${v}</b></div>`).join('');$('body').innerHTML=rows.map((r,i)=>`<tr class="${i<3&&r.samples>0?'top':''}"><td>${r.samples?i+1:'—'}</td><td>${r.factor_name}</td><td>${fmt(r.ranking_score)}</td><td>${r.samples||0}</td><td>${r.covered_months||0}</td><td>${fmt(r.relative_win_rate)}%</td><td>${fmt(r.universe_relative_win_rate)}%</td><td class="${cls(r.relative_win_rate_uplift_pp)}">${fmt(r.relative_win_rate_uplift_pp)}</td><td>${fmt(r.avg_excess_return_pct)}</td><td>${fmt(r.universe_avg_excess_return_pct)}</td><td class="${cls(r.avg_excess_uplift_pct)}">${fmt(r.avg_excess_uplift_pct)}</td><td>${fmt(r.positive_win_uplift_month_rate)}%</td><td>${fmt(r.positive_excess_uplift_month_rate)}%</td><td>${fmt(r.stability_score)}</td></tr>`).join('')}
async function load(){try{const r=await fetch(`${BASE}/data_prediction_analysis/monthly-revenue/monthly-signals/yoy20-subfactor-experiment.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);p=await r.json();render()}catch(e){$('err').style.display='block';$('err').textContent=`無法載入子因子實驗：${e.message}`}}$('h').onchange=render;load();
</script></body></html>
