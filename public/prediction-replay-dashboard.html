<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票預測覆盤 Dashboard</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}#viewer{display:none;width:100%;height:100%;border:0;background:#f4f6f8}.shell{min-height:100%;display:grid;place-items:center;padding:24px}.card{width:min(100%,560px);background:#fff;border:1px solid #d9e0e8;border-radius:10px;padding:24px;box-shadow:0 1px 2px rgba(23,32,51,.05)}h1{margin:0 0 10px;font-size:24px}.note{color:#667085;line-height:1.6}.error{color:#a33a3a}a{color:#1f5f98;font-weight:800}
  </style>
</head>
<body>
  <main class="shell" id="loader">
    <section class="card">
      <h1>股票預測覆盤 Dashboard</h1>
      <div class="note" id="status">正在尋找最新可用的覆盤日期…</div>
    </section>
  </main>
  <iframe id="viewer" title="股票預測覆盤 Dashboard"></iframe>
  <script>
    const loader = document.getElementById('loader');
    const statusElement = document.getElementById('status');
    const viewer = document.getElementById('viewer');
    const compact = value => String(value || '').replaceAll('-', '').replaceAll('/', '');

    async function fetchJson(path) {
      const response = await fetch(`../${path}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`找不到 ${path}`);
      return response.json();
    }

    async function replayFilesExist(date) {
      const base = `../data_predictions/${date}`;
      const paths = [`${base}/replay-summary.json`, `${base}/replay-dashboard.json`];
      try {
        const responses = await Promise.all(paths.map(path => fetch(path, { method: 'HEAD', cache: 'no-store' })));
        return responses.every(response => response.ok);
      } catch {
        return false;
      }
    }

    function replaceReplayDateSelect(documentRef, availableDates, selectedDate) {
      const current = documentRef.getElementById('dateSelect');
      if (!current) return;
      const replacement = current.cloneNode(false);
      replacement.innerHTML = availableDates.map(date =>
        `<option value="${date}" ${date === selectedDate ? 'selected' : ''}>${date}</option>`
      ).join('');
      replacement.addEventListener('change', event => {
        const next = new URL(location.href);
        next.searchParams.set('date', event.target.value);
        location.href = next;
      });
      current.replaceWith(replacement);
    }

    function promoteInternalLinks(documentRef) {
      documentRef.querySelectorAll('a[href]').forEach(link => {
        const href = link.getAttribute('href') || '';
        if (href && !href.startsWith('http:') && !href.startsWith('https:') && !href.startsWith('#')) {
          link.setAttribute('target', '_top');
        }
      });
    }

    async function load() {
      const params = new URLSearchParams(location.search);
      const requestedDate = compact(params.get('date'));
      const manifest = await fetchJson('data_predictions/manifest.json');
      const dates = [...new Set([
        requestedDate,
        ...(manifest.available_dates || []),
        manifest.latest_date,
        manifest.forecast_date_compact,
      ].map(compact).filter(date => /^20\d{6}$/.test(date)))].sort().reverse();

      const availableDates = [];
      for (const date of dates) {
        if (await replayFilesExist(date)) availableDates.push(date);
      }

      if (!availableDates.length) {
        throw new Error('目前沒有已完成覆盤的日期。請先執行覆盤 Action 產生 replay-summary.json 與 replay-dashboard.json。');
      }

      const selectedDate = requestedDate && availableDates.includes(requestedDate)
        ? requestedDate
        : availableDates[0];

      const canonicalUrl = new URL(location.href);
      canonicalUrl.searchParams.set('date', selectedDate);
      history.replaceState(null, '', canonicalUrl);

      statusElement.textContent = requestedDate && requestedDate !== selectedDate
        ? `${requestedDate} 尚未完成覆盤，已切換到最新可用日期 ${selectedDate}。`
        : `正在載入 ${selectedDate} 覆盤資料…`;

      viewer.addEventListener('load', () => {
        try {
          const documentRef = viewer.contentDocument;
          replaceReplayDateSelect(documentRef, availableDates, selectedDate);
          promoteInternalLinks(documentRef);
        } catch (error) {
          console.warn('Unable to adjust embedded replay dashboard navigation:', error);
        }
        loader.style.display = 'none';
        viewer.style.display = 'block';
      }, { once: true });

      viewer.src = `prediction-replay-dashboard-view.html?date=${encodeURIComponent(selectedDate)}`;
    }

    load().catch(error => {
      statusElement.className = 'note error';
      statusElement.innerHTML = `${error.message}<br><br><a href="index.html">回工具首頁</a>`;
    });
  </script>
</body>
</html>
