<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票預測覆盤 Dashboard</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}body{display:flex;flex-direction:column}.switchbar{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:54px;padding:8px 16px;border-bottom:1px solid #d9e0e8;background:#fff;box-shadow:0 1px 2px rgba(23,32,51,.05);z-index:10}.switch-title{display:flex;align-items:center;gap:10px;min-width:0}.switch-title strong{white-space:nowrap}.switch-date{color:#667085;font-size:13px;font-weight:800}.switch-nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.switch-nav a{min-height:36px;display:inline-flex;align-items:center;border:1px solid #c7d1dd;border-radius:7px;background:#fff;color:#24425f;padding:7px 10px;font-size:13px;font-weight:800;text-decoration:none}.switch-nav a.active{background:#183b56;border-color:#183b56;color:#fff}.switch-nav a:hover{border-color:#91b2d1;background:#eaf2fa;color:#24425f}.switch-nav a.active:hover{background:#183b56;color:#fff}.viewer{width:100%;min-height:0;flex:1;border:0;background:#f4f6f8}@media(max-width:820px){.switchbar{align-items:flex-start;flex-direction:column}.switch-nav{width:100%}.switch-nav a{flex:1 1 auto;justify-content:center;text-align:center}}
  </style>
</head>
<body>
  <header class="switchbar">
    <div class="switch-title"><strong>股票預測覆盤</strong><span class="switch-date" id="currentDate">載入日期中…</span></div>
    <nav class="switch-nav" aria-label="覆盤報告切換">
      <a class="active" id="replayLink" href="#">覆盤總覽</a>
      <a id="factorLink" href="prediction-replay-factor-dashboard.html">產業 r1／r3／7日RS</a>
      <a id="volumeLink" href="prediction-replay-volume-dashboard.html">成交量排除測試</a>
      <a id="forecastLink" href="prediction-dashboard.html">事前預測</a>
    </nav>
  </header>
  <iframe class="viewer" id="viewer" title="股票預測覆盤 Dashboard"></iframe>
  <script>
    const viewer=document.getElementById('viewer');
    const currentDate=document.getElementById('currentDate');
    const factorLink=document.getElementById('factorLink');
    const volumeLink=document.getElementById('volumeLink');
    const forecastLink=document.getElementById('forecastLink');
    const compact=value=>String(value||'').replaceAll('-','').replaceAll('/','');
    const requestedDate=compact(new URLSearchParams(location.search).get('date'));
    function applyDate(date){
      const valid=/^20\d{6}$/.test(date)?date:'';
      currentDate.textContent=valid?`覆盤日 ${valid}`:'自動選擇最新已完成覆盤';
      factorLink.href=`prediction-replay-factor-dashboard.html${valid?`?date=${encodeURIComponent(valid)}`:''}`;
      volumeLink.href=`prediction-replay-volume-dashboard.html${valid?`?date=${encodeURIComponent(valid)}`:''}`;
      forecastLink.href=`prediction-dashboard.html${valid?`?date=${encodeURIComponent(valid)}`:''}`;
      if(valid){const url=new URL(location.href);url.searchParams.set('date',valid);history.replaceState(null,'',url);}
    }
    function injectReplayEnhancements(nestedViewer){
      const inject=()=>{
        try{
          const documentRef=nestedViewer.contentDocument;
          const windowRef=nestedViewer.contentWindow;
          if(!documentRef?.body)return;
          const scripts=[
            ['replay-same-day-margin-rebound-data','prediction-replay-same-day-margin-rebound-data.js?v=1'],
            ['replay-priority-enhancement','prediction-replay-priority-enhancement.js?v=3'],
            ['replay-formal-strategy-enhancement','prediction-replay-formal-strategy-enhancement.js?v=5'],
            ['replay-zero-error-strategy-enhancement','prediction-replay-zero-error-strategy-enhancement.js?v=3'],
            ['rebound-evaluation-policy','rebound-evaluation-policy.js?v=1'],
            ['replay-strategy-result-judgement-enhancement','prediction-replay-strategy-result-judgement-enhancement.js?v=2'],
          ];
          scripts.forEach(([id,src])=>{
            if(documentRef.getElementById(id))return;
            if(id==='replay-formal-strategy-enhancement'){
              windowRef.__replayFormalStrategyEnhancementInstalled=false;
              windowRef.__formalStrategySelectionSupportInstalled=false;
            }
            if(id==='replay-zero-error-strategy-enhancement'){
              windowRef.__replayZeroErrorStrategyClustersInstalled=false;
            }
            if(id==='replay-strategy-result-judgement-enhancement'){
              windowRef.__replayStrategyResultJudgementInstalled=false;
            }
            const script=documentRef.createElement('script');
            script.id=id;
            script.async=false;
            script.src=src;
            documentRef.body.appendChild(script);
          });
        }catch(error){console.warn('Unable to inject replay enhancements:',error);}
      };
      nestedViewer.addEventListener('load',inject);
      try{
        if(nestedViewer.getAttribute('src')&&nestedViewer.contentDocument?.readyState==='complete')inject();
      }catch(error){console.warn('Unable to inspect nested replay viewer:',error);}
    }
    function installNestedEnhancements(){
      try{
        const nestedViewer=viewer.contentDocument?.getElementById('viewer');
        if(nestedViewer)injectReplayEnhancements(nestedViewer);
      }catch(error){console.warn('Unable to install nested replay enhancements:',error);}
    }
    viewer.addEventListener('load',()=>{
      try{const date=compact(new URL(viewer.contentWindow.location.href).searchParams.get('date'));if(date)applyDate(date);}catch(error){console.warn('Unable to read embedded replay date:',error);}
      installNestedEnhancements();
    });
    applyDate(requestedDate);
    viewer.src=`prediction-replay-dashboard-embedded.html${requestedDate?`?date=${encodeURIComponent(requestedDate)}`:''}`;
  </script>
</body>
</html>
