<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>個股預測報告</title>
  <style>
    :root{color-scheme:dark;--bg:#07100e;--surface:rgba(15,29,27,.92);--line:rgba(178,214,201,.16);--text:#f2f8f5;--muted:#9ab0a8;--green:#46dfa8;--cyan:#61c8db;--amber:#ffc85c;--red:#ff7285;--shadow:0 28px 90px rgba(0,0,0,.32)}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at 12% -8%,rgba(70,223,168,.17),transparent 34rem),radial-gradient(circle at 92% 5%,rgba(97,200,219,.14),transparent 31rem),var(--bg);color:var(--text);font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.65}.page{width:min(1120px,calc(100% - 32px));margin:auto;padding:48px 0 72px}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.nav a{border:1px solid var(--line);background:rgba(15,29,27,.72);border-radius:8px;padding:8px 12px;color:#d8eee6;text-decoration:none;font-weight:800;font-size:.9rem}.hero,.card,.scenario,.level,.meta{border:1px solid var(--line);background:var(--surface)}.hero{padding:clamp(28px,5vw,54px);border-radius:28px;background:linear-gradient(135deg,rgba(23,48,42,.96),rgba(9,18,17,.93));box-shadow:var(--shadow)}.eyebrow,.kicker{margin:0;color:var(--cyan);font-size:.76rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{margin:14px 0 12px;font-size:clamp(2rem,5.6vw,4.45rem);line-height:1.04;letter-spacing:0}h1 span{color:var(--muted);font-weight:550}.lead{max-width:860px;margin:0;color:#c5d5cf}.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.pill{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(4,11,10,.34);color:#c8d8d2;font-size:.84rem}.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;margin-top:18px;padding:clamp(24px,4vw,36px);border:1px solid rgba(255,200,92,.26);border-radius:24px;background:linear-gradient(115deg,rgba(255,200,92,.1),var(--surface))}.verdict h2{margin:4px 0 8px}.verdict p{margin:0;color:#c4d2cd}.badge{display:grid;width:140px;height:140px;place-content:center;border:12px solid rgba(255,200,92,.15);border-top-color:var(--amber);border-right-color:var(--amber);border-radius:50%;text-align:center}.badge strong{color:var(--amber);font-size:1.5rem}.badge span{color:var(--muted);font-size:.73rem}section{margin-top:52px}section h2{margin:7px 0 18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card,.scenario{padding:22px;border-radius:18px}.label{display:block;color:var(--muted);font-size:.8rem}.card strong{display:block;margin:9px 0 5px;color:var(--green);font-size:1.45rem}.card p,.scenario p{margin:0;color:#bdccc7;font-size:.9rem}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}table{width:100%;min-width:720px;border-collapse:collapse}th,td{padding:14px 16px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:.78rem}.positive{color:var(--green);font-weight:750}.negative{color:var(--red);font-weight:750}.neutral{color:var(--amber);font-weight:750}.levels{display:grid;gap:10px}.level{display:grid;grid-template-columns:110px 120px minmax(0,1fr);gap:18px;align-items:center;padding:15px 18px;border-radius:14px}.level span{color:var(--muted)}.level strong{color:var(--cyan)}.level p{margin:0;color:#bac9c4}.note{padding:18px 20px;border-left:3px solid var(--amber);background:rgba(255,200,92,.1);color:#d3d9d6}.meta{margin-top:14px;padding:20px;border-radius:18px}.meta dl{display:grid;grid-template-columns:220px 1fr;gap:8px 18px;margin:0}.meta dt{color:var(--muted)}.meta dd{margin:0}code{color:#a8e6d2}.error{margin-top:24px;padding:18px 20px;border:1px solid rgba(255,114,133,.32);border-radius:12px;background:rgba(255,114,133,.1);color:#ffd9de}footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}@media(max-width:900px){.grid{grid-template-columns:1fr}.verdict{grid-template-columns:1fr}}@media(max-width:650px){.page{width:min(100% - 20px,1120px);padding-top:10px}.level{grid-template-columns:85px 1fr}.level p{grid-column:1/-1}.meta dl{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="page">
  <nav class="nav" id="nav"></nav>
  <div id="content"><div class="hero"><p class="eyebrow">Loading</p><h1>個股預測報告</h1><p class="lead">載入中</p></div></div>
</main>
<script>
  const metadataFields=['methodology_version','generated_at','prediction_mode','stock_code','stock_name','forecast_date','base_trade_date','information_cutoff','market','direction_score','raw_direction_label','risk_score','risk_label','stock_risk_score','stock_risk_label','market_context_risk_score','market_context_risk_label','combined_risk_score','combined_risk_label','final_direction_label','data_completeness','missing_data','missing_files','missing_indicators','data_quality_notes','backtest_rule_id','backtest_status'];
  const esc=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
  const compact=value=>String(value||'').replaceAll('-','');
  const params=new URLSearchParams(location.search);
  function renderPills(items=[]){return items.map(item=>`<span class="pill">${esc(item)}</span>`).join('');}
  function renderCards(items=[]){return items.map(item=>`<article class="card"><span class="label">${esc(item.label)}</span><strong>${esc(item.value)}</strong><p>${esc(item.description)}</p></article>`).join('');}
  function renderScores(items=[]){return items.map(item=>{const score=Number(item.score??0);const css=score>0?'positive':score<0?'negative':'neutral';return `<tr><td>${esc(item.item)}</td><td>${esc(item.value)}</td><td>${esc(item.rule)}</td><td class="${css}">${esc(score)}</td></tr>`;}).join('');}
  function renderScenarios(items=[]){return items.map(item=>`<article class="scenario"><span class="label">${esc(item.label)}</span><h3>${esc(item.title)}</h3><p>${esc(item.description)}</p><strong>${esc(item.target)}</strong></article>`).join('');}
  function renderLevels(items=[]){return items.map(item=>`<div class="level"><span>${esc(item.type)}</span><strong>${esc(item.price)}</strong><p>${esc(item.description)}</p></div>`).join('');}
  function renderMetadata(data){return metadataFields.map(key=>{let value=data[key];if(Array.isArray(value))value=value.join(', ')||'none';if(value===null||value===undefined)value='null';return `<dt>${esc(key)}</dt><dd><code>${esc(value)}</code></dd>`;}).join('');}
  function defaultView(data){return {meta_description:`${data.stock_name}（${data.stock_code}）${data.forecast_date} 下一交易日股價風險與情境預測`,page_title:`${data.forecast_date} ${data.stock_name}（${data.stock_code}）下一交易日預測報告`,lead:'依固定方法規格，以資訊截止時間前可取得的結構化資料評估下一交易日走勢。',hero_pills:[`預測日：${data.forecast_date}`,`基準交易日：${data.base_trade_date}`,`資訊截止：${data.information_cutoff}`,`市場：${data.market}`],verdict_title:data.final_direction_label,verdict_summary:'方向標籤由固定分數及風險降級規則產生。',risk_label:data.risk_label??'風險未標示',forecast_cards:[],facts:[],scores:[],scenarios:[],levels:[],data_note:'請檢查 missing_data、missing_files 與 data_completeness 後再解讀結果。',footer:'本頁為規則化市場情境分析，不構成買賣建議。',...(data.view??{})};}
  function render(data){const view=defaultView(data);document.title=view.page_title;const date=compact(data.forecast_date);document.getElementById('nav').innerHTML=`<a href="prediction-dashboard.html?date=${date}">總覽</a><a href="prediction-industry-dashboard.html?date=${date}">產業解讀</a><a href="prediction-groups.html?date=${date}">策略分類</a>`;document.getElementById('content').innerHTML=`<header class="hero"><p class="eyebrow">Next-session forecast · ${esc(data.forecast_date)}</p><h1>${esc(data.stock_name)} <span>${esc(data.stock_code)}</span></h1><p class="lead">${esc(view.lead)}</p><div class="pills">${renderPills(view.hero_pills)}</div></header><div class="verdict"><div><p class="kicker">Verdict</p><h2>${esc(view.verdict_title)}</h2><p>${esc(view.verdict_summary)}</p></div><div class="badge"><strong>${esc(data.final_direction_label)}</strong><span>${esc(view.risk_label)}</span></div></div><section><p class="kicker">Forecast range</p><h2>下一交易日情境</h2><div class="grid">${renderCards(view.forecast_cards)}</div></section><section><p class="kicker">Known facts</p><h2>已知事實</h2><div class="grid">${renderCards(view.facts)}</div></section><section><p class="kicker">Direction score</p><h2>固定規則計分</h2><div class="table-wrap"><table><thead><tr><th>項目</th><th>數值</th><th>規則判定</th><th>分數</th></tr></thead><tbody>${renderScores(view.scores)}</tbody></table></div></section><section><p class="kicker">Scenarios</p><h2>情境分析</h2><div class="grid">${renderScenarios(view.scenarios)}</div></section><section><p class="kicker">Key levels</p><h2>關鍵價位</h2><div class="levels">${renderLevels(view.levels)}</div></section><section><p class="kicker">Data quality</p><h2>資料限制與方法欄位</h2><div class="note">${esc(view.data_note)}</div><div class="meta"><dl>${renderMetadata(data)}</dl></div></section><footer>${esc(view.footer)}</footer>`;}
  async function load(){const manifest=await fetch('../data_predictions/manifest.json').then(response=>response.json());const code=params.get('code');const date=params.get('date')||manifest.latest_date||manifest.forecast_date_compact;if(!code)throw new Error('缺少股票代號 code');const response=await fetch(`../data_predictions/${date}/${code}.json`);if(!response.ok)throw new Error(`找不到 ${date}/${code}.json`);render(await response.json());}
  load().catch(error=>{document.getElementById('content').innerHTML=`<div class="error">載入失敗：${esc(error.message)}</div>`;});
</script>
</body>
</html>
