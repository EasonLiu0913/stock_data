<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月營收產業分層研究</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1500px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:16px;box-shadow:0 5px 18px rgba(15,23,42,.06)}.head{padding:20px}.muted{color:#64748b}.tools{padding:14px 18px;display:flex;gap:12px;flex-wrap:wrap}.tools label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:#475569}.tools select{height:38px;border:1px solid #cbd5e1;border-radius:7px;padding:0 10px;background:#fff}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px}.card{border:1px solid #e2e8f0;border-radius:10px;padding:14px}.card b{display:block;font-size:22px;margin-top:5px}.table-wrap{overflow:auto;border-top:1px solid #e2e8f0}table{width:100%;border-collapse:collapse;min-width:1450px}th,td{padding:9px 11px;border-bottom:1px solid #e2e8f0;text-align:right;white-space:nowrap;font-size:13px}th{background:#f8fafc;position:sticky;top:0;cursor:pointer}th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}.good{color:#b91c1c;font-weight:800}.bad{color:#047857;font-weight:800}.low{opacity:.48}.note{padding:14px 18px;color:#64748b;font-size:12px;line-height:1.6}.err{display:none;padding:15px;color:#b91c1c}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}}</style></head><body><div class="wrap">
<section class="panel head"><h1>月營收產業分層研究</h1><div class="muted">四組 YoY ≥20% 候選因子 × 產業內母體 × TAIEX；低樣本保留但不參與排名。</div></section>
<section class="panel tools"><label>評估期間<select id="h"><option>d5</option><option>d10</option><option>d20</option></select></label><label>候選因子<select id="f"></select></label><label>可信度<select id="c"><option value="credible">只看可信</option><option value="all">全部</option></select></label></section>
<div id="err" class="panel err"></div><section class="panel"><div class="cards" id="cards"></div></section>
<section class="panel"><div class="table-wrap"><table><thead><tr><th data-k="rank">排名</th><th data-k="industry">產業</th><th data-k="credible">可信</th><th data-k="samples">樣本</th><th data-k="covered_months">月份</th><th data-k="factor_relative_win_rate">因子勝率</th><th data-k="industry_relative_win_rate">產業母體勝率</th><th data-k="industry_win_uplift_pp">產業內勝率提升</th><th data-k="market_win_uplift_pp">相對全市場提升</th><th data-k="factor_avg_excess_pct">因子平均超額</th><th data-k="industry_avg_excess_pct">產業平均超額</th><th data-k="industry_excess_uplift_pct">產業內超額提升</th><th data-k="market_excess_uplift_pct">相對全市場超額提升</th><th data-k="positive_industry_win_uplift_month_rate">正勝率提升月份</th><th data-k="positive_industry_excess_uplift_month_rate">正超額提升月份</th><th data-k="industry_research_score">研究分數</th></tr></thead><tbody id="body"></tbody></table></div><div class="note">可信門檻：至少 30 筆樣本且涵蓋至少 3 個月份。主要比較基準是「同產業、同月份、同 horizon」母體，因此可區分因子效果與產業本身強弱；TAIEX / 全市場 uplift 為第二層參考。</div></section></div><script>
const BASE=location.pathname.includes('/stock_data/')?'/stock_data':'';let p=null,sort={k:'industry_research_score',d:-1};const $=x=>document.getElementById(x),fmt=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'—',cls=v=>Number(v)>0?'good':Number(v)<0?'bad':'';function cmp(a,b){if(a==null&&b==null)return 0;if(a==null)return 1;if(b==null)return-1;const x=Number(a),y=Number(b);return Number.isFinite(x)&&Number.isFinite(y)?x-y:String(a).localeCompare(String(b),'zh-Hant')}
function filtered(){let a=(p?.rows||[]).filter(r=>r.horizon===$('h').value&&r.factor_id===$('f').value);if($('c').value==='credible')a=a.filter(r=>r.credible);const ranked=[...a].sort((x,y)=>cmp(y.industry_research_score,x.industry_research_score)).map((r,i)=>({...r,rank:i+1}));return ranked.sort((a,b)=>cmp(a[sort.k],b[sort.k])*sort.d)}
function render(){const rs=filtered(),best=[...rs].sort((a,b)=>cmp(b.industry_research_score,a.industry_research_score))[0];$('cards').innerHTML=[['研究區間',`${p?.start_month||'—'}～${p?.end_month||'—'}`],['產業列數',rs.length],['最高分產業',best?.industry||'—'],['最高研究分數',fmt(best?.industry_research_score)]].map(([l,v])=>`<div class="card"><span class="muted">${l}</span><b>${v}</b></div>`).join('');$('body').innerHTML=rs.map(r=>`<tr class="${r.credible?'':'low'}"><td>${r.rank}</td><td>${r.industry}</td><td>${r.credible?'是':'否'}</td><td>${r.samples}</td><td>${r.covered_months}</td><td>${fmt(r.factor_relative_win_rate)}%</td><td>${fmt(r.industry_relative_win_rate)}%</td><td class="${cls(r.industry_win_uplift_pp)}">${fmt(r.industry_win_uplift_pp)}pp</td><td class="${cls(r.market_win_uplift_pp)}">${fmt(r.market_win_uplift_pp)}pp</td><td>${fmt(r.factor_avg_excess_pct)}%</td><td>${fmt(r.industry_avg_excess_pct)}%</td><td class="${cls(r.industry_excess_uplift_pct)}">${fmt(r.industry_excess_uplift_pct)}%</td><td class="${cls(r.market_excess_uplift_pct)}">${fmt(r.market_excess_uplift_pct)}%</td><td>${fmt(r.positive_industry_win_uplift_month_rate)}%</td><td>${fmt(r.positive_industry_excess_uplift_month_rate)}%</td><td>${fmt(r.industry_research_score)}</td></tr>`).join('')}
async function load(){try{const r=await fetch(`${BASE}/data_prediction_analysis/monthly-revenue/monthly-signals/industry-breakdown.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);p=await r.json();$('f').innerHTML=(p.factors||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');render()}catch(e){$('err').style.display='block';$('err').textContent=`無法載入：${e.message}`}}['h','f','c'].forEach(id=>$(id).onchange=render);document.querySelectorAll('[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sort=sort.k===k?{k,d:-sort.d}:{k,d:k==='industry'?1:-1};render()});load();
</script></body></html>
