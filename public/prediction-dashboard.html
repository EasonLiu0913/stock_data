<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票預測總覽 Dashboard</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1440px;margin:0 auto;padding:24px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}.eyebrow{font-size:13px;font-weight:800;color:#526173}.title{margin:4px 0 0;font-size:30px;line-height:1.2}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{border:1px solid #cdd6e3;background:#fff;border-radius:6px;padding:9px 12px;color:#1f3b57;text-decoration:none;font-weight:800}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(8,minmax(0,1fr));margin-bottom:14px}.card{background:#fff;border:1px solid #dce3ec;border-radius:8px;padding:16px;box-shadow:0 1px 2px rgba(22,31,44,.04)}.label{font-size:12px;color:#697789;font-weight:800}.value{font-size:28px;font-weight:900;margin-top:5px}.sub{font-size:13px;color:#697789;margin-top:4px}.cols{grid-template-columns:1.1fr 1fr}.section-title{font-size:18px;margin:0 0 12px}.bars{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:96px 1fr 52px;gap:10px;align-items:center;font-size:13px}.track{height:10px;background:#edf1f6;border-radius:999px;overflow:hidden}.fill{height:100%;background:#376ca8}.table-wrap{overflow:auto;border:1px solid #dce3ec;border-radius:8px;background:#fff}table{width:100%;border-collapse:collapse;min-width:1080px}th,td{padding:10px 12px;border-bottom:1px solid #edf1f6;text-align:left;font-size:13px;white-space:nowrap}th{background:#f2f5f9;color:#475569;font-size:12px}tr:hover td{background:#f8fbff}.pill{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800;background:#eef2f7;color:#334155}.bull{background:#e8f7ef;color:#12623a}.bear{background:#fdeaea;color:#9e2f2f}.warn{background:#fff4db;color:#8a5a00}.link{color:#1d5f99;font-weight:800;text-decoration:none}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}input,select{height:38px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;padding:0 10px;color:#172033}.wide{grid-column:1/-1}@media(max-width:1200px){.kpis{grid-template-columns:repeat(4,1fr)}}@media(max-width:1000px){.cols{grid-template-columns:1fr 1fr}.topbar{align-items:flex-start;flex-direction:column}}@media(max-width:640px){.shell{padding:14px}.kpis,.cols{grid-template-columns:1fr}.title{font-size:24px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div><div class="eyebrow" id="meta">載入中</div><h1 class="title">股票預測總覽 Dashboard</h1></div>
      <nav class="nav"><a href="prediction-industry-dashboard.html">產業解讀</a><a href="prediction-groups.html">策略分類</a><a href="index.html">工具清單</a></nav>
    </div>
    <section class="grid kpis" id="kpis"></section>
    <section class="grid cols">
      <div class="card"><h2 class="section-title">方向分布</h2><div class="bars" id="directionBars"></div></div>
      <div class="card"><h2 class="section-title">風險與完整度</h2><div class="bars" id="riskBars"></div><div class="bars" id="qualityBars" style="margin-top:14px"></div></div>
      <div class="card"><h2 class="section-title">產業強弱摘要</h2><div class="table-wrap"><table><thead><tr><th>產業</th><th>檔數</th><th>平均分數</th><th>偏多</th><th>高風險</th><th>解讀</th></tr></thead><tbody id="industryRows"></tbody></table></div></div>
      <div class="card"><h2 class="section-title">策略分類摘要</h2><div class="table-wrap"><table><thead><tr><th>分類</th><th>檔數</th><th>平均分數</th><th>偏多</th><th>資料不足</th></tr></thead><tbody id="groupRows"></tbody></table></div></div>
      <div class="card wide">
        <h2 class="section-title">股票清單</h2>
        <div class="controls"><input id="q" placeholder="搜尋代號、名稱、產業" oninput="renderStocks()"><select id="direction" onchange="renderStocks()"><option value="">全部方向</option></select><select id="risk" onchange="renderStocks()"><option value="">全部風險</option></select><select id="industry" onchange="renderStocks()"><option value="">全部產業</option></select><select id="signal" onchange="renderStocks()"><option value="">全部翻轉訊號</option></select></div>
        <div class="table-wrap"><table><thead><tr><th>股票</th><th>產業</th><th>方向</th><th>分數</th><th>風險</th><th>完整度</th><th>r1</th><th>r3</th><th>RSI</th><th>量比</th><th>籌碼</th><th>翻轉訊號</th><th>報告</th></tr></thead><tbody id="stockRows"></tbody></table></div>
      </div>
    </section>
  </main>
  <script>
    let dashboard;
    const fmt=n=>Number.isFinite(n)?n.toFixed(2):'NA';
    const pct=n=>Number.isFinite(n)?`${n.toFixed(1)}%`:'NA';
    const cls=v=>String(v).includes('偏多')?'bull':String(v).includes('偏空')?'bear':String(v).includes('高')?'warn':'';
    const params=new URLSearchParams(location.search);
    let currentDate;
    async function loadDashboard(){const m=await fetch('../data_predictions/manifest.json').then(r=>r.json());currentDate=params.get('date')||m.latest_date||m.forecast_date_compact;const summaryPath=currentDate===m.latest_date&&m.latest_summary?m.latest_summary:`data_predictions/${currentDate}/summary.json`;dashboard=await fetch(`../${summaryPath}`).then(r=>{if(!r.ok)throw new Error(`找不到 ${summaryPath}`);return r.json();});init(m);}
    function withDate(file){return `${file}?date=${encodeURIComponent(currentDate)}`;}
    function barRows(obj,total){return Object.entries(obj).map(([k,v])=>`<div class="bar-row"><b>${k}</b><div class="track"><div class="fill" style="width:${total?v/total*100:0}%"></div></div><span>${v}</span></div>`).join('');}
    function init(manifest){document.querySelector('.nav').innerHTML=`<select id="dateSelect" onchange="location.href='prediction-dashboard.html?date='+this.value">${(manifest.available_dates||[currentDate]).map(date=>`<option value="${date}" ${date===currentDate?'selected':''}>${date}</option>`).join('')}</select><a href="${withDate('prediction-industry-dashboard.html')}">產業解讀</a><a href="${withDate('prediction-groups.html')}">策略分類</a><a href="index.html">工具清單</a>`;document.getElementById('meta').textContent=`預測日 ${dashboard.forecast_date}；基準日 ${dashboard.base_trade_date}；共 ${dashboard.market_summary.count.toLocaleString()} 檔`;renderKpis();document.getElementById('directionBars').innerHTML=barRows(dashboard.market_summary.directions,dashboard.market_summary.count);document.getElementById('riskBars').innerHTML=barRows(dashboard.market_summary.risks,dashboard.market_summary.count);document.getElementById('qualityBars').innerHTML=barRows(dashboard.market_summary.completeness_bands,dashboard.market_summary.count);document.getElementById('industryRows').innerHTML=dashboard.industry_summary.slice(0,12).map(i=>`<tr><td><a class="link" href="${withDate('prediction-industry-dashboard.html')}#${encodeURIComponent(i.industry)}">${i.industry}</a></td><td>${i.count}</td><td>${fmt(i.average_direction_score)}</td><td>${pct(i.bullish_ratio)}</td><td>${pct(i.high_risk_ratio)}</td><td>${i.interpretation}</td></tr>`).join('');document.getElementById('groupRows').innerHTML=dashboard.group_summary.map(g=>`<tr><td><a class="link" href="${withDate('prediction-groups.html')}#${encodeURIComponent(g.group)}">${g.group}</a></td><td>${g.count}</td><td>${fmt(g.average_direction_score)}</td><td>${pct(g.bullish_ratio)}</td><td>${pct(g.low_completeness_ratio)}</td></tr>`).join('');fillSelect('direction',[...new Set(dashboard.stocks.map(s=>s.final_direction_label))]);fillSelect('risk',[...new Set(dashboard.stocks.map(s=>s.risk_label))]);fillSelect('industry',[...new Set(dashboard.stocks.map(s=>s.industry))].sort((a,b)=>a.localeCompare(b,'zh-Hant')));fillSelect('signal',[...new Set(dashboard.stocks.flatMap(s=>s.reversal_signals.tags))].sort((a,b)=>a.localeCompare(b,'zh-Hant')));renderStocks();}
    function renderKpis(){const s=dashboard.market_summary;document.getElementById('kpis').innerHTML=[['總檔數',s.count.toLocaleString(),'預測股票'],['平均分數',fmt(s.average_direction_score),'方向強度'],['偏多比例',pct(s.bullish_ratio),'偏多與中性偏多'],['偏空比例',pct(s.bearish_ratio),'偏空與中性偏空'],['翻轉訊號',pct(s.reversal_ratio),'MACD/KD/均線轉強'],['站上20MA',pct(s.reclaim_sma20_ratio),'由下轉上'],['MACD轉強',pct(s.macd_bullish_ratio),'交叉或柱狀翻正'],['KD轉強',pct(s.kd_bullish_ratio),'黃金交叉或低檔轉折']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join('');}
    function fillSelect(id,values){const el=document.getElementById(id);el.innerHTML+=values.map(v=>`<option value="${v}">${v}</option>`).join('');}
    function renderStocks(){const q=document.getElementById('q').value.trim().toLowerCase();const d=document.getElementById('direction').value;const r=document.getElementById('risk').value;const ind=document.getElementById('industry').value;const signal=document.getElementById('signal').value;const rows=dashboard.stocks.filter(s=>(!q||[s.stock_code,s.stock_name,s.industry].some(v=>String(v).toLowerCase().includes(q)))&&(!d||s.final_direction_label===d)&&(!r||s.risk_label===r)&&(!ind||s.industry===ind)&&(!signal||s.reversal_signals.tags.includes(signal))).sort((a,b)=>b.direction_score-a.direction_score).slice(0,250);document.getElementById('stockRows').innerHTML=rows.map(s=>`<tr><td>${s.stock_name} <b>${s.stock_code}</b></td><td>${s.industry}</td><td><span class="pill ${cls(s.final_direction_label)}">${s.final_direction_label}</span></td><td>${s.direction_score}</td><td><span class="pill ${cls(s.risk_label)}">${s.risk_label}</span></td><td>${s.data_completeness}%</td><td>${fmt(s.features.r1)}</td><td>${fmt(s.features.r3)}</td><td>${fmt(s.features.rsi14)}</td><td>${fmt(s.features.volume_ratio_1d)}</td><td>${s.chip_bias}</td><td>${s.reversal_signals.tags.join('、')||'—'}</td><td><a class="link" href="${s.report_file}">個股</a></td></tr>`).join('');}
    loadDashboard().catch(err=>{document.getElementById('meta').textContent=`載入失敗：${err.message}`});
  </script>
</body>
</html>
