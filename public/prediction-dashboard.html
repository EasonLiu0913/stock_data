  <style>
    *{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:#f6f8fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(100%,1440px);margin:0 auto;padding:24px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px;min-width:0}.eyebrow{font-size:13px;font-weight:800;color:#526173}.title{margin:4px 0 0;font-size:30px;line-height:1.2}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav select{border:1px solid #cdd6e3;background:#fff;border-radius:6px;padding:9px 12px;color:#1f3b57;text-decoration:none;font-weight:800}.grid{display:grid;gap:14px;min-width:0}.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}.card{background:#fff;border:1px solid #dce3ec;border-radius:8px;padding:16px;box-shadow:0 1px 2px rgba(22,31,44,.04);min-width:0}.kpi-card{appearance:none;text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit;overflow:hidden}.kpi-card>*{min-width:0;max-width:100%}.kpi-card:hover{border-color:#8eb4dc;background:#fbfdff}.kpi-card.active{border-color:#2f6fae;box-shadow:0 0 0 2px rgba(47,111,174,.14)}.tag{display:inline-flex;align-items:center;min-height:24px;border-radius:999px;background:#eef4fb;color:#24547f;padding:3px 8px;font-size:12px;font-weight:900}.label{font-size:12px;color:#697789;font-weight:800;overflow-wrap:anywhere;word-break:break-word}.value{font-size:clamp(18px,2vw,28px);font-weight:900;margin-top:5px;line-height:1.1;overflow-wrap:anywhere;word-break:break-word;font-variant-numeric:tabular-nums}.sub{font-size:13px;color:#697789;margin-top:4px;line-height:1.35;overflow-wrap:anywhere;word-break:break-word}.cols{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}.section-title{font-size:18px;margin:0 0 12px}.section-title button{appearance:none;border:0;background:transparent;color:inherit;font:inherit;font-weight:900;padding:0;cursor:pointer}.section-title button:hover{color:#1d5f9 td:first-child{text-align:left;width:190px}th,td{padding:10px 12px;border-bottom:1px solid #edf1f6;text-align:left;font-size:13px;white-space:nowrap}.group-summary-table th:first-child,.group-summary-table td:first-child{white-space:normal}th{background:#f2f5f9;color:#475569;font-size:12px}.concept-wrap th{position:sticky;top:0;z-index:1}tr:hover td{background:#f8fbff}.concept-row.active td{background:#eef6ff}.pill{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800;background:#eef2f7;color:#334155}.bull{background:#e8f7ef;color:#12623a}.bear{background:#fdeaea;color:#9e2f2f}.warn{background:#fff4db;color:#8a5a00}.link{color:#1d5f99;font-weight:800;text-decoration:none}.text-button,.sort-button{appearance:none;border:0;background:transparent;color:#1d5f99;font:inherit;font-weight:800;padding:0;cursor:pointer}.text-button:hover,.sort-button:hover{text-decoration:underline}.sort-button{color:#475569;font-size:12px;text-align:left}.controls{display:grid;grid-template-columns:2fr repeat(4,minmax(130px,1fr));gap:10px;margin-bottom:12px}input,select{height:38px;max-width:100%;border:1px solid #cbd5e1;border-radius:6px;background:#fff;padding:0 10px;color:#172033}.wide{grid-column:1/-1}.to-top{position:fixed;right:18px;bottom:18px;z-index:20;border:1px solid #2f6fae;background:#2f6fae;color:#fff;border-radius:999px;width:48px;height:48px;font-size:22px;font-weight:900;line-height:1;box-shadow:0 8px 20px rgba(22,31,44,.18);cursor:pointer}.to-top:hover{background:#245985}@media(max-width:1000px){.cols{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.controls{grid-template-columns:1fr 1fr}}@media(max-width:640px){.shell{padding:14px}.title{font-size:24px}.kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.card{padding:12px}.kpi-card .value{font-size:clamp(17px,5vw,21px)}.kpi-card .label{line-height:1.3}.kpi-card .sub{font-size:12px}.controls{grid-template-columns:1fr}.nav{width:100%}.nav a,.nav select{flex:1 1 auto;text-align:center}table{min-width:820px}.group-summary-table{min-width:480px}.news-table{min-width:760px}.futures-table{min-width:840px}.fear-greed-table{min-width:700px}.news-table th:nth-child(2),.news-table td:nth-child(2){width:100px}.news-table th:nth-child(3),.news-table td:nth-child(3){width:104px}.news-table th:nth-child(4),.news-table td:nth-child(4){width:150px}.news-table th:nth-child(5),.news-table td:nth-child(5){width:96px}th,td{padding:9px 10px}.bar-row{grid-template-columns:78px minmax(0,1fr) 44px}.concept-wrap{max-height:436px}.to-top{right:14px;bottom:14px;width:44px;height:44px}}@media(max-width:420px){.kpis{grid-template-columns:1fr}}
  .environment-banner{margin-bottom:14px;border:1px solid #cbd5e1;border-left:6px solid #64748b;background:#fff;border-radius:8px;padding:14px 16px}.environment-banner.normal{border-left-color:#17804b}.environment-banner.risk_warning{border-left-color:#d58b00;background:#fffaf0}.environment-banner.shock_first_day_warning{border-left-color:#c43d3d;background:#fff5f5}.environment-banner.post_shock_day_1,.environment-banner.post_shock_day_2{border-left-color:#7c3aed;background:#faf7ff}.environment-banner.data_invalid{border-left-color:#991b1b;background:#fef2f2}.environment-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.environment-title{font-size:18px;font-weight:900}.environment-score{font-weight:900}.environment-details{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:#526173}.environment-policy{margin-top:8px;font-size:13px;font-weight:800}.environment-trigger{display:inline-flex;margin:6px 6px 0 0;padding:3px 8px;border-radius:999px;background:#eef2f7;font-size:12px;font-weight:800}</style>

<body>
  <main class="shell">
    <div class="topbar">
      <div><div class="eyebrow" id="meta">載入中</div><h1 class="title">股票預測總覽 Dashboard</h1></div>
      <nav class="nav"><a href="prediction-replay-dashboard.html">事後覆盤</a><a href="prediction-industry-dashboard.html">產業解讀</a><a href="prediction-groups.html">策略分類</a></nav>
    </div>
    <section class="environment-banner" id="marketEnvironmentBanner"><div class="environment-title">市場環境載入中…</div></section><section class="rebound-readiness-card readiness-unavailable" id="oversoldBetaReboundBanner"><div class="readiness-title">跌深反彈準備度載入中…</div></section><section class="grid kpis" id="kpis"></section>
    <section class="grid cols">
      <div class="card"><h2 class="section-title"><button type="button" onclick="setQuickFilter('directionAny')">方向分布</button></h2><div class="bars" id="directionBars"></div></div>
      <div class="card"><h2 class="section-title"><button type="button" onclick="setQuickFilter('riskQualityAny')">個股風險</button></h2><div class="bars" id="riskBars"></div></div>
      <div class="card"><h2 class="section-title">策略分類摘要</h2><div class="table-wrap"><table class="group-summary-table"><thead id="groupHead"></thead><tbody id="groupRows"></tbody></table></div></div>
      <div class="card"><h2 class="section-title">產業強弱摘要</h2><div class="table-wrap"><table><thead id="industryHead"></thead><tbody id="industryRows"></tbody></table></div></div>
      <div class="card wide"><h2 class="section-title">概念股清單</h2><div class="table-wrap concept-wrap"><table><thead id="conceptHead"></thead><tbody id="conceptRows"></tbody></table></div></div>
      <div class="card wide"><h2 class="section-title">電子產業清單</h2><div class="table-wrap concept-wrap"><table><thead id="electronicsHead"></thead><tbody id="electronicsRows"></tbody></table></div></div>
      <div class="card wide">
        <div class="list-head"><h2 class="section-title" id="stockListTitle">股票清單（全部清單）</h2><div class="filter-note" id="filterNote">全部股票</div></div>
        <div class="controls" id="stockControls"><input id="q" placeholder="搜尋代號、名稱、產業" oninput="renderStocks()"><select id="direction" onchange="renderStocks()"><option value="">全部方向</option></select><select id="risk" onchange="renderStocks()"><option value="">全部風險</option></select><select id="industry" onchange="renderStocks()"><option value="">全部產業</option></select><select id="signal" onchange="renderStocks()"><option value="">全部翻轉訊號</option></select></div>
        <div class="table-wrap"><table><thead id="listHead"><tr><th>前收盤價（漲跌）</th><th>報告</th><th>股票</th><th>產業</th><th>方向</th><th>分數</th><th>個股風險</th><th>完整度</th><th>r1</th><th>r3</th><th>7日RS</th><th>RS型態</th><th>RSI</th><th>量比</th><th>籌碼</th><th>翻轉訊號</th></tr></thead><tbody id="stockRows"></tbody></table></div>
      </div>
    </section>
  </main>
  <button class="to-top" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="回到最上方" title="回到最上方">↑</button>
  <script>
    let dashboard, basePriceData=null, marketNews=null, marketRisk=null, marketEnvironment=null, marketNewsMode='', conceptLists=null, electronicsLists=null, oilPrices=null, futuresOpenInterest=[], cnnFearGreed=null;
    const fmt=n=>Number.isFinite(n)?n.toFixed(2):'NA';
    const pct=n=>Number.isFinite(n)?`${n.toFixed(1)}%`:'NA';
    const signedPct=n=>Number.isFinite(n)?`${n>=0?'+':''}${n.toFixed(2)}%`:'NA';
    const signedValue=n=>Number.isFinite(n)?`${n>=0?'+':''}${n.toFixed(2)}`:'NA';
    const numberFormat=new Intl.NumberFormat('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2});
    const cls=v=>String(v).includes('偏多')?'bull':String(v).includes('偏空')?'bear':String(v).includes('高')?'warn':'';
    const esc=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
    const params=new URLSearchParams(location.search);
    let currentDate;
    let activeQuickFilter='';
    let selectedConceptId='';
    let selectedElectronicsId='';
    let activeListView='stocks';
    let stockSortKey='relative7d';
    let stockSortDir='desc';
    const summarySorts={group:{key:'averageScore',dir:'desc'},industry:{key:'averageScore',dir:'desc'},concept:{key:'averageScore',dir:'desc'},electronics:{key:'averageScore',dir:'desc'}};
    const quickFilters={
      bullish:{label:'偏多比例',tag:'偏多',test:s=>String(s.final_direction_label).includes('偏多')},
      bearish:{label:'偏空比例',tag:'偏空',test:s=>String(s.final_direction_label).includes('偏空')},
      reversal:{label:'翻轉訊號',tag:'翻轉',test:s=>(s.reversal_signals?.tags||[]).length>0},
      reclaim20:{label:'站上20MA',tag:'20MA',test:s=>Boolean(s.reversal_signals?.crossed_sma20)},
      macd:{label:'MACD轉強',tag:'MACD',test:s=>Boolean(s.reversal_signals?.macd_bullish_cross||s.reversal_signals?.macd_histogram_positive_turn)},
      kd:{label:'KD轉強',tag:'KD',test:s=>Boolean(s.reversal_signals?.kd_bullish_cross||s.reversal_signals?.kd_oversold_turn)},
      relative7d:{label:'七日相對強勢',tag:'7日RS',test:s=>Boolean(s.relative_strength_7d?.relative_strength_strong)},
      directionAny:{label:'方向分布',tag:'方向',test:s=>Boolean(s.final_direction_label)},
      riskQualityAny:{label:'個股風險',tag:'風險',test:s=>Boolean(s.risk_label)}
    };
    async function loadDashboard(){const m=await fetch('../data_predictions/manifest.json',{cache:'no-store'}).then(r=>r.json());currentDate=params.get('date')||m.latest_date||m.forecast_date_compact;const summaryPath=currentDate===m.latest_date&&m.latest_summary?m.latest_summary:`data_predictions/${currentDate}/summary.json`;dashboard=await fetch(`../${summaryPath}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`找不到 ${summaryPath}`);return r.json();});await Promise.all([loadBasePrices(),loadMarketNews(),loadMarketEnvironment(),loadClassLists(),loadOilPrices(),loadFuturesOpenInterest(),loadCnnFearGreed()]);init(m);}
    async function fetchJsonOrNull(file){try{const r=await fetch(`../${file}`,{cache:'no-store'});return r.ok?await r.json():null;}catch{return null;}}
    async function loadMarketEnvironment(){const forecast=compact(dashboard.forecast_date);marketEnvironment=await fetchJsonOrNull(`data_market_environment/${forecast}/market_environment.json`);}
    function renderMarketEnvironment(){const el=document.getElementById('marketEnvironmentBanner');if(!el)return;if(!marketEnvironment){el.className='environment-banner data_invalid';el.innerHTML='<div class="environment-title">市場環境快照尚未產生</div><div class="environment-policy">請先執行 Prepare Market Environment；目前不套用任何環境政策。</div>';return;}const env=marketEnvironment.environment||{};const freshness=marketEnvironment.data_freshness||{};const policy=marketEnvironment.strategy_policy||{};const metrics=marketEnvironment.metrics||{};const triggers=(env.triggers||[]).map(item=>`<span class="environment-trigger">${esc(item.label)}（+${item.points}）</span>`).join('');const policyText=policy.relative_leadership_momentum==='disabled_shadow'?'相對領漲量價策略：Shadow 停用':policy.relative_leadership_momentum==='restricted_shadow'?'相對領漲量價策略：Shadow 限制':policy.relative_leadership_momentum==='reduced_shadow'?'相對領漲量價策略：Shadow 縮小清單':'相對領漲量價策略：正常';el.className=`environment-banner ${env.code||'data_invalid'}`;el.innerHTML=`<div class="environment-head"><div><div class="environment-title">${esc(env.label||env.code||'未知環境')}｜Shadow mode</div><div class="environment-details"><span>分數 ${Number.isFinite(Number(env.score))?env.score:'NA'}</span><span>外部資料 ${esc(freshness.status||'NA')}</span><span>美股市場日 ${esc(freshness.actual_us_market_date||'NA')}</span><span>費半 1 日 ${signedPct(Number(metrics.sox_change_1d_pct))}</span><span>費半 3 日 ${signedPct(Number(metrics.sox_return_3d_pct))}</span><span>外資期貨淨口 ${Number.isFinite(Number(metrics.foreign_futures_net_contracts))?Number(metrics.foreign_futures_net_contracts).toLocaleString('zh-TW'):'NA'}</span></div></div><div class="environment-score">snapshot ${esc(String(marketEnvironment.snapshot_hash||'').slice(0,12))}</div></div><div class="environment-policy">${policyText}；正式方向分數調整 ${policy.formal_direction_score_adjustment??0}。</div><div>${triggers||'<span class="environment-trigger">未觸發首日衝擊條件</span>'}</div>`; }
    async function loadBasePrices(){const base=compact(dashboard.base_trade_date);basePriceData=await fetchJsonOrNull(`data_fubon/fubon_${base}_sma.json`);}
    function basePriceRow(stock){const item=basePriceData?.[String(stock.stock_code)];if(!item)return null;const iso=String(dashboard.base_trade_date||'');const slash=iso.replaceAll('-','/');const compactDate=compact(iso);return item[iso]||item[slash]||item[compactDate]||null;}
    function baseClose(stock){const row=basePriceRow(stock);const value=Number(row?.Price??row?.Close);return Number.isFinite(value)?value:null;}
    function closeWithChange(stock){const close=baseClose(stock);const change=Number(stock.features?.r1);if(!Number.isFinite(close))return 'NA';return `${close.toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2})}（${Number.isFinite(change)?signedPct(change):'NA'}）`;}
    function compact(value){return String(value||'').replaceAll('-','').replaceAll('/','');}
    function isPreOpenSnapshot(payload,date){const generated=Date.parse(payload?.generated_at||'');if(!Number.isFinite(generated))return false;const d=compact(date);const cutoff=Date.parse(`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}T09:00:00+08:00`);return generated<=cutoff;}
    async function loadMarketNews(){const forecast=compact(dashboard.forecast_date);const base=compact(dashboard.base_trade_date);const [preNews,preRisk,baseNews,baseRisk]=await Promise.all([fetchJsonOrNull(`data_market_news/${forecast}/market_news.json`),fetchJsonOrNull(`data_market_risk/${forecast}/market_risk_snapshot.json`),fetchJsonOrNull(`data_market_news/${base}/market_news.json`),fetchJsonOrNull(`data_market_risk/${base}/market_risk_snapshot.json`)]);const usePreOpen=isPreOpenSnapshot(preNews,forecast)||isPreOpenSnapshot(preRisk,forecast);marketNews=usePreOpen?(preNews||baseNews):baseNews;marketRisk=usePreOpen?(preRisk||baseRisk):baseRisk;marketNewsMode=usePreOpen?'盤前新聞':'基準日新聞';}
    async function loadClassLists(){[conceptLists,electronicsLists]=await Promise.all([fetchJsonOrNull('data_concept_stocks/concept-stock-lists.json'),fetchJsonOrNull('data_concept_stocks/electronics-industry-lists.json')]);conceptLists=conceptLists||{lists:[]};electronicsLists=electronicsLists||{lists:[]};}
    async function loadOilPrices(){const forecast=compact(dashboard.forecast_date);oilPrices=await fetchJsonOrNull(`data_oil_prices/${forecast}/oil_prices.json`);if(!oilPrices){const manifest=await fetchJsonOrNull('data_oil_prices/manifest.json');if(manifest?.latest_file)oilPrices=await fetchJsonOrNull(manifest.latest_file);}}
    async function loadFuturesOpenInterest(){const files=await fetchJsonOrNull('data_taifex_major_institutional_traders_futures_contracts/files.json');const latestFiles=Array.isArray(files)?[...files].filter(file=>/^\d{8}_taifex_major_institutional_traders_futures_contracts\.json$/.test(file)).sort((a,b)=>b.localeCompare(a)).slice(0,30):[];const payloads=await Promise.all(latestFiles.map(file=>fetchJsonOrNull(`data_taifex_major_institutional_traders_futures_contracts/${file}`)));futuresOpenInterest=payloads.map(payload=>{const row=(payload?.rows||[]).find(item=>item.productName==='臺股期貨'&&/^外資/.test(item.investorType));const dateCompact=compact(payload?.dateCompact||payload?.date);if(!row||!/^\d{8}$/.test(dateCompact))return null;return{dateCompact,date:payload.date||`${dateCompact.slice(0,4)}/${dateCompact.slice(4,6)}/${dateCompact.slice(6,8)}`,longAmount:Number(row.openInterest?.long?.amountThousandTwd),shortAmount:Number(row.openInterest?.short?.amountThousandTwd),netAmount:Number(row.openInterest?.net?.amountThousandTwd),netContracts:Number(row.openInterest?.net?.contracts)};}).filter(item=>item&&[item.longAmount,item.shortAmount,item.netAmount,item.netContracts].every(Number.isFinite)).sort((a,b)=>b.dateCompact.localeCompare(a.dateCompact));}
    async function loadCnnFearGreed(){const manifest=await fetchJsonOrNull('data_cnn_fear_and_greed/manifest.json');let file=manifest?.latest_file||'';if(!file){const files=await fetchJsonOrNull('data_cnn_fear_and_greed/files.json');file=Array.isArray(files)&&files.length?`data_cnn_fear_and_greed/${[...files].sort((a,b)=>b.localeCompare(a))[0]}`:'';}cnnFearGreed=file?await fetchJsonOrNull(file):null;}
    function withDate(file){return `${file}?date=${encodeURIComponent(currentDate)}`;}
    function completenessBand(s){const v=Number(s.data_completeness);return v>=80?'高完整度':v>=50?'中完整度':'低完整度';}
    function filterKey(kind,label){return `${kind}:${label}`;}
    function ensureDistributionFilter(kind,label){const key=filterKey(kind,label);if(!quickFilters[key])quickFilters[key]={label,tag:kind==='direction'?'方向':kind==='risk'?'風險':'完整度',test:s=>kind==='direction'?s.final_direction_label===label:kind==='risk'?s.risk_label===label:completenessBand(s)===label};return key;}
    function barRows(obj,total,kind){return Object.entries(obj).map(([k,v])=>{const key=ensureDistributionFilter(kind,k);const active=activeQuickFilter===key?' active':'';return `<button type="button" class="bar-row${active}" onclick="setQuickFilter('${key}')"><b>${k}</b><div class="track"><div class="fill" style="width:${total?v/total*100:0}%"></div></div><span>${v}</span></button>`;}).join('');}
    function renderDistributionBars(){document.getElementById('directionBars').innerHTML=barRows(dashboard.market_summary.directions,dashboard.market_summary.count,'direction');document.getElementById('riskBars').innerHTML=barRows(dashboard.market_summary.risks,dashboard.market_summary.count,'risk');}
    function avg(rows,fn){const values=rows.map(fn).filter(Number.isFinite);return values.length?values.reduce((s,v)=>s+v,0)/values.length:null;}
    function ratioOf(rows,fn){return rows.length?rows.filter(fn).length/rows.length*100:null;}

    function showMarketNews(){activeListView='news';activeQuickFilter='';selectedConceptId='';selectedElectronicsId='';renderKpis();renderConceptRows();document.getElementById('stockControls').style.display='none';setListTableClass('news-table');document.getElementById('listHead').innerHTML='<tr><th>新聞</th><th>來源</th><th>抓取來源</th><th>發布時間</th><th>分類</th></tr>';const articles=[...(marketNews?.articles||[])].sort((a,b)=>(Date.parse(b.published_at||'')||0)-(Date.parse(a.published_at||'')||0));const confidence=marketConfidence();document.getElementById('stockListTitle').textContent=`市場新聞（${marketNewsMode}；信心 ${Number.isFinite(confidence)?fmt(confidence):'NA'}）`;document.getElementById('filterNote').textContent=`${confidenceLabel(confidence)}；${articles.length.toLocaleString()} 則新聞`;document.getElementById('stockRows').innerHTML=articles.length?articles.map(article=>`<tr><td><a class="link" href="${esc(article.link)}" target="_blank" rel="noopener noreferrer">${esc(article.title)}</a></td><td>${esc(article.source_name||'')}</td><td>${esc((article.matched_queries||[]).map(newsSourceLabel).join('、'))}</td><td>${esc(article.published_at||'')}</td><td>${esc((article.categories||[]).join('、'))}</td></tr>`).join(''):'<tr><td colspan="5">目前沒有可顯示的市場新聞</td></tr>';document.querySelector('.wide:last-of-type')?.scrollIntoView({behavior:'smooth',block:'start'});}

    function showFearGreedHistory(){activeListView='fearGreed';activeQuickFilter='';selectedConceptId='';selectedElectronicsId='';renderKpis();renderConceptRows();document.getElementById('stockControls').style.display='none';setListTableClass('fear-greed-table');document.getElementById('listHead').innerHTML='<tr><th>時間（紐約）</th><th>Fear & Greed 分數</th><th>Rating</th><th>較前一期增減</th><th>較前一期增減（%）</th></tr>';const rows=fearGreedHistoricalRows();const sourceRows=cnnFearGreed?.fear_and_greed_historical?.data;const current=cnnFearGreed?.fear_and_greed||{};document.getElementById('stockListTitle').textContent='CNN Fear & Greed Index 歷史資料（最新 50 筆）';document.getElementById('filterNote').textContent=rows.length?`最新來源時間 ${current.timestamp||'NA'}；顯示 ${rows.length.toLocaleString()} / ${Array.isArray(sourceRows)?sourceRows.length.toLocaleString():rows.length.toLocaleString()} 筆`:'尚未產生 Fear & Greed 歷史資料';document.getElementById('stockRows').innerHTML=rows.length?rows.map((item,index)=>{const previous=rows[index+1];const change=fearGreedChange(item.score,previous?.score);const changeClass=change.amount>0?'bull':change.amount<0?'bear':'';return `<tr><td>${esc(formatFearGreedDate(item.timestamp))}</td><td>${fmt(item.score)}</td><td><span class="pill">${esc(item.rating||'NA')}</span></td><td>${Number.isFinite(change.amount)?`<span class="pill ${changeClass}">${signedValue(change.amount)}</span>`:'—'}</td><td>${Number.isFinite(change.percent)?`<span class="pill ${changeClass}">${signedPct(change.percent)}</span>`:'—'}</td></tr>`;}).join(''):'<tr><td colspan="5">目前沒有可顯示的 CNN Fear & Greed 歷史資料</td></tr>';document.querySelector('.wide:last-of-type')?.scrollIntoView({behavior:'smooth',block:'start'});}
    function showFuturesOpenInterest(){activeListView='futures';activeQuickFilter='';selectedConceptId='';selectedElectronicsId='';renderKpis();renderConceptRows();document.getElementById('stockControls').style.display='none';setListTableClass('futures-table');document.getElementById('listHead').innerHTML='<tr><th>日期</th><th>多方未平倉金額（億元）</th><th>空方未平倉金額（億元）</th><th>多空淨額（億元）</th><th>較前日增減（億元）</th><th>較前日增減（%）</th><th>未平倉淨口數</th><th>較前日口數增減</th></tr>';document.getElementById('stockListTitle').textContent=`外資臺股期貨未平倉金額（最近 ${futuresOpenInterest.length} 個交易日）`;document.getElementById('filterNote').textContent=futuresOpenInterest.length?`最新資料日 ${futuresOpenInterest[0].date}；淨額＝多方－空方；百分比以此前一期淨額絕對值為分母`:'尚未產生外資未平倉資料';document.getElementById('stockRows').innerHTML=futuresOpenInterest.length?futuresOpenInterest.map((item,index)=>{const previous=futuresOpenInterest[index+1];const change=futuresChange(item,previous);const contractsChange=futuresContractsChange(item,previous);const netClass=item.netAmount>0?'bull':item.netAmount<0?'bear':'';const changeClass=change.amount>0?'bull':change.amount<0?'bear':'';const contractsChangeClass=contractsChange.amount>0?'bull':contractsChange.amount<0?'bear':'';return `<tr><td>${esc(item.date)}</td><td>${formatAmountYi(item.longAmount)}</td><td>${formatAmountYi(item.shortAmount)}</td><td><span class="pill ${netClass}">${formatAmountYi(item.netAmount,{signed:true})}</span></td><td>${Number.isFinite(change.amount)?`<span class="pill ${changeClass}">${formatAmountYi(change.amount,{signed:true})}</span>`:'—'}</td><td>${Number.isFinite(change.percent)?`<span class="pill ${changeClass}">${signedPct(change.percent)}</span>`:'—'}</td><td>${Number.isFinite(item.netContracts)?item.netContracts.toLocaleString('zh-TW'):'NA'}</td><td>${Number.isFinite(contractsChange.amount)?`<span class="pill ${contractsChangeClass}">${contractsChange.amount>0?'+':''}${contractsChange.amount.toLocaleString('zh-TW')}</span>`:'—'}</td></tr>`;}).join(''):'<tr><td colspan="8">目前沒有可顯示的外資臺股期貨未平倉資料</td></tr>';document.querySelector('.wide:last-of-type')?.scrollIntoView({behavior:'smooth',block:'start'});}
    loadDashboard().catch(err=>{document.getElementById('meta').textContent=`載入失敗：${err.message}`});
  </script>
