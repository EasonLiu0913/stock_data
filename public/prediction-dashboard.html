<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票預測總覽 Dashboard</title>
  <style>
    *{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:#f6f8fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(100%,1440px);margin:0 auto;padding:24px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px;min-width:0}.eyebrow{font-size:13px;font-weight:800;color:#526173}.title{margin:4px 0 0;font-size:30px;line-height:1.2}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav select{border:1px solid #cdd6e3;background:#fff;border-radius:6px;padding:9px 12px;color:#1f3b57;text-decoration:none;font-weight:800}.grid{display:grid;gap:14px;min-width:0}.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}.card{background:#fff;border:1px solid #dce3ec;border-radius:8px;padding:16px;box-shadow:0 1px 2px rgba(22,31,44,.04);min-width:0}.kpi-card{appearance:none;text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit}.kpi-card:hover{border-color:#8eb4dc;background:#fbfdff}.kpi-card.active{border-color:#2f6fae;box-shadow:0 0 0 2px rgba(47,111,174,.14)}.tag{display:inline-flex;align-items:center;min-height:24px;border-radius:999px;background:#eef4fb;color:#24547f;padding:3px 8px;font-size:12px;font-weight:900}.label{font-size:12px;color:#697789;font-weight:800}.value{font-size:clamp(22px,4.8vw,28px);font-weight:900;margin-top:5px;line-height:1.1}.sub{font-size:13px;color:#697789;margin-top:4px;line-height:1.35}.cols{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}.section-title{font-size:18px;margin:0 0 12px}.section-title button{appearance:none;border:0;background:transparent;color:inherit;font:inherit;font-weight:900;padding:0;cursor:pointer}.section-title button:hover{color:#1d5f99}.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.filter-note{font-size:13px;color:#526173;font-weight:800}.bars{display:grid;gap:10px}.bar-row{appearance:none;border:0;background:transparent;color:inherit;width:100%;display:grid;grid-template-columns:minmax(72px,96px) minmax(0,1fr) 52px;gap:10px;align-items:center;font:inherit;font-size:13px;text-align:left;min-width:0;padding:0;cursor:pointer}.bar-row:hover b{color:#1d5f99}.bar-row.active b{color:#1d5f99}.bar-row.active .track{box-shadow:0 0 0 2px rgba(47,111,174,.16)}.track{height:10px;background:#edf1f6;border-radius:999px;overflow:hidden}.fill{height:100%;background:#376ca8}.table-wrap{overflow-x:auto;overflow-y:hidden;border:1px solid #dce3ec;border-radius:8px;background:#fff;max-width:100%;min-width:0;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;min-width:960px}th,td{padding:10px 12px;border-bottom:1px solid #edf1f6;text-align:left;font-size:13px;white-space:nowrap}th{background:#f2f5f9;color:#475569;font-size:12px}tr:hover td{background:#f8fbff}.pill{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800;background:#eef2f7;color:#334155}.bull{background:#e8f7ef;color:#12623a}.bear{background:#fdeaea;color:#9e2f2f}.warn{background:#fff4db;color:#8a5a00}.link{color:#1d5f99;font-weight:800;text-decoration:none}.controls{display:grid;grid-template-columns:2fr repeat(4,minmax(130px,1fr));gap:10px;margin-bottom:12px}input,select{height:38px;max-width:100%;border:1px solid #cbd5e1;border-radius:6px;background:#fff;padding:0 10px;color:#172033}.wide{grid-column:1/-1}@media(max-width:1000px){.cols{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.controls{grid-template-columns:1fr 1fr}}@media(max-width:640px){.shell{padding:14px}.title{font-size:24px}.kpis{grid-template-columns:1fr 1fr;gap:10px}.card{padding:12px}.controls{grid-template-columns:1fr}.nav{width:100%}.nav a,.nav select{flex:1 1 auto;text-align:center}table{min-width:820px}th,td{padding:9px 10px}.bar-row{grid-template-columns:78px minmax(0,1fr) 44px}}@media(max-width:420px){.kpis{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div><div class="eyebrow" id="meta">載入中</div><h1 class="title">股票預測總覽 Dashboard</h1></div>
      <nav class="nav"><a href="prediction-industry-dashboard.html">產業解讀</a><a href="prediction-groups.html">策略分類</a></nav>
    </div>
    <section class="grid kpis" id="kpis"></section>
    <section class="grid cols">
      <div class="card"><h2 class="section-title"><button type="button" onclick="setQuickFilter('directionAny')">方向分布</button></h2><div class="bars" id="directionBars"></div></div>
      <div class="card"><h2 class="section-title"><button type="button" onclick="setQuickFilter('riskQualityAny')">個股風險與完整度</button></h2><div class="bars" id="riskBars"></div><div class="bars" id="qualityBars" style="margin-top:14px"></div></div>
      <div class="card"><h2 class="section-title">產業強弱摘要</h2><div class="table-wrap"><table><thead><tr><th>產業</th><th>檔數</th><th>平均分數</th><th>偏多</th><th>個股高風險</th><th>解讀</th></tr></thead><tbody id="industryRows"></tbody></table></div></div>
      <div class="card"><h2 class="section-title">策略分類摘要</h2><div class="table-wrap"><table><thead><tr><th>分類</th><th>檔數</th><th>平均分數</th><th>偏多</th><th>資料不足</th></tr></thead><tbody id="groupRows"></tbody></table></div></div>
      <div class="card wide">
        <div class="list-head"><h2 class="section-title" id="stockListTitle">股票清單（全部清單）</h2><div class="filter-note" id="filterNote">全部股票</div></div>
        <div class="controls"><input id="q" placeholder="搜尋代號、名稱、產業" oninput="renderStocks()"><select id="direction" onchange="renderStocks()"><option value="">全部方向</option></select><select id="risk" onchange="renderStocks()"><option value="">全部風險</option></select><select id="industry" onchange="renderStocks()"><option value="">全部產業</option></select><select id="signal" onchange="renderStocks()"><option value="">全部翻轉訊號</option></select></div>
        <div class="table-wrap"><table><thead><tr><th>報告</th><th>股票</th><th>產業</th><th>方向</th><th>分數</th><th>個股風險</th><th>市場風險</th><th>完整度</th><th>r1</th><th>r3</th><th>7日RS</th><th>RS型態</th><th>RSI</th><th>量比</th><th>籌碼</th><th>翻轉訊號</th></tr></thead><tbody id="stockRows"></tbody></table></div>
      </div>
    </section>
  </main>
  <script>
    let dashboard;
    const fmt=n=>Number.isFinite(n)?n.toFixed(2):'NA';
    const pct=n=>Number.isFinite(n)?`${n.toFixed(1)}%`:'NA';
    const cls=v=>String(v).includes('偏多')?'bull':String(v).includes('偏空')?'bear':String(v).includes('高')?'warn':'';
    const params=new URLSearchParams(location.search);
    let currentDate;
    let activeQuickFilter='';
    const quickFilters={
      bullish:{label:'偏多比例',tag:'偏多',test:s=>String(s.final_direction_label).includes('偏多')},
      bearish:{label:'偏空比例',tag:'偏空',test:s=>String(s.final_direction_label).includes('偏空')},
      reversal:{label:'翻轉訊號',tag:'翻轉',test:s=>(s.reversal_signals?.tags||[]).length>0},
      reclaim20:{label:'站上20MA',tag:'20MA',test:s=>Boolean(s.reversal_signals?.crossed_sma20)},
      macd:{label:'MACD轉強',tag:'MACD',test:s=>Boolean(s.reversal_signals?.macd_bullish_cross||s.reversal_signals?.macd_histogram_positive_turn)},
      kd:{label:'KD轉強',tag:'KD',test:s=>Boolean(s.reversal_signals?.kd_bullish_cross||s.reversal_signals?.kd_oversold_turn)},
      relative7d:{label:'七日相對強勢',tag:'7日RS',test:s=>Boolean(s.relative_strength_7d?.relative_strength_strong)},
      directionAny:{label:'方向分布',tag:'方向',test:s=>Boolean(s.final_direction_label)},
      riskQualityAny:{label:'個股風險與完整度',tag:'風險',test:s=>Boolean(s.risk_label||Number.isFinite(s.data_completeness))}
    };
    async function loadDashboard(){const m=await fetch('../data_predictions/manifest.json').then(r=>r.json());currentDate=params.get('date')||m.latest_date||m.forecast_date_compact;const summaryPath=currentDate===m.latest_date&&m.latest_summary?m.latest_summary:`data_predictions/${currentDate}/summary.json`;dashboard=await fetch(`../${summaryPath}`).then(r=>{if(!r.ok)throw new Error(`找不到 ${summaryPath}`);return r.json();});init(m);}
    function withDate(file){return `${file}?date=${encodeURIComponent(currentDate)}`;}
    function completenessBand(s){const v=Number(s.data_completeness);return v>=80?'高完整度':v>=50?'中完整度':'低完整度';}
    function filterKey(kind,label){return `${kind}:${label}`;}
    function ensureDistributionFilter(kind,label){const key=filterKey(kind,label);if(!quickFilters[key])quickFilters[key]={label,tag:kind==='direction'?'方向':kind==='risk'?'風險':'完整度',test:s=>kind==='direction'?s.final_direction_label===label:kind==='risk'?s.risk_label===label:completenessBand(s)===label};return key;}
    function barRows(obj,total,kind){return Object.entries(obj).map(([k,v])=>{const key=ensureDistributionFilter(kind,k);const active=activeQuickFilter===key?' active':'';return `<button type="button" class="bar-row${active}" onclick="setQuickFilter('${key}')"><b>${k}</b><div class="track"><div class="fill" style="width:${total?v/total*100:0}%"></div></div><span>${v}</span></button>`;}).join('');}
    function renderDistributionBars(){document.getElementById('directionBars').innerHTML=barRows(dashboard.market_summary.directions,dashboard.market_summary.count,'direction');document.getElementById('riskBars').innerHTML=barRows(dashboard.market_summary.risks,dashboard.market_summary.count,'risk');document.getElementById('qualityBars').innerHTML=barRows(dashboard.market_summary.completeness_bands,dashboard.market_summary.count,'quality');}
    function init(manifest){document.querySelector('.nav').innerHTML=`<select id="dateSelect" onchange="location.href='prediction-dashboard.html?date='+this.value">${(manifest.available_dates||[currentDate]).map(date=>`<option value="${date}" ${date===currentDate?'selected':''}>${date}</option>`).join('')}</select><a href="${withDate('prediction-industry-dashboard.html')}">產業解讀</a><a href="${withDate('prediction-groups.html')}">策略分類</a>`;document.getElementById('meta').textContent=`預測日 ${dashboard.forecast_date}；基準日 ${dashboard.base_trade_date}；共 ${dashboard.market_summary.count.toLocaleString()} 檔`;renderKpis();renderDistributionBars();document.getElementById('industryRows').innerHTML=dashboard.industry_summary.slice(0,12).map(i=>`<tr><td><a class="link" href="${withDate('prediction-industry-dashboard.html')}#${encodeURIComponent(i.industry)}">${i.industry}</a></td><td>${i.count}</td><td>${fmt(i.average_direction_score)}</td><td>${pct(i.bullish_ratio)}</td><td>${pct(i.high_risk_ratio)}</td><td>${i.interpretation}</td></tr>`).join('');document.getElementById('groupRows').innerHTML=dashboard.group_summary.map(g=>`<tr><td><a class="link" href="${withDate('prediction-groups.html')}#${encodeURIComponent(g.group)}">${g.group}</a></td><td>${g.count}</td><td>${fmt(g.average_direction_score)}</td><td>${pct(g.bullish_ratio)}</td><td>${pct(g.low_completeness_ratio)}</td></tr>`).join('');fillSelect('direction',[...new Set(dashboard.stocks.map(s=>s.final_direction_label))]);fillSelect('risk',[...new Set(dashboard.stocks.map(s=>s.risk_label))]);fillSelect('industry',[...new Set(dashboard.stocks.map(s=>s.industry))].sort((a,b)=>a.localeCompare(b,'zh-Hant')));fillSelect('signal',[...new Set(dashboard.stocks.flatMap(s=>s.reversal_signals.tags))].sort((a,b)=>a.localeCompare(b,'zh-Hant')));renderStocks();}
    function renderKpis(){const s=dashboard.market_summary;const mode=dashboard.market_summary.relative_strength_7d_market_return<0?'大盤跌勢抗跌':'大盤漲勢領漲';const cards=[{label:'總檔數',value:s.count.toLocaleString(),sub:'預測股票',filter:'all'},{label:'平均分數',value:fmt(s.average_direction_score),sub:'方向強度',filter:'all'},{label:'偏多比例',value:pct(s.bullish_ratio),sub:'偏多與中性偏多',filter:'bullish'},{label:'偏空比例',value:pct(s.bearish_ratio),sub:'偏空與中性偏空',filter:'bearish'},{label:'七日相對強勢',value:pct(s.relative_strength_7d_ratio),sub:mode,filter:'relative7d'},{label:'翻轉訊號',value:pct(s.reversal_ratio),sub:'MACD/KD/均線轉強',filter:'reversal'},{label:'站上20MA',value:pct(s.reclaim_sma20_ratio),sub:'由下轉上',filter:'reclaim20'},{label:'MACD轉強',value:pct(s.macd_bullish_ratio),sub:'交叉或柱狀翻正',filter:'macd'},{label:'KD轉強',value:pct(s.kd_bullish_ratio),sub:'黃金交叉或低檔轉折',filter:'kd'}];document.getElementById('kpis').innerHTML=cards.map(x=>{const tag=x.filter&&x.filter!=='all'?`<span class="tag">${quickFilters[x.filter].tag}</span>`:'';const active=x.filter&&x.filter!=='all'&&activeQuickFilter===x.filter?' active':'';const attrs=x.filter?`button type="button" onclick="${x.filter==='all'?'clearQuickFilter()':`toggleQuickFilter('${x.filter}')`}" aria-pressed="${activeQuickFilter===x.filter}"`:'div';return `<${attrs} class="card ${x.filter?'kpi-card':''}${active}"><div class="label">${x.label}</div><div class="value">${x.value}</div><div class="sub">${x.sub}</div>${tag?`<div class="sub">${tag}</div>`:''}</${x.filter?'button':'div'}>`;}).join('');}
    function setQuickFilter(key){activeQuickFilter=activeQuickFilter===key?'':key;renderKpis();renderDistributionBars();renderStocks();document.querySelector('.wide')?.scrollIntoView({behavior:'smooth',block:'start'});}
    function toggleQuickFilter(key){setQuickFilter(key);}
    function clearQuickFilter(){activeQuickFilter='';renderKpis();renderDistributionBars();renderStocks();document.querySelector('.wide')?.scrollIntoView({behavior:'smooth',block:'start'});}
    function fillSelect(id,values){const el=document.getElementById(id);el.innerHTML+=values.map(v=>`<option value="${v}">${v}</option>`).join('');}
    function renderStocks(){const q=document.getElementById('q').value.trim().toLowerCase();const d=document.getElementById('direction').value;const r=document.getElementById('risk').value;const ind=document.getElementById('industry').value;const signal=document.getElementById('signal').value;const quick=quickFilters[activeQuickFilter];const filtered=dashboard.stocks.filter(s=>(!q||[s.stock_code,s.stock_name,s.industry].some(v=>String(v).toLowerCase().includes(q)))&&(!d||s.final_direction_label===d)&&(!r||s.risk_label===r)&&(!ind||s.industry===ind)&&(!signal||(s.reversal_signals?.tags||[]).includes(signal))&&(!quick||quick.test(s)));const rows=filtered.sort((a,b)=>(b.relative_strength_7d?.relative_strength_7d??-999)-(a.relative_strength_7d?.relative_strength_7d??-999)||b.direction_score-a.direction_score).slice(0,250);const scope=[quick?quick.label:'全部清單'];if(d)scope.push(d);if(r)scope.push(r);if(ind)scope.push(ind);if(signal)scope.push(signal);if(q)scope.push(`搜尋：${q}`);document.getElementById('stockListTitle').textContent=`股票清單（${scope.join(' / ')}）`;document.getElementById('filterNote').textContent=`${quick?quick.label:'全部股票'}：${filtered.length.toLocaleString()} 檔${filtered.length>250?'，顯示前 250 檔':''}`;document.getElementById('stockRows').innerHTML=rows.map(s=>`<tr><td><a class="link" href="${s.report_file}">個股</a></td><td><a class="link" href="https://tw.stock.yahoo.com/quote/${s.stock_code}.TW/technical-analysis" target="_blank" rel="noopener noreferrer">${s.stock_name} <b>${s.stock_code}</b></a></td><td>${s.industry}</td><td><span class="pill ${cls(s.final_direction_label)}">${s.final_direction_label}</span></td><td>${s.direction_score}</td><td><span class="pill ${cls(s.risk_label)}">${s.risk_label}</span></td><td><span class="pill ${cls(s.market_context_risk_label)}">${s.market_context_risk_label||'NA'}</span></td><td>${s.data_completeness}%</td><td>${fmt(s.features.r1)}</td><td>${fmt(s.features.r3)}</td><td>${fmt(s.relative_strength_7d?.relative_strength_7d)}</td><td>${s.relative_strength_7d?.relative_strength_mode||'NA'}</td><td>${fmt(s.features.rsi14)}</td><td>${fmt(s.features.volume_ratio_1d)}</td><td>${s.chip_bias}</td><td>${(s.reversal_signals?.tags||[]).join('、')||'—'}</td></tr>`).join('');}
    loadDashboard().catch(err=>{document.getElementById('meta').textContent=`載入失敗：${err.message}`});
  </script>
</body>
</html>
