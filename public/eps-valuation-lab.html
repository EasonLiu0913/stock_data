<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPS 估值公式實驗室</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1500px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dfe5ef;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0000000a}h1{margin:0 0 8px}.muted{color:#667085}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.filters label{font-size:12px;color:#667085}.filters select,.filters input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccd3df;border-radius:8px;background:#fff}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{padding:12px;border-radius:10px;background:#f8fafc}.stat b{display:block;font-size:22px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 10px;border-bottom:1px solid #edf0f5;text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#fff;cursor:pointer}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}.table-wrap{overflow:auto;max-height:680px}.good{color:#067647;font-weight:700}.bad{color:#b42318}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2f8}.formula{font-size:12px}.warn{padding:12px;border-radius:8px;background:#fff7ed;color:#9a3412}</style></head><body><div class="wrap"><div class="card"><h1>EPS 估值公式實驗室</h1><div class="muted">用每季財報當時可得的 EPS 與歷史本益比，估算合理價格區間，再用下一次季報前的最高價反推哪個公式最接近。</div></div><div class="card"><div id="status">載入資料中…</div><div class="stats" id="stats"></div></div><div class="card"><div class="filters"><div><label>股票代碼</label><input id="stock" placeholder="例如 2330"></div><div><label>財報季度</label><select id="period"><option value="">全部</option></select></div><div><label>EPS 預估法</label><select id="eps"><option value="">全部</option></select></div><div><label>P/E 區間法</label><select id="pe"><option value="">全部</option></select></div><div><label>只看命中合理區間</label><select id="hit"><option value="">全部</option><option value="1">命中</option><option value="0">未命中</option></select></div></div></div><div class="card"><h2>公式整體排名</h2><div class="table-wrap"><table id="summary"><thead><tr><th data-k="eps_method_label">EPS 法</th><th data-k="pe_method_label">P/E 法</th><th data-k="samples">樣本</th><th data-k="hit_rate_pct">命中率%</th><th data-k="mean_range_error_pct">平均區間誤差%</th><th data-k="median_center_error_pct">中位中心誤差%</th></tr></thead><tbody></tbody></table></div></div><div class="card"><h2>逐筆驗證</h2><div class="table-wrap"><table id="rows"><thead><tr><th data-k="stock_code">股票</th><th data-k="fiscal_period">季度</th><th data-k="effective_trading_date">可交易日</th><th data-k="base_close">當時股價</th><th data-k="estimated_annual_eps">估計全年 EPS</th><th data-k="fair_low">合理低</th><th data-k="fair_high">合理高</th><th data-k="future_high">未來一季最高</th><th data-k="future_high_date">高點日期</th><th data-k="range_error_pct">區間誤差%</th><th data-k="center_error_pct">中心誤差%</th><th>結果</th><th>公式</th></tr></thead><tbody></tbody></table></div></div><div class="card"><b>方法說明</b><div id="method" class="muted"></div></div></div><script>const basePath=location.hostname.includes('github.io')?'/stock_data':'..';let data=null,sort={table:'summary',key:'mean_range_error_pct',asc:true};const $=id=>document.getElementById(id);function fmt(v,d=2){return Number.isFinite(Number(v))?Number(v).toFixed(d):'—'}function opt(sel,rows,key,label){const vals=[...new Map(rows.map(r=>[r[key],r[label]||r[key]])).entries()].sort((a,b)=>String(a[1]).localeCompare(String(b[1]),'zh-Hant'));for(const [v,t] of vals){const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o)}}function render(){if(!data)return;const stock=$('stock').value.trim(),period=$('period').value,eps=$('eps').value,pe=$('pe').value,hit=$('hit').value;let rows=data.rows.filter(r=>(!stock||r.stock_code.includes(stock))&&(!period||r.fiscal_period===period)&&(!eps||r.eps_method===eps)&&(!pe||r.pe_method===pe)&&(!hit||String(+r.hit_range)===hit));$('stats').innerHTML=`<div class=stat><span>股票</span><b>${new Set(rows.map(r=>r.stock_code)).size}</b></div><div class=stat><span>樣本</span><b>${rows.length}</b></div><div class=stat><span>命中率</span><b>${rows.length?fmt(rows.filter(r=>r.hit_range).length/rows.length*100,1):'—'}%</b></div><div class=stat><span>平均區間誤差</span><b>${rows.length?fmt(rows.reduce((s,r)=>s+r.range_error_pct,0)/rows.length,1):'—'}%</b></div>`;let summary=data.formula_summary.filter(r=>(!eps||r.eps_method===eps)&&(!pe||r.pe_method===pe));summary.sort((a,b)=>cmp(a,b,sort.table==='summary'?sort.key:'mean_range_error_pct',sort.asc));$('summary').querySelector('tbody').innerHTML=summary.map(r=>`<tr><td>${r.eps_method_label}</td><td>${r.pe_method_label}</td><td>${r.samples}</td><td>${fmt(r.hit_rate_pct)}</td><td>${fmt(r.mean_range_error_pct)}</td><td>${fmt(r.median_center_error_pct)}</td></tr>`).join('');rows.sort((a,b)=>cmp(a,b,sort.table==='rows'?sort.key:'fiscal_period',sort.asc));$('rows').querySelector('tbody').innerHTML=rows.map(r=>`<tr><td>${r.stock_code}</td><td>${r.fiscal_period}</td><td>${r.effective_trading_date}</td><td>${fmt(r.base_close)}</td><td>${fmt(r.estimated_annual_eps)}</td><td>${fmt(r.fair_low)}</td><td>${fmt(r.fair_high)}</td><td>${fmt(r.future_high)}</td><td>${r.future_high_date}</td><td class="${r.range_error_pct===0?'good':'bad'}">${fmt(r.range_error_pct)}</td><td>${fmt(r.center_error_pct)}</td><td>${r.hit_range?'<span class="good">命中</span>':'未命中'}</td><td class=formula>${r.eps_method_label}<br><span class=pill>${r.pe_method_label}</span></td></tr>`).join('')}function cmp(a,b,k,asc){let x=a[k],y=b[k];if(typeof x==='number'&&typeof y==='number')return asc?x-y:y-x;return asc?String(x??'').localeCompare(String(y??'')):String(y??'').localeCompare(String(x??''))}async function init(){try{const res=await fetch(`${basePath}/data_prediction_analysis/eps-valuation/valuation-backtest.json`,{cache:'no-store'});if(!res.ok)throw new Error(`${res.status} ${res.statusText}`);data=await res.json();$('status').textContent=`資料更新：${new Date(data.generated_at).toLocaleString('zh-TW')}｜共 ${data.formula_summary.length} 組有效公式`;opt($('period'),data.rows,'fiscal_period','fiscal_period');opt($('eps'),data.rows,'eps_method','eps_method_label');opt($('pe'),data.rows,'pe_method','pe_method_label');$('method').textContent=`資訊限制：${data.methodology.information_rule} 目標：${data.methodology.target_rule} 歷史 P/E：${data.methodology.pe_history_rule}`;for(const id of ['stock','period','eps','pe','hit'])$(id).addEventListener('input',render);document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const table=th.closest('table').id;sort={table,key:th.dataset.k,asc:sort.table===table&&sort.key===th.dataset.k?!sort.asc:true};render()});render()}catch(e){$('status').innerHTML=`<div class=warn>無法載入估值回測資料：${e.message}</div>`}}init();</script></body></html>
