<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票數據工具清單</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; color: #0f172a; min-height: 100vh; padding: 1.5rem; }
        .container { max-width: 1120px; margin: 0 auto; }
        .header, .toolbar, .link-list { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 8px 24px rgba(15,23,42,.08); }
        .header { padding: 1.5rem; margin-bottom: 1rem; }
        h1 { font-size: 1.8rem; line-height: 1.3; color: #1e293b; margin-bottom: .5rem; }
        .meta { color: #64748b; font-size: .95rem; font-weight: 600; }
        .toolbar { padding: 1rem; margin-bottom: 1rem; display: flex; gap: .75rem; align-items: center; }
        label { font-weight: 700; color: #334155; white-space: nowrap; }
        input { width: 100%; min-height: 40px; border: 1px solid #cbd5e1; border-radius: 6px; padding: .55rem .75rem; background: #fff; color: #0f172a; font-size: .95rem; outline: none; }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
        .link-list { overflow: hidden; }
        .tool-link, .prediction-toggle, .prediction-link { display: grid; grid-template-columns: 1fr auto; gap: 1rem; color: inherit; text-decoration: none; }
        .tool-link { padding: 1rem 1.25rem; border-bottom: 1px solid #e2e8f0; }
        .tool-link:last-child { border-bottom: 0; }
        .tool-link:hover, .prediction-toggle:hover, .prediction-group[open] .prediction-toggle { background: #eff6ff; }
        .prediction-group { border-bottom: 1px solid #e2e8f0; }
        .prediction-toggle { padding: 1rem 1.25rem; cursor: pointer; list-style: none; }
        .prediction-toggle::-webkit-details-marker { display: none; }
        .prediction-toggle .tool-title::before { display: inline-block; width: 1rem; margin-right: .35rem; color: #2563eb; content: '›'; transform-origin: center; transition: transform 160ms ease; }
        .prediction-group[open] .prediction-toggle .tool-title::before { transform: rotate(90deg); }
        .prediction-links { padding: 0 1rem 1rem 2.5rem; background: #f8fafc; }
        .prediction-link { padding: .9rem 1rem; border: 1px solid #dbe5f0; border-bottom: 0; background: #fff; }
        .prediction-link:first-child { border-radius: 7px 7px 0 0; }
        .prediction-link:last-child { border-bottom: 1px solid #dbe5f0; border-radius: 0 0 7px 7px; }
        .prediction-link:only-child { border-bottom: 1px solid #dbe5f0; border-radius: 7px; }
        .prediction-link:hover { background: #f0fdf4; }
        .tool-title { display: block; color: #1e293b; font-size: 1.05rem; font-weight: 800; margin-bottom: .25rem; }
        .tool-desc { display: block; color: #64748b; line-height: 1.5; font-size: .93rem; }
        .tool-file { color: #2563eb; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: .88rem; font-weight: 800; align-self: center; white-space: nowrap; }
        .empty { display: none; padding: 2rem; text-align: center; color: #64748b; font-weight: 700; }
        @media (max-width: 768px) {
            body { padding: .75rem; }
            h1 { font-size: 1.35rem; }
            .toolbar { align-items: stretch; flex-direction: column; }
            .tool-link, .prediction-toggle, .prediction-link { grid-template-columns: 1fr; }
            .prediction-links { padding: 0 .75rem .75rem; }
            .tool-file { white-space: normal; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>股票數據工具清單</h1>
            <div class="meta" id="pageMeta"></div>
        </div>
        <div class="toolbar">
            <label for="searchInput">搜尋</label>
            <input id="searchInput" type="text" placeholder="輸入頁面名稱或檔名" oninput="renderLinks()">
        </div>
        <div class="link-list" id="linkList"></div>
        <div class="empty" id="emptyState">沒有符合條件的頁面</div>
    </div>
    <script>
        const tools = [
            { file: 'etf-market-regime-analysis.html', title: '0050／0052／00631L 持有與市場情境比較', description: '自選日期區間，比較三檔 ETF 的持有報酬、風險與資產差異，並切換持續上漲、持續下跌、區間震盪、緩慢上漲與緩慢下跌情境。' },
            { file: 'oversold-rebound-dashboard.html', title: '跌深反彈歷史研究 Dashboard', description: '查詢個股歷史跌深事件、反彈成功率、成功與失敗特徵差異及資料覆蓋率。' },
            { file: 'three-day-breakout-institutional-report.html', title: '三日漲幅 10% 前法人與券商布局分析', description: '找出所有連續三個交易日漲幅達 10% 的股票，回看起漲前法人、券商分點、量能與均線共同特徵。' },
            { file: 'strategy-review-center.html', title: '策略總覽與驗證中心', description: '集中檢查所有策略與觀察標籤的篩選規則、指定日期候選、歷史準確度與逐檔清單；策略新增或升版後會由 registry 自動同步。' },
            { file: 'prediction-version-dashboard.html', title: 'V1 / V2 股票預測切換', description: '切換正式 V1 與實驗 V2，查看方向、分數差異、規則調整與個股明細。' },
            { file: 'prediction-dashboard.html', title: '股票預測總覽 Dashboard', description: '彙整最新預測批次的方向、風險、資料完整度、產業與策略分類。' },
            { file: 'prediction-replay-dashboard.html', title: '股票預測覆盤 Dashboard', description: '查看正式覆盤命中率、錯誤群聚、因子關聯與下一步模型修正優先級。' },
            { file: 'prediction-industry-dashboard.html', title: '產業預測解讀 Dashboard', description: '以產業為分析單位，查看各產業的整合分數、風險、籌碼與技術結構。' },
            { file: 'prediction-groups.html', title: '股票預測策略分類', description: '依優先觀察、強勢過熱、籌碼同步、資料不足等策略分類瀏覽股票。' },
            { file: 'stock-price-change.html', title: '股價漲跌試算表', description: '輸入昨收價格，或用目前股價與漲跌幅反推，查看正負 10% 股價表並估算目標價漲跌幅。' },
            { file: 'stock-data-browser.html', title: '股票數據瀏覽器', description: '瀏覽富邦與證交所股票排行資料，依日期與排行類型切換表格。' },
            { file: 'pocket-00981A.html', title: '00981A ETF 持股與產業分布', description: '查看 Pocket 口袋證券 00981A 持股內容與產業分布長條圖。' },
            { file: 'foreign.html', title: '法人連續買賣超股票', description: '追蹤法人連續買賣超與多日排行條件。' },
            { file: 'twse-foreign-investors.html', title: '外資及陸資買賣超彙總表', description: '瀏覽證交所外資及陸資每日買賣超資料。' },
            { file: 'twse-institutional-investors.html', title: '三大法人買賣超日報', description: '瀏覽三大法人買賣超日報資料。' },
            { file: 'twse-dealers.html', title: '自營商買賣超彙總表', description: '瀏覽自營商買賣超彙總資料。' },
            { file: 'twse-margin-balance.html', title: '信用交易融資融券餘額', description: '查看上市股票信用交易融資融券餘額。' },
            { file: 'twse-market-chart.html', title: '台灣加權指數日 K 線', description: '同步查看加權指數日 K、成交量與外資買賣超金額。' },
            { file: 'sma-below.html', title: '股價低於均線清單', description: '篩選股價低於均線的股票清單。' },
            { file: 'warrants.html', title: '權證標的十日追蹤', description: '追蹤權證標的近十日資料變化。' },
            { file: 'analyze.html', title: 'Stock Analysis Tool', description: '個股資料分析工具。' },
            { file: 'compare.html', title: 'Stock Comparison Tool', description: '比較 Fubon 與 TWSE 股票資料。' }
        ];

        // 每日預測流程會重建此區塊；首頁工具清單目前不直接呈現逐檔連結。
        const predictions = [
        ];

        function escapeHtml(value) {
            return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function renderLinks() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const filteredTools = tools.filter(tool => !keyword || [tool.file, tool.title, tool.description].some(value => String(value).toLowerCase().includes(keyword)));
            const totalPages = tools.length;
            const matchedPages = filteredTools.length;
            document.getElementById('pageMeta').textContent = `共 ${totalPages.toLocaleString()} 個 HTML 頁面；目前符合 ${matchedPages.toLocaleString()} 個`;

            const toolLinks = filteredTools.map(tool => `
                <a class="tool-link" href="${escapeHtml(tool.file)}" target="_blank" rel="noopener noreferrer">
                    <span><span class="tool-title">${escapeHtml(tool.title)}</span><span class="tool-desc">${escapeHtml(tool.description)}</span></span>
                    <span class="tool-file">${escapeHtml(tool.file)}</span>
                </a>`).join('');

            document.getElementById('linkList').innerHTML = toolLinks;
            document.getElementById('emptyState').style.display = matchedPages === 0 ? 'block' : 'none';
        }
        renderLinks();
    </script>
</body>
</html>
