name: '[06 回填修復] MOPS－上市公司月營收區間回填'

on:
  workflow_dispatch:
    inputs:
      start_month:
        description: '開始營收月份 YYYYMM（例如 202511）'
        required: true
        type: string
      end_month:
        description: '結束營收月份 YYYYMM（例如 202607）'
        required: true
        type: string
      force_new_snapshot:
        description: '即使來源內容與上一份相同，也強制保留新的 snapshot'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: backfill-mops-monthly-revenue
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Run Task Framework and MOPS regression tests
        run: |
          node --check scripts/framework/task_manifest.js
          node --check scripts/framework/task_retry.js
          node --check scripts/framework/task_logger.js
          node --check scripts/framework/task_runner.js
          node --check scripts/framework/index.js
          node --check scripts/backfill_mops_monthly_revenue_task.js
          node --check scripts/run_mops_backfill_workflow.js
          node --check scripts/crawl_mops_monthly_revenue.js
          node --check scripts/apply_mops_snapshot_policy.js
          node --check scripts/rebuild_mops_monthly_revenue_metadata.js
          node --check tests/task_framework.test.js
          node --check tests/mops_backfill_task_adapter.test.js
          node --check tests/mops_backfill_workflow_caller.test.js
          node --test tests/task_framework.test.js
          node --test tests/mops_backfill_task_adapter.test.js
          node --test tests/mops_backfill_workflow_caller.test.js
          node --test tests/mops_monthly_revenue.test.js

      - name: Backfill with resume, retry, and 3-month checkpoints
        shell: bash
        env:
          START_MONTH: ${{ inputs.start_month }}
          END_MONTH: ${{ inputs.end_month }}
          FORCE_NEW_SNAPSHOT: ${{ inputs.force_new_snapshot }}
        run: |
          set -euo pipefail
          args=(
            --start-month "$START_MONTH"
            --end-month "$END_MONTH"
          )
          if [ "$FORCE_NEW_SNAPSHOT" = "true" ]; then
            args+=(--force-new-snapshot)
          fi
          node scripts/run_mops_backfill_workflow.js "${args[@]}"
