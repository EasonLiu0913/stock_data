name: Analyze Official Constraints Impact

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/official_market_constraints.js
      - scripts/taifex_date_query_probe.js
      - scripts/analyze_official_constraints_impact.js
      - .github/workflows/analyze-official-constraints-impact.yml
  workflow_dispatch:
    inputs:
      target_date:
        description: '分析日期 YYYYMMDD'
        required: true
        default: '20260731'
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/official-disposition-night-data-v1
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/official_market_constraints.js
            scripts/taifex_date_query_probe.js
            scripts/analyze_official_constraints_impact.js
            data_prediction_analysis/formal-strategy/20260731.json
            data_market_environment/20260731/oversold_beta_rebound.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch official snapshots and calculate impact
        env:
          TARGET_DATE: ${{ inputs.target_date || '20260731' }}
        run: |
          mkdir -p data_market_constraints/$TARGET_DATE
          node --check scripts/analyze_official_constraints_impact.js
          node scripts/official_market_constraints.js --date "$TARGET_DATE" --allow-partial --output "data_market_constraints/$TARGET_DATE/source-probe.json"
          node scripts/taifex_date_query_probe.js --date "$TARGET_DATE" --output "data_market_constraints/$TARGET_DATE/taifex-date-query.json"
          node scripts/analyze_official_constraints_impact.js \
            --date "$TARGET_DATE" \
            --disposition-file "data_market_constraints/$TARGET_DATE/source-probe.json" \
            --date-query-file "data_market_constraints/$TARGET_DATE/taifex-date-query.json" \
            --output "data_market_constraints/$TARGET_DATE/impact.json"

      - uses: actions/upload-artifact@v4
        with:
          name: official-constraints-impact-${{ inputs.target_date || '20260731' }}
          path: data_market_constraints/${{ inputs.target_date || '20260731' }}/impact.json
          if-no-files-found: error
