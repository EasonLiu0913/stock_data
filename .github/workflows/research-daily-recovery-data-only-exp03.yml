name: "[Research] Daily Data Recovery Data Only Experiment 03"
on:
  push:
    branches: [research/daily-data-recovery-v2-exp01-20261013]
    paths:
      - 'scripts/research/experiment03_data_only.js'
      - 'scripts/research/experiment03_writer_safety.test.js'
      - 'scripts/research/experiment03_data_only.test.js'
      - '.github/workflows/research-daily-recovery-data-only-exp03.yml'
permissions:
  contents: read
jobs:
  sandbox-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify synthetic data-only recovery and real isolated list producer
        run: |
          node --check scripts/research/experiment03_data_only.js
          node scripts/research/experiment03_writer_safety.test.js
          node scripts/research/experiment03_data_only.test.js
          test -z "$(git status --porcelain)"
