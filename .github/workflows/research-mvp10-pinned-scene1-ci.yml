name: "[Research Only] MVP10 Pinned Scene1 Source Validation"

on:
  push:
    branches:
      - research/daily-video-mvp10-a-20261029
    paths:
      - .github/workflows/research-mvp10-pinned-scene1-ci.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: research-mvp10-pinned-scene1
  cancel-in-progress: false

jobs:
  verify-pinned-scene1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: debian:trixie
    steps:
      - name: Enforce isolated branch and forbid publication
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "research/daily-video-mvp10-a-20261029"
          test "$GITHUB_REF_TYPE" = "branch"
      - name: Checkout research-only verification sources
        uses: actions/checkout@v4
        with:
          ref: research/daily-video-mvp10-a-20261029
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/research_verify_20261008_scene1_source.py
            scripts/test_research_verify_20261008_scene1_source.py
            scripts/research_build_pinned_scene1_fixture.py
            research/fixtures/20261008_scene1_v4_14cues_RESEARCH_ONLY.srt
          sparse-checkout-cone-mode: false
      - name: Install deterministic local media validators
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 python3-mutagen ffmpeg ca-certificates curl
          python3 --version
          ffmpeg -version | head -1
      - name: Read only two pinned historical GitHub Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pinned"
          for id in 12953454424 13036325288; do
            curl --fail --silent --show-error --location --retry 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              -o "$RUNNER_TEMP/pinned/$id.zip"
            test -s "$RUNNER_TEMP/pinned/$id.zip"
          done
          sha256sum "$RUNNER_TEMP/pinned/"*.zip
      - name: Reconstruct exact source-bound scene1 from pinned media
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/research_build_pinned_scene1_fixture.py \
            --old "$RUNNER_TEMP/pinned/12953454424.zip" \
            --v4 "$RUNNER_TEMP/pinned/13036325288.zip" \
            --srt "research/fixtures/20261008_scene1_v4_14cues_RESEARCH_ONLY.srt" \
            --out "$RUNNER_TEMP/scene1"
      - name: Execute exact committed validator and 10 original negative tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
          MVP10_RESEARCH_SCENE1_FIXTURE: ${{ runner.temp }}/scene1
          MVP10_RESEARCH_SCENE1_WAV: ${{ runner.temp }}/scene1/source_scene1.wav
        run: |
          set -euo pipefail
          python3 scripts/research_verify_20261008_scene1_source.py \
            "$MVP10_RESEARCH_SCENE1_FIXTURE" --source-wav "$MVP10_RESEARCH_SCENE1_WAV"
          python3 -m unittest -v scripts/test_research_verify_20261008_scene1_source.py
          echo "MVP10 source-only isolated tests PASSED; publication NOT authorized" >> "$GITHUB_STEP_SUMMARY"
