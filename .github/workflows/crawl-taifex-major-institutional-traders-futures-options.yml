name: "[01 台股資料] Crawl TAIFEX Futures and Options Institutional Traders"

on:
  schedule:
    # 每天 13:11 台北時間 (05:11 UTC)
    - cron: '11 5 * * *'
    # 每天 14:56 台北時間 (06:56 UTC)
    - cron: '56 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Expected data date (YYYYMMDD). Leave empty for latest.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  crawl-taifex-futures-options:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci

      - name: Resolve scheduled TAIFEX expected date
        if: github.event_name == 'schedule'
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          occurrence_json=$(node scripts/resolve_scheduled_collection_date.js \
            --event-name schedule \
            --schedule "$EVENT_SCHEDULE" \
            --policy same_calendar_date \
            --time-zone Asia/Taipei \
            --json)
          base_date=$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.target_date);' "$occurrence_json")
          expected_date=$(node scripts/resolve_taifex_scheduled_date.js --base-date "$base_date")
          echo "TAIFEX scheduled occurrence base date: $base_date"
          echo "TAIFEX expected trading date: $expected_date"
          echo "TAIFEX_EXPECTED_DATE=$expected_date" >> "$GITHUB_ENV"

      - name: Crawl TAIFEX futures/options institutional trader data
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/crawl_taifex_major_institutional_traders_futures_options.js --date "$TAIFEX_EXPECTED_DATE"
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            node scripts/crawl_taifex_major_institutional_traders_futures_options.js --date "${{ github.event.inputs.date }}"
          else
            node scripts/crawl_taifex_major_institutional_traders_futures_options.js
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data_taifex_major_institutional_traders_futures_options/

          if git diff --staged --quiet; then
            echo "No TAIFEX futures/options changes"
            exit 0
          fi

          CURRENT_DATE=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          git commit -m "chore: update TAIFEX futures/options institutional data ${CURRENT_DATE}"

          success=false
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              success=true
              break
            fi
            echo "Push failed, retry $i..."
            sleep 5
          done

          if [ "$success" != "true" ]; then
            echo "Failed to push TAIFEX futures/options changes"
            exit 1
          fi

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
