name: "[06 回填修復] 跌深反彈－資料覆蓋率補齊"

on:
  schedule:
    - cron: '17 18 * * 0,2,4' # 台北一三五 02:17：投信＋自營商
    - cron: '47 18 * * 1,3,5' # 台北二四六 02:47：融資融券
    - cron: '17 17 * * 6'     # 台北週日 01:17：券商分點
  workflow_dispatch:
    inputs:
      source:
        description: '要補的資料來源'
        required: true
        type: choice
        default: all
        options: [all, institutional, margin, broker]
      max_institutional_dates:
        description: '本次最多補幾個法人交易日'
        type: number
        default: 10
      max_margin_dates:
        description: '本次最多補幾個融資融券交易日'
        type: number
        default: 10
      max_broker_dates:
        description: '本次最多補幾個券商分點交易日；建議 1'
        type: number
        default: 1
      lookback_days:
        description: '法人／融資累積特徵回看交易日數'
        type: number
        default: 10
      min_request_delay_ms:
        description: 'TWSE 請求前最短隨機等待毫秒'
        type: number
        default: 5000
      max_request_delay_ms:
        description: 'TWSE 請求前最長隨機等待毫秒'
        type: number
        default: 15000
      min_date_pause_seconds:
        description: '完成一個日期後最短休息秒數'
        type: number
        default: 60
      max_date_pause_seconds:
        description: '完成一個日期後最長休息秒數'
        type: number
        default: 180
      force:
        description: '重新下載既有檔案'
        type: boolean
        default: false
      refresh_dashboard:
        description: '有新增資料時重建研究與 Dashboard'
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/backfill-oversold-rebound-coverage.yml'
      - 'scripts/plan_oversold_rebound_coverage_backfill.js'
      - 'scripts/crawl_twse_margin_balance.js'
      - 'scripts/patch_oversold_rebound_dealer_features.js'
      - 'scripts/run_oversold_rebound_research.js'
      - 'tests/plan_oversold_rebound_coverage_backfill.test.js'
      - 'tests/crawl_twse_margin_balance.test.js'
      - 'tests/patch_oversold_rebound_dealer_features.test.js'

permissions:
  contents: write
  actions: write

concurrency:
  group: oversold-rebound-coverage-backfill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      institutional: ${{ steps.plan.outputs.institutional }}
      margin: ${{ steps.plan.outputs.margin }}
      broker: ${{ steps.plan.outputs.broker }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Validate backfill code
        run: |
          node --check scripts/plan_oversold_rebound_coverage_backfill.js
          node --check scripts/crawl_twse_margin_balance.js
          node --check scripts/patch_oversold_rebound_dealer_features.js
          node --check scripts/run_oversold_rebound_research.js
          node --test \
            tests/plan_oversold_rebound_coverage_backfill.test.js \
            tests/crawl_twse_margin_balance.test.js \
            tests/patch_oversold_rebound_dealer_features.test.js \
            tests/oversold_rebound_research.test.js
      - name: Resolve source
        id: resolve
        shell: bash
        env:
          INPUT_SOURCE: ${{ inputs.source }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then source="${INPUT_SOURCE:-all}"
          elif [ '${{ github.event_name }}' = 'pull_request' ]; then source=all
          else
            case "$SCHEDULE" in
              '17 18 * * 0,2,4') source=institutional ;;
              '47 18 * * 1,3,5') source=margin ;;
              '17 17 * * 6') source=broker ;;
              *) source=all ;;
            esac
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - name: Plan highest-impact missing dates
        id: plan
        shell: bash
        env:
          SOURCE: ${{ steps.resolve.outputs.source }}
          LOOKBACK: ${{ inputs.lookback_days }}
          MAX_INSTITUTIONAL: ${{ inputs.max_institutional_dates }}
          MAX_MARGIN: ${{ inputs.max_margin_dates }}
          MAX_BROKER: ${{ inputs.max_broker_dates }}
        run: |
          set -euo pipefail
          plan_dates() {
            local source="$1" max="$2" file="/tmp/$1-plan.json"
            node scripts/plan_oversold_rebound_coverage_backfill.js \
              --sources "$source" --max-dates "$max" --lookback-days "${LOOKBACK:-10}" > "$file"
            cat "$file" >&2
            node -e 'const p=require(process.argv[1]);console.log(p.sources[process.argv[2]].selected_dates.join(","))' "$file" "$source"
          }
          institutional=''; margin=''; broker=''
          if [[ "$SOURCE" == all || "$SOURCE" == institutional ]]; then institutional=$(plan_dates institutional "${MAX_INSTITUTIONAL:-10}"); fi
          if [[ "$SOURCE" == all || "$SOURCE" == margin ]]; then margin=$(plan_dates margin "${MAX_MARGIN:-10}"); fi
          if [[ "$SOURCE" == all || "$SOURCE" == broker ]]; then broker=$(plan_dates broker "${MAX_BROKER:-1}"); fi
          echo "institutional=$institutional" >> "$GITHUB_OUTPUT"
          echo "margin=$margin" >> "$GITHUB_OUTPUT"
          echo "broker=$broker" >> "$GITHUB_OUTPUT"
          printf '### 覆蓋率回填計畫\n\n- 法人：%s\n- 融資融券：%s\n- 券商分點：%s\n' \
            "${institutional:-無}" "${margin:-無}" "${broker:-無}" >> "$GITHUB_STEP_SUMMARY"

  backfill:
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Playwright when broker work exists
        if: needs.plan.outputs.broker != ''
        run: npx playwright install --with-deps chromium
      - name: Backfill selected dates and commit each completed date
        id: run
        shell: bash
        env:
          INSTITUTIONAL_DATES: ${{ needs.plan.outputs.institutional }}
          MARGIN_DATES: ${{ needs.plan.outputs.margin }}
          BROKER_DATES: ${{ needs.plan.outputs.broker }}
          MIN_DELAY: ${{ inputs.min_request_delay_ms }}
          MAX_DELAY: ${{ inputs.max_request_delay_ms }}
          MIN_PAUSE: ${{ inputs.min_date_pause_seconds }}
          MAX_PAUSE: ${{ inputs.max_date_pause_seconds }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$RUNNER_TEMP/coverage-logs" "$RUNNER_TEMP/coverage-saved"
          changed=false; failures=()

          pause_between_dates() {
            local minimum="${1:-${MIN_PAUSE:-60}}" maximum="${2:-${MAX_PAUSE:-180}}"
            [ "$maximum" -lt "$minimum" ] && maximum="$minimum"
            local seconds=$((minimum + RANDOM % (maximum - minimum + 1)))
            echo "⏳ 下一日期前休息 ${seconds}s"; sleep "$seconds"
          }

          push_files() {
            local message="$1"; shift
            local saved="$RUNNER_TEMP/coverage-saved/push"
            rm -rf "$saved"; mkdir -p "$saved"
            local file
            for file in "$@"; do [ -f "$file" ] && cp --parents "$file" "$saved"; done
            [ -n "$(find "$saved" -type f -print -quit)" ] || return 1
            for attempt in 1 2 3 4 5; do
              git fetch origin main && git reset --hard origin/main
              cp -a "$saved/." .
              node scripts/generate_file_lists.js --only data_twse_investment_trust,data_twse_dealers,data_twse_margin_balance,data_fubon_broker_details
              git add data_twse_investment_trust data_twse_dealers data_twse_margin_balance data_fubon_broker_details
              if git diff --cached --quiet; then return 0; fi
              git commit -m "$message"
              if git pull --rebase origin main && git push origin HEAD:main; then changed=true; return 0; fi
              sleep $((attempt * 5))
            done
            return 1
          }

          backfill_institutional() {
            [ -n "$INSTITUTIONAL_DATES" ] || return 0
            IFS=',' read -r -a dates <<< "$INSTITUTIONAL_DATES"
            for index in "${!dates[@]}"; do
              date="${dates[$index]}"
              set +e
              node scripts/crawl_twse_institutional_summaries_range.js \
                --start "$date" --end "$date" --datasets TWT44U,TWT43U \
                --min-delay "${MIN_DELAY:-5000}" --max-delay "${MAX_DELAY:-15000}" \
                --max-retries 4 --retry-cooldown 120000 --max-days 1 \
                2>&1 | tee "$RUNNER_TEMP/coverage-logs/institutional-${date}.log"
              status=${PIPESTATUS[0]}; set -e
              files=("data_twse_investment_trust/${date}_twse_investment_trust.json" "data_twse_dealers/${date}_twse_dealers.json")
              [ "$status" -eq 0 ] && push_files "🏛️ Backfill oversold rebound institutional coverage ${date}" "${files[@]}" || failures+=("institutional:$date")
              [ "$index" -lt "$((${#dates[@]} - 1))" ] && pause_between_dates
            done
          }

          backfill_margin() {
            [ -n "$MARGIN_DATES" ] || return 0
            IFS=',' read -r -a dates <<< "$MARGIN_DATES"
            for index in "${!dates[@]}"; do
              date="${dates[$index]}"; args=(--date "$date" --max-retries 4 --retry-cooldown-ms 120000 --min-delay-ms "${MIN_DELAY:-5000}" --max-delay-ms "${MAX_DELAY:-15000}")
              [ "$FORCE" = true ] && args+=(--force)
              set +e; node scripts/crawl_twse_margin_balance.js "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/coverage-logs/margin-${date}.log"; status=${PIPESTATUS[0]}; set -e
              file="data_twse_margin_balance/${date}_twse_margin_balance.csv"
              [ "$status" -eq 0 ] && push_files "📊 Backfill oversold rebound margin coverage ${date}" "$file" || failures+=("margin:$date")
              [ "$index" -lt "$((${#dates[@]} - 1))" ] && pause_between_dates
            done
          }

          backfill_broker() {
            [ -n "$BROKER_DATES" ] || return 0
            IFS=',' read -r -a dates <<< "$BROKER_DATES"
            for index in "${!dates[@]}"; do
              date="${dates[$index]}"; iso="${date:0:4}-${date:4:2}-${date:6:2}"
              args=(--date "$iso" --final-output-dir data_fubon_broker_details --work-root "$RUNNER_TEMP/fubon-work" --concurrency 2 --retries 4 --min-delay-ms 1200 --max-delay-ms 3500 --backoff-base-ms 8000 --checkpoint-size 100)
              [ "$FORCE" = true ] && args+=(--force)
              set +e; node scripts/crawl_fubon_broker_date_isolated.js "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/coverage-logs/broker-${date}.log"; status=${PIPESTATUS[0]}; set -e
              file="data_fubon_broker_details/fubon_${date}_券商分點進出明細.json"
              [ "$status" -eq 0 ] && push_files "🏦 Backfill oversold rebound broker coverage ${date}" "$file" || failures+=("broker:$date")
              [ "$index" -lt "$((${#dates[@]} - 1))" ] && pause_between_dates 300 900
            done
          }

          backfill_institutional
          backfill_margin
          backfill_broker
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "${#failures[@]}" -gt 0 ]; then printf '未完成：%s\n' "${failures[*]}"; exit 1; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oversold-rebound-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/coverage-logs
          if-no-files-found: warn
          retention-days: 14
      - name: Rebuild research and Dashboard once
        if: steps.run.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.refresh_dashboard == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run mine-oversold-rebound-research.yml --repo '${{ github.repository }}' --ref main -f dry_run=false
          echo '已派送完整研究與 Dashboard 重建。'
