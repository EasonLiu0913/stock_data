name: "[07 研究] 發布 5% 漲幅新聞題材 Summary"

on:
  push:
    branches: [main]
    paths:
      - 'data_daily_gain_over_5/analysis-news/*.json'
  workflow_dispatch:
    inputs:
      date:
        description: '新聞題材分析日期 YYYYMMDD；留空取最新 analysis-news 日期'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-gainers-news-summary
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.date.outputs.date }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Resolve target date from triggering artifact
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --check scripts/resolve_daily_gainers_news_summary_date.js

          latest_news_date="$(find data_daily_gain_over_5/analysis-news -maxdepth 1 -type f -name '20??????.json' -printf '%f\n' 2>/dev/null | sed 's/\.json$//' | sort | tail -1)"
          args=(
            --event "$EVENT_NAME"
            --input-date "${INPUT_DATE:-}"
            --latest-news-date "${latest_news_date:-}"
          )

          if [ "$EVENT_NAME" = "push" ]; then
            [[ "$EVENT_AFTER" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid push after SHA: $EVENT_AFTER" >&2; exit 1; }
            git fetch --no-tags --depth=1 origin "$EVENT_AFTER"

            if [[ "$EVENT_BEFORE" =~ ^0{40}$ ]]; then
              mapfile -t changed_files < <(git diff-tree --no-commit-id --name-only -r "$EVENT_AFTER")
            else
              [[ "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid push before SHA: $EVENT_BEFORE" >&2; exit 1; }
              git fetch --no-tags --depth=1 origin "$EVENT_BEFORE"
              mapfile -t changed_files < <(git diff --name-only "$EVENT_BEFORE" "$EVENT_AFTER")
            fi

            printf 'Push changed files:\n'
            printf '  %s\n' "${changed_files[@]}"
            for file in "${changed_files[@]}"; do
              args+=(--changed-file "$file")
            done
          fi

          date="$(node scripts/resolve_daily_gainers_news_summary_date.js "${args[@]}")"
          [[ "$date" =~ ^20[0-9]{6}$ ]] || { echo "Invalid or missing date: $date" >&2; exit 1; }
          echo "Resolved target date: $date"
          echo "date=$date" >> "$GITHUB_OUTPUT"
      - name: Migrate existing unified analysis into news stage when needed
        shell: bash
        run: |
          set -euo pipefail
          d="${{ steps.date.outputs.date }}"
          news="data_daily_gain_over_5/analysis-news/${d}.json"
          if [ ! -s "$news" ]; then
            node scripts/migrate_daily_gainers_unified_to_news.js "$d"
          fi
      - name: Canonicalize news analysis shape
        shell: bash
        run: |
          set -euo pipefail
          d="${{ steps.date.outputs.date }}"
          node --check scripts/canonicalize_daily_gainers_news_analysis.js
          node scripts/canonicalize_daily_gainers_news_analysis.js "$d"
      - name: Validate news analysis and build preliminary summary
        shell: bash
        run: |
          set -euo pipefail
          d="${{ steps.date.outputs.date }}"
          node --check scripts/validate_daily_gainers_news_analysis.js
          node --check scripts/build_daily_gainers_market_summary.js
          node --check scripts/validate_daily_gainers_market_summary.js
          node scripts/validate_daily_gainers_news_analysis.js "$d"
          node scripts/build_daily_gainers_market_summary.js --date "$d"
          node scripts/validate_daily_gainers_market_summary.js --date "$d"
          node - "$d" <<'NODE'
          const fs=require('node:fs');const d=process.argv[2];const p=JSON.parse(fs.readFileSync(`data_daily_gain_over_5/market-summary/${d}.json`,'utf8'));
          if(p.status==='final'&&p.summary_stage==='full_synthesis') {
            console.log('Final summary already exists; news-stage data was migrated without downgrading final summary.');
          } else if(p.summary_stage!=='news_theme'||p.status!=='preliminary') {
            throw new Error(`Expected preliminary news_theme or existing final summary; got ${p.status}/${p.summary_stage}`);
          }
          NODE
      - name: Commit news stage and summary
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          d="${{ steps.date.outputs.date }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "data_daily_gain_over_5/analysis-news/${d}.json" "data_daily_gain_over_5/market-summary/${d}.json" "data_daily_gain_over_5/market-summary/manifest.json"
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "analysis: publish 5% news stage and summary ${d}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git fetch origin main && git rebase origin/main
            sleep 5
          done
          exit 1

  deploy:
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      target_date: ${{ needs.publish.outputs.target_date }}

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
