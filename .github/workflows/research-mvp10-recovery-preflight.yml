name: "[Research Only] MVP10 dated recovery preflight"
# This workflow NEVER dispatches a crawler, Pages, video or upload workflow.
on:
  push:
    branches:
      - research/daily-video-mvp10-a-20261029
    paths:
      - scripts/research_mvp10_recovery_plan.js
      - tests/research_mvp10_recovery_plan.test.js
      - .github/workflows/research-mvp10-recovery-preflight.yml
permissions:
  contents: read
concurrency:
  group: research-mvp10-recovery-preflight
  cancel-in-progress: true
jobs:
  research-recovery-preflight:
    if: github.ref == 'refs/heads/research/daily-video-mvp10-a-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Refuse production branch and publication context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "research/daily-video-mvp10-a-20261029"
          test "$GITHUB_REF_TYPE" = branch
      - name: Checkout research-only planner and tests
        uses: actions/checkout@v4
        with:
          ref: research/daily-video-mvp10-a-20261029
          path: research
          persist-credentials: false
          sparse-checkout: |
            scripts/research_mvp10_recovery_plan.js
            tests/research_mvp10_recovery_plan.test.js
          sparse-checkout-cone-mode: false
      - name: Checkout read-only latest main source inputs
        uses: actions/checkout@v4
        with:
          ref: main
          path: inputs
          persist-credentials: false
          sparse-checkout: |
            scripts
            config
            data_daily_gain_over_5
            research_pending/daily-gainers-ai
            video_scripts/daily-gainers
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run seven offline negative and resumption tests
        working-directory: research
        run: |
          set -euo pipefail
          node --check scripts/research_mvp10_recovery_plan.js
          node --test tests/research_mvp10_recovery_plan.test.js
      - name: Inspect actual Nov 2 source dates, stages and missing dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/mvp10-recovery
          git -C inputs rev-parse HEAD > output/mvp10-recovery/source-main-sha.txt
          node research/scripts/research_mvp10_recovery_plan.js \
            --date 20261102 --root inputs \
            --source-commit "$(cat output/mvp10-recovery/source-main-sha.txt)" \
            --output output/mvp10-recovery/20261102-plan.json
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('output/mvp10-recovery/20261102-plan.json','utf8'));
          if(p.target_date!=='20261102'||p.auto_dispatch_allowlist.length!==0||
             p.stages.some(s=>s.dispatch_requested)||p.publication_authorized!==false||
             p.youtube_upload_authorized!==false||p.pages_deploy_authorized!==false||
             p.dashboard_version!=='TAIWAN_STOCK_TABLE_LIST_20261102_V1')
            throw Error('RESEARCH_SAFETY_GATE_FAIL');
          console.log('RECOVERY_PREFLIGHT_ONLY_PASS',JSON.stringify({
            main:p.source_commit,stage_statuses:p.stages.map(s=>[s.id,s.status]),
            requested_dispatches:0,first_blocked_stage:p.first_blocked_stage
          }));
          NODE
      - name: Independently run original per-stage validators without publishing
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process');
          const date='20261102',root=path.resolve('inputs');
          const checks=[
            ['facts','data_daily_gain_over_5/analysis-facts/'+date+'.json',
              ['scripts/daily_gainers_ai_contract_cli.js','assert-facts','data_daily_gain_over_5/analysis-facts/'+date+'.json']],
            ['news','data_daily_gain_over_5/analysis-news/'+date+'.json',
              ['scripts/validate_daily_gainers_news_analysis.js',date]],
            ['ai_pending','research_pending/daily-gainers-ai/'+date+'.json',
              ['scripts/validate_daily_gainers_ai_analysis.js',date,'research_pending/daily-gainers-ai/'+date+'.json']],
            ['ai','data_daily_gain_over_5/analysis-ai/'+date+'.json',
              ['scripts/validate_daily_gainers_ai_analysis.js',date,'data_daily_gain_over_5/analysis-ai/'+date+'.json']],
            ['summary','data_daily_gain_over_5/market-summary/'+date+'.json',
              ['scripts/validate_daily_gainers_market_summary.js','--date',date]],
            ['script','video_scripts/daily-gainers/'+date+'.json',
              ['scripts/validate_daily_gainers_video_script.js',date]]
          ];
          const results={target_date:date,main_sha:fs.readFileSync('output/mvp10-recovery/source-main-sha.txt','utf8').trim(),
            read_only:true,publication_authorized:false,youtube_upload_authorized:false,checks:[]};
          let failed=false;
          for(const [stage,input,args] of checks){
            const file=path.join(root,input);
            if(!fs.existsSync(file)){results.checks.push({stage,status:'MISSING_INPUT',input});continue;}
            if(stage==='summary'){
              const summary=JSON.parse(fs.readFileSync(file,'utf8'));
              if(summary.status!=='final'){results.checks.push({stage,status:'PRELIMINARY_NOT_FINAL',input});continue;}
            }
            const p=cp.spawnSync(process.execPath,args,{cwd:root,encoding:'utf8',timeout:90000});
            const status=p.status===0?'ORIGINAL_VALIDATOR_PASS':'ORIGINAL_VALIDATOR_FAIL';
            results.checks.push({stage,status,input,exit_code:p.status,error_excerpt:String(p.stderr||p.error||'').slice(0,450)});
            if(status==='ORIGINAL_VALIDATOR_FAIL')failed=true;
          }
          fs.writeFileSync('output/mvp10-recovery/original-validator-results.json',JSON.stringify(results,null,2)+'\n');
          console.log('ORIGINAL_VALIDATOR_PRECHECK',JSON.stringify(results.checks.map(x=>({stage:x.stage,status:x.status}))));
          if(failed)process.exitCode=1;
          NODE
      - name: Record real CI Run ID for the next research-only review
        if: always()
        shell: bash
        run: |
          mkdir -p output/mvp10-recovery
          jq -n --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{run_id:($run_id|tonumber),run_attempt:($attempt|tonumber),sha:$sha,
              ref:$ref,run_url:$url,read_only:true,dispatches:0,
              youtube_upload_authorized:false,publication_authorized:false}' \
            > output/mvp10-recovery/runner.json
          echo "Recovery preflight run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve actual dated recovery plan or failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-mvp10-20261102-recovery-preflight-only
          path: output/mvp10-recovery/
          if-no-files-found: warn
          retention-days: 14
