name: "[Research] M9 Final Authorization Review Offline"
on:
  push:
    branches:
      - research/m9-controlled-private-preview-20261012
    paths:
      - scripts/verify_m9_stage1_final_authorization_review_offline.py
      - data_research/m5/m9/stage1/M9-STAGE1-SINGLE-GET-FINAL-AUTHORIZATION-REVIEW-v1.json
      - .github/workflows/research-m9-final-authorization-review-offline.yml
permissions:
  contents: read
jobs:
  static-only:
    if: github.ref == 'refs/heads/research/m9-controlled-private-preview-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify final authorization document and 43 negative mutations
        run: python -I scripts/verify_m9_stage1_final_authorization_review_offline.py
