name: "[Research Only] MVP10 Official MOPS Historical September Revenue"
on:
  push:
    branches:
      - research/daily-video-mvp10-a-20261029
    paths:
      - .github/workflows/research-mvp10-official-mops-revenue.yml
      - scripts/research_mvp10_mops_september_revenue.py
      - scripts/reconcile_mvp10_mops_claims.js
      - tests/reconcile_mvp10_mops_claims.test.js
permissions:
  contents: read
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Assert isolated research branch
        run: |
          test "$GITHUB_REF_NAME" = "research/daily-video-mvp10-a-20261029"
          test "$GITHUB_REF_TYPE" = "branch"
      - uses: actions/checkout@v4
        with:
          ref: research/daily-video-mvp10-a-20261029
          persist-credentials: false
          sparse-checkout: |
            scripts/research_mvp10_mops_september_revenue.py
            scripts/reconcile_mvp10_mops_claims.js
            tests/reconcile_mvp10_mops_claims.test.js
            data_daily_gain_over_5/analysis/20261008.json
          sparse-checkout-cone-mode: false
      - name: Read two original official MOPS historical archives
        run: |
          python3 -m py_compile scripts/research_mvp10_mops_september_revenue.py
          python3 scripts/research_mvp10_mops_september_revenue.py "$RUNNER_TEMP/mvp10-official-mops"
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"mvp10-official-mops"/"20261008-mops-revenue-original-receipt.json").read_text())
          assert r["research_only"] is True and r["render_authorized"] is False
          assert r["publication_authorized"] is False
          assert r["full_market_summary_approved"] is False
          assert r["company_event_caused_market_movement_verified"] is False
          assert r["official_table_columns_verified"] is True
          assert r["official_column_proof"]["3416"]["official_yoy_pct"] == 95.90
          assert r["official_column_proof"]["2305"]["company_name"] == "全友"
          assert r["official_column_proof"]["6672"]["revenue_thousand_ntd"] == 1020897
          print("Proof status:",r["decision"])
          print("Official field-position audited:",len(r["official_revenue_claims_validated"]))
          for p in r["pages"]:
            for code, row in p["target_rows"].items():
              print("OFFICIAL_ROW", code, json.dumps(row,ensure_ascii=False))
          PY
          echo "Official MOPS original receipts may be blocked by upstream. Media/event causation and final video gates remain OFF." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify primary-revenue-only semantic bindings
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/reconcile_mvp10_mops_claims.test.js
          node scripts/reconcile_mvp10_mops_claims.js \
            "$RUNNER_TEMP/mvp10-official-mops/20261008-mops-revenue-original-receipt.json" \
            "data_daily_gain_over_5/analysis/20261008.json" \
            "$RUNNER_TEMP/mvp10-official-mops/20261008-primary-revenue-claim-boundary.json"
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const d=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'mvp10-official-mops/20261008-primary-revenue-claim-boundary.json'),'utf8'));
          if(d.primary_revenue_facts.length!==3||d.unresolved_legacy_strong_claims.length!==8||
            d.provisional_editorial_claim_ledger.length!==32||
            d.provisional_editorial_claim_ledger.some(x=>x.supported_stock_price_cause!==false)||
            d.render_authorized!==false||d.summary_final!==false||d.publication_authorized!==false)
            throw Error('PREMATURE_FINAL_SOURCE_PROMOTION');
          console.log('OFFICIAL_MOPS_FACT_BOUNDARY_PASS sources=3 provisional_stocks=32 unresolved_strong=8 render=false');
          NODE
          echo "3 primary revenue facts validated; 8 legacy strong claims need independent review. No price causation or final video authorized." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload original HTTP receipt and any directly matching rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp10-official-mops-september-2026-source-receipts
          path: ${{ runner.temp }}/mvp10-official-mops/
          if-no-files-found: warn
          retention-days: 14
