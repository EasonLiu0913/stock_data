name: 每日預測覆盤

on:
  workflow_dispatch:
    inputs:
      replay_date:
        description: '要覆盤的預測交易日（YYYYMMDD，例如 20260729）'
        required: true
        type: string
      force_comparison:
        description: '同日期已有覆盤比較時仍重新產生'
        required: false
        type: boolean
        default: false
      low_volume_threshold:
        description: '低量門檻：實際成交量 ÷ 前 20 日平均成交量'
        required: false
        type: string
        default: '0.75'

permissions:
  contents: write

concurrency:
  group: daily-prediction-replay
  cancel-in-progress: false

jobs:
  replay_and_compare:
    name: 產生 V1／V2 覆盤比較
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm checked-out main commit
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Resolve and verify comparison date
        id: date
        shell: bash
        env:
          DATE: ${{ inputs.replay_date }}
          FORCE_RUN: ${{ inputs.force_comparison }}
        run: |
          date="$DATE"
          if ! [[ "$date" =~ ^20[0-9]{6}$ ]]; then
            echo "Unable to resolve a valid comparison date: $date"
            exit 1
          fi

          test -s "data_predictions/$date/manifest.json" || {
            echo "Missing V1 forecast manifest for $date"
            exit 1
          }
          test -s "data_predictions_v2/$date/manifest.json" || {
            echo "Missing V2 forecast manifest for $date"
            exit 1
          }
          test -s "data_fubon/fubon_${date}_sma.json" || {
            echo "Actual result-day price file is not ready: data_fubon/fubon_${date}_sma.json"
            exit 1
          }

          comparison_run=true
          if [ "$FORCE_RUN" != "true" ] \
            && [ -s "data_prediction_comparisons/$date/comparison.json" ]; then
            comparison_run=false
            echo "Comparison already exists for $date. Use force_comparison=true for an intentional rerun."
          fi

          factor_analysis_run=false
          if [ "$comparison_run" = "true" ] \
            || [ ! -s "data_prediction_analysis/$date/industry-factor-ranges.json" ]; then
            factor_analysis_run=true
          fi

          volume_analysis_run=false
          if [ "$comparison_run" = "true" ] \
            || [ ! -s "data_prediction_analysis/$date/volume-filter-impact.json" ]; then
            volume_analysis_run=true
          fi

          echo "run=$comparison_run" >> "$GITHUB_OUTPUT"
          echo "factor_analysis_run=$factor_analysis_run" \
            >> "$GITHUB_OUTPUT"
          echo "volume_analysis_run=$volume_analysis_run" \
            >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"

          echo "## 每日預測覆盤" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 覆盤日期：$date" >> "$GITHUB_STEP_SUMMARY"
          echo "- 重新產生比較：$comparison_run" >> "$GITHUB_STEP_SUMMARY"
          echo "- 重新產生產業分析：$factor_analysis_run" >> "$GITHUB_STEP_SUMMARY"
          echo "- 重新產生成交量分析：$volume_analysis_run" >> "$GITHUB_STEP_SUMMARY"

      - name: Replay V1
        if: steps.date.outputs.run == 'true'
        run: |
          node scripts/generate_prediction_replay.js \
            --date "${{ steps.date.outputs.date }}"

      - name: Replay V2 with five evaluation angles
        if: steps.date.outputs.run == 'true'
        run: |
          node scripts/generate_prediction_replay_v2.js \
            --date "${{ steps.date.outputs.date }}" \
            --cost-bps 30

      - name: Analyze low-volume exclusion impact
        if: steps.date.outputs.volume_analysis_run == 'true'
        run: |
          node scripts/analyze_replay_volume_filter.js \
            --date "${{ steps.date.outputs.date }}" \
            --low-volume-threshold "${{ inputs.low_volume_threshold }}"

      - name: Generate V1 and V2 accuracy comparison
        if: steps.date.outputs.run == 'true'
        run: |
          node scripts/compare_prediction_versions.js \
            --date "${{ steps.date.outputs.date }}"

      - name: Generate industry r1 r3 and 7-day RS analysis
        if: steps.date.outputs.factor_analysis_run == 'true'
        run: |
          node scripts/analyze_replay_factor_ranges.js \
            --date "${{ steps.date.outputs.date }}"

      - name: Commit replay comparison and analyses
        if: steps.date.outputs.run == 'true' || steps.date.outputs.factor_analysis_run == 'true' || steps.date.outputs.volume_analysis_run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data_predictions \
            data_predictions_v2 \
            data_prediction_comparisons \
            data_prediction_analysis

          if git diff --cached --quiet; then
            echo "No replay or analysis changes"
            exit 0
          fi

          git commit -m \
            "feat: update replay comparison and analyses for ${{ steps.date.outputs.date }}"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before comparison rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main \
              && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Replay comparison push failed; retry ${attempt}/5"
            sleep 5
          done

          echo "Replay comparison push failed after 5 attempts"
          exit 1
