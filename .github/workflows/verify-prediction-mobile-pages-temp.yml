name: "[TEMP] Verify prediction mobile Pages deployment"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-prediction-mobile-pages-temp.yml"

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Mark verification pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"prediction-mobile-pages/live","description":"Checking deployed mobile card assets"}' >/dev/null
      - name: Wait for deployed mobile card assets
        shell: bash
        run: |
          set -euo pipefail
          asset="https://easonliu0913.github.io/stock_data/public/components/prediction-dashboard-mobile-cards.js"
          loader="https://easonliu0913.github.io/stock_data/public/prediction-back-to-top.js"
          ok=0
          for attempt in $(seq 1 60); do
            asset_body="$(curl -fsSL --max-time 15 "$asset" || true)"
            loader_body="$(curl -fsSL --max-time 15 "$loader" || true)"
            if grep -q "PredictionDashboardMobileCards" <<<"$asset_body" \
              && grep -q "prediction-dashboard-mobile-cards.js?v=2" <<<"$loader_body" \
              && grep -q "翻轉訊號：目前沒有" <<<"$asset_body"; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "Pages did not expose the expected prediction mobile assets in time." >&2
            exit 1
          fi
      - name: Mark verification success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"prediction-mobile-pages/live","description":"Pages exposes prediction mobile cards v2"}' >/dev/null
      - name: Mark verification failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"prediction-mobile-pages/live","description":"Pages mobile asset verification failed"}' >/dev/null
