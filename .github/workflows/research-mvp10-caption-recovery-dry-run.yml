name: "[Research Only] MVP10 Caption Recovery Dry Run"
on:
  push:
    branches: [research/daily-video-mvp10-a-20261029]
    paths: [.github/workflows/research-mvp10-caption-recovery-dry-run.yml]
  workflow_dispatch:
    inputs:
      date:
        description: "Trading date YYYYMMDD"
        required: true
permissions:
  contents: read
jobs:
  route-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/daily-video-mvp10-a-20261029
          sparse-checkout: |
            scripts/daily_gainers_mvp_upload_decision.js
            scripts/daily_gainers_mvp_upload_route.js
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve durable receipt without uploading
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DATE: ${{ inputs.date || '20261013' }}
          MVP_TARGET_DATE: ${{ inputs.date || '20261013' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$TARGET_DATE" =~ ^20[0-9]{6}$ ]] || exit 1
          path="video_upload_receipts/mvp-private/$TARGET_DATE.json"
          http_status="$(gh api -i "repos/$GITHUB_REPOSITORY/contents/$path?ref=research/daily-video-mvp10-a-20261029" 2>/dev/null | head -n 1 || true)"
          if [[ "$http_status" == *" 200 "* ]]; then
            gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=research/daily-video-mvp10-a-20261029" --jq '.content' | base64 -d > receipt.json
            export MVP_UPLOAD_RECEIPT_FILE="$PWD/receipt.json"
          elif [[ "$http_status" == *" 404 "* ]]; then
            echo "Receipt absent: upload state remains unknown; fail closed"
          else
            echo "Receipt lookup unavailable or unauthorized: $http_status" >&2
            exit 1
          fi
          # Authorization here only evaluates the pure decision; no upload credentials or action is available.
          export YOUTUBE_UPLOAD_AUTHORIZED=private-pilot
          set +e
          node scripts/daily_gainers_mvp_upload_route.js
          status=$?
          set -e
          echo "Dry run only; never dispatch YouTube or write a receipt"
          test "$status" -eq 0 || test "$status" -eq 2
