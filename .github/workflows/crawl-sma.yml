name: "[01 台股資料] Crawl SMA Data"

on:
  schedule:
    # 每天 13:32 台北時間 (05:32 UTC)
    - cron: '32 5 * * *'
    # 每天 14:27 台北時間 (06:27 UTC)
    - cron: '27 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target Date (YYYYMMDD format, e.g., 20260204)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl-sma
  cancel-in-progress: false

jobs:
  crawl-sma:
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.crawl.outputs.target_date }}
      ready: ${{ steps.crawl.outputs.ready }}
      available_sma_date: ${{ steps.crawl.outputs.available_sma_date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Validate SMA date detector
        run: |
          node --check scripts/detect_latest_sma_date.js
          node scripts/detect_latest_sma_date.js --self-test

      - name: Resolve target date and run SMA crawler
        id: crawl
        shell: bash
        run: |
          set -euo pipefail
          input_date="${{ inputs.date }}"
          ready="true"
          available_sma_date=""

          if [ -n "$input_date" ]; then
            target_date="$input_date"
            echo "📅 手動目標交易日：$target_date"
          else
            target_date=$(TZ='Asia/Taipei' date '+%Y%m%d')
            available_sma_date=$(node scripts/detect_latest_sma_date.js)
            echo "📅 流程目標交易日：$target_date"
            echo "📈 富邦最新可用 SMA 日期：$available_sma_date"

            if [ "$available_sma_date" != "$target_date" ]; then
              ready="false"
            fi
          fi

          [[ "$target_date" =~ ^20[0-9]{6}$ ]] || {
            echo "Invalid SMA target date: $target_date"
            exit 1
          }

          if [ -n "$available_sma_date" ]; then
            [[ "$available_sma_date" =~ ^20[0-9]{6}$ ]] || {
              echo "Invalid available SMA date: $available_sma_date"
              exit 1
            }
          fi

          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "available_sma_date=$available_sma_date" >> "$GITHUB_OUTPUT"

          echo "- 流程目標交易日：$target_date" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$available_sma_date" ]; then
            echo "- 富邦最新可用 SMA 日期：$available_sma_date" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$ready" != "true" ]; then
            echo "- SMA 狀態：尚未更新到目標交易日，本輪不爬取、不產生 5% 清單，等待下一個排程重試。" >> "$GITHUB_STEP_SUMMARY"
            echo "⏭️ SMA 尚未更新到 $target_date；目前最新為 $available_sma_date。本輪安全結束。"
            exit 0
          fi

          echo "- SMA 狀態：目標日期已就緒，開始爬取。" >> "$GITHUB_STEP_SUMMARY"
          node scripts/crawl_sma_data.js --date "$target_date"

      - name: Generate SMA files.json only
        if: steps.crawl.outputs.ready == 'true'
        run: node scripts/generate_file_lists.js --only data_fubon

      - name: Commit and push changes
        if: steps.crawl.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_fubon/

          if git diff --staged --quiet; then
            if [ -n "$(git status --porcelain)" ]; then
              echo "Unexpected uncommitted changes remain even though there are no SMA changes:"
              git status --short
              exit 1
            fi
            echo "No changes to commit"
            exit 0
          fi

          CURRENT_DATE=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          git commit -m "📈 Update SMA data - ${CURRENT_DATE}"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed, retry ${attempt}/5..."
            sleep 5
          done

          echo "Failed to push SMA data after 5 attempts."
          exit 1

  daily-gainers:
    name: 產生當日 5% 漲幅清單並發布
    needs: crawl-sma
    if: needs.crawl-sma.outputs.ready == 'true'
    uses: ./.github/workflows/daily-gainers-over-5.yml
    with:
      date: ${{ needs.crawl-sma.outputs.target_date }}
