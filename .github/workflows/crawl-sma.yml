name: "[01 台股資料] Crawl SMA Data"

on:
  schedule:
    # 每天 10:22 台北時間 (02:22 UTC)
    - cron: '22 2 * * *'
    # 每天 10:41 台北時間 (02:41 UTC)
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target Date (YYYYMMDD format, e.g., 20260204)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl-sma
  cancel-in-progress: false

jobs:
  crawl-sma:
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.crawl.outputs.target_date }}
      ready: ${{ steps.crawl.outputs.ready }}
      available_sma_date: ${{ steps.crawl.outputs.available_sma_date }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Validate SMA date detector and schedule resolver
        run: |
          node --check scripts/detect_latest_sma_date.js
          node scripts/detect_latest_sma_date.js --self-test
          node --check scripts/resolve_scheduled_sma_target_date.js
          node scripts/resolve_scheduled_sma_target_date.js --self-test

      - name: Resolve target date and run SMA crawler
        id: crawl
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule || '' }}
          INPUT_DATE: ${{ inputs.date || '' }}
        run: |
          set -euo pipefail
          ready="true"
          available_sma_date=""
          target_source="manual_current_date"
          scheduled_at_utc=""
          scheduled_at_taipei=""
          schedule_delay_minutes=""

          if [ -n "$INPUT_DATE" ]; then
            target_date="$INPUT_DATE"
            target_source="manual_explicit_date"
            echo "📅 手動目標交易日：$target_date"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            schedule_json=$(node scripts/resolve_scheduled_sma_target_date.js --schedule "$SCHEDULE_EXPR" --json)
            target_date=$(node -e 'const p=JSON.parse(process.argv[1]);process.stdout.write(p.target_date);' "$schedule_json")
            scheduled_at_utc=$(node -e 'const p=JSON.parse(process.argv[1]);process.stdout.write(p.scheduled_at_utc);' "$schedule_json")
            scheduled_at_taipei=$(node -e 'const d=new Date(process.argv[1]);const p=new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(d);const v=Object.fromEntries(p.map(x=>[x.type,x.value]));process.stdout.write(`${v.year}-${v.month}-${v.day} ${v.hour}:${v.minute}`);' "$scheduled_at_utc")
            schedule_delay_minutes=$(node -e 'const p=JSON.parse(process.argv[1]);process.stdout.write(String(p.delay_minutes));' "$schedule_json")
            target_source="scheduled_intended_date"
            echo "📅 排程原定目標交易日：$target_date"
            echo "🕒 原定排程時間（台北時間）：$scheduled_at_taipei"
            echo "⏱️ GitHub 排程延遲：約 ${schedule_delay_minutes} 分鐘"
          else
            target_date=$(TZ='Asia/Taipei' date '+%Y%m%d')
            echo "📅 手動執行、未指定日期；使用台北今天：$target_date"
          fi

          [[ "$target_date" =~ ^20[0-9]{6}$ ]] || {
            echo "Invalid SMA target date: $target_date"
            exit 1
          }

          persisted_sma_file="data_fubon/fubon_${target_date}_sma.json"
          persisted_sma_valid="false"

          if [ -f "$persisted_sma_file" ]; then
            if node -e 'const fs=require("node:fs");const file=process.argv[1];const compact=process.argv[2];const expectedDate=`${compact.slice(0,4)}/${compact.slice(4,6)}/${compact.slice(6,8)}`;const data=JSON.parse(fs.readFileSync(file,"utf8"));const entries=Object.entries(data||{});let matchingRows=0;for(const [,stock] of entries){const row=stock&&stock[expectedDate];if(row&&row.Price!=null&&row.SMA5!=null)matchingRows++;}if(entries.length<100||matchingRows<100)process.exit(1);console.log(`Validated persisted SMA checkpoint: ${file}; stocks=${entries.length}; matchingRows=${matchingRows}`);' "$persisted_sma_file" "$target_date"; then
              persisted_sma_valid="true"
            else
              echo "::warning::Existing $persisted_sma_file is invalid or incomplete; crawler will refresh it."
            fi
          fi
          if [ "$persisted_sma_valid" = "true" ]; then
            available_sma_date="$target_date"
            echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "available_sma_date=$available_sma_date" >> "$GITHUB_OUTPUT"
            echo "## SMA Crawl" >> "$GITHUB_STEP_SUMMARY"
            echo "- 日期來源：$target_source" >> "$GITHUB_STEP_SUMMARY"
            echo "- 流程目標交易日：$target_date" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$scheduled_at_taipei" ]; then
              echo "- 原定排程時間（台北時間）：$scheduled_at_taipei" >> "$GITHUB_STEP_SUMMARY"
              echo "- GitHub 排程延遲：約 ${schedule_delay_minutes} 分鐘" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "- 富邦最新可用 SMA 日期：$available_sma_date" >> "$GITHUB_STEP_SUMMARY"
            echo "- SMA 狀態：remote main 已有完整 durable checkpoint，本輪跳過外部爬取。" >> "$GITHUB_STEP_SUMMARY"
            echo "⏭️ $persisted_sma_file 已存在且驗證通過；跳過重複 SMA crawl。"
            exit 0
          fi

          available_sma_date=$(node scripts/detect_latest_sma_date.js)
          echo "📈 富邦最新可用 SMA 日期：$available_sma_date"

          if [ -n "$available_sma_date" ]; then
            [[ "$available_sma_date" =~ ^20[0-9]{6}$ ]] || {
              echo "Invalid available SMA date: $available_sma_date"
              exit 1
            }
          fi

          if [ "$available_sma_date" != "$target_date" ]; then
            ready="false"
          fi

          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "available_sma_date=$available_sma_date" >> "$GITHUB_OUTPUT"

          echo "## SMA Crawl" >> "$GITHUB_STEP_SUMMARY"
          echo "- 日期來源：$target_source" >> "$GITHUB_STEP_SUMMARY"
          echo "- 流程目標交易日：$target_date" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$scheduled_at_taipei" ]; then
            echo "- 原定排程時間（台北時間）：$scheduled_at_taipei" >> "$GITHUB_STEP_SUMMARY"
            echo "- GitHub 排程延遲：約 ${schedule_delay_minutes} 分鐘" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$available_sma_date" ]; then
            echo "- 富邦最新可用 SMA 日期：$available_sma_date" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$ready" != "true" ]; then
            echo "- SMA 狀態：來源尚未更新到目標交易日，本輪不爬取、不產生 5% 清單，等待下一個排程重試。" >> "$GITHUB_STEP_SUMMARY"
            echo "⏭️ SMA 尚未更新到 $target_date；目前最新為 $available_sma_date。本輪安全結束。"
            exit 0
          fi

          echo "- SMA 狀態：目標日期已就緒，開始爬取。" >> "$GITHUB_STEP_SUMMARY"
          node scripts/crawl_sma_data.js --date "$target_date"

      - name: Generate SMA files.json only
        if: steps.crawl.outputs.ready == 'true'
        run: node scripts/generate_file_lists.js --only data_fubon

      - name: Commit and push changes
        if: steps.crawl.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_fubon/

          if git diff --staged --quiet; then
            if [ -n "$(git status --porcelain)" ]; then
              echo "Unexpected uncommitted changes remain even though there are no SMA changes:"
              git status --short
              exit 1
            fi
            echo "No changes to commit"
            exit 0
          fi

          CURRENT_DATE=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          git commit -m "📈 Update SMA data - ${CURRENT_DATE}"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed, retry ${attempt}/5..."
            sleep 5
          done

          echo "Failed to push SMA data after 5 attempts."
          exit 1

  daily-gainers:
    name: 產生當日 5% 漲幅清單並發布
    needs: crawl-sma
    if: needs.crawl-sma.outputs.ready == 'true'
    uses: ./.github/workflows/daily-gainers-over-5.yml
    with:
      date: ${{ needs.crawl-sma.outputs.target_date }}

  final-summary:
    name: 執行摘要
    needs:
      - crawl-sma
      - daily-gainers
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write SMA execution summary
        shell: bash
        env:
          CRAWL_RESULT: ${{ needs.crawl-sma.result }}
          DAILY_GAINERS_RESULT: ${{ needs.daily-gainers.result }}
          TARGET_DATE: ${{ needs.crawl-sma.outputs.target_date }}
          READY: ${{ needs.crawl-sma.outputs.ready }}
          AVAILABLE_SMA_DATE: ${{ needs.crawl-sma.outputs.available_sma_date }}
        run: |
          set -euo pipefail

          target_date="${TARGET_DATE:-unknown}"
          ready="${READY:-unknown}"
          available_sma_date="${AVAILABLE_SMA_DATE:-unknown}"
          crawl_result="${CRAWL_RESULT:-unknown}"
          daily_result="${DAILY_GAINERS_RESULT:-unknown}"

          {
            echo
            echo "## SMA 執行結果"
            echo
            echo "| 項目 | 結果 |"
            echo "| --- | --- |"
            echo "| 預計抓取交易日 | \`${target_date}\` |"
            echo "| 富邦最新可用 SMA 日期 | \`${available_sma_date}\` |"
            echo "| SMA ready | \`${ready}\` |"
            echo "| SMA 主流程 | \`${crawl_result}\` |"
            echo "| 產生當日 5% 漲幅清單並發布 | \`${daily_result}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$crawl_result" != "success" ]; then
            {
              echo "### ❌ 本輪未完成"
              echo
              echo "- 原因：\`crawl-sma\` 主流程結果為 **${crawl_result}**。"
              echo "- 因主流程未成功完成，後續 5% 漲幅清單可能被 skipped。"
              echo "- 請直接查看 \`crawl-sma\` job 的失敗 step；本 Summary 不會把失敗誤判成資料未 ready。"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ready" != "true" ]; then
            {
              echo "### ⚠️ 安全結束：來源資料尚未 Ready"
              echo
              echo "- 預計抓取 **${target_date}**，但富邦目前最新 SMA 日期是 **${available_sma_date}**。"
              echo "- 因兩個日期不一致，workflow 刻意設定 \`ready=false\`，本輪不執行 SMA 爬取。"
              echo "- 「產生當日 5% 漲幅清單並發布」因此被 **skipped**，不是該 job 自己發生錯誤。"
              echo "- GitHub 整體可能仍顯示 success；這代表安全結束，不代表 ${target_date} 的資料已完成。"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$daily_result" = "success" ]; then
            {
              echo "### ✅ 本輪完整完成"
              echo
              echo "- 富邦 SMA 已更新到預計交易日 **${target_date}**。"
              echo "- SMA 主流程與當日 5% 漲幅清單均已成功執行。"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$daily_result" = "skipped" ]; then
            {
              echo "### ⚠️ 狀態異常"
              echo
              echo "- SMA 顯示 \`ready=true\`，但 5% 漲幅清單仍被 skipped。"
              echo "- 這不符合目前 workflow 的預期條件，請檢查 reusable workflow/job 條件。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ 5% 漲幅清單未完成"
              echo
              echo "- SMA 主流程已成功且 \`ready=true\`。"
              echo "- 但「產生當日 5% 漲幅清單並發布」結果為 **${daily_result}**。"
              echo "- 請查看該 reusable workflow 的失敗或取消原因。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for schedule summary
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js
