name: "[06 回填修復] Retry SMA Failed"

on:
  schedule:
    # 每天 17:29 台北時間 (09:29 UTC)
    - cron: '29 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target Date (YYYYMMDD format, e.g., 20260204)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: retry-sma
  cancel-in-progress: false

jobs:
  retry-sma:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Determine target date
        id: date
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule || '' }}
          INPUT_DATE: ${{ github.event.inputs.date || '' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_DATE" ]; then
            TARGET_DATE="$INPUT_DATE"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            resolved=$(node scripts/resolve_scheduled_collection_date.js \
              --event-name "$EVENT_NAME" \
              --schedule "$SCHEDULE_EXPR" \
              --policy same_trade_date \
              --json)
            TARGET_DATE=$(node -e 'const p=JSON.parse(process.argv[1]);process.stdout.write(p.target_date);' "$resolved")
            echo "Delay-safe retry date: $resolved"
          else
            TARGET_DATE=$(TZ='Asia/Taipei' date '+%Y%m%d')
          fi
          echo "target=${TARGET_DATE}" >> "$GITHUB_OUTPUT"

      - name: Check if failed list exists
        id: check
        run: |
          FAILED_FILE="data_fubon/fubon_${{ steps.date.outputs.target }}_sma_failedList.json"
          if [ -f "$FAILED_FILE" ]; then
            COUNT=$(jq length "$FAILED_FILE")
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "📋 Found $COUNT failed stocks to retry"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ No failed list found, nothing to retry"
          fi

      - name: Run SMA retry
        if: steps.check.outputs.exists == 'true'
        run: node scripts/retry_sma_failed.js --date ${{ steps.date.outputs.target }}

      - name: Generate SMA files.json only
        if: steps.check.outputs.exists == 'true'
        run: node scripts/generate_file_lists.js --only data_fubon

      - name: Commit and push changes
        if: steps.check.outputs.exists == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_fubon/

          if git diff --staged --quiet; then
            if [ -n "$(git status --porcelain)" ]; then
              echo "Unexpected uncommitted changes remain even though there are no retry-SMA changes:"
              git status --short
              exit 1
            fi
            echo "No changes to commit"
            exit 0
          fi

          CURRENT_DATE=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          git commit -m "🔄 Retry SMA failed stocks - ${CURRENT_DATE}"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed, retry ${attempt}/5..."
            sleep 5
          done

          echo "Failed to push retry-SMA data after 5 attempts."
          exit 1

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node

