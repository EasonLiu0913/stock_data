name: "[06 回填修復] Retry SMA Failed"

on:
  schedule:
    # 每天 17:29 台北時間 (09:29 UTC)
    - cron: '29 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target Date (YYYYMMDD format, e.g., 20260204)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: retry-sma
  cancel-in-progress: false

jobs:
  retry-sma:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            TARGET_DATE=$(TZ='Asia/Taipei' date '+%Y%m%d')
            echo "target=${TARGET_DATE}" >> $GITHUB_OUTPUT
          fi

      - name: Check if failed list exists
        id: check
        run: |
          FAILED_FILE="data_fubon/fubon_${{ steps.date.outputs.target }}_sma_failedList.json"
          if [ -f "$FAILED_FILE" ]; then
            COUNT=$(jq length "$FAILED_FILE")
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "📋 Found $COUNT failed stocks to retry"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ No failed list found, nothing to retry"
          fi

      - name: Run SMA retry
        if: steps.check.outputs.exists == 'true'
        run: node scripts/retry_sma_failed.js --date ${{ steps.date.outputs.target }}

      - name: Generate SMA files.json only
        if: steps.check.outputs.exists == 'true'
        run: node scripts/generate_file_lists.js --only data_fubon

      - name: Commit and push changes
        if: steps.check.outputs.exists == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_fubon/

          if git diff --staged --quiet; then
            if [ -n "$(git status --porcelain)" ]; then
              echo "Unexpected uncommitted changes remain even though there are no retry-SMA changes:"
              git status --short
              exit 1
            fi
            echo "No changes to commit"
            exit 0
          fi

          CURRENT_DATE=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          git commit -m "🔄 Retry SMA failed stocks - ${CURRENT_DATE}"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed, retry ${attempt}/5..."
            sleep 5
          done

          echo "Failed to push retry-SMA data after 5 attempts."
          exit 1
