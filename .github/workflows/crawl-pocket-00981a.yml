name: "[01 台股資料] Crawl Pocket 00981A Data"

on:
  schedule:
    # Weekdays 10:52 Taipei Time (02:52 UTC)
    - cron: '52 2 * * 1-5'
    # Weekdays 12:11 Taipei Time (04:11 UTC)
    - cron: '11 4 * * 1-5'
    # Weekdays 13:22 Taipei Time (05:22 UTC)
    - cron: '22 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl-pocket-00981a
  cancel-in-progress: false

jobs:
  crawl-pocket-00981a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check latest holdings data date
        id: check_holdings
        run: |
          TODAY=$(TZ='Asia/Taipei' date '+%Y%m%d')
          LATEST_FILE="data_pocket/00981A_holdings_latest.json"

          echo "today=${TODAY}" >> "$GITHUB_OUTPUT"
          echo "latest_file=${LATEST_FILE}" >> "$GITHUB_OUTPUT"

          if [ ! -f "$LATEST_FILE" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Latest holdings file not found. Crawler will run."
            exit 0
          fi

          HOLDINGS_DATE=$(node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); console.log(p.summary?.date || '')" "$LATEST_FILE")
          echo "holdings_date=${HOLDINGS_DATE}" >> "$GITHUB_OUTPUT"

          if [ "$HOLDINGS_DATE" = "$TODAY" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Latest holdings data date is today (${TODAY}). Crawler will not run."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Latest holdings data date is ${HOLDINGS_DATE:-empty}, not today (${TODAY}). Crawler will run."
          fi

      - name: Run Pocket 00981A crawler
        if: steps.check_holdings.outputs.should_run == 'true'
        run: node scripts/crawl_pocket_00981A_holdings.js

      - name: Commit and push changes
        if: steps.check_holdings.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          # Preserve this runner's validated Pocket outputs before rebasing onto
          # a newer remote main. Only data_pocket is replayed.
          cp -a data_pocket "$TMP_DIR/data_pocket"

          pocket_remote_equivalent() {
            git show origin/main:data_pocket/00981A_holdings_latest.json > "$TMP_DIR/remote_holdings.json" 2>/dev/null || return 1
            git show origin/main:data_pocket/00981A_industry_distribution_latest.json > "$TMP_DIR/remote_industry.json" 2>/dev/null || return 1

            node - "$TMP_DIR/data_pocket/00981A_holdings_latest.json" "$TMP_DIR/remote_holdings.json" "$TMP_DIR/data_pocket/00981A_industry_distribution_latest.json" "$TMP_DIR/remote_industry.json" <<'NODE'
          const fs = require('fs');

          function read(file) {
            return JSON.parse(fs.readFileSync(file, 'utf8'));
          }

          function equivalent(localFile, remoteFile) {
            const local = read(localFile);
            const remote = read(remoteFile);
            return local.summary?.date === remote.summary?.date &&
              JSON.stringify(local.fields) === JSON.stringify(remote.fields) &&
              JSON.stringify(local.rawData) === JSON.stringify(remote.rawData);
          }

          const ok =
            equivalent(process.argv[2], process.argv[3]) &&
            equivalent(process.argv[4], process.argv[5]);

          process.exit(ok ? 0 : 1);
          NODE
          }

          for i in 1 2 3; do
            git fetch origin main

            if pocket_remote_equivalent; then
              echo "Remote main already contains equivalent Pocket 00981A data; treating this run as successfully superseded."
              exit 0
            fi

            # Start each retry from a clean current origin/main. This avoids
            # leaving the runner stuck in an unresolved rebase after a race.
            git reset --hard origin/main
            rm -rf data_pocket
            cp -a "$TMP_DIR/data_pocket" data_pocket
            git add data_pocket/

            if git diff --staged --quiet; then
              echo "No Pocket 00981A changes remain after refreshing main"
              exit 0
            fi

            CURRENT_DATE=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
            git commit -m "chore: update Pocket 00981A data ${CURRENT_DATE}"

            if git push origin HEAD:main; then
              echo "Pocket 00981A changes pushed successfully"
              exit 0
            fi

            echo "Push race detected, refreshing latest main before retry $i..."
            sleep 5
          done

          git fetch origin main
          if pocket_remote_equivalent; then
            echo "Remote main received equivalent Pocket 00981A data during retries; treating as success."
            exit 0
          fi

          echo "Failed to push Pocket 00981A changes after race-safe retries"
          exit 1
      # schedule-timing-summary:v2
      - name: Write schedule timing summary
        if: always() && github.event_name == 'schedule'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js
