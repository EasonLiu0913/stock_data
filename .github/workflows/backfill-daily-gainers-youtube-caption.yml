name: "[08 影片] Backfill Daily 5% YouTube Captions"

on:
  push:
    branches: [main]
    paths:
      - "video_caption_jobs/daily-gainers/*.json"

permissions:
  contents: read

jobs:
  caption-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout caption inputs
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            data_daily_gain_over_5
            video_caption_jobs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install caption dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir edge-tts gTTS mutagen

      - name: Resolve caption job
        id: job
        shell: bash
        run: |
          set -euo pipefail
          job="$(find video_caption_jobs/daily-gainers -maxdepth 1 -type f -name '*.json' | sort | tail -1)"
          test -s "$job"
          date="$(jq -r '.target_date' "$job")"
          video_id="$(jq -r '.video_id' "$job")"
          [[ "$date" =~ ^20[0-9]{6}$ ]]
          [[ "$video_id" =~ ^[A-Za-z0-9_-]{11}$ ]]
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "video_id=$video_id" >> "$GITHUB_OUTPUT"

      - name: Verify source data
        shell: bash
        run: |
          set -euo pipefail
          date="${{ steps.job.outputs.date }}"
          for file in \
            "data_daily_gain_over_5/${date}.json" \
            "data_daily_gain_over_5/analysis-ai/${date}.json" \
            "data_daily_gain_over_5/market-summary/${date}.json"; do
            test -s "$file" || { echo "Missing required file: $file" >&2; exit 1; }
          done

      - name: Rebuild narration package
        run: node scripts/build_daily_gainers_video_package.js "${{ steps.job.outputs.date }}"

      - name: Re-synthesize narration timing
        env:
          YOUTUBE_TTS_VOICE: zh-TW-HsiaoChenNeural
          YOUTUBE_TTS_RATE: "+30%"
        run: |
          python scripts/synthesize_daily_gainers_tts.py \
            "output/daily-gainers-video/${{ steps.job.outputs.date }}/plan.json"

      - name: Build Traditional Chinese subtitles
        run: |
          date="${{ steps.job.outputs.date }}"
          python scripts/build_daily_gainers_srt.py "output/daily-gainers-video/${date}/plan.json"
          test -s "output/daily-gainers-video/${date}/daily-gainers-${date}.zh-TW.srt"

      - name: Upload captions to existing YouTube video
        id: captions
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          date="${{ steps.job.outputs.date }}"
          node scripts/upload_youtube_caption.js \
            "${{ steps.job.outputs.video_id }}" \
            "output/daily-gainers-video/${date}/daily-gainers-${date}.zh-TW.srt" \
            "zh-TW" "繁體中文"

      - name: Upload caption artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "daily-gainers-caption-${{ steps.job.outputs.date }}"
          path: |
            output/daily-gainers-video/${{ steps.job.outputs.date }}/daily-gainers-${{ steps.job.outputs.date }}.zh-TW.srt
            output/daily-gainers-video/${{ steps.job.outputs.date }}/subtitle-manifest.json
          if-no-files-found: warn
          retention-days: 7

      - name: Job summary
        if: success()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Daily 5% caption backfill PASS
          - Date: ${{ steps.job.outputs.date }}
          - YouTube video ID: `${{ steps.job.outputs.video_id }}`
          - Language: zh-TW
          - Track: 繁體中文
          - Already existed: `${{ steps.captions.outputs.already_exists }}`
          EOF
