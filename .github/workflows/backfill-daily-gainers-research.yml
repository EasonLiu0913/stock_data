name: "[06 回填修復] 每日漲幅 5% 最新規則研究"

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '起始日期 YYYYMMDD；只處理既有 5% 清單交易日'
        required: true
        default: '20260501'
      end_date:
        description: '結束日期 YYYYMMDD；只處理既有 5% 清單交易日'
        required: true
        default: '20260826'
  push:
    branches:
      - main
    paths:
      - 'research_pending/daily-gainers-backfill-request.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: backfill-daily-gainers-latest-contract
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.range.outputs.end_date }}
    steps:
      - name: Checkout lightweight roots
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/daily-gainers-ai-contract.json
            /scripts/lib/daily_gainers_ai_contract.js
            /scripts/daily_gainers_ai_contract_cli.js
            /scripts/build_daily_gainers_ai_facts.js
            /scripts/publish_daily_gainers_unified_analysis.js
            /data_daily_gain_over_5/*.json
            /research_pending/daily-gainers-ai/*.json
            /research_pending/daily-gainers-backfill-request.json
            /.github/workflows/

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve historical dates and exact dependencies
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_START_DATE: ${{ github.event.inputs.start_date }}
          INPUT_END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            request="research_pending/daily-gainers-backfill-request.json"
            [ -s "$request" ] || { echo "Missing backfill request: $request" >&2; exit 1; }
            start="$(jq -r '.start_date // empty' "$request")"
            end="$(jq -r '.end_date // empty' "$request")"
            requested_contract="$(jq -r '.contract_version // empty' "$request")"
            current_contract="$(node -e "const p=require('./config/daily-gainers-ai-contract.json');process.stdout.write(String(p.contract_version))")"
            [ -z "$requested_contract" ] || [ "$requested_contract" = "$current_contract" ] || { echo "Request contract_version=$requested_contract does not match current=$current_contract" >&2; exit 1; }
          else
            start="${INPUT_START_DATE:-20260501}"
            end="${INPUT_END_DATE:-20260826}"
          fi

          [[ "$start" =~ ^20[0-9]{6}$ && "$end" =~ ^20[0-9]{6}$ ]] || { echo "Invalid range: $start..$end" >&2; exit 1; }
          [ "$start" -le "$end" ] || { echo "start_date > end_date" >&2; exit 1; }

          mapfile -t dates < <(find data_daily_gain_over_5 -maxdepth 1 -type f -name '20??????.json' -printf '%f\n' | sed 's/\.json$//' | awk -v s="$start" -v e="$end" '$0 >= s && $0 <= e' | sort)
          [ "${#dates[@]}" -gt 0 ] || { echo "No daily gainer lists in range" >&2; exit 1; }

          patterns=(
            '/config/daily-gainers-ai-contract.json'
            '/scripts/lib/daily_gainers_ai_contract.js'
            '/scripts/daily_gainers_ai_contract_cli.js'
            '/scripts/build_daily_gainers_ai_facts.js'
            '/scripts/publish_daily_gainers_unified_analysis.js'
            '/data_daily_gain_over_5/*.json'
            '/data_daily_gain_over_5/analysis-facts/'
            '/data_daily_gain_over_5/analysis/'
            '/research_pending/daily-gainers-ai/'
            '/research_pending/daily-gainers-backfill-request.json'
            '/.github/workflows/'
          )
          for d in "${dates[@]}"; do
            prev="$(node -e "const p=require('./data_daily_gain_over_5/${d}.json'); process.stdout.write(String(p.previous_date||''))")"
            [[ "$prev" =~ ^20[0-9]{6}$ ]] || { echo "Invalid previous_date for $d: $prev" >&2; exit 1; }
            patterns+=("/data_fubon/fubon_${d}_sma.json")
            patterns+=("/data_fubon/fubon_${prev}_sma.json")
            patterns+=("/data_twse_margin_balance/${d}_twse_margin_balance.csv")
            patterns+=("/data_fubon_broker_details/fubon_${d}_券商分點進出明細.json")
            patterns+=("/data_twse_mi_index/${d}_twse_mi_index.json")
            patterns+=("/data_twse_foreign_investors/${d}_twse_foreign_investors.json")
            patterns+=("/data_twse_investment_trust/${d}_twse_investment_trust.json")
            patterns+=("/data_twse_dealers/${d}_twse_dealers.json")
          done
          git sparse-checkout set --no-cone "${patterns[@]}"

          csv="$(IFS=,; echo "${dates[*]}")"
          echo "dates=$csv" >> "$GITHUB_OUTPUT"
          echo "start_date=${dates[0]}" >> "$GITHUB_OUTPUT"
          echo "end_date=${dates[-1]}" >> "$GITHUB_OUTPUT"
          echo "count=${#dates[@]}" >> "$GITHUB_OUTPUT"

          echo "## 5% 最新規則歷史回填範圍" >> "$GITHUB_STEP_SUMMARY"
          echo "- 觸發方式：$EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- 要求範圍：$start ～ $end" >> "$GITHUB_STEP_SUMMARY"
          echo "- 實際清單交易日：${dates[0]} ～ ${dates[-1]}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 交易日數：${#dates[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild facts and unified published files
        shell: bash
        env:
          DATES: ${{ steps.range.outputs.dates }}
        run: |
          set -euo pipefail
          node --check scripts/build_daily_gainers_ai_facts.js
          node --check scripts/publish_daily_gainers_unified_analysis.js
          IFS=',' read -ra dates <<< "$DATES"
          ai_days=0
          fallback_days=0
          for d in "${dates[@]}"; do
            echo "=== Rebuild $d ==="
            node scripts/build_daily_gainers_ai_facts.js "$d"
            node scripts/daily_gainers_ai_contract_cli.js assert-facts "data_daily_gain_over_5/analysis-facts/${d}.json"
            pending="research_pending/daily-gainers-ai/${d}.json"
            if [ -s "$pending" ] && node scripts/daily_gainers_ai_contract_cli.js ai-latest "$pending"; then
              node scripts/publish_daily_gainers_unified_analysis.js "$d"
              ai_days=$((ai_days + 1))
            else
              node scripts/publish_daily_gainers_unified_analysis.js "$d" --fallback
              fallback_days=$((fallback_days + 1))
            fi
            node scripts/daily_gainers_ai_contract_cli.js assert-published "data_daily_gain_over_5/analysis/${d}.json"
          done
          echo "## 5% 最新規則歷史回填結果" >> "$GITHUB_STEP_SUMMARY"
          echo "- 交易日：${#dates[@]}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 新版 AI v3 可用：$ai_days 日" >> "$GITHUB_STEP_SUMMARY"
          echo "- deterministic fallback：$fallback_days 日" >> "$GITHUB_STEP_SUMMARY"
          echo "- 所有正式檔均寫入 data_daily_gain_over_5/analysis/YYYYMMDD.json，且符合目前 published contract。" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit rebuilt current-contract history
        shell: bash
        env:
          START: ${{ steps.range.outputs.start_date }}
          END: ${{ steps.range.outputs.end_date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_daily_gain_over_5/analysis-facts/ data_daily_gain_over_5/analysis/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "analysis: rebuild 5% research to latest contract ${START}-${END}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Published rebuilt history; reusable Pages deploy runs next."
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
          exit 1

  deploy:
    name: 發布回填後 5% 研究到 GitHub Pages
    needs: rebuild
    if: needs.rebuild.result == 'success' && needs.rebuild.outputs.target_date != ''
    uses: ./.github/workflows/deploy-pages.yml
    with:
      target_date: ${{ needs.rebuild.outputs.target_date }}
