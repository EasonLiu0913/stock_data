name: "[06 回填修復] 每日漲幅 5% 原因與籌碼研究"

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '起始日期 YYYYMMDD；只處理實際存在的 SMA 交易日'
        required: true
        default: '20260501'
      end_date:
        description: '結束日期 YYYYMMDD；只處理實際存在的 SMA 交易日'
        required: true
        default: '20260807'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/backfill-daily-gainers-research.yml'
      - 'scripts/backfill_daily_gainers_research.js'
      - 'scripts/refine_daily_gainers_research.js'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: backfill-daily-gainers-research
  cancel-in-progress: true

jobs:
  research:
    name: 回填歷史上漲原因與籌碼分析
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.generate.outputs.target_date }}
      trading_days: ${{ steps.inputs.outputs.trading_days }}
      stock_count: ${{ steps.generate.outputs.stock_count }}
    steps:
      - name: Checkout generators and output roots
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data_daily_gain_over_5/
            /scripts/generate_daily_gainers_over_5.js
            /scripts/backfill_daily_gainers_research.js
            /scripts/refine_daily_gainers_research.js
            /.github/workflows/

      - name: Resolve trading days and materialize exact historical inputs
        id: inputs
        shell: bash
        env:
          INPUT_START_DATE: ${{ github.event.inputs.start_date }}
          INPUT_END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          set -euo pipefail
          start_date="${INPUT_START_DATE:-20260501}"
          end_date="${INPUT_END_DATE:-20260807}"
          [[ "$start_date" =~ ^20[0-9]{6}$ ]] || { echo "Invalid start_date: $start_date" >&2; exit 1; }
          [[ "$end_date" =~ ^20[0-9]{6}$ ]] || { echo "Invalid end_date: $end_date" >&2; exit 1; }
          [ "$start_date" -le "$end_date" ] || { echo "start_date must be <= end_date" >&2; exit 1; }

          mapfile -t all_sma_dates < <(
            git ls-tree -r --name-only HEAD data_fubon |
              sed -nE 's#^data_fubon/fubon_(20[0-9]{6})_sma\.json$#\1#p' |
              sort -u
          )
          [ "${#all_sma_dates[@]}" -gt 1 ] || { echo "No SMA history found" >&2; exit 1; }

          target_dates=()
          previous_date=""
          for d in "${all_sma_dates[@]}"; do
            if [ "$d" -lt "$start_date" ]; then
              previous_date="$d"
              continue
            fi
            if [ "$d" -gt "$end_date" ]; then
              break
            fi
            target_dates+=("$d")
          done

          [ "${#target_dates[@]}" -gt 0 ] || { echo "No SMA trading dates in range $start_date..$end_date" >&2; exit 1; }
          [ -n "$previous_date" ] || { echo "No previous SMA trading date before ${target_dates[0]}" >&2; exit 1; }

          patterns=(
            '/data_daily_gain_over_5/'
            '/scripts/generate_daily_gainers_over_5.js'
            '/scripts/backfill_daily_gainers_research.js'
            '/scripts/refine_daily_gainers_research.js'
            '/.github/workflows/'
            "/data_fubon/fubon_${previous_date}_sma.json"
          )
          for d in "${target_dates[@]}"; do
            patterns+=("/data_fubon/fubon_${d}_sma.json")
            patterns+=("/data_twse_foreign_investors/${d}_twse_foreign_investors.json")
            patterns+=("/data_twse_investment_trust/${d}_twse_investment_trust.json")
            patterns+=("/data_twse_dealers/${d}_twse_dealers.json")
            patterns+=("/data_twse_margin_balance/${d}_twse_margin_balance.csv")
          done
          git sparse-checkout set --no-cone "${patterns[@]}"

          dates_csv="$(IFS=,; echo "${target_dates[*]}")"
          echo "dates=$dates_csv" >> "$GITHUB_OUTPUT"
          echo "previous_date=$previous_date" >> "$GITHUB_OUTPUT"
          echo "start_date=${target_dates[0]}" >> "$GITHUB_OUTPUT"
          echo "end_date=${target_dates[-1]}" >> "$GITHUB_OUTPUT"
          echo "trading_days=${#target_dates[@]}" >> "$GITHUB_OUTPUT"

          echo "## 長區間回填範圍" >> "$GITHUB_STEP_SUMMARY"
          echo "- 要求範圍：$start_date ～ $end_date" >> "$GITHUB_STEP_SUMMARY"
          echo "- 實際交易日：${target_dates[0]} ～ ${target_dates[-1]}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 交易日數：${#target_dates[@]}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 前一基準交易日：$previous_date" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate generators
        run: |
          node --check scripts/generate_daily_gainers_over_5.js
          node scripts/generate_daily_gainers_over_5.js --self-test
          node --check scripts/backfill_daily_gainers_research.js
          node --check scripts/refine_daily_gainers_research.js

      - name: Rebuild all daily 5% lists in range
        id: lists
        shell: bash
        env:
          DATES: ${{ steps.inputs.outputs.dates }}
        run: |
          set -euo pipefail
          IFS=',' read -ra arr <<< "$DATES"
          total=0
          for d in "${arr[@]}"; do
            result=$(node scripts/generate_daily_gainers_over_5.js --date "$d")
            count=$(node -e 'const p=JSON.parse(process.argv[1]);process.stdout.write(String(p.stock_count))' "$result")
            total=$((total + count))
            echo "$d list: $count stocks"
          done
          echo "stock_count=$total" >> "$GITHUB_OUTPUT"

      - name: Rebuild cause and flow analyses with latest rules
        id: generate
        shell: bash
        env:
          DATES: ${{ steps.inputs.outputs.dates }}
        run: |
          set -euo pipefail
          IFS=',' read -ra arr <<< "$DATES"
          node scripts/backfill_daily_gainers_research.js "${arr[@]}"
          node scripts/refine_daily_gainers_research.js "${arr[@]}"

          total=0
          last=""
          echo "## 歷史 5% 上漲研究長區間回填" >> "$GITHUB_STEP_SUMMARY"
          for d in "${arr[@]}"; do
            count=$(node -e "const p=require('./data_daily_gain_over_5/analysis/$d.json');process.stdout.write(String(p.stock_count))")
            total=$((total + count))
            last="$d"
            echo "- $d：$count 檔" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "target_date=$last" >> "$GITHUB_OUTPUT"
          echo "stock_count=$total" >> "$GITHUB_OUTPUT"
          echo "- 總分析檔次：$total" >> "$GITHUB_STEP_SUMMARY"
          echo "- 規則：不保留舊分析版本；本次全部以目前最新版規則覆寫" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate every trading day and missing-data semantics
        shell: bash
        env:
          DATES: ${{ steps.inputs.outputs.dates }}
        run: |
          set -euo pipefail
          IFS=',' read -ra arr <<< "$DATES"
          failures=0
          for d in "${arr[@]}"; do
            if ! node - "$d" <<'NODE'
          const fs = require('node:fs');
          const d = process.argv[2];
          const list = require(`./data_daily_gain_over_5/${d}.json`);
          const cause = require(`./data_daily_gain_over_5/analysis/${d}.json`);
          const flow = require(`./data_daily_gain_over_5/analysis-flow/${d}.json`);
          if (list.target_date !== d || cause.target_date !== d || flow.target_date !== d) throw new Error(`date mismatch ${d}`);
          if (cause.stock_count !== list.stock_count || flow.stock_count !== list.stock_count) throw new Error(`count mismatch ${d}`);
          if (cause.analyses.length !== list.stock_count || flow.analyses.length !== list.stock_count) throw new Error(`analysis length mismatch ${d}`);
          const listCodes = list.stocks.map(x => String(x.code));
          const causeCodes = cause.analyses.map(x => String(x.code));
          const flowCodes = flow.analyses.map(x => String(x.code));
          if (JSON.stringify(listCodes) !== JSON.stringify(causeCodes)) throw new Error(`cause stock order mismatch ${d}`);
          if (JSON.stringify(listCodes) !== JSON.stringify(flowCodes)) throw new Error(`flow stock order mismatch ${d}`);
          const dealer = `./data_twse_dealers/${d}_twse_dealers.json`;
          const raw = fs.existsSync(dealer) ? fs.readFileSync(dealer, 'utf8').trim() : '';
          if (!raw && flow.analyses.some(x => x.dealer_net !== 'unavailable')) throw new Error(`empty dealer file must be unavailable ${d}`);
          NODE
            then
              echo "Validation failed: $d" >&2
              failures=$((failures + 1))
            fi
          done
          [ "$failures" -eq 0 ] || { echo "$failures trading days failed validation" >&2; exit 1; }
          echo "Validated ${#arr[@]} trading days successfully"

      - name: Commit rebuilt lists and analyses
        shell: bash
        env:
          START_DATE: ${{ steps.inputs.outputs.start_date }}
          END_DATE: ${{ steps.inputs.outputs.end_date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_daily_gain_over_5/
          if git diff --cached --quiet; then
            echo "No backfill changes"
            exit 0
          fi
          git commit -m "analysis: rebuild daily 5% research ${START_DATE}-${END_DATE}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

  deploy:
    name: 發布長區間歷史研究到 GitHub Pages
    needs: research
    if: needs.research.result == 'success'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      target_date: ${{ needs.research.outputs.target_date }}
