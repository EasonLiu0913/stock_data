name: "[CI] 每日漲幅研究法人 Parser Guard"

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/backfill_daily_gainers_research.js'
      - 'scripts/test_daily_gainers_institutional_parser.js'
      - 'scripts/validate_twse_dealers.js'
      - 'tests/validate_twse_dealers.test.js'
      - '.github/workflows/crawl-twse-dealers-history.yml'
      - '.github/workflows/test-daily-gainers-institutional-parser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-guard:
    name: 驗證法人股票代號與自營商快照完整性
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only parser guard inputs
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            tests

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Syntax check
        run: |
          node --check scripts/backfill_daily_gainers_research.js
          node --check scripts/test_daily_gainers_institutional_parser.js
          node --check scripts/validate_twse_dealers.js

      - name: Dealer row-index regression test
        run: node scripts/test_daily_gainers_institutional_parser.js

      - name: Dealer semantic snapshot tests
        run: node --test tests/validate_twse_dealers.test.js

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node

