name: "[研究] TWSE Market Opening Phase 1 Evidence"
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Trading date YYYYMMDD (checkout historical MI_INDEX, no fresh crawl)"
        required: true
        default: "20261008"
  push:
    paths:
      - "scripts/inspect_twse_mi_index_breadth.js"
      - "tests/inspect_twse_mi_index_breadth.test.js"
      - "scripts/build_twse_common_stock_breadth.js"
      - "scripts/reconcile_twse_stock_breadth.js"
      - "tests/reconcile_twse_stock_breadth.test.js"
      - "tests/build_twse_common_stock_breadth.test.js"
      - "scripts/audit_twse_isin_category_snapshot.js"
      - "scripts/report_twse_historical_roster_coverage.js"
      - "tests/report_twse_historical_roster_coverage.test.js"
      - "tests/audit_twse_isin_category_snapshot.test.js"
      - "scripts/normalize_twse_security_master.js"
      - "tests/normalize_twse_security_master.test.js"
      - "scripts/run_twse_common_stock_breadth.js"
      - "scripts/validate_daily_gainers_market_opening.js"
      - "scripts/merge_daily_gainers_market_opening_breadth.js"
      - "tests/merge_daily_gainers_market_opening_breadth.test.js"
      - "tests/daily_gainers_market_opening.test.js"
      - "tests/daily_gainers_market_opening_real_snapshot.test.js"
      - "scripts/build_daily_gainers_market_opening_phase1.js"
      - ".github/workflows/research-twse-market-opening-phase1.yml"
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_DATE: ${{ github.event.inputs.target_date || '20261008' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run focused MI_INDEX + market opening tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/twse-market-opening-inspection
          node --test tests/report_twse_historical_roster_coverage.test.js tests/audit_twse_isin_category_snapshot.test.js tests/reconcile_twse_stock_breadth.test.js tests/inspect_twse_mi_index_breadth.test.js tests/build_twse_common_stock_breadth.test.js tests/normalize_twse_security_master.test.js tests/daily_gainers_market_opening.test.js tests/merge_daily_gainers_market_opening_breadth.test.js tests/daily_gainers_market_opening_real_snapshot.test.js 2>&1 | tee output/twse-market-opening-inspection/test-results.log
      - name: Audit pinned 20261008 ISIN files from historical commit
        id: historical_isin
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/twse-market-opening-inspection/historical-isin
          git fetch --no-tags --depth=1 origin 797628c405a1d4dc91b71db1efe90199899c0388
          for category in Stock InnovationBoard TDR ETF; do
            git show "797628c405a1d4dc91b71db1efe90199899c0388:data_twse/twse_industry_${category}.csv" > "output/twse-market-opening-inspection/historical-isin/twse_industry_${category}.csv"
          done
          node -e "const a=require('./scripts/audit_twse_isin_category_snapshot');const r=a.inspect({root:'output/twse-market-opening-inspection/historical-isin'});if(!r.source_integrity_verified||r.publication_authorized)process.exit(1);console.log(JSON.stringify(r,null,2))" | tee output/twse-market-opening-inspection/historical-isin-audit.json
          node -e "const c=require('./scripts/report_twse_historical_roster_coverage');const r=c.report({root:'output/twse-market-opening-inspection/historical-isin'});if(r.historical_master_complete||r.publication_authorized)process.exit(1);console.log(JSON.stringify(r,null,2))" > output/twse-market-opening-inspection/historical-roster-coverage.json
          node -e "const r=require('./output/twse-market-opening-inspection/historical-roster-coverage.json');console.log('COVERAGE: roster='+r.roster_count+', documented_exceptions='+r.documented_exception_count+', unresolved='+r.unresolved_history_count)"
      - name: Inspect full archived MI_INDEX file within checkout
        id: inspect
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/twse-market-opening-inspection
          report="output/twse-market-opening-inspection/${TARGET_DATE}.status.txt"
          trap 'result=$?; if [ "$result" -ne 0 ]; then echo "FAILED exit_code=$result" >> "$report"; fi' EXIT
          [[ "$TARGET_DATE" =~ ^20[0-9]{6}$ ]] || { echo "INVALID_TARGET_DATE" | tee "$report"; exit 1; }
          file="data_twse_mi_index/${TARGET_DATE}_twse_mi_index.json"
          if [ ! -s "$file" ]; then
            echo "BLOCKED MISSING_OR_EMPTY_MI_INDEX $file" | tee "$report"
            echo "::error::Missing or empty MI_INDEX archive: $file"
            exit 1
          fi
          echo "SOURCE_PRESENT bytes=$(wc -c < "$file")" | tee "$report"
          node scripts/inspect_twse_mi_index_breadth.js "$TARGET_DATE" "$file" 2>&1 | tee -a "$report"
          echo "INSPECTION_PASS" | tee -a "$report"
      - name: Record inspect and test status in step summary
        if: always()
        shell: bash
        run: |
          echo "## TWSE-only Phase 1 Evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "Date: $TARGET_DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests outcome: ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Inspection outcome: ${{ steps.inspect.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Historical ISIN audit outcome: ${{ steps.historical_isin.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow only inspects MI_INDEX. Historical security-classification evidence is still required for full breadth PASS." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twse-market-opening-evidence-${{ env.TARGET_DATE }}
          path: output/twse-market-opening-inspection/
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce evidence gate
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          INSPECT_RESULT: ${{ steps.inspect.outcome }}
          ISIN_RESULT: ${{ steps.historical_isin.outcome }}
        run: |
          if [ "$TEST_RESULT" != "success" ] || [ "$INSPECT_RESULT" != "success" ] || [ "$ISIN_RESULT" != "success" ]; then
            echo "::error::Phase 1 Evidence FAILED (tests=$TEST_RESULT, inspect=$INSPECT_RESULT, historical_isin=$ISIN_RESULT). Download evidence artifact for logs."
            exit 1
          fi
          echo "Phase 1 inspector and unit tests PASS; historical security classification and full-market breadth are NOT yet verified."

