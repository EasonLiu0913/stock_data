name: "test: institutional accumulation catalyst readiness"
# fifth-window-compatible-gate:v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-institutional-accumulation-catalyst-readiness.yml"
      - "scripts/audit_institutional_accumulation_catalyst_prospective_observations.js"
      - "scripts/audit_institutional_accumulation_catalyst_prospective_window_deltas.js"
      - "scripts/audit_institutional_accumulation_catalyst_prospective_cross_day_window.js"
      - "scripts/audit_institutional_accumulation_catalyst_prospective_fourth_window_longitudinal.js"
      - "scripts/audit_institutional_accumulation_catalyst_prospective_fifth_window_longitudinal.js"
      - "tests/institutional_accumulation_catalyst_prospective_observations.test.js"
      - "tests/institutional_accumulation_catalyst_prospective_window_deltas.test.js"
      - "tests/institutional_accumulation_catalyst_prospective_cross_day_window.test.js"
      - "tests/institutional_accumulation_catalyst_prospective_fourth_window_longitudinal.test.js"
      - "tests/institutional_accumulation_catalyst_prospective_fifth_window_longitudinal.test.js"
      - "data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json"
      - "data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json"
      - "data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json"
      - "data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json"
      - "data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fifth-window-longitudinal-audit-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout bounded catalyst evidence with complete history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/institutional_accumulation_catalyst_artifact_readiness.test.js
            /tests/institutional_accumulation_catalyst_pit_provenance.test.js
            /tests/institutional_accumulation_catalyst_prospective_pit_capture_contract.test.js
            /tests/institutional_accumulation_catalyst_prospective_canary.test.js
            /tests/institutional_accumulation_catalyst_prospective_observations.test.js
            /tests/institutional_accumulation_catalyst_prospective_window_deltas.test.js
            /tests/institutional_accumulation_catalyst_prospective_cross_day_window.test.js
            /tests/institutional_accumulation_catalyst_prospective_fourth_window_longitudinal.test.js
            /tests/institutional_accumulation_catalyst_prospective_fifth_window_longitudinal.test.js
            /data_research/institutional-flow/institutional-accumulation-official-disclosure-artifact-reconstruction-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-artifact-reconstruction-readiness-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-pit-provenance-resolution-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-pit-capture-contract-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fifth-window-longitudinal-audit-v1.json
            /data_research/institutional-flow/official-disclosure-raw/mops-monthly-revenue/202607/source-meta.json
            /data_research/institutional-flow/official-disclosure-raw/mops-material-information/listings/115/
            /data_research/institutional-flow/official-disclosure-raw/prospective-catalyst-pit/
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify deterministic cross-day evidence with zero network
        shell: bash
        run: |
          set -euo pipefail
          cp data_research/institutional-flow/institutional-accumulation-catalyst-pit-provenance-resolution-v1.json /tmp/pit-durable-before.json
          cp data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json /tmp/observation-before.json
          cp data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json /tmp/delta-before.json
          cp data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json /tmp/cross-before.json
          if test -f data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json; then
            cp data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json /tmp/fourth-before.json
          fi
          if test -f data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fifth-window-longitudinal-audit-v1.json; then
            cp data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fifth-window-longitudinal-audit-v1.json /tmp/fifth-before.json
          fi

          node --test tests/institutional_accumulation_catalyst_artifact_readiness.test.js
          node --test tests/institutional_accumulation_catalyst_pit_provenance.test.js
          node --test tests/institutional_accumulation_catalyst_prospective_pit_capture_contract.test.js
          node --test tests/institutional_accumulation_catalyst_prospective_canary.test.js
          node --test tests/institutional_accumulation_catalyst_prospective_observations.test.js
          node --test tests/institutional_accumulation_catalyst_prospective_window_deltas.test.js
          node --test tests/institutional_accumulation_catalyst_prospective_cross_day_window.test.js
          node --test tests/institutional_accumulation_catalyst_prospective_fourth_window_longitudinal.test.js
          node --test tests/institutional_accumulation_catalyst_prospective_fifth_window_longitudinal.test.js

          node scripts/audit_institutional_accumulation_catalyst_prospective_observations.js --write
          cmp -s /tmp/observation-before.json data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json
          echo 'observation audit byte-match: PASS'

          node scripts/audit_institutional_accumulation_catalyst_prospective_window_deltas.js --write
          cmp -s /tmp/delta-before.json data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json
          echo 'closed two-window delta byte-match: PASS'

          node scripts/audit_institutional_accumulation_catalyst_prospective_cross_day_window.js --write
          cmp -s /tmp/cross-before.json data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json
          echo 'cross-day audit byte-match: PASS'

          if test -f /tmp/fourth-before.json; then
            node scripts/audit_institutional_accumulation_catalyst_prospective_fourth_window_longitudinal.js --write
            cmp -s /tmp/fourth-before.json data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json
            echo 'fourth-window longitudinal audit byte-match: PASS'
          fi
          if test -f /tmp/fifth-before.json; then
            node scripts/audit_institutional_accumulation_catalyst_prospective_fifth_window_longitudinal.js --write
            cmp -s /tmp/fifth-before.json data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fifth-window-longitudinal-audit-v1.json
            echo 'fifth-window longitudinal audit byte-match: PASS'
          fi

          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const readiness = JSON.parse(fs.readFileSync('data_research/institutional-flow/institutional-accumulation-catalyst-artifact-reconstruction-readiness-v1.json'));
          const pitDurable = JSON.parse(fs.readFileSync('/tmp/pit-durable-before.json'));
          const pitRegenerated = JSON.parse(fs.readFileSync('data_research/institutional-flow/institutional-accumulation-catalyst-pit-provenance-resolution-v1.json'));
          const audit = JSON.parse(fs.readFileSync('/tmp/observation-before.json'));
          const delta = JSON.parse(fs.readFileSync('/tmp/delta-before.json'));
          const cross = JSON.parse(fs.readFileSync('/tmp/cross-before.json'));
          assert.equal(readiness.identity_count, 33);
          assert.equal(readiness.ready_identity_count, 0);
          assert.equal(readiness.not_ready_identity_count, 33);
          assert.equal(readiness.network_collection_used, false);
          assert.equal(readiness.outcome_blind, true);
          for (const pit of [pitDurable, pitRegenerated]) {
            assert.equal(pit.identity_count, 33);
            assert.equal(pit.pit_ready_identity_count, 0);
            assert.equal(pit.not_pit_ready_identity_count, 33);
            assert.equal(pit.manual_review_identity_count, 0);
            assert.equal(pit.network_collection_used, false);
            assert.equal(pit.source_network_requests, 0);
            assert.equal(pit.outcome_blind, true);
            assert.equal(pit.protected_2454_outcomes_read, false);
            assert.equal(pit.development_outcome_values_read, false);
            assert.equal(pit.holdout_outcomes_read, false);
            assert.equal(pit.catalyst_outcome_association_opened, false);
            assert.equal(pit.protected_state.phase_2_semantic_sha256, '66ddb3bbf99e40bb1babb9e25a5257612a61206d827e273e6fb9b45b9c35e25b');
            assert.equal(pit.protected_state.methodology_development_identity_count, 41);
          }
          assert.equal(audit.invalid_observation_count, 0);
          assert.equal(audit.conflict_count, 0);
          if (audit.valid_observation_count === 18) {
            assert.equal(audit.unique_immutable_snapshot_count, 18);
            for (const stock of ['1102','1104','1216']) assert.deepEqual(audit.stocks[stock], {total:6, listing:3, detail:3});
            assert.equal(audit.source_interface_counts.prospective_material_information_listing, 9);
            assert.equal(audit.source_interface_counts.prospective_material_information_detail, 9);
          } else if (audit.valid_observation_count === 24) {
            assert.equal(audit.unique_immutable_snapshot_count, 24);
            for (const stock of ['1102','1104','1216']) assert.deepEqual(audit.stocks[stock], {total:8, listing:4, detail:4});
            assert.equal(audit.source_interface_counts.prospective_material_information_listing, 12);
            assert.equal(audit.source_interface_counts.prospective_material_information_detail, 12);
            const fourth = JSON.parse(fs.readFileSync('data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json'));
            assert.equal(fourth.observation_count, 24);
            assert.equal(fourth.chain_count, 6);
            assert.equal(fourth.fourth_window_gate.latest_third_collected_at, '2026-09-11T14:10:45.797Z');
            assert.equal(fourth.fourth_window_gate.later_asia_taipei_date, true);
            assert.equal(fourth.fourth_window_gate.minimum_elapsed_satisfied, true);
          } else if (audit.valid_observation_count === 30) {
            assert.equal(audit.unique_immutable_snapshot_count, 30);
            for (const stock of ['1102','1104','1216']) assert.deepEqual(audit.stocks[stock], {total:10, listing:5, detail:5});
            assert.equal(audit.source_interface_counts.prospective_material_information_listing, 15);
            assert.equal(audit.source_interface_counts.prospective_material_information_detail, 15);
            const fourth = JSON.parse(fs.readFileSync('data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json'));
            const fifth = JSON.parse(fs.readFileSync('data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fifth-window-longitudinal-audit-v1.json'));
            assert.equal(fourth.observation_count, 24);
            assert.equal(fourth.chain_count, 6);
            assert.equal(fifth.observation_count, 30);
            assert.equal(fifth.chain_count, 6);
            assert.equal(fifth.fifth_window_gate.latest_fourth_collected_at, '2026-09-22T11:14:18.342Z');
            assert.equal(fifth.fifth_window_gate.later_asia_taipei_date, true);
            assert.equal(fifth.fifth_window_gate.minimum_elapsed_satisfied, true);
          } else {
            throw new Error(`unexpected canonical observation count ${audit.valid_observation_count}`);
          }
          assert.equal(delta.observation_count, 12);
          assert.equal(delta.pair_count, 6);
          assert.equal(delta.changed_pair_count, 6);
          assert.equal(delta.unchanged_pair_count, 0);
          assert.equal(cross.observation_count, 18);
          assert.equal(cross.chain_count, 6);
          assert.equal(cross.cross_day_gate.latest_prior_collected_at, '2026-09-10T14:15:57.012Z');
          assert.equal(cross.cross_day_gate.later_asia_taipei_date, true);
          assert.equal(cross.cross_day_gate.minimum_elapsed_satisfied, true);
          console.log('durable/regenerated PIT semantics + bounded longitudinal assertions: PASS');
          NODE

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for schedule summary
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js
