name: "test: institutional accumulation catalyst readiness"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-institutional-accumulation-catalyst-readiness.yml"
      - "scripts/audit_institutional_accumulation_catalyst_prospective_observations.js"
      - "scripts/audit_institutional_accumulation_catalyst_prospective_window_deltas.js"
      - "scripts/audit_institutional_accumulation_catalyst_prospective_cross_day_window.js"
      - "tests/institutional_accumulation_catalyst_prospective_observations.test.js"
      - "tests/institutional_accumulation_catalyst_prospective_window_deltas.test.js"
      - "tests/institutional_accumulation_catalyst_prospective_cross_day_window.test.js"
      - "data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json"
      - "data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json"
      - "data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout bounded catalyst evidence with complete history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/institutional_accumulation_catalyst_artifact_readiness.test.js
            /tests/institutional_accumulation_catalyst_pit_provenance.test.js
            /tests/institutional_accumulation_catalyst_prospective_pit_capture_contract.test.js
            /tests/institutional_accumulation_catalyst_prospective_canary.test.js
            /tests/institutional_accumulation_catalyst_prospective_observations.test.js
            /tests/institutional_accumulation_catalyst_prospective_window_deltas.test.js
            /tests/institutional_accumulation_catalyst_prospective_cross_day_window.test.js
            /data_research/institutional-flow/institutional-accumulation-official-disclosure-artifact-reconstruction-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-artifact-reconstruction-readiness-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-pit-provenance-resolution-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-pit-capture-contract-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json
            /data_research/institutional-flow/official-disclosure-raw/mops-monthly-revenue/202607/source-meta.json
            /data_research/institutional-flow/official-disclosure-raw/mops-material-information/listings/115/
            /data_research/institutional-flow/official-disclosure-raw/prospective-catalyst-pit/
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify deterministic cross-day evidence with zero network
        shell: bash
        run: |
          set -euo pipefail
          cp data_research/institutional-flow/institutional-accumulation-catalyst-pit-provenance-resolution-v1.json /tmp/pit-before.json
          cp data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json /tmp/observation-before.json
          cp data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json /tmp/delta-before.json
          cp data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json /tmp/cross-before.json

          node --test tests/institutional_accumulation_catalyst_artifact_readiness.test.js
          node --test tests/institutional_accumulation_catalyst_pit_provenance.test.js
          node --test tests/institutional_accumulation_catalyst_prospective_pit_capture_contract.test.js
          node --test tests/institutional_accumulation_catalyst_prospective_canary.test.js
          node --test tests/institutional_accumulation_catalyst_prospective_observations.test.js
          node --test tests/institutional_accumulation_catalyst_prospective_window_deltas.test.js
          node --test tests/institutional_accumulation_catalyst_prospective_cross_day_window.test.js

          node scripts/audit_institutional_accumulation_catalyst_prospective_observations.js --write
          cmp -s /tmp/observation-before.json data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json
          echo 'observation audit byte-match: PASS'

          node scripts/audit_institutional_accumulation_catalyst_prospective_window_deltas.js --write
          cmp -s /tmp/delta-before.json data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json
          echo 'closed two-window delta byte-match: PASS'

          node scripts/audit_institutional_accumulation_catalyst_prospective_cross_day_window.js --write
          cmp -s /tmp/cross-before.json data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json
          echo 'cross-day audit byte-match: PASS'

          cmp -s /tmp/pit-before.json data_research/institutional-flow/institutional-accumulation-catalyst-pit-provenance-resolution-v1.json
          echo 'historical PIT frozen byte-match: PASS'

          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const readiness = JSON.parse(fs.readFileSync('data_research/institutional-flow/institutional-accumulation-catalyst-artifact-reconstruction-readiness-v1.json'));
          const pit = JSON.parse(fs.readFileSync('/tmp/pit-before.json'));
          const audit = JSON.parse(fs.readFileSync('/tmp/observation-before.json'));
          const delta = JSON.parse(fs.readFileSync('/tmp/delta-before.json'));
          const cross = JSON.parse(fs.readFileSync('/tmp/cross-before.json'));
          assert.equal(readiness.identity_count, 33);
          assert.equal(readiness.ready_identity_count, 0);
          assert.equal(readiness.not_ready_identity_count, 33);
          assert.equal(readiness.network_collection_used, false);
          assert.equal(readiness.outcome_blind, true);
          assert.equal(pit.identity_count, 33);
          assert.equal(pit.pit_ready_identity_count, 0);
          assert.equal(pit.not_pit_ready_identity_count, 33);
          assert.equal(pit.outcome_blind, true);
          assert.equal(audit.valid_observation_count, 18);
          assert.equal(audit.invalid_observation_count, 0);
          assert.equal(audit.conflict_count, 0);
          assert.equal(audit.unique_immutable_snapshot_count, 18);
          for (const stock of ['1102','1104','1216']) assert.deepEqual(audit.stocks[stock], {total:6, listing:3, detail:3});
          assert.equal(audit.source_interface_counts.prospective_material_information_listing, 9);
          assert.equal(audit.source_interface_counts.prospective_material_information_detail, 9);
          assert.equal(delta.observation_count, 12);
          assert.equal(delta.pair_count, 6);
          assert.equal(delta.changed_pair_count, 6);
          assert.equal(delta.unchanged_pair_count, 0);
          assert.equal(cross.observation_count, 18);
          assert.equal(cross.chain_count, 6);
          assert.equal(cross.cross_day_gate.latest_prior_collected_at, '2026-09-10T14:15:57.012Z');
          assert.equal(cross.cross_day_gate.later_asia_taipei_date, true);
          assert.equal(cross.cross_day_gate.minimum_elapsed_satisfied, true);
          console.log('readiness + cross-day semantic assertions: PASS');
          NODE
