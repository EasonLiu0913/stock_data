name: "[Research Only] MVP10 20261013 20-stock coherent-stage trial"
on:
  push:
    branches:
      - research/daily-video-mvp10-a-20261029
    paths:
      - .github/workflows/research-mvp10-20261013-stage.yml
      - scripts/stage_mvp10_20261013_candidates.js
      - tests/stage_mvp10_20261013_candidates.test.js
      - scripts/audit_mvp10_20261013_script_invalidation.js
      - tests/audit_mvp10_20261013_script_invalidation.test.js
      - scripts/draft_mvp10_20261013_20stock_script.js
      - tests/draft_mvp10_20261013_20stock_script.test.js
      - scripts/draft_mvp10_20261013_20stock_analysis.js
      - tests/draft_mvp10_20261013_20stock_analysis.test.js
permissions:
  contents: read
jobs:
  original-summary-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Assert strictly isolated branch
        run: |
          test "$GITHUB_REF_TYPE" = branch
          test "$GITHUB_REF_NAME" = research/daily-video-mvp10-a-20261029
      - uses: actions/checkout@v4
        with:
          ref: research/daily-video-mvp10-a-20261029
          path: research
          persist-credentials: false
          sparse-checkout: |
            scripts/stage_mvp10_20261013_candidates.js
            tests/stage_mvp10_20261013_candidates.test.js
            scripts/audit_mvp10_20261013_script_invalidation.js
            tests/audit_mvp10_20261013_script_invalidation.test.js
            scripts/draft_mvp10_20261013_20stock_script.js
            tests/draft_mvp10_20261013_20stock_script.test.js
            scripts/draft_mvp10_20261013_20stock_analysis.js
            tests/draft_mvp10_20261013_20stock_analysis.test.js
            scripts/validate_daily_gainers_video_script.js
            scripts/daily_gainers_brand_opening.js
            scripts/daily_gainers_mvp10_ordinary_scope_gate.js
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: f0fb2e44e00e3141a2673a4f6955af47768e5ce9
          path: original
          persist-credentials: false
          sparse-checkout: |
            scripts/build_daily_gainers_market_summary.js
            scripts/validate_daily_gainers_market_summary.js
            scripts/lib/daily_gainers_ai_contract.js
            config/daily-gainers-ai-contract.json
            config/daily-gainers-theme-taxonomy.json
            data_daily_gain_over_5/20261013.json
            data_daily_gain_over_5/analysis-news/20261013.json
            data_daily_gain_over_5/analysis-facts/20261013.json
            data_daily_gain_over_5/analysis-ai/20261013.json
            video_scripts/daily-gainers/20261013.json
            data_twse/twse_industry_Stock.csv
            data_twse/twse_industry_InnovationBoard.csv
            data_twse/twse_industry_TDR.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test isolated staging failure cases
        run: node --test research/tests/stage_mvp10_20261013_candidates.test.js research/tests/audit_mvp10_20261013_script_invalidation.test.js research/tests/draft_mvp10_20261013_20stock_script.test.js research/tests/draft_mvp10_20261013_20stock_analysis.test.js
      - name: Stage 20 research stock rows from immutable published date source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original rev-parse HEAD)" = f0fb2e44e00e3141a2673a4f6955af47768e5ce9
          node research/scripts/stage_mvp10_20261013_candidates.js original "$RUNNER_TEMP/mvp10-20261013-20-candidates" > "$RUNNER_TEMP/mvp10-20261013-research-stage-result.json"
          node research/scripts/audit_mvp10_20261013_script_invalidation.js \
            original/video_scripts/daily-gainers/20261013.json \
            original/data_daily_gain_over_5/20261013.json \
            "$RUNNER_TEMP/mvp10-20261013-20-candidates/research-mvp10-20261013-staging.json" \
            "$RUNNER_TEMP/mvp10-20261013-original-media-invalidation.json"
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const x=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'mvp10-20261013-original-media-invalidation.json')));
          if(JSON.stringify(x.stale_stock_count_scenes)!==JSON.stringify([1,2])||
             x.scenes.length!==7||x.scenes.some(s=>s.original_render_reusable!==false||
             s.original_tts_reusable!==false)||x.render_authorized!==false)
            throw Error('STALE_NARRATION_MEDIA_INVALIDATION_GATE_FAILED');
          console.log('ORIGINAL_25_STOCK_SCRIPT_INVALIDATED count_mentions_in_scenes=1,2; all_7_media=require_review');
          NODE
          mkdir -p "$RUNNER_TEMP/mvp10-20261013-20-analysis-review"
          node research/scripts/draft_mvp10_20261013_20stock_analysis.js \
            "$RUNNER_TEMP/mvp10-20261013-20-candidates" \
            "$RUNNER_TEMP/mvp10-20261013-20-analysis-review"
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const dir=path.join(process.env.RUNNER_TEMP,'mvp10-20261013-20-analysis-review');
          const x=JSON.parse(fs.readFileSync(path.join(dir,'20261013-20stock-analysis-candidate.json')));
          const y=JSON.parse(fs.readFileSync(path.join(dir,'20261013-20stock-analysis-review.json')));
          if(x.stock_count!==20||x.analyses.length!==20||
             x.analyses.some(r=>r.cause_type!=='unknown'||r.evidence_strength!=='none'||
               r.confidence!=='low'||r.sources.length!==0||r.independently_verified_causal_claim!==false)||
             y.candidate_entries_without_causes!==20||y.original_25_stock_causality_transferred!==0||
             x.editorial_approval!==false||x.summary_final!==false||
             x.render_authorized!==false||x.publication_authorized!==false)
            throw Error('UNVERIFIED_COMPANY_CAUSE_LEAKED_TO_20_STOCK_CANDIDATE');
          console.log('20_STOCK_DETERMINISTIC_ANALYSIS_CANDIDATE_PASS causal_claims_promoted=0 final=false');
          NODE
          mkdir -p "$RUNNER_TEMP/mvp10-20261013-20-script-review"
          node research/scripts/draft_mvp10_20261013_20stock_script.js \
            "$RUNNER_TEMP/mvp10-20261013-20-candidates" \
            "$RUNNER_TEMP/mvp10-20261013-20-script-review"
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const d=path.join(process.env.RUNNER_TEMP,'mvp10-20261013-20-script-review');
          const x=JSON.parse(fs.readFileSync(path.join(d,'20261013-20stock-draft-script.json')));
          const r=JSON.parse(fs.readFileSync(path.join(d,'20261013-20stock-draft-review.json')));
          if(x.scenes.length!==7||x.stock_count!==20||x.scenes.some(s=>s.narration.length<75||
             s.stock_codes.some(c=>['1312A','6645','6924','7730','9103'].includes(c)))||
             r.narration_characters<1100||r.narration_characters>5500||
             r.decision!=='SEVEN_SCENE_QUANTITATIVE_RESEARCH_DRAFT_AWAITING_REVIEW'||
             x.editorial_approved!==false||x.render_authorized!==false||
             r.regenerated_mp4_exists!==false||r.publication_authorized!==false)
            throw Error('DRAFT_DID_NOT_RESPECT_SOURCE_OR_REVIEW_BOUNDARY');
          const scenes=x.scenes;
          const joined=scenes.map(s=>s.narration).join(' ');
          if(/\bpercent\b/i.test(joined)||scenes.some(s=>s.narration.includes('25檔強勢股'))||
             !scenes[2].narration.includes('融資減少1831張')||
             !scenes[3].narration.includes('融資增加9413張')||
             !scenes[4].narration.includes('賣超845張')||
             !scenes[1].narration.includes('投信買超15100張')||
             joined.includes('百分之百分之'))
            throw Error('ACTUAL_DATED_NUMERIC_NARRATION_DRIFT');
          console.log('DRAFT_DATED_FACTS_INVARIANTS verified=6834_margin,1312_margin,6668_foreign,6505_trust; percent_chinese_only=true');
          console.log('RESEARCH_SEVEN_SCENE_DRAFT_GENERATED source_count=20 media=false');
          NODE
          cd "$RUNNER_TEMP/mvp10-20261013-20-candidates"
          node scripts/build_daily_gainers_market_summary.js --date 20261013
          node scripts/validate_daily_gainers_market_summary.js --date 20261013
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const m=JSON.parse(fs.readFileSync('research-mvp10-20261013-staging.json'));
          const s=JSON.parse(fs.readFileSync('data_daily_gain_over_5/market-summary/20261013.json'));
          const expected=['1312A','6645','6924','7730','9103'].sort();
          if(m.provisional_stock_count!==20||JSON.stringify(m.excluded_original_codes.sort())!==JSON.stringify(expected)||
             m.analysis_final_rebuilt!==false||m.render_authorized!==false||m.publication_authorized!==false||
             s.status!=='preliminary'||s.coverage?.overall==='complete'||
             s.breadth.stock_count!==20||
             s.summary_stage!=='news_theme'||s.coverage?.news!=='complete'||
             s.coverage?.facts!=='complete'||s.coverage?.analysis!=='missing'||
             s.source_lineage?.analysis?.available!==false)
            throw Error('RESEARCH_STAGING_PREMATURE_FINAL_OR_STOCK_COUNT_MISMATCH');
          console.log(JSON.stringify({decision:m.decision,source_rows:m.provisional_stock_count,
            actual_summary_status:s.status,original_builder_applied:true,original_summary_validator_pass:true,
            render_authorized:false},null,2));
          NODE
          # Prove the UNCHANGED original research-branch video validator still
          # blocks the honest 20-stock draft whose summary remains preliminary.
          mkdir -p scripts video_scripts/daily-gainers
          cp "$GITHUB_WORKSPACE/research/scripts/validate_daily_gainers_video_script.js" scripts/
          cp "$GITHUB_WORKSPACE/research/scripts/daily_gainers_brand_opening.js" scripts/
          cp "$GITHUB_WORKSPACE/research/scripts/daily_gainers_mvp10_ordinary_scope_gate.js" scripts/
          cp "$RUNNER_TEMP/mvp10-20261013-20-script-review/20261013-20stock-draft-script.json" \
            video_scripts/daily-gainers/20261013.json
          set +e
          node scripts/validate_daily_gainers_video_script.js 20261013 > "$RUNNER_TEMP/mvp10-20261013-original-video-validator.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0 || { echo "UNSAFE_ORIGINAL_VIDEO_VALIDATOR_ACCEPTED_PRELIMINARY_DRAFT" >&2; exit 1; }
          grep -Fq 'summary not final/complete' "$RUNNER_TEMP/mvp10-20261013-original-video-validator.log" || {
            cat "$RUNNER_TEMP/mvp10-20261013-original-video-validator.log" >&2
            echo "ORIGINAL_VIDEO_VALIDATOR_FAILED_FOR_UNEXPECTED_REASON" >&2
            exit 1
          }
          echo "ORIGINAL_VIDEO_VALIDATOR_FAIL_CLOSED=PASS reason=summary_not_final_complete"
          echo "20 coherent provisional input rows staged and original summary builder+validator applied. No fabricated final analysis or video claim; no MP4/YouTube." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain auditable staged inputs and original summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp10-20261013-20-stock-preliminary-stage
          path: |
            ${{ runner.temp }}/mvp10-20261013-research-stage-result.json
            ${{ runner.temp }}/mvp10-20261013-original-media-invalidation.json
            ${{ runner.temp }}/mvp10-20261013-original-video-validator.log
            ${{ runner.temp }}/mvp10-20261013-20-script-review/
            ${{ runner.temp }}/mvp10-20261013-20-analysis-review/
            ${{ runner.temp }}/mvp10-20261013-20-candidates/research-mvp10-20261013-staging.json
            ${{ runner.temp }}/mvp10-20261013-20-candidates/data_daily_gain_over_5/market-summary/20261013.json
          if-no-files-found: warn
          retention-days: 14
