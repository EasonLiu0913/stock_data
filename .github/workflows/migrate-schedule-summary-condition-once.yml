name: "[99 維護] One-time schedule summary condition migration"

on:
  push:
    branches: [main]
    paths:
      - "scripts/migrate_workflow_schedule_summary.js"
      - ".github/workflows/migrate-schedule-summary-condition-once.yml"

permissions:
  contents: write

concurrency:
  group: migrate-schedule-summary-condition-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Normalize managed schedule summary jobs
        run: |
          set -euo pipefail
          node --check scripts/migrate_workflow_schedule_summary.js
          node scripts/migrate_workflow_schedule_summary.js --self-test
          node scripts/migrate_workflow_schedule_summary.js
          changed_count=$(git diff --name-only -- .github/workflows | wc -l | tr -d ' ')
          echo "Changed workflow files: $changed_count"
          if [ "$changed_count" -eq 0 ]; then
            exit 0
          fi
          if git diff -- .github/workflows | grep -E '^[+-].*if: ' | grep -v -E "^[+-].*if: (always\(\)|github\.event_name == 'schedule')" ; then
            echo "Unexpected if-condition changes detected" >&2
            exit 1
          fi
      - name: Commit normalized workflows
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          if git diff --cached --quiet; then
            echo "No workflow normalization changes"
            exit 0
          fi
          git commit -m "ci: gate schedule summaries to schedule events"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
