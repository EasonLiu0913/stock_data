name: Test Official Market Constraints

on:
  push:
    branches:
      - codex/official-disposition-night-data-v1
    paths:
      - scripts/official_market_constraints.js
      - scripts/taifex_night_futures.js
      - tests/official_market_constraints.test.js
      - tests/taifex_night_futures.test.js
      - .github/workflows/test-official-market-constraints.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/official_market_constraints.js
      - scripts/taifex_night_futures.js
      - tests/official_market_constraints.test.js
      - tests/taifex_night_futures.test.js
      - docs/official-market-constraints-plan.md
      - .github/workflows/test-official-market-constraints.yml
  workflow_dispatch:
    inputs:
      target_date:
        description: 'TAIFEX 歸屬日 / 預測日 YYYYMMDD'
        required: true
        default: '20260731'
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/official-disposition-night-data-v1
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax and parser tests
        run: |
          node --check scripts/official_market_constraints.js
          node --check scripts/taifex_night_futures.js
          node --test \
            tests/official_market_constraints.test.js \
            tests/taifex_night_futures.test.js

      - name: Probe official TWSE and TPEX disposition sources
        env:
          TARGET_DATE: ${{ inputs.target_date || '20260731' }}
        run: |
          set -euo pipefail
          mkdir -p data_market_constraints/$TARGET_DATE
          node scripts/official_market_constraints.js \
            --date "$TARGET_DATE" \
            --allow-partial \
            --output "data_market_constraints/$TARGET_DATE/source-probe.json"

      - name: Print raw TAIFEX date contract and session diagnostics
        env:
          TARGET_DATE: ${{ inputs.target_date || '20260731' }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const target = process.env.TARGET_DATE;
          const url = 'https://openapi.taifex.com.tw/v1/DailyMarketReportFut';
          const response = await fetch(url);
          if (!response.ok) throw new Error(`TAIFEX HTTP ${response.status}`);
          const rows = await response.json();
          const contracts = [...new Set(rows.map(row => String(row.Contract || '').trim()))];
          const txLike = rows.filter(row => /TX/i.test(String(row.Contract || '')));
          const diagnostics = {
            target,
            row_count: rows.length,
            raw_dates: [...new Set(rows.map(row => row.Date))].slice(-20),
            tx_like_count: txLike.length,
            tx_like_contracts: [...new Set(txLike.map(row => row.Contract))].slice(0, 30),
            tx_like_dates: [...new Set(txLike.map(row => row.Date))].slice(-20),
            tx_like_sessions: [...new Set(txLike.map(row => row.TradingSession))],
            contracts_starting_t: contracts.filter(value => /^T/i.test(value)).slice(0, 80),
            tx_like_sample: txLike.slice(0, 12),
          };
          fs.writeFileSync(`data_market_constraints/${target}/taifex-diagnostics.json`, `${JSON.stringify(diagnostics, null, 2)}\n`);
          console.log(JSON.stringify(diagnostics, null, 2));
          NODE

      - name: Probe official TAIFEX TX night session
        continue-on-error: true
        env:
          TARGET_DATE: ${{ inputs.target_date || '20260731' }}
        run: |
          node scripts/taifex_night_futures.js \
            --date "$TARGET_DATE" \
            --output "data_market_constraints/$TARGET_DATE/night-futures.json"

      - name: Verify real-source result shape
        env:
          TARGET_DATE: ${{ inputs.target_date || '20260731' }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const date = process.env.TARGET_DATE;
          const probe = JSON.parse(fs.readFileSync(`data_market_constraints/${date}/source-probe.json`, 'utf8'));
          const night = JSON.parse(fs.readFileSync(`data_market_constraints/${date}/night-futures.json`, 'utf8'));
          if (!probe.disposition.complete_market_coverage) {
            throw new Error(`Disposition coverage incomplete: ${JSON.stringify(probe.disposition.source_status)}`);
          }
          if (!night.available) throw new Error(`Night futures unavailable: ${JSON.stringify(night)}`);
          if (!Number.isFinite(Number(night.change_percent))) {
            throw new Error('Night futures change_percent is not numeric');
          }
          if (!String(night.trading_session).includes('盤後')) {
            throw new Error(`Not an after-hours row: ${night.trading_session}`);
          }
          if (!probe.source_shapes.twse_first_row_keys.length
            || !probe.source_shapes.tpex_first_row_keys.length
            || !night.source_status.first_row_keys.length) {
            throw new Error(`Missing source field shape: ${JSON.stringify({ probe: probe.source_shapes, night: night.source_status })}`);
          }
          console.log(JSON.stringify({
            target_date: date,
            disposition_active_record_count: probe.disposition.active_record_count,
            disposition_active_stock_count: probe.disposition.active_stock_count,
            disposition_unique_stock_count: probe.disposition.active_stock_codes.length,
            disposition_codes: probe.disposition.active_stock_codes,
            night_futures_change_percent: night.change_percent,
            selected_contract_month: night.selected_contract_month,
            trading_session: night.trading_session,
            observed_sessions: night.observed_session_values,
            source_shapes: {
              twse: probe.source_shapes.twse_first_row_keys,
              tpex: probe.source_shapes.tpex_first_row_keys,
              taifex: night.source_status.first_row_keys,
            },
          }, null, 2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-market-constraints-${{ inputs.target_date || '20260731' }}
          path: data_market_constraints/${{ inputs.target_date || '20260731' }}/
          if-no-files-found: error
