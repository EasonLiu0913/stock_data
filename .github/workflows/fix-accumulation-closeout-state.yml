name: "[研究驗收] Fix Accumulation Closeout State Marker"

on:
  push:
    paths:
      - '.github/workflows/fix-accumulation-closeout-state.yml'

permissions:
  contents: write

concurrency:
  group: fix-accumulation-closeout-state-marker
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix one stale state line
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('data_research/institutional-flow/institutional-accumulation-validation-handoff.md')
          s=p.read_text()
          old='- official-disclosure source collection Prompt A: `complete`; Prompt B: `pending`;'
          new='- official-disclosure source collection Prompt A: `complete`; Prompt B: `pass`;'
          if old not in s:
              raise SystemExit('expected stale state line not found')
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale line, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit state marker fix and self-delete
        shell: bash
        run: |
          set -euo pipefail
          file='data_research/institutional-flow/institutional-accumulation-validation-handoff.md'
          git rm .github/workflows/fix-accumulation-closeout-state.yml
          git add "$file"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs: align accumulation Prompt B closeout state'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD^; then
            git reset --soft origin/main
            git restore --staged .
            git rm -f --ignore-unmatch .github/workflows/fix-accumulation-closeout-state.yml
            git add "$file"
            git commit -m 'docs: align accumulation Prompt B closeout state'
          fi
          git push origin HEAD:main
      - name: Verify durable state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          grep -F '**Official-disclosure source collection: COMPLETE / Prompt B PASS.**' data_research/institutional-flow/institutional-accumulation-validation-handoff.md
          grep -F -- '- official-disclosure source collection Prompt A: `complete`; Prompt B: `pass`;' data_research/institutional-flow/institutional-accumulation-validation-handoff.md
          test ! -e .github/workflows/fix-accumulation-closeout-state.yml
