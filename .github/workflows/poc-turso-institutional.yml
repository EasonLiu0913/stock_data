name: 'POC: Turso institutional JSON import'
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/poc-turso-institutional.yml'
      - 'scripts/poc_turso_institutional.js'
permissions:
  contents: read
concurrency:
  group: turso-institutional-poc
  cancel-in-progress: false
jobs:
  poc:
    name: Turso connectivity, JSON import and round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      POC_DAYS: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm secrets configured
        run: |
          test -n "$TURSO_DATABASE_URL" || { echo "::error::Missing TURSO_DATABASE_URL"; exit 1; }
          test -n "$TURSO_AUTH_TOKEN" || { echo "::error::Missing TURSO_AUTH_TOKEN"; exit 1; }
      - name: Install libSQL client without changing project manifests
        run: npm install --no-save --package-lock=false --ignore-scripts @libsql/client
      - name: Run isolated POC
        run: node scripts/poc_turso_institutional.js
