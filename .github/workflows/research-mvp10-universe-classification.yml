name: "[Research Only] MVP10 20261008 Classification Inventory"
on:
  push:
    branches:
      - research/daily-video-mvp10-a-20261029
    paths:
      - .github/workflows/research-mvp10-universe-classification.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Assert isolated branch
        run: |
          test "$GITHUB_REF_NAME" = "research/daily-video-mvp10-a-20261029"
          test "$GITHUB_REF_TYPE" = "branch"
      - uses: actions/checkout@v4
        with:
          ref: research/daily-video-mvp10-a-20261029
          persist-credentials: false
          sparse-checkout: |
            scripts/research_mvp10_dated_universe_classification.js
            scripts/audit_twse_isin_category_snapshot.js
            tests/research_mvp10_dated_universe_classification.test.js
            data_twse/twse_industry_Stock.csv
            data_twse/twse_industry_InnovationBoard.csv
            data_twse/twse_industry_TDR.csv
            data_twse/twse_industry_ETF.csv
            data_daily_gain_over_5/20261008.json
            data_twse_mi_index/20261008_twse_mi_index.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify categories and adversarial cases
        run: node --test tests/research_mvp10_dated_universe_classification.test.js
      - name: Check real 20261008 TWSE quote date and candidate presence
        run: |
          node - <<'NODE'
          const fs=require('fs'),c=require('crypto');
          const f='data_twse_mi_index/20261008_twse_mi_index.json';
          const b=fs.readFileSync(f), digest=c.createHash('sha256').update(b).digest('hex');
          if(digest!=='c93be0a5fae5a9aa4ee9a02c83e7a7354fb1a3e715a09cc0f2d3cfe7e76709a5')
            throw Error('TWSE_QUOTE_SHA256_MISMATCH');
          const payload=JSON.parse(b),raw=JSON.parse(fs.readFileSync('data_daily_gain_over_5/20261008.json'));
          if(payload.date!=='20261008'||payload.stat!=='OK'||raw.target_date!==payload.date)
            throw Error('TWSE_QUOTE_DATE_OR_STATUS_MISMATCH');
          const table=(payload.tables||[]).find(t=>['證券代號','收盤價','漲跌價差'].every(k=>t.fields?.includes(k)));
          if(!table)throw Error('TWSE_QUOTES_TABLE_MISSING');
          const i=table.fields.indexOf('證券代號'),codes=new Set();
          for(const row of table.data){
            const code=String(row[i]??'').replace(/<[^>]*>/g,'').trim();
            if(!code)continue;
            if(codes.has(code))throw Error('TWSE_QUOTE_DUPLICATE_CODE:'+code);
            codes.add(code);
          }
          const missing=raw.stocks.filter(x=>!codes.has(String(x.code))).map(x=>x.code);
          if(missing.length)throw Error('CANDIDATES_MISSING_FROM_SAME_DAY_QUOTE:'+missing.join(','));
          console.log(JSON.stringify({date:payload.date,quote_sha256:digest,quote_rows:table.data.length,
            candidate_quotes_matched:raw.stocks.length,status:'QUOTE_EXISTENCE_ONLY_NOT_CLASSIFICATION'},null,2));
          NODE
      - name: Verify pre-date archived category snapshots (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p archived/data_twse archived/data_daily_gain_over_5
          cp data_daily_gain_over_5/20261008.json archived/data_daily_gain_over_5/20261008.json
          declare -A history=(
            [Stock]=8ec4711cac2ac570218f4d57b5c078a06a59b7cc
            [InnovationBoard]=496c52cd2d5da9e8e9672f9ff55811eecd7bb2b3
            [TDR]=9e65f777b89eccf1fb4bd192966aed5541a66293
            [ETF]=b9501de8b08b0732d47b2e13bcac28705a8dc89c
          )
          for category in Stock InnovationBoard TDR ETF; do
            ref="${history[$category]}"
            gh api "repos/$GITHUB_REPOSITORY/contents/data_twse/twse_industry_${category}.csv?ref=${ref}" --jq .content | base64 --decode > "archived/data_twse/twse_industry_${category}.csv"
            test -s "archived/data_twse/twse_industry_${category}.csv"
          done
          node - <<'NODE'
          const {inspect}=require('./scripts/audit_twse_isin_category_snapshot');
          const proof=inspect({root:'archived/data_twse'});
          if(proof.source_integrity_verified!==true || proof.historical_effective_date_verified!==false)
            throw Error('ARCHIVE_STATUS_INCORRECT');
          console.log(JSON.stringify(proof,null,2));
          NODE
          node scripts/research_mvp10_dated_universe_classification.js 20261008 archived > archived/20261008-pre-date-categories.json
          node - <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync('archived/20261008-pre-date-categories.json'));
          if(r.category_counts.Stock!==32||r.category_counts.InnovationBoard!==2||
             r.category_counts.TDR!==1||r.category_counts.ETF!==0||r.classification_certified!==false||
             r.source_snapshot_effective_on_target_date_verified!==false||r.issues.length)
             throw Error('PRE_DATE_CATEGORY_RECONCILIATION_FAILED');
          console.log(JSON.stringify({date:r.target_date,decision:r.decision,category_counts:r.category_counts},null,2));
          NODE
          echo "Archive commits precede 20261008; publisher historical validity still unverified" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve pre-date category evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp10-20261008-pre-date-category-evidence
          path: archived/20261008-pre-date-categories.json
          if-no-files-found: warn
          retention-days: 30
      - name: Produce non-authorizing research inventory
        run: |
          mkdir -p research-inventory
          node scripts/research_mvp10_dated_universe_classification.js 20261008 > research-inventory/20261008-categories.json
          node - <<'NODE'
          const fs=require('fs'),c=require('crypto');
          const f='research-inventory/20261008-categories.json',r=JSON.parse(fs.readFileSync(f));
          if(r.stock_count!==35 || r.category_counts.Stock!==32 || r.category_counts.TDR!==1 ||
             r.category_counts.InnovationBoard!==2 || r.classification_certified!==false ||
             r.render_authorized!==false || r.source_snapshot_effective_on_target_date_verified!==false)
            throw Error('RESEARCH_SCOPE_OR_COUNT_MISMATCH');
          const sha=c.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          console.log(JSON.stringify({date:r.target_date,counts:r.category_counts,sha256:sha,decision:r.decision},null,2));
          NODE
          echo "Research inventory ONLY: current category snapshot cannot certify 20261008 historical validity; no video render authorized" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve research-only classification inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp10-20261008-classification-inventory
          path: research-inventory/
          if-no-files-found: warn
          retention-days: 30
