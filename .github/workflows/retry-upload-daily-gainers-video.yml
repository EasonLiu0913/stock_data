name: "[08 影片] Retry Daily 5% YouTube Upload"

on:
  workflow_dispatch:
    inputs:
      date:
        description: "影片日期 YYYYMMDD"
        required: true
        default: ""
      source_run_id:
        description: "含已通過 QA MP4 artifact 的 workflow run ID"
        required: true
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  # Same mutex as full generate/upload: only one in-flight YouTube upload.
  group: daily-gainers-video-upload-serial
  cancel-in-progress: false

jobs:
  upload-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout uploader only
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            video_upload_jobs
            data_daily_gain_over_5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Resolve upload job
        id: job
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_RUN_ID: ${{ github.event.inputs.source_run_id }}
        run: |
          set -euo pipefail
          date="${INPUT_DATE:-}"
          run_id="${INPUT_RUN_ID:-}"
          [ -n "$date" ] && [ -n "$run_id" ] || { echo "Exact date and source run ID required, no fallback" >&2; exit 1; }
          [[ "$date" =~ ^20[0-9]{6}$ ]]
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download QA-passed rendered artifact
        uses: actions/download-artifact@v7
        with:
          name: daily-gainers-video-${{ steps.job.outputs.date }}
          path: output/daily-gainers-video/${{ steps.job.outputs.date }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: EasonLiu0913/stock_data
          run-id: ${{ steps.job.outputs.run_id }}

      - name: Verify downloaded video package
        shell: bash
        run: |
          set -euo pipefail
          date="${{ steps.job.outputs.date }}"
          dir="output/daily-gainers-video/$date"
          test -s "$dir/daily-gainers-$date.mp4"
          test -s "$dir/metadata.json"
          test -s "$dir/qa.json"
          test -s "$dir/daily-gainers-$date.zh-TW.srt"
          duration="$(jq -r '.duration_seconds' "$dir/qa.json")"
          awk -v d="$duration" 'BEGIN { if (d < 300 || d > 600) exit 1 }'
          echo "Reusing QA-passed artifact: $(jq -r '.duration_minutes' "$dir/qa.json") min"

      - name: Mandatory thumbnail QA before creating any YouTube video
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify_daily_gainers_thumbnail_before_upload.js "${{ steps.job.outputs.date }}"

      - name: Persist create-only PRIVATE upload attempt (blocks ambiguous replay)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          date="${{ steps.job.outputs.date }}"
          bash scripts/reserve_daily_gainers_private_upload.sh "$date" "${{ steps.job.outputs.run_id }}" "output/daily-gainers-video/$date/daily-gainers-$date.mp4"

      - name: Upload private video to YouTube
        id: youtube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          date="${{ steps.job.outputs.date }}"
          node scripts/upload_youtube.js             "output/daily-gainers-video/$date/daily-gainers-$date.mp4"             "output/daily-gainers-video/$date/metadata.json"

      - name: Upload Traditional Chinese captions
        id: captions
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          date="${{ steps.job.outputs.date }}"
          node scripts/upload_youtube_caption.js \
            "${{ steps.youtube.outputs.video_id }}" \
            "output/daily-gainers-video/$date/daily-gainers-$date.zh-TW.srt" \
            "zh-TW" "繁體中文"

      - name: Set REQUIRED YouTube thumbnail on same video ID
        id: thumbnail
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          date="${{ steps.job.outputs.date }}"
          node scripts/upload_youtube_thumbnail.js "${{ steps.youtube.outputs.video_id }}" "output/daily-gainers-video/$date/thumbnail.jpg"

      - name: Record completed YouTube upload
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIDEO_ID: ${{ steps.youtube.outputs.video_id }}
          DATE: ${{ steps.job.outputs.date }}
          SOURCE_RUN: ${{ steps.job.outputs.run_id }}
        run: |
          set -euo pipefail
          [ -n "$VIDEO_ID" ]
          dest="video_upload_receipts/daily-gainers/$DATE.json"
          json="$(jq -n --arg date "$DATE" --arg id "$VIDEO_ID" --arg run "$SOURCE_RUN" '{target_date:$date,youtube_video_id:$id,source_run_id:$run,upload_status:"complete",privacy:"private"}')"
          if gh api "repos/$GITHUB_REPOSITORY/contents/$dest?ref=main" >/dev/null 2>&1; then
            echo "Existing upload receipt: $dest"
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$dest" -f message="video: record YouTube upload $DATE" -f content="$(printf '%s' "$json" | base64 -w0)" -f branch=main >/dev/null
          fi

      - name: Job summary
        if: success()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Daily 5% YouTube upload PASS
          - Date: ${{ steps.job.outputs.date }}
          - Source render run: ${{ steps.job.outputs.run_id }}
          - YouTube video ID: `${{ steps.youtube.outputs.video_id }}`
          - Privacy: private
          - Captions: zh-TW `繁體中文`
          - Watch: ${{ steps.youtube.outputs.watch_url }}
          - Studio: ${{ steps.youtube.outputs.studio_url }}
          EOF
