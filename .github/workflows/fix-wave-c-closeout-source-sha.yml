name: "[研究] Fix Wave C Closeout Source SHA"

on:
  push:
    paths:
      - '.github/workflows/fix-wave-c-closeout-source-sha.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/fix-wave-c-closeout-source-sha.yml
            /data_research/institutional-flow/official-disclosure-raw/mops-material-information/wave-c-durable-closeout.json
            /data_research/institutional-flow/institutional-accumulation-material-information-api-contract-handoff.md
      - name: Repair bounded closeout metadata and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git reset --hard origin/main
          node - <<'NODE'
          const fs=require('node:fs');
          const jsonPath='data_research/institutional-flow/official-disclosure-raw/mops-material-information/wave-c-durable-closeout.json';
          const handoffPath='data_research/institutional-flow/institutional-accumulation-material-information-api-contract-handoff.md';
          const sourceSha='1af8cc77aac34492ad63367c04420720d7ad2559';
          const j=JSON.parse(fs.readFileSync(jsonPath,'utf8'));
          if(j.prompt_a_state!=='COMPLETE'||j.prompt_b_state!=='PENDING'||j.planner_remaining_queue_count!==0) throw new Error('Closeout state changed unexpectedly');
          if(j.closeout_source_sha!==null && j.closeout_source_sha!==sourceSha) throw new Error(`Unexpected closeout_source_sha ${j.closeout_source_sha}`);
          j.closeout_source_sha=sourceSha;
          fs.writeFileSync(jsonPath,JSON.stringify(j,null,2)+'\n');
          let h=fs.readFileSync(handoffPath,'utf8');
          const marker='- initial reconciliation baseline SHA: `ce2da9227b0383932e4dc1b80d4cbcae7dfc6430`;';
          const addition=marker+'\n- closeout source SHA immediately before the durable closeout commit: `'+sourceSha+'`;';
          if(h.includes(marker) && !h.includes('closeout source SHA immediately before the durable closeout commit')) h=h.replace(marker,addition);
          fs.writeFileSync(handoffPath,h);
          NODE
          git rm -f .github/workflows/fix-wave-c-closeout-source-sha.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data_research/institutional-flow/official-disclosure-raw/mops-material-information/wave-c-durable-closeout.json data_research/institutional-flow/institutional-accumulation-material-information-api-contract-handoff.md
          git diff --cached --check
          git commit -m "research: record Wave C closeout source SHA"
          git push origin HEAD:main
