name: "[00 網站部署] Public Page Registry CI"

on:
  pull_request:
    paths:
      - "public/*.html"
      - "config/public-page-registry.json"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "public/*.html"
      - "config/public-page-registry.json"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

# Validation-only layer: it does not persist repository data, so a newer CI run
# may supersede an older validation run.
concurrency:
  group: public-page-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-accumulation-prompt-a-verification:
    name: Verify accumulation Prompt A durable state
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/preflight_institutional_accumulation_mops_material_information.js
            /scripts/plan_institutional_accumulation_official_disclosure_collection.js
            /tests/institutional_accumulation_official_disclosure_collection.test.js
            /data_research/institutional-flow/institutional-accumulation-official-disclosure-artifact-reconstruction-v1.json
            /data_research/institutional-flow/official-disclosure-raw/mops-monthly-revenue/202607/source-meta.json
            /data_research/institutional-flow/official-disclosure-raw/mops-material-information/preflight.json
            /data_research/institutional-flow/official-disclosure-raw/mops-material-information/corrected-api-preflight/source.json
            /data_research/institutional-flow/official-disclosure-raw/mops-material-information/corrected-api-preflight/source-meta.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression and durable planner gates
        shell: bash
        run: |
          set -euo pipefail
          node tests/institutional_accumulation_official_disclosure_collection.test.js
          node scripts/plan_institutional_accumulation_official_disclosure_collection.js > /tmp/plan.json
          cat /tmp/plan.json
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const p=require('/tmp/plan.json');
          const f=require('./data_research/institutional-flow/official-disclosure-raw/mops-material-information/preflight.json');
          const m=require('./data_research/institutional-flow/official-disclosure-raw/mops-material-information/corrected-api-preflight/source-meta.json');
          const raw=fs.readFileSync('./data_research/institutional-flow/official-disclosure-raw/mops-material-information/corrected-api-preflight/source.json');
          const h=crypto.createHash('sha256').update(raw).digest('hex');
          if(p.wave_a.length!==0||p.wave_b.length!==0||p.wave_c.length!==0) throw new Error(`queues not zero: ${JSON.stringify(p)}`);
          if(p.material_information_authorized!==false) throw new Error('material-information collection unexpectedly authorized');
          if(p.legacy_preflight_attempt_count!==2) throw new Error('legacy attempt count changed');
          if(f.decision!=='listing_contract_passed_detail_contract_unproven') throw new Error(`unexpected durable decision ${f.decision}`);
          if(f.contracts?.corrected_api?.listing_contract_passed!==true) throw new Error('listing contract is not PASS');
          if(f.contracts?.corrected_api?.detail_contract?.status!=='unproven'||f.contracts?.corrected_api?.detail_contract?.request_executed!==false) throw new Error('detail contract state changed');
          if(f.diagnostics?.total_network_requests_this_round!==1) throw new Error('request count is not exactly one');
          if(m.response_sha256!==h||m.response_bytes!==raw.length) throw new Error('raw source hash/bytes mismatch');
          if(m.coherent_row_structure!==true||m.row_shape?.row_type!=='array'||m.row_shape?.row_lengths?.length!==1||m.row_shape.row_lengths[0]!==6) throw new Error('row-shape contract mismatch');
          if(m.detail_descriptor_count!==58) throw new Error('descriptor count mismatch');
          NODE

  validate:
    name: Validate homepage registry and workflow deployment safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public page sources and writer candidates
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/
            /config/public-page-registry.json
            /scripts/
            /.github/workflows/

      - name: Validate canonical homepage source of truth
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/generate_public_index.js
          node --check scripts/validate_public_pages.js
          node --check scripts/validate_public_index_writers.js
          node scripts/generate_public_index.js --check
          node scripts/validate_public_pages.js
          node scripts/validate_public_index_writers.js

      - name: Audit all workflow concurrency layers
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/audit_workflow_deployment_races.js
          node scripts/audit_workflow_deployment_races.js --self-test
          node scripts/audit_workflow_deployment_races.js

      - name: Summarize validation
        shell: bash
        run: |
          {
            echo "## Public Page Registry / Workflow Layering Safety"
            echo
            echo "- index.html 與 registry 同步：✅"
            echo "- canonical / legacy / non-homepage HTML 分類：✅"
            echo "- 未分類 public root HTML：0"
            echo "- 非 canonical tools writer：0"
            echo "- Pages canonical concurrency group：github-pages"
            echo "- Pages publication cancel-in-progress：true"
            echo "- repository/data writer cancel-in-progress=true：禁止"
            echo "- validation-only workflow cancel-in-progress=true：允許"
            echo "- deployment chain workflow_run：禁止"
            echo "- Pages source：每次 checkout 最新 main"
          } >> "$GITHUB_STEP_SUMMARY"

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
