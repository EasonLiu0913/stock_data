name: "[Research] M9 Stage1 Isolated Audio"
on:
  push:
    branches:
      - research/m9-controlled-private-preview-20261012
    paths:
      - scripts/research_m9_stage1_audio.py
      - .github/workflows/research-m9-stage1-audio.yml
permissions:
  contents: read
jobs:
  audio-only:
    if: github.ref == 'refs/heads/research/m9-controlled-private-preview-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated audio-only dependencies
        run: python -m pip install edge-tts==7.2.7 mutagen
      - name: Generate real Stage1 research MP3 SRT and boundary proof
        run: python scripts/research_m9_stage1_audio.py "${RUNNER_TEMP}/m9-stage1"
      - name: Retain research audio and subtitles only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m9-stage1-audio-research-${{ github.run_id }}
          path: ${{ runner.temp }}/m9-stage1/
          if-no-files-found: warn
          retention-days: 14
