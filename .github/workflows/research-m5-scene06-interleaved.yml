name: "[Research M5] Interleaved scene 06 control"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interleaved:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen source and diagnostic preflight
        run: |
          node --test tests/build_daily_gainers_m5_private_plan.test.js tests/build_daily_gainers_m4_spoken_draft.test.js
          python -m py_compile scripts/diagnose_daily_gainers_m5_scene06_interleaved.py
          node scripts/build_daily_gainers_m5_private_plan.js >/dev/null
      - name: Original engine version
        run: python -m pip install --disable-pip-version-check edge-tts==7.2.8
      - name: Probe control then exact scene then control in one process
        run: |
          set -o pipefail
          python scripts/diagnose_daily_gainers_m5_scene06_interleaved.py output/m5-private-preview/20261008/plan.json | tee "${RUNNER_TEMP}/scene06-interleaved.json"
      - name: Retain diagnosis, never publish audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-scene06-interleaved-${{ github.run_id }}
          path: ${{ runner.temp }}/scene06-interleaved.json
          if-no-files-found: error
          retention-days: 14
