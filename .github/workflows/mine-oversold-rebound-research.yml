name: '[07 研究] Mine Oversold Rebound Events'

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mine-oversold-rebound-research.yml'
      - 'scripts/mine_oversold_rebound_events.js'
      - 'scripts/oversold_rebound_research_lib.js'
      - 'scripts/oversold_rebound_outcome_verification.js'
      - 'scripts/run_oversold_rebound_research.js'
      - 'tests/oversold_rebound*.test.js'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mine-oversold-rebound-research.yml'
      - 'scripts/mine_oversold_rebound_events.js'
      - 'scripts/oversold_rebound_research_lib.js'
      - 'scripts/oversold_rebound_outcome_verification.js'
      - 'scripts/run_oversold_rebound_research.js'
      - 'tests/oversold_rebound*.test.js'
  workflow_dispatch:
    inputs:
      from_date:
        description: '起始日期 YYYYMMDD；留空表示使用最早可用價量資料'
        required: false
        type: string
        default: ''
      to_date:
        description: '結束日期 YYYYMMDD；留空表示使用最新可用價量資料'
        required: false
        type: string
        default: ''
      stock_codes:
        description: '測試用股票代碼，逗號分隔；指定時僅允許 dry run'
        required: false
        type: string
        default: ''
      max_gap:
        description: '同一跌深事件允許的候選間隔（交易日）'
        required: false
        type: number
        default: 3
      max_episode_span:
        description: '單一跌深事件最長跨度（交易日）'
        required: false
        type: number
        default: 20
      dry_run:
        description: '只分析與顯示摘要，不寫入或提交研究資料'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mine-oversold-rebound-research-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate research pipeline
        run: |
          node --check scripts/oversold_rebound_research_lib.js
          node --check scripts/mine_oversold_rebound_events.js
          node --check scripts/oversold_rebound_outcome_verification.js
          node --check scripts/run_oversold_rebound_research.js
          node --test \
            tests/oversold_rebound_research.test.js \
            tests/oversold_rebound_outcome_verification.test.js

      - name: Protect canonical output from partial runs
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true && inputs.stock_codes != ''
        run: |
          echo '指定 stock_codes 的部分股票執行只能使用 dry_run=true，避免覆蓋完整研究資料。'
          exit 1

      - name: Mine historical oversold rebound events
        shell: bash
        env:
          FROM_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.from_date || '' }}
          TO_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.to_date || '' }}
          STOCK_CODES: ${{ github.event_name == 'workflow_dispatch' && inputs.stock_codes || '' }}
          MAX_GAP: ${{ github.event_name == 'workflow_dispatch' && inputs.max_gap || 3 }}
          MAX_EPISODE_SPAN: ${{ github.event_name == 'workflow_dispatch' && inputs.max_episode_span || 20 }}
          DRY_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          args=(
            --max-gap "$MAX_GAP"
            --max-episode-span "$MAX_EPISODE_SPAN"
          )
          if [ -n "$FROM_DATE" ]; then args+=(--from "$FROM_DATE"); fi
          if [ -n "$TO_DATE" ]; then args+=(--to "$TO_DATE"); fi
          if [ -n "$STOCK_CODES" ]; then args+=(--stocks "$STOCK_CODES"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/run_oversold_rebound_research.js "${args[@]}"

      - name: Verify changed-file scope
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true)
        shell: bash
        run: |
          unexpected=$(git status --short | awk '
            $2 !~ /^data_research\/oversold-rebound\// { print }
          ')
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed:'
            echo "$unexpected"
            exit 1
          fi

      - name: Commit research outputs
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true)
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_research/oversold-rebound
          if git diff --cached --quiet; then
            echo 'No research output changes'
            exit 0
          fi
          git commit -m 'data: mine historical oversold rebound events'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed"
            sleep $((attempt * 5))
          done
          exit 1
