name: "[07 研究] EPS 24 套公式保留研究"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-eps-formula-selection.yml"
      - "scripts/analyze_eps_formula_selection.js"
      - "scripts/analyze_eps_formula_incremental_value.js"
      - "data_prediction_analysis/eps-valuation/valuation-applicability-policy.json"

permissions:
  contents: write

concurrency:
  group: research-eps-formula-selection
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research inputs
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/analyze_eps_formula_selection.js
            /scripts/analyze_eps_formula_incremental_value.js
            /data_prediction_analysis/eps-valuation/
      - name: Rank guarded formulas
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/analyze_eps_formula_selection.js
          node --check scripts/analyze_eps_formula_incremental_value.js
          node scripts/analyze_eps_formula_selection.js
          node scripts/analyze_eps_formula_incremental_value.js
      - name: Commit compact study
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse \
            data_prediction_analysis/eps-valuation/formula-selection-study.json \
            data_prediction_analysis/eps-valuation/formula-selection-study.md \
            data_prediction_analysis/eps-valuation/formula-incremental-value-study.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: update EPS formula selection study"
          git pull --rebase origin main
          git push origin HEAD:main

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for schedule summary
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Write schedule timing summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js

