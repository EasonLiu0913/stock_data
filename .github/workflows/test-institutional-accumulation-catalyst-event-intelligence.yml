name: "test: five-window catalyst event intelligence"

on:
  push:
    branches: [main]
    paths:
      - "data_research/institutional-flow/institutional-accumulation-catalyst-five-window-event-intelligence-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout checked-in event intelligence state
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/build_institutional_accumulation_catalyst_five_window_event_intelligence.js
            /tests/institutional_accumulation_catalyst_five_window_event_intelligence.test.js
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-five-window-event-intelligence-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fifth-window-longitudinal-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-pit-provenance-resolution-v1.json
            /data_research/institutional-flow/official-disclosure-raw/prospective-catalyst-pit/
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run outcome-blind regressions
        run: node --test tests/institutional_accumulation_catalyst_five_window_event_intelligence.test.js
      - name: Regenerate and byte-compare canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          cp data_research/institutional-flow/institutional-accumulation-catalyst-five-window-event-intelligence-v1.json /tmp/durable.json
          node scripts/build_institutional_accumulation_catalyst_five_window_event_intelligence.js --write
          cmp -s /tmp/durable.json data_research/institutional-flow/institutional-accumulation-catalyst-five-window-event-intelligence-v1.json
          node - <<'NODE'
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('/tmp/durable.json','utf8'));
          if(a.network_collection_used!==false||a.outcomes_read!==false) throw new Error('network/outcome boundary changed');
          if(a.input_window_count!==5||a.stock_count!==3||!Number.isInteger(a.event_count)||a.event_count<1) throw new Error('artifact shape invalid');
          for(const [k,v] of Object.entries(a.protected_state)) if(v!==false) throw new Error('protected state opened '+k);
          console.log('event intelligence byte-match + protected-state assertions: PASS');
          NODE
