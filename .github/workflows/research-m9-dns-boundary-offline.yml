name: "[Research] M9 DNS Boundary Offline"
on:
  push:
    branches:
      - research/m9-controlled-private-preview-20261012
    paths:
      - scripts/verify_m9_stage1_dns_failclosed_offline.py
      - data_research/m5/m9/stage1/M9-STAGE1-OPTION-C-DNS-FAILCLOSED-PREREG-v1.json
      - .github/workflows/research-m9-dns-boundary-offline.yml
permissions:
  contents: read
jobs:
  static-only:
    if: github.ref == 'refs/heads/research/m9-controlled-private-preview-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read local contract and run 33 negative mutations
        run: python -I scripts/verify_m9_stage1_dns_failclosed_offline.py
