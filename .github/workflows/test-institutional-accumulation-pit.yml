name: "[Research] Validate Institutional Accumulation PIT Contract"

on:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/institutional_accumulation_pit.js'
      - 'scripts/audit_institutional_accumulation_pit_coverage.js'
      - 'tests/institutional_accumulation_pit.test.js'
      - 'tests/institutional_accumulation_pit_coverage.test.js'
      - 'data_research/institutional-flow/institutional-accumulation-pit-contract-v1.md'
      - 'data_research/institutional-flow/institutional-accumulation-pit-coverage-v1.json'
      - '.github/workflows/test-institutional-accumulation-pit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bounded Phase 1 evidence
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/lib/institutional_accumulation_pit.js
            scripts/lib/stock_price_provider.js
            scripts/lib/histock_broker_quality.js
            scripts/audit_institutional_accumulation_pit_coverage.js
            tests/institutional_accumulation_pit.test.js
            tests/institutional_accumulation_pit_coverage.test.js
            data_research/institutional-flow/institutional-accumulation-pit-contract-v1.md
            data_research/institutional-flow/institutional-accumulation-pit-coverage-v1.json
            data_twse/twse_industry.csv
            data_twse_foreign_investors/files.json
            data_twse_foreign_investors/20260825_twse_foreign_investors.json
            data_twse_foreign_investors/20260826_twse_foreign_investors.json
            data_twse_foreign_investors/20260827_twse_foreign_investors.json
            data_twse_investment_trust/files.json
            data_twse_investment_trust/20260825_twse_investment_trust.json
            data_twse_investment_trust/20260826_twse_investment_trust.json
            data_twse_investment_trust/20260827_twse_investment_trust.json
            data_twse_dealers/files.json
            data_twse_dealers/20260825_twse_dealers.json
            data_twse_dealers/20260826_twse_dealers.json
            data_twse_dealers/20260827_twse_dealers.json
            data_twse_margin_balance/files.json
            data_twse_margin_balance/20260825_twse_margin_balance.csv
            data_twse_margin_balance/20260826_twse_margin_balance.csv
            data_twse_margin_balance/20260827_twse_margin_balance.csv
            data_twse_mi_index/20260825_twse_mi_index.json
            data_twse_mi_index/20260826_twse_mi_index.json
            data_twse_mi_index/20260827_twse_mi_index.json
            data_fubon/fubon_20260825_sma.json
            data_fubon/fubon_20260826_sma.json
            data_fubon/fubon_20260827_sma.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run PIT regression tests
        run: node --test tests/institutional_accumulation_pit.test.js tests/institutional_accumulation_pit_coverage.test.js

      - name: Reproduce bounded coverage audit semantically
        run: |
          cp data_research/institutional-flow/institutional-accumulation-pit-coverage-v1.json /tmp/expected-coverage.json
          node scripts/audit_institutional_accumulation_pit_coverage.js
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const expected = JSON.parse(fs.readFileSync('/tmp/expected-coverage.json', 'utf8'));
          const actual = JSON.parse(fs.readFileSync('data_research/institutional-flow/institutional-accumulation-pit-coverage-v1.json', 'utf8'));
          delete expected.generated_at;
          delete actual.generated_at;
          assert.deepEqual(actual, expected);
          console.log('Coverage audit semantic reproduction passed');
          NODE

      - name: Guard outcome blindness
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('data_research/institutional-flow/institutional-accumulation-pit-coverage-v1.json', 'utf8'));
          if (payload.outcome_blind !== true) throw new Error('outcome_blind must be true');
          if (payload.sample_freeze !== false) throw new Error('sample_freeze must remain false in Phase 1');
          if (!Array.isArray(payload.outcome_fields_present) || payload.outcome_fields_present.length !== 0) {
            throw new Error(`outcome_fields_present must be empty: ${JSON.stringify(payload.outcome_fields_present)}`);
          }
          if (payload.selection_contract?.protected_motivation_stock_excluded !== '2454') {
            throw new Error('protected motivation stock 2454 exclusion is missing');
          }
          if (payload.universe.includes('2454')) throw new Error('protected motivation stock 2454 entered the coverage universe');
          console.log('Outcome-blindness guard passed');
          NODE

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
