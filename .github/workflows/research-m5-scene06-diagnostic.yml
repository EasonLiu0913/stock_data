name: "[Research M5] Scene 06 original voice diagnostic"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-scene06:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove frozen source and syntax
        run: |
          node --test tests/build_daily_gainers_m5_private_plan.test.js tests/build_daily_gainers_m4_spoken_draft.test.js
          python -m py_compile scripts/diagnose_daily_gainers_m5_scene06.py
          node scripts/build_daily_gainers_m5_private_plan.js >/dev/null
      - name: Pin original Edge TTS engine
        run: python -m pip install --disable-pip-version-check edge-tts==7.2.8
      - name: Compare original full scene and exactly reconstructed clauses
        run: |
          set -o pipefail
          python scripts/diagnose_daily_gainers_m5_scene06.py output/m5-private-preview/20261008/plan.json | tee "${RUNNER_TEMP}/scene06-diagnostic.json"
      - name: Retain diagnostic only (no audio release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-scene06-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/scene06-diagnostic.json
          if-no-files-found: error
          retention-days: 14
