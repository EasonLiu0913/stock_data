name: "[06 回填修復] 當日 5% 籌碼與資金流研究"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-daily-gainers-flow-once.yml'
  workflow_dispatch:
    inputs:
      target_date:
        description: '目標交易日 YYYYMMDD'
        required: true
        default: '20260817'

permissions:
  contents: write

concurrency:
  group: daily-gainers-flow-research
  cancel-in-progress: true

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact inputs
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data_daily_gain_over_5/20260817.json
            /data_daily_gain_over_5/analysis/20260817.json
            /data_daily_gain_over_5/analysis-flow/
            /data_fubon/fubon_20260814_sma.json
            /data_fubon/fubon_20260817_sma.json
            /data_twse_foreign_investors/20260817_twse_foreign_investors.json
            /data_twse_investment_trust/20260817_twse_investment_trust.json
            /data_twse_dealers/20260817_twse_dealers.json
            /data_twse_margin_balance/20260817_twse_margin_balance.csv
            /scripts/backfill_daily_gainers_research.js
            /scripts/refine_daily_gainers_research.js

      - name: Resolve target and verify same-day institutional inputs
        id: target
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.target_date }}
        run: |
          set -euo pipefail
          d="${INPUT_DATE:-20260817}"
          [[ "$d" =~ ^20[0-9]{6}$ ]] || { echo "Invalid date: $d" >&2; exit 1; }
          test -s "data_daily_gain_over_5/$d.json" || { echo "Missing same-day 5% list: $d" >&2; exit 1; }
          test -s "data_daily_gain_over_5/analysis/$d.json" || { echo "Missing same-day catalyst analysis: $d" >&2; exit 1; }
          for f in \
            "data_twse_foreign_investors/${d}_twse_foreign_investors.json" \
            "data_twse_investment_trust/${d}_twse_investment_trust.json" \
            "data_twse_dealers/${d}_twse_dealers.json"
          do
            test -s "$f" || { echo "Same-day institutional input not ready: $f" >&2; exit 1; }
          done
          node - "$d" <<'NODE'
          const fs=require('node:fs');
          const d=process.argv[2];
          for(const [label,file] of [
            ['foreign',`data_twse_foreign_investors/${d}_twse_foreign_investors.json`],
            ['trust',`data_twse_investment_trust/${d}_twse_investment_trust.json`],
            ['dealer',`data_twse_dealers/${d}_twse_dealers.json`],
          ]){
            const p=JSON.parse(fs.readFileSync(file,'utf8'));
            if(String(p.date)!==d || !Array.isArray(p.data) || p.data.length===0) throw new Error(`${label} not ready for ${d}`);
          }
          NODE
          echo "date=$d" >> "$GITHUB_OUTPUT"

      - name: Generate corrected flow view without replacing catalyst analysis
        shell: bash
        env:
          D: ${{ steps.target.outputs.date }}
        run: |
          set -euo pipefail
          # The TWSE dealer split file uses code at row[0], unlike foreign/trust row[1].
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/backfill_daily_gainers_research.js')
          s=p.read_text()
          s=s.replace('function mapInstitutional(file, netIndex) {','function mapInstitutional(file, netIndex, codeIndex = 1) {')
          s=s.replace("const code = String(row?.[1] ?? '').trim();","const code = String(row?.[codeIndex] ?? '').trim();",1)
          s=s.replace('mapInstitutional(dealerFile, (dealerPayload.fields || []).length - 1)','mapInstitutional(dealerFile, (dealerPayload.fields || []).length - 1, 0)')
          p.write_text(s)
          PY
          node --check scripts/backfill_daily_gainers_research.js
          node --check scripts/refine_daily_gainers_research.js
          catalyst="data_daily_gain_over_5/analysis/$D.json"
          cp "$catalyst" /tmp/catalyst.json
          node scripts/backfill_daily_gainers_research.js "$D"
          node scripts/refine_daily_gainers_research.js "$D"
          cp /tmp/catalyst.json "$catalyst"

          node - "$D" <<'NODE'
          const fs=require('node:fs');
          const d=process.argv[2];
          const list=JSON.parse(fs.readFileSync(`data_daily_gain_over_5/${d}.json`,'utf8'));
          const catalyst=JSON.parse(fs.readFileSync(`data_daily_gain_over_5/analysis/${d}.json`,'utf8'));
          const flowPath=`data_daily_gain_over_5/analysis-flow/${d}.json`;
          const flow=JSON.parse(fs.readFileSync(flowPath,'utf8'));
          const dealer=JSON.parse(fs.readFileSync(`data_twse_dealers/${d}_twse_dealers.json`,'utf8'));
          const dealerNet=new Map(dealer.data.map(row=>[String(row[0]??'').trim(), Math.round(Number(String(row.at(-1)??'0').replaceAll(',',''))/1000)]));
          const catalystByCode=new Map((catalyst.analyses||[]).map(x=>[String(x.code),x]));

          if(flow.target_date!==d || flow.angle!=='flow_and_positioning') throw new Error('flow metadata mismatch');
          if(flow.stock_count!==list.stock_count || flow.analyses.length!==list.stock_count) throw new Error('flow count mismatch');
          const required=['code','name','change_pct','institutional_summary','foreign_net','trust_net','dealer_net','margin_signal','broker_signal','volume_signal','technical_signal','flow_interpretation','confidence','follow_up','data_sources'];
          for(const a of flow.analyses){
            for(const k of required){ if(!(k in a)) throw new Error(`missing ${k} for ${a.code}`); }
            const expected=dealerNet.get(String(a.code))||0;
            if(a.dealer_net!==expected) throw new Error(`dealer mismatch ${a.code}: ${a.dealer_net} != ${expected}`);

            const dealerStrong=Math.abs(a.dealer_net)>=1000;
            if(dealerStrong){
              const phrase=a.dealer_net>0 ? `自營商另明顯買超 ${a.dealer_net.toLocaleString('zh-TW')} 張` : `自營商則明顯賣超 ${Math.abs(a.dealer_net).toLocaleString('zh-TW')} 張`;
              if(!String(a.flow_interpretation).includes('自營商')) a.flow_interpretation += `；${phrase}。`;
              if(a.dealer_net>1000 && a.confidence==='low') a.confidence='medium';
            }

            const c=catalystByCode.get(String(a.code));
            const text=String(c?.reason_summary||'');
            if(/族群|供應鏈|CPO|光通訊|PCB|AI伺服器|面板|航運|被動元件/.test(text)){
              a.flow_interpretation += '；與既有催化分析的產業／族群背景相符，具族群共振特徵。';
            }
          }
          fs.writeFileSync(flowPath,JSON.stringify(flow,null,2)+'\n');
          NODE

      - name: Commit flow analysis only
        shell: bash
        env:
          D: ${{ steps.target.outputs.date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data_daily_gain_over_5/analysis-flow/$D.json"
          git diff --cached --quiet && { echo 'No flow changes'; exit 0; }
          git commit -m "analysis: add flow view for daily 5% gainers $D"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
