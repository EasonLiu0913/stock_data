name: "[08 影片] Text Variants V2 Contract Test"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/daily_gainers_text_variants.js"
      - "public/daily-gainers-v2-video-preview.html"
      - "tests/daily_gainers_v2_preview_dashboard.test.js"
      - "scripts/build_daily_gainers_v2_preview.js"
      - "tests/daily_gainers_text_variants.test.js"
      - "tests/daily_gainers_v2_preview.test.js"
      - "tests/daily_gainers_v2_real_data.test.js"
      - "scripts/audit_daily_gainers_video_v2_readiness.js"
      - "tests/daily_gainers_v2_readiness_audit.test.js"
      - "tests/daily_gainers_v2_full_20261008.test.js"
      - "video_scripts/daily-gainers/v2/20261008/master.json"
      - "video_scripts/daily-gainers/rules/**"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify separate display caption and spoken text formats
        run: |
          node tests/daily_gainers_v2_preview_dashboard.test.js
          node tests/daily_gainers_text_variants.test.js
          node tests/daily_gainers_v2_preview.test.js
          node tests/daily_gainers_v2_real_data.test.js
          node tests/daily_gainers_v2_readiness_audit.test.js
          node tests/daily_gainers_v2_full_20261008.test.js
