name: "[01 台股資料] Crawl Stock Rankings"

on:
  schedule:
    # 17:43 Taipei Time (09:43 UTC)
    - cron: '43 9 * * *'
    # 19:37 Taipei Time (11:37 UTC) - recovery check; skips when the occurrence is already complete
    - cron: '37 11 * * *'
    # 20:47 Taipei Time (12:47 UTC) - recovery check; skips when the occurrence is already complete
    - cron: '47 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl-rankings
  cancel-in-progress: false

jobs:
  crawl-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Resolve ranking date anchor
        id: date-anchor
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            resolved=$(node scripts/resolve_scheduled_collection_date.js \
              --event-name "$EVENT_NAME" \
              --schedule "$EVENT_SCHEDULE" \
              --policy same_calendar_date \
              --time-zone UTC \
              --json)
            anchor=$(printf '%s' "$resolved" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).scheduled_at_utc));")
            echo "Scheduled Fubon anchor: $anchor"
          else
            anchor=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
            echo "Manual Fubon anchor: $anchor"
          fi
          echo "anchor=$anchor" >> "$GITHUB_OUTPUT"

      - name: Test Fubon ranking completion gate
        env:
          FUBON_DATE_ANCHOR: ${{ steps.date-anchor.outputs.anchor }}
        run: node scripts/check_fubon_ranking_completion.js --self-test

      - name: Check whether this ranking occurrence is already complete
        id: completion
        env:
          FUBON_DATE_ANCHOR: ${{ steps.date-anchor.outputs.anchor }}
        run: node scripts/check_fubon_ranking_completion.js check

      - name: Skip duplicate Fubon crawl
        if: steps.completion.outputs.complete == 'true'
        run: |
          echo "✅ Fubon rankings are already complete for this scheduled occurrence."
          echo "Source date: ${{ steps.completion.outputs.source_date }}"
          echo "Skipping npm install, Playwright install, all Fubon page requests, file generation, and commit."

      - name: Cache Playwright browsers
        if: steps.completion.outputs.complete != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        if: steps.completion.outputs.complete != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.completion.outputs.complete != 'true'
        run: npx playwright install chromium

      - name: Run Main Force Ranking Crawler
        if: steps.completion.outputs.complete != 'true'
        env:
          FUBON_DATE_ANCHOR: ${{ steps.date-anchor.outputs.anchor }}
        run: node scripts/scraper_fubon.js

      - name: Run Foreign Investor Ranking Crawler
        if: steps.completion.outputs.complete != 'true'
        env:
          FUBON_DATE_ANCHOR: ${{ steps.date-anchor.outputs.anchor }}
        run: node scripts/scraper_fubon_foreign.js

      - name: Run Market Cap and Volume Ranking Crawler
        if: steps.completion.outputs.complete != 'true'
        env:
          FUBON_DATE_ANCHOR: ${{ steps.date-anchor.outputs.anchor }}
        run: node scripts/scraper_fubon_other.js

      - name: Verify outputs and finalize occurrence
        if: steps.completion.outputs.complete != 'true'
        env:
          FUBON_DATE_ANCHOR: ${{ steps.date-anchor.outputs.anchor }}
        run: node scripts/check_fubon_ranking_completion.js finalize

      - name: Generate Fubon files.json only
        if: steps.completion.outputs.complete != 'true'
        run: node scripts/generate_file_lists.js --only data_fubon

      - name: Commit and push changes
        if: steps.completion.outputs.complete != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_fubon/

          if git diff --staged --quiet; then
            if [ -n "$(git status --porcelain)" ]; then
              echo "Unexpected uncommitted changes remain even though there are no ranking changes:"
              git status --short
              exit 1
            fi
            echo "No changes to commit"
            exit 0
          fi

          CURRENT_DATE=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          git commit -m "📊 Update Stock Rankings - ${CURRENT_DATE}"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed, retry ${attempt}/5..."
            sleep 5
          done

          echo "Failed to push ranking data after 5 attempts."
          exit 1

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
