name: "[07 維護更新] Ensure Workflow Schedule Summary"

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/write_workflow_schedule_summary.js'
      - 'scripts/migrate_workflow_schedule_summary.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ensure-workflow-schedule-summary
  cancel-in-progress: true

jobs:
  prepare-normalization:
    name: 準備輕量化 Summary normalization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            scripts

      - name: Sync latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate summary tooling
        run: |
          set -euo pipefail
          node --check scripts/write_workflow_schedule_summary.js
          node scripts/write_workflow_schedule_summary.js --self-test
          node --check scripts/migrate_workflow_schedule_summary.js

      - name: Normalize every workflow summary
        run: node scripts/migrate_workflow_schedule_summary.js

      - name: Stage normalized workflows as ordinary files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/normalized-workflows
          mkdir -p tmp/normalized-workflows
          cp .github/workflows/*.yml tmp/normalized-workflows/
          count=$(find tmp/normalized-workflows -maxdepth 1 -type f -name '*.yml' | wc -l | tr -d ' ')
          test "$count" = "122"
          echo "STAGED_WORKFLOWS=$count"
          git restore --worktree -- .github/workflows

      - name: Push normalized staging files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f tmp/normalized-workflows
          git add --sparse -u tmp/workflow-summary-normalization.json 2>/dev/null || true
          git commit -m "ci: stage normalized workflow summary files"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main || true
            sleep 2
          done
          exit 1

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
