name: "[07 維護更新] Ensure Workflow Schedule Summary"

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/write_workflow_schedule_summary.js'
      - 'scripts/migrate_workflow_schedule_summary.js'
      - 'scripts/evaluate_workflow_data_completeness.js'
      - 'scripts/write_workflow_data_summary.js'
      - 'scripts/gate_workflow_data_completeness.js'
      - 'scripts/collect_*_workflow_status.js'
      - 'tests/evaluate_workflow_data_completeness.test.js'
      - 'tests/collect_twse_margin_workflow_status.test.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ensure-workflow-schedule-summary
  cancel-in-progress: true

jobs:
  audit:
    name: 稽核 Workflow Summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow definitions only
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            scripts
            tests/evaluate_workflow_data_completeness.test.js
            tests/collect_twse_margin_workflow_status.test.js

      - name: Validate shared summary tooling
        run: |
          set -euo pipefail
          node --check scripts/write_workflow_schedule_summary.js
          node scripts/write_workflow_schedule_summary.js --self-test
          node --check scripts/migrate_workflow_schedule_summary.js
          node --check scripts/evaluate_workflow_data_completeness.js
          node --check scripts/write_workflow_data_summary.js
          node --check scripts/gate_workflow_data_completeness.js
          node --check scripts/collect_twse_margin_workflow_status.js
          node --check scripts/collect_fubon_broker_workflow_status.js
          node --test \
            tests/evaluate_workflow_data_completeness.test.js \
            tests/collect_twse_margin_workflow_status.test.js

      - name: Verify every workflow uses lightweight summary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/migrate_workflow_schedule_summary.js
          if git diff --quiet -- .github/workflows; then
            echo "All workflows use the lightweight schedule timing summary"
            exit 0
          fi
          echo "Workflow schedule summary normalization is required:"
          git diff --name-only -- .github/workflows
          {
            echo "## Workflow Schedule Summary Audit"
            echo ""
            echo "以下 workflow 缺少或未使用輕量化排程時間摘要："
            git diff --name-only -- .github/workflows | sed 's/^/- `/' | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
