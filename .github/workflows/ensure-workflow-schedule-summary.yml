name: "[07 維護更新] Ensure Workflow Schedule Summary"

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/write_workflow_schedule_summary.js'
      - 'scripts/migrate_workflow_schedule_summary.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ensure-workflow-schedule-summary
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Validate shared schedule summary helper
        run: |
          set -euo pipefail
          node --check scripts/write_workflow_schedule_summary.js
          node scripts/write_workflow_schedule_summary.js --self-test
          node --check scripts/migrate_workflow_schedule_summary.js

      - name: Audit every workflow for schedule summary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = '.github/workflows';
          const marker = '# schedule-timing-summary:v1';
          const files = fs.readdirSync(dir).filter((name) => /\.ya?ml$/i.test(name)).sort();
          const missing = files.filter((name) => !fs.readFileSync(path.join(dir, name), 'utf8').includes(marker));
          console.log(JSON.stringify({ workflow_count: files.length, covered: files.length - missing.length, missing }, null, 2));
          if (missing.length) process.exit(1);
          NODE
          echo "All workflows contain the shared schedule timing summary"

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
