name: "[07 維護更新] Ensure Workflow Schedule Summary"

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/write_workflow_schedule_summary.js'
      - 'scripts/migrate_workflow_schedule_summary.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ensure-workflow-schedule-summary
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Validate shared schedule summary helper
        run: |
          set -euo pipefail
          node --check scripts/write_workflow_schedule_summary.js
          node scripts/write_workflow_schedule_summary.js --self-test
          node --check scripts/migrate_workflow_schedule_summary.js

      - name: Audit every workflow for schedule summary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/migrate_workflow_schedule_summary.js
          if git diff --quiet -- .github/workflows; then
            echo "All workflows contain the shared schedule timing summary"
            exit 0
          fi
          echo "Workflows missing or not normalized to the shared schedule timing summary:"
          git diff --name-only -- .github/workflows
          {
            echo "## Workflow Schedule Summary Audit"
            echo ""
            echo "以下 workflow 缺少或尚未使用共用排程時間摘要："
            git diff --name-only -- .github/workflows | sed 's/^/- `/' | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
