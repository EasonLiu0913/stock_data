name: "[07 維護更新] Ensure Workflow Schedule Summary"

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/write_workflow_schedule_summary.js'
      - 'scripts/migrate_workflow_schedule_summary.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ensure-workflow-schedule-summary
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate shared schedule summary helper
        run: |
          node --check scripts/write_workflow_schedule_summary.js
          node scripts/write_workflow_schedule_summary.js --self-test
          node --check scripts/migrate_workflow_schedule_summary.js

      - name: Apply schedule summary to every workflow
        run: node scripts/migrate_workflow_schedule_summary.js

      - name: Commit workflow summary migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/
          if git diff --cached --quiet; then
            echo "All workflows already contain schedule timing summary"
            exit 0
          fi
          git commit -m "ci: add Taipei schedule timing summary to workflows"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
