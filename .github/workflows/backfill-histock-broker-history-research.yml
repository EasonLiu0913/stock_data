name: "[07 研究] HiStock Broker History Backfill"

on:
  workflow_dispatch:
    inputs:
      stock:
        description: "Stock code"
        required: true
        default: "2449"
        type: string
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-04-01"
        type: string
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-07-31"
        type: string
      delay_ms:
        description: "Base delay between missing-day requests (>=1000 ms; random jitter is added)"
        required: true
        default: "2500"
        type: string
      commit_results:
        description: "Commit research results to main"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: histock-broker-history-research-${{ inputs.stock }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.stock }}" =~ ^[0-9A-Za-z]{4,6}$ ]] || { echo "Invalid stock code"; exit 1; }
          [[ "${{ inputs.start_date }}" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Invalid start date"; exit 1; }
          [[ "${{ inputs.end_date }}" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Invalid end date"; exit 1; }
          [[ "${{ inputs.delay_ms }}" =~ ^[0-9]+$ ]] || { echo "Invalid delay"; exit 1; }
          test "${{ inputs.delay_ms }}" -ge 1000 || { echo "delay_ms must be >= 1000"; exit 1; }
          [[ "${{ inputs.start_date }}" < "${{ inputs.end_date }}" || "${{ inputs.start_date }}" == "${{ inputs.end_date }}" ]] || { echo "start_date must be <= end_date"; exit 1; }
          test -s data_history_sma/trading_days.json
          test -s data_history_sma/non_trading_days.json

      - name: Backfill missing HiStock broker research data
        id: backfill
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/backfill_histock_broker_history_research_v2.js \
            --stock "${{ inputs.stock }}" \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --delay-ms "${{ inputs.delay_ms }}"

      - name: Validate generated research files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          test -s "$ROOT/manifest.json"
          test -s "$ROOT/analysis.json"
          node - <<'NODE'
          const fs = require('fs');
          const stock = process.env.STOCK;
          const root = `data_research/institutional-flow/histock/${stock}`;
          const manifest = JSON.parse(fs.readFileSync(`${root}/manifest.json`, 'utf8'));
          const analysis = JSON.parse(fs.readFileSync(`${root}/analysis.json`, 'utf8'));
          const trading = JSON.parse(fs.readFileSync('data_history_sma/trading_days.json', 'utf8'));
          const nonTrading = JSON.parse(fs.readFileSync('data_history_sma/non_trading_days.json', 'utf8'));
          const normalize = (value) => String(value).replaceAll('/', '-');
          const tradingSet = new Set(Object.values(trading).flat().map(normalize));
          const nonTradingSet = new Set(Object.values(nonTrading).flat().map(normalize));
          if (manifest.source !== 'histock' || manifest.research_only !== true) throw new Error('Invalid provenance');
          if (analysis.calendar?.selection !== 'trading_days_whitelist_with_non_trading_conflict_guard') throw new Error('Trading calendar guard missing');
          if (!Array.isArray(analysis.rolling) || analysis.rolling.length !== analysis.counts.parsed_trading_days) throw new Error('Rolling output mismatch');
          for (const relative of manifest.daily_files) {
            const match = relative.match(/daily\/(20\d{6})\.json$/);
            if (!match) throw new Error(`Invalid daily file path: ${relative}`);
            const date = `${match[1].slice(0, 4)}-${match[1].slice(4, 6)}-${match[1].slice(6, 8)}`;
            if (!tradingSet.has(date)) throw new Error(`Daily output is not a trading day: ${date}`);
            if (nonTradingSet.has(date)) throw new Error(`Daily output conflicts with non-trading calendar: ${date}`);
          }
          console.log(`Parsed ${analysis.counts.parsed_trading_days}/${analysis.counts.requested_trading_days} trading days; reused=${analysis.counts.reused_daily_files}; remote=${analysis.counts.remote_requests_attempted}; unresolved=${analysis.counts.unresolved_trading_days}.`);
          if (analysis.complete !== true) throw new Error(`Backfill incomplete: unresolved=${analysis.counts.unresolved_trading_days}`);
          if (analysis.counts.parsed_trading_days !== analysis.counts.requested_trading_days) throw new Error('Trading-day coverage mismatch');
          NODE
        env:
          STOCK: ${{ inputs.stock }}

      - name: Commit complete research results
        if: ${{ success() && inputs.commit_results }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT"
          if git diff --cached --quiet; then
            echo "No research data changes to commit."
            exit 0
          fi
          git commit -m "research: backfill HiStock broker history ${{ inputs.stock }} ${{ inputs.start_date }} to ${{ inputs.end_date }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          {
            echo "## HiStock broker history research backfill"
            echo "- Stock: \`${{ inputs.stock }}\`"
            echo "- Range: \`${{ inputs.start_date }}\` → \`${{ inputs.end_date }}\`"
            echo "- Source: third-party HiStock public page"
            echo "- Trading-day source: \`data_history_sma/trading_days.json\`"
            echo "- Non-trading guard: \`data_history_sma/non_trading_days.json\`"
            echo "- Request policy: reuse valid daily files; missing days use base delay + jitter; zero-record trading days retry then fail closed"
            echo "- Classification: research-only; not official TWSE BSR"
            echo "- Rolling windows: 5 / 10 / 20 parsed trading days"
            echo "- Output root: \`$ROOT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/render_histock_broker_history_summary.js "$ROOT/analysis.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Propagate backfill failure
        if: ${{ always() && steps.backfill.outcome == 'failure' }}
        shell: bash
        run: |
          echo "HiStock backfill reported incomplete trading-day coverage. See Summary diagnostics."
          exit 1
