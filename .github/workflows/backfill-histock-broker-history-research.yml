name: "[07 研究] HiStock Broker History Backfill"

on:
  workflow_dispatch:
    inputs:
      stock:
        description: "Stock code"
        required: true
        default: "2449"
        type: string
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-04-01"
        type: string
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-07-31"
        type: string
      batch_size:
        description: "Missing trading days per batch"
        required: true
        default: "8"
        type: string
      delay_ms:
        description: "Base delay between requests"
        required: true
        default: "2500"
        type: string
      jitter_ms:
        description: "Maximum random jitter milliseconds"
        required: true
        default: "2500"
        type: string
      commit_results:
        description: "Checkpoint each batch and final aggregate"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: histock-broker-history-research-${{ inputs.stock }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
      requested_count: ${{ steps.plan.outputs.requested_count }}
      existing_count: ${{ steps.plan.outputs.existing_count }}
      batch_count: ${{ steps.plan.outputs.batch_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Validate scripts and inputs
        run: |
          set -euo pipefail
          [[ "${{ inputs.stock }}" =~ ^[0-9A-Za-z]{4,6}$ ]]
          [[ "${{ inputs.start_date }}" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "${{ inputs.end_date }}" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "${{ inputs.batch_size }}" =~ ^[0-9]+$ ]]
          [[ "${{ inputs.delay_ms }}" =~ ^[0-9]+$ ]]
          [[ "${{ inputs.jitter_ms }}" =~ ^[0-9]+$ ]]
          test "${{ inputs.batch_size }}" -ge 1
          test "${{ inputs.batch_size }}" -le 30
          test "${{ inputs.delay_ms }}" -ge 1000
          test -s data_history_sma/trading_days.json
          test -s data_history_sma/non_trading_days.json
          node --check scripts/plan_histock_broker_history_backfill.js
          node --check scripts/backfill_histock_broker_history_research_v2.js
          node --check scripts/aggregate_histock_broker_history_research.js
      - name: Plan trading-day batches
        id: plan
        run: |
          set -euo pipefail
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          node scripts/plan_histock_broker_history_backfill.js \
            --stock "${{ inputs.stock }}" --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}" \
            --batch-size "${{ inputs.batch_size }}" --output "$ROOT/backfill-plan.json" --github-output "$GITHUB_OUTPUT"
      - name: Plan summary
        run: |
          {
            echo "## HiStock backfill plan"
            echo "- Trading days: ${{ steps.plan.outputs.requested_count }}"
            echo "- Already valid: ${{ steps.plan.outputs.existing_count }}"
            echo "- Missing: ${{ steps.plan.outputs.missing_count }}"
            echo "- Batch size: ${{ inputs.batch_size }}"
            echo "- Planned batches: ${{ steps.plan.outputs.batch_count }}"
          } >> "$GITHUB_STEP_SUMMARY"

  batch:
    needs: plan
    if: ${{ needs.plan.outputs.missing_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest checkpoint
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Fetch isolated batch
        id: fetch
        continue-on-error: true
        env:
          BATCH_DATES: ${{ matrix.dates }}
          BATCH_INDEX: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/histock-${{ inputs.stock }}-${BATCH_INDEX}"
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          mkdir -p "$TMP/daily" "$ROOT/daily" "$ROOT/batch-status"
          cp -f "$ROOT"/daily/*.json "$TMP/daily/" 2>/dev/null || true
          set +e
          node scripts/backfill_histock_broker_history_research_v2.js \
            --stock "${{ inputs.stock }}" --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
            --delay-ms "${{ inputs.delay_ms }}" --jitter-ms "${{ inputs.jitter_ms }}" \
            --max-consecutive-failures 20 --out "$TMP"
          FETCH_EXIT=$?
          set -e
          cp -f "$TMP"/daily/*.json "$ROOT/daily/" 2>/dev/null || true
          STATUS="$ROOT/batch-status/batch-$(printf '%03d' "$BATCH_INDEX").json"
          node - "$TMP/analysis.json" "$STATUS" "$BATCH_DATES" "$FETCH_EXIT" <<'NODE'
          const fs = require('fs');
          const [analysisFile,statusFile,csv,exitCode]=process.argv.slice(2);
          const dates=csv.split(',').filter(Boolean);
          const a=fs.existsSync(analysisFile)?JSON.parse(fs.readFileSync(analysisFile,'utf8')):{};
          const unresolved=new Map((a.unresolved||[]).map(x=>[x.date,x]));
          const parsed=new Set((a.rolling||[]).map(x=>x.date));
          const out={schema_version:1,batch:Number(process.env.BATCH_INDEX),dates,parsed_dates:dates.filter(d=>parsed.has(d)),unresolved:dates.filter(d=>!parsed.has(d)).map(d=>unresolved.get(d)||{date:d,reason:'missing_without_diagnostics',diagnostics:null}),fetch_exit_code:Number(exitCode),generated_at:new Date().toISOString()};
          fs.writeFileSync(statusFile,JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Validate and checkpoint batch
        if: always()
        env:
          BATCH_DATES: ${{ matrix.dates }}
          BATCH_INDEX: ${{ matrix.batch }}
          STOCK: ${{ inputs.stock }}
        run: |
          set -euo pipefail
          ROOT="data_research/institutional-flow/histock/$STOCK"
          STATUS="$ROOT/batch-status/batch-$(printf '%03d' "$BATCH_INDEX").json"
          test -s "$STATUS"
          node - "$ROOT" "$BATCH_DATES" <<'NODE'
          const fs=require('fs'),path=require('path');
          const [root,csv]=process.argv.slice(2), stock=process.env.STOCK;
          for(const date of csv.split(',').filter(Boolean)){
            const file=path.join(root,'daily',date.replaceAll('-','')+'.json');
            if(!fs.existsSync(file)) continue;
            const p=JSON.parse(fs.readFileSync(file,'utf8'));
            if(p.source!=='histock'||p.research_only!==true||p.stock!==stock||p.date!==date||!Array.isArray(p.records)||!p.records.length) throw new Error(`Invalid daily ${date}`);
          }
          NODE
          if [ "${{ inputs.commit_results }}" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ROOT/daily" "$STATUS"
            if ! git diff --cached --quiet; then
              git commit -m "research: HiStock $STOCK batch $BATCH_INDEX checkpoint"
              for attempt in 1 2 3 4 5; do
                if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
                git rebase --abort 2>/dev/null || true
                sleep $((attempt*5))
              done
              exit 1
            fi
          fi

  aggregate:
    needs: [plan, batch]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Sync all checkpoints
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Aggregate daily checkpoints
        id: aggregate
        continue-on-error: true
        run: |
          node scripts/aggregate_histock_broker_history_research.js \
            --stock "${{ inputs.stock }}" --start "${{ inputs.start_date }}" --end "${{ inputs.end_date }}"
      - name: Commit aggregate state
        if: ${{ inputs.commit_results }}
        run: |
          set -euo pipefail
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT/analysis.json" "$ROOT/manifest.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: aggregate HiStock broker history ${{ inputs.stock }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Final summary
        if: always()
        run: |
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          {
            echo "## HiStock broker history plan & batch backfill"
            echo "- Trading days: ${{ needs.plan.outputs.requested_count }}"
            echo "- Existing before run: ${{ needs.plan.outputs.existing_count }}"
            echo "- Missing before run: ${{ needs.plan.outputs.missing_count }}"
            echo "- Planned batches: ${{ needs.plan.outputs.batch_count }}"
            echo "- Each batch commits successful daily files independently; unresolved dates do not discard successful checkpoints."
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/render_histock_broker_history_summary.js "$ROOT/analysis.json" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Fail only on hard unresolved dates
        if: always()
        run: |
          node - "data_research/institutional-flow/histock/${{ inputs.stock }}/analysis.json" <<'NODE'
          const fs=require('fs'); const a=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(`coverage=${a.counts.parsed_trading_days}/${a.counts.requested_trading_days}; source_gaps=${a.counts.source_gaps}; hard_failures=${a.counts.hard_failures}`);
          if(Number(a.counts.hard_failures||0)>0) process.exit(1);
          NODE
