name: "[07 研究] HiStock Broker History Backfill"

on:
  workflow_dispatch:
    inputs:
      stock:
        description: "Stock code"
        required: true
        default: "2449"
        type: string
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-04-01"
        type: string
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-07-31"
        type: string
      batch_size:
        description: "Missing trading days per batch"
        required: true
        default: "8"
        type: string
      delay_ms:
        description: "Base delay between HiStock requests; random jitter is added"
        required: true
        default: "2500"
        type: string
      jitter_ms:
        description: "Maximum random jitter milliseconds"
        required: true
        default: "2500"
        type: string
      commit_results:
        description: "Commit each verified batch checkpoint and final aggregate"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: histock-broker-history-research-${{ inputs.stock }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
      requested_count: ${{ steps.plan.outputs.requested_count }}
      existing_count: ${{ steps.plan.outputs.existing_count }}
      batch_count: ${{ steps.plan.outputs.batch_count }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate planner inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.stock }}" =~ ^[0-9A-Za-z]{4,6}$ ]] || exit 1
          [[ "${{ inputs.start_date }}" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          [[ "${{ inputs.end_date }}" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          [[ "${{ inputs.batch_size }}" =~ ^[0-9]+$ ]] || exit 1
          [[ "${{ inputs.delay_ms }}" =~ ^[0-9]+$ ]] || exit 1
          [[ "${{ inputs.jitter_ms }}" =~ ^[0-9]+$ ]] || exit 1
          test "${{ inputs.batch_size }}" -ge 1
          test "${{ inputs.batch_size }}" -le 30
          test "${{ inputs.delay_ms }}" -ge 1000
          test -s data_history_sma/trading_days.json
          test -s data_history_sma/non_trading_days.json
          node --check scripts/plan_histock_broker_history_backfill.js
          node --check scripts/backfill_histock_broker_history_research_v2.js
          node --check scripts/aggregate_histock_broker_history_research.js

      - name: Plan trading-day batches
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          node scripts/plan_histock_broker_history_backfill.js \
            --stock "${{ inputs.stock }}" \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --batch-size "${{ inputs.batch_size }}" \
            --output "$ROOT/backfill-plan.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Plan summary
        shell: bash
        run: |
          {
            echo "## HiStock backfill plan"
            echo "- Stock: \`${{ inputs.stock }}\`"
            echo "- Range: \`${{ inputs.start_date }}\` → \`${{ inputs.end_date }}\`"
            echo "- Trading days: ${{ steps.plan.outputs.requested_count }}"
            echo "- Already valid: ${{ steps.plan.outputs.existing_count }}"
            echo "- Missing: ${{ steps.plan.outputs.missing_count }}"
            echo "- Batch size: ${{ inputs.batch_size }}"
            echo "- Planned batches: ${{ steps.plan.outputs.batch_count }}"
          } >> "$GITHUB_STEP_SUMMARY"

  batch:
    needs: plan
    if: ${{ needs.plan.outputs.missing_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Run batch with isolated temporary output
        id: fetch
        continue-on-error: true
        shell: bash
        env:
          BATCH_DATES: ${{ matrix.dates }}
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/histock-${{ inputs.stock }}-batch-${{ matrix.batch }}"
          CANON="data_research/institutional-flow/histock/${{ inputs.stock }}"
          mkdir -p "$TMP/daily" "$CANON/daily" "$CANON/batch-status"

          # Seed temp with already-valid canonical files in this span so v2 only requests missing days.
          cp -f "$CANON"/daily/*.json "$TMP/daily/" 2>/dev/null || true

          set +e
          node scripts/backfill_histock_broker_history_research_v2.js \
            --stock "${{ inputs.stock }}" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --delay-ms "${{ inputs.delay_ms }}" \
            --jitter-ms "${{ inputs.jitter_ms }}" \
            --max-consecutive-failures 20 \
            --out "$TMP"
          FETCH_EXIT=$?
          set -e

          # Preserve every successful daily file even when some dates in this batch are unresolved.
          cp -f "$TMP"/daily/*.json "$CANON/daily/" 2>/dev/null || true

          STATUS="$CANON/batch-status/batch-$(printf '%03d' '${{ matrix.batch }}').json"
          node - "$TMP/analysis.json" "$STATUS" "$BATCH_DATES" "$FETCH_EXIT" <<'NODE'
          const fs = require('fs');
          const [analysisFile, statusFile, csv, exitCode] = process.argv.slice(2);
          const requested = csv.split(',').filter(Boolean);
          const analysis = fs.existsSync(analysisFile) ? JSON.parse(fs.readFileSync(analysisFile, 'utf8')) : {};
          const unresolvedMap = new Map((analysis.unresolved || []).map((x) => [x.date, x]));
          const parsedSet = new Set((analysis.rolling || []).map((x) => x.date));
          const status = {
            schema_version: 1,
            batch: Number(process.env.BATCH_INDEX),
            dates: requested,
            parsed_dates: requested.filter((d) => parsedSet.has(d)),
            unresolved: requested.filter((d) => !parsedSet.has(d)).map((d) => unresolvedMap.get(d) || { date: d, reason: 'missing_without_diagnostics', diagnostics: null }),
            fetch_exit_code: Number(exitCode),
            generated_at: new Date().toISOString(),
          };
          fs.writeFileSync(statusFile, `${JSON.stringify(status, null, 2)}\n`);
          console.log(JSON.stringify(status, null, 2));
          NODE
        env:
          BATCH_INDEX: ${{ matrix.batch }}

      - name: Validate and checkpoint this batch
        if: always()
        shell: bash
        env:
          BATCH_DATES: ${{ matrix.dates }}
        run: |
          set -euo pipefail
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          STATUS="$ROOT/batch-status/batch-$(printf '%03d' '${{ matrix.batch }}').json"
          test -s "$STATUS"
          node - "$ROOT" "$STATUS" "$BATCH_DATES" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const [root, statusFile, csv] = process.argv.slice(2);
          const stock = process.env.STOCK;
          const status = JSON.parse(fs.readFileSync(statusFile, 'utf8'));
          for (const date of csv.split(',').filter(Boolean)) {
            const file = path.join(root, 'daily', `${date.replaceAll('-', '')}.json`);
            if (!fs.existsSync(file)) continue;
            const p = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (p.source !== 'histock' || p.research_only !== true || p.stock !== stock || p.date !== date || !Array.isArray(p.records) || p.records.length === 0) throw new Error(`Invalid daily checkpoint ${date}`);
          }
          console.log(`batch ${status.batch}: parsed=${status.parsed_dates.length}/${status.dates.length}; unresolved=${status.unresolved.length}`);
          NODE

          if [ "${{ inputs.commit_results }}" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ROOT/daily" "$STATUS"
            if ! git diff --cached --quiet; then
              git commit -m "research: HiStock ${{ inputs.stock }} batch ${{ matrix.batch }} checkpoint"
              for attempt in 1 2 3 4 5; do
                if git pull --rebase origin main && git push origin HEAD:main; then
                  echo "checkpoint pushed"
                  exit 0
                fi
                git rebase --abort 2>/dev/null || true
                sleep $((attempt * 5))
              done
              exit 1
            fi
          fi
        env:
          STOCK: ${{ inputs.stock }}

  aggregate:
    needs: [plan, batch]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync all batch checkpoints
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Rebuild aggregate analysis and manifest
        id: aggregate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/aggregate_histock_broker_history_research.js \
            --stock "${{ inputs.stock }}" \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}"

      - name: Commit aggregate state
        if: ${{ inputs.commit_results }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT/analysis.json" "$ROOT/manifest.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: aggregate HiStock broker history ${{ inputs.stock }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final summary
        if: always()
        shell: bash
        run: |
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          {
            echo "## HiStock broker history plan & batch backfill"
            echo "- Planned trading days: ${{ needs.plan.outputs.requested_count }}"
            echo "- Existing before run: ${{ needs.plan.outputs.existing_count }}"
            echo "- Missing before run: ${{ needs.plan.outputs.missing_count }}"
            echo "- Planned batches: ${{ needs.plan.outputs.batch_count }}"
            echo "- Batch policy: max-parallel 1; each batch checkpoints successful daily files independently"
            echo "- A few unresolved dates do not discard successful dates from the same or previous batches"
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/render_histock_broker_history_summary.js "$ROOT/analysis.json" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Enforce only hard failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          node - "$ROOT/analysis.json" <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log(`coverage=${a.counts.parsed_trading_days}/${a.counts.requested_trading_days}; source_gaps=${a.counts.source_gaps}; hard_failures=${a.counts.hard_failures}`);
          if (Number(a.counts.hard_failures || 0) > 0) process.exit(1);
          NODE
