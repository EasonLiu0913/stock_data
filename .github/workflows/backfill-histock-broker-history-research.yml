name: "[07 研究] HiStock Broker History Backfill"

on:
  workflow_dispatch:
    inputs:
      stock:
        description: "Stock code"
        required: true
        default: "2449"
        type: string
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-04-01"
        type: string
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-07-31"
        type: string
      delay_ms:
        description: "Base delay between missing-day requests (>=1000 ms; random jitter is added)"
        required: true
        default: "2500"
        type: string
      commit_results:
        description: "Commit verified research progress to main"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: histock-broker-history-research-${{ inputs.stock }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.stock }}" =~ ^[0-9A-Za-z]{4,6}$ ]] || { echo "Invalid stock code"; exit 1; }
          [[ "${{ inputs.start_date }}" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Invalid start date"; exit 1; }
          [[ "${{ inputs.end_date }}" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Invalid end date"; exit 1; }
          [[ "${{ inputs.delay_ms }}" =~ ^[0-9]+$ ]] || { echo "Invalid delay"; exit 1; }
          test "${{ inputs.delay_ms }}" -ge 1000 || { echo "delay_ms must be >= 1000"; exit 1; }
          [[ "${{ inputs.start_date }}" < "${{ inputs.end_date }}" || "${{ inputs.start_date }}" == "${{ inputs.end_date }}" ]] || { echo "start_date must be <= end_date"; exit 1; }
          test -s data_history_sma/trading_days.json
          test -s data_history_sma/non_trading_days.json

      - name: Backfill missing HiStock broker research data
        id: backfill
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/backfill_histock_broker_history_research_v2.js \
            --stock "${{ inputs.stock }}" \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}" \
            --delay-ms "${{ inputs.delay_ms }}"

      - name: Validate generated research files
        id: validate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          test -s "$ROOT/manifest.json"
          test -s "$ROOT/analysis.json"
          node - <<'NODE'
          const fs = require('fs');
          const stock = process.env.STOCK;
          const root = `data_research/institutional-flow/histock/${stock}`;
          const manifest = JSON.parse(fs.readFileSync(`${root}/manifest.json`, 'utf8'));
          const analysis = JSON.parse(fs.readFileSync(`${root}/analysis.json`, 'utf8'));
          const trading = JSON.parse(fs.readFileSync('data_history_sma/trading_days.json', 'utf8'));
          const nonTrading = JSON.parse(fs.readFileSync('data_history_sma/non_trading_days.json', 'utf8'));
          const normalize = (value) => String(value).replaceAll('/', '-');
          const tradingSet = new Set(Object.values(trading).flat().map(normalize));
          const nonTradingSet = new Set(Object.values(nonTrading).flat().map(normalize));

          if (manifest.source !== 'histock' || manifest.research_only !== true) throw new Error('Invalid provenance');
          if (analysis.calendar?.selection !== 'trading_days_whitelist_with_non_trading_conflict_guard') throw new Error('Trading calendar guard missing');
          if (!Array.isArray(analysis.rolling) || analysis.rolling.length !== analysis.counts.parsed_trading_days) throw new Error('Rolling output mismatch');
          if (!Array.isArray(manifest.daily_files) || manifest.daily_files.length !== analysis.counts.parsed_trading_days) throw new Error('Manifest daily-file count mismatch');

          for (const relative of manifest.daily_files) {
            const match = relative.match(/daily\/(20\d{6})\.json$/);
            if (!match) throw new Error(`Invalid daily file path: ${relative}`);
            const date = `${match[1].slice(0, 4)}-${match[1].slice(4, 6)}-${match[1].slice(6, 8)}`;
            if (!tradingSet.has(date)) throw new Error(`Daily output is not a trading day: ${date}`);
            if (nonTradingSet.has(date)) throw new Error(`Daily output conflicts with non-trading calendar: ${date}`);
            const payload = JSON.parse(fs.readFileSync(`${root}/${relative}`, 'utf8'));
            if (payload.source !== 'histock' || payload.research_only !== true) throw new Error(`Invalid daily provenance: ${date}`);
            if (payload.date !== date || payload.stock !== stock) throw new Error(`Daily identity mismatch: ${date}`);
            if (!Array.isArray(payload.records) || payload.records.length === 0) throw new Error(`Empty committed daily records: ${date}`);
          }

          console.log(`Verified ${analysis.counts.parsed_trading_days}/${analysis.counts.requested_trading_days} parsed trading days; reused=${analysis.counts.reused_daily_files}; remote=${analysis.counts.remote_requests_attempted}; unresolved=${analysis.counts.unresolved_trading_days}; complete=${analysis.complete}.`);
          NODE
        env:
          STOCK: ${{ inputs.stock }}

      - name: Commit verified research progress
        if: ${{ always() && steps.validate.outcome == 'success' && inputs.commit_results }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT"
          if git diff --cached --quiet; then
            echo "No research data changes to commit."
            exit 0
          fi

          COMPLETE=$(node -e "const a=require('./$ROOT/analysis.json'); process.stdout.write(String(a.complete === true))")
          if [ "$COMPLETE" = "true" ]; then
            MESSAGE="research: complete HiStock broker history ${{ inputs.stock }} ${{ inputs.start_date }} to ${{ inputs.end_date }}"
          else
            PARSED=$(node -e "const a=require('./$ROOT/analysis.json'); process.stdout.write(String(a.counts.parsed_trading_days))")
            REQUESTED=$(node -e "const a=require('./$ROOT/analysis.json'); process.stdout.write(String(a.counts.requested_trading_days))")
            MESSAGE="research: preserve partial HiStock broker history ${{ inputs.stock }} ${PARSED}/${REQUESTED} days"
          fi

          git commit -m "$MESSAGE"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          {
            echo "## HiStock broker history research backfill"
            echo "- Stock: \`${{ inputs.stock }}\`"
            echo "- Range: \`${{ inputs.start_date }}\` → \`${{ inputs.end_date }}\`"
            echo "- Source: third-party HiStock public page"
            echo "- Trading-day source: \`data_history_sma/trading_days.json\`"
            echo "- Non-trading guard: \`data_history_sma/non_trading_days.json\`"
            echo "- Request policy: reuse valid daily files; missing days use base delay + jitter; zero-record trading days retry then classify"
            echo "- Persistence policy: verified parsed days are committed even when HiStock has documented source gaps"
            echo "- Classification: research-only; not official TWSE BSR"
            echo "- Rolling windows: 5 / 10 / 20 parsed trading days"
            echo "- Output root: \`$ROOT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/render_histock_broker_history_summary.js "$ROOT/analysis.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Classify trading-day coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="data_research/institutional-flow/histock/${{ inputs.stock }}"
          if [ "${{ steps.validate.outcome }}" != "success" ]; then
            echo "Generated research files failed structural validation."
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const root = process.env.ROOT;
          const analysis = JSON.parse(fs.readFileSync(`${root}/analysis.json`, 'utf8'));
          const unresolved = Array.isArray(analysis.unresolved) ? analysis.unresolved : [];

          if (analysis.complete === true) {
            if (analysis.counts.parsed_trading_days !== analysis.counts.requested_trading_days) throw new Error('Trading-day coverage mismatch');
            console.log('HiStock trading-day coverage complete.');
            process.exit(0);
          }

          const isDocumentedSourceGap = (item) => {
            const d = item?.diagnostics || {};
            return item?.reason === 'no_broker_records_on_trading_day'
              && d.http_status === 200
              && d.date_visible === true
              && d.broker_keywords_visible === true
              && Number(d.table_rows) <= 1
              && Number(d.response_bytes) > 0;
          };

          const sourceGaps = unresolved.filter(isDocumentedSourceGap);
          const hardFailures = unresolved.filter((item) => !isDocumentedSourceGap(item));
          const accounted = analysis.counts.parsed_trading_days + sourceGaps.length;
          const requested = analysis.counts.requested_trading_days;
          const coverage = requested ? analysis.counts.parsed_trading_days / requested : 0;

          if (!analysis.aborted && hardFailures.length === 0 && accounted === requested) {
            console.log(`Usable research coverage with documented HiStock source gaps: parsed=${analysis.counts.parsed_trading_days}/${requested} (${(coverage * 100).toFixed(1)}%), source_gaps=${sourceGaps.length}.`);
            for (const gap of sourceGaps) console.log(`- source gap ${gap.date}: ${gap.reason}`);
            process.exit(0);
          }

          const hardDates = hardFailures.map((x) => x.date).join(', ');
          throw new Error(`HiStock backfill has unresolved hard failures: parsed=${analysis.counts.parsed_trading_days}/${requested}; source_gaps=${sourceGaps.length}; hard_failures=${hardFailures.length}; dates=${hardDates || 'see analysis.json'}`);
          NODE
        env:
          ROOT: data_research/institutional-flow/histock/${{ inputs.stock }}
