name: Generate V2 shadow predictions (manual)

on:
  workflow_dispatch:
    inputs:
      date:
        description: V1 forecast date in YYYYMMDD; defaults to latest V1 date
        required: false
        default: ''
      force:
        description: Regenerate V2 even when the same date already exists
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: manual-stock-prediction-generation
  cancel-in-progress: false

jobs:
  generate-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Resolve V1 source date
        id: source
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.date }}
          FORCE_RUN: ${{ inputs.force }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            date="$INPUT_DATE"
          else
            date=$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('data_predictions/manifest.json','utf8')); process.stdout.write(m.latest_date || m.forecast_date_compact || '');")
          fi

          if ! [[ "$date" =~ ^20[0-9]{6}$ ]]; then
            echo "Unable to resolve a valid V1 forecast date: $date"
            exit 1
          fi

          source_manifest="data_predictions/$date/manifest.json"
          if [ ! -s "$source_manifest" ]; then
            echo "V1 source manifest does not exist: $source_manifest"
            exit 1
          fi

          node -e "const fs=require('fs'); const file=process.argv[1]; const expected=process.argv[2]; const m=JSON.parse(fs.readFileSync(file,'utf8')); const actual=m.forecast_date_compact || String(m.forecast_date || '').replaceAll('-',''); if(actual!==expected) throw new Error('V1 manifest date mismatch'); if(Number(m.generated_reports)<1) throw new Error('V1 manifest has no reports');" "$source_manifest" "$date"

          status_file="data_predictions/$date/generation-status.txt"
          if [ -f "$status_file" ] && [ "$(tr -d '\r\n' < "$status_file")" != "success" ]; then
            echo "V1 source generation did not succeed"
            exit 1
          fi

          if [ "$FORCE_RUN" != "true" ] && [ -s "data_predictions_v2/$date/manifest.json" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "V2 exists; refreshing viewer without recalculating predictions."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Run V2 rule tests
        if: steps.source.outputs.run == 'true'
        run: npm test

      - name: Generate V2 only
        if: steps.source.outputs.run == 'true'
        run: node scripts/generate_all_stock_predictions_v2.js --date "${{ steps.source.outputs.date }}"

      - name: Generate V1 V2 HTML viewer data
        run: node scripts/generate_prediction_version_ui.js --date "${{ steps.source.outputs.date }}"

      - name: Commit V2 outputs and viewer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_predictions_v2 data_prediction_ui public/index.html public/prediction-version-dashboard.html

          if git diff --cached --quiet; then
            echo "No V2 or viewer changes"
            exit 0
          fi

          git commit -m "feat: publish ${{ steps.source.outputs.date }} V1 V2 prediction viewer"

          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

          exit 1
