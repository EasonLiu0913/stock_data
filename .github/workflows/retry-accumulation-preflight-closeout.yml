name: "[研究驗收] Retry Accumulation Preflight Closeout"

on:
  push:
    paths:
      - '.github/workflows/retry-accumulation-preflight-closeout.yml'

permissions:
  contents: write

concurrency:
  group: accumulation-preflight-closeout-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify regression and pre-retry planner
        shell: bash
        run: |
          set -euo pipefail
          node tests/institutional_accumulation_official_disclosure_collection.test.js
          node scripts/plan_institutional_accumulation_official_disclosure_collection.js > /tmp/before.json
          cat /tmp/before.json
          node - <<'NODE'
          const p=require('/tmp/before.json');
          if (p.wave_a.length !== 0) throw new Error('Wave A must not refetch');
          if (p.wave_b.length !== 1 || !p.preflight_retryable) throw new Error('Ambiguous Wave B must be retryable');
          if (p.wave_c.length !== 0 || p.material_information_authorized) throw new Error('Wave C must remain blocked');
          NODE
      - name: Run exactly one fresh-runner preflight retry
        shell: bash
        run: |
          set +e
          node scripts/preflight_institutional_accumulation_mops_material_information.js
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
      - name: Checkpoint bounded preflight state
        shell: bash
        run: |
          set -euo pipefail
          file='data_research/institutional-flow/official-disclosure-raw/mops-material-information/preflight.json'
          git add "$file"
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'data: retry accumulation MOPS material preflight'
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD^; then
              git reset --soft origin/main
              git restore --staged .
              git add "$file"
              git commit -m 'data: retry accumulation MOPS material preflight'
            fi
            git push origin HEAD:main
          fi
      - name: Verify durable post-retry planner
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          node scripts/plan_institutional_accumulation_official_disclosure_collection.js > /tmp/after.json
          cat /tmp/after.json
          node - <<'NODE'
          const fs=require('node:fs');
          const p=require('/tmp/after.json');
          const pre=JSON.parse(fs.readFileSync('data_research/institutional-flow/official-disclosure-raw/mops-material-information/preflight.json','utf8'));
          if (p.wave_a.length !== 0) throw new Error('Wave A must remain completed');
          if (p.wave_c.length !== 0 && pre.decision !== 'pass') throw new Error('Wave C cannot open without PASS');
          if (pre.decision === 'blocked' && pre.retryable && p.wave_b.length !== 1) throw new Error('Retryable blocked preflight must remain queued');
          if (pre.terminal_state === 'manual_review' && p.wave_b.length !== 0) throw new Error('Manual-review preflight must not auto-retry');
          NODE
