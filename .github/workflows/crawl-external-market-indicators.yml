name: "[02 外部市場] Crawl External Market Indicators"

on:
  schedule:
    # 台灣時間週二至週六 05:10、05:40、06:10、06:40、07:10、07:40。
    # 每一輪都實際抓取；盤中／尚未完整的 provisional snapshot 會保留，後續輪次持續覆蓋直到 final。
    - cron: '10 21 * * 1-5'
    - cron: '40 21 * * 1-5'
    - cron: '10 22 * * 1-5'
    - cron: '40 22 * * 1-5'
    - cron: '10 23 * * 1-5'
    - cron: '40 23 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '美國市場日期 YYYYMMDD；留空時依紐約時間自動判斷'
        required: false
        default: ''
      force_overwrite:
        description: '強制重新抓取並覆蓋已是 final 的同日期資料'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crawl-external-market-indicators
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve target market date
        id: target
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.date || '' }}
          FORCE_OVERWRITE: ${{ github.event.inputs.force_overwrite || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_DATE" ]; then
            target=$(node scripts/crawl_external_market_indicators.js --resolve-date --date "$INPUT_DATE")
            resolution_source=manual_explicit_date
            scheduled_at=
          elif [ "$EVENT_NAME" = "schedule" ]; then
            resolved=$(node scripts/resolve_scheduled_collection_date.js \
              --event-name "$EVENT_NAME" \
              --schedule "$EVENT_SCHEDULE" \
              --policy same_calendar_date \
              --time-zone UTC \
              --json)
            scheduled_at=$(printf '%s' "$resolved" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).scheduled_at_utc));")
            target=$(node scripts/resolve_external_market_session_date.js --now "$scheduled_at")
            resolution_source=scheduled_occurrence
          else
            target=$(node scripts/crawl_external_market_indicators.js --resolve-date)
            resolution_source=manual_current_time
            scheduled_at=
          fi
          echo "target_date=$target" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE_OVERWRITE" >> "$GITHUB_OUTPUT"
          echo "resolution_source=$resolution_source" >> "$GITHUB_OUTPUT"
          echo "scheduled_at_utc=$scheduled_at" >> "$GITHUB_OUTPUT"
          echo "Target U.S. market date: $target"
          if [ -n "$scheduled_at" ]; then echo "Scheduled occurrence UTC: $scheduled_at"; fi
          echo "Current New York time: $(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "The crawler will run regardless of market phase; provisional/intraday data is persisted and refreshed later."

      - name: Crawl external market indicators
        id: crawl
        shell: bash
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
          FORCE_OVERWRITE: ${{ steps.target.outputs.force }}
        run: |
          set -euo pipefail
          args=(--date "$TARGET_DATE")
          if [ "$FORCE_OVERWRITE" != "true" ]; then
            args+=(--skip-existing)
          fi
          node scripts/crawl_external_market_indicators.js "${args[@]}"

      - name: Validate five primary indicators, market date and finality
        id: validate
        shell: bash
        env:
          EXPECTED_DATE: ${{ steps.target.outputs.target_date }}
          OUTPUT_FILE: ${{ steps.crawl.outputs.output_file }}
        run: |
          set -euo pipefail
          node scripts/validate_external_market_snapshot.js \
            --expected-date "$EXPECTED_DATE" \
            --file "$OUTPUT_FILE"

      - name: Report provisional snapshot
        if: steps.validate.outputs.ready != 'true'
        shell: bash
        run: |
          echo "External-market snapshot saved but is not final yet."
          echo "Expected market date: ${{ steps.target.outputs.target_date }}"
          echo "Actual primary market date: ${{ steps.validate.outputs.actual_date }}"
          echo "Agreement: ${{ steps.validate.outputs.agreement }}"
          echo "Data status: ${{ steps.validate.outputs.data_status }}"
          echo "Captured at: ${{ steps.validate.outputs.captured_at }}"
          echo "Needs refresh: ${{ steps.validate.outputs.needs_refresh }}"
          echo "A later scheduled run will crawl again and overwrite this provisional snapshot."

      - name: Generate market risk snapshot if needed
        id: risk
        if: steps.validate.outputs.ready == 'true'
        shell: bash
        env:
          MARKET_DATE: ${{ steps.validate.outputs.actual_date }}
          CRAWL_SKIPPED: ${{ steps.crawl.outputs.skipped || 'false' }}
        run: |
          set -euo pipefail
          risk_file="data_market_risk/${MARKET_DATE}/market_risk_snapshot.json"
          if [ "$CRAWL_SKIPPED" = "true" ] && [ -s "$risk_file" ]; then
            echo "Market risk snapshot already exists for final external data; skipping regeneration."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/generate_market_risk_snapshot.js --date "$MARKET_DATE"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Generate relevant files.json if needed
        if: steps.crawl.outputs.skipped != 'true' || steps.risk.outputs.skipped != 'true'
        run: node scripts/generate_file_lists.js --only data_external_market,data_market_risk

      - name: Run external market and market environment tests
        run: node --test tests/external_market_snapshot_status.test.js tests/market_environment.test.js

      - name: Write crawl summary
        if: always()
        shell: bash
        run: |
          {
            echo "## External Market Crawl"
            echo ""
            echo "- Target market date: \`${{ steps.target.outputs.target_date }}\`"
            echo "- Resolution source: \`${{ steps.target.outputs.resolution_source }}\`"
            echo "- Scheduled occurrence UTC: \`${{ steps.target.outputs.scheduled_at_utc || 'n/a' }}\`"
            echo "- Actual market date: \`${{ steps.validate.outputs.actual_date || 'n/a' }}\`"
            echo "- Data status: \`${{ steps.validate.outputs.data_status || steps.crawl.outputs.data_status || 'unknown' }}\`"
            echo "- Final: \`${{ steps.validate.outputs.is_final || steps.crawl.outputs.is_final || 'false' }}\`"
            echo "- Needs refresh: \`${{ steps.validate.outputs.needs_refresh || steps.crawl.outputs.needs_refresh || 'unknown' }}\`"
            echo "- Captured at: \`${{ steps.validate.outputs.captured_at || 'n/a' }}\`"
            echo "- External crawl skipped because final exists: \`${{ steps.crawl.outputs.skipped || 'false' }}\`"
            echo "- Market risk regeneration skipped: \`${{ steps.risk.outputs.skipped || 'false' }}\`"
            echo "- Ready for downstream market environment: \`${{ steps.validate.outputs.ready || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Snapshot validated external market artifact outside worktree
        id: snapshot
        if: success()
        shell: bash
        env:
          OUTPUT_FILE: ${{ steps.crawl.outputs.output_file }}
        run: |
          set -euo pipefail
          test -n "$OUTPUT_FILE"
          test -s "$OUTPUT_FILE"
          SNAPSHOT_DIR="$RUNNER_TEMP/external-market-publish"
          SNAPSHOT_FILE="$SNAPSHOT_DIR/external_market_indicators.json"
          mkdir -p "$SNAPSHOT_DIR"
          cp "$OUTPUT_FILE" "$SNAPSHOT_FILE"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$SNAPSHOT_FILE"
          echo "snapshot_file=$SNAPSHOT_FILE" >> "$GITHUB_OUTPUT"
          echo "Preserved validated external-market artifact outside the repository worktree: $SNAPSHOT_FILE"

      - name: Commit and race-safe push changes
        if: success()
        shell: bash
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
          MARKET_DATE: ${{ steps.validate.outputs.actual_date }}
          READY: ${{ steps.validate.outputs.ready || 'false' }}
          EXTERNAL_SNAPSHOT: ${{ steps.snapshot.outputs.snapshot_file }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          export EXTERNAL_FILE="data_external_market/${TARGET_DATE}/external_market_indicators.json"
          export EXTERNAL_FILES_INDEX="data_external_market/files.json"
          export EXTERNAL_MANIFEST="data_external_market/manifest.json"
          export RISK_FILE="data_market_risk/${MARKET_DATE}/market_risk_snapshot.json"
          export RISK_FILES_INDEX="data_market_risk/files.json"
          export RISK_MANIFEST="data_market_risk/manifest.json"

          PREPARE_SCRIPT="$RUNNER_TEMP/external-market-publish/prepare.sh"
          VALIDATE_SCRIPT="$RUNNER_TEMP/external-market-publish/validate.sh"

          cat > "$PREPARE_SCRIPT" <<'PREPARE'
          #!/usr/bin/env bash
          set -euo pipefail

          mkdir -p "$(dirname "$EXTERNAL_FILE")"
          cp "$EXTERNAL_SNAPSHOT" "$EXTERNAL_FILE"

          node scripts/generate_file_lists.js --only data_external_market
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.cwd();
          const dir = path.join(root, 'data_external_market');
          const payload = JSON.parse(fs.readFileSync(process.env.EXTERNAL_FILE, 'utf8'));
          const dates = fs.readdirSync(dir, { withFileTypes: true })
            .filter((entry) => entry.isDirectory() && /^\d{8}$/.test(entry.name))
            .map((entry) => entry.name)
            .sort();
          const latestDate = dates.at(-1) || null;
          const manifest = {
            schemaVersion: 1,
            generated_at: payload.generated_at,
            latest_date: latestDate,
            latest_file: latestDate ? `data_external_market/${latestDate}/external_market_indicators.json` : null,
            available_dates: dates,
          };
          fs.writeFileSync(process.env.EXTERNAL_MANIFEST, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          if [ "$READY" = "true" ]; then
            node scripts/generate_market_risk_snapshot.js --date "$MARKET_DATE"
            node scripts/generate_file_lists.js --only data_market_risk
          fi
          PREPARE

          cat > "$VALIDATE_SCRIPT" <<'VALIDATE'
          #!/usr/bin/env bash
          set -euo pipefail

          node scripts/validate_external_market_snapshot.js \
            --expected-date "$TARGET_DATE" \
            --file "$EXTERNAL_FILE"

          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$EXTERNAL_MANIFEST"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$EXTERNAL_FILES_INDEX"

          if [ "$READY" = "true" ]; then
            test -s "$RISK_FILE"
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$RISK_FILE"
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$RISK_MANIFEST"
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$RISK_FILES_INDEX"
          fi

          node --test tests/external_market_snapshot_status.test.js tests/market_environment.test.js
          VALIDATE

          chmod +x "$PREPARE_SCRIPT" "$VALIDATE_SCRIPT"
          current_date=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          status="${{ steps.validate.outputs.data_status || steps.crawl.outputs.data_status || 'snapshot' }}"

          scripts/race_safe_main_publish.sh \
            --prepare-script "$PREPARE_SCRIPT" \
            --validate-script "$VALIDATE_SCRIPT" \
            --commit-message "chore: update ${status} external market indicators ${current_date}" \
            --add-path "$EXTERNAL_FILE" \
            --add-path "$EXTERNAL_FILES_INDEX" \
            --add-path "$EXTERNAL_MANIFEST" \
            --add-path "$RISK_FILE" \
            --add-path "$RISK_FILES_INDEX" \
            --add-path "$RISK_MANIFEST" \
            --max-attempts 5

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for schedule summary
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js

