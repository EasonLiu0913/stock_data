name: Crawl External Market Indicators

on:
  schedule:
    # 台北時間 02:02（UTC 前一日 18:02）。若實際開始時間早於 04:30，僅檢查後跳過。
    - cron: '2 18 * * 0-4'
    # 台北時間 03:03（UTC 前一日 19:03）。若實際開始時間早於 04:30，僅檢查後跳過。
    - cron: '3 19 * * 0-4'
    # 台北時間 03:31（UTC 前一日 19:31）。若實際開始時間早於 04:30，僅檢查後跳過。
    - cron: '31 19 * * 0-4'
    # 台北時間 07:20：美股收盤後，收集 Nasdaq、SOX、TSM ADR、匯率與油價期貨。
    - cron: '20 23 * * 0-4'
  workflow_dispatch:
    inputs:
      date:
        description: '美國市場日期 YYYYMMDD；留空時依紐約時間與 09:30 開盤時間自動判斷'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: crawl-external-market-indicators
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check crawl eligibility
        id: crawl-gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DATE: ${{ github.event.inputs.date || '' }}
        run: |
          set -euo pipefail

          TAIPEI_HOUR=$(TZ='Asia/Taipei' date '+%H')
          TAIPEI_MINUTE=$(TZ='Asia/Taipei' date '+%M')
          TAIPEI_TIME=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')

          if [ -n "$INPUT_DATE" ]; then
            TARGET_DATE=$(node scripts/crawl_external_market_indicators.js --resolve-date --date "$INPUT_DATE")
            HAS_EXPLICIT_DATE=true
          else
            TARGET_DATE=$(node scripts/crawl_external_market_indicators.js --resolve-date)
            HAS_EXPLICIT_DATE=false
          fi

          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "has_explicit_date=$HAS_EXPLICIT_DATE" >> "$GITHUB_OUTPUT"
          echo "Taipei actual start time: $TAIPEI_TIME"
          echo "Resolved U.S. market target date: $TARGET_DATE"

          # 手動執行可重抓指定或自動判斷的美國市場日期，不受 04:30 與既有檔案限制。
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: crawl is allowed."
            exit 0
          fi

          CURRENT_MINUTES=$((10#$TAIPEI_HOUR * 60 + 10#$TAIPEI_MINUTE))
          EARLIEST_MINUTES=$((4 * 60 + 30))

          if [ "$CURRENT_MINUTES" -lt "$EARLIEST_MINUTES" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=actual Taipei start time is earlier than 04:30" >> "$GITHUB_OUTPUT"
            echo "Skip: actual Taipei start time is earlier than 04:30."
            exit 0
          fi

          TARGET_FILE="data_external_market/$TARGET_DATE/external_market_indicators.json"
          if [ -s "$TARGET_FILE" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=resolved U.S. market-date file already exists" >> "$GITHUB_OUTPUT"
            echo "Skip: $TARGET_FILE already exists and is not empty."
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "reason=eligible scheduled run" >> "$GITHUB_OUTPUT"
          echo "Run: time threshold passed and resolved U.S. market-date file does not exist."

      - name: Report skipped scheduled run
        if: steps.crawl-gate.outputs.should_run != 'true'
        run: |
          echo "External-market crawl skipped."
          echo "Reason: ${{ steps.crawl-gate.outputs.reason }}"
          echo "Resolved U.S. market target date: ${{ steps.crawl-gate.outputs.target_date }}"

      - name: Setup Node.js
        if: steps.crawl-gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crawl external market indicators
        id: crawl-market
        if: steps.crawl-gate.outputs.should_run == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_DATE: ${{ steps.crawl-gate.outputs.target_date }}
          HAS_EXPLICIT_DATE: ${{ steps.crawl-gate.outputs.has_explicit_date }}
        run: |
          set -euo pipefail

          ARGS=()
          if [ "$HAS_EXPLICIT_DATE" = "true" ]; then
            ARGS+=(--date "$TARGET_DATE")
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            ARGS+=(--skip-existing)
          fi

          node scripts/crawl_external_market_indicators.js "${ARGS[@]}"

      - name: Report actual-market-date duplicate skip
        if: steps.crawl-gate.outputs.should_run == 'true' && steps.crawl-market.outputs.skipped == 'true'
        run: |
          echo "External-market crawl skipped after Yahoo market-date resolution."
          echo "Actual market date: ${{ steps.crawl-market.outputs.market_date }}"
          echo "Existing file: ${{ steps.crawl-market.outputs.output_file }}"

      - name: Generate market risk snapshot
        if: steps.crawl-gate.outputs.should_run == 'true' && steps.crawl-market.outputs.skipped != 'true'
        run: node scripts/generate_market_risk_snapshot.js --date "${{ steps.crawl-market.outputs.market_date }}"

      - name: Generate relevant files.json only
        if: steps.crawl-gate.outputs.should_run == 'true' && steps.crawl-market.outputs.skipped != 'true'
        run: node scripts/generate_file_lists.js --only data_external_market,data_market_risk

      - name: Commit and push changes
        if: steps.crawl-gate.outputs.should_run == 'true' && steps.crawl-market.outputs.skipped != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/external_market_indicators.json config/stock_news_aliases.json data_external_market/ data_market_risk/

          if git diff --staged --quiet; then
            if [ -n "$(git status --porcelain)" ]; then
              echo "Unexpected uncommitted changes remain even though there are no external-market changes:"
              git status --short
              exit 1
            fi
            echo "No external market changes"
            exit 0
          fi

          current_date=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          git commit -m "chore: update external market indicators ${current_date}"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed, retry ${attempt}/5..."
            sleep 5
          done

          echo "Failed to push after 5 attempts."
          exit 1
