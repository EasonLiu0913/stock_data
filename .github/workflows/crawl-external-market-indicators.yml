name: "[02 外部市場] Crawl External Market Indicators"

on:
  schedule:
    - cron: '51 19 * * 1-5'
    - cron: '1 20 * * 1-5'
    - cron: '2 21 * * 1-5'
    - cron: '20 22 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '美國市場日期 YYYYMMDD；留空時依紐約時間自動判斷'
        required: false
        default: ''
      force_overwrite:
        description: '強制重新抓取並覆蓋同日期既有資料'
        required: false
        type: boolean
        default: false
      skip_time_limit:
        description: '手動略過「紐約 17:00 後」限制'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crawl-external-market-indicators
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve target and check New York close buffer
        id: gate
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.date || '' }}
          FORCE_OVERWRITE: ${{ github.event.inputs.force_overwrite || 'false' }}
          SKIP_TIME_LIMIT: ${{ github.event.inputs.skip_time_limit || 'false' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_DATE" ]; then
            target=$(node scripts/crawl_external_market_indicators.js --resolve-date --date "$INPUT_DATE")
            explicit=true
          else
            target=$(node scripts/crawl_external_market_indicators.js --resolve-date)
            explicit=false
          fi
          echo "target_date=$target" >> "$GITHUB_OUTPUT"
          echo "explicit=$explicit" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE_OVERWRITE" >> "$GITHUB_OUTPUT"

          ny_hour=$(TZ='America/New_York' date '+%H')
          ny_minute=$(TZ='America/New_York' date '+%M')
          ny_time=$(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S %Z')
          echo "New York time: $ny_time"
          echo "Resolved target: $target"

          if [ "$explicit" != "true" ] && [ "$SKIP_TIME_LIMIT" != "true" ]; then
            minutes=$((10#$ny_hour * 60 + 10#$ny_minute))
            if [ "$minutes" -lt 1020 ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "reason=New York time is before 17:00 close buffer" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "reason=eligible" >> "$GITHUB_OUTPUT"

      - name: Report skipped run
        if: steps.gate.outputs.should_run != 'true'
        run: |
          echo "External-market crawl skipped."
          echo "Reason: ${{ steps.gate.outputs.reason }}"
          echo "Target: ${{ steps.gate.outputs.target_date }}"

      - name: Crawl external market indicators
        id: crawl
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        env:
          TARGET_DATE: ${{ steps.gate.outputs.target_date }}
          FORCE_OVERWRITE: ${{ steps.gate.outputs.force }}
        run: |
          set -euo pipefail
          args=(--date "$TARGET_DATE")
          if [ "$FORCE_OVERWRITE" != "true" ]; then
            args+=(--skip-existing)
          fi
          node scripts/crawl_external_market_indicators.js "${args[@]}"

      - name: Validate five primary indicators and exact market date
        id: validate
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        env:
          EXPECTED_DATE: ${{ steps.gate.outputs.target_date }}
          OUTPUT_FILE: ${{ steps.crawl.outputs.output_file }}
        run: |
          set -euo pipefail
          node scripts/validate_external_market_snapshot.js \
            --expected-date "$EXPECTED_DATE" \
            --file "$OUTPUT_FILE"

      - name: Discard not-ready snapshot
        if: steps.gate.outputs.should_run == 'true' && steps.validate.outputs.ready != 'true'
        shell: bash
        run: |
          echo "Yahoo has not published a complete exact-date 5/5 snapshot yet."
          echo "Expected: ${{ steps.gate.outputs.target_date }}"
          echo "Actual: ${{ steps.validate.outputs.actual_date }}"
          echo "Agreement: ${{ steps.validate.outputs.agreement }}"
          git reset --hard HEAD
          git clean -fd data_external_market data_market_risk

      - name: Generate market risk snapshot
        if: steps.validate.outputs.ready == 'true'
        run: node scripts/generate_market_risk_snapshot.js --date "${{ steps.validate.outputs.actual_date }}"

      - name: Generate relevant files.json only
        if: steps.validate.outputs.ready == 'true'
        run: node scripts/generate_file_lists.js --only data_external_market,data_market_risk

      - name: Run market environment tests
        if: steps.validate.outputs.ready == 'true'
        run: node --test tests/market_environment.test.js

      - name: Commit and push changes
        if: steps.validate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/external_market_indicators.json config/stock_news_aliases.json data_external_market/ data_market_risk/
          if git diff --staged --quiet; then
            echo "No external market changes"
            exit 0
          fi
          current_date=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          git commit -m "chore: update verified external market indicators ${current_date}"
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
