name: Apply TWSE Range Report Patch

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_twse_range_report_patch.js

permissions:
  contents: write

concurrency:
  group: apply-twse-range-report-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply TWSE range report patch
        run: node scripts/apply_twse_range_report_patch.js

      - name: Verify patched files
        run: |
          node --check scripts/crawl_twse_institutional_summaries_range.js
          node --test tests/crawl_twse_institutional_summaries_range.test.js

      - name: Commit and push patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/crawl_twse_institutional_summaries_range.js \
            tests/crawl_twse_institutional_summaries_range.test.js \
            .github/workflows/crawl-twse-institutional-summaries-range.yml
          if git diff --cached --quiet; then
            echo "No TWSE range report patch changes"
            exit 0
          fi
          git commit -m "feat: publish TWSE range crawl failure reports"
          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected changes remain before rebase:"
            git status --short
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Patch push failed; retry ${attempt}/5"
            sleep 5
          done
          echo "Patch push failed after 5 attempts"
          exit 1
