name: '[04 預測覆盤] 套用標籤與版本化策略'

on:
  push:
    branches: [main]
    paths:
      - 'config/strategy-tag-registry.json'
      - 'scripts/strategy_tag_engine.js'
      - 'scripts/strategy_tag_source_enrichment.js'
      - 'scripts/apply_strategy_tag_registry.js'
      - 'scripts/summarize_strategy_snapshot_manifest.js'
      - '.github/workflows/apply-strategy-tag-registry.yml'
  workflow_dispatch:
    inputs:
      date:
        description: '預測日期 YYYYMMDD；留空使用最新有效預測日期'
        required: false
        type: string
      evaluation_mode:
        description: 'live_snapshot 保存當時版本；historical_recalculation 用目前 registry 重算歷史'
        required: true
        type: choice
        default: live_snapshot
        options:
          - live_snapshot
          - historical_recalculation
      data_as_of:
        description: '歷史重算的資料截點 YYYYMMDD；live_snapshot 可留空'
        required: false
        type: string
  workflow_run:
    workflows:
      - '04 預測覆盤 - 每日產生股票預測'
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - 'config/strategy-tag-registry.json'
      - 'scripts/strategy_tag_engine.js'
      - 'scripts/strategy_tag_source_enrichment.js'
      - 'scripts/apply_strategy_tag_registry.js'
      - 'scripts/summarize_strategy_snapshot_manifest.js'
      - 'tests/strategy_tag_engine.test.js'
      - 'tests/strategy_tag_source_enrichment.test.js'
      - 'tests/apply_strategy_tag_registry.test.js'
      - 'tests/summarize_strategy_snapshot_manifest.test.js'
      - '.github/workflows/apply-strategy-tag-registry.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: strategy-tag-registry-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full validation for registry or code changes
        if: github.event_name != 'workflow_run'
        run: |
          node --check scripts/strategy_tag_engine.js
          node --check scripts/strategy_tag_source_enrichment.js
          node --check scripts/apply_strategy_tag_registry.js
          node --check scripts/summarize_strategy_snapshot_manifest.js
          node --test \
            tests/strategy_tag_engine.test.js \
            tests/strategy_tag_source_enrichment.test.js \
            tests/apply_strategy_tag_registry.test.js \
            tests/summarize_strategy_snapshot_manifest.test.js
          node -e "require('./scripts/strategy_tag_engine').validateRegistry(require('./config/strategy-tag-registry.json'))"
      - name: Fast validation for routine daily prediction
        if: github.event_name == 'workflow_run'
        run: |
          node --check scripts/apply_strategy_tag_registry.js
          node --check scripts/summarize_strategy_snapshot_manifest.js
          node -e "require('./scripts/strategy_tag_engine').validateRegistry(require('./config/strategy-tag-registry.json'))"

  apply:
    needs: validate
    if: >
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve one target prediction date
        id: target
        env:
          INPUT_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE:-}" ]; then
            target_date="${INPUT_DATE//[^0-9]/}"
          else
            target_date=$(node -e "process.stdout.write(require('./scripts/apply_strategy_tag_registry').latestPredictionDate('data_predictions'))")
          fi
          [[ "$target_date" =~ ^20[0-9]{6}$ ]] || { echo "Invalid target date: $target_date"; exit 1; }
          test -s "data_predictions/$target_date/summary.json"
          echo "date=$target_date" >> "$GITHUB_OUTPUT"
          echo "TARGET_DATE=$target_date" >> "$GITHUB_ENV"
          echo "Target prediction date: $target_date"
      - name: Apply fixed tag and strategy registry
        env:
          EVALUATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluation_mode || github.event_name == 'workflow_run' && 'live_snapshot' || 'historical_recalculation' }}
          DATA_AS_OF: ${{ inputs.data_as_of }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--date "$TARGET_DATE" --evaluation-mode "$EVALUATION_MODE")
          if [ -n "${DATA_AS_OF:-}" ]; then args+=(--data-as-of "$DATA_AS_OF"); fi
          echo "event=${GITHUB_EVENT_NAME} evaluation_mode=${EVALUATION_MODE} date=${TARGET_DATE} data_as_of=${DATA_AS_OF:-base_trade_date}"
          node scripts/apply_strategy_tag_registry.js "${args[@]}"
      - name: Summarize only the target snapshot date
        run: node scripts/summarize_strategy_snapshot_manifest.js --date "$TARGET_DATE"
      - name: Verify only the target snapshot date
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const date = process.env.TARGET_DATE;
          const manifestFile = 'data_prediction_analysis/strategy-snapshots/manifest.json';
          if (!fs.existsSync(manifestFile)) throw new Error('Strategy snapshot manifest missing');
          const manifest = JSON.parse(fs.readFileSync(manifestFile, 'utf8'));
          const row = manifest.dates?.[date];
          if (!row) throw new Error(`Strategy snapshot date missing: ${date}`);
          const entries = [
            row.live_snapshot,
            ...(row.live_snapshot_history || []),
            ...(row.historical_recalculations || []),
          ].filter(Boolean);
          if (!entries.length) throw new Error(`No strategy snapshot generated for ${date}`);
          for (const entry of entries) {
            if (!fs.existsSync(entry.file)) throw new Error(`Snapshot file missing: ${entry.file}`);
            const snapshot = JSON.parse(fs.readFileSync(entry.file, 'utf8'));
            if (!snapshot.tag_classifications || !snapshot.strategy_classifications) throw new Error(`Invalid snapshot: ${entry.file}`);
            for (const item of Object.values(snapshot.tag_classifications)) if (item.count === undefined) throw new Error('Tag count missing');
            for (const item of Object.values(snapshot.strategy_classifications)) if (item.count === undefined) throw new Error('Strategy count missing');
            if (!entry.classification_summary) throw new Error(`Manifest summary missing: ${entry.file}`);
          }
          console.log(`Verified ${entries.length} snapshot entry(s) for ${date}`);
          NODE
      - name: Commit snapshot and enriched live prediction summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_predictions data_prediction_analysis/strategy-snapshots
          if git diff --cached --quiet; then
            echo 'No tag or strategy snapshot changes'
            exit 0
          fi
          git commit -m "data: apply versioned tag and strategy snapshot ${TARGET_DATE}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

  deploy_pages:
    name: Deploy enriched prediction data to Pages
    needs: apply
    if: github.event_name != 'pull_request' && needs.apply.result == 'success'
    uses: ./.github/workflows/deploy-pages.yml
