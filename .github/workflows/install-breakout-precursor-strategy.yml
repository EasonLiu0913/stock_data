name: "[90 一次性安裝] Install Breakout Precursor Strategy"

on:
  push:
    branches: [main]
    paths:
      - 'scripts/install_breakout_precursor_strategy.js'
      - '.github/workflows/install-breakout-precursor-strategy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-breakout-precursor-strategy
  cancel-in-progress: false

jobs:
  install-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install strategy into dashboard generator
        run: node scripts/install_breakout_precursor_strategy.js
      - name: Rebuild latest dashboard summaries
        run: node scripts/generate_prediction_dashboard_data.js
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scripts/generate_prediction_dashboard_data.js data_predictions/
          if git diff --staged --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add three-day breakout precursor strategy group'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

# Triggered after workflow registration so the first build runs on main.
