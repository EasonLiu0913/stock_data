name: "[Research] M9 Stage1 TTS403 Offline Diagnostic"
on:
  push:
    branches:
      - research/m9-controlled-private-preview-20261012
    paths:
      - scripts/verify_m9_stage1_tts403_offline.py
      - data_research/m5/m9/stage1/M9-STAGE1-TTS-403-ISOLATED-DIAGNOSTIC-v1.json
      - .github/workflows/research-m9-stage1-tts403-offline.yml
permissions:
  contents: read
jobs:
  static-offline:
    if: github.ref == 'refs/heads/research/m9-controlled-private-preview-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate saved 403 evidence, original script locks and twenty offline negatives
        run: python -I scripts/verify_m9_stage1_tts403_offline.py
