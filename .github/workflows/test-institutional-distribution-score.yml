name: "[07 研究] Institutional Distribution Score Replay"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_institutional_distribution_score.js'
      - 'tests/institutional_distribution_score.test.js'
      - 'data_tdcc_shareholding/history/2449/**'
      - 'data_research/institutional-flow/tdcc-fixtures/**'
      - 'data_research/institutional-flow/histock/2449/daily/**'
      - '.github/workflows/test-institutional-distribution-score.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate script syntax
        run: node --check scripts/build_institutional_distribution_score.js

      - name: Run 2449 replay regression tests
        run: node --test tests/institutional_distribution_score.test.js

      - name: Build official historical replay artifact
        run: |
          node scripts/build_institutional_distribution_score.js \
            --stock 2449 \
            --start 2026-04-01 \
            --end 2026-07-31 \
            --tdcc-mode historical \
            --output /tmp/2449-institutional-distribution-score-historical.json

      - name: Build fixture comparison artifact
        run: |
          node scripts/build_institutional_distribution_score.js \
            --stock 2449 \
            --start 2026-04-01 \
            --end 2026-07-31 \
            --tdcc-mode fixture \
            --output /tmp/2449-institutional-distribution-score-fixture.json

      - name: Summary
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const historical = JSON.parse(fs.readFileSync('/tmp/2449-institutional-distribution-score-historical.json', 'utf8'));
          const fixture = JSON.parse(fs.readFileSync('/tmp/2449-institutional-distribution-score-fixture.json', 'utf8'));
          const dates = ['2026-04-17', '2026-04-24', '2026-05-08', '2026-05-15'];
          const histByDate = new Map(historical.timeline.map(x => [x.observed_date, x]));
          const fixtureByDate = new Map(fixture.timeline.map(x => [x.observed_date, x]));

          console.log('## Institutional Distribution Replay');
          console.log('');
          console.log('- Primary TDCC input: official historical query data.');
          console.log(`- Primary mode: ${historical.tdcc_input.mode}`);
          console.log(`- Primary production-safe: ${historical.production_safe}`);
          console.log('- Historical action timing: unavailable by design; no original publication timestamp is inferred.');
          console.log('- Fixture is retained only as a regression comparison.');
          console.log('');
          console.log('| Evidence date | Historical score | Historical raw | Historical carried | Fixture score | Fixture carried |');
          console.log('|---|---:|---|---|---:|---|');
          for (const d of dates) {
            const h = histByDate.get(d);
            const f = fixtureByDate.get(d);
            if (h || f) {
              console.log(`| ${d} | ${h?.score ?? '-'} | ${h?.raw_level ?? '-'} | ${h?.level ?? '-'} | ${f?.score ?? '-'} | ${f?.level ?? '-'} |`);
            }
          }
          console.log('');
          console.log('> Research-only historical validation. Official TDCC historical values are used for evidence replay, but original publication timestamps are unknown, so no historical trade-action time is claimed.');
          NODE

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
