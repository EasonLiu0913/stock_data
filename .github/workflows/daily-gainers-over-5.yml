name: "[05 清單] 每日漲幅 5% 以上股票"

on:
  schedule:
    # 參考 [01 台股資料] Crawl SMA Data 13:32，延後 20 分鐘。
    - cron: '52 5 * * *'
    # 參考 [01 台股資料] Crawl SMA Data 14:27，延後 20 分鐘。
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '指定單一交易日 YYYYMMDD；留空使用最新 SMA 日期'
        required: false
        default: ''
      dates:
        description: '可選：逗號分隔多個交易日，例如 20260810,20260811；設定後優先於 date'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily-gainers-over-5.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-gainers-over-5
  cancel-in-progress: false

jobs:
  generate:
    name: 產生每日漲幅 5% 以上清單
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.generate.outputs.target_date }}
      stock_count: ${{ steps.generate.outputs.stock_count }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync to latest main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate generator
        run: |
          node --check scripts/generate_daily_gainers_over_5.js
          node scripts/generate_daily_gainers_over_5.js --self-test

      - name: Generate daily list
        id: generate
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_DATES: ${{ github.event.inputs.dates }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          dates_raw="${INPUT_DATES:-}"
          if [ -z "$dates_raw" ] && [[ "${COMMIT_MESSAGE:-}" == *"[backfill-daily-gainers-20260810-20260814]"* ]]; then
            dates_raw="20260810,20260811,20260812,20260813,20260814"
          fi

          total_count=0
          last_date=""
          if [ -n "$dates_raw" ]; then
            IFS=',' read -ra requested_dates <<< "$dates_raw"
            echo "## 每日漲幅 5% 以上股票－區間回填" >> "$GITHUB_STEP_SUMMARY"
            for target_date in "${requested_dates[@]}"; do
              target_date="$(echo "$target_date" | xargs)"
              [ -n "$target_date" ] || continue
              result=$(node scripts/generate_daily_gainers_over_5.js --date "$target_date")
              echo "$result"
              stock_count=$(node -e 'const p=JSON.parse(process.argv[1]);process.stdout.write(String(p.stock_count))' "$result")
              total_count=$((total_count + stock_count))
              last_date="$target_date"
              echo "- $target_date：$stock_count 檔" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            args=()
            if [ -n "${INPUT_DATE:-}" ]; then
              args+=(--date "$INPUT_DATE")
            fi
            result=$(node scripts/generate_daily_gainers_over_5.js "${args[@]}")
            echo "$result"
            last_date=$(node -e 'const p=JSON.parse(process.argv[1]);process.stdout.write(p.target_date)' "$result")
            total_count=$(node -e 'const p=JSON.parse(process.argv[1]);process.stdout.write(String(p.stock_count))' "$result")
            echo "## 每日漲幅 5% 以上股票" >> "$GITHUB_STEP_SUMMARY"
            echo "- 交易日：$last_date" >> "$GITHUB_STEP_SUMMARY"
            echo "- 符合檔數：$total_count" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "target_date=$last_date" >> "$GITHUB_OUTPUT"
          echo "stock_count=$total_count" >> "$GITHUB_OUTPUT"
          echo "- 條件：收盤價相對前一個 SMA 交易日收盤價漲幅 ≥ 5%" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit generated list
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_daily_gain_over_5/
          if git diff --cached --quiet; then
            echo "No daily-gainers changes"
            exit 0
          fi
          git commit -m "data: update daily gainers over 5% ${{ steps.generate.outputs.target_date }}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

  deploy:
    name: 發布每日漲幅清單到 GitHub Pages
    needs: generate
    if: needs.generate.result == 'success'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      target_date: ${{ needs.generate.outputs.target_date }}
