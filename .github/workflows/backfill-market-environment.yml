name: "[06 回填修復] Backfill Market Environment"

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始預測交易日 YYYYMMDD'
        required: true
        type: string
      end_date:
        description: '結束預測交易日 YYYYMMDD'
        required: true
        type: string
      dry_run:
        description: '只顯示判定，不寫檔'
        required: false
        type: boolean
        default: true
      force:
        description: '覆蓋既有事前環境快照'
        required: false
        type: boolean
        default: false
      generate_actual:
        description: '已有覆盤資料時建立實際環境與正式策略覆盤'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: backfill-market-environment
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Plan trading-date gaps and upstream requirements
        id: plan
        shell: bash
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          FORCE: ${{ inputs.force }}
          GENERATE_ACTUAL: ${{ inputs.generate_actual }}
        run: |
          set -euo pipefail
          node scripts/plan_market_environment_recovery.js "$START_DATE" "$END_DATE" "$FORCE" "$GENERATE_ACTUAL" > "$RUNNER_TEMP/market-environment-plan.json"
          node - "$RUNNER_TEMP/market-environment-plan.json" <<'NODE'
          const p=require(process.argv[2]);
          const rows=p.items;
          const missingForecast=rows.filter(x=>x.forecast.status!=='present').map(x=>x.forecast_date);
          const missingActual=rows.filter(x=>x.actual!=='present').map(x=>x.forecast_date);
          const blocked=rows.filter(x=>x.blocked).map(x=>x.forecast_date);
          const lines=['## [06] Market environment historical gap inventory',
            '- Requested: '+p.range.start+' ~ '+p.range.end,
            '- Trading dates: '+p.selected_trading_dates,
            '- Missing or invalid forecasts ('+missingForecast.length+'): '+(missingForecast.join(', ')||'none'),
            '- Missing actuals ('+missingActual.length+'): '+(missingActual.join(', ')||'none'),
            '- Blocked dates ('+blocked.length+'): '+(blocked.join(', ')||'none'),
            '- Independent upstream recoveries needed: '+p.recoveries.length,
            '- Historical reconstruction is NOT a verified live pre-market snapshot'];
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          console.log(lines.join('\n'));
          NODE

      - name: Run market environment and formal strategy tests
        run: |
          node --check scripts/plan_market_environment_recovery.js
          node --check scripts/backfill_prediction_dashboard_fields.js
          node --test \
            tests/market_environment.test.js \
            tests/formal_strategy_replay.test.js \
            tests/prediction_dashboard_backfill.test.js \
            tests/formal_market_strategy_tags.test.js \
            tests/prediction_dashboard_group_sync.test.js

      - name: Upload historical gap inventory
        if: always() && steps.plan.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: market-environment-gaps-${{ github.run_id }}
          path: ${{ runner.temp }}/market-environment-plan.json
          retention-days: 14

      - name: Request date-scoped upstream recovery without waiting
        if: inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/market-environment-plan.json" > "$RUNNER_TEMP/market-environment-recoveries.tsv" <<'NODE'
          const plan=require(process.argv[2]);
          for(const r of plan.recoveries) console.log([r.dataset,r.date].join('\t'));
          NODE
          count=0
          failed=0
          while IFS=$'\t' read -r dataset date; do
            [ -n "$dataset" ] || continue
            # Bound fan-out per manual backfill. Remaining gaps stay in the plan.
            if [ "$count" -ge 12 ]; then
              echo "- Recovery queued for later invocation: $dataset $date" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            case "$dataset" in
              sma)
                workflow="backfill-fubon-sma-range.yml"
                args=(-f "start_date=$date" -f "end_date=$date" -f stock_batch_size=100 -f minimum_records=900)
                ;;
              twse)
                workflow="crawl-twse-mi-index.yml"
                args=(-f "date=$date" -f type=ALL)
                ;;
              futures)
                workflow="crawl-taifex-major-institutional-traders-futures-contracts.yml"
                args=(-f "date=$date")
                ;;
              external)
                workflow="crawl-external-market-indicators.yml"
                args=(-f "date=$date")
                ;;
              *)
                echo "::error::Unsupported recovery dataset $dataset"
                failed=$((failed+1))
                continue
                ;;
            esac
            count=$((count+1))
            if gh workflow run "$workflow" --ref main "${args[@]}"; then
              echo "- Requested recovery: $dataset date=$date workflow=$workflow" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Failed to dispatch $workflow for $date"
              echo "- FAILED recovery request: $dataset date=$date workflow=$workflow" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed+1))
            fi
          done < "$RUNNER_TEMP/market-environment-recoveries.tsv"
          echo "dispatch_failed=$failed" >> "$GITHUB_ENV"
          echo "Date-scoped repair dispatches requested: $count; dispatch errors: $failed"

      - name: Build only ready missing dates and record per-date outcomes
        if: inputs.dry_run != true
        id: build
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/market-environment-plan.json" > "$RUNNER_TEMP/market-environment-work.tsv" <<'NODE'
          const p=require(process.argv[2]);
          for(const x of p.items)console.log([x.forecast_date,x.base_date,x.build_forecast?'1':'0',x.build_actual?'1':'0'].join('\t'));
          NODE
          failures=0
          successes=0
          while IFS=$'\t' read -r date base make_forecast make_actual; do
            [ -n "$date" ] || continue
            if [ "$make_forecast" = 1 ]; then
              # Strictly chain each command: a failed generator must never be
              # hidden by a later successful command inside an if block.
              if node scripts/generate_market_environment.js --forecast-date "$date" --base-date "$base" --force --strict \
                && node scripts/reconstruct_historical_market_environment.js --forecast-date "$date" --base-date "$base" \
                && node -e '
                  const [date,base]=process.argv.slice(1);
                  const {snapshotStatus}=require("./scripts/plan_market_environment_recovery");
                  const snapshot=snapshotStatus(date,base);
                  if(snapshot.status!=="present")throw Error("Historical snapshot failed integrity/date/hash: "+JSON.stringify(snapshot));
                  console.log(JSON.stringify({date,valid:true,historical:!!snapshot.historical_reconstruction}));
                ' "$date" "$base" \
                && node scripts/backfill_prediction_dashboard_fields.js --date "$date"; then
                successes=$((successes+1))
                echo "- Forecast rebuilt: $date" >> "$GITHUB_STEP_SUMMARY"
              else
                failures=$((failures+1))
                echo "- Forecast FAILED: $date" >> "$GITHUB_STEP_SUMMARY"
                # Do not commit a partial or invalid snapshot for this date.
                git restore --worktree -- "data_market_environment/$date" 2>/dev/null || true
                git clean -fd -- "data_market_environment/$date" >/dev/null
                git restore --worktree -- "data_predictions/$date" 2>/dev/null || true
                node -e 'require("./scripts/market_environment_lib").refreshEnvironmentIndexes()'
                continue
              fi
            fi
            if [ "$make_actual" = 1 ]; then
              if node scripts/generate_actual_market_environment.js --date "$date" \
                && node scripts/evaluate_formal_strategy_replay.js --date "$date"; then
                successes=$((successes+1))
                echo "- Actual rebuilt: $date" >> "$GITHUB_STEP_SUMMARY"
              else
                failures=$((failures+1))
                echo "- Actual FAILED: $date" >> "$GITHUB_STEP_SUMMARY"
                git restore --worktree -- "data_market_environment/$date/actual_market_environment.json" 2>/dev/null || true
                git clean -fd -- "data_market_environment/$date/actual_market_environment.json" >/dev/null
                git restore --worktree -- "data_predictions/$date/replay-summary.json" 2>/dev/null || true
                node -e 'require("./scripts/market_environment_lib").refreshEnvironmentIndexes()'
              fi
            fi
          done < "$RUNNER_TEMP/market-environment-work.tsv"
          echo "build_failed=$failures" >> "$GITHUB_ENV"
          echo "build_successful=$successes" >> "$GITHUB_ENV"
          echo "Date-scoped builds: $successes succeeded, $failures failed"

      - name: Rebuild environment-segmented relative leadership analysis
        if: inputs.dry_run != true
        run: node scripts/analyze_relative_leadership_by_environment.js --max-dates 30

      - name: Install market environment banner
        if: inputs.dry_run != true
        run: node scripts/install_market_environment_ui.js

      - name: Commit and push backfill
        if: inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data_market_environment \
            data_prediction_analysis/relative-leadership/environment \
            data_prediction_analysis/formal-strategy \
            data_prediction_analysis/oversold-beta-rebound \
            data_predictions/*/summary.json \
            data_predictions/*/industry-summary.json \
            data_predictions/*/group-summary.json \
            data_predictions/*/replay-summary.json \
            data_predictions/*/replay-dashboard.json \
            public/prediction-dashboard.html
          if git diff --cached --quiet; then echo "No backfill changes"; exit 0; fi
          git commit -m "analysis: backfill market environment ${{ inputs.start_date }}-${{ inputs.end_date }}"
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

      - name: Enforce incomplete-history backfill gate
        if: always() && inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/market-environment-plan.json" <<'NODE'
          const p=require(process.argv[2]);
          const errors=p.items.filter(x=>x.blocked).map(x=>x.forecast_date);
          if(errors.length){
            console.error('BLOCKED historical dates (upstream source/replay/invalid existing):',errors.join(','));
            process.exitCode=1;
          }
          NODE
          if [ "${build_failed:-0}" != 0 ] || [ "${dispatch_failed:-0}" != 0 ]; then
            echo "::error::Date-scoped build/dispatch failures: build=${build_failed:-0} dispatch=${dispatch_failed:-0}"
            exit 1
          fi

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository for schedule summary
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js

