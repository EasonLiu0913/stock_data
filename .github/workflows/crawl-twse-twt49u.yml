name: "[01 台股資料] Crawl TWSE TWT49U（除權除息計算結果表）"

on:
  workflow_dispatch:
    inputs:
      date:
        description: '指定資料日期（YYYYMMDD）；留空時自動抓取下一個交易日'
        required: false
        default: ''
        type: string
      force:
        description: '既有檔案不同時，確認以證交所新資料覆寫（非空改空仍會拒絕）'
        required: false
        default: false
        type: boolean
  schedule:
    # 16:30 Asia/Taipei every day; non-trading days are skipped below.
    - cron: '30 8 * * *'

permissions:
  contents: write

concurrency:
  group: crawl-twse-twt49u
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TWT49U safety tests
        run: node --test tests/crawl_twse_twt49u.test.js

      - name: Resolve requested date
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.date || '' }}
          FORCE_RUN: ${{ inputs.force || false }}
        run: |
          echo "force=$FORCE_RUN" >> "$GITHUB_OUTPUT"

          if [ -n "$INPUT_DATE" ]; then
            if ! [[ "$INPUT_DATE" =~ ^20[0-9]{6}$ ]]; then
              echo "Invalid date: $INPUT_DATE (expected YYYYMMDD)"
              exit 1
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
            echo "Manual run will crawl the explicitly requested date: $INPUT_DATE (force=$FORCE_RUN)"
            exit 0
          fi

          taipei_today=$(TZ=Asia/Taipei date +%F)
          if ! node -e '
            const { isTradingDate, loadHolidaySet } = require("./scripts/resolve_forecast_dates");
            process.exit(isTradingDate(process.argv[1], loadHolidaySet()) ? 0 : 1);
          ' "$taipei_today"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "date=" >> "$GITHUB_OUTPUT"
            echo "Skip: $taipei_today is a weekend or configured non-trading day."
            exit 0
          fi

          target_date=$(node -e '
            const { loadHolidaySet, nextTradingDate } = require("./scripts/resolve_forecast_dates");
            process.stdout.write(nextTradingDate(process.argv[1], loadHolidaySet(), false).replaceAll("-", ""));
          ' "$taipei_today")

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "date=$target_date" >> "$GITHUB_OUTPUT"
          echo "Trading day $taipei_today: crawl next trading date $target_date (force=$FORCE_RUN)."

      - name: Crawl TWSE TWT49U
        if: steps.date.outputs.run == 'true'
        shell: bash
        env:
          TARGET_DATE: ${{ steps.date.outputs.date }}
          FORCE_RUN: ${{ steps.date.outputs.force }}
        run: |
          args=(--date "$TARGET_DATE")
          if [ "$FORCE_RUN" = "true" ]; then
            args+=(--force)
          fi
          npm run crawl:twse-twt49u -- "${args[@]}"

      - name: Commit TWT49U data
        if: steps.date.outputs.run == 'true'
        shell: bash
        env:
          TARGET_DATE: ${{ steps.date.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data_twse_twt49u
          if git diff --cached --quiet; then
            echo "No TWT49U changes for $TARGET_DATE"
            exit 0
          fi

          git commit -m "chore: update TWSE TWT49U data $TARGET_DATE"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "TWT49U push failed; retry $attempt/5"
            sleep 5
          done

          echo "TWT49U push failed after 5 attempts"
          exit 1
