name: '[07 研究] FinMind－季財報品質 backlog physical-batch wave'

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: 'YYYY-MM-DD；留空使用 Asia/Taipei 執行日'
        required: false
        type: string
      physical_batch_size:
        description: '每個 fresh runner 的股票數；backlog wave 預設 3，禁止大於 3'
        required: true
        type: number
        default: 3
      max_physical_batches:
        description: '本 wave 最多 physical batches；預設 16，禁止大於 16'
        required: true
        type: number
        default: 16

permissions:
  contents: write

concurrency:
  group: finmind-quarterly-financial-quality-continuous
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      as_of_date: ${{ steps.date.outputs.as_of_date }}
      wave_id: ${{ steps.date.outputs.wave_id }}
      due_count: ${{ steps.plan.outputs.due_count }}
      selected_count: ${{ steps.plan.outputs.selected_count }}
      total_batches: ${{ steps.plan.outputs.total_batches }}
      matrix: ${{ steps.plan.outputs.matrix }}
      stock_ids: ${{ steps.plan.outputs.stock_ids }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve bounded backlog wave inputs
        id: date
        env:
          INPUT_AS_OF_DATE: ${{ inputs.as_of_date }}
          INPUT_BATCH_SIZE: ${{ inputs.physical_batch_size }}
          INPUT_MAX_BATCHES: ${{ inputs.max_physical_batches }}
        run: |
          set -euo pipefail
          as_of_date="${INPUT_AS_OF_DATE:-}"
          if [ -z "$as_of_date" ]; then
            as_of_date="$(TZ=Asia/Taipei date +%F)"
          fi
          batch_size="${INPUT_BATCH_SIZE:-3}"
          max_batches="${INPUT_MAX_BATCHES:-16}"
          if [ "$batch_size" -lt 1 ] || [ "$batch_size" -gt 3 ]; then
            echo "physical_batch_size must be 1..3 for this backlog wave" >&2
            exit 1
          fi
          if [ "$max_batches" -lt 1 ] || [ "$max_batches" -gt 16 ]; then
            echo "max_physical_batches must be 1..16 for this backlog wave" >&2
            exit 1
          fi
          wave_id="run-${GITHUB_RUN_ID}"
          echo "as_of_date=$as_of_date" >> "$GITHUB_OUTPUT"
          echo "wave_id=$wave_id" >> "$GITHUB_OUTPUT"
          echo "batch_size=$batch_size" >> "$GITHUB_OUTPUT"
          echo "max_batches=$max_batches" >> "$GITHUB_OUTPUT"

      - name: Validate deterministic FinMind regressions
        run: |
          set -euo pipefail
          node --check scripts/backfill_finmind_quarterly_financial_quality_batch.js
          node --check scripts/verify_financial_quality_master_propagation.js
          node --test tests/finmind_quarterly_freshness.test.js
          node --test tests/financial_quality_master_propagation.test.js
          node --test tests/fundamental_quality_8021_regression.test.js

      - name: Build deterministic physical-batch wave
        id: plan
        env:
          AS_OF_DATE: ${{ steps.date.outputs.as_of_date }}
          BATCH_SIZE: ${{ steps.date.outputs.batch_size }}
          MAX_BATCHES: ${{ steps.date.outputs.max_batches }}
        run: |
          set -euo pipefail
          node scripts/backfill_finmind_quarterly_financial_quality_batch.js \
            --plan-due true \
            --plan-physical-batches true \
            --due-only true \
            --start-quarter 2023Q1 \
            --end-quarter 2026Q2 \
            --as-of-date "$AS_OF_DATE" \
            --physical-batch-size "$BATCH_SIZE" \
            --max-physical-batches "$MAX_BATCHES" \
            --max-due-stocks 48

      - name: Summarize backlog wave plan
        env:
          AS_OF_DATE: ${{ steps.date.outputs.as_of_date }}
          DUE_COUNT: ${{ steps.plan.outputs.due_count }}
          SELECTED_COUNT: ${{ steps.plan.outputs.selected_count }}
          TOTAL_BATCHES: ${{ steps.plan.outputs.total_batches }}
          STOCK_IDS: ${{ steps.plan.outputs.stock_ids }}
        run: |
          {
            echo "## FinMind backlog physical-batch wave"
            echo "- as_of_date: $AS_OF_DATE"
            echo "- due candidates: $DUE_COUNT"
            echo "- selected stocks: $SELECTED_COUNT"
            echo "- physical batches: $TOTAL_BATCHES"
            echo "- stock_ids: ${STOCK_IDS:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  refresh-batch:
    needs: plan
    if: needs.plan.outputs.selected_count != '0'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest main on fresh physical-batch runner
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Randomized physical-batch cooldown
        id: cooldown
        run: |
          set -euo pipefail
          seconds=$((3 + RANDOM % 6))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "[physical-batch cooldown] ${seconds}s"
          sleep "$seconds"

      - name: Quota preflight for actual batch request count
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
          REQUEST_COUNT: ${{ matrix.request_count }}
        run: |
          set -euo pipefail
          if [ -z "${FINMIND_API_TOKEN:-}" ]; then
            echo 'FINMIND_API_TOKEN is missing.' >&2
            exit 1
          fi
          node scripts/check_finmind_api_quota.js \
            --configured-cap 500 \
            --reserve-requests 20 \
            --required-requests "$REQUEST_COUNT" \
            --poll-seconds 60 \
            --max-wait-minutes 90 \
            --wait true

      - name: Refresh this physical batch only
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
          STOCK_IDS: ${{ matrix.stock_ids_csv }}
          AS_OF_DATE: ${{ needs.plan.outputs.as_of_date }}
          WAVE_ID: ${{ needs.plan.outputs.wave_id }}
          BATCH_INDEX: ${{ matrix.batch_index }}
        run: |
          set -euo pipefail
          node scripts/backfill_finmind_quarterly_financial_quality_batch.js \
            --due-only true \
            --stock-ids "$STOCK_IDS" \
            --start-quarter 2023Q1 \
            --end-quarter 2026Q2 \
            --as-of-date "$AS_OF_DATE" \
            --wave-id "$WAVE_ID" \
            --batch-size 3 \
            --batch-index "$BATCH_INDEX" \
            --max-due-stocks 48 \
            --delay-ms 1000 \
            --jitter-ms 2000

      - name: Checkpoint entire physical batch safely
        env:
          STOCK_IDS: ${{ matrix.stock_ids_csv }}
          AS_OF_DATE: ${{ needs.plan.outputs.as_of_date }}
          WAVE_ID: ${{ needs.plan.outputs.wave_id }}
          BATCH_INDEX: ${{ matrix.batch_index }}
          COOLDOWN_SECONDS: ${{ steps.cooldown.outputs.seconds }}
          REQUEST_COUNT: ${{ matrix.request_count }}
        run: |
          set -euo pipefail
          batch_pad="$(printf '%03d' "$BATCH_INDEX")"
          status_file="data_prediction_analysis/quarterly-financial-quality/batch-status/due-refresh-${AS_OF_DATE}-wave-${WAVE_ID}-batch${batch_pad}.json"
          if [ ! -s "$status_file" ]; then
            echo "Missing physical batch status: $status_file" >&2
            exit 1
          fi

          node - "$status_file" "$COOLDOWN_SECONDS" "$REQUEST_COUNT" <<'NODE'
          const fs = require('fs');
          const [file, cooldown, requests] = process.argv.slice(2);
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          data.physical_batch = {
            batch_start_cooldown_seconds: Number(cooldown),
            request_count: Number(requests),
            inter_request_delay_ms: 1000,
            inter_request_jitter_ms: 2000,
          };
          const terminal = new Set(['complete', 'skipped_complete', 'unsupported_financial_model']);
          const invalid = (data.results || []).filter(row => !terminal.has(row.status));
          if (invalid.length) {
            throw new Error(`Physical batch contains non-terminal results: ${invalid.map(row => `${row.stock_id}:${row.status}`).join(',')}`);
          }
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          NODE

          tmp="$(mktemp -d)"
          mkdir -p "$tmp/stocks"
          IFS=',' read -ra ids <<< "$STOCK_IDS"
          for stock_id in "${ids[@]}"; do
            cp -a "data_finmind_quarterly_financial_quality/$stock_id" "$tmp/stocks/$stock_id"
          done
          cp "$status_file" "$tmp/status.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for stock_id in "${ids[@]}"; do
              rm -rf "data_finmind_quarterly_financial_quality/$stock_id"
              mkdir -p "data_finmind_quarterly_financial_quality"
              cp -a "$tmp/stocks/$stock_id" "data_finmind_quarterly_financial_quality/$stock_id"
            done
            mkdir -p "$(dirname "$status_file")"
            cp "$tmp/status.json" "$status_file"

            git add "$status_file"
            for stock_id in "${ids[@]}"; do
              git add "data_finmind_quarterly_financial_quality/$stock_id"
            done

            if git diff --cached --quiet; then
              echo "[checkpoint] physical batch $BATCH_INDEX already durable on main"
              exit 0
            fi

            git commit -m "data: refresh FinMind ${WAVE_ID} physical batch ${AS_OF_DATE} #${BATCH_INDEX}"
            if git push origin HEAD:main; then
              echo "[checkpoint] physical batch $BATCH_INDEX pushed"
              exit 0
            fi
            git reset --hard "HEAD^"
            sleep $((attempt * 5))
          done

          echo "Unable to checkpoint physical batch $BATCH_INDEX after push races" >&2
          exit 1

  rebuild-master:
    needs: [plan, refresh-batch]
    if: needs.plan.outputs.selected_count != '0' && needs.refresh-batch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main after backlog wave wave
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Rebuild and verify canonical master
        env:
          STOCK_IDS: ${{ needs.plan.outputs.stock_ids }}
        run: |
          set -euo pipefail
          node scripts/build_financial_quality_master.js
          node scripts/verify_financial_quality_master_propagation.js --stock-ids "$STOCK_IDS" --allow-unsupported true

      - name: Commit master with latest-main retry
        env:
          STOCK_IDS: ${{ needs.plan.outputs.stock_ids }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/build_financial_quality_master.js
            node scripts/verify_financial_quality_master_propagation.js --stock-ids "$STOCK_IDS" --allow-unsupported true
            git add data_prediction_analysis/quarterly-financial-quality/financial-quality-master.json

            if git diff --cached --quiet; then
              echo "[master] already current on main"
              break
            fi

            git commit -m "data: rebuild FinMind backlog backlog wave master"
            if git push origin HEAD:main; then
              echo "[master] pushed"
              break
            fi
            git reset --hard "HEAD^"
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to push rebuilt master" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Verify durable remote propagation
        env:
          STOCK_IDS: ${{ needs.plan.outputs.stock_ids }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          node scripts/verify_financial_quality_master_propagation.js --stock-ids "$STOCK_IDS" --allow-unsupported true

  replan:
    needs: [plan, rebuild-master]
    if: needs.plan.outputs.selected_count != '0' && needs.rebuild-master.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout newly committed main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Re-plan from durable remote state only
        id: post
        env:
          AS_OF_DATE: ${{ needs.plan.outputs.as_of_date }}
        run: |
          set -euo pipefail
          node scripts/backfill_finmind_quarterly_financial_quality_batch.js \
            --plan-due true \
            --plan-physical-batches true \
            --due-only true \
            --start-quarter 2023Q1 \
            --end-quarter 2026Q2 \
            --as-of-date "$AS_OF_DATE" \
            --physical-batch-size 3 \
            --max-physical-batches 16 \
            --max-due-stocks 48

      - name: Summarize post-backlog wave remaining backlog
        env:
          BEFORE: ${{ needs.plan.outputs.due_count }}
          AFTER: ${{ steps.post.outputs.due_count }}
        run: |
          {
            echo "## Post-backlog wave re-plan"
            echo "- due before backlog wave: $BEFORE"
            echo "- due after committed backlog wave: $AFTER"
            echo "- no second wave executed"
          } >> "$GITHUB_STEP_SUMMARY"

  no-op:
    needs: plan
    if: needs.plan.outputs.selected_count == '0'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No due FinMind backlog work; no API quota consumed."

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for schedule summary
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js
