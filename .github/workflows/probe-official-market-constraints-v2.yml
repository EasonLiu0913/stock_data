name: Probe Official Market Constraints V2

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/official_market_constraints.js
      - scripts/taifex_night_futures.js
      - scripts/taifex_source_diagnostics.js
      - tests/official_market_constraints.test.js
      - tests/taifex_night_futures.test.js
      - .github/workflows/probe-official-market-constraints-v2.yml
  workflow_dispatch:
    inputs:
      target_date:
        description: 'TAIFEX 歸屬日 / 預測日 YYYYMMDD'
        required: true
        default: '20260731'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/official-disposition-night-data-v1
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/official_market_constraints.js
            scripts/taifex_night_futures.js
            scripts/taifex_source_diagnostics.js
            tests/official_market_constraints.test.js
            tests/taifex_night_futures.test.js

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run parser tests
        run: |
          node --check scripts/official_market_constraints.js
          node --check scripts/taifex_night_futures.js
          node --check scripts/taifex_source_diagnostics.js
          node --test tests/official_market_constraints.test.js tests/taifex_night_futures.test.js

      - name: Fetch official source snapshots
        env:
          TARGET_DATE: ${{ inputs.target_date || '20260731' }}
        run: |
          mkdir -p data_market_constraints/$TARGET_DATE
          node scripts/official_market_constraints.js --date "$TARGET_DATE" --allow-partial --output "data_market_constraints/$TARGET_DATE/source-probe.json"
          node scripts/taifex_source_diagnostics.js --output "data_market_constraints/$TARGET_DATE/taifex-diagnostics.json"
          node scripts/taifex_night_futures.js --date "$TARGET_DATE" --output "data_market_constraints/$TARGET_DATE/night-futures.json" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-market-constraints-v2-${{ inputs.target_date || '20260731' }}
          path: data_market_constraints/${{ inputs.target_date || '20260731' }}/
          if-no-files-found: error
