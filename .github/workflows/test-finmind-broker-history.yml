name: "[07 研究] Test FinMind Broker History"

on:
  workflow_dispatch:
    inputs:
      stock:
        description: "Stock code"
        required: true
        default: "2449"
        type: string
      date:
        description: "Historical trading date (YYYY-MM-DD)"
        required: true
        default: "2026-05-15"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.stock }}" =~ ^[0-9A-Za-z]{4,6}$ ]] || { echo "Invalid stock code"; exit 1; }
          [[ "${{ inputs.date }}" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Invalid date"; exit 1; }

      - name: Verify FinMind repository secret
        shell: bash
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FINMIND_API_TOKEN:-}" ]; then
            echo "FINMIND_API_TOKEN is not available as a Repository secret." >&2
            exit 1
          fi
          echo "FINMIND_API_TOKEN repository secret is available."

      - name: Probe FinMind historical broker data
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/test_finmind_broker_history.js \
            --stock "${{ inputs.stock }}" \
            --date "${{ inputs.date }}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## FinMind broker-history probe"
            echo "- Stock: \`${{ inputs.stock }}\`"
            echo "- Date: \`${{ inputs.date }}\`"
            echo "- Secret source: Repository secret \`FINMIND_API_TOKEN\`"
            echo "- This workflow only reads API data; it does not commit or overwrite repository datasets."
          } >> "$GITHUB_STEP_SUMMARY"

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for schedule summary
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Write schedule timing summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js

