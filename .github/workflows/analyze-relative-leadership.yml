name: Analyze Relative Leadership Rules

on:
  push:
    branches:
      - main
    paths:
      - scripts/analyze_relative_leadership_rules.js
      - scripts/analyze_relative_leadership_common.js
      - .github/workflows/analyze-relative-leadership.yml
  workflow_dispatch:
    inputs:
      date:
        description: 'Discovery replay date (YYYYMMDD). Leave empty for latest completed replay.'
        required: false
        default: ''
      max_dates:
        description: 'Maximum completed replay dates to use (2-30).'
        required: false
        default: '30'

permissions:
  contents: write

concurrency:
  group: analyze-relative-leadership-rules
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Analyze relative leadership rules
        shell: bash
        run: |
          # Keep the best candidates at each depth instead of evaluating every combination.
          sed -i 's/slice(0,160)/slice(0,40)/; s/k===2?1000:k===3?700:400/k===2?120:k===3?80:40/' scripts/analyze_relative_leadership_common.js
          args=(--max-dates "${{ inputs.max_dates || '30' }}")
          if [ -n "${{ inputs.date }}" ]; then
            args+=(--date "${{ inputs.date }}")
          fi
          node scripts/analyze_relative_leadership_common.js "${args[@]}"

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: relative-leadership-analysis-${{ github.run_id }}
          path: data_prediction_analysis/relative-leadership/
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push analysis
        shell: bash
        run: |
          git checkout -- scripts/analyze_relative_leadership_common.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_prediction_analysis/relative-leadership/

          if git diff --staged --quiet; then
            echo "No analysis changes"
            exit 0
          fi

          analysis_date=$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('data_prediction_analysis/relative-leadership/manifest.json'));process.stdout.write(m.latest_date)")
          git commit -m "analysis: relative leadership rules ${analysis_date}"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed, retry ${attempt}/5..."
            sleep 5
          done

          echo "Failed to push analysis after 5 attempts. Artifact is still available."
          exit 1
