name: "[Research M8VIS] Visual Polish Safe CI"
on:
  push:
    branches:
      - research/m8vis-v2-visual-polish-20261014
    paths:
      - '.github/workflows/research-m8vis-visual-polish.yml'
      - 'scripts/daily_gainers_caption_segments.py'
      - 'scripts/build_daily_gainers_v2_slides.js'
      - 'tests/test_daily_gainers_caption_segments.py'
      - 'tests/m8vis_four_card_layout.test.js'
      - 'tests/daily_gainers_text_variants.test.js'
      - 'tests/daily_gainers_v2_full_20261008.test.js'
      - 'scripts/daily_gainers_text_variants.js'
      - 'scripts/verify_daily_gainers_v2_media_proof.js'
      - 'video_scripts/daily-gainers/v2/20261008/master.json'
permissions:
  contents: read
jobs:
  static-visual:
    if: github.ref == 'refs/heads/research/m8vis-v2-visual-polish-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Caption segmentation and four-card regression
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_daily_gainers_caption_segments.py' -v
          node tests/m8vis_four_card_layout.test.js
          node --check scripts/build_daily_gainers_v2_slides.js
      - name: Render isolated four-card visual sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/daily-gainers-video/20261008
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('data_daily_gain_over_5/20261008.json','utf8'));
          if(data.target_date!=='20261008'||data.stocks.length!==data.stock_count)throw Error('Source date/count mismatch');
          const bands=[
            data.stocks.filter(s=>s.change_pct>=5&&s.change_pct<7).length,
            data.stocks.filter(s=>s.change_pct>=7&&s.change_pct<9.5).length,
            data.stocks.filter(s=>s.change_pct>=9.5).length
          ];
          if(bands.reduce((a,b)=>a+b,0)!==data.stock_count)throw Error('Band sum mismatch');
          const points=['5%～7%：'+bands[0]+' 檔','7%～9.5%：'+bands[1]+' 檔','9.5% 以上：'+bands[2]+' 檔','強勢股總數：'+data.stock_count+' 檔'];
          fs.writeFileSync('output/daily-gainers-video/20261008/plan.json',JSON.stringify({schema_version:2,target_date:'20261008',scenes:[{id:1,title:'10/08 強勢股市場概況',subtitle:'當日上市強勢股漲幅分布',visual_summary_points:points}]}));
          console.log('M8VIS_REAL_DATA',JSON.stringify({bands,total:data.stock_count,points}));
          NODE
          node scripts/build_daily_gainers_v2_slides.js 20261008
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-noto-cjk
          rsvg-convert -w 1920 -h 1080 output/daily-gainers-video/20261008/slides/01.svg -o output/daily-gainers-video/20261008/m8vis-four-card.png
          test -s output/daily-gainers-video/20261008/m8vis-four-card.png
      - uses: actions/upload-artifact@v4
        with:
          name: m8vis-four-card-real-data
          path: |
            output/daily-gainers-video/20261008/slides/01.svg
            output/daily-gainers-video/20261008/m8vis-four-card.png
          if-no-files-found: error

  full-preview:
    needs: static-visual
    if: github.ref == 'refs/heads/research/m8vis-v2-visual-polish-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated media dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin fonts-noto-cjk
          python -m pip install --disable-pip-version-check --no-cache-dir edge-tts mutagen pypinyin
      - name: Validate immutable 10/08 V2 inputs and build nine-scene plan
        run: |
          set -euo pipefail
          node tests/daily_gainers_text_variants.test.js
          node tests/daily_gainers_v2_full_20261008.test.js
          python -m unittest discover -s tests -p 'test_daily_gainers_caption_segments.py' -v
          node scripts/build_daily_gainers_v2_preview.js 20261008
          mkdir -p output/daily-gainers-video/20261008
          cp output/daily-gainers-v2-preview/20261008/*.json output/daily-gainers-video/20261008/
          node - <<'NODE'
          const fs=require('fs');
          const p='output/daily-gainers-video/20261008/plan.json';
          const v=JSON.parse(fs.readFileSync(p));
          if(v.target_date!=='20261008'||v.scenes.length!==9||v.scenes.some(s=>!s.caption_cues?.length))throw Error('Invalid frozen preview plan');
          console.log('M8VIS_FULL_PREVIEW_PLAN_PASS scenes='+v.scenes.length);
          NODE
          node scripts/build_daily_gainers_v2_slides.js 20261008
      - name: Generate isolated narration (never upload)
        env:
          YOUTUBE_TTS_VOICE: zh-TW-YunJheNeural
          YOUTUBE_TTS_RATE: '+15%'
        run: python scripts/synthesize_daily_gainers_tts.py output/daily-gainers-video/20261008/plan.json
      - name: Generate presenter lip sync and composite complete MP4
        run: |
          set -euo pipefail
          python scripts/build_daily_gainers_lipsync.py output/daily-gainers-video/20261008/plan.json
          YOUTUBE_VTUBER_ENABLED=1 node scripts/render_daily_gainers_video.js 20261008
          python scripts/build_daily_gainers_srt.py output/daily-gainers-video/20261008/plan.json
          node scripts/verify_daily_gainers_v2_media_proof.js 20261008
          test -s output/daily-gainers-video/20261008/daily-gainers-20261008.mp4
          test -s output/daily-gainers-video/20261008/daily-gainers-20261008.zh-TW.srt
          ffprobe -v error -show_entries stream=codec_type,width,height -of json output/daily-gainers-video/20261008/daily-gainers-20261008.mp4
          sha256sum output/daily-gainers-video/20261008/daily-gainers-20261008.mp4 output/daily-gainers-video/20261008/daily-gainers-20261008.zh-TW.srt
      - name: Capture composite inspection frames
        if: success()
        run: |
          set -euo pipefail
          dir=output/daily-gainers-video/20261008
          mkdir -p "$dir/m8vis-inspection"
          for sec in 1 4 8 15 30 60; do
            ffmpeg -y -loglevel error -ss "$sec" -i "$dir/daily-gainers-20261008.mp4" -frames:v 1 "$dir/m8vis-inspection/frame-${sec}s.png"
          done
          cp public/daily-gainers-v2-video-preview.html "$dir/m8vis-inspection/video-preview.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m8vis-full-composite-20261008
          path: |
            output/daily-gainers-video/20261008/plan.json
            output/daily-gainers-video/20261008/slide-manifest.json
            output/daily-gainers-video/20261008/daily-gainers-20261008.mp4
            output/daily-gainers-video/20261008/daily-gainers-20261008.zh-TW.srt
            output/daily-gainers-video/20261008/m8vis-inspection/
          if-no-files-found: warn
          retention-days: 7

# Owner-authorized M8VIS isolated full-preview CI retrigger; no production or publishing.
