name: "[06 回填修復] Fundamental Formal Report Fallback Backfill"

on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: "true = only create plan report"
        required: true
        default: true
        type: boolean
      offset:
        description: "Start index in event_only_gap stocks"
        required: true
        default: "0"
      batch_size:
        description: "Stocks per batch"
        required: true
        default: "50"

permissions:
  contents: write

concurrency:
  group: formal-report-fallback-backfill
  cancel-in-progress: false

jobs:
  run_batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate scripts and gap report
        run: |
          set -euo pipefail
          node --check scripts/fundamental_event_timeline.js
          node --check scripts/build_fundamental_event_timeline.js
          node --check scripts/backfill_formal_report_fallback_events.js
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('data_prediction_analysis/eps-valuation/formal-report-event-gap-report.json','utf8'));
          if(p.mode!=='investigation_only'||p.mutates_fundamental_events!==false) throw new Error('unsafe gap report');
          if(Number(p.summary.unbuildable_missing_events)!==0) throw new Error('unbuildable gaps exist');
          console.log(p.summary);
          NODE

      - name: Run batch
        env:
          PLAN_ONLY: ${{ inputs.plan_only }}
          OFFSET: ${{ inputs.offset }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          set -euo pipefail
          args=(--offset "$OFFSET" --batch-size "$BATCH_SIZE")
          if [ "$PLAN_ONLY" != "true" ]; then args+=(--apply true); fi
          node scripts/backfill_formal_report_fallback_events.js "${args[@]}"

      - name: Commit batch result
        run: |
          set -euo pipefail
          paths=(data_prediction_analysis/eps-valuation/formal-report-backfill-runs)
          if [ "${{ inputs.plan_only }}" != "true" ]; then paths+=(data_fundamental_events); fi
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "research: process formal report fallback batch"
          git pull --rebase origin main
          git push origin HEAD:main
