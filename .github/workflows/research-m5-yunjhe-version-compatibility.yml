name: "[Research M5] YunJhe version compatibility"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edge_tts_version: ['7.2.7', '7.2.8']
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated fixed version
        run: python -m pip install --disable-pip-version-check edge-tts==${{ matrix.edge_tts_version }}
      - name: Probe same required voice with authentic WordBoundary
        run: |
          set -o pipefail
          python scripts/diagnose_daily_gainers_m5_edge_tts.py | tee "${RUNNER_TEMP}/probe.json"
      - name: Preserve comparison, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-yunjhe-version-${{ matrix.edge_tts_version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/probe.json
          if-no-files-found: warn
          retention-days: 14
