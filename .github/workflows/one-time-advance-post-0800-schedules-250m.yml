# trigger-after-registration: 2026-09-04-v2
name: "[07 維護更新] One-time advance post-08:00 schedules 250m"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-advance-post-0800-schedules-250m.yml'
      - 'scripts/advance_post_0800_workflow_schedules_250m.js'

permissions:
  contents: write

concurrency:
  group: one-time-advance-post-0800-schedules-250m
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only workflows and migration script
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /scripts/advance_post_0800_workflow_schedules_250m.js

      - name: Shift all Taipei schedules after 08:00 by 250 minutes
        run: |
          set -euo pipefail
          node --check scripts/advance_post_0800_workflow_schedules_250m.js
          node scripts/advance_post_0800_workflow_schedules_250m.js | tee /tmp/schedule-shift-output.txt
          git diff --check
          test -s /tmp/schedule-shift-report.json
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('/tmp/schedule-shift-report.json', 'utf8'));
          if (p.shift_minutes !== 250) throw new Error('shift_minutes mismatch');
          if (!Number.isInteger(p.workflow_count) || p.workflow_count < 1) throw new Error('no workflows changed');
          if (!Number.isInteger(p.cron_count) || p.cron_count < p.workflow_count) throw new Error('bad cron count');
          for (const wf of p.workflows) {
            for (const c of wf.changes) {
              const hm = x => { const [h,m] = x.split(':').map(Number); return h*60+m; };
              const before = hm(c.old_taipei), after = hm(c.new_taipei);
              if (before <= 480) throw new Error(`changed non-qualifying schedule ${wf.path} ${c.old_taipei}`);
              if (((before - after + 1440) % 1440) !== 250) throw new Error(`bad shift ${wf.path} ${c.old_taipei}->${c.new_taipei}`);
            }
          }
          console.log(`Validated ${p.workflow_count} workflows / ${p.cron_count} cron entries`);
          NODE

      - name: Remove one-time migration files and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/advance_post_0800_workflow_schedules_250m.js
          git rm .github/workflows/one-time-advance-post-0800-schedules-250m.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/
          git diff --cached --check
          git commit -m "chore: advance post-08:00 schedules by 250 minutes"
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
