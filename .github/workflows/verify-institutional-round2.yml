name: "[07 驗證] Institutional Recovery Round 2"

on:
  push:
    paths:
      - '.github/workflows/verify-institutional-round2.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check institutional script syntax
        run: |
          node --check scripts/crawl_institutional_data.js
          node --check scripts/retry_institutional_failed.js
          node --check scripts/reconcile_institutional_data.js
          node --check scripts/write_institutional_actions_summary.js
          node --check scripts/lib/institutional_data_common.js
          node --check scripts/lib/twse_trading_day.js

      - name: Run institutional unit and regression tests
        run: |
          node --test \
            tests/twse_trading_day.test.js \
            tests/institutional_reconcile.test.js \
            tests/institutional_pipeline_regression.test.js \
            tests/foreign_page_script_syntax.test.js

      - name: Verify non-trading reconcile is read-only
        shell: bash
        run: |
          BEFORE=$(git status --porcelain)
          node scripts/reconcile_institutional_data.js --date 20260822
          AFTER=$(git status --porcelain)
          test "$BEFORE" = "$AFTER"

      - name: Verify workflow contracts
        shell: bash
        run: |
          ! grep -R "workflow_run" .github/workflows/crawl-institutional.yml .github/workflows/retry-institutional.yml
          grep -q "write_institutional_actions_summary.js" .github/workflows/crawl-institutional.yml
          grep -q "write_institutional_actions_summary.js" .github/workflows/retry-institutional.yml
          grep -q "uses: ./.github/workflows/deploy-pages.yml" .github/workflows/crawl-institutional.yml
          grep -q "uses: ./.github/workflows/deploy-pages.yml" .github/workflows/retry-institutional.yml
