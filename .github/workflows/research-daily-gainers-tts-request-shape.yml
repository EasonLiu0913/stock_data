name: "[Research M5] TTS request-shape comparison"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - ".github/workflows/research-daily-gainers-tts-request-shape.yml"
      - "scripts/research_daily_gainers_tts_request_shape.py"
      - "scripts/tts_request_shape_transport.py"
      - "tests/test_daily_gainers_tts_request_shape.py"
      - "research_pending/daily-gainers-video-scripts/20261104.json"

permissions:
  contents: read

concurrency:
  group: tts-request-shape-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned TTS client
        run: python -m pip install --disable-pip-version-check edge-tts==7.3.1
      - name: Run offline request-shape contract tests
        run: python -m unittest discover -s tests -p 'test_daily_gainers_tts_request_shape.py' -v
      - name: Run bounded TTS-only experiment
        run: |
          python scripts/research_daily_gainers_tts_request_shape.py \
            --source research_pending/daily-gainers-video-scripts/20261104.json \
            --output "${RUNNER_TEMP}/tts-request-shape"
      - name: Retain diagnostic JSON and generated audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-request-shape-${{ github.run_id }}
          path: ${{ runner.temp }}/tts-request-shape/
          if-no-files-found: warn
          retention-days: 3
