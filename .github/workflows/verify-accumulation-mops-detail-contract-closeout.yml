# retired one-off closeout verifier; retained inertly for audit traceability
name: "[研究] Retired Accumulation MOPS Detail Contract Closeout Verifier"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Retired after successful detail-contract closeout verification."

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for schedule summary
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js

