name: "[研究] Verify Accumulation MOPS Detail Contract Closeout"

on:
  push:
    paths:
      - '.github/workflows/verify-accumulation-mops-detail-contract-closeout.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-accumulation-mops-detail-contract-closeout
  cancel-in-progress: false

jobs:
  verify-detail-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently reproduce one bounded detail request
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const preflightPath = 'data_research/institutional-flow/official-disclosure-raw/mops-material-information/preflight.json';
          const listingPath = 'data_research/institutional-flow/official-disclosure-raw/mops-material-information/corrected-api-preflight/source.json';
          const detailPath = 'data_research/institutional-flow/official-disclosure-raw/mops-material-information/corrected-api-preflight/detail-source.json';
          const detailMetaPath = 'data_research/institutional-flow/official-disclosure-raw/mops-material-information/corrected-api-preflight/detail-source-meta.json';
          const endpoint = 'https://mops.twse.com.tw/mops/api/t05st01_detail';
          const payload = { enterDate: '1150115', serialNumber: '1', companyId: '1102', marketKind: 'sii' };
          const pitDisclaimer = 'Current collection time and current API visibility are audit metadata only and do not prove historical T0 visibility or immutable historical value version.';

          const preflight = JSON.parse(fs.readFileSync(preflightPath, 'utf8'));
          const listing = JSON.parse(fs.readFileSync(listingPath, 'utf8'));
          const legacy = preflight?.contracts?.legacy;
          const corrected = preflight?.contracts?.corrected_api;
          if (Number(legacy?.attempt_count) !== 2) throw new Error('Legacy attempt_count must remain exactly 2.');
          if (preflight?.diagnostics?.wave_a_refetched !== false || preflight?.diagnostics?.wave_c_ran !== false) throw new Error('Wave A/Wave C invariant changed.');
          if (corrected?.listing_contract_passed !== true) throw new Error('Listing contract is not durable PASS.');
          const descriptor = listing?.result?.data?.[0]?.[5];
          if (!descriptor || descriptor.apiName !== 't05st01_detail') throw new Error('First durable listing descriptor is missing.');
          if (JSON.stringify(descriptor.parameters) !== JSON.stringify(payload)) throw new Error(`Descriptor/payload mismatch: ${JSON.stringify(descriptor.parameters)}`);
          if (Number(preflight?.diagnostics?.total_network_requests_this_round) !== 1) throw new Error('Expected exactly one prior network request in this round before closeout detail reproduction.');

          (async () => {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'accept': 'application/json, text/plain, */*',
                'user-agent': 'Mozilla/5.0 (compatible; stock-data-detail-contract-closeout/1.0)'
              },
              body: JSON.stringify(payload)
            });
            const bytes = Buffer.from(await response.arrayBuffer());
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            let body;
            try { body = JSON.parse(bytes.toString('utf8')); }
            catch (e) { throw new Error(`Detail response is not parseable JSON: ${e.message}`); }

            const rows = body?.result?.data;
            const titles = body?.result?.titles;
            const row = Array.isArray(rows) ? rows[0] : null;
            const titleNames = Array.isArray(titles) ? titles.map(x => x?.main) : [];
            const expectedTitles = ['序號','發言日期','發言時間','發言人','發言人職稱','發言人電話','主旨','符合條款','事實發生日','說明'];
            const coherent = response.status === 200 && String(body?.code) === '200' && /查詢成功|成功|success/i.test(String(body?.message || '')) && String(body?.result?.companyId || '') === payload.companyId && Array.isArray(rows) && rows.length >= 1 && Array.isArray(row) && row.length === 10 && row.every(v => typeof v === 'string') && JSON.stringify(titleNames) === JSON.stringify(expectedTitles) && String(row[0]).trim() === payload.serialNumber && String(row[1]).trim() === '115/01/15';
            if (!coherent) throw new Error(`Detail response contract check failed: status=${response.status}, code=${body?.code}, company=${body?.result?.companyId}, rows=${Array.isArray(rows)?rows.length:'not-array'}, rowLength=${Array.isArray(row)?row.length:'not-array'}, titles=${JSON.stringify(titleNames)}`);

            fs.mkdirSync(path.dirname(detailPath), { recursive: true });
            fs.writeFileSync(detailPath, bytes);
            const collectedAt = new Date().toISOString();
            const meta = {
              schema_version: 1,
              methodology: 'institutional-accumulation-material-information-detail-contract-resolution-v1-closeout-verification',
              evidence_origin: 'owner-observed official MOPS browser Network request, independently reproduced on fresh GitHub runner',
              endpoint,
              method: 'POST',
              request_body: payload,
              descriptor_mapping_verified: true,
              http_status: response.status,
              final_url: response.url,
              application_code: body.code,
              application_message: body.message,
              company_id_matches: String(body?.result?.companyId || '') === payload.companyId,
              response_bytes: bytes.length,
              response_sha256: sha256,
              collection_timestamp: collectedAt,
              parseable_json: true,
              row_count: rows.length,
              coherent_row_structure: true,
              row_length: row.length,
              column_types: row.map(v => typeof v),
              titles: titleNames,
              requested_descriptor_identity: { apiName: 't05st01_detail', parameters: payload },
              point_in_time_disclaimer: pitDisclaimer
            };
            fs.writeFileSync(detailMetaPath, JSON.stringify(meta, null, 2) + '\n');

            corrected.detail_contract = {
              status: 'passed',
              request_executed: true,
              endpoint,
              method: 'POST',
              request_body: payload,
              descriptor_mapping_verified: true,
              transport_evidence: 'owner-observed official browser Network request independently reproduced on fresh GitHub runner',
              raw_source_path: detailPath,
              raw_source_meta_path: detailMetaPath,
              application_success: true,
              coherent_schema: true,
              response_sha256: sha256,
              point_in_time_disclaimer: pitDisclaimer,
              resolution_round: {
                official_contract_requests: 1,
                detail_requests: 1,
                total_network_requests: 2,
                request_cap: 2,
                detail_transport_derived: true,
                closeout_fresh_runner_reproduced: true
              }
            };
            corrected.requests_used_this_round = 1;
            preflight.decision = 'listing_and_detail_contract_passed';
            preflight.reason = 'owner_observed_detail_transport_independently_reproduced_on_fresh_runner';
            preflight.completed_at = collectedAt;
            preflight.diagnostics.total_network_requests_this_round = 2;
            preflight.diagnostics.detail_requests_this_round = 1;
            preflight.diagnostics.material_information_authorized = false;
            preflight.diagnostics.wave_c_ran = false;
            preflight.diagnostics.collection_time_is_pit_proof = false;
            fs.writeFileSync(preflightPath, JSON.stringify(preflight, null, 2) + '\n');
          })().catch(err => { console.error(err.stack || err.message); process.exit(1); });
          NODE
      - name: Verify planner remains blocked and checkpoint evidence
        shell: bash
        run: |
          set -euo pipefail
          node tests/institutional_accumulation_official_disclosure_collection.test.js
          node scripts/plan_institutional_accumulation_official_disclosure_collection.js > /tmp/plan.json
          cat /tmp/plan.json
          node - <<'NODE'
          const p = require('/tmp/plan.json');
          const f = require('./data_research/institutional-flow/official-disclosure-raw/mops-material-information/preflight.json');
          const m = require('./data_research/institutional-flow/official-disclosure-raw/mops-material-information/corrected-api-preflight/detail-source-meta.json');
          if (p.wave_a.length !== 0 || p.wave_b.length !== 0 || p.wave_c.length !== 0 || p.material_information_authorized) throw new Error(`Planner must remain blocked: ${JSON.stringify(p)}`);
          if (f.decision !== 'listing_and_detail_contract_passed') throw new Error(`Unexpected decision: ${f.decision}`);
          if (f.contracts?.legacy?.attempt_count !== 2) throw new Error('Legacy attempt count changed.');
          if (f.diagnostics?.total_network_requests_this_round !== 2) throw new Error('Round request count must be exactly 2.');
          if (f.diagnostics?.wave_c_ran !== false || f.diagnostics?.material_information_authorized !== false) throw new Error('Wave C must remain forbidden.');
          if (!m.descriptor_mapping_verified || !m.coherent_row_structure) throw new Error('Detail meta verification failed.');
          NODE
          git add \
            data_research/institutional-flow/official-disclosure-raw/mops-material-information/preflight.json \
            data_research/institutional-flow/official-disclosure-raw/mops-material-information/corrected-api-preflight/detail-source.json \
            data_research/institutional-flow/official-disclosure-raw/mops-material-information/corrected-api-preflight/detail-source-meta.json
          git diff --cached --quiet && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'data: verify accumulation MOPS detail contract'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD^; then
            git reset --soft origin/main
            git restore --staged .
            git add \
              data_research/institutional-flow/official-disclosure-raw/mops-material-information/preflight.json \
              data_research/institutional-flow/official-disclosure-raw/mops-material-information/corrected-api-preflight/detail-source.json \
              data_research/institutional-flow/official-disclosure-raw/mops-material-information/corrected-api-preflight/detail-source-meta.json
            git commit -m 'data: verify accumulation MOPS detail contract'
          fi
          git push origin HEAD:main
