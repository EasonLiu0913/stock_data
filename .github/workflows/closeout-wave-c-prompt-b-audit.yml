# trigger: prompt-b-closeout
name: "[研究] Wave C Prompt B Closeout Audit"

on:
  push:
    paths:
      - '.github/workflows/closeout-wave-c-prompt-b-audit.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            scripts
            tests
            docs/agent-prompts
            data_research/institutional-flow
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Re-fetch current main and audit preregistered Wave C Prompt B
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git reset --hard origin/main
          BASE=2c695abc191cc30d198c01d9bc8e68c66df030b8
          git fetch origin "$BASE" --depth=1
          node tests/institutional_accumulation_official_disclosure_collection.test.js
          node scripts/plan_institutional_accumulation_official_disclosure_collection.js > /tmp/plan.json
          node - <<'NODE'
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const crypto=require('node:crypto');
          const path=require('node:path');
          const BASE='2c695abc191cc30d198c01d9bc8e68c66df030b8';
          const round='institutional-accumulation-material-information-wave-c-physical-batch-collection-v1';
          const nextRound='institutional-accumulation-catalyst-artifact-reconstruction-readiness-v1';
          const handoff='data_research/institutional-flow/institutional-accumulation-material-information-api-contract-handoff.md';
          const routing='docs/agent-prompts/task-routing.json';
          const rawRoot='data_research/institutional-flow/official-disclosure-raw/mops-material-information';
          const waveA='data_research/institutional-flow/official-disclosure-raw/mops-monthly-revenue/202607';
          const plan=require('/tmp/plan.json');
          const read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const git=(...a)=>cp.execFileSync('git',a,{encoding:'utf8'}).trim();
          const route=read(routing);
          if(route.active_task!=='institutional-accumulation') throw Error('routing active task changed');
          if(route.tasks.filter(t=>t.state==='active').length!==1) throw Error('routing invariant violated');
          const active=route.tasks.find(t=>t.id==='institutional-accumulation');
          if(!active||active.state!=='active'||active.handoff!==handoff) throw Error('active handoff mismatch');
          const current=fs.readFileSync(handoff,'utf8');
          if(!current.includes(`\`${round}\``)||!current.includes('- Prompt A: **COMPLETE**')||!current.includes('- Prompt B: **PREREGISTERED / PENDING**')) throw Error('Wave C pending closeout state missing');
          const base=git('show',`${BASE}:${handoff}`);
          const marker='## Prompt B — Wave C physical-batch collection closeout';
          const stop='## Stop conditions';
          const slice=(s)=>{const i=s.indexOf(marker),j=s.indexOf(stop,i);if(i<0||j<0)throw Error('Prompt B boundaries missing');return s.slice(i,j)};
          const basePromptB=slice(base), currentPromptB=slice(current);
          if(sha(Buffer.from(basePromptB))!==sha(Buffer.from(currentPromptB))) throw Error('preregistered Prompt B changed');
          if(plan.methodology!==round||!plan.outcome_blind||plan.unresolved_identity_count!==33) throw Error('planner identity/outcome-blind invariant failed');
          if(plan.legacy_preflight_attempt_count!==2) throw Error('legacy attempt count changed');
          if(plan.wave_a.length||plan.wave_b.length||plan.wave_c_listing.length||plan.wave_c_detail.length||plan.wave_c.length) throw Error('final planner queue is non-zero');
          if(!plan.material_information_authorized) throw Error('material-information durable authorization missing');
          const stocks=['1102','1103','1104','1109','1201','1203','1215','1216','1217'];
          const required=['source_provider','source_interface','source_url_or_request_key','stock_id','historical_period_or_spoke_date','collected_at','http_status','final_url','response_bytes','response_sha256','parser_version','quality_state','version_safety','pit_known_at','pit_availability_rule','attempt_count','request_body','application_code','application_message','row_count'];
          let listings=0, details=0, manual=0;
          const manualRows=[];
          for(const stock of stocks){
            const d=path.join(rawRoot,'listings','115',stock), m=read(path.join(d,'source-meta.json')), b=fs.readFileSync(path.join(d,'source.json'));
            if(m.quality_state!=='quality_passed') throw Error(`listing not quality-passed ${stock}`);
            for(const k of required) if(!(k in m)) throw Error(`listing ${stock} missing ${k}`);
            if(m.response_sha256!==sha(b)||m.response_bytes!==b.length) throw Error(`listing raw hash/bytes mismatch ${stock}`);
            if(m.attempt_count>3) throw Error(`listing attempt ceiling ${stock}`);
            listings++;
            const raw=JSON.parse(b.toString('utf8'));
            const desc=[]; const seen=new Set();
            const visit=v=>{if(!v||typeof v!=='object')return;if(!Array.isArray(v)&&v.apiName==='t05st01_detail'&&v.parameters){const p=Object.fromEntries(['enterDate','serialNumber','companyId','marketKind'].map(k=>[k,String(v.parameters[k]??'')]));const key=[p.companyId,p.enterDate,p.serialNumber,p.marketKind].join('|');if(p.companyId===stock&&p.enterDate&&p.serialNumber&&p.marketKind&&!seen.has(key)){seen.add(key);desc.push(p)}};if(Array.isArray(v))v.forEach(visit);else Object.values(v).forEach(visit)}; visit(raw?.result?.data||[]);
            for(const p of desc){
              const dd=path.join(rawRoot,'details','115',stock,`${p.enterDate}_${p.serialNumber}`), sf=path.join(dd,'source-meta.json'), af=path.join(dd,'attempt-meta.json');
              if(fs.existsSync(sf)){
                const dm=read(sf), db=fs.readFileSync(path.join(dd,'source.json'));
                if(dm.quality_state!=='quality_passed') throw Error(`detail canonical not quality-passed ${stock} ${p.enterDate} ${p.serialNumber}`);
                for(const k of [...required,'source_reported_date','source_reported_time','source_timestamp_precision','source_sequence']) if(!(k in dm)) throw Error(`detail missing ${k} ${stock} ${p.enterDate} ${p.serialNumber}`);
                if(dm.response_sha256!==sha(db)||dm.response_bytes!==db.length) throw Error(`detail raw hash/bytes mismatch ${stock} ${p.enterDate} ${p.serialNumber}`);
                if(dm.attempt_count>3) throw Error(`detail attempt ceiling ${stock} ${p.enterDate} ${p.serialNumber}`);
                details++;
              } else if(fs.existsSync(af)){
                const am=read(af);
                if(am.terminal_state!=='manual_review'||Number(am.attempt_count)!==3) throw Error(`non-terminal retry residue ${stock} ${p.enterDate} ${p.serialNumber}`);
                if(!fs.existsSync(path.join(dd,'attempts'))) throw Error(`manual_review attempts/ missing ${stock} ${p.enterDate} ${p.serialNumber}`);
                manualRows.push({request_key:`mops-material-information-detail|stock=${stock}|enterDate=${p.enterDate}|serial=${p.serialNumber}|market=${p.marketKind}`,attempt_count:Number(am.attempt_count),failure_reason:am.failure_reason||am.reason||'unspecified'});
                manual++;
              } else throw Error(`missing durable detail state ${stock} ${p.enterDate} ${p.serialNumber}`);
            }
          }
          if(listings!==9||details!==255||manual!==40) throw Error(`coverage mismatch ${listings}/${details}/${manual}`);
          if(plan.manual_review.filter(x=>x.kind==='detail').length!==40) throw Error('planner manual_review mismatch');
          for(const r of manualRows) if(!['descriptor_identity_mismatch','suspected_soft_block_or_transport_failure'].includes(r.failure_reason)) throw Error(`unexpected manual reason ${r.failure_reason}`);
          for(const f of ['source.html','source-meta.json','rows.json']){
            const now=git('hash-object',path.join(waveA,f));
            const before=git('rev-parse',`${BASE}:${path.join(waveA,f)}`);
            if(now!==before) throw Error(`Wave A changed after Wave C preregistration: ${f}`);
          }
          const protectedRe=/(development-sample-freeze|development-outcome|development-association|stock-holdout|time-holdout|2454|institutional-withdrawal.*v6)/i;
          const baseFiles=git('ls-tree','-r','--name-only',BASE,'data_research/institutional-flow').split(/\n/).filter(Boolean).filter(f=>protectedRe.test(f));
          const protectedChanged=[];
          for(const f of baseFiles){try{const a=git('rev-parse',`${BASE}:${f}`),b=git('rev-parse',`HEAD:${f}`);if(a!==b)protectedChanged.push(f)}catch{protectedChanged.push(f)}}
          if(protectedChanged.length) throw Error(`protected artifacts changed: ${protectedChanged.join(',')}`);
          const wf=fs.readFileSync('.github/workflows/collect-institutional-accumulation-official-disclosure.yml','utf8');
          const collector=fs.readFileSync('scripts/collect_institutional_accumulation_mops_material_information_batch.js','utf8');
          for(const token of ['max-parallel: 1','cancel-in-progress: false','Collect exactly one listing partition','Collect exactly one detail descriptor','sleep $((20 + RANDOM % 41))']) if(!wf.includes(token)) throw Error(`workflow invariant missing: ${token}`);
          if(!collector.includes('2000 + Math.floor(Math.random() * 3001)')||!collector.includes("if (attempt > 3) throw new Error('manual_review_attempt_ceiling')")) throw Error('collector jitter/attempt ceiling invariant missing');
          if(wf.includes('/mops/web/ajax_t05st01')||collector.includes('/mops/web/ajax_t05st01')) throw Error('legacy endpoint present in Wave C execution path');
          const reasonCounts=Object.fromEntries([...new Set(manualRows.map(x=>x.failure_reason))].sort().map(k=>[k,manualRows.filter(x=>x.failure_reason===k).length]));
          if(reasonCounts.descriptor_identity_mismatch!==39||reasonCounts.suspected_soft_block_or_transport_failure!==1) throw Error('manual reason counts mismatch');
          const audit={schema_version:1,round,baseline_sha:BASE,audited_main_sha:git('rev-parse','HEAD'),prompt_b_sha256:sha(Buffer.from(currentPromptB)),routing_pass:true,protected_artifact_count_checked:baseFiles.length,protected_changes:[],legacy_attempt_count:2,wave_a_refetched:false,unresolved_identity_count:33,listing_count:9,quality_passed_detail_count:255,retryable_detail_count:0,manual_review_detail_count:40,manual_review_reason_counts:reasonCounts,planner_remaining_queue_count:0,workflow_contract:{max_parallel:1,cancel_in_progress:false,listing_batch_size:1,detail_batch_size:1,pre_request_jitter_seconds:'2-5',inter_batch_cooldown_seconds:'20-60',attempt_ceiling:3},provenance_validation:'PASS',prompt_b_closeout:'PASS',next_round:nextRound,manual_review_details:manualRows};
          fs.writeFileSync(path.join(rawRoot,'wave-c-prompt-b-closeout.json'),JSON.stringify(audit,null,2)+'\n');
          const promptA=`## Prompt A — Catalyst artifact reconstruction/readiness\n\n\`\`\`text\nContinue the Institutional Accumulation / Catalyst Pre-positioning project only if docs/agent-prompts/task-routing.json still routes the sole active task to this handoff and round ${nextRound} is Prompt A NOT STARTED / ACTIVE.\n\nBefore work: fetch current remote main; read AGENTS.md, docs/project-philosophy.md, docs/roadmap/current-phase.md, this handoff, data_research/institutional-flow/institutional-accumulation-validation-handoff.md, data_research/institutional-flow/institutional-accumulation-official-disclosure-source-collection-preregistration-v1.md, data_research/institutional-flow/institutional-accumulation-official-disclosure-artifact-reconstruction-v1.json, data_research/institutional-flow/official-disclosure-raw/mops-material-information/wave-c-prompt-b-closeout.json, the Wave A monthly-revenue raw files, and all Wave C listing/detail durable artifacts.\n\nObjective: reconstruct an outcome-blind, PIT-safe catalyst-evidence readiness artifact for the exact frozen 33 source_missing identities using only already-collected official-disclosure evidence. Do not issue MOPS or other network requests in this round. Do not open development outcomes, stock/time holdouts, protected 2454 outcomes, catalyst/outcome association, thresholds, scores, models, strategies, or production behavior.\n\nFor each of the 33 identities, deterministically map the frozen T0/stock identity to eligible already-durable Wave A/Wave C evidence, preserve source timestamp precision/version_safety/PIT disclaimers, and classify readiness without using future price or outcome information. Missing/ambiguous/manual_review evidence must remain explicit and must not be imputed as positive evidence. Produce a machine-readable reconstruction/readiness artifact plus regression tests.\n\nPrompt A completion boundary: all 33 identities are accounted for exactly once; no network request occurred; provenance/version-safety semantics are preserved; no protected outcome/catalyst-association state was opened; tests pass; durable artifacts and this handoff are committed; then mark Prompt A COMPLETE / Prompt B pending and stop with Prompt A complete — ready for Prompt B.\n\`\`\`\n\n`;
          const promptB=`## Prompt B — Catalyst artifact reconstruction/readiness closeout\n\n\`\`\`text\nPerform mandatory closeout for round ${nextRound} only after Prompt A has completed. Fetch current remote main and recover this exact Prompt B from durable pre-Prompt-A history.\n\nVerify at minimum: (1) sole active routing still points to this handoff; (2) exact frozen 33 identities are each represented once with no additions/removals; (3) reconstruction uses only already-durable official Wave A/Wave C evidence and issued zero network requests; (4) every accepted evidence link has exact durable source identity, source-reported date/time precision, parser/provenance identity, version_safety and PIT disclaimer; (5) manual_review/ambiguous keys remain explicit and are never silently upgraded; (6) development outcomes, stock/time holdouts, protected 2454, refreshed association, Withdrawal v6.0-v6.5, thresholds/scores/models/strategies/production behavior remain unchanged/unopened; (7) no catalyst/outcome association is computed; (8) regression tests independently reproduce counts and readiness classification from current main; (9) durable output paths exist remotely and match the tested SHA; (10) any defect is fixed only within this reconstruction/readiness scope, then verification restarts from criterion 1.\n\nOn PASS, update/commit the canonical handoff, record exact commits/tests/counts/limitations, preregister and promote only the correct next round without executing it, end with Prompt B closeout: PASS, and stop.\n\`\`\`\n\n`;
          const closeoutSection=`## Wave C Prompt B closeout\n\nRound: \`${round}\`\n\n**Prompt B closeout: PASS**\n\nIndependent closeout baseline: \`${BASE}\`; audited current-main SHA: \`${audit.audited_main_sha}\`. Preregistered Prompt B SHA-256: \`${audit.prompt_b_sha256}\`.\n\nVerified durable accounting: listings **9/9**, quality-passed details **255**, retryable details **0**, terminal manual_review **40** (descriptor_identity_mismatch=39; suspected_soft_block_or_transport_failure=1), final planner queue **0**. Legacy attempt_count remains **2**; Wave A raw artifacts are byte-identical to the pre-Wave-C baseline; protected research artifacts are byte-identical; quality-passed raw bytes/hashes/provenance fields were revalidated from current main. Production orchestration retains max-parallel=1, one key per fresh-runner matrix job, 2-5s request jitter, 20-60s cooldown, three-attempt ceiling, cancel-in-progress=false, remote-completed-wins checkpointing, and no legacy endpoint in the Wave C execution path.\n\nCanonical machine-readable closeout: \`${rawRoot}/wave-c-prompt-b-closeout.json\`.\n\nNo development outcome/holdout/protected-2454/catalyst association/threshold/score/model/strategy/production behavior was opened by this closeout.\n\n`;
          let revised=current.replace(`\`${round}\`\n\nStatus:\n- Prompt A: **COMPLETE**\n- Prompt B: **PREREGISTERED / PENDING**`,`\`${nextRound}\`\n\nStatus:\n- Prompt A: **NOT STARTED / ACTIVE**\n- Prompt B: **PREREGISTERED / PENDING**`);
          if(revised===current) throw Error('active-round promotion replacement failed');
          revised=revised.replace('## Prompt B — Wave C physical-batch collection closeout',closeoutSection+'## Prompt B — Wave C physical-batch collection closeout');
          const stopIndex=revised.indexOf('## Stop conditions');
          if(stopIndex<0) throw Error('stop conditions marker missing');
          revised=revised.slice(0,stopIndex)+promptA+promptB+revised.slice(stopIndex);
          fs.writeFileSync(handoff,revised);
          console.log(JSON.stringify(audit,null,2));
          NODE
      - name: Remove one-shot audit workflow and commit durable Prompt B closeout
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/closeout-wave-c-prompt-b-audit.yml
          git add data_research/institutional-flow/institutional-accumulation-material-information-api-contract-handoff.md \
                  data_research/institutional-flow/official-disclosure-raw/mops-material-information/wave-c-prompt-b-closeout.json
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "research: close Wave C Prompt B and preregister catalyst readiness"
          git fetch origin main --depth=1
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
            echo 'main advanced during closeout; fail closed before push'
            exit 1
          fi
          git push origin HEAD:main
