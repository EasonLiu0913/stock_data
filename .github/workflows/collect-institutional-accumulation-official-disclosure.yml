# Wave C durable checkpoint fix + sparse fresh-runner checkout
name: "[研究] Institutional Accumulation Official Disclosure Collection"

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collect-institutional-accumulation-official-disclosure.yml'

permissions:
  contents: write

concurrency:
  group: institutional-accumulation-official-disclosure-sparse-v2
  cancel-in-progress: false

env:
  RAW_ROOT: data_research/institutional-flow/official-disclosure-raw/mops-material-information

jobs:
  test-and-plan:
    runs-on: ubuntu-latest
    outputs:
      listings: ${{ steps.plan.outputs.listings }}
      listing_count: ${{ steps.plan.outputs.listing_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts
            tests
            data_research/institutional-flow
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: node tests/institutional_accumulation_official_disclosure_collection.test.js
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          node scripts/plan_institutional_accumulation_official_disclosure_collection.js > /tmp/plan.json
          cat /tmp/plan.json
          node - <<'NODE'
          const p=require('/tmp/plan.json');
          if(p.wave_a.length||p.wave_b.length) throw new Error('Pre-Wave-C queues must remain closed.');
          if(!p.material_information_authorized) throw new Error('Wave C requires durable listing+detail PASS.');
          if(p.legacy_preflight_attempt_count!==2) throw new Error('Legacy attempt_count changed.');
          if(p.unresolved_identity_count!==33) throw new Error('Frozen identity count changed.');
          NODE
          echo "listings=$(node -e "const p=require('/tmp/plan.json');process.stdout.write(JSON.stringify({include:p.wave_c_listing}))")" >> "$GITHUB_OUTPUT"
          echo "listing_count=$(node -e "const p=require('/tmp/plan.json');process.stdout.write(String(p.wave_c_listing.length))")" >> "$GITHUB_OUTPUT"

  listing-batches:
    needs: test-and-plan
    if: ${{ needs.test-and-plan.outputs.listing_count != '' && needs.test-and-plan.outputs.listing_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.test-and-plan.outputs.listings) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts
            data_research/institutional-flow
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Fresh-runner physical cooldown
        shell: bash
        run: sleep $((20 + RANDOM % 41))
      - name: Collect exactly one listing partition
        id: collect
        continue-on-error: true
        shell: bash
        run: node scripts/collect_institutional_accumulation_mops_material_information_batch.js listing '${{ matrix.stock }}' '${{ matrix.roc_year }}'
      - name: Checkpoint bounded listing key
        shell: bash
        run: |
          set -euo pipefail
          d="$RAW_ROOT/listings/${{ matrix.roc_year }}/${{ matrix.stock }}"
          test -d "$d"
          tar -cf /tmp/batch.tar "$d"
          git fetch origin main
          git reset --hard origin/main
          if git show "origin/main:$d/source-meta.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.exit(JSON.parse(s).quality_state==='quality_passed'?0:1)}catch{process.exit(1)}})"; then
            echo 'Durable remote quality-passed listing wins; no overwrite.'
          else
            tar -xf /tmp/batch.tar
            git add "$d"
            if ! git diff --cached --quiet; then
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git commit -m "data: checkpoint accumulation MOPS listing ${{ matrix.stock }} ${{ matrix.roc_year }}"
              git push origin HEAD:main
            fi
          fi
      - name: Preserve collector failure after checkpoint
        if: steps.collect.outcome == 'failure'
        run: exit 1

  plan-details-1:
    needs: [test-and-plan, listing-batches]
    if: always() && needs.test-and-plan.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      details: ${{ steps.plan.outputs.details }}
      detail_count: ${{ steps.plan.outputs.detail_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts
            data_research/institutional-flow
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main && git reset --hard origin/main
          node scripts/plan_institutional_accumulation_official_disclosure_collection.js > /tmp/plan.json
          cat /tmp/plan.json
          echo "details=$(node -e "const p=require('/tmp/plan.json');process.stdout.write(JSON.stringify({include:p.wave_c_detail.slice(0,200)}))")" >> "$GITHUB_OUTPUT"
          echo "detail_count=$(node -e "const p=require('/tmp/plan.json');process.stdout.write(String(p.wave_c_detail.slice(0,200).length))")" >> "$GITHUB_OUTPUT"

  detail-batches-1:
    needs: plan-details-1
    if: ${{ needs.plan-details-1.outputs.detail_count != '' && needs.plan-details-1.outputs.detail_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan-details-1.outputs.details) }}
    runs-on: ubuntu-latest
    steps: &detail_steps
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts
            data_research/institutional-flow
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Fresh-runner physical cooldown
        shell: bash
        run: sleep $((20 + RANDOM % 41))
      - name: Collect exactly one detail descriptor
        id: collect
        continue-on-error: true
        shell: bash
        run: node scripts/collect_institutional_accumulation_mops_material_information_batch.js detail '${{ matrix.stock }}' '${{ matrix.roc_year }}' '${{ matrix.enterDate }}' '${{ matrix.serialNumber }}' '${{ matrix.marketKind }}'
      - name: Checkpoint bounded detail key
        shell: bash
        run: |
          set -euo pipefail
          d="$RAW_ROOT/details/${{ matrix.roc_year }}/${{ matrix.stock }}/${{ matrix.enterDate }}_${{ matrix.serialNumber }}"
          test -d "$d"
          tar -cf /tmp/batch.tar "$d"
          git fetch origin main
          git reset --hard origin/main
          if git show "origin/main:$d/source-meta.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.exit(JSON.parse(s).quality_state==='quality_passed'?0:1)}catch{process.exit(1)}})"; then
            echo 'Durable remote quality-passed detail wins; no overwrite.'
          else
            tar -xf /tmp/batch.tar
            git add "$d"
            if ! git diff --cached --quiet; then
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git commit -m "data: checkpoint accumulation MOPS detail ${{ matrix.stock }} ${{ matrix.enterDate }} ${{ matrix.serialNumber }}"
              git push origin HEAD:main
            fi
          fi
      - name: Preserve collector failure after checkpoint
        if: steps.collect.outcome == 'failure'
        run: exit 1

  plan-details-2:
    needs: [plan-details-1, detail-batches-1]
    if: always() && needs.plan-details-1.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      details: ${{ steps.plan.outputs.details }}
      detail_count: ${{ steps.plan.outputs.detail_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts
            data_research/institutional-flow
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main && git reset --hard origin/main
          node scripts/plan_institutional_accumulation_official_disclosure_collection.js > /tmp/plan.json
          cat /tmp/plan.json
          echo "details=$(node -e "const p=require('/tmp/plan.json');process.stdout.write(JSON.stringify({include:p.wave_c_detail.slice(0,200)}))")" >> "$GITHUB_OUTPUT"
          echo "detail_count=$(node -e "const p=require('/tmp/plan.json');process.stdout.write(String(p.wave_c_detail.slice(0,200).length))")" >> "$GITHUB_OUTPUT"

  detail-batches-2:
    needs: plan-details-2
    if: ${{ needs.plan-details-2.outputs.detail_count != '' && needs.plan-details-2.outputs.detail_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan-details-2.outputs.details) }}
    runs-on: ubuntu-latest
    steps: *detail_steps

  plan-details-3:
    needs: [plan-details-2, detail-batches-2]
    if: always() && needs.plan-details-2.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      details: ${{ steps.plan.outputs.details }}
      detail_count: ${{ steps.plan.outputs.detail_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts
            data_research/institutional-flow
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main && git reset --hard origin/main
          node scripts/plan_institutional_accumulation_official_disclosure_collection.js > /tmp/plan.json
          cat /tmp/plan.json
          echo "details=$(node -e "const p=require('/tmp/plan.json');process.stdout.write(JSON.stringify({include:p.wave_c_detail.slice(0,200)}))")" >> "$GITHUB_OUTPUT"
          echo "detail_count=$(node -e "const p=require('/tmp/plan.json');process.stdout.write(String(p.wave_c_detail.slice(0,200).length))")" >> "$GITHUB_OUTPUT"

  detail-batches-3:
    needs: plan-details-3
    if: ${{ needs.plan-details-3.outputs.detail_count != '' && needs.plan-details-3.outputs.detail_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan-details-3.outputs.details) }}
    runs-on: ubuntu-latest
    steps: *detail_steps

  final-reconcile:
    needs: [test-and-plan, listing-batches, plan-details-1, detail-batches-1, plan-details-2, detail-batches-2, plan-details-3, detail-batches-3]
    if: always() && needs.test-and-plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts
            tests
            data_research/institutional-flow
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Verify durable remote Wave C state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main && git reset --hard origin/main
          node tests/institutional_accumulation_official_disclosure_collection.test.js
          node scripts/plan_institutional_accumulation_official_disclosure_collection.js > /tmp/plan.json
          cat /tmp/plan.json
          node - <<'NODE'
          const p=require('/tmp/plan.json');
          if(p.wave_a.length||p.wave_b.length) throw new Error('Earlier waves reopened.');
          if(p.legacy_preflight_attempt_count!==2) throw new Error('Legacy attempt count changed.');
          if(p.wave_c_listing.length) throw new Error(`Listing queue not exhausted: ${p.wave_c_listing.length}`);
          if(p.wave_c_detail.length) throw new Error(`Detail queue not exhausted: ${p.wave_c_detail.length}`);
          console.log(JSON.stringify({wave_c_exhausted:true,manual_review:p.manual_review.length,unresolved_identity_count:p.unresolved_identity_count},null,2));
          NODE
