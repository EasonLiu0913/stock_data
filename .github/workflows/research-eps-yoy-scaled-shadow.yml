name: "[07 研究] EPS YoY 年增倍率 Shadow Study"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/research-eps-yoy-scaled-shadow.yml"
      - "scripts/analyze_eps_yoy_scaled_shadow.js"

permissions:
  contents: write

concurrency:
  group: research-eps-yoy-scaled-shadow
  cancel-in-progress: true

jobs:
  analyze:
    name: Compare original vs guarded yoy_scaled_remaining
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research inputs
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/analyze_eps_yoy_scaled_shadow.js
            /data_prediction_analysis/eps-valuation/valuation-backtest.json
            /data_prediction_analysis/eps-valuation/yoy-scaled-outlier-study.json
            /data_finmind_quarterly_financial_quality/

      - name: Run shadow study
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/analyze_eps_yoy_scaled_shadow.js
          node scripts/analyze_eps_yoy_scaled_shadow.js

      - name: Commit shadow report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse \
            data_prediction_analysis/eps-valuation/yoy-scaled-shadow-study.json \
            data_prediction_analysis/eps-valuation/yoy-scaled-shadow-study.md
          if git diff --cached --quiet; then
            echo "Shadow study is unchanged."
            exit 0
          fi
          git commit -m "research: update EPS YoY scaled shadow study"
          git pull --rebase origin main
          git push origin HEAD:main
