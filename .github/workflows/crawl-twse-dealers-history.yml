name: Crawl TWSE Dealers History

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Single target date (YYYYMMDD). If set, start/end are ignored.'
        required: false
        default: ''
      start_date:
        description: 'Start date (YYYYMMDD). Leave empty to use script default.'
        required: false
        default: ''
      end_date:
        description: 'End date (YYYYMMDD). Leave empty to use Taipei today.'
        required: false
        default: ''
      force:
        description: 'Overwrite existing files'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      min_delay:
        description: 'Minimum random delay between dates in ms'
        required: false
        default: '3000'
      max_delay:
        description: 'Maximum random delay between dates in ms'
        required: false
        default: '5000'
      rate_limit_cooldown:
        description: 'Cooldown for 307/429/503 responses in ms'
        required: false
        default: '90000'
      mismatch_cooldown:
        description: 'Cooldown for response date mismatch in ms'
        required: false
        default: '90000'

permissions:
  contents: write

concurrency:
  group: crawl-twse-dealers-history
  cancel-in-progress: false

jobs:
  crawl-history:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Crawl TWSE dealers history
        run: |
          ARGS=(
            --min-delay "${{ github.event.inputs.min_delay }}"
            --max-delay "${{ github.event.inputs.max_delay }}"
            --max-retries 0
            --rate-limit-cooldown "${{ github.event.inputs.rate_limit_cooldown }}"
            --mismatch-cooldown "${{ github.event.inputs.mismatch_cooldown }}"
          )

          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS+=(--date "${{ github.event.inputs.date }}")
          else
            if [ -n "${{ github.event.inputs.start_date }}" ]; then
              ARGS+=(--start "${{ github.event.inputs.start_date }}")
            fi
            if [ -n "${{ github.event.inputs.end_date }}" ]; then
              ARGS+=(--end "${{ github.event.inputs.end_date }}")
            fi
          fi

          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi

          node scripts/crawl_history_twse_dealers.js "${ARGS[@]}"

      - name: Generate TWSE dealers files.json only
        run: node scripts/generate_file_lists.js --only data_twse_dealers

      - name: Commit and push changes
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data_twse_dealers/

          if git diff --staged --quiet; then
            if [ -n "$(git status --porcelain)" ]; then
              echo "Unexpected uncommitted changes remain even though there are no TWSE dealers changes:"
              git status --short
              exit 1
            fi
            echo "No TWSE dealers changes"
            exit 0
          fi

          CURRENT_DATE=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          git commit -m "chore: update TWSE dealers history ${CURRENT_DATE}"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed, retry ${attempt}/5..."
            sleep 5
          done

          echo "Failed to push TWSE dealers history after 5 attempts."
          exit 1
