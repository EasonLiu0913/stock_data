name: "[08 影片] Daily 5% Video Upload Orchestrator"

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Required YYYYMMDD for manual dispatch; schedule scans validated outstanding dates"
        required: false
        default: ""
  schedule:
    # 23:47 Taipei = 15:47 UTC, Monday-Friday; no weekend duplicate.
    - cron: "47 15 * * 1-5"
  push:
    branches: [main]
    paths:
      - "video_scripts/daily-gainers/*.json"

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-gainers-video-orchestrator
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout scripts and daily research
        uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: |
            scripts
            tests
            data_daily_gain_over_5
            video_scripts
            video_upload_receipts
            video_upload_attempts

      - name: Resolve validated outstanding date (no stale-script fallback)
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          date="${INPUT_DATE:-}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$date" ]; then
            echo "Explicit date is required for manual dispatch" >&2
            exit 1
          fi
          if [ -z "$date" ]; then
            # Inspect all script dates, oldest unuploaded first; skip invalid/incomplete dates,
            # but never silently fall back to a legacy date such as 20261013.
            while IFS= read -r candidate; do
              if node scripts/validate_daily_gainers_video_script.js "$candidate"; then
                date="$candidate"
                break
              fi
              echo "Date $candidate is not ready for upload; continue scanning" >&2
            done < <(node scripts/select_daily_gainers_pending_video_dates.js . 30)
          fi
          if [ -z "$date" ]; then
            echo "No validated outstanding video script; no YouTube action."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$date" =~ ^20[0-9]{6}$ ]] || { echo "Invalid date: $date" >&2; exit 1; }
          test -s "video_scripts/daily-gainers/$date.json"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Validate approved script and target-day sources
        if: steps.date.outputs.ready == 'true'
        run: node scripts/validate_daily_gainers_video_script.js "${{ steps.date.outputs.date }}"

      - name: Decide upload-only or full rendering
        if: steps.date.outputs.ready == 'true'
        id: decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/decide_daily_gainers_video_upload.sh "${{ steps.date.outputs.date }}"

      - name: Dispatch upload-only retry
        if: steps.decision.outputs.decision == 'retry'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run retry-upload-daily-gainers-video.yml --ref main -f date="${{ steps.date.outputs.date }}" -f source_run_id="${{ steps.decision.outputs.source_run_id }}"

      - name: Dispatch complete render
        if: steps.decision.outputs.decision == 'render'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run generate-upload-daily-gainers-video.yml --ref main -f date="${{ steps.date.outputs.date }}"

      - name: Summary
        if: always()
        run: |
          echo "### Video upload routing" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target date: ${{ steps.date.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Decision: ${{ steps.decision.outputs.decision }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reusable source run: ${{ steps.decision.outputs.source_run_id }}" >> "$GITHUB_STEP_SUMMARY"
