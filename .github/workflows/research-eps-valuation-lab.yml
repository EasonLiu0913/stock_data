name: "[07 研究] EPS 估值公式歷史驗證"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "plan=建立分批清單；batch=跑單一批次並 commit；finalize=合併全部批次、重建 coverage 並部署"
        required: true
        type: choice
        options:
          - plan
          - batch
          - finalize
        default: plan
      offset:
        description: "batch 模式起始 index；plan/finalize 可忽略"
        required: false
        default: "0"
      batch_size:
        description: "plan 的預設批次大小，或 batch 本次處理檔數；建議 20"
        required: false
        default: "20"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: research-eps-valuation-lab-${{ github.event.inputs.operation || 'manual' }}-${{ github.event.inputs.offset || '0' }}
  cancel-in-progress: false

jobs:
  process:
    name: EPS valuation ${{ github.event.inputs.operation }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout required research data
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /public/index.html
            /data_twse/twse_industry_Stock.json
            /data_finmind_quarterly_financial_quality/
            /data_fundamental_events/
            /data_twse_market_chart/
            /data_twse_mi_index/
            /data_history_sma/
            /data_fubon/
            /data_prediction_analysis/eps-valuation/

      - name: Validate batch runner
        run: |
          set -euo pipefail
          node --check scripts/generate_eps_valuation_lab.js
          node --check scripts/run_eps_valuation_batches.js
          node --check scripts/generate_eps_valuation_coverage.js
          node --check scripts/generate_formal_report_event_gap_report.js

      - name: Plan valuation batches
        if: ${{ github.event.inputs.operation == 'plan' }}
        run: |
          set -euo pipefail
          node scripts/run_eps_valuation_batches.js \
            --mode plan \
            --batch-size "${{ github.event.inputs.batch_size }}"
          test -s data_prediction_analysis/eps-valuation/valuation-batch-plan.json

      - name: Run one valuation batch
        if: ${{ github.event.inputs.operation == 'batch' }}
        run: |
          set -euo pipefail
          test -s data_prediction_analysis/eps-valuation/valuation-batch-plan.json
          node scripts/run_eps_valuation_batches.js \
            --mode batch \
            --offset "${{ github.event.inputs.offset }}" \
            --batch-size "${{ github.event.inputs.batch_size }}"

      - name: Finalize valuation and refresh coverage
        if: ${{ github.event.inputs.operation == 'finalize' }}
        run: |
          set -euo pipefail
          test -s data_prediction_analysis/eps-valuation/valuation-batch-plan.json
          node scripts/run_eps_valuation_batches.js --mode finalize
          node scripts/generate_eps_valuation_coverage.js
          node scripts/generate_formal_report_event_gap_report.js
          test -s data_prediction_analysis/eps-valuation/valuation-backtest.json
          test -s data_prediction_analysis/eps-valuation/coverage-report.json
          test -s data_prediction_analysis/eps-valuation/formal-report-event-gap-report.json
          node - <<'NODE'
          const valuation=require('./data_prediction_analysis/eps-valuation/valuation-backtest.json');
          const coverage=require('./data_prediction_analysis/eps-valuation/coverage-report.json');
          const gap=require('./data_prediction_analysis/eps-valuation/formal-report-event-gap-report.json');
          if(!Array.isArray(valuation.formula_summary)||!Array.isArray(valuation.rows)) process.exit(1);
          if(!Array.isArray(coverage.stocks)||!coverage.summary||coverage.stocks.length!==coverage.summary.total_stocks) process.exit(1);
          if(gap.mode!=='investigation_only'||gap.mutates_fundamental_events!==false) process.exit(1);
          if(!Array.isArray(gap.stocks)||!gap.summary||gap.stocks.length!==gap.summary.total_stocks) process.exit(1);
          console.log({
            plannedStocks:valuation.planned_stock_count,
            valuationStocks:valuation.stock_count,
            samples:valuation.sample_count,
            formulas:valuation.formula_summary.length,
            coverageStocks:coverage.summary.total_stocks,
            eligibleStocks:coverage.summary.eligible_stocks,
            missingStocks:coverage.summary.missing_stocks,
            directFallbackStocks:gap.summary.stocks_with_direct_fallback_candidates,
            directFallbackEvents:gap.summary.direct_fallback_candidate_events,
            unbuildableEvents:gap.summary.unbuildable_missing_events
          });
          NODE

      - name: Ensure EPS valuation lab is listed on homepage
        if: ${{ github.event.inputs.operation == 'finalize' }}
        run: |
          set -euo pipefail
          node --check scripts/generate_prediction_version_ui.js
          node -e "const ui=require('./scripts/generate_prediction_version_ui'); const changed=ui.updateIndex(); console.log({index_updated:changed});"
          node - <<'NODE'
          const fs=require('fs');
          const file='public/index.html';
          let html=fs.readFileSync(file,'utf8');
          html=html.replace(/file: 'eps-valuation-lab\.html'/g,"file: 'eps-valuation-lab-v2.html'");
          fs.writeFileSync(file,html,'utf8');
          NODE

      - name: Commit plan or batch result
        if: ${{ github.event.inputs.operation == 'plan' || github.event.inputs.operation == 'batch' }}
        run: |
          set -euo pipefail
          output_dir="data_prediction_analysis/eps-valuation"
          if [ -z "$(git status --porcelain -- "$output_dir")" ]; then
            echo "No plan or batch changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$output_dir/valuation-batch-plan.json" "$output_dir/valuation-batches" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No staged plan or batch changes."
            exit 0
          fi
          git commit -m "research: process EPS valuation ${{ github.event.inputs.operation }} offset ${{ github.event.inputs.offset }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Commit finalized research output
        if: ${{ github.event.inputs.operation == 'finalize' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_prediction_analysis/eps-valuation public/index.html
          if git diff --cached --quiet; then
            echo "No finalized research changes."
            exit 0
          fi
          git commit -m "research: finalize batched EPS valuation backtest"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy_pages:
    name: Deploy EPS valuation lab to GitHub Pages
    needs: process
    if: ${{ success() && github.event.inputs.operation == 'finalize' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      target_date: ""
