name: "[07 研究] EPS 估值公式歷史驗證"

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_eps_valuation_lab.js"
      - "scripts/generate_eps_valuation_coverage.js"
      - "scripts/generate_prediction_version_ui.js"
      - "public/eps-valuation-lab.html"
      - "public/eps-valuation-lab-v2.html"
      - ".github/workflows/research-eps-valuation-lab.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: research-eps-valuation-lab
  cancel-in-progress: false

jobs:
  build:
    name: Generate EPS valuation backtest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout required research data
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /public/index.html
            /data_twse/twse_industry_Stock.json
            /data_finmind_quarterly_financial_quality/
            /data_fundamental_events/
            /data_twse_market_chart/
            /data_twse_mi_index/
            /data_history_sma/
            /data_fubon/
            /data_prediction_analysis/eps-valuation/

      - name: Ensure EPS valuation lab is listed on homepage
        run: |
          set -euo pipefail
          node --check scripts/generate_prediction_version_ui.js
          node -e "const ui=require('./scripts/generate_prediction_version_ui'); const changed=ui.updateIndex(); console.log({index_updated:changed});"
          node - <<'NODE'
          const fs=require('fs');
          const file='public/index.html';
          let html=fs.readFileSync(file,'utf8');
          html=html.replace(/file: 'eps-valuation-lab\.html'/g,"file: 'eps-valuation-lab-v2.html'");
          fs.writeFileSync(file,html,'utf8');
          NODE
          if git diff --quiet -- public/index.html; then
            echo "Homepage already points to EPS valuation coverage UI."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/index.html
            git commit -m "docs: point EPS valuation lab to coverage UI"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Generate and validate valuation and coverage
        run: |
          set -euo pipefail
          node --check scripts/generate_eps_valuation_lab.js
          node --check scripts/generate_eps_valuation_coverage.js
          node scripts/generate_eps_valuation_lab.js
          node scripts/generate_eps_valuation_coverage.js
          test -s data_prediction_analysis/eps-valuation/valuation-backtest.json
          test -s data_prediction_analysis/eps-valuation/coverage-report.json
          node - <<'NODE'
          const valuation=require('./data_prediction_analysis/eps-valuation/valuation-backtest.json');
          const coverage=require('./data_prediction_analysis/eps-valuation/coverage-report.json');
          if(!Array.isArray(valuation.formula_summary)||!Array.isArray(valuation.rows)) process.exit(1);
          if(!Array.isArray(coverage.stocks)||!coverage.summary||coverage.stocks.length!==coverage.summary.total_stocks) process.exit(1);
          console.log({
            valuationStocks:valuation.stock_count,
            samples:valuation.sample_count,
            formulas:valuation.formula_summary.length,
            coverageStocks:coverage.summary.total_stocks,
            eligibleStocks:coverage.summary.eligible_stocks,
            missingStocks:coverage.summary.missing_stocks
          });
          NODE

      - name: Commit research output
        run: |
          set -euo pipefail
          output_dir="data_prediction_analysis/eps-valuation"
          if [ -z "$(git status --porcelain -- "$output_dir")" ]; then
            echo "No valuation or coverage data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$output_dir"
          git commit -m "research: update EPS valuation backtest and coverage"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy_pages:
    name: Deploy EPS valuation lab to GitHub Pages
    needs: build
    if: ${{ success() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      target_date: ""
