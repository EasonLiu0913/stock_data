name: "[03 市場環境] Prepare Market Environment"

on:
  schedule:
    # 台北時間週二至週六 06:55、07:25、07:55。
    # 上游 [02 外部市場] 於 06:40、07:10、07:40 抓取，這裡固定延後 15 分鐘，
    # 避免 Prepare 在 final external-market snapshot 尚未 push 到 main 前先啟動。
    - cron: '55 22 * * 1-5'
    - cron: '25 23 * * 1-5'
    - cron: '55 23 * * 1-5'
  workflow_dispatch:
    inputs:
      forecast_date:
        description: '預測交易日 YYYYMMDD；留空自動判斷下一個要預測的交易日'
        required: false
        default: ''
      force:
        description: '覆蓋既有市場環境快照'
        required: false
        type: boolean
        default: false
      strict:
        description: '外部資料不完整或過期時直接失敗'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: prepare-market-environment
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve forecast and base dates
        id: dates
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.forecast_date || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          args=(--github-env)
          if [ -n "$INPUT_DATE" ]; then
            args+=(--target-date "$INPUT_DATE")
          elif [ "$EVENT_NAME" = "schedule" ]; then
            occurrence_json="$(node scripts/resolve_scheduled_collection_date.js \
              --event-name "$EVENT_NAME" \
              --schedule "$EVENT_SCHEDULE" \
              --policy same_calendar_date \
              --json)"
            scheduled_at="$(printf '%s' "$occurrence_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).scheduled_at_utc))')"
            args+=(--now "$scheduled_at")
            echo "Scheduled forecast resolver anchor: $scheduled_at"
          fi
          node scripts/resolve_forecast_dates.js "${args[@]}" > /tmp/environment-dates.env
          cat /tmp/environment-dates.env
          cat /tmp/environment-dates.env >> "$GITHUB_ENV"
          set -a
          source /tmp/environment-dates.env
          set +a
          echo "forecast_date=$FORECAST_TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "base_date=$FORECAST_BASE_DATE" >> "$GITHUB_OUTPUT"

      - name: Refresh base-date upstream data and dispatch independent recoveries
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail
          # Read the freshest committed sources before deciding which recoveries are needed.
          git fetch -q origin main
          git reset --hard origin/main
          base="$FORECAST_BASE_DATE"
          us_date="$(node -e 'process.stdout.write(require("./scripts/generate_market_environment").expectedUsMarketDate(process.env.FORECAST_BASE_DATE))')"
          echo "## Upstream source check — base $base / US $us_date" >> "$GITHUB_STEP_SUMMARY"
          missing=()
          if ! node scripts/verify_market_environment.js --base-date "$base" --forecast-date "$FORECAST_TARGET_DATE" --scope stock-universe; then
            missing+=(sma)
          fi
          twse="data_twse_mi_index/${base}_twse_mi_index.json"
          if ! node - "$twse" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2];
          try {
            const payload=JSON.parse(fs.readFileSync(file,'utf8'));
            const {loadTwseHistory}=require('./scripts/market_environment_lib');
            const base=process.env.FORECAST_BASE_DATE;
            if(!loadTwseHistory(base).some(row=>row.date===base && Number.isFinite(row.close))) process.exit(1);
          } catch (error) { console.error('TWSE source not ready:',error.message); process.exit(1); }
          NODE
          then missing+=(twse); fi
          futures="data_taifex_major_institutional_traders_futures_contracts/${base}_taifex_major_institutional_traders_futures_contracts.json"
          if ! node - "$futures" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2];
          try {
            JSON.parse(fs.readFileSync(file,'utf8'));
            const {loadFuturesHistory}=require('./scripts/market_environment_lib');
            if(!loadFuturesHistory(process.env.FORECAST_BASE_DATE).some(row=>row.date===process.env.FORECAST_BASE_DATE && Number.isFinite(row.net_contracts))) process.exit(1);
          } catch(error) { console.error('TAIFEX source not ready:',error.message); process.exit(1); }
          NODE
          then missing+=(futures); fi
          # External-market and market-risk are co-produced by the same upstream workflow.
          if ! node - "$us_date" <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const lib=require('./scripts/market_environment_lib');
          const expected=process.argv[2], base=process.env.FORECAST_BASE_DATE;
          try {
            const ext=lib.latestDatedFileInDirectories(path.join(lib.ROOT,'data_external_market'),base,'external_market_indicators.json');
            const risk=lib.latestDatedFileInDirectories(path.join(lib.ROOT,'data_market_risk'),base,'market_risk_snapshot.json');
            if(!ext||!risk) throw Error('missing external market or market risk snapshot');
            const check=lib.primaryExternalValidation(ext.payload,expected);
            if(!check.complete || check.actual_date!==expected || check.collection_date!==expected) throw Error('external primary session not ready');
            if(!Number.isFinite(Number(risk.payload?.market_risk_score))) throw Error('invalid market risk score');
          }catch(error){console.error('External market/risk source not ready:',error.message);process.exit(1);}
          NODE
          then missing+=(external); fi

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All required upstream datasets passed readiness checks."
            echo "- Upstream: ready" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "- Missing or invalid: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
          echo "- This [03] run: FAIL (new scheduled runs will recheck; no automatic [03] dispatch)" >> "$GITHUB_STEP_SUMMARY"
          # Only the first scheduled occurrence dispatches repairs. Other scheduled
          # attempts independently recheck main and fail if still missing.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" != "55 22 * * 1-5" ]; then
            echo "- Recovery: deferred to first scheduled dispatch; no duplicate triggered" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Upstream incomplete: ${missing[*]}; waiting for the next scheduled [03] check."
            exit 1
          fi

          dispatch_failed=0
          for dataset in "${missing[@]}"; do
            case "$dataset" in
              sma)
                workflow="backfill-fubon-sma-range.yml"
                args=(-f "start_date=$base" -f "end_date=$base" -f "stock_batch_size=100" -f "minimum_records=900")
                ;;
              twse)
                workflow="crawl-twse-mi-index.yml"
                args=(-f "date=$base" -f "type=ALL")
                ;;
              futures)
                workflow="crawl-taifex-major-institutional-traders-futures-contracts.yml"
                args=(-f "date=$base")
                ;;
              external)
                workflow="crawl-external-market-indicators.yml"
                args=(-f "date=$us_date")
                ;;
            esac
            echo "Dispatch requested: $dataset => $workflow (base=$base, US=$us_date)"
            if gh workflow run "$workflow" --ref main "${args[@]}"; then
              echo "- $dataset: dispatched $workflow" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $dataset: dispatch FAILED $workflow" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Recovery dispatch failed for $dataset"
              dispatch_failed=1
            fi
          done
          echo "::error::Missing upstream datasets: ${missing[*]}; [03] must fail regardless of repair dispatch status (dispatch_failed=$dispatch_failed)."
          exit 1

      - name: Validate existing snapshot before retry
        id: existing
        shell: bash
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail

          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Manual force requested; existing snapshot will not be reused."
            exit 0
          fi

          args=(--forecast-date "$FORECAST_TARGET_DATE" --base-date "$FORECAST_BASE_DATE")
          if [ "$FORECAST_TARGET_DATE" -lt "$(TZ='Asia/Taipei' date '+%Y%m%d')" ]; then
            args+=(--allow-historical-reconstruction)
          fi

          if node scripts/verify_market_environment.js "${args[@]}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Existing market environment snapshot passed the full integrity gate; retry is unnecessary."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Existing market environment snapshot is missing, incomplete, stale, or invalid; regeneration is required."
          fi

      - name: Refresh external market inputs from current main
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- data_external_market data_market_risk data_taifex_major_institutional_traders_futures_contracts
          echo "Refreshed external-market, market-risk and TAIFEX futures inputs from current origin/main."

      - name: Generate immutable shadow environment snapshot
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          STRICT: ${{ toJSON(inputs.strict) }}
        run: |
          set -euo pipefail
          # The integrity gate already failed (or manual force was requested), so force replacement
          # to avoid generate_market_environment.js silently reusing an invalid existing file.
          args=(--forecast-date "$FORECAST_TARGET_DATE" --base-date "$FORECAST_BASE_DATE" --force)
          if [ "$STRICT" != "false" ]; then args+=(--strict); fi
          node scripts/generate_market_environment.js "${args[@]}"

      - name: Verify regenerated environment integrity
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          args=(--forecast-date "$FORECAST_TARGET_DATE" --base-date "$FORECAST_BASE_DATE")
          if [ "$FORECAST_TARGET_DATE" -lt "$(TZ='Asia/Taipei' date '+%Y%m%d')" ]; then
            args+=(--allow-historical-reconstruction)
          fi
          node scripts/verify_market_environment.js "${args[@]}" --scope environment
          node scripts/verify_market_environment.js "${args[@]}" --scope stock-universe
          # Preserve the original full quality gate as the final acceptance check.
          node scripts/verify_market_environment.js "${args[@]}"

      - name: Install market environment banner
        if: steps.existing.outputs.skip != 'true'
        run: node scripts/install_market_environment_ui.js

      - name: Run market environment tests
        if: steps.existing.outputs.skip != 'true'
        run: node --test tests/market_environment.test.js

      - name: Commit and push snapshot and UI
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_market_environment public/prediction-dashboard.html
          if git diff --cached --quiet; then
            echo "No market environment changes"
            exit 0
          fi
          git commit -m "feat: prepare ${FORECAST_TARGET_DATE} market environment shadow snapshot"
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

      - name: Report retry decision
        if: always()
        shell: bash
        run: |
          {
            echo "## Prepare Market Environment"
            echo ""
            echo "- Forecast date: \`$FORECAST_TARGET_DATE\`"
            echo "- Base trade date: \`$FORECAST_BASE_DATE\`"
            if [ "${{ steps.existing.outputs.skip }}" = "true" ]; then
              echo "- Result: existing snapshot passed full integrity validation; generation skipped."
            else
              echo "- Result: existing snapshot was not reusable; regeneration path executed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # schedule-timing-summary:v2
      - name: Write schedule timing summary
        if: always() && github.event_name == 'schedule'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js
