name: "[03 市場環境] Prepare Market Environment"

on:
  schedule:
    # 台北時間週二至週六 06:55、07:25、07:55。
    # 上游 [02 外部市場] 於 06:40、07:10、07:40 抓取，這裡固定延後 15 分鐘，
    # 避免 Prepare 在 final external-market snapshot 尚未 push 到 main 前先啟動。
    - cron: '55 22 * * 1-5'
    - cron: '25 23 * * 1-5'
    - cron: '55 23 * * 1-5'
  workflow_dispatch:
    inputs:
      forecast_date:
        description: '預測交易日 YYYYMMDD；留空自動判斷下一個要預測的交易日'
        required: false
        default: ''
      force:
        description: '覆蓋既有市場環境快照'
        required: false
        type: boolean
        default: false
      strict:
        description: '外部資料不完整或過期時直接失敗'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: prepare-market-environment
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve forecast and base dates
        id: dates
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.forecast_date || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          args=(--github-env)
          if [ -n "$INPUT_DATE" ]; then
            args+=(--target-date "$INPUT_DATE")
          elif [ "$EVENT_NAME" = "schedule" ]; then
            occurrence_json="$(node scripts/resolve_scheduled_collection_date.js \
              --event-name "$EVENT_NAME" \
              --schedule "$EVENT_SCHEDULE" \
              --policy same_calendar_date \
              --json)"
            scheduled_at="$(printf '%s' "$occurrence_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).scheduled_at_utc))')"
            args+=(--now "$scheduled_at")
            echo "Scheduled forecast resolver anchor: $scheduled_at"
          fi
          node scripts/resolve_forecast_dates.js "${args[@]}" > /tmp/environment-dates.env
          cat /tmp/environment-dates.env
          cat /tmp/environment-dates.env >> "$GITHUB_ENV"
          set -a
          source /tmp/environment-dates.env
          set +a
          echo "forecast_date=$FORECAST_TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "base_date=$FORECAST_BASE_DATE" >> "$GITHUB_OUTPUT"

      - name: Diagnose required base-date upstream sources
        shell: bash
        run: |
          set -euo pipefail
          echo "## Base-date upstream readiness" >> "$GITHUB_STEP_SUMMARY"
          for spec in \
            "price_sma:data_fubon/fubon_${FORECAST_BASE_DATE}_sma.json" \
            "foreign_futures:data_taifex_major_institutional_traders_futures_contracts/${FORECAST_BASE_DATE}_taifex_major_institutional_traders_futures_contracts.json"; do
            label="${spec%%:*}"
            source="${spec#*:}"
            if [ -s "$source" ]; then
              echo "- $label: present (`$source`)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $label: missing (`$source`)" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$label missing for base date $FORECAST_BASE_DATE: $source"
            fi
          done
          node -e 'try { require("./scripts/verify_market_environment").validateStockUniverse(process.env.FORECAST_BASE_DATE); console.log("Base-date stock universe: valid"); } catch (error) { console.log("Base-date stock universe requires recovery: " + error.message); }'

      - name: Recover missing or invalid base-date Fubon price SMA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail
          source="data_fubon/fubon_${FORECAST_BASE_DATE}_sma.json"
          check_sma() {
            node -e 'require("./scripts/verify_market_environment").validateStockUniverse(process.env.FORECAST_BASE_DATE)'
          }
          if check_sma; then
            echo "Exact-date Fubon price SMA stock universe is valid."
            exit 0
          fi

          # Dispatch only on the first scheduled attempt (or for manual runs).
          # A later scheduled attempt can reuse the recovery already in flight.
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$EVENT_SCHEDULE" = "55 22 * * 1-5" ]; then
            workflow_path="$(gh workflow list --all --json name,path | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const matches=JSON.parse(s).filter(w=>/富邦/.test(w.name)&&/SMA/i.test(w.name)&&/區間|回填/.test(w.name));
                if(matches.length!==1)process.exit(2);
                process.stdout.write(matches[0].path);
              });') " || {
              echo "::error::Cannot uniquely identify the existing Fubon SMA date-range recovery workflow."
              exit 1
            }
            gh workflow view "$workflow_path" --yaml > /tmp/fubon-recovery-workflow.yml
            # Respect the existing recovery workflow's declared date inputs.
            # Never guess arbitrary required inputs or trigger an unbounded backfill.
            mapfile -t fields < <(ruby -ryaml -e '
              d=YAML.load_file(ARGV[0]); event=d["on"] || d[true] || {};
              inputs=(event["workflow_dispatch"] || {})["inputs"] || {};
              supported=%w[date target_date trade_date base_date start_date end_date from_date to_date];
              names=inputs.keys.map(&:to_s);
              required=inputs.select{|k,v| v.is_a?(Hash) && (v["required"]==true)}.keys.map(&:to_s);
              abort "Unsupported required dispatch inputs: #{(required-supported).join(",")}" unless (required-supported).empty?;
              selected=names & supported;
              abort "No recognized date-scoped dispatch inputs" if selected.empty?;
              puts selected;
            ' /tmp/fubon-recovery-workflow.yml) || exit 1
            if [ "${#fields[@]}" -eq 0 ]; then
              echo "::error::Fubon recovery workflow has no safe recognized date inputs."
              exit 1
            fi
            args=()
            for field in "${fields[@]}"; do args+=(-f "$field=$FORECAST_BASE_DATE"); done
            echo "::notice::Dispatching Fubon price SMA date-scoped recovery for $FORECAST_BASE_DATE via $workflow_path"
            gh workflow run "$workflow_path" --ref main "${args[@]}"
          fi

          for attempt in $(seq 1 40); do
            git fetch -q origin main
            if git cat-file -e "origin/main:$source" 2>/dev/null; then
              git reset --hard origin/main
              if check_sma; then
                echo "Recovered and validated exact-date Fubon SMA from main: $source"
                exit 0
              fi
            fi
            echo "Waiting for valid Fubon SMA $FORECAST_BASE_DATE on main ($attempt/40)"
            sleep 15
          done
          echo "::error::Valid exact-date Fubon SMA was not committed to main after bounded recovery: $source"
          exit 1

      - name: Validate existing snapshot before retry
        id: existing
        shell: bash
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail

          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Manual force requested; existing snapshot will not be reused."
            exit 0
          fi

          args=(--forecast-date "$FORECAST_TARGET_DATE" --base-date "$FORECAST_BASE_DATE")
          if [ "$FORECAST_TARGET_DATE" -lt "$(TZ='Asia/Taipei' date '+%Y%m%d')" ]; then
            args+=(--allow-historical-reconstruction)
          fi

          if node scripts/verify_market_environment.js "${args[@]}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Existing market environment snapshot passed the full integrity gate; retry is unnecessary."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Existing market environment snapshot is missing, incomplete, stale, or invalid; regeneration is required."
          fi

      - name: Refresh external market inputs from current main
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- data_external_market data_market_risk data_taifex_major_institutional_traders_futures_contracts
          echo "Refreshed external-market, market-risk and TAIFEX futures inputs from current origin/main."

      - name: Recover missing base-date TAIFEX futures source
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail
          source="data_taifex_major_institutional_traders_futures_contracts/${FORECAST_BASE_DATE}_taifex_major_institutional_traders_futures_contracts.json"
          if [ -s "$source" ]; then
            echo "TAIFEX base-date source present: $source"
            exit 0
          fi

          # Only the first scheduled run dispatches a recovery, avoiding three
          # redundant TAIFEX crawler runs every morning. Manual runs may retry.
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$EVENT_SCHEDULE" = "55 22 * * 1-5" ]; then
            echo "::notice::Missing $source; dispatching date-scoped TAIFEX source recovery"
            gh workflow run crawl-taifex-major-institutional-traders-futures-contracts.yml \
              --ref main -f date="$FORECAST_BASE_DATE"
          else
            echo "::notice::TAIFEX source missing; checking whether the earlier recovery has completed"
          fi

          for attempt in $(seq 1 20); do
            git fetch -q origin main
            if git cat-file -e "origin/main:$source" 2>/dev/null; then
              # Fast-forward before generating, so the recovered source is tracked
              # rather than left untracked and blocking the clean-worktree push gate.
              git reset --hard origin/main
              test -s "$source"
              echo "Recovered exact-date TAIFEX input from main: $source"
              exit 0
            fi
            echo "TAIFEX $FORECAST_BASE_DATE not yet committed to main ($attempt/20)"
            sleep 15
          done
          echo "::error::Required TAIFEX input $source is absent from main after bounded recovery. Check the [01 台股資料] TAIFEX crawler job and its official source; never substitute a prior trading date."
          exit 1

      - name: Generate immutable shadow environment snapshot
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          STRICT: ${{ toJSON(inputs.strict) }}
        run: |
          set -euo pipefail
          # The integrity gate already failed (or manual force was requested), so force replacement
          # to avoid generate_market_environment.js silently reusing an invalid existing file.
          args=(--forecast-date "$FORECAST_TARGET_DATE" --base-date "$FORECAST_BASE_DATE" --force)
          if [ "$STRICT" != "false" ]; then args+=(--strict); fi
          node scripts/generate_market_environment.js "${args[@]}"

      - name: Verify regenerated environment integrity
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          args=(--forecast-date "$FORECAST_TARGET_DATE" --base-date "$FORECAST_BASE_DATE")
          if [ "$FORECAST_TARGET_DATE" -lt "$(TZ='Asia/Taipei' date '+%Y%m%d')" ]; then
            args+=(--allow-historical-reconstruction)
          fi
          node scripts/verify_market_environment.js "${args[@]}" --scope environment
          node scripts/verify_market_environment.js "${args[@]}" --scope stock-universe
          # Preserve the original full quality gate as the final acceptance check.
          node scripts/verify_market_environment.js "${args[@]}"

      - name: Install market environment banner
        if: steps.existing.outputs.skip != 'true'
        run: node scripts/install_market_environment_ui.js

      - name: Run market environment tests
        if: steps.existing.outputs.skip != 'true'
        run: node --test tests/market_environment.test.js

      - name: Commit and push snapshot and UI
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_market_environment public/prediction-dashboard.html
          if git diff --cached --quiet; then
            echo "No market environment changes"
            exit 0
          fi
          git commit -m "feat: prepare ${FORECAST_TARGET_DATE} market environment shadow snapshot"
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

      - name: Report retry decision
        if: always()
        shell: bash
        run: |
          {
            echo "## Prepare Market Environment"
            echo ""
            echo "- Forecast date: \`$FORECAST_TARGET_DATE\`"
            echo "- Base trade date: \`$FORECAST_BASE_DATE\`"
            if [ "${{ steps.existing.outputs.skip }}" = "true" ]; then
              echo "- Result: existing snapshot passed full integrity validation; generation skipped."
            else
              echo "- Result: existing snapshot was not reusable; regeneration path executed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # schedule-timing-summary:v2
      - name: Write schedule timing summary
        if: always() && github.event_name == 'schedule'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js
