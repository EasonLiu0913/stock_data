name: Install Prediction Dashboard Close Column

on:
  push:
    branches: [main]
    paths:
      - scripts/install_prediction_dashboard_close_column.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-prediction-dashboard-close-column
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply dashboard patch
        run: node scripts/install_prediction_dashboard_close_column.js

      - name: Verify changes
        run: |
          grep -F "前收盤價（漲跌）" public/prediction-dashboard.html
          grep -F "loadBasePrices" public/prediction-dashboard.html
          grep -F "closeWithChange" public/prediction-dashboard.html

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/prediction-dashboard.html
          if git diff --cached --quiet; then
            echo "Dashboard column already installed"
            exit 0
          fi
          git commit -m "feat: show previous close and daily change in prediction dashboard"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
