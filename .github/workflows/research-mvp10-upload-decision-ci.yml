name: "[Research Only] MVP10 Upload Decision Unit Tests"
on:
  push:
    branches: [research/daily-video-mvp10-a-20261029]
    paths:
      - scripts/daily_gainers_mvp_upload_decision.js
      - tests/daily_gainers_mvp_upload_decision.test.js
      - .github/workflows/research-mvp10-upload-decision-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-upload-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/daily-video-mvp10-a-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify pure upload decision logic
        run: node --test tests/daily_gainers_mvp_upload_decision.test.js
