name: "[06 回填修復] Date-scoped TAIWAN STOCK missing data dispatcher"
run-name: "Recovery ${{ inputs.date || github.event.head_commit.message }}"
on:
  push:
    branches: [main]
    paths:
      - "recovery-requests/daily-gainers/*.json"
  workflow_dispatch:
    inputs:
      date:
        description: "Exact closed TWSE trading date YYYYMMDD; no fallback"
        required: true
        type: string
      max_dispatches:
        description: "Maximum source workflows to start this run (1 or 2)"
        required: false
        type: choice
        options: ["1", "2"]
        default: "2"
permissions:
  contents: read
  actions: write
concurrency:
  group: taiwan-stock-date-recovery-serial
  cancel-in-progress: false
jobs:
  discover-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: |
            data_daily_gain_over_5
            data_twse_mi_index
            data_twse_foreign_investors
            data_twse_investment_trust
            data_twse_dealers
            data_twse_margin_balance
            data_fubon_broker_details
            data_fubon
            research_pending/daily-gainers-ai
            recovery-requests/daily-gainers
            scripts/verify_daily_gainers_official_numeric.js
          sparse-checkout-cone-mode: false
      - name: Discover missing files and safely dispatch date-matched repair workflows
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_MAX_DISPATCHES: ${{ inputs.max_dispatches }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          TARGET="${INPUT_DATE:-}"
          MAX_DISPATCHES="${INPUT_MAX_DISPATCHES:-2}"
          if [[ "$EVENT_NAME" == "push" ]]; then
            # The Agent can push a date-scoped request through its GitHub connector.
            # Only an actual changed request triggers recovery, not workflow code changes.
            # Include head_commit and compare fallback; deleted-only requests are a no-op.
            mapfile -t changed < <(jq -r '[.commits[]?, .head_commit?] | map(select(. != null)) | [.[] | (.added[]?, .modified[]?)] | unique[] | select(test("^recovery-requests/daily-gainers/20[0-9]{6}\\.json$"))' "$GITHUB_EVENT_PATH")
            if [[ "${#changed[@]}" -eq 0 ]]; then
              before="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
              after="$(jq -r '.after // empty' "$GITHUB_EVENT_PATH")"
              if [[ -n "$before" && -n "$after" ]]; then
                mapfile -t changed < <(gh api "repos/$GITHUB_REPOSITORY/compare/$before...$after" --jq '[.files[] | select(.status=="added" or .status=="modified") | .filename] | unique[] | select(test("^recovery-requests/daily-gainers/20[0-9]{6}\\.json$"))')
              fi
            fi
            if [[ "${#changed[@]}" -eq 0 ]]; then
              echo "NO_REQUEST_CHANGE: deletion or unrelated push; no dispatch" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "${#changed[@]}" -ne 1 ]]; then
              echo "INVALID_REQUEST_COUNT count=${#changed[@]}" >&2; exit 1
            fi
            request="${changed[0]}"
            TARGET="$(basename "$request" .json)"
            test -s "$request"
            jq -e --arg d "$TARGET" '.target_date==$d and .schema_version==1 and .mode=="missing_data_recovery" and (.reason|type=="string" and length>0)' "$request" >/dev/null
            MAX_DISPATCHES="$(jq -r '.max_dispatches // 2' "$request")"
          fi
          [[ "$TARGET" =~ ^20[0-9]{6}$ ]] && [[ "$TARGET" > "20261102" ]] || { echo "Bad/out-of-scope date" >&2; exit 1; }
          [[ "$MAX_DISPATCHES" == "1" || "$MAX_DISPATCHES" == "2" ]] || exit 1
          today="$(TZ=Asia/Taipei date +%Y%m%d)"
          hour="$(TZ=Asia/Taipei date +%H)"
          if [[ "$TARGET" > "$today" ]] || { [[ "$TARGET" == "$today" ]] && (( 10#$hour < 14 )); }; then
            echo "Only completed TWSE sessions; no future/intraday date" >&2; exit 1
          fi
          repo="$GITHUB_REPOSITORY"
          dispatched=0
          echo "### Date-specific recovery $TARGET" >> "$GITHUB_STEP_SUMMARY"
          # GitHub's workflow-runs API does not always expose workflow_dispatch inputs.
          # Only date-identifiable runs may suppress dispatch for this target date.
          # Unknown-date runs are reported, not mistaken for this date.
          date_runs() {
            local workflow="$1"
            gh api "repos/$repo/actions/workflows/$workflow/runs?per_page=100" | \
              jq --arg d "$TARGET" '[.workflow_runs[] | select((.display_title // "" | contains($d)) or (.name // "" | contains($d)))]'
          }
          # Never start a second instance of the same source workflow while another one runs.
          dispatch_missing() {
            local file="$1" workflow="$2"
            if [[ -s "$file" ]]; then
              echo "PRESENT $file" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            if (( dispatched >= MAX_DISPATCHES )); then
              echo "DEFERRED $file (bounded dispatch budget)" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            local active
            runs="$(date_runs "$workflow")"
            active="$(jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested")] | length' <<< "$runs")"
            if (( active > 0 )); then
              echo "RUNNING $workflow; wait for existing job before retry" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            # Fail-closed on a recent failed or completed run: Agent must inspect actual
            # log + output date before another request, not create hourly retry storms.
            local latest
            latest="$(jq -r '.[0] | if . == null then empty else [.id,.conclusion,.created_at] | @tsv end' <<< "$runs")"
            if [[ -n "$latest" ]]; then
              local id conclusion started stamp now
              IFS=$'\t' read -r id conclusion started <<< "$latest"
              stamp="$(date -u -d "$started" +%s 2>/dev/null || echo 0)"
              now="$(date -u +%s)"
              if (( now-stamp < 7200 )); then
                echo "REVIEW_FIRST $workflow latest=$id conclusion=$conclusion; output $file still missing" >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi
            fi
            gh workflow run "$workflow" --ref main -f date="$TARGET"
            dispatched=$((dispatched+1))
            echo "DISPATCHED $workflow date=$TARGET for missing $file" >> "$GITHUB_STEP_SUMMARY"
          }
          # The target date is valid only if there is a date-scoped market file
          # or the agent explicitly chose it as a known historical trading date.
          # Never invent raw stocks for nonexistent market dates.
          dispatch_missing "data_daily_gain_over_5/$TARGET.json" "daily-gainers-over-5.yml"
          if [[ ! -s "data_daily_gain_over_5/$TARGET.json" ]]; then
            echo "RAW_LIST_MISSING: dependent steps deferred until next hourly check" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          dispatch_missing "data_twse_mi_index/${TARGET}_twse_mi_index.json" "crawl-twse-mi-index.yml"
          if [[ ! -s "data_twse_foreign_investors/${TARGET}_twse_foreign_investors.json" || ! -s "data_twse_investment_trust/${TARGET}_twse_investment_trust.json" || ! -s "data_twse_dealers/${TARGET}_twse_dealers.json" ]]; then
            dispatch_missing "data_twse_foreign_investors/${TARGET}_twse_foreign_investors.json" "crawl-twse-institutional-summaries.yml"
          fi
          dispatch_missing "data_twse_margin_balance/${TARGET}_twse_margin_balance.csv" "crawl-twse-margin-balance.yml"
          dispatch_missing "data_fubon_broker_details/fubon_${TARGET}_券商分點進出明細.json" "crawl-fubon-broker-details.yml"
          # Official numeric evidence is a date-level audit, not a missing source crawl.
          # Only dispatch after required stored inputs exist; never treat file existence as PASS.
          receipt="data_daily_gain_over_5/verification/official-numeric/$TARGET.json"
          facts="data_daily_gain_over_5/analysis-facts/$TARGET.json"
          official_workflow="daily-gainers-official-numeric-verification.yml"
          if [[ -s "$facts" ]]; then
            if ! jq -e --arg d "$TARGET" '.target_date==$d and (.source_files|type=="object")' "$facts" >/dev/null; then
              echo "OFFICIAL_NUMERIC_BLOCKED invalid Facts date/schema" >> "$GITHUB_STEP_SUMMARY"
            else
              # Missing receipt triggers a new audit; a receipt is reusable only if
              # its date, PASS status and all recorded source SHA256 match current inputs.
              need_official=1
              if [[ -s "$receipt" ]]; then
                if node - "$receipt" "$facts" "$TARGET" <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const [receiptPath,factsPath,date]=process.argv.slice(2);
          try{
           const r=JSON.parse(fs.readFileSync(receiptPath)),f=JSON.parse(fs.readFileSync(factsPath));
           if(r.status!=='PASS'||r.target_date!==date||r.failed_count!==0||!r.workflow?.run_id)process.exit(1);
           const paths={facts:factsPath,list:'data_daily_gain_over_5/'+date+'.json',...f.source_files};
           for(const [key,p] of Object.entries(paths)){
            const rec=r.source_sha256?.[key];
            if(!rec||rec.path!==p||rec.sha256!==crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex'))process.exit(1);
           }
           process.exit(0);
          }catch(e){process.exit(1)}
          NODE
                then
                  need_official=0
                  echo "OFFICIAL_NUMERIC_PASS_REUSED $receipt" >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
              if (( need_official )); then
                # Source data must be present and date-aligned before auditing;
                # never trigger an endless retry against incomplete inputs.
                inputs_ready=1
                while IFS= read -r p; do
                  [[ -s "$p" ]] || { inputs_ready=0; echo "OFFICIAL_NUMERIC_WAIT_SOURCE $p" >> "$GITHUB_STEP_SUMMARY"; }
                done < <(jq -r '.source_files[]' "$facts")
                if [[ -s "data_daily_gain_over_5/$TARGET.json" && "$inputs_ready" == "1" ]]; then
                  if (( dispatched >= MAX_DISPATCHES )); then
                    echo "OFFICIAL_NUMERIC_DEFERRED budget" >> "$GITHUB_STEP_SUMMARY"
                  else
                    official_runs="$(date_runs "$official_workflow")"
                    active="$(jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested")] | length' <<< "$official_runs")"
                    if (( active > 0 )); then
                      echo "OFFICIAL_NUMERIC_RUNNING existing workflow; no duplicate" >> "$GITHUB_STEP_SUMMARY"
                    else
                      latest="$(jq -r '.[0] | if . == null then empty else [.id,.conclusion,.created_at] | @tsv end' <<< "$official_runs")"
                      recent=0
                      if [[ -n "$latest" ]]; then
                        IFS=$'\t' read -r id conclusion started <<< "$latest"
                        stamp="$(date -u -d "$started" +%s 2>/dev/null || echo 0)"
                        now="$(date -u +%s)"
                        (( now-stamp < 7200 )) && recent=1
                      fi
                      if (( recent )); then
                        echo "OFFICIAL_NUMERIC_REVIEW_FIRST run=$id conclusion=$conclusion" >> "$GITHUB_STEP_SUMMARY"
                      else
                        gh workflow run "$official_workflow" --ref main -f target_date="$TARGET"
                        dispatched=$((dispatched+1))
                        echo "OFFICIAL_NUMERIC_DISPATCHED date=$TARGET workflow=$official_workflow" >> "$GITHUB_STEP_SUMMARY"
                      fi
                    fi
                  fi
                fi
              fi
            fi
          else
            echo "OFFICIAL_NUMERIC_WAIT_FACTS $facts" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "RECOVERY_STATE date=$TARGET dispatched=$dispatched receipt=$receipt" >> "$GITHUB_STEP_SUMMARY"
          echo "Dispatches this round: $dispatched / $MAX_DISPATCHES" >> "$GITHUB_STEP_SUMMARY"
          echo "AI/news narratives still belong to ChatGPT Agent; this dispatcher cannot synthesize them." >> "$GITHUB_STEP_SUMMARY"
