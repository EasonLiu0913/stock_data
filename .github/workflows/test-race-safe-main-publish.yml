name: "[07 維護更新] Race-safe Main Publish Regression"

on:
  push:
    branches: [main]
    paths:
      - 'scripts/race_safe_main_publish.sh'
      - 'tests/race_safe_main_publish.test.js'
      - '.github/workflows/crawl-twse-margin-balance.yml'
      - '.github/workflows/test-race-safe-main-publish.yml'
      - 'docs/architecture/github-actions.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate helper shell syntax
        run: bash -n scripts/race_safe_main_publish.sh

      - name: Run race-safe publish regression
        run: node --test tests/race_safe_main_publish.test.js

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
