name: "[06 回填修復] Sanitize Institutional 20260824"

on:
  push:
    paths:
      - '.github/workflows/sanitize-institutional-20260824.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sanitize-institutional-20260824
  cancel-in-progress: false

jobs:
  sanitize:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout sanitation inputs
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts/reconcile_institutional_data.js
            scripts/generate_file_lists.js
            scripts/lib/institutional_data_common.js
            scripts/lib/twse_trading_day.js
            config/twse_non_trading_days.json
            data_twse/twse_industry.csv
            data_fubon/
          sparse-checkout-cone-mode: false

      - name: Sanitize 20260824 institutional data
        run: |
          node --check scripts/reconcile_institutional_data.js
          node scripts/reconcile_institutional_data.js --date 20260824
          node scripts/generate_file_lists.js --only data_fubon
          node - <<'NODE'
          const fs = require('node:fs');
          const { hasTargetDate, readEligibleStockUniverse, toRocDate } = require('./scripts/lib/institutional_data_common');
          const universe = readEligibleStockUniverse('data_twse/twse_industry.csv');
          const data = JSON.parse(fs.readFileSync('data_fubon/fubon_20260824_institutional.json', 'utf8'));
          const status = JSON.parse(fs.readFileSync('data_fubon/fubon_20260824_institutional_status.json', 'utf8'));
          const keys = Object.keys(data);
          const rocDate = toRocDate('20260824');
          const valid = [...universe.keys()].filter(code => hasTargetDate(data[code], rocDate)).length;
          if (keys.length !== universe.size) throw new Error(`data rows ${keys.length} != universe ${universe.size}`);
          if (keys.some(code => !/^\d{4}$/.test(code) || !universe.has(code))) throw new Error('ineligible code remained after sanitize');
          if (valid !== universe.size || status.valid_count !== universe.size || status.status !== 'ready') throw new Error('20260824 lost completeness during sanitize');
          console.log(JSON.stringify({universe: universe.size, data_rows: keys.length, valid, status: status.status}, null, 2));
          NODE

      - name: Commit sanitized data
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_fubon/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "data: sanitize institutional universe 20260824"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Failed to push sanitized institutional data"
          exit 1

  deploy-pages:
    name: 發布法人清理後 GitHub Pages
    needs: sanitize
    if: needs.sanitize.result == 'success'
    uses: ./.github/workflows/deploy-pages.yml
