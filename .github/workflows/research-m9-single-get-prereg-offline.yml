name: "[Research] M9 Single GET Prereg Offline"
on:
  push:
    branches:
      - research/m9-controlled-private-preview-20261012
    paths:
      - scripts/verify_m9_stage1_single_get_prereg_offline.py
      - data_research/m5/m9/stage1/M9-STAGE1-SINGLE-GET-FAIL-FIRST-403-IMPLEMENTATION-PREREG-v1.json
      - .github/workflows/research-m9-single-get-prereg-offline.yml
permissions:
  contents: read
jobs:
  static-only:
    if: github.ref == 'refs/heads/research/m9-controlled-private-preview-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate single GET contract and 39 offline negatives
        run: python -I scripts/verify_m9_stage1_single_get_prereg_offline.py
