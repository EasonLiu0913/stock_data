name: Research AI V3 Sentence Audio Only
on:
  workflow_dispatch:
  push:
    branches: [research/market-opening-master-a-20261015]
    paths:
      - '.github/workflows/research-ai-v3-sentence-audio-only.yml'
      - 'scripts/research_ai_v3_sentence_edge_tts_20261008.py'
      - 'scripts/research_ai_v3_sentence_media_bridge_20261008.py'
      - 'scripts/research_ai_v3_m8vis_timing_handoff_20261008.py'
      - 'scripts/research_ai_v3_diagnostic_render_20261008.py'
      - 'scripts/research_ai_v3_m8vis_layout_20261008.py'
permissions:
  contents: read
jobs:
  sentence-audio:
    if: github.ref == 'refs/heads/research/market-opening-master-a-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source and install isolated audio tools
        run: |
          set -euo pipefail
          node tests/build_research_caption_source_20261008.test.js
          python -m py_compile scripts/research_ai_v3_sentence_edge_tts_20261008.py scripts/research_ai_v3_sentence_media_bridge_20261008.py scripts/research_ai_v3_m8vis_timing_handoff_20261008.py scripts/research_ai_v3_diagnostic_render_20261008.py scripts/research_ai_v3_m8vis_layout_20261008.py
          python -m pip install --disable-pip-version-check edge-tts==7.3.1
          echo "::group::FFmpeg and ffprobe diagnostics"
          echo "PATH=$PATH"
          uname -a
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            echo "::notice::FFmpeg tools missing; installing Ubuntu ffmpeg package"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          for tool in ffmpeg ffprobe; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool unavailable after installation"
              exit 1
            fi
            command -v "$tool"
            "$tool" -version | head -n 1
          done
          echo "::endgroup::"
      - name: Probe Edge TTS 7.3.1 fixed short sentence, fail closed
        run: |
          set -euo pipefail
          mkdir -p /tmp/ai-v3-sentence-audio
          python -m pip show edge-tts > /tmp/ai-v3-sentence-audio/edge-tts-version.txt
          edge-tts --voice zh-TW-YunJheNeural --rate '+15%' --text '大家好，歡迎來到 TAIWAN STOCK！' --write-media /tmp/ai-v3-sentence-audio/fixed-probe.mp3
          test -s /tmp/ai-v3-sentence-audio/fixed-probe.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/ai-v3-sentence-audio/fixed-probe.mp3 | tee /tmp/ai-v3-sentence-audio/fixed-probe-duration.txt
          sha256sum /tmp/ai-v3-sentence-audio/fixed-probe.mp3 | tee /tmp/ai-v3-sentence-audio/fixed-probe-sha256.txt
      - name: Generate actual V3 sentence audio, never publish
        run: |
          set -euo pipefail
          mkdir -p /tmp/ai-v3-sentence-audio
          node - <<'NODE' > /tmp/ai-v3-sentence-audio/source.json
          const fs=require('fs');
          const {buildResearchCaptionSource}=require('./scripts/build_research_caption_source_20261008');
          const d=JSON.parse(fs.readFileSync('data_research/m5/ai-script-generation/20261008-original-script-v3-research.json'));
          process.stdout.write(JSON.stringify(buildResearchCaptionSource(d),null,2)+'\n');
          NODE
          python scripts/research_ai_v3_sentence_edge_tts_20261008.py /tmp/ai-v3-sentence-audio/source.json /tmp/ai-v3-sentence-audio/audio
      - name: Validate research-only shared media timeline
        run: |
          set -euo pipefail
          python scripts/research_ai_v3_sentence_media_bridge_20261008.py /tmp/ai-v3-sentence-audio
      - name: Validate V3 M8VIS timing handoff, no rendering
        run: |
          set -euo pipefail
          python scripts/research_ai_v3_m8vis_timing_handoff_20261008.py /tmp/ai-v3-sentence-audio
      - name: Validate M8VIS safe zones and uncertified editorial claims
        run: |
          set -euo pipefail
          python scripts/research_ai_v3_m8vis_layout_20261008.py /tmp/ai-v3-sentence-audio data_research/m5/ai-script-generation/20261008-original-script-v3-research.json
      - name: Render isolated V3 diagnostic MP4, not M8VIS certification
        run: |
          set -euo pipefail
          python scripts/research_ai_v3_diagnostic_render_20261008.py /tmp/ai-v3-sentence-audio
      - name: Retain research evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-v3-sentence-audio-proof
          path: /tmp/ai-v3-sentence-audio/
          if-no-files-found: warn
          retention-days: 14
