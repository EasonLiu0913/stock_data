name: Research AI V3 Sentence Audio Only
on:
  workflow_dispatch:
  push:
    branches: [research/market-opening-master-a-20261015]
    paths:
      - '.github/workflows/research-ai-v3-sentence-audio-only.yml'
      - 'scripts/research_ai_v3_sentence_edge_tts_20261008.py'
      - 'scripts/research_ai_v3_sentence_media_bridge_20261008.py'
      - 'scripts/research_ai_v3_m8vis_timing_handoff_20261008.py'
      - 'scripts/research_ai_v3_diagnostic_render_20261008.py'
      - 'scripts/research_ai_v3_m8vis_layout_20261008.py'
      - 'scripts/research_ai_v3_m8vis_visual_render_20261008.py'
      - 'scripts/research_vtuber_asset_probe_20261008.py'
permissions:
  contents: read
jobs:
  sentence-audio:
    if: github.ref == 'refs/heads/research/market-opening-master-a-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source and install isolated audio tools
        run: |
          set -euo pipefail
          node tests/build_research_caption_source_20261008.test.js
          python -m py_compile scripts/research_ai_v3_sentence_edge_tts_20261008.py scripts/research_ai_v3_sentence_media_bridge_20261008.py scripts/research_ai_v3_m8vis_timing_handoff_20261008.py scripts/research_ai_v3_diagnostic_render_20261008.py scripts/research_ai_v3_m8vis_layout_20261008.py scripts/research_ai_v3_m8vis_visual_render_20261008.py scripts/research_vtuber_asset_probe_20261008.py
          python -m pip install --disable-pip-version-check edge-tts==7.3.1
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          echo "::group::FFmpeg and ffprobe diagnostics"
          echo "PATH=$PATH"
          uname -a
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            echo "::notice::FFmpeg tools missing; installing Ubuntu ffmpeg package"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          for tool in ffmpeg ffprobe; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool unavailable after installation"
              exit 1
            fi
            command -v "$tool"
            "$tool" -version | head -n 1
          done
          echo "::endgroup::"
      - name: Fail closed on dated numeric manifest before TTS
        run: |
          set -euo pipefail
          bash scripts/run_video_recovery_readonly_ci.sh
          node scripts/research_ai_editor_input_real_20261008.test.js
          sha256sum -c /tmp/video-recovery-proof/SHA256SUMS
          mkdir -p /tmp/ai-v3-sentence-audio
          cp /tmp/video-recovery-proof/ai-numeric-claims-v3.json /tmp/ai-v3-sentence-audio/ai-numeric-claims-v3.json
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('data_research/m5/ai-script-generation/20261008-original-script-v3-research.json'));
          const m=JSON.parse(fs.readFileSync('/tmp/ai-v3-sentence-audio/ai-numeric-claims-v3.json'));
          const s=require('./scripts/build_research_caption_source_20261008').buildResearchCaptionSource(d);
          assert.equal(m.target_date,s.target_date,'NUMERIC_MEDIA_DATE_DRIFT');
          assert.equal(m.editor_input_sha256,s.research_master_sha256,'NUMERIC_MEDIA_MASTER_DRIFT');
          assert.equal(m.publication_authorized,false);
          assert.equal(m.render_authorized,false);
          for(const id of Object.keys(m.claims))assert.ok(s.media_input.some(p=>p.claim_ids.includes(id)&&p.card_claim_ids.includes(id)),'NUMERIC_MEDIA_POINTER_MISSING '+id);
          console.log('M8VIS_PRE_TTS_NUMERIC_MANIFEST_PASS claims='+Object.keys(m.claims).length+' publication=false');
          NODE
      - name: Probe Edge TTS 7.3.1 fixed short sentence, fail closed
        run: |
          set -euo pipefail
          mkdir -p /tmp/ai-v3-sentence-audio
          python -m pip show edge-tts > /tmp/ai-v3-sentence-audio/edge-tts-version.txt
          edge-tts --voice zh-TW-YunJheNeural --rate '+15%' --text '大家好，歡迎來到 TAIWAN STOCK！' --write-media /tmp/ai-v3-sentence-audio/fixed-probe.mp3
          test -s /tmp/ai-v3-sentence-audio/fixed-probe.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/ai-v3-sentence-audio/fixed-probe.mp3 | tee /tmp/ai-v3-sentence-audio/fixed-probe-duration.txt
          sha256sum /tmp/ai-v3-sentence-audio/fixed-probe.mp3 | tee /tmp/ai-v3-sentence-audio/fixed-probe-sha256.txt
          # Optional research diagnostic: absence of metadata must not block the proven MP4 pipeline.
          python - <<'PY'
          import asyncio,hashlib,json,pathlib,subprocess
          import edge_tts
          root=pathlib.Path('/tmp/ai-v3-sentence-audio')
          async def probe():
           audio=bytearray();events=[];types={}
           communicate=edge_tts.Communicate('大家好，歡迎來到 TAIWAN STOCK！',voice='zh-TW-YunJheNeural',rate='+15%')
           async for chunk in communicate.stream():
            kind=chunk.get('type','unknown');types[kind]=types.get(kind,0)+1
            if kind=='audio':audio.extend(chunk['data'])
            elif kind=='WordBoundary':events.append({'offset_100ns':int(chunk['offset']),'duration_100ns':int(chunk['duration']),'text':chunk['text']})
           return audio,events,types
          proof={'contract':'EDGE_TTS_731_OPTIONAL_RAW_METADATA_DIAGNOSTIC','publication_authorized':False,'lip_sync_verified':False,'phoneme_alignment_verified':False,'raw_word_timing_probe_pass':False}
          try:
           audio,events,types=asyncio.run(probe())
           proof['stream_chunk_types']=types
           proof['event_count']=len(events)
           (root/'wordboundary-events.json').write_text(json.dumps(events,ensure_ascii=False,indent=2)+'\\n')
           if len(audio)>100:
            path=root/'wordboundary-probe.mp3';path.write_bytes(audio)
            proof['mp3_sha256']=hashlib.sha256(audio).hexdigest()
            duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(path)],text=True).strip())
            proof['audio_seconds']=duration
            valid=bool(events) and all(e['text'].strip() and e['offset_100ns']>=0 and e['duration_100ns']>0 for e in events) and all(events[i]['offset_100ns']<=events[i+1]['offset_100ns'] for i in range(len(events)-1))
            last=max(((e['offset_100ns']+e['duration_100ns'])/10000000 for e in events),default=0)
            proof['last_event_end_seconds']=last
            proof['raw_word_timing_probe_pass']=bool(valid and last<=duration+0.35)
            proof['diagnostic_status']='PASS' if proof['raw_word_timing_probe_pass'] else 'NO_VALID_WORD_BOUNDARIES'
           else:proof['diagnostic_status']='NO_AUDIO'
          except Exception as exc:
           proof['diagnostic_status']='PROBE_ERROR'
           proof['error_type']=type(exc).__name__
          finally:
           (root/'wordboundary-probe-proof.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\\n')
           print('EDGE_TTS_OPTIONAL_METADATA_DIAGNOSTIC status='+proof['diagnostic_status']+' events='+str(proof.get('event_count',0))+' no_lip_sync_claim=true no_publish=true')
          PY
      - name: Generate actual V3 sentence audio, never publish
        run: |
          set -euo pipefail
          mkdir -p /tmp/ai-v3-sentence-audio
          node - <<'NODE' > /tmp/ai-v3-sentence-audio/source.json
          const fs=require('fs');
          const {buildResearchCaptionSource}=require('./scripts/build_research_caption_source_20261008');
          const d=JSON.parse(fs.readFileSync('data_research/m5/ai-script-generation/20261008-original-script-v3-research.json'));
          process.stdout.write(JSON.stringify(buildResearchCaptionSource(d),null,2)+'\n');
          NODE
          python scripts/research_ai_v3_sentence_edge_tts_20261008.py /tmp/ai-v3-sentence-audio/source.json /tmp/ai-v3-sentence-audio/audio
      - name: Validate research-only shared media timeline
        run: |
          set -euo pipefail
          python scripts/research_ai_v3_sentence_media_bridge_20261008.py /tmp/ai-v3-sentence-audio
      - name: Validate V3 M8VIS timing handoff, no rendering
        run: |
          set -euo pipefail
          python scripts/research_ai_v3_m8vis_timing_handoff_20261008.py /tmp/ai-v3-sentence-audio
      - name: Validate M8VIS safe zones and uncertified editorial claims
        run: |
          set -euo pipefail
          python scripts/research_ai_v3_m8vis_layout_20261008.py /tmp/ai-v3-sentence-audio data_research/m5/ai-script-generation/20261008-original-script-v3-research.json
      - name: Render isolated V3 diagnostic MP4, not M8VIS certification
        run: |
          set -euo pipefail
          python scripts/research_ai_v3_diagnostic_render_20261008.py /tmp/ai-v3-sentence-audio
      - name: Diagnose original VTuber sprite and presenter assets
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/ai-v3-sentence-audio/vtuber-asset-probe
          python scripts/research_vtuber_asset_probe_20261008.py . /tmp/ai-v3-sentence-audio/vtuber-asset-probe
      - name: Render research M8VIS static-presenter visual preview
        run: |
          set -euo pipefail
          python scripts/research_ai_v3_m8vis_visual_render_20261008.py /tmp/ai-v3-sentence-audio .
      - name: Retain research evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-v3-sentence-audio-proof
          path: /tmp/ai-v3-sentence-audio/
          if-no-files-found: warn
          retention-days: 14
