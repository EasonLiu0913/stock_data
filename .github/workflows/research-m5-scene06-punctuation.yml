name: "[Research M5] Scene 06 punctuation differential"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check immutable source and syntax
        run: |
          node --test tests/build_daily_gainers_m5_private_plan.test.js tests/build_daily_gainers_m4_spoken_draft.test.js
          python -m py_compile scripts/diagnose_daily_gainers_m5_scene06_punctuation.py
          node scripts/build_daily_gainers_m5_private_plan.js >/dev/null
      - name: Pin previously evidenced engine
        run: python -m pip install --disable-pip-version-check edge-tts==7.2.8
      - name: Test exact original and diagnostic-only punctuation variants
        run: |
          set -o pipefail
          python scripts/diagnose_daily_gainers_m5_scene06_punctuation.py output/m5-private-preview/20261008/plan.json | tee "${RUNNER_TEMP}/scene06-punctuation.json"
      - name: Preserve diagnostic only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-scene06-punctuation-${{ github.run_id }}
          path: ${{ runner.temp }}/scene06-punctuation.json
          if-no-files-found: error
          retention-days: 14
