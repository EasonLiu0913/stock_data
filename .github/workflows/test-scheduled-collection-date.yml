name: "[07 維護更新] Scheduled Collection Date Regression"

on:
  push:
    branches: [main]
    paths:
      - 'scripts/resolve_scheduled_collection_date.js'
      - 'tests/resolve_scheduled_collection_date.test.js'
      - '.github/workflows/test-scheduled-collection-date.yml'
      - '.github/workflows/crawl-twse-mi-index.yml'
      - '.github/workflows/crawl-twse-institutional-investors.yml'
      - '.github/workflows/crawl-twse-margin-balance.yml'
      - '.github/workflows/crawl-fubon-broker-details.yml'
      - '.github/workflows/crawl-fubon-brokers-trade.yml'
      - '.github/workflows/crawl-institutional.yml'
      - '.github/workflows/retry-institutional.yml'
      - '.github/workflows/retry-sma.yml'
      - '.github/workflows/crawl-twse-institutional-summaries.yml'
      - '.github/workflows/crawl-twse-twt49u.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-collection-date-regression
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize exact regression inputs from current main
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/EasonLiu0913/stock_data/main'
          mkdir -p scripts tests data_history_sma .github/workflows
          curl -fsSL "$base/scripts/resolve_scheduled_collection_date.js" -o scripts/resolve_scheduled_collection_date.js
          curl -fsSL "$base/scripts/resolve_forecast_dates.js" -o scripts/resolve_forecast_dates.js
          curl -fsSL "$base/tests/resolve_scheduled_collection_date.test.js" -o tests/resolve_scheduled_collection_date.test.js
          curl -fsSL "$base/data_history_sma/non_trading_days.json" -o data_history_sma/non_trading_days.json

          workflows=(
            crawl-twse-mi-index.yml
            crawl-twse-institutional-investors.yml
            crawl-twse-margin-balance.yml
            crawl-fubon-broker-details.yml
            crawl-fubon-brokers-trade.yml
            crawl-institutional.yml
            retry-institutional.yml
            retry-sma.yml
            crawl-twse-institutional-summaries.yml
            crawl-twse-twt49u.yml
          )
          for name in "${workflows[@]}"; do
            curl -fsSL "$base/.github/workflows/$name" -o ".github/workflows/$name"
          done

          echo "Runner Node: $(node --version)"

      - name: Validate resolver syntax and delay semantics
        run: |
          set -euo pipefail
          node --check scripts/resolve_scheduled_collection_date.js
          node --test tests/resolve_scheduled_collection_date.test.js

      - name: Verify first-wave workflows use the shared scheduled resolver
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            .github/workflows/crawl-twse-mi-index.yml
            .github/workflows/crawl-twse-institutional-investors.yml
            .github/workflows/crawl-twse-margin-balance.yml
            .github/workflows/crawl-fubon-broker-details.yml
            .github/workflows/crawl-fubon-brokers-trade.yml
            .github/workflows/crawl-institutional.yml
            .github/workflows/retry-institutional.yml
            .github/workflows/retry-sma.yml
            .github/workflows/crawl-twse-institutional-summaries.yml
            .github/workflows/crawl-twse-twt49u.yml
          )
          for file in "${workflows[@]}"; do
            grep -q 'resolve_scheduled_collection_date.js' "$file" || {
              echo "Missing shared scheduled-date resolver in $file"
              exit 1
            }
          done

          # Legacy runner-clock behavior may remain only in explicit manual/no-date branches.
          # The scheduled branch must appear before any legacy fallback in each migrated resolver block.
          for file in "${workflows[@]}"; do
            schedule_line=$(grep -n 'EVENT_NAME.*schedule' "$file" | head -1 | cut -d: -f1 || true)
            resolver_line=$(grep -n 'resolve_scheduled_collection_date.js' "$file" | head -1 | cut -d: -f1 || true)
            if [ -z "$schedule_line" ] || [ -z "$resolver_line" ] || [ "$resolver_line" -le "$schedule_line" ]; then
              echo "Scheduled resolver wiring is malformed in $file"
              exit 1
            fi
          done

          echo "Verified shared scheduled resolver wiring for ${#workflows[@]} workflows."

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
