name: "[07 維護更新] Scheduled Collection Date Regression"

on:
  push:
    branches: [main]
    paths:
      - 'scripts/resolve_scheduled_collection_date.js'
      - 'tests/resolve_scheduled_collection_date.test.js'
      - 'tests/scheduled_date_third_wave.test.js'
      - 'tests/scheduled_date_fourth_wave.test.js'
      - 'scripts/extract_warrant_data.js'
      - 'tests/extract_warrant_data.test.js'
      - '.github/workflows/warrant-scraper.yml'
      - '.github/workflows/test-scheduled-collection-date.yml'
      - '.github/workflows/crawl-mops-monthly-revenue.yml'
      - 'scripts/crawl_mops_monthly_revenue.js'
      - 'tests/mops_monthly_revenue.test.js'
      - '.github/workflows/crawl-vix-index.yml'
      - 'scripts/crawl_vix_index.js'
      - 'tests/crawl_vix_index.test.js'
      - '.github/workflows/crawl-twse-mi-index.yml'
      - '.github/workflows/crawl-twse-institutional-investors.yml'
      - '.github/workflows/crawl-twse-margin-balance.yml'
      - '.github/workflows/crawl-fubon-broker-details.yml'
      - '.github/workflows/crawl-fubon-brokers-trade.yml'
      - '.github/workflows/crawl-institutional.yml'
      - '.github/workflows/retry-institutional.yml'
      - '.github/workflows/retry-sma.yml'
      - '.github/workflows/crawl-twse-institutional-summaries.yml'
      - '.github/workflows/crawl-twse-twt49u.yml'
      - '.github/workflows/build-twse-market-chart.yml'
      - '.github/workflows/calculate-twse-margin-maintenance.yml'
      - '.github/workflows/crawl-market-news.yml'
      - '.github/workflows/publish-daily-gainers-ai-analysis.yml'
      - '.github/workflows/prepare-market-environment.yml'
      - '.github/workflows/crawl-external-market-indicators.yml'
      - '.github/workflows/crawl-refined-product-tightness.yml'
      - '.github/workflows/crawl-rankings.yml'
      - '.github/workflows/crawl-taifex-major-institutional-traders-futures-contracts.yml'
      - '.github/workflows/crawl-taifex-major-institutional-traders-futures-options.yml'
      - 'scripts/resolve_external_market_session_date.js'
      - 'scripts/resolve_fubon_ranking_date.js'
      - 'scripts/resolve_taifex_scheduled_date.js'
      - 'scripts/crawl_taifex_major_institutional_traders_futures_options.js'
      - 'scripts/scraper_fubon.js'
      - 'scripts/scraper_fubon_foreign.js'
      - 'scripts/scraper_fubon_other.js'
      - 'scripts/crawl_refined_product_tightness.js'
      - 'tests/refined_product_tightness.test.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-collection-date-regression
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize exact regression inputs from tested SHA
        id: materialize
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ref="${TESTED_SHA}"
          base="https://raw.githubusercontent.com/EasonLiu0913/stock_data/${ref}"
          echo "TESTED_SHA=${ref}"
          echo "tested_sha=${ref}" >> "$GITHUB_OUTPUT"
          mkdir -p scripts/lib tests data_history_sma .github/workflows

          files=(
            scripts/resolve_scheduled_collection_date.js
            scripts/resolve_forecast_dates.js
            scripts/resolve_external_market_session_date.js
            scripts/resolve_fubon_ranking_date.js
            scripts/resolve_taifex_scheduled_date.js
            scripts/crawl_taifex_major_institutional_traders_futures_options.js
            scripts/crawl_external_market_indicators.js
            scripts/crawl_refined_product_tightness.js
            scripts/crawl_mops_monthly_revenue.js
            scripts/crawl_vix_index.js
            scripts/lib/range_backfill.js
            scripts/extract_warrant_data.js
            scripts/scraper_fubon.js
            scripts/scraper_fubon_foreign.js
            scripts/scraper_fubon_other.js
            tests/resolve_scheduled_collection_date.test.js
            tests/scheduled_date_third_wave.test.js
            tests/scheduled_date_fourth_wave.test.js
            tests/extract_warrant_data.test.js
            tests/refined_product_tightness.test.js
            tests/mops_monthly_revenue.test.js
            tests/crawl_vix_index.test.js
            data_history_sma/non_trading_days.json
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            curl -fsSL "$base/$file" -o "$file"
          done

          workflows=(
            crawl-twse-mi-index.yml
            crawl-twse-institutional-investors.yml
            crawl-twse-margin-balance.yml
            crawl-fubon-broker-details.yml
            crawl-fubon-brokers-trade.yml
            crawl-institutional.yml
            retry-institutional.yml
            retry-sma.yml
            crawl-twse-institutional-summaries.yml
            crawl-twse-twt49u.yml
            build-twse-market-chart.yml
            calculate-twse-margin-maintenance.yml
            crawl-market-news.yml
            publish-daily-gainers-ai-analysis.yml
            prepare-market-environment.yml
            crawl-external-market-indicators.yml
            crawl-refined-product-tightness.yml
            crawl-rankings.yml
            crawl-taifex-major-institutional-traders-futures-contracts.yml
            crawl-taifex-major-institutional-traders-futures-options.yml
            crawl-mops-monthly-revenue.yml
            crawl-vix-index.yml
            warrant-scraper.yml
          )
          for name in "${workflows[@]}"; do
            curl -fsSL "$base/.github/workflows/$name" -o ".github/workflows/$name"
          done

          echo "Runner Node: $(node --version)"

      - name: Validate resolver syntax and delay semantics
        run: |
          set -euo pipefail
          node --check scripts/resolve_scheduled_collection_date.js
          node --check scripts/resolve_forecast_dates.js
          node --check scripts/resolve_external_market_session_date.js
          node --check scripts/resolve_fubon_ranking_date.js
          node --check scripts/resolve_taifex_scheduled_date.js
          node --check scripts/crawl_taifex_major_institutional_traders_futures_options.js
          node --check scripts/crawl_external_market_indicators.js
          node --check scripts/crawl_refined_product_tightness.js
          node --check scripts/crawl_mops_monthly_revenue.js
          node --check scripts/crawl_vix_index.js
          node --check scripts/extract_warrant_data.js
          node --check scripts/scraper_fubon.js
          node --check scripts/scraper_fubon_foreign.js
          node --check scripts/scraper_fubon_other.js
          node --check tests/scheduled_date_fourth_wave.test.js
          node --check tests/extract_warrant_data.test.js
          node --check tests/mops_monthly_revenue.test.js
          node --check tests/crawl_vix_index.test.js
          node --test tests/resolve_scheduled_collection_date.test.js tests/scheduled_date_third_wave.test.js tests/scheduled_date_fourth_wave.test.js tests/extract_warrant_data.test.js tests/refined_product_tightness.test.js tests/mops_monthly_revenue.test.js tests/crawl_vix_index.test.js

      - name: Verify first-wave workflows use the shared scheduled resolver
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            .github/workflows/crawl-twse-mi-index.yml
            .github/workflows/crawl-twse-institutional-investors.yml
            .github/workflows/crawl-twse-margin-balance.yml
            .github/workflows/crawl-fubon-broker-details.yml
            .github/workflows/crawl-fubon-brokers-trade.yml
            .github/workflows/crawl-institutional.yml
            .github/workflows/retry-institutional.yml
            .github/workflows/retry-sma.yml
            .github/workflows/crawl-twse-institutional-summaries.yml
            .github/workflows/crawl-twse-twt49u.yml
          )
          for file in "${workflows[@]}"; do
            grep -q 'resolve_scheduled_collection_date.js' "$file" || { echo "Missing shared scheduled-date resolver in $file"; exit 1; }
          done
          echo "Verified shared scheduled resolver wiring for ${#workflows[@]} first-wave workflows."

      - name: Verify second-wave workflow semantics
        shell: bash
        run: |
          set -euo pipefail
          chart=.github/workflows/build-twse-market-chart.yml
          margin=.github/workflows/calculate-twse-margin-maintenance.yml
          news=.github/workflows/crawl-market-news.yml
          gainers=.github/workflows/publish-daily-gainers-ai-analysis.yml
          environment=.github/workflows/prepare-market-environment.yml
          for file in "$chart" "$margin" "$news" "$gainers" "$environment"; do
            grep -q 'resolve_scheduled_collection_date.js' "$file" || { echo "Missing shared scheduled resolver in $file"; exit 1; }
          done
          grep -q -- '--day-boundary-hour 8' "$chart"
          grep -q -- '--policy same_calendar_date' "$news"
          grep -q 'crawl_market_news.js --date' "$news"
          grep -q 'generate_market_risk_snapshot.js --date' "$news"
          grep -q 'scheduled_at_utc' "$environment"
          echo 'Verified five second-wave workflow contracts.'

      - name: Verify third-wave workflow semantics
        shell: bash
        run: |
          set -euo pipefail
          external=.github/workflows/crawl-external-market-indicators.yml
          eia=.github/workflows/crawl-refined-product-tightness.yml
          rankings=.github/workflows/crawl-rankings.yml
          taifex=.github/workflows/crawl-taifex-major-institutional-traders-futures-contracts.yml

          for file in "$external" "$eia" "$rankings" "$taifex"; do
            grep -q 'resolve_scheduled_collection_date.js' "$file" || { echo "Missing intended-occurrence resolver in $file"; exit 1; }
          done

          grep -q 'resolve_external_market_session_date.js --now "$scheduled_at"' "$external"
          grep -q 'args=(--date "$TARGET_DATE")' "$external"
          grep -q 'validate_external_market_snapshot.js' "$external"

          grep -q -- '--time-zone UTC' "$eia"
          grep -q 'args+=(--date "$TARGET_DATE")' "$eia"
          grep -q 'observation_date' "$eia"

          grep -q 'FUBON_DATE_ANCHOR' "$rankings"
          for file in scripts/scraper_fubon.js scripts/scraper_fubon_foreign.js scripts/scraper_fubon_other.js; do
            grep -q 'resolveFubonRankingDate' "$file"
            if grep -q 'new Date().getFullYear' "$file"; then echo "Runner-year fallback remains in $file"; exit 1; fi
            if grep -q "toISOString().slice(0, 10).replace(/-/g, '')" "$file"; then echo "Runner-date fallback remains in $file"; exit 1; fi
          done

          grep -q -- '--time-zone Asia/Taipei' "$taifex"
          grep -q 'resolve_taifex_scheduled_date.js' "$taifex"
          grep -q -- '--date "$DATE"' "$taifex"

          echo 'Verified four third-wave workflow contracts.'

      - name: Verify fifth-wave TAIFEX futures/options semantics
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/crawl-taifex-major-institutional-traders-futures-options.yml
          crawler=scripts/crawl_taifex_major_institutional_traders_futures_options.js

          grep -q "if: github.event_name == 'schedule'" "$workflow"
          grep -q 'resolve_scheduled_collection_date.js' "$workflow"
          grep -q -- '--time-zone Asia/Taipei' "$workflow"
          grep -q 'resolve_taifex_scheduled_date.js --base-date "$base_date"' "$workflow"
          grep -q -- '--date "$TAIFEX_EXPECTED_DATE"' "$workflow"
          grep -q 'github.event.inputs.date' "$workflow"
          grep -q 'elif \[ -n ' "$workflow"
          grep -q 'getPayloadDate(csvText)' "$crawler"
          grep -q 'resolvePayloadArtifact(csvText, expectedDate)' "$crawler"
          grep -q 'This open-data URL only returns the latest available file' "$crawler"
          grep -q 'outputFile: `${payloadDate}_${OUTPUT_SUFFIX}.csv`' "$crawler"

          echo 'Verified fifth-wave TAIFEX futures/options expected-date contract.'

      - name: Verify seventh-wave MOPS and VIX scheduled target semantics
        shell: bash
        run: |
          set -euo pipefail
          mops=.github/workflows/crawl-mops-monthly-revenue.yml
          vix=.github/workflows/crawl-vix-index.yml

          for file in "$mops" "$vix"; do
            grep -q 'resolve_scheduled_collection_date.js' "$file" || { echo "Missing scheduled occurrence resolver in $file"; exit 1; }
            grep -q 'scheduled_at_utc' "$file" || { echo "Missing intended occurrence handoff in $file"; exit 1; }
            grep -q 'github.event.schedule' "$file" || { echo "Missing schedule identity in $file"; exit 1; }
          done

          grep -q 'autoRevenueMonth(new Date(process.argv\[1\]))' "$mops"
          grep -q 'autoRevenueMonth())' "$mops"
          grep -q 'INPUT_MONTH' "$mops"
          grep -q 'resolveAutomaticTargetDate(new Date(process.argv\[1\]))' "$vix"
          grep -q 'crawl_vix_index.js --resolve-date)' "$vix"
          grep -q 'INPUT_DATE' "$vix"
          grep -q 'Automatic date has no exact VIX session; skip without failure.' "$vix"
          echo 'Verified seventh-wave MOPS/VIX intended-occurrence wiring and preserved manual paths.'

      - name: Verify warrant source-date fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          script=scripts/extract_warrant_data.js
          workflow=.github/workflows/warrant-scraper.yml

          grep -q 'function buildWarrantFilename' "$script"
          grep -q 'refusing to fabricate an artifact date from runner time' "$script"
          if grep -q 'twse_warrant_.*new Date' "$script"; then
            echo 'Runner-date warrant filename fallback remains.'
            exit 1
          fi
          grep -q 'node --test tests/extract_warrant_data.test.js' "$workflow"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/warrant-scraper.yml').read_text()
          start = text.index('      - name: Run TWSE warrant extractor')
          end = text.index('      - name: Generate TWSE files.json only', start)
          block = text[start:end]
          if 'continue-on-error: true' in block:
              raise SystemExit('Warrant extractor still ignores source-date failures')
          PY
          echo 'Verified warrant source date remains source-owned and degraded fallback fails closed.'

      - name: Confirm exact tested SHA
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
          MATERIALIZED_SHA: ${{ steps.materialize.outputs.tested_sha }}
        run: |
          set -euo pipefail
          test "$TESTED_SHA" = "$MATERIALIZED_SHA"
          echo "Regression tested exact commit: ${TESTED_SHA}"

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/EasonLiu0913/stock_data/${TESTED_SHA}/scripts/write_workflow_schedule_summary.js" | node
