name: '[一次性完成] 策略公式手機按鈕排版'

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-formula-mobile-button-layout.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: finalize-formula-mobile-button-layout
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump asset version and add regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('scripts/install_prediction_tag_strategy_ui.js'): [
                  ("prediction-formula-builder.js?v=2", "prediction-formula-builder.js?v=3"),
              ],
              Path('.github/workflows/install-prediction-tag-strategy-ui.yml'): [
                  ("prediction-formula-builder.js?v=2", "prediction-formula-builder.js?v=3"),
              ],
              Path('public/prediction-dashboard.html'): [
                  ("prediction-formula-builder.js?v=2", "prediction-formula-builder.js?v=3"),
              ],
          }

          for path, pairs in replacements.items():
              source = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if source.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one {old!r}, found {source.count(old)}')
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8')

          test_path = Path('tests/prediction_formula_builder_responsive_ui.test.js')
          test_source = test_path.read_text(encoding='utf-8')
          marker = "mobile action buttons use dedicated rows for long labels"
          if marker not in test_source:
              test_source += '''\n\ntest('mobile action buttons use dedicated rows for long labels', () => {\n  assert.match(source, /grid-template-areas:\\"copy copy\\" \\"not remove\\" \\"mobile mobile\\"/);\n  assert.match(source, /\\.pf-node>button\\[data-a=\\"not\\"\\]\\{grid-area:not\\}/);\n  assert.match(source, /\\.pf-node>button\\[data-a=\\"del\\"\\]\\{grid-area:remove\\}/);\n  assert.match(source, /white-space:nowrap/);\n  assert.match(source, /overflow:hidden;text-overflow:ellipsis/);\n});\n'''
              test_path.write_text(test_source, encoding='utf-8')
          PY

      - name: Validate permanent formula UI workflow
        run: |
          node --check public/prediction-formula-builder.js
          node --check scripts/install_prediction_tag_strategy_ui.js
          node --test \
            tests/prediction_formula_builder.test.js \
            tests/prediction_formula_builder_responsive_ui.test.js \
            tests/install_prediction_tag_strategy_ui.test.js
          node scripts/install_prediction_tag_strategy_ui.js
          grep -Fq 'prediction-formula-builder.js?v=3' public/prediction-dashboard.html
          grep -Fq 'prediction-formula-builder.js?v=3' scripts/install_prediction_tag_strategy_ui.js
          grep -Fq 'prediction-formula-builder.js?v=3' .github/workflows/install-prediction-tag-strategy-ui.yml

      - name: Commit final layout and remove bootstrap
        shell: bash
        run: |
          rm .github/workflows/finalize-formula-mobile-button-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/prediction-formula-builder.js \
            public/prediction-dashboard.html \
            scripts/install_prediction_tag_strategy_ui.js \
            .github/workflows/install-prediction-tag-strategy-ui.yml \
            tests/prediction_formula_builder_responsive_ui.test.js \
            .github/workflows/finalize-formula-mobile-button-layout.yml
          git commit -m 'test: lock mobile formula action layout'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

  deploy_pages:
    name: Deploy GitHub Pages
    needs: finalize
    uses: ./.github/workflows/deploy-pages.yml
