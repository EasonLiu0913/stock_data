name: "[Research] Daily Data Recovery Experiment 05 Inventory"
on:
  push:
    branches: [research/daily-data-recovery-v2-exp01-20261013]
    paths:
      - 'scripts/research/experiment05_listener_audit.js'
      - '.github/workflows/research-daily-recovery-exp05.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit all local workflow files and fail closed on writes
        run: |
          node scripts/research/experiment05_listener_audit.js
          test -f tmp/research/experiment05-matrix.json
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        with:
          name: experiment05-listener-matrix
          path: tmp/research/experiment05-matrix.json
          retention-days: 7
