name: "research: checkpoint fourth prospective catalyst evidence"

on:
  push:
    branches: [main]
    paths:
      - "data_research/institutional-flow/prospective-catalyst-fourth-window-audit-trigger-v1.json"

permissions:
  contents: write

concurrency:
  group: institutional-accumulation-fourth-window-audit-v1
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout bounded evidence
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json
            /data_research/institutional-flow/official-disclosure-raw/prospective-catalyst-pit/
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate bounded fourth-window evidence
        shell: bash
        run: |
          set -euo pipefail
          delta_before=$(git hash-object data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json)
          cross_before=$(git hash-object data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json)
          test "$delta_before" = "cc5683ce3e33cb9b9c6ae74c42eb5c3a26f0ed00"
          test "$cross_before" = "9dbee14b300980fb46ea7251b5707429071a80bf"

          node scripts/audit_institutional_accumulation_catalyst_prospective_observations.js --write
          node scripts/audit_institutional_accumulation_catalyst_prospective_window_deltas.js --write
          node scripts/audit_institutional_accumulation_catalyst_prospective_cross_day_window.js --write
          node scripts/audit_institutional_accumulation_catalyst_prospective_fourth_window_longitudinal.js --write

          test "$(git hash-object data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json)" = "$delta_before"
          test "$(git hash-object data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json)" = "$cross_before"

          node - <<'NODE'
          const fs = require('node:fs');
          const obs = JSON.parse(fs.readFileSync('data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json'));
          const longitudinal = JSON.parse(fs.readFileSync('data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json'));
          if (obs.valid_observation_count !== 24 || obs.invalid_observation_count !== 0 || obs.conflict_count !== 0) throw new Error('observation counts mismatch');
          if (obs.unique_immutable_snapshot_count !== 24) throw new Error('immutable count mismatch');
          for (const stock of ['1102','1104','1216']) {
            const x = obs.stocks[stock];
            if (!x || x.total !== 8 || x.listing !== 4 || x.detail !== 4) throw new Error('stock counts mismatch ' + stock);
          }
          if (longitudinal.observation_count !== 24 || longitudinal.chain_count !== 6) throw new Error('longitudinal counts mismatch');
          if (!longitudinal.fourth_window_gate.later_asia_taipei_date || !longitudinal.fourth_window_gate.minimum_elapsed_satisfied) throw new Error('fourth-window eligibility mismatch');
          NODE
      - name: Race-safe checkpoint evidence
        shell: bash
        run: |
          set -euo pipefail
          cp data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json /tmp/observation.json
          cp data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json /tmp/longitudinal.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/observation.json data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json
            cp /tmp/longitudinal.json data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json
            git add data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json
            git add --sparse data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "research: checkpoint fourth prospective catalyst evidence"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Verify durable remote evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json > /tmp/remote-observation.json
          git show origin/main:data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json > /tmp/remote-longitudinal.json
          cmp -s /tmp/observation.json /tmp/remote-observation.json
          cmp -s /tmp/longitudinal.json /tmp/remote-longitudinal.json
