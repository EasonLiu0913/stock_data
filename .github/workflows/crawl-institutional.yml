name: "[01 台股資料] 富邦－個股近30日法人歷史"

on:
  schedule:
    # 每天 15:11 台北時間 (07:11 UTC)
    - cron: '11 7 * * *'
    # 每天 17:23 台北時間 (09:23 UTC)
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target Date (YYYYMMDD format, e.g., 20260204)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl-institutional
  cancel-in-progress: false

jobs:
  crawl-institutional:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Institutional crawler
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            node scripts/crawl_institutional_data.js --date ${{ github.event.inputs.date }}
          else
            node scripts/crawl_institutional_data.js
          fi

      - name: Reconcile Institutional completeness and retry list
        run: |
          node --check scripts/reconcile_institutional_data.js
          if [ -n "${{ github.event.inputs.date }}" ]; then
            node scripts/reconcile_institutional_data.js --date ${{ github.event.inputs.date }}
          else
            node scripts/reconcile_institutional_data.js
          fi

      - name: Generate Fubon files.json only
        run: node scripts/generate_file_lists.js --only data_fubon

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_fubon/

          if git diff --staged --quiet; then
            if [ -n "$(git status --porcelain)" ]; then
              echo "Unexpected uncommitted changes remain even though there are no institutional changes:"
              git status --short
              exit 1
            fi
            echo "No changes to commit"
            exit 0
          fi

          CURRENT_DATE=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          git commit -m "🏦 Update Institutional data - ${CURRENT_DATE}"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed, retry ${attempt}/5..."
            sleep 5
          done

          echo "Failed to push institutional data after 5 attempts."
          exit 1

  deploy-pages:
    name: 法人資料更新後發布 GitHub Pages
    needs: crawl-institutional
    if: needs.crawl-institutional.result == 'success'
    uses: ./.github/workflows/deploy-pages.yml
