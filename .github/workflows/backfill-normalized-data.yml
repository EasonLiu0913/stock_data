name: "[06 回填修復] 補齊法人與券商正規化資料"

on:
  workflow_dispatch:
    inputs:
      data_type:
        description: '資料類型'
        required: true
        type: choice
        options:
          - all
          - institutional
          - broker
        default: all
      date:
        description: '單一日期 YYYYMMDD（與起訖日期擇一）'
        required: false
        type: string
      from_date:
        description: '起始日期 YYYYMMDD'
        required: false
        type: string
      to_date:
        description: '結束日期 YYYYMMDD'
        required: false
        type: string
      force:
        description: '重建所有已存在檔案'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '只檢查，不寫入或提交'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: backfill-normalized-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backfill normalized data
        shell: bash
        env:
          DATA_TYPE: ${{ inputs.data_type }}
          DATE: ${{ inputs.date }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--type "$DATA_TYPE" --repair-invalid)
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ -n "$FROM_DATE" ]; then args+=(--from "$FROM_DATE"); fi
          if [ -n "$TO_DATE" ]; then args+=(--to "$TO_DATE"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/backfill_normalized_data.js "${args[@]}"

      - name: Test normalizers
        run: node --test tests/backfill_normalized_data.test.js

      - name: Commit normalized files
        if: inputs.dry_run != true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_normalized
          if git diff --cached --quiet; then
            echo "No normalized data changes"
            exit 0
          fi
          git commit -m "data: backfill normalized institutional and broker history"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed; retry ${attempt}/5"
            sleep 5
          done
          exit 1
