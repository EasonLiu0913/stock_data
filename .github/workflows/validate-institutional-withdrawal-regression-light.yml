name: "[07 研究] Institutional Withdrawal Validation Preflight [RETIRED]"

on:
  workflow_dispatch:

permissions:
  contents: read

# Retired guard. This preflight encoded bootstrap assumptions from before
# non-development TDCC/Broker coverage existed, so those assumptions now fail by
# design. Current frozen regression/coverage checks live in
# validate-institutional-withdrawal-lifecycle-v1.yml, while network collection
# must use the physical-batch Recovery workflow. Never restore the old
# `nonDevTdcc.length === 0` / pre-expansion assumptions here.

jobs:
  retired:
    name: Stale bootstrap preflight retired
    runs-on: ubuntu-latest
    steps:
      - name: Explain current validation entry points
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Validation bootstrap preflight retired

          This workflow intentionally performs no validation/network work.

          Use **Validate Institutional Withdrawal Lifecycle v1** for frozen lifecycle regression and outcome-blind coverage checks. Use **Expand Institutional Withdrawal Validation Coverage v1 Recovery** for physical-batch coverage expansion.
          EOF

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
