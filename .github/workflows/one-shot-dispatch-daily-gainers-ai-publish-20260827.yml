name: '[07 研究] One-shot dispatch 20260827 5% AI publish'

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-dispatch-daily-gainers-ai-publish-20260827.yml'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch formal validated publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-daily-gainers-ai-analysis.yml/dispatches" \
            -f ref=main \
            -f 'inputs[date]=20260827'
          echo 'Dispatched formal 20260827 AI publication workflow.'
