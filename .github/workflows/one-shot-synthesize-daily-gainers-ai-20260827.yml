name: '[07 研究] One-shot 20260827 5% AI synthesis'

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-synthesize-daily-gainers-ai-20260827.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: one-shot-daily-gainers-ai-20260827
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Synthesize exact-date AI pending file
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/synthesize_daily_gainers_ai_from_complete_facts.js
          node scripts/synthesize_daily_gainers_ai_from_complete_facts.js 20260827
          node scripts/daily_gainers_ai_contract_cli.js assert-ai research_pending/daily-gainers-ai/20260827.json
          node scripts/validate_daily_gainers_ai_analysis.js 20260827 research_pending/daily-gainers-ai/20260827.json
      - name: Commit pending AI with push-race recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git add research_pending/daily-gainers-ai/20260827.json
            if git diff --cached --quiet; then
              echo 'Pending AI is already current'
              exit 0
            fi
            git commit -m 'analysis: synthesize daily 5% full analysis 20260827'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt rejected; rebuilding from latest main" >&2
            git fetch origin main
            git reset --hard origin/main
            node scripts/synthesize_daily_gainers_ai_from_complete_facts.js 20260827
            node scripts/daily_gainers_ai_contract_cli.js assert-ai research_pending/daily-gainers-ai/20260827.json
            node scripts/validate_daily_gainers_ai_analysis.js 20260827 research_pending/daily-gainers-ai/20260827.json
            sleep $((attempt * 3))
          done
          echo 'Failed to push pending AI after retries' >&2
          exit 1
      - name: Dispatch formal validated publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-daily-gainers-ai-analysis.yml/dispatches" \
            -f ref=main \
            -f 'inputs[date]=20260827'
          echo 'Dispatched formal 20260827 AI publication workflow.'
