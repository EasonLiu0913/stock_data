name: "[02 外部市場] Crawl Market News"

on:
  schedule:
    # 台北時間 04:40：收集美股收盤後、台股開盤前的海外與 ADR 相關消息。
    - cron: '40 20 * * *'
    # 台北時間 15:50：收集台股收盤後的法人、盤勢與政策消息。
    - cron: '50 7 * * *'
    # 台北時間 20:17 再續抓／檢查一次。
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Collection date (YYYYMMDD). Leave empty for today in Taipei.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: crawl-market-news
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crawl market news
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            node scripts/crawl_market_news.js --date "${{ inputs.date }}"
          else
            node scripts/crawl_market_news.js
          fi

      - name: Generate market risk snapshot
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            node scripts/generate_market_risk_snapshot.js --date "${{ inputs.date }}"
          else
            node scripts/generate_market_risk_snapshot.js
          fi

      - name: Generate relevant files.json only
        run: node scripts/generate_file_lists.js --only data_market_news,data_market_risk

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/market_news_sources.json config/stock_news_aliases.json data_market_news/ data_market_risk/

          if git diff --staged --quiet; then
            if [ -n "$(git status --porcelain)" ]; then
              echo "Unexpected uncommitted changes remain even though there are no market-news changes:"
              git status --short
              exit 1
            fi
            echo "No market news changes"
            exit 0
          fi

          current_date=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          git commit -m "chore: update market news ${current_date}"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed, retry ${attempt}/5..."
            sleep 5
          done

          echo "Failed to push after 5 attempts."
          exit 1
