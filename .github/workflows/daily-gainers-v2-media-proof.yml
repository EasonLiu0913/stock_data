name: "[08 影片] V2 Text Media Proof"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-gainers-v2-media-proof.yml'
      - 'video_scripts/daily-gainers/v2/20261008/master.json'
      - 'scripts/daily_gainers_text_variants.js'
      - 'tests/daily_gainers_text_variants.test.js'
      - 'scripts/verify_daily_gainers_v2_media_proof.js'
      - 'scripts/build_daily_gainers_v2_slides.js'
permissions:
  contents: read
jobs:
  media-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin fonts-noto-cjk
          pip install edge-tts mutagen pypinyin
      - name: Validate full nine-scene input
        run: |
          node tests/daily_gainers_text_variants.test.js
          node tests/daily_gainers_v2_full_20261008.test.js
      - name: Verify punctuation subtitle segmentation
        run: python -m unittest discover -s tests -p 'test_daily_gainers_caption_segments.py'
      - name: Generate v2 plan
        run: |
          node scripts/build_daily_gainers_v2_preview.js 20261008
          mkdir -p output/daily-gainers-video/20261008
          cp output/daily-gainers-v2-preview/20261008/*.json output/daily-gainers-video/20261008/
          node scripts/build_daily_gainers_v2_slides.js 20261008
      - name: Validate presentation cards
        run: |
          node -e 'const fs=require("fs");const p="output/daily-gainers-video/20261008/slide-manifest.json";const m=JSON.parse(fs.readFileSync(p));if(m.slides.length!==9||m.slides[0].type!=="overview"||m.slides[8].type!=="checklist"||m.slides.some(x=>x.points<2))process.exit(1);console.log("SLIDE_QA_PASS")'
      - name: Generate speech
        env:
          YOUTUBE_TTS_VOICE: zh-TW-YunJheNeural
          YOUTUBE_TTS_RATE: "+15%"
        run: python scripts/synthesize_daily_gainers_tts.py output/daily-gainers-video/20261008/plan.json
      - name: Generate lip sync
        run: python scripts/build_daily_gainers_lipsync.py output/daily-gainers-video/20261008/plan.json
      - name: Render video
        run: node scripts/render_daily_gainers_video.js 20261008
      - name: Generate subtitles
        run: python scripts/build_daily_gainers_srt.py output/daily-gainers-video/20261008/plan.json
      - name: Verify complete speech and subtitle QA
        run: node scripts/verify_daily_gainers_v2_media_proof.js 20261008
      - name: Create private YouTube proof metadata
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("output/daily-gainers-video/20261008/metadata.json",JSON.stringify({title:"【測試】2026/10/08 每日5%強勢股 V2字幕對齊驗收",description:"九場景字幕與語音對齊測試；請開啟 CC 中文字幕。",tags:["台股","字幕驗收"],categoryId:"25"}))'
      - name: Upload private proof to YouTube
        id: youtube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/upload_youtube.js output/daily-gainers-video/20261008/daily-gainers-20261008.mp4 output/daily-gainers-video/20261008/metadata.json
      - name: Upload Traditional Chinese caption track
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/upload_youtube_caption.js "${{ steps.youtube.outputs.video_id }}" output/daily-gainers-video/20261008/daily-gainers-20261008.zh-TW.srt zh-TW 繁體中文
      - name: Link to YouTube proof
        if: success()
        run: echo "Private test video ${{ steps.youtube.outputs.watch_url }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Include browser preview dashboard
        if: always()
        run: |
          mkdir -p output/daily-gainers-video/20261008
          cp public/daily-gainers-v2-video-preview.html output/daily-gainers-video/20261008/video-preview.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-gainers-v2-media-proof
          path: output/daily-gainers-video/20261008/
          retention-days: 14
