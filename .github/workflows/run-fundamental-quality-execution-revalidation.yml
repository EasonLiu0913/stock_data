name: '[07 研究] 財報品質訊號－可執行進場價驗證'

# Narrow push trigger exists only to run the initial/finalizing revalidation after workflow changes.
on:
  push:
    paths:
      - '.github/workflows/run-fundamental-quality-execution-revalidation.yml'
  workflow_dispatch:
    inputs:
      start_month:
        description: '起始月 YYYYMM'
        required: true
        type: string
        default: '202401'
      end_month:
        description: '結束月 YYYYMM'
        required: true
        type: string
        default: '202606'

permissions:
  contents: write

concurrency:
  group: fundamental-quality-execution-revalidation
  cancel-in-progress: false

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate execution study
        run: |
          set -euo pipefail
          node --check scripts/summarize_fundamental_quality_execution_revalidation.js
          node --check scripts/update_fundamental_execution_research_docs.js
          node --test tests/fundamental_quality_execution_revalidation.test.js

      - name: Build execution revalidation
        env:
          START_MONTH: ${{ inputs.start_month || '202401' }}
          END_MONTH: ${{ inputs.end_month || '202606' }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          node scripts/summarize_fundamental_quality_execution_revalidation.js \
            --start-month "$START_MONTH" \
            --end-month "$END_MONTH"

      - name: Validate research output
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'data_prediction_analysis/quarterly-financial-quality/fundamental-quality-execution-revalidation.json';
          const p = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (p.dataset !== 'fundamental_quality_execution_revalidation') throw new Error('unexpected dataset');
          if (p.strategy_label !== '財報品質訊號') throw new Error('unexpected strategy label');
          if (!(p.coverage?.candidate_events > 0)) throw new Error('zero candidates');
          if (!(p.coverage?.execution_price_complete_events > 0)) throw new Error('zero executable price coverage');
          if (!Array.isArray(p.rows) || p.rows.length !== 21) throw new Error(`expected 21 rows, got ${p.rows?.length}`);
          const ids = new Set(p.rows.map(r => r.policy_id));
          for (const id of ['signal_close', 'next_open', 'next_close']) if (!ids.has(id)) throw new Error(`missing ${id}`);
          for (const horizon of ['d1','d3','d5','d10','d20','d40','d60']) if (!p.rows.some(r => r.horizon === horizon)) throw new Error(`missing ${horizon}`);
          if (p.production_recommendation?.policy_id !== 'next_close') throw new Error(`unexpected recommendation ${p.production_recommendation?.policy_id}`);
          const focus = p.rows.filter(r => ['d5','d20','d60'].includes(r.horizon)).map(r => ({
            policy: r.policy_id,
            horizon: r.horizon,
            trades: r.trades,
            avg: r.endpoint?.average_pct,
            median: r.endpoint?.median_pct,
            positive: r.endpoint?.positive_rate_pct,
            mfe: r.mfe?.median_pct,
            mae: r.mae?.median_pct,
            vs_signal_close: r.vs_signal_close || null,
          }));
          console.log(JSON.stringify({ coverage: p.coverage, gap: p.gap_analysis?.overall, focus, recommendation: p.production_recommendation }, null, 2));
          NODE

      - name: Update research log and corrected summary
        run: |
          set -euo pipefail
          node scripts/update_fundamental_execution_research_docs.js

      - name: Validate finalized documentation
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('data_prediction_analysis/quarterly-financial-quality/two-stage-fundamental-quality-phase3-corrected-summary.json', 'utf8'));
          if (summary.conclusion?.next_day_execution_validated !== true) throw new Error('next-day execution still not validated');
          if (summary.conclusion?.production_execution_policy !== 'next_close') throw new Error('production policy not next_close');
          if (summary.corrected_direct_d60?.trades !== 104) throw new Error(`unexpected comprehensive D60 trades ${summary.corrected_direct_d60?.trades}`);
          const log = fs.readFileSync('docs/two-stage-fundamental-quality-research-log.md', 'utf8');
          if (!log.includes('EXECUTION_REVALIDATION_20260811_START')) throw new Error('research log section missing');
          if (!log.includes('**正式建議：`next_close`（隔日收盤）**')) throw new Error('research recommendation missing');
          console.log(JSON.stringify({ corrected_d60: summary.corrected_direct_d60, execution: summary.execution_revalidation, conclusion: summary.conclusion }, null, 2));
          NODE

      - name: Commit research result and documentation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data_prediction_analysis/quarterly-financial-quality/fundamental-quality-execution-revalidation.json \
            data_prediction_analysis/quarterly-financial-quality/two-stage-fundamental-quality-phase3-corrected-summary.json \
            docs/two-stage-fundamental-quality-research-log.md
          if git diff --cached --quiet; then
            echo 'No execution revalidation changes'
            exit 0
          fi
          git commit -m "analysis: finalize executable entry price revalidation"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          echo '## 財報品質訊號－可執行進場價驗證' >> "$GITHUB_STEP_SUMMARY"
          echo '- 比較：訊號日收盤 benchmark、隔日開盤、隔日收盤' >> "$GITHUB_STEP_SUMMARY"
          echo '- Horizons：D1 / D3 / D5 / D10 / D20 / D40 / D60' >> "$GITHUB_STEP_SUMMARY"
          echo '- 額外分析：overnight gap、MFE、MAE、相對 signal-close 報酬損耗' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production execution：next_close（隔日收盤）' >> "$GITHUB_STEP_SUMMARY"
          echo '- 舊 Phase 3 +26.1619% headline 已標記為 sparse-price evidence，改以完整價格 coverage 結果為準' >> "$GITHUB_STEP_SUMMARY"
