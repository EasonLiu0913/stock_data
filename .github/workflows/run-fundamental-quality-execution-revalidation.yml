name: '[07 研究] 財報品質訊號－可執行進場價驗證'

on:
  workflow_dispatch:
    inputs:
      start_month:
        description: '起始月 YYYYMM'
        required: true
        type: string
        default: '202401'
      end_month:
        description: '結束月 YYYYMM'
        required: true
        type: string
        default: '202606'

permissions:
  contents: write

concurrency:
  group: fundamental-quality-execution-revalidation
  cancel-in-progress: false

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate execution study
        run: |
          set -euo pipefail
          node --check scripts/summarize_fundamental_quality_execution_revalidation.js
          node --test tests/fundamental_quality_execution_revalidation.test.js

      - name: Build execution revalidation
        env:
          START_MONTH: ${{ inputs.start_month }}
          END_MONTH: ${{ inputs.end_month }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          node scripts/summarize_fundamental_quality_execution_revalidation.js \
            --start-month "$START_MONTH" \
            --end-month "$END_MONTH"

      - name: Validate research output
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'data_prediction_analysis/quarterly-financial-quality/fundamental-quality-execution-revalidation.json';
          const p = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (p.dataset !== 'fundamental_quality_execution_revalidation') throw new Error('unexpected dataset');
          if (p.strategy_label !== '財報品質訊號') throw new Error('unexpected strategy label');
          if (!(p.coverage?.candidate_events > 0)) throw new Error('zero candidates');
          if (!(p.coverage?.execution_price_complete_events > 0)) throw new Error('zero execution coverage');
          if (!Array.isArray(p.rows) || p.rows.length !== 21) throw new Error(`expected 21 rows, got ${p.rows?.length}`);
          for (const id of ['signal_close', 'next_open', 'next_close']) {
            if (!p.rows.some(r => r.policy_id === id)) throw new Error(`missing ${id}`);
          }
          for (const horizon of ['d1','d3','d5','d10','d20','d40','d60']) {
            if (!p.rows.some(r => r.horizon === horizon)) throw new Error(`missing ${horizon}`);
          }
          if (p.production_recommendation?.policy_id !== 'next_close') {
            throw new Error(`unexpected recommendation ${p.production_recommendation?.policy_id}`);
          }
          NODE

      - name: Commit research result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_prediction_analysis/quarterly-financial-quality/fundamental-quality-execution-revalidation.json
          if git diff --cached --quiet; then
            echo 'No execution revalidation changes'
            exit 0
          fi
          git commit -m "analysis: rebuild executable entry price revalidation"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          echo '## 財報品質訊號－可執行進場價驗證' >> "$GITHUB_STEP_SUMMARY"
          echo '- 比較：訊號日收盤 benchmark、隔日開盤、隔日收盤' >> "$GITHUB_STEP_SUMMARY"
          echo '- Horizons：D1 / D3 / D5 / D10 / D20 / D40 / D60' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production execution：next_close（隔日收盤）' >> "$GITHUB_STEP_SUMMARY"
