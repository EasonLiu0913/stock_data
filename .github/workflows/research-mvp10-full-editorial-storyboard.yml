name: "[Research Only] MVP10 Complete Nine-Scene Editorial Draft"
on:
  push:
    branches:
      - research/daily-video-mvp10-a-20261029
    paths:
      - .github/workflows/research-mvp10-full-editorial-storyboard.yml
permissions:
  contents: read
jobs:
  storyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Enforce research only
        run: |
          test "$GITHUB_REF_NAME" = "research/daily-video-mvp10-a-20261029"
          test "$GITHUB_REF_TYPE" = "branch"
      - uses: actions/checkout@v4
        with:
          ref: research/daily-video-mvp10-a-20261029
          persist-credentials: false
          sparse-checkout: |
            scripts/research_mvp10_full_editorial_storyboard.js
            scripts/research_mvp10_candidate_aggregate.js
            scripts/research_mvp10_isolated_candidate_workspace.js
            scripts/research_mvp10_dated_universe_classification.js
            scripts/research_mvp10_conditional_editorial_drafts.js
            scripts/research_mvp10_9919_official_claim_gate.js
            scripts/daily_gainers_brand_opening.js
            scripts/daily_gainers_presentation_contract.js
            tests/research_mvp10_full_editorial_storyboard.test.js
            video_scripts/daily-gainers/20261008.json
            config/daily-gainers-theme-taxonomy.json
            data_daily_gain_over_5/20261008.json
            data_daily_gain_over_5/analysis-facts/20261008.json
            data_daily_gain_over_5/analysis-news/20261008.json
            data_daily_gain_over_5/analysis-ai/20261008.json
            data_daily_gain_over_5/analysis/20261008.json
            data_twse/twse_industry_Stock.csv
            data_twse/twse_industry_InnovationBoard.csv
            data_twse/twse_industry_TDR.csv
            data_twse/twse_industry_ETF.csv
            data_twse_mi_index/20261008_twse_mi_index.json
            data_twse_foreign_investors/20261008_twse_foreign_investors.json
            data_twse_investment_trust/20261008_twse_investment_trust.json
            data_twse_dealers/20261008_twse_dealers.json
            data_twse_margin_balance/20261008_twse_margin_balance.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate full storyboard and unchanged original data
        run: node --test tests/research_mvp10_full_editorial_storyboard.test.js
      - name: Build nine-scene research draft without publication side effects
        run: |
          node scripts/research_mvp10_full_editorial_storyboard.js "$GITHUB_WORKSPACE" "$RUNNER_TEMP/mvp10-full-storyboard" > "$RUNNER_TEMP/storyboard-result.json"
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const result=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'storyboard-result.json')));
          const b=fs.readFileSync(result.path),j=JSON.parse(b);
          if(j.render_authorized!==false||j.publication_authorized!==false||
             j.market_summary_final!==false||j.scenes.length!==9||
             JSON.stringify(j.remaining_legacy_prose_unverified_scenes)!=='[4,5,6,7]')
             throw Error('STORYBOARD_PREMATURE_PROMOTION');
          console.log(JSON.stringify({scene_count:j.scenes.length,
            draft_stock_count:j.stock_count,source_claim_status:j.decision,
            sha256:crypto.createHash('sha256').update(b).digest('hex'),
            unverified_scenes:j.remaining_legacy_prose_unverified_scenes},null,2));
          NODE
          echo "Full scene research draft ONLY. No canonical market summary/script, TTS, render, YouTube or release authorization." >> "$GITHUB_STEP_SUMMARY"
      - name: Save source-bound nine-scene research storyboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp10-20261008-full-nine-scene-research-draft
          path: ${{ runner.temp }}/mvp10-full-storyboard/
          if-no-files-found: warn
          retention-days: 14
