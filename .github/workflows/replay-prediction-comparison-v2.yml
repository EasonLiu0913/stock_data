name: Compare V1 and V2 replay results (manual)

on:
  workflow_dispatch:
    inputs:
      date:
        description: Forecast/result date in YYYYMMDD; leave blank to use the newest complete V2 available date
        required: false
        default: ''
      force:
        description: Regenerate replay comparison when the date already has comparison output
        type: boolean
        required: false
        default: false
      low_volume_threshold:
        description: Low-volume threshold for actual volume / previous 20-day average volume
        required: false
        default: '0.75'

permissions:
  contents: write

concurrency:
  group: manual-prediction-replay-comparison
  cancel-in-progress: false

jobs:
  replay-and-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Resolve comparison date
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.date }}
          FORCE_RUN: ${{ inputs.force }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            date="$INPUT_DATE"
            echo "Using manually requested comparison date: $date"
          else
            mapfile -t candidate_dates < <(
              node -e '
                const fs = require("fs");
                const manifest = JSON.parse(
                  fs.readFileSync("data_predictions_v2/manifest.json", "utf8")
                );

                const candidates = [
                  ...(Array.isArray(manifest.available_dates) ? manifest.available_dates : []),
                  manifest.latest_date,
                  manifest.forecast_date_compact,
                ]
                  .map(value => String(value || "").replaceAll("-", "").replaceAll("/", ""))
                  .filter(value => /^20\d{6}$/.test(value));

                const uniqueNewestFirst = [...new Set(candidates)].sort().reverse();
                process.stdout.write(uniqueNewestFirst.join("\n"));
              '
            )

            if [ "${#candidate_dates[@]}" -eq 0 ]; then
              echo "V2 manifest does not contain any valid available dates"
              exit 1
            fi

            echo "V2 candidate dates, newest first: ${candidate_dates[*]}"
            date=""

            for candidate in "${candidate_dates[@]}"; do
              missing=()

              if [ ! -s "data_predictions/$candidate/manifest.json" ]; then
                missing+=("V1 forecast manifest")
              fi
              if [ ! -s "data_predictions_v2/$candidate/manifest.json" ]; then
                missing+=("V2 forecast manifest")
              fi
              if [ ! -s "data_fubon/fubon_${candidate}_sma.json" ]; then
                missing+=("actual SMA result")
              fi

              if [ "${#missing[@]}" -eq 0 ]; then
                date="$candidate"
                echo "Selected newest complete comparison date: $date"
                break
              fi

              echo "Skipping incomplete date $candidate; missing: ${missing[*]}"
            done

            if [ -z "$date" ]; then
              echo "None of the V2 available dates has complete V1, V2, and actual SMA data"
              exit 1
            fi
          fi

          if ! [[ "$date" =~ ^20[0-9]{6}$ ]]; then
            echo "Unable to resolve a valid comparison date: $date"
            exit 1
          fi

          test -s "data_predictions/$date/manifest.json" || {
            echo "Missing V1 forecast manifest for $date";
            exit 1;
          }
          test -s "data_predictions_v2/$date/manifest.json" || {
            echo "Missing V2 forecast manifest for $date";
            exit 1;
          }
          test -s "data_fubon/fubon_${date}_sma.json" || {
            echo "Actual result-day price file is not ready: data_fubon/fubon_${date}_sma.json";
            exit 1;
          }

          comparison_run=true
          if [ "$FORCE_RUN" != "true" ] && [ -s "data_prediction_comparisons/$date/comparison.json" ]; then
            comparison_run=false
            echo "Comparison already exists for $date. Use force=true for an intentional rerun."
          fi

          factor_analysis_run=false
          if [ "$comparison_run" = "true" ] || [ ! -s "data_prediction_analysis/$date/industry-factor-ranges.json" ]; then
            factor_analysis_run=true
          fi

          volume_analysis_run=false
          if [ "$comparison_run" = "true" ] || [ ! -s "data_prediction_analysis/$date/volume-filter-impact.json" ]; then
            volume_analysis_run=true
          fi

          echo "run=$comparison_run" >> "$GITHUB_OUTPUT"
          echo "factor_analysis_run=$factor_analysis_run" >> "$GITHUB_OUTPUT"
          echo "volume_analysis_run=$volume_analysis_run" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Replay V1
        if: steps.date.outputs.run == 'true'
        run: node scripts/generate_prediction_replay.js --date "${{ steps.date.outputs.date }}"

      - name: Replay V2 with five evaluation angles
        if: steps.date.outputs.run == 'true'
        run: node scripts/generate_prediction_replay_v2.js --date "${{ steps.date.outputs.date }}" --cost-bps 30

      - name: Analyze low-volume exclusion impact
        if: steps.date.outputs.volume_analysis_run == 'true'
        run: |
          node scripts/analyze_replay_volume_filter.js \
            --date "${{ steps.date.outputs.date }}" \
            --low-volume-threshold "${{ inputs.low_volume_threshold || '0.75' }}"

      - name: Generate V1 and V2 accuracy comparison
        if: steps.date.outputs.run == 'true'
        run: node scripts/compare_prediction_versions.js --date "${{ steps.date.outputs.date }}"

      - name: Generate industry r1 r3 and 7-day RS analysis
        if: steps.date.outputs.factor_analysis_run == 'true'
        run: node scripts/analyze_replay_factor_ranges.js --date "${{ steps.date.outputs.date }}"

      - name: Commit replay comparison and analyses
        if: steps.date.outputs.run == 'true' || steps.date.outputs.factor_analysis_run == 'true' || steps.date.outputs.volume_analysis_run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data_predictions data_predictions_v2 data_prediction_comparisons data_prediction_analysis
          if git diff --cached --quiet; then
            echo "No replay or analysis changes"
            exit 0
          fi

          git commit -m "feat: update replay comparison and analyses for ${{ steps.date.outputs.date }}"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Replay comparison push failed; retry ${attempt}/5"
            sleep 5
          done

          echo "Replay comparison push failed after 5 attempts"
          exit 1
