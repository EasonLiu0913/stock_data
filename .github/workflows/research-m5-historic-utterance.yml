name: "[Research M5] Historic vs frozen utterance"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use historically successful TTS version
        run: python -m pip install --disable-pip-version-check edge-tts==7.2.8
      - name: Probe two authentic texts on identical YunJhe settings
        run: |
          set -o pipefail
          python scripts/diagnose_daily_gainers_m5_historic_utterance.py | tee "${RUNNER_TEMP}/utterance-comparison.json"
      - name: Retain diagnostic even on failed required voice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-utterance-comparison-${{ github.run_id }}
          path: ${{ runner.temp }}/utterance-comparison.json
          if-no-files-found: error
          retention-days: 14
