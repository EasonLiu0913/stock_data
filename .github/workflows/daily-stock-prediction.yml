name: 每日產生股票預測

on:
  workflow_dispatch:
    inputs:
      forecast_date:
        description: '要產生預測的交易日（YYYYMMDD，例如 20260730）'
        required: true
        type: string
      force_v1:
        description: '同日期已有成功 V1 結果時仍重新產生'
        required: false
        type: boolean
        default: false
      force_v2:
        description: '同日期已有 V2 結果時仍重新產生'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-stock-prediction
  cancel-in-progress: false

jobs:
  generate_v1:
    name: 1. 產生 V1 預測
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.dates.outputs.target_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm checked-out main commit
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Resolve requested forecast date
        id: dates
        shell: bash
        env:
          INPUT_FORECAST_DATE: ${{ inputs.forecast_date }}
          FORCE_RUN: ${{ inputs.force_v1 }}
        run: |
          node scripts/resolve_forecast_dates.js \
            --target-date "$INPUT_FORECAST_DATE" \
            --github-env > /tmp/forecast-dates.env
          cat /tmp/forecast-dates.env >> "$GITHUB_ENV"
          set -a
          source /tmp/forecast-dates.env
          set +a

          echo "base_date=$FORECAST_BASE_DATE" >> "$GITHUB_OUTPUT"
          echo "target_date=$FORECAST_TARGET_DATE" >> "$GITHUB_OUTPUT"

          echo "## 每日產生股票預測：V1" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 資料基準交易日：$FORECAST_BASE_DATE_ISO" >> "$GITHUB_STEP_SUMMARY"
          echo "- 預測交易日：$FORECAST_TARGET_DATE_ISO" >> "$GITHUB_STEP_SUMMARY"
          echo "- 強制重新產生 V1：$FORCE_RUN" >> "$GITHUB_STEP_SUMMARY"

          existing_manifest="data_predictions/$FORECAST_TARGET_DATE/manifest.json"
          existing_status="data_predictions/$FORECAST_TARGET_DATE/generation-status.txt"
          if [ "$FORCE_RUN" != "true" ] \
            && [ -s "$existing_manifest" ] \
            && { [ ! -f "$existing_status" ] \
              || [ "$(tr -d '\r\n' < "$existing_status")" = "success" ]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "V1 output exists; refreshing viewer without recalculating predictions."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

          node scripts/resolve_forecast_dates.js \
            --target-date "$INPUT_FORECAST_DATE"

      - name: Check required forecast files
        if: steps.dates.outputs.run == 'true'
        run: node scripts/check_forecast_required_files.js

      - name: Verify fresh source files
        if: steps.dates.outputs.run == 'true'
        run: node scripts/prepare_and_verify_forecast_inputs.js

      - name: Generate market risk snapshot
        if: steps.dates.outputs.run == 'true'
        run: node scripts/generate_market_risk_snapshot.js --date "$FORECAST_BASE_DATE"

      - name: Normalize non-trading days for this run
        if: steps.dates.outputs.run == 'true'
        run: node scripts/normalize_non_trading_days.js

      - name: Generate V1 prediction outputs
        if: steps.dates.outputs.run == 'true'
        id: generate
        shell: bash
        run: |
          mkdir -p data_predictions
          set +e
          node scripts/generate_all_stock_predictions.js \
            > /tmp/generation.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -eq 0 ]; then
            generation_status="success"
          else
            generation_status="failed"
          fi

          forecast_dir=$(node -e "
            const fs = require('fs');
            const file = 'data_predictions/manifest.json';
            if (!fs.existsSync(file)) process.exit(1);
            const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
            process.stdout.write(manifest.output_directory || '');
          " 2>/dev/null)

          if [ -n "$forecast_dir" ]; then
            mkdir -p "$forecast_dir"
            cp /tmp/generation.log "$forecast_dir/generation.log"
            cp .forecast-input-validation.json \
              "$forecast_dir/input-validation.json"
            echo "$generation_status" \
              > "$forecast_dir/generation-status.txt"
          else
            cp /tmp/generation.log data_predictions/generation.log
            cp .forecast-input-validation.json \
              data_predictions/input-validation.json
            echo "$generation_status" \
              > data_predictions/generation-status.txt
          fi

          exit 0

      - name: Restore temporary source normalization
        if: always() && steps.dates.outputs.run == 'true'
        run: git restore --worktree -- data_history_sma/non_trading_days.json

      - name: Generate V1 V2 HTML viewer data
        if: always() && steps.dates.outputs.target_date != ''
        run: |
          node scripts/generate_prediction_version_ui.js \
            --date "${{ steps.dates.outputs.target_date }}"

      - name: Commit V1 result and viewer
        if: always() && steps.dates.outputs.target_date != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data_normalized \
            data_market_risk \
            data_predictions \
            data_prediction_ui \
            public/index.html \
            public/prediction-version-dashboard.html

          if git diff --cached --quiet; then
            echo "No V1 or viewer changes"
            exit 0
          fi

          if [ "${{ steps.dates.outputs.run }}" != "true" ]; then
            message="feat: publish ${FORECAST_TARGET_DATE} V1 V2 prediction viewer"
          elif [ "${{ steps.generate.outputs.exit_code }}" = "0" ]; then
            message="feat: regenerate verified ${FORECAST_TARGET_DATE} V1 forecasts and viewer"
          else
            message="fix: record ${FORECAST_TARGET_DATE} V1 generation failure"
          fi
          git commit -m "$message"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before V1 rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main \
              && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "V1 push failed; retry ${attempt}/5"
            sleep 5
          done

          echo "V1 push failed after 5 attempts"
          exit 1

      - name: Mark V1 generation failure
        if: steps.dates.outputs.run == 'true' && steps.generate.outputs.exit_code != '0'
        run: exit 1

  generate_v2:
    name: 2. 產生 V2 預測
    needs: generate_v1
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.source.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm checked-out main commit
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Resolve and verify V1 source date
        id: source
        shell: bash
        env:
          DATE: ${{ needs.generate_v1.outputs.target_date }}
          FORCE_RUN: ${{ inputs.force_v2 }}
        run: |
          date="$DATE"
          if ! [[ "$date" =~ ^20[0-9]{6}$ ]]; then
            echo "Unable to resolve a valid V1 forecast date: $date"
            exit 1
          fi

          source_manifest="data_predictions/$date/manifest.json"
          if [ ! -s "$source_manifest" ]; then
            echo "V1 source manifest does not exist: $source_manifest"
            exit 1
          fi

          node -e "
            const fs = require('fs');
            const file = process.argv[1];
            const expected = process.argv[2];
            const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
            const actual = manifest.forecast_date_compact
              || String(manifest.forecast_date || '').replaceAll('-', '');
            if (actual !== expected) {
              throw new Error('V1 manifest date mismatch');
            }
            if (Number(manifest.generated_reports) < 1) {
              throw new Error('V1 manifest has no reports');
            }
          " "$source_manifest" "$date"

          status_file="data_predictions/$date/generation-status.txt"
          if [ -f "$status_file" ] \
            && [ "$(tr -d '\r\n' < "$status_file")" != "success" ]; then
            echo "V1 source generation did not succeed"
            exit 1
          fi

          if [ "$FORCE_RUN" != "true" ] \
            && [ -s "data_predictions_v2/$date/manifest.json" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "V2 exists; refreshing viewer without recalculating predictions."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Run V2 rule tests
        if: steps.source.outputs.run == 'true'
        run: npm test

      - name: Generate V2 only
        if: steps.source.outputs.run == 'true'
        run: |
          node scripts/generate_all_stock_predictions_v2.js \
            --date "${{ steps.source.outputs.date }}"

      - name: Generate V1 V2 HTML viewer data
        run: |
          node scripts/generate_prediction_version_ui.js \
            --date "${{ steps.source.outputs.date }}"

      - name: Commit V2 outputs and viewer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data_predictions_v2 \
            data_prediction_ui \
            public/index.html \
            public/prediction-version-dashboard.html

          if git diff --cached --quiet; then
            echo "No V2 or viewer changes"
            exit 0
          fi

          git commit -m \
            "feat: publish ${{ steps.source.outputs.date }} V1 V2 prediction viewer"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before V2 rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main \
              && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "V2 push failed; retry ${attempt}/5"
            sleep 5
          done

          echo "V2 push failed after 5 attempts"
          exit 1
