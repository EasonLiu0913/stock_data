name: '[04 預測覆盤] 每日產生股票預測'

on:
  workflow_dispatch:
    inputs:
      forecast_date:
        description: '要產生預測的交易日（YYYYMMDD，例如 20260730）'
        required: true
        type: string
      force_v1:
        description: '同日期已有成功 V1 結果時仍重新產生'
        required: false
        type: boolean
        default: false
      force_v2:
        description: '同日期已有 V2 結果時仍重新產生'
        required: false
        type: boolean
        default: false
      force_environment:
        description: '覆蓋既有市場環境 Shadow snapshot'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-stock-prediction
  cancel-in-progress: false

jobs:
  generate_v1:
    name: 1. 產生 V1 預測
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.dates.outputs.target_date }}
      environment_hash: ${{ steps.environment.outputs.snapshot_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync to latest main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Resolve requested forecast date
        id: dates
        shell: bash
        env:
          INPUT_FORECAST_DATE: ${{ inputs.forecast_date }}
          FORCE_RUN: ${{ inputs.force_v1 }}
        run: |
          set -euo pipefail
          node scripts/resolve_forecast_dates.js --target-date "$INPUT_FORECAST_DATE" --github-env > /tmp/forecast-dates.env
          cat /tmp/forecast-dates.env >> "$GITHUB_ENV"
          set -a
          source /tmp/forecast-dates.env
          set +a
          echo "base_date=$FORECAST_BASE_DATE" >> "$GITHUB_OUTPUT"
          echo "target_date=$FORECAST_TARGET_DATE" >> "$GITHUB_OUTPUT"

          existing_manifest="data_predictions/$FORECAST_TARGET_DATE/manifest.json"
          existing_status="data_predictions/$FORECAST_TARGET_DATE/generation-status.txt"
          if [ "$FORCE_RUN" != "true" ] && [ -s "$existing_manifest" ] \
            && { [ ! -f "$existing_status" ] || [ "$(tr -d '\r\n' < "$existing_status")" = "success" ]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

          echo "## 每日產生股票預測：V1" >> "$GITHUB_STEP_SUMMARY"
          echo "- 資料基準交易日：$FORECAST_BASE_DATE_ISO" >> "$GITHUB_STEP_SUMMARY"
          echo "- 預測交易日：$FORECAST_TARGET_DATE_ISO" >> "$GITHUB_STEP_SUMMARY"
          echo "- 市場環境模式：Shadow" >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure required external market indicators
        id: external_market
        shell: bash
        run: |
          set -euo pipefail

          # Keep the date rule identical to generate_market_environment.js:
          # use the base-date U.S. weekday, capped at the latest completed
          # New York session (16:30 close buffer). This also works for
          # historical prediction regeneration.
          expected_us_date=$(node <<'NODE'
          const { weekdayAtOrBefore } = require('./scripts/market_environment_lib');

          function zonedParts(date, timeZone) {
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              hourCycle: 'h23',
            }).formatToParts(date);
            return Object.fromEntries(parts.map((part) => [part.type, part.value]));
          }

          function previousCalendarDate(compact) {
            const date = new Date(Date.UTC(
              Number(compact.slice(0, 4)),
              Number(compact.slice(4, 6)) - 1,
              Number(compact.slice(6, 8)),
            ));
            date.setUTCDate(date.getUTCDate() - 1);
            return date.toISOString().slice(0, 10).replaceAll('-', '');
          }

          const baseDate = String(process.env.FORECAST_BASE_DATE || '');
          if (!/^20\d{6}$/.test(baseDate)) throw new Error(`Invalid FORECAST_BASE_DATE: ${baseDate}`);

          const now = new Date();
          const ny = zonedParts(now, 'America/New_York');
          const nyDate = `${ny.year}${ny.month}${ny.day}`;
          const hour = Number(ny.hour);
          const minute = Number(ny.minute);
          const closed = hour > 16 || (hour === 16 && minute >= 30);
          const latestCompleted = weekdayAtOrBefore(closed ? nyDate : previousCalendarDate(nyDate));
          const expectedFromBase = weekdayAtOrBefore(baseDate);
          process.stdout.write(expectedFromBase < latestCompleted ? expectedFromBase : latestCompleted);
          NODE
          )

          [[ "$expected_us_date" =~ ^20[0-9]{6}$ ]] || { echo "Invalid expected U.S. market date: $expected_us_date"; exit 1; }
          external_file="data_external_market/$expected_us_date/external_market_indicators.json"
          risk_file="data_market_risk/$expected_us_date/market_risk_snapshot.json"
          crawled=false

          echo "Expected completed U.S. market date: $expected_us_date"
          echo "External-market file: $external_file"

          external_ready=false
          if [ -s "$external_file" ]; then
            if node scripts/validate_external_market_snapshot.js \
              --expected-date "$expected_us_date" \
              --file "$external_file" \
              --strict; then
              external_ready=true
            else
              echo "Existing external-market snapshot is incomplete or date-mismatched; recrawling in this workflow."
            fi
          else
            echo "External-market snapshot is missing; crawling it in this workflow."
          fi

          if [ "$external_ready" != "true" ]; then
            node scripts/crawl_external_market_indicators.js --date "$expected_us_date"
            node scripts/validate_external_market_snapshot.js \
              --expected-date "$expected_us_date" \
              --file "$external_file" \
              --strict
            crawled=true
          fi

          if [ "$crawled" = "true" ] || [ ! -s "$risk_file" ]; then
            node scripts/generate_market_risk_snapshot.js --date "$expected_us_date"
          fi

          node scripts/generate_file_lists.js --only data_external_market,data_market_risk

          echo "expected_us_date=$expected_us_date" >> "$GITHUB_OUTPUT"
          echo "crawled=$crawled" >> "$GITHUB_OUTPUT"
          echo "- 外部市場需求日：$expected_us_date" >> "$GITHUB_STEP_SUMMARY"
          echo "- External Market 自動補抓：$crawled" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate or reuse market environment snapshot
        shell: bash
        env:
          FORCE_ENVIRONMENT: ${{ inputs.force_environment }}
        run: |
          set -euo pipefail
          args=(--forecast-date "$FORECAST_TARGET_DATE" --base-date "$FORECAST_BASE_DATE" --strict)
          if [ "$FORCE_ENVIRONMENT" = "true" ]; then args+=(--force); fi
          node scripts/generate_market_environment.js "${args[@]}"

      - name: Verify immutable market environment snapshot
        id: environment
        shell: bash
        run: |
          set -euo pipefail
          args=(--forecast-date "$FORECAST_TARGET_DATE" --base-date "$FORECAST_BASE_DATE")
          if [ "$FORECAST_TARGET_DATE" -lt "$(TZ='Asia/Taipei' date '+%Y%m%d')" ]; then
            args+=(--allow-historical-reconstruction)
          fi
          node scripts/verify_market_environment.js "${args[@]}"

      - name: Run market environment and fixed strategy tests
        run: |
          node --test \
            tests/market_environment.test.js \
            tests/formal_market_strategy_tags.test.js \
            tests/prediction_dashboard_group_sync.test.js \
            tests/oversold_beta_rebound.test.js \
            tests/oversold_electronics_strategy.test.js

      - name: Check required forecast files
        if: steps.dates.outputs.run == 'true'
        run: node scripts/check_forecast_required_files.js

      - name: Verify fresh source files
        if: steps.dates.outputs.run == 'true'
        run: node scripts/prepare_and_verify_forecast_inputs.js

      - name: Generate market risk snapshot
        if: steps.dates.outputs.run == 'true'
        run: node scripts/generate_market_risk_snapshot.js --date "$FORECAST_BASE_DATE"

      - name: Normalize non-trading days for this run
        if: steps.dates.outputs.run == 'true'
        run: node scripts/normalize_non_trading_days.js

      - name: Generate V1 prediction outputs
        if: steps.dates.outputs.run == 'true'
        id: generate
        shell: bash
        run: |
          mkdir -p data_predictions
          set +e
          node scripts/generate_all_stock_predictions.js > /tmp/generation.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          generation_status=$([ "$status" -eq 0 ] && echo success || echo failed)
          forecast_dir=$(node -e "const fs=require('fs');const f='data_predictions/manifest.json';if(!fs.existsSync(f))process.exit(1);const m=JSON.parse(fs.readFileSync(f));process.stdout.write(m.output_directory||'')" 2>/dev/null)
          if [ -n "$forecast_dir" ]; then
            mkdir -p "$forecast_dir"
            cp /tmp/generation.log "$forecast_dir/generation.log"
            cp .forecast-input-validation.json "$forecast_dir/input-validation.json"
            echo "$generation_status" > "$forecast_dir/generation-status.txt"
          else
            cp /tmp/generation.log data_predictions/generation.log
            cp .forecast-input-validation.json data_predictions/input-validation.json
            echo "$generation_status" > data_predictions/generation-status.txt
          fi
          exit 0

      - name: Build rebound readiness and fixed strategy registry
        if: always() && steps.dates.outputs.target_date != '' && (steps.dates.outputs.run != 'true' || steps.generate.outputs.exit_code == '0')
        run: node scripts/backfill_prediction_dashboard_fields.js --date "${{ steps.dates.outputs.target_date }}"

      - name: Attach environment snapshot to V1 outputs
        if: always() && steps.dates.outputs.target_date != ''
        run: node scripts/attach_market_environment.js --date "${{ steps.dates.outputs.target_date }}" --version v1

      - name: Install market environment banner
        if: always()
        run: node scripts/install_market_environment_ui.js

      - name: Restore temporary source normalization
        if: always() && steps.dates.outputs.run == 'true'
        run: git restore --worktree -- data_history_sma/non_trading_days.json

      - name: Generate V1 V2 HTML viewer data
        if: always() && steps.dates.outputs.target_date != ''
        run: node scripts/generate_prediction_version_ui.js --date "${{ steps.dates.outputs.target_date }}"

      - name: Commit V1 result, environment, and viewer
        if: always() && steps.dates.outputs.target_date != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_normalized data_external_market data_market_risk data_market_environment data_predictions data_prediction_context data_prediction_ui public/index.html public/prediction-version-dashboard.html public/prediction-dashboard.html
          if git diff --cached --quiet; then echo "No V1, external market, or environment changes"; exit 0; fi
          if [ "${{ steps.dates.outputs.run }}" != "true" ]; then
            message="feat: attach ${FORECAST_TARGET_DATE} market environment to V1"
          elif [ "${{ steps.generate.outputs.exit_code }}" = "0" ]; then
            message="feat: regenerate verified ${FORECAST_TARGET_DATE} V1 forecasts with market environment"
          else
            message="fix: record ${FORECAST_TARGET_DATE} V1 generation failure"
          fi
          git commit -m "$message"
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

      - name: Mark V1 generation failure
        if: steps.dates.outputs.run == 'true' && steps.generate.outputs.exit_code != '0'
        run: exit 1

  generate_v2:
    name: 2. 產生 V2 預測
    needs: generate_v1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync to latest main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Resolve and verify V1 source date and environment hash
        id: source
        shell: bash
        env:
          DATE: ${{ needs.generate_v1.outputs.target_date }}
          EXPECTED_ENV_HASH: ${{ needs.generate_v1.outputs.environment_hash }}
          FORCE_RUN: ${{ inputs.force_v2 }}
        run: |
          set -euo pipefail
          date="$DATE"
          [[ "$date" =~ ^20[0-9]{6}$ ]] || exit 1
          source_manifest="data_predictions/$date/manifest.json"
          test -s "$source_manifest"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1]));const d=m.forecast_date_compact||String(m.forecast_date||'').replaceAll('-','');if(d!==process.argv[2])throw Error('V1 date mismatch');if(Number(m.generated_reports)<1)throw Error('V1 has no reports');if(m.market_environment?.snapshot_hash!==process.argv[3])throw Error('V1 environment hash mismatch');" "$source_manifest" "$date" "$EXPECTED_ENV_HASH"
          status_file="data_predictions/$date/generation-status.txt"
          if [ -f "$status_file" ] && [ "$(tr -d '\r\n' < "$status_file")" != "success" ]; then exit 1; fi
          if [ "$FORCE_RUN" != "true" ] && [ -s "data_predictions_v2/$date/manifest.json" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Verify V2 uses the same market environment snapshot
        run: |
          env_file="data_market_environment/${{ steps.source.outputs.date }}/market_environment.json"
          node -e "const fs=require('fs');const e=JSON.parse(fs.readFileSync(process.argv[1]));if(e.snapshot_hash!==process.argv[2])throw Error('Environment hash changed between V1 and V2');" "$env_file" "${{ needs.generate_v1.outputs.environment_hash }}"

      - name: Run V2 rule tests
        if: steps.source.outputs.run == 'true'
        run: npm test

      - name: Generate V2 only
        if: steps.source.outputs.run == 'true'
        run: node scripts/generate_all_stock_predictions_v2.js --date "${{ steps.source.outputs.date }}"

      - name: Attach environment snapshot to V2 outputs
        run: node scripts/attach_market_environment.js --date "${{ steps.source.outputs.date }}" --version v2

      - name: Generate V1 V2 HTML viewer data
        run: node scripts/generate_prediction_version_ui.js --date "${{ steps.source.outputs.date }}"

      - name: Commit V2 outputs and viewer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_predictions_v2 data_prediction_ui data_market_environment public/index.html public/prediction-version-dashboard.html public/prediction-dashboard.html
          if git diff --cached --quiet; then echo "No V2 or viewer changes"; exit 0; fi
          git commit -m "feat: publish ${{ steps.source.outputs.date }} V2 with shared market environment"
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

  apply_strategy_registry:
    name: 3. 套用標籤策略並發布 GitHub Pages
    needs: [generate_v1, generate_v2]
    uses: ./.github/workflows/apply-strategy-tag-registry.yml
    with:
      date: ${{ needs.generate_v1.outputs.target_date }}
      evaluation_mode: live_snapshot
      data_as_of: ''
