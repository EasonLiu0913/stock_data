name: "[07 研究] 晚間 6/7/10 籌碼 Facts 準備"

on:
  schedule:
    - cron: '30 13 * * 1-5'
    - cron: '0 14 * * 1-5'
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '分析日期 YYYYMMDD；留空時使用台北當日'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-daily-gainers-margin-flow-2200.yml'
      - 'config/daily-gainers-ai-contract.json'
      - 'scripts/lib/daily_gainers_ai_contract.js'
      - 'scripts/daily_gainers_ai_contract_cli.js'
      - 'scripts/build_daily_gainers_ai_facts.js'

permissions:
  contents: write

concurrency:
  group: daily-gainers-margin-flow-2200
  cancel-in-progress: false

jobs:
  prepare-ai-facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve date and verify 6/7/10 inputs
        id: input
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          set -euo pipefail
          d="${INPUT_DATE:-$(TZ='Asia/Taipei' date '+%Y%m%d')}"
          [[ "$d" =~ ^20[0-9]{6}$ ]] || exit 1
          list="data_daily_gain_over_5/${d}.json"
          margin="data_twse_margin_balance/${d}_twse_margin_balance.csv"
          broker="data_fubon_broker_details/fubon_${d}_券商分點進出明細.json"
          mi="data_twse_mi_index/${d}_twse_mi_index.json"
          ready=true
          [ -s "$list" ] || ready=false
          [ -s "$margin" ] || ready=false
          node - "$broker" <<'NODE' || ready=false
          const fs = require('node:fs');
          const f = process.argv[2];
          if (!fs.existsSync(f)) process.exit(1);
          try {
            const p = JSON.parse(fs.readFileSync(f, 'utf8'));
            process.exit(p && typeof p === 'object' && Object.keys(p).length ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
          node - "$mi" <<'NODE' || ready=false
          const fs = require('node:fs');
          const f = process.argv[2];
          if (!fs.existsSync(f)) process.exit(1);
          try {
            const p = JSON.parse(fs.readFileSync(f, 'utf8'));
            process.exit(Array.isArray(p?.tables) && p.tables.length ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
          echo "date=$d" >> "$GITHUB_OUTPUT"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "## 晚間 6/7/10 facts" >> "$GITHUB_STEP_SUMMARY"
          echo "- 日期：$d" >> "$GITHUB_STEP_SUMMARY"
          echo "- ready：$ready" >> "$GITHUB_STEP_SUMMARY"

      - name: Build current-contract facts
        if: steps.input.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          d="${{ steps.input.outputs.date }}"
          node --check scripts/build_daily_gainers_ai_facts.js
          node scripts/build_daily_gainers_ai_facts.js "$d"
          facts="data_daily_gain_over_5/analysis-facts/${d}.json"
          node scripts/daily_gainers_ai_contract_cli.js assert-facts "$facts"
          node - "$facts" <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (p.stock_count && p.stocks.every((x) => !x?.flow?.broker)) throw new Error('broker facts missing for all stocks');
          if (p.stock_count && p.stocks.every((x) => !x?.flow?.margin)) throw new Error('margin facts missing for all stocks');
          console.log(JSON.stringify({ stocks: p.stock_count, source_status: p.source_status }));
          NODE

      - name: Commit facts
        if: steps.input.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          d="${{ steps.input.outputs.date }}"
          f="data_daily_gain_over_5/analysis-facts/${d}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$f"
          if git diff --cached --quiet; then
            echo "Facts already current"
            exit 0
          fi
          git commit -m "analysis: prepare current 5% AI facts ${d}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
          exit 1
