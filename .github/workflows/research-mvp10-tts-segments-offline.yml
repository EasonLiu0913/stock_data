name: "[Research Only] MVP10 TTS Segment Timing Offline Tests"
# Research branch only: lossless segmentation and real MP3 join with synthetic tones; never connect to Edge TTS or YouTube.
on:
  push:
    branches:
      - research/daily-video-mvp10-a-20261029
    paths:
      - .github/workflows/research-mvp10-tts-segments-offline.yml
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/research/daily-video-mvp10-a-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/daily_gainers_tts_segments.py
            scripts/daily_gainers_tts_audio_join.py
            tests/test_daily_gainers_tts_segments.py
            tests/test_daily_gainers_tts_audio_join.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated media test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            timeout 120s sudo apt-get update -qq
            timeout 120s sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Validate speech segment and real MP3 join contracts
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
          python -m py_compile scripts/daily_gainers_tts_segments.py scripts/daily_gainers_tts_audio_join.py tests/test_daily_gainers_tts_segments.py tests/test_daily_gainers_tts_audio_join.py
          python -m unittest discover -s tests -p 'test_daily_gainers_tts_*.py' -v
