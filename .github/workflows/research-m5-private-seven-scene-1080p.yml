name: "[Research M5] Private seven-scene 1080p render"
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Frozen plan and FFmpeg preflight
        run: |
          node --test tests/build_daily_gainers_m5_private_plan.test.js tests/build_daily_gainers_m4_spoken_draft.test.js
          node scripts/build_daily_gainers_m5_private_plan.js >/dev/null
          python -m py_compile scripts/render_daily_gainers_m5_private_seven_scene.py
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - uses: actions/download-artifact@v4
        with:
          name: m5-seven-scene-private-review-38079932428
          run-id: 38079932428
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/seven-review
      - name: Reverify original caption and audio source before rendering
        run: |
          node scripts/verify_daily_gainers_m5_timed_srt.js "${RUNNER_TEMP}/seven-review/seven-scenes-research.zh-TW.srt"
      - name: Render neutral-slate 1080p MP4 and independently probe output
        run: python scripts/render_daily_gainers_m5_private_seven_scene.py "${RUNNER_TEMP}/seven-review" "${RUNNER_TEMP}/private-render"
      - name: Preserve 1080p private video and proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-seven-scene-private-1080p-${{ github.run_id }}
          path: ${{ runner.temp }}/private-render/
          if-no-files-found: warn
          retention-days: 14
