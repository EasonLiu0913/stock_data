name: "[06 回填修復] Crawl Institutional History"

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (YYYY-MM-DD, leave empty for auto)'
        required: false
        default: ''
      end_date:
        description: 'End Date (YYYY-MM-DD, leave empty for auto)'
        required: false
        default: ''
      start_index:
        description: 'Start Index (for batch processing)'
        required: false
        default: '0'
      limit:
        description: 'Limit (number of stocks to process, leave empty for all)'
        required: false
        default: ''

jobs:
  crawl-institutional:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trust checked-out repository inside Playwright container
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Verify bundled Playwright Chromium
        run: |
          node -e 'const fs = require("node:fs"); const { chromium } = require("playwright"); const p = chromium.executablePath(); fs.accessSync(p, fs.constants.X_OK); console.log("Bundled Chromium ready: " + p);'

      - name: Run Institutional Crawler
        run: |
          echo "🚀 Starting crawl for ${{ github.event.inputs.start_date }} to ${{ github.event.inputs.end_date }}"
          echo "Batch: ${{ github.event.inputs.start_index }} to ${{ github.event.inputs.limit }}"
          
          node scripts/crawl_history_institutional_data.js ${{ github.event.inputs.start_index }} ${{ github.event.inputs.limit }} --start ${{ github.event.inputs.start_date }} --end ${{ github.event.inputs.end_date }}
        continue-on-error: true

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data_institutional/
          git diff --staged --quiet || git commit -m "chore: update institutional history ${{ github.event.inputs.start_date }}~${{ github.event.inputs.end_date }}"
          
          # Retry loop for push
          MAX_RETRIES=5
          count=0
          success=false
          
          while [ $count -lt $MAX_RETRIES ]; do
            git stash --include-untracked || true
            git pull --rebase origin main
            git stash pop || true
            git add data_institutional/
            if git push origin main; then
              success=true
              break
            else
              echo "Push failed, retrying ($((count + 1))/$MAX_RETRIES)..."
              sleep 5
              count=$((count + 1))
            fi
          done
          
          if [ "$success" = "false" ]; then
            echo "Failed to push after $MAX_RETRIES attempts."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository for schedule summary
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js

