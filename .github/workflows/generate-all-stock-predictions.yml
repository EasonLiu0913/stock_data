name: Generate V1 stock predictions (manual)

on:
  workflow_dispatch:
    inputs:
      forecast_date:
        description: '預測目標交易日（YYYYMMDD，例如 20260728）'
        required: true
        type: string
      force:
        description: '同日期已有成功結果時仍重新產生'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: manual-stock-prediction-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm checked-out main commit
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Resolve requested forecast date
        id: dates
        shell: bash
        env:
          INPUT_FORECAST_DATE: ${{ inputs.forecast_date }}
          FORCE_RUN: ${{ inputs.force }}
        run: |
          node scripts/resolve_forecast_dates.js --target-date "$INPUT_FORECAST_DATE" --github-env > /tmp/forecast-dates.env
          cat /tmp/forecast-dates.env >> "$GITHUB_ENV"
          set -a
          source /tmp/forecast-dates.env
          set +a

          echo "base_date=$FORECAST_BASE_DATE" >> "$GITHUB_OUTPUT"
          echo "target_date=$FORECAST_TARGET_DATE" >> "$GITHUB_OUTPUT"

          echo "## V1 預測執行日期" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 資料基準交易日：$FORECAST_BASE_DATE_ISO" >> "$GITHUB_STEP_SUMMARY"
          echo "- 預測目標交易日：$FORECAST_TARGET_DATE_ISO" >> "$GITHUB_STEP_SUMMARY"
          echo "- 強制重新產生：$FORCE_RUN" >> "$GITHUB_STEP_SUMMARY"

          existing_manifest="data_predictions/$FORECAST_TARGET_DATE/manifest.json"
          existing_status="data_predictions/$FORECAST_TARGET_DATE/generation-status.txt"
          if [ "$FORCE_RUN" != "true" ] && [ -s "$existing_manifest" ] && { [ ! -f "$existing_status" ] || [ "$(tr -d '\r\n' < "$existing_status")" = "success" ]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "V1 output exists; refreshing viewer without recalculating predictions."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

          node scripts/resolve_forecast_dates.js --target-date "$INPUT_FORECAST_DATE"

      - name: Check required forecast files
        if: steps.dates.outputs.run == 'true'
        run: node scripts/check_forecast_required_files.js

      - name: Verify fresh source files
        if: steps.dates.outputs.run == 'true'
        run: node scripts/prepare_and_verify_forecast_inputs.js

      - name: Generate market risk snapshot
        if: steps.dates.outputs.run == 'true'
        run: node scripts/generate_market_risk_snapshot.js --date "$FORECAST_BASE_DATE"

      - name: Normalize non-trading days for this run
        if: steps.dates.outputs.run == 'true'
        run: node scripts/normalize_non_trading_days.js

      - name: Generate V1 prediction outputs
        if: steps.dates.outputs.run == 'true'
        id: generate
        shell: bash
        run: |
          mkdir -p data_predictions
          set +e
          node scripts/generate_all_stock_predictions.js > /tmp/generation.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -eq 0 ]; then
            generation_status="success"
          else
            generation_status="failed"
          fi

          forecast_dir=$(node -e "const fs=require('fs'); const p='data_predictions/manifest.json'; if (!fs.existsSync(p)) process.exit(1); const m=JSON.parse(fs.readFileSync(p,'utf8')); process.stdout.write(m.output_directory || '');" 2>/dev/null)
          if [ -n "$forecast_dir" ]; then
            mkdir -p "$forecast_dir"
            cp /tmp/generation.log "$forecast_dir/generation.log"
            cp .forecast-input-validation.json "$forecast_dir/input-validation.json"
            echo "$generation_status" > "$forecast_dir/generation-status.txt"
          else
            cp /tmp/generation.log data_predictions/generation.log
            cp .forecast-input-validation.json data_predictions/input-validation.json
            echo "$generation_status" > data_predictions/generation-status.txt
          fi

          exit 0

      - name: Restore temporary source normalization
        if: always() && steps.dates.outputs.run == 'true'
        run: git restore --worktree -- data_history_sma/non_trading_days.json

      - name: Generate V1 V2 HTML viewer data
        if: always() && steps.dates.outputs.target_date != ''
        run: node scripts/generate_prediction_version_ui.js --date "${{ steps.dates.outputs.target_date }}"

      - name: Commit V1 result and viewer
        if: always() && steps.dates.outputs.target_date != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data_normalized data_market_risk data_predictions data_prediction_ui public/index.html public/prediction-version-dashboard.html
          if git diff --cached --quiet; then
            echo "No V1 or viewer changes"
            exit 0
          fi

          if [ "${{ steps.dates.outputs.run }}" != "true" ]; then
            message="feat: publish ${FORECAST_TARGET_DATE} V1 V2 prediction viewer"
          elif [ "${{ steps.generate.outputs.exit_code }}" = "0" ]; then
            message="feat: regenerate verified ${FORECAST_TARGET_DATE} V1 forecasts and viewer"
          else
            message="fix: record ${FORECAST_TARGET_DATE} V1 generation failure"
          fi
          git commit -m "$message"

          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

          exit 1

      - name: Mark V1 generation failure
        if: steps.dates.outputs.run == 'true' && steps.generate.outputs.exit_code != '0'
        run: exit 1
