name: Generate all stock predictions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_all_stock_predictions.js'
      - 'scripts/normalize_non_trading_days.js'
      - '.github/workflows/generate-all-stock-predictions.yml'
      - 'src/forecast/**'
      - 'templates/prediction_template.html'
      - 'docs/STOCK_FORECAST_METHODOLOGY.md'

permissions:
  contents: write

concurrency:
  group: generate-all-stock-predictions
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Normalize non-trading days
        run: node scripts/normalize_non_trading_days.js
      - name: Generate JSON, HTML, missing-data list and index
        id: generate
        shell: bash
        run: |
          mkdir -p data_predictions
          set +e
          node scripts/generate_all_stock_predictions.js > data_predictions/generation.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "success" > data_predictions/generation-status.txt
          else
            echo "failed" > data_predictions/generation-status.txt
          fi
          exit 0
      - name: Commit generation result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_predictions public/predictions public/index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          if [ "${{ steps.generate.outputs.exit_code }}" = "0" ]; then
            message="feat: regenerate all stock forecast reports"
          else
            message="fix: record stock forecast generation failure"
          fi
          git commit -m "$message"
          git push origin HEAD:main
