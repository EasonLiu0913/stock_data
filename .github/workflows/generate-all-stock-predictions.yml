name: Generate all stock predictions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_all_stock_predictions.js'
      - '.github/workflows/generate-all-stock-predictions.yml'
      - 'src/forecast/**'
      - 'templates/prediction_template.html'
      - 'docs/STOCK_FORECAST_METHODOLOGY.md'

permissions:
  contents: write

concurrency:
  group: generate-all-stock-predictions
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Generate JSON, HTML, missing-data list and index
        run: node scripts/generate_all_stock_predictions.js
      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_predictions public/predictions public/index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: regenerate all stock forecast reports"
          git push origin HEAD:main
