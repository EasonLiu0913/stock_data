name: "[Research M5] Scene07 original audio capture"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze M4 and M5 source
        run: |
          node --test tests/build_daily_gainers_m5_private_plan.test.js tests/build_daily_gainers_m4_spoken_draft.test.js
          node scripts/build_daily_gainers_m5_private_plan.js >/dev/null
          python -m py_compile scripts/research_daily_gainers_m5_scene07_capture.py
      - name: Verify media tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Pin original TTS engine
        run: python -m pip install --disable-pip-version-check edge-tts==7.2.8
      - name: Bounded scene07 capture only
        run: python scripts/research_daily_gainers_m5_scene07_capture.py output/m5-private-preview/20261008/plan.json "${RUNNER_TEMP}/m5-scene07"
      - name: Preserve private research proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-scene07-original-research-${{ github.run_id }}
          path: ${{ runner.temp }}/m5-scene07/
          if-no-files-found: warn
          retention-days: 14
