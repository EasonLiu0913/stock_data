name: "[Research] Verify Accumulation Outcome Association Execution"
# maturity-refresh verification trigger
# maturity-refresh-v2 post-materialization verification
# repaired-calendar replay verification

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_institutional_accumulation_catalyst_outcome_association_execution.js'
      - 'tests/institutional_accumulation_catalyst_outcome_association_execution.test.js'
      - 'data_research/institutional-flow/institutional-accumulation-catalyst-outcome-association-execution-v1.json'
      - '.github/workflows/verify-institutional-accumulation-catalyst-outcome-association-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: institutional-accumulation-outcome-association-execution-verify-v2
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout checked-in execution snapshot
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/build_institutional_accumulation_catalyst_outcome_association_execution.js
            scripts/lib/stock_price_provider.js
            tests/institutional_accumulation_catalyst_outcome_association_execution.test.js
            data_research/institutional-flow/institutional-accumulation-catalyst-outcome-association-protocol-v1.json
            data_research/institutional-flow/institutional-accumulation-catalyst-five-window-event-intelligence-v1.json
            data_research/institutional-flow/institutional-accumulation-catalyst-event-intelligence-handoff.md
            data_research/institutional-flow/institutional-accumulation-catalyst-outcome-association-execution-v1.json
            data_history_sma/trading_days.json
            data_twse_market_chart/market_chart.json
            data_twse_mi_index/20260922_twse_mi_index.json
            data_twse_mi_index/20260923_twse_mi_index.json
            data_twse_mi_index/20260924_twse_mi_index.json
            data_fubon/fubon_20260922_sma.json
            data_fubon/fubon_20260923_sma.json
            data_fubon/fubon_20260924_sma.json
            data_twse_institutional_investors/20260916_twse_institutional_investors.json
            data_twse_institutional_investors/20260917_twse_institutional_investors.json
            data_twse_institutional_investors/20260918_twse_institutional_investors.json
            data_twse_institutional_investors/20260921_twse_institutional_investors.json
            data_twse_institutional_investors/20260922_twse_institutional_investors.json
            data_twse_institutional_investors/20260923_twse_institutional_investors.json
            data_twse_institutional_investors/20260924_twse_institutional_investors.json
            data_twse_margin_balance/20260922_twse_margin_balance.csv
            data_twse_margin_balance/20260923_twse_margin_balance.csv
            data_twse_margin_balance/20260924_twse_margin_balance.csv
            data_tdcc_shareholding/latest.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run execution regressions
        run: node --test tests/institutional_accumulation_catalyst_outcome_association_execution.test.js

      - name: Verify deterministic byte regeneration
        run: node scripts/build_institutional_accumulation_catalyst_outcome_association_execution.js

      - name: Verify bounded result contract
        run: |
          node - <<'NODE'
          const r = require('./data_research/institutional-flow/institutional-accumulation-catalyst-outcome-association-execution-v1.json');
          if (r.authorization.owner_authorized !== true) throw new Error('owner authorization missing');
          if (r.authorization.protected_2454_holdout_withdrawal_authorized !== false) throw new Error('protected outcomes opened');
          if (r.protocol_integrity.cohort_primary_count !== 11) throw new Error('primary cohort drift');
          if (r.protocol_integrity.left_censored_excluded_count !== 169) throw new Error('left-censored drift');
          if (r.protocol_integrity.fallback_alignment_added !== false) throw new Error('post-hoc alignment fallback introduced');
          if (r.protocol_integrity.imputation_used !== false) throw new Error('imputation introduced');
          if (r.coverage.numeric_return_horizons_materialized !== 11) throw new Error('expected 11 mature D1 materializations through 20260924');
          if (r.descriptive_summary.status !== 'partial_materialization') throw new Error('unexpected snapshot status');
          console.log('bounded authorization + frozen cohort + fail-closed coverage assertions: PASS');
          NODE
