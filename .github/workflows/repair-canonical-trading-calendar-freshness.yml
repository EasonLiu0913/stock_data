name: "[Research] Repair Canonical Trading Calendar Freshness"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-canonical-trading-calendar-freshness.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-canonical-trading-calendar-freshness-v1
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bounded calendar inputs
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts/sync_trading_calendar_from_daily_sma.js
            tests/sync_trading_calendar_from_daily_sma.test.js
            data_history_sma/trading_days.json
            data_history_sma/non_trading_days.json
            data_fubon/fubon_202608*_sma.json
            data_fubon/fubon_202609*_sma.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify sync regression
        run: node --test tests/sync_trading_calendar_from_daily_sma.test.js

      - name: Repair canonical calendar from durable SMA checkpoints
        run: |
          set -euo pipefail
          node scripts/sync_trading_calendar_from_daily_sma.js             --start 20260805             --end 20260923             --require-latest 20260923

      - name: Verify repaired calendar
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('data_history_sma/trading_days.json','utf8'));
          const d = Object.values(p).flat().sort();
          if (d.at(-1) !== '2026/09/23') throw new Error(`latest trading day is ${d.at(-1)}`);
          for (const forbidden of ['2026/09/25','2026/09/28']) {
            if (d.includes(forbidden)) throw new Error(`holiday incorrectly promoted: ${forbidden}`);
          }
          const expected = ['2026/08/05','2026/09/22','2026/09/23'];
          for (const x of expected) if (!d.includes(x)) throw new Error(`missing validated trading day: ${x}`);
          console.log('canonical trading calendar freshness assertions: PASS');
          NODE

      - name: Commit repaired canonical calendar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_history_sma/trading_days.json
          if git diff --cached --quiet; then
            echo "Calendar already current."
            exit 0
          fi
          git commit -m "data: repair canonical trading calendar through 20260923"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/sync_trading_calendar_from_daily_sma.js               --start 20260805               --end 20260923               --require-latest 20260923
            git add data_history_sma/trading_days.json
            git diff --cached --quiet && exit 0
            git commit -m "data: repair canonical trading calendar through 20260923"
            sleep 5
          done
          exit 1
