name: "[07 研究] Validate Institutional Withdrawal Lifecycle v1"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/classify_institutional_withdrawal_lifecycle_v1.js"
      - "scripts/test_institutional_withdrawal_lifecycle_v1.js"
      - "scripts/plan_institutional_withdrawal_validation_coverage.js"
      - "data_research/institutional-flow/validation-plan-v1.md"
      - ".github/workflows/validate-institutional-withdrawal-lifecycle-v1.yml"

permissions:
  contents: read

concurrency:
  group: institutional-withdrawal-validation-v1
  cancel-in-progress: false

jobs:
  regression-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Frozen lifecycle regression
        run: node scripts/test_institutional_withdrawal_lifecycle_v1.js
      - name: Coverage-only validation universe plan
        run: node scripts/plan_institutional_withdrawal_validation_coverage.js
      - name: Verify no forbidden authoritative calendar dependency
        run: |
          set -euo pipefail
          if grep -n "data_history_sma/trading_days.json" scripts/classify_institutional_withdrawal_lifecycle_v1.js scripts/plan_institutional_withdrawal_validation_coverage.js; then
            echo "Forbidden legacy trading calendar dependency detected"
            exit 1
          fi
      - name: Verify classifier does not consume outcome labels
        run: |
          set -euo pipefail
          if grep -En "v6-1-event-diagnosis|v61_outcome|return_20d|max_drawdown|outcome\.label" scripts/classify_institutional_withdrawal_lifecycle_v1.js; then
            echo "Forbidden outcome dependency detected in unified classifier"
            exit 1
          fi
      - name: Validation summary
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const life=JSON.parse(fs.readFileSync('data_research/institutional-flow/validation/institutional-withdrawal-lifecycle-v1.json','utf8'));
          const cov=JSON.parse(fs.readFileSync('data_research/institutional-flow/validation/validation-coverage-v1.json','utf8'));
          console.log('## Institutional Withdrawal Validation v1');
          console.log('');
          console.log(`- Fragile regression events: **${life.fragile_event_count}**`);
          console.log(`- Lifecycle states: \`${JSON.stringify(life.counts)}\``);
          console.log(`- Stock holdout ready: **${cov.counts.stock_holdout_ready}**`);
          console.log(`- Stock holdout needing Broker normalization: **${cov.counts.stock_holdout_needs_broker_normalization}**`);
          console.log(`- Time holdout ready: **${cov.counts.time_holdout_ready}**`);
          console.log('');
          console.log('No validation outcomes are generated by this workflow.');
          NODE

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
