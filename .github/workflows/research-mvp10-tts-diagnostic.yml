name: "[Research Only] MVP10 Edge TTS Bounded Diagnosis"
on:
  push:
    branches:
      - research/daily-video-mvp10-a-20261029
    paths:
      - .github/workflows/research-mvp10-tts-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/research/daily-video-mvp10-a-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Four interleaved control/target probes; no recording, upload, rendering, or production dispatch.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            video_scripts/daily-gainers/20261008.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install TTS-only dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'edge-tts==7.3.1'
      - name: Bounded no-upload Edge TTS probes
        env:
          TTS_VOICE: zh-TW-YunJheNeural
          TTS_RATE: '+15%'
        run: |
          python - <<'PY'
          import asyncio, json, os
          import edge_tts
          from pathlib import Path

          script = json.loads(Path('video_scripts/daily-gainers/20261008.json').read_text(encoding='utf-8'))
          opening = '大家好，歡迎來到 TAIWAN STOCK！追蹤資金，解讀行情。錢在哪，我們就在哪！那麼我們開始囉。'
          brand = ['大家好，歡迎來到 TAIWAN STOCK！', '追蹤資金，解讀行情。', '錢在哪，我們就在哪！', '那麼我們開始囉。']
          # Control requests bracket the target. If controls also fail, do not blame the V4 text.
          # Voice/text-only negative isolation; brand contract and script remain unchanged.
          # Determine whether failures are unique to one phrase or affect other
          # distinct normal Chinese text. No production narration changes.
          samples = [
            ('control_before', brand[0], 25),
            ('second_line', brand[1], 25),
            ('third_line', brand[2], 25),
            ('fourth_line', brand[3], 25),
            ('neutral_sentence', '今天開始分析市場行情。', 25),
            ('control_after', brand[0], 25),
          ]
          async def probe(label, text, timeout_s):
            n_audio = 0
            n_boundaries = 0
            try:
              stream = edge_tts.Communicate(text=text, voice=os.environ['TTS_VOICE'], rate=os.environ['TTS_RATE'], boundary='WordBoundary')
              async def consume():
                nonlocal n_audio, n_boundaries
                async for chunk in stream.stream():
                  if chunk['type'] == 'audio':
                    n_audio += len(chunk['data'])
                  elif chunk['type'] == 'WordBoundary':
                    n_boundaries += 1
              await asyncio.wait_for(consume(), timeout=timeout_s)
              ok = n_audio > 1000 and n_boundaries > 0
              print(f'PROBE {label}: audio_bytes={n_audio} word_boundaries={n_boundaries} status={"PASS" if ok else "FAIL"}', flush=True)
              return ok
            except Exception as exc:
              print(f'PROBE {label}: error_type={type(exc).__name__} partial_audio_bytes={n_audio} partial_word_boundaries={n_boundaries} timeout_s={timeout_s} status=FAIL', flush=True)
              return False
          async def main():
            results = []
            for label, text, timeout_s in samples:
              results.append(await probe(label, text, timeout_s))
            if not all(results):
              raise SystemExit(2)
          asyncio.run(main())
          PY
