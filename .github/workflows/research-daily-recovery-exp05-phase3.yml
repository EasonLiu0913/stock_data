name: "[Research] Daily Data Recovery Experiment 05 Phase 3"
on:
  push:
    branches: [research/daily-data-recovery-v2-exp01-20261013]
    paths:
      - 'scripts/research/experiment05_phase3_real_source.test.js'
      - '.github/workflows/research-daily-recovery-exp05-phase3.yml'
permissions:
  contents: read
jobs:
  real-archived-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/research/experiment05_phase3_real_source.test.js
            /scripts/generate_daily_gainers_over_5.js
            /data_fubon/fubon_20261007_sma.json
            /data_fubon/fubon_20261008_sma.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run actual producer with archived source in OS temp root
        run: |
          node scripts/research/experiment05_phase3_real_source.test.js
          test -f tmp/research/experiment05-phase3/real-source-evidence.json
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        with:
          name: experiment05-phase3-real-source
          path: tmp/research/experiment05-phase3/real-source-evidence.json
          retention-days: 7
