name: '[00 網站部署] 每日預測完成後立即發布'

on:
  workflow_run:
    workflows:
      - '04 預測覆盤 - 每日產生股票預測'
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy_prediction:
    name: Deploy base prediction data immediately
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/deploy-pages.yml
