name: "research: checkpoint fourth prospective catalyst evidence"
# bounded-writer-revision:v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/checkpoint-institutional-accumulation-fourth-window.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: institutional-accumulation-fourth-window-checkpoint-v1
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main bounded fourth-window evidence
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json
            /data_research/institutional-flow/official-disclosure-raw/prospective-catalyst-pit/
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate bounded fourth-window deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          delta_path=data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json
          cross_path=data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json
          observation_path=data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json
          fourth_path=data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json

          test "$(git hash-object "$delta_path")" = "cc5683ce3e33cb9b9c6ae74c42eb5c3a26f0ed00"
          test "$(git hash-object "$cross_path")" = "9dbee14b300980fb46ea7251b5707429071a80bf"

          node scripts/audit_institutional_accumulation_catalyst_prospective_observations.js --write
          node scripts/audit_institutional_accumulation_catalyst_prospective_fourth_window_longitudinal.js --write
          node scripts/audit_institutional_accumulation_catalyst_prospective_window_deltas.js > /tmp/delta-regenerated.json
          node scripts/audit_institutional_accumulation_catalyst_prospective_cross_day_window.js > /tmp/cross-regenerated.json
          cmp -s "$delta_path" /tmp/delta-regenerated.json
          cmp -s "$cross_path" /tmp/cross-regenerated.json

          node - <<'NODE'
          const fs = require('node:fs');
          const obs = JSON.parse(fs.readFileSync('data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json'));
          const fourth = JSON.parse(fs.readFileSync('data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json'));
          if (obs.valid_observation_count !== 24 || obs.invalid_observation_count !== 0 || obs.conflict_count !== 0 || obs.unique_immutable_snapshot_count !== 24) throw new Error('canonical observation counts mismatch');
          for (const stock of ['1102','1104','1216']) {
            const s = obs.stocks[stock];
            if (!s || s.total !== 8 || s.listing !== 4 || s.detail !== 4) throw new Error('stock shape mismatch '+stock);
          }
          if (obs.source_interface_counts.prospective_material_information_listing !== 12 || obs.source_interface_counts.prospective_material_information_detail !== 12) throw new Error('interface counts mismatch');
          if (fourth.observation_count !== 24 || fourth.chain_count !== 6 || fourth.unique_immutable_snapshot_count !== 24) throw new Error('fourth audit counts mismatch');
          if (fourth.fourth_window_gate.latest_third_collected_at !== '2026-09-11T14:10:45.797Z') throw new Error('latest third identity mismatch');
          if (!fourth.fourth_window_gate.later_asia_taipei_date || !fourth.fourth_window_gate.minimum_elapsed_satisfied) throw new Error('fourth window eligibility evidence mismatch');
          if (fourth.interpretation.outcome_association_opened !== false || fourth.interpretation.scheduler_authorized !== false || fourth.interpretation.broad_universe_authorized !== false) throw new Error('protected interpretation changed');
          NODE

          test "$(git hash-object "$delta_path")" = "cc5683ce3e33cb9b9c6ae74c42eb5c3a26f0ed00"
          test "$(git hash-object "$cross_path")" = "9dbee14b300980fb46ea7251b5707429071a80bf"
      - name: Race-safe checkpoint only bounded audit artifacts
        shell: bash
        run: |
          set -euo pipefail
          observation_path=data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json
          fourth_path=data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json
          cp "$observation_path" /tmp/observation-final.json
          cp "$fourth_path" /tmp/fourth-final.json

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/observation-final.json "$observation_path"
            mkdir -p "$(dirname "$fourth_path")"
            cp /tmp/fourth-final.json "$fourth_path"

            git add --sparse "$observation_path" "$fourth_path"
            if git diff --cached --quiet; then
              echo "bounded audit artifacts already durable"
              pushed=1
              break
            fi
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "research: checkpoint fourth prospective catalyst evidence"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "push race on attempt $attempt; retrying against current main"
          done
          test "$pushed" -eq 1
      - name: Verify durable remote bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          for p in             data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json             data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json; do
            git show "origin/main:$p" > "/tmp/$(basename "$p")"
          done
          node - <<'NODE'
          const fs = require('node:fs');
          const obs = JSON.parse(fs.readFileSync('/tmp/institutional-accumulation-catalyst-prospective-observation-audit-v1.json'));
          const fourth = JSON.parse(fs.readFileSync('/tmp/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json'));
          if (obs.valid_observation_count !== 24 || obs.invalid_observation_count !== 0 || obs.conflict_count !== 0) throw new Error('remote observation audit not durable');
          if (fourth.observation_count !== 24 || fourth.chain_count !== 6) throw new Error('remote fourth audit not durable');
          NODE

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for schedule summary
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js
