name: "research: checkpoint sixth prospective catalyst evidence"
# bounded-writer-sixth-window:v1
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/checkpoint-institutional-accumulation-sixth-window.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: institutional-accumulation-sixth-window-checkpoint-v1
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main bounded sixth-window evidence
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json
            /data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fifth-window-longitudinal-audit-v1.json
            /data_research/institutional-flow/official-disclosure-raw/prospective-catalyst-pit/
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate bounded sixth-window deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          delta=data_research/institutional-flow/institutional-accumulation-catalyst-prospective-window-delta-audit-v1.json
          cross=data_research/institutional-flow/institutional-accumulation-catalyst-prospective-cross-day-audit-v1.json
          fourth=data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fourth-window-longitudinal-audit-v1.json
          fifth=data_research/institutional-flow/institutional-accumulation-catalyst-prospective-fifth-window-longitudinal-audit-v1.json
          obs=data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json
          sixth=data_research/institutional-flow/institutional-accumulation-catalyst-prospective-sixth-window-longitudinal-audit-v1.json
          test "$(git hash-object "$delta")" = "cc5683ce3e33cb9b9c6ae74c42eb5c3a26f0ed00"
          test "$(git hash-object "$cross")" = "9dbee14b300980fb46ea7251b5707429071a80bf"
          test "$(git hash-object "$fourth")" = "31c13856af41fee4f277103807b081873dd780e1"
          test "$(git hash-object "$fifth")" = "d3ae72fea05ace0815b9c7d22931a19a7fb32fdd"
          node scripts/audit_institutional_accumulation_catalyst_prospective_observations.js --write
          node scripts/audit_institutional_accumulation_catalyst_prospective_sixth_window_longitudinal.js --write
          node scripts/audit_institutional_accumulation_catalyst_prospective_window_deltas.js > /tmp/delta.json
          node scripts/audit_institutional_accumulation_catalyst_prospective_cross_day_window.js > /tmp/cross.json
          node scripts/audit_institutional_accumulation_catalyst_prospective_fourth_window_longitudinal.js > /tmp/fourth.json
          node scripts/audit_institutional_accumulation_catalyst_prospective_fifth_window_longitudinal.js > /tmp/fifth.json
          cmp -s "$delta" /tmp/delta.json
          cmp -s "$cross" /tmp/cross.json
          cmp -s "$fourth" /tmp/fourth.json
          cmp -s "$fifth" /tmp/fifth.json
          node - <<'NODE'
          const fs=require('node:fs');
          const o=JSON.parse(fs.readFileSync('data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json'));
          const s=JSON.parse(fs.readFileSync('data_research/institutional-flow/institutional-accumulation-catalyst-prospective-sixth-window-longitudinal-audit-v1.json'));
          if(o.valid_observation_count!==36||o.invalid_observation_count!==0||o.conflict_count!==0||o.unique_immutable_snapshot_count!==36) throw new Error('observation mismatch');
          for(const stock of ['1102','1104','1216']){const x=o.stocks[stock];if(x.total!==12||x.listing!==6||x.detail!==6)throw new Error('stock mismatch '+stock);}
          if(o.source_interface_counts.prospective_material_information_listing!==18||o.source_interface_counts.prospective_material_information_detail!==18) throw new Error('interface mismatch');
          if(s.observation_count!==36||s.chain_count!==6||s.sixth_window_gate.latest_fifth_collected_at!=='2026-09-23T12:09:31.642Z'||!s.sixth_window_gate.later_asia_taipei_date||!s.sixth_window_gate.minimum_elapsed_satisfied) throw new Error('sixth gate mismatch');
          NODE
      - name: Race-safe checkpoint only bounded sixth-window artifacts
        shell: bash
        run: |
          set -euo pipefail
          obs=data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json
          sixth=data_research/institutional-flow/institutional-accumulation-catalyst-prospective-sixth-window-longitudinal-audit-v1.json
          cp "$obs" /tmp/obs.json
          cp "$sixth" /tmp/sixth.json
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/obs.json "$obs"
            cp /tmp/sixth.json "$sixth"
            git add --sparse "$obs" "$sixth"
            if git diff --cached --quiet; then pushed=1; break; fi
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "research: checkpoint sixth prospective catalyst evidence"
            if git push origin HEAD:main; then pushed=1; break; fi
          done
          test "$pushed" -eq 1
      - name: Verify durable remote bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show "origin/main:data_research/institutional-flow/institutional-accumulation-catalyst-prospective-observation-audit-v1.json" > /tmp/obs.json
          git show "origin/main:data_research/institutional-flow/institutional-accumulation-catalyst-prospective-sixth-window-longitudinal-audit-v1.json" > /tmp/sixth.json
          node - <<'NODE'
          const fs=require('node:fs');
          const o=JSON.parse(fs.readFileSync('/tmp/obs.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/sixth.json'));
          if(o.valid_observation_count!==36||o.invalid_observation_count!==0||o.conflict_count!==0) throw new Error('remote obs not durable');
          if(s.observation_count!==36||s.chain_count!==6) throw new Error('remote sixth not durable');
          NODE
