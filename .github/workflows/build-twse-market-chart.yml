name: "[03 市場環境] Build TWSE Market Chart"

on:
  schedule:
    # 平日 18:57 台北時間 (10:57 UTC)
    - cron: '57 10 * * 1-5'
    # 隔日 02:33 台北時間再次補抓；scheduled occurrence 仍屬前一個台北交易日
    - cron: '33 18 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target Date (YYYYMMDD, e.g. 20260724)'
        required: false
        default: ''
      start_date:
        description: 'History Start Date (YYYYMMDD)'
        required: false
        default: ''
      full_rebuild:
        description: 'Explicitly rebuild the complete history using fresh-runner physical month batches'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-twse-market-chart
  cancel-in-progress: false

jobs:
  route-and-daily-refresh:
    name: Route TWSE refresh
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.route.outputs.target_date }}
      start_date: ${{ steps.route.outputs.start_date }}
      matrix: ${{ steps.route.outputs.matrix }}
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/build_twse_market_chart.js
            /scripts/resolve_scheduled_collection_date.js
            /scripts/resolve_forecast_dates.js
            /data_history_sma/non_trading_days.json
            /data_twse_market_chart/market_chart.json

      - name: Resolve target date and route workload
        id: route
        shell: bash
        env:
          DATE_INPUT: ${{ github.event.inputs.date || '' }}
          START_DATE_INPUT: ${{ github.event.inputs.start_date || '' }}
          FULL_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.full_rebuild || false }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail

          echo "Planner runtime Node: $(node --version)"

          if [ -n "${DATE_INPUT:-}" ]; then
            TARGET_DATE="$DATE_INPUT"
            DATE_SOURCE="manual input"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            TARGET_DATE="$(node scripts/resolve_scheduled_collection_date.js \
              --event-name "$EVENT_NAME" \
              --schedule "$EVENT_SCHEDULE" \
              --policy same_trade_date \
              --day-boundary-hour 8)"
            DATE_SOURCE="logical scheduled trade date with 08:00 boundary"
          else
            TARGET_DATE=$(TZ='Asia/Taipei' date --date='8 hours ago' '+%Y%m%d')
            DATE_SOURCE="manual Taipei 08:00 cutoff"
          fi

          if [ -n "${START_DATE_INPUT:-}" ]; then
            START_DATE="$START_DATE_INPUT"
          else
            START_DATE=$(node - <<'NODE'
          const fs = require('node:fs');
          const file = 'data_twse_market_chart/market_chart.json';
          let start = '20251103';
          try {
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (/^20\d{6}$/.test(String(payload.startDate || ''))) start = payload.startDate;
          } catch {}
          process.stdout.write(start);
          NODE
            )
          fi

          PLAN_JSON=$(START_DATE="$START_DATE" TARGET_DATE="$TARGET_DATE" FULL_REBUILD="$FULL_REBUILD" node - <<'NODE'
          const fs = require('node:fs');
          const { selectMonthsToFetch } = require('./scripts/build_twse_market_chart');
          let existing = null;
          try {
            existing = JSON.parse(fs.readFileSync('data_twse_market_chart/market_chart.json', 'utf8'));
          } catch {}
          const months = selectMonthsToFetch(
            process.env.START_DATE,
            process.env.TARGET_DATE,
            existing,
            process.env.FULL_REBUILD === 'true'
          ).map(value => value.slice(0, 6));
          process.stdout.write(JSON.stringify(months));
          NODE
          )

          COUNT=$(PLAN_JSON="$PLAN_JSON" node -e "process.stdout.write(String(JSON.parse(process.env.PLAN_JSON).length))")
          if [ "$COUNT" -eq 0 ]; then
            MODE="no-fetch"
          elif [ "$COUNT" -eq 1 ] && [ "$FULL_REBUILD" != "true" ]; then
            MODE="daily-single-month"
          else
            MODE="physical-batch"
          fi

          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "matrix=$PLAN_JSON" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          echo "Target date: $TARGET_DATE ($DATE_SOURCE)"
          echo "Start date: $START_DATE"
          echo "Planned months: $PLAN_JSON"
          echo "Refresh mode: $MODE"

      - name: Normal single-month daily refresh
        if: steps.route.outputs.mode == 'daily-single-month'
        shell: bash
        env:
          PLAN_JSON: ${{ steps.route.outputs.matrix }}
          TARGET_DATE: ${{ steps.route.outputs.target_date }}
          START_DATE: ${{ steps.route.outputs.start_date }}
        run: |
          set -euo pipefail
          MONTH=$(node -e "process.stdout.write(JSON.parse(process.env.PLAN_JSON)[0])")
          echo "Normal daily refresh: $MONTH"
          node scripts/build_twse_market_chart.js \
            --date "$TARGET_DATE" \
            --start-date "$START_DATE" \
            --fetch-month "$MONTH" \
            --min-delay 1200 \
            --max-delay 2500 \
            --max-retries 3

      - name: Checkpoint normal daily refresh
        if: steps.route.outputs.mode == 'daily-single-month'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_twse_market_chart/market_chart.json

          if git diff --staged --quiet; then
            echo "Normal daily refresh produced no market chart changes."
            exit 0
          fi

          git commit -m "chore: update TWSE market chart daily"
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Daily checkpoint race; retry ${attempt}/5."
            sleep $((attempt * 5))
          done
          echo "Unable to checkpoint normal TWSE daily refresh." >&2
          exit 1

      - name: Verify normal daily refresh is durable
        if: steps.route.outputs.mode == 'daily-single-month'
        shell: bash
        env:
          TARGET_DATE: ${{ steps.route.outputs.target_date }}
        run: |
          set -euo pipefail
          git fetch origin main
          remote_end=$(git show origin/main:data_twse_market_chart/market_chart.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).endDate || ''))")
          echo "Remote market-chart endDate: $remote_end"
          if [ "$remote_end" > "$TARGET_DATE" ] || [ "$remote_end" = "$TARGET_DATE" ]; then
            echo "Normal daily refresh is durable on origin/main."
          else
            echo "Remote market-chart is still behind target: remote=$remote_end target=$TARGET_DATE" >&2
            exit 1
          fi

      - name: No-fetch reuse summary
        if: steps.route.outputs.mode == 'no-fetch'
        run: echo "Target date is already covered; reusing durable market-chart data without TWSE requests."

  physical-month-batches:
    name: Fetch TWSE month ${{ matrix.month }}
    needs: route-and-daily-refresh
    if: needs.route-and-daily-refresh.outputs.mode == 'physical-batch'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        month: ${{ fromJSON(needs.route-and-daily-refresh.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main on fresh runner
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Randomized physical-batch cooldown
        shell: bash
        run: |
          set -euo pipefail
          delay=$((5 + RANDOM % 16))
          echo "Physical batch cooldown: ${delay}s"
          sleep "$delay"

      - name: Fetch one bounded TWSE month
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build_twse_market_chart.js \
            --date "${{ needs.route-and-daily-refresh.outputs.target_date }}" \
            --start-date "${{ needs.route-and-daily-refresh.outputs.start_date }}" \
            --fetch-month "${{ matrix.month }}" \
            --min-delay 1200 \
            --max-delay 2500 \
            --max-retries 3

      - name: Commit and checkpoint physical batch
        shell: bash
        env:
          BATCH_MONTH: ${{ matrix.month }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_twse_market_chart/market_chart.json

          if git diff --staged --quiet; then
            echo "No TWSE market chart changes for ${BATCH_MONTH}; checkpoint not needed."
            exit 0
          fi

          git commit -m "chore: update TWSE market chart ${BATCH_MONTH}"
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Checkpoint race; retry ${attempt}/5 after cooldown."
            sleep $((attempt * 5))
          done
          echo "Unable to checkpoint TWSE month ${BATCH_MONTH} after retries." >&2
          exit 1

      - name: Verify physical batch is durable on remote main
        shell: bash
        env:
          BATCH_MONTH: ${{ matrix.month }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:data_twse_market_chart/market_chart.json > /tmp/market_chart.json
          BATCH_MONTH="$BATCH_MONTH" node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/market_chart.json', 'utf8'));
          const rows = Array.isArray(payload.data) ? payload.data : [];
          const monthRows = rows.filter(row => String(row.date || '').startsWith(process.env.BATCH_MONTH));
          if (!monthRows.length) {
            throw new Error(`Remote main has no durable TWSE rows for physical batch ${process.env.BATCH_MONTH}`);
          }
          console.log(`Verified durable TWSE batch ${process.env.BATCH_MONTH}: ${monthRows.length} rows`);
          NODE

  market-chart-gate:
    name: TWSE refresh gate
    needs: [route-and-daily-refresh, physical-month-batches]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate routed refresh
        shell: bash
        env:
          ROUTE_RESULT: ${{ needs.route-and-daily-refresh.result }}
          MODE: ${{ needs.route-and-daily-refresh.outputs.mode }}
          BATCH_RESULT: ${{ needs.physical-month-batches.result }}
        run: |
          set -euo pipefail
          if [ "$ROUTE_RESULT" != "success" ]; then
            echo "TWSE route/daily refresh failed." >&2
            exit 1
          fi
          if [ "$MODE" = "physical-batch" ] && [ "$BATCH_RESULT" != "success" ]; then
            echo "At least one TWSE physical month batch failed: $BATCH_RESULT" >&2
            exit 1
          fi
          echo "TWSE refresh gate passed in mode: $MODE"

  refresh-tsmc-equipment-dashboard:
    name: Refresh TSMC equipment demand dashboard
    needs: market-chart-gate
    uses: ./.github/workflows/build-tsmc-equipment-demand-dashboard.yml
    with:
      deploy_pages: false

  refresh_mops_revenue_events:
    name: Refresh MOPS revenue event study
    needs: refresh-tsmc-equipment-dashboard
    uses: ./.github/workflows/refresh-mops-revenue-event-returns.yml

  deploy_pages:
    name: Deploy latest TWSE market chart, TSMC dashboard, and event study to Pages
    needs: refresh_mops_revenue_events
    uses: ./.github/workflows/deploy-pages.yml

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for schedule summary
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js
