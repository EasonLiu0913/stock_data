name: "[06 回填修復] Fast Backfill Institutional Status 20260824"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backfill-institutional-status-fast-20260824.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fast-backfill-institutional-status-20260824
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout required institutional files
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/reconcile_institutional_data.js
            /scripts/generate_file_lists.js
            /data_twse/twse_industry.csv
            /data_fubon/

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Reconcile 20260824 institutional completeness
        run: |
          node --check scripts/reconcile_institutional_data.js
          node scripts/reconcile_institutional_data.js --date 20260824
          node scripts/generate_file_lists.js --only data_fubon

      - name: Commit status metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_fubon/
          if git diff --staged --quiet; then
            echo "No 20260824 institutional status changes to commit"
            exit 0
          fi
          git commit -m "data: reconcile institutional health status 20260824"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

  deploy-pages:
    name: Backfill 完成後發布 GitHub Pages
    needs: reconcile
    if: needs.reconcile.result == 'success'
    uses: ./.github/workflows/deploy-pages.yml
