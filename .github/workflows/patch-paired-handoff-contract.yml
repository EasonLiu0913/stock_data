# one-time documentation patch trigger v3
name: "[07 維護更新] Patch Paired Handoff Contract"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-paired-handoff-contract.yml"

permissions:
  contents: write

concurrency:
  group: patch-paired-handoff-contract
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch AGENTS and canonical handoff
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > "$RUNNER_TEMP/patch.py"
          python "$RUNNER_TEMP/patch.py"

      - name: Commit documentation contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md data_research/institutional-flow/institutional-withdrawal-validation-handoff.md
          git diff --cached --check
          git commit -m "docs: require paired implementation and closeout prompts"
          git push origin HEAD:main

  schedule-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        run: |
          echo '## Patch Paired Handoff Contract' >> "$GITHUB_STEP_SUMMARY"
          echo '- Trigger: one-time documentation maintenance push.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Purpose: add paired Prompt A / Prompt B handoff rules and project flow.' >> "$GITHUB_STEP_SUMMARY"
