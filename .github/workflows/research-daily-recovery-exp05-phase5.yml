name: "[Research] Daily Recovery Experiment 05 Phase 5"
on:
  push:
    branches: [research/daily-data-recovery-v2-exp01-20261013]
    paths:
      - 'scripts/research/experiment05_phase5_writer.js'
      - 'scripts/research/experiment05_phase5_writer.test.js'
      - '.github/workflows/research-daily-recovery-exp05-phase5.yml'
permissions:
  contents: read
jobs:
  isolated-writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/research/experiment05_phase5_writer.js
            /scripts/research/experiment05_phase5_writer.test.js
            /scripts/generate_daily_gainers_over_5.js
            /data_fubon/fubon_20261007_sma.json
            /data_fubon/fubon_20261008_sma.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Real archived source isolated immutable writer
        run: |
          node scripts/research/experiment05_phase5_writer.test.js
          test -s tmp/research/experiment05-phase5/writer-evidence.json
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        with:
          name: experiment05-phase5-writer
          path: tmp/research/experiment05-phase5/writer-evidence.json
          retention-days: 7
