name: Research M5-R Multimodel Acoustic Contract
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preregistration-only:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/m5-r-weight-evidence-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            data_research/m5
          sparse-checkout-cone-mode: true
      - name: Validate locked M5-R contract without installing or running models
        run: |
          set -euo pipefail
          python -m py_compile scripts/verify_m5_r_research_contract.py
          python scripts/verify_m5_r_research_contract.py | tee m5-r-contract-result.txt
      - name: M5-R2 static weight audit only, no model downloads
        run: |
          set -euo pipefail
          python -m py_compile scripts/verify_m5_r2_weight_audit.py
          python scripts/verify_m5_r2_weight_audit.py | tee m5-r2-weight-audit-result.txt
      - name: M5-R3 static provenance preregistration only; no external network or weights
        run: |
          set -euo pipefail
          python -m py_compile scripts/verify_m5_r3_provenance_gate.py
          python scripts/verify_m5_r3_provenance_gate.py | tee m5-r3-provenance-result.txt
      - name: Validate pinned source ledger without fetching model bytes
        run: |
          set -euo pipefail
          python -m py_compile scripts/verify_m5_r3_immutable_ledger.py
          python scripts/verify_m5_r3_immutable_ledger.py | tee m5-r3-ledger-result.txt
      - name: Official pinned metadata capture only (no weight endpoints)
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m py_compile scripts/capture_m5_r3_official_metadata.py
          python scripts/capture_m5_r3_official_metadata.py | tee m5-r3-metadata-result.txt
      - name: Compare four pinned official tree and sibling manifests metadata-only
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m py_compile scripts/capture_m5_r3_tree_crosscheck.py
          python scripts/capture_m5_r3_tree_crosscheck.py | tee m5-r3-tree-result.txt
      - name: Hash allowlisted immutable small non-weight README and LICENSE text only
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m py_compile scripts/capture_m5_r3_small_nonweight_text.py
          python scripts/capture_m5_r3_small_nonweight_text.py | tee m5-r3-small-text-result.txt
      - name: Upload metadata-only proof separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-r3-metadata-only-${{ github.run_id }}
          path: |
            m5-r3-metadata-result.txt
            m5-r3-metadata-proof/metadata.json
            m5-r3-metadata-proof/metadata.sha256
            m5-r3-tree-result.txt
            m5-r3-tree-proof/tree-proof.json
            m5-r3-tree-proof/tree-proof.sha256
            m5-r3-small-text-result.txt
            m5-r3-small-text-proof/small-text.json
            m5-r3-small-text-proof/small-text.sha256
          if-no-files-found: warn
          retention-days: 14
      - name: Single-pass original-audio seven-scene private candidate
        id: m5_bulk_candidate
        run: |
          set -euo pipefail
          python -m py_compile scripts/m5_bulk_private_candidate.py
          for attempt in 1 2 3; do
            if python scripts/m5_bulk_private_candidate.py --github-token "$GH_TOKEN" --output m5-bulk-private-proof | tee m5-bulk-private-result.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "M5_BULK_PRIVATE_CANDIDATE_FAILED; no publication authorization" >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload private candidate proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-bulk-private-candidate-${{ github.run_id }}
          path: |
            m5-bulk-private-result.txt
            m5-bulk-private-proof/candidate.srt
            m5-bulk-private-proof/proof.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload research contract proof only
        uses: actions/upload-artifact@v4
        with:
          name: m5-r-contract-only-${{ github.run_id }}
          path: |
            m5-r-contract-result.txt
            m5-r2-weight-audit-result.txt
            m5-r3-provenance-result.txt
            m5-r3-ledger-result.txt
            data_research/m5/m5-r3-license-resource-risk.json
            data_research/m5/m5-r3-immutable-evidence-ledger.json
            scripts/verify_m5_r3_immutable_ledger.py
            data_research/m5/m5-r3-provenance-gate.json
            scripts/verify_m5_r3_provenance_gate.py
            data_research/m5/m5-r2-weight-audit.json
            data_research/m5/m5-r-model-inventory.json
            data_research/m5/m5-r-multimodel-acoustic-contract.md
          if-no-files-found: error
          retention-days: 14
