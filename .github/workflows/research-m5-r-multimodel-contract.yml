name: Research M5-R Multimodel Acoustic Contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preregistration-only:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            data_research/m5
          sparse-checkout-cone-mode: true
      - name: Validate locked M5-R contract without installing or running models
        run: |
          set -euo pipefail
          python -m py_compile scripts/verify_m5_r_research_contract.py
          python scripts/verify_m5_r_research_contract.py | tee m5-r-contract-result.txt
      - name: M5-R2 static weight audit only, no model downloads
        run: |
          set -euo pipefail
          python -m py_compile scripts/verify_m5_r2_weight_audit.py
          python scripts/verify_m5_r2_weight_audit.py | tee m5-r2-weight-audit-result.txt
      - name: M5-R3 static provenance preregistration only; no external network or weights
        run: |
          set -euo pipefail
          python -m py_compile scripts/verify_m5_r3_provenance_gate.py
          python scripts/verify_m5_r3_provenance_gate.py | tee m5-r3-provenance-result.txt
      - name: Validate pinned source ledger without fetching model bytes
        run: |
          set -euo pipefail
          python -m py_compile scripts/verify_m5_r3_immutable_ledger.py
          python scripts/verify_m5_r3_immutable_ledger.py | tee m5-r3-ledger-result.txt
      - name: Official pinned metadata capture only (no weight endpoints)
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m py_compile scripts/capture_m5_r3_official_metadata.py
          python scripts/capture_m5_r3_official_metadata.py | tee m5-r3-metadata-result.txt
      - name: Upload metadata-only proof separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-r3-metadata-only-${{ github.run_id }}
          path: |
            m5-r3-metadata-result.txt
            m5-r3-metadata-proof/metadata.json
            m5-r3-metadata-proof/metadata.sha256
          if-no-files-found: warn
          retention-days: 14
      - name: Upload research contract proof only
        uses: actions/upload-artifact@v4
        with:
          name: m5-r-contract-only-${{ github.run_id }}
          path: |
            m5-r-contract-result.txt
            m5-r2-weight-audit-result.txt
            m5-r3-provenance-result.txt
            m5-r3-ledger-result.txt
            data_research/m5/m5-r3-immutable-evidence-ledger.json
            scripts/verify_m5_r3_immutable_ledger.py
            data_research/m5/m5-r3-provenance-gate.json
            scripts/verify_m5_r3_provenance_gate.py
            data_research/m5/m5-r2-weight-audit.json
            data_research/m5/m5-r-model-inventory.json
            data_research/m5/m5-r-multimodel-acoustic-contract.md
          if-no-files-found: error
          retention-days: 14
