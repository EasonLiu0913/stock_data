name: '[07 研究] FinMind－季財報品質候選池分批回填'

on:
  workflow_dispatch:
    inputs:
      core_score_threshold:
        description: '高強度軌：月營收分數門檻'
        required: true
        type: number
        default: 9
      core_min_hits:
        description: '高強度軌：至少命中月份數'
        required: true
        type: number
        default: 2
      persistent_score_threshold:
        description: '持續強度軌：月營收分數門檻'
        required: true
        type: number
        default: 8
      persistent_min_hits:
        description: '持續強度軌：至少命中月份數'
        required: true
        type: number
        default: 3
      batch_index:
        description: '0-based 批次編號'
        required: true
        type: number
        default: 0
      batch_size:
        description: '每批股票數，建議 20'
        required: true
        type: number
        default: 20
      delay_ms:
        description: '每檔股票之間基本延遲毫秒，建議 2000'
        required: true
        type: number
        default: 2000
      jitter_ms:
        description: '額外隨機延遲毫秒，建議 750'
        required: true
        type: number
        default: 750
      start_quarter:
        description: '起始季度'
        required: true
        type: string
        default: '2023Q1'
      end_quarter:
        description: '結束季度；尚未到保守公布日會標記 pending 而非失敗'
        required: true
        type: string
        default: '2026Q2'
      force:
        description: '強制重抓已完成股票'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: finmind-quarterly-financial-quality-batch-${{ inputs.batch_index }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync to latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate batch backfill scripts
        run: |
          node --check scripts/backfill_finmind_quarterly_financial_quality.js
          node --check scripts/backfill_finmind_quarterly_financial_quality_batch.js
          node --check scripts/generate_financial_quality_score_timeline.js
          node --test tests/mops_quarterly_financial_quality.test.js

      - name: Backfill selected candidate batch
        env:
          CORE_SCORE_THRESHOLD: ${{ inputs.core_score_threshold }}
          CORE_MIN_HITS: ${{ inputs.core_min_hits }}
          PERSISTENT_SCORE_THRESHOLD: ${{ inputs.persistent_score_threshold }}
          PERSISTENT_MIN_HITS: ${{ inputs.persistent_min_hits }}
          BATCH_INDEX: ${{ inputs.batch_index }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          DELAY_MS: ${{ inputs.delay_ms }}
          JITTER_MS: ${{ inputs.jitter_ms }}
          START_QUARTER: ${{ inputs.start_quarter }}
          END_QUARTER: ${{ inputs.end_quarter }}
          FORCE: ${{ inputs.force }}
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/backfill_finmind_quarterly_financial_quality_batch.js \
            --core-score-threshold "$CORE_SCORE_THRESHOLD" \
            --core-min-hits "$CORE_MIN_HITS" \
            --persistent-score-threshold "$PERSISTENT_SCORE_THRESHOLD" \
            --persistent-min-hits "$PERSISTENT_MIN_HITS" \
            --batch-index "$BATCH_INDEX" \
            --batch-size "$BATCH_SIZE" \
            --delay-ms "$DELAY_MS" \
            --jitter-ms "$JITTER_MS" \
            --start-quarter "$START_QUARTER" \
            --end-quarter "$END_QUARTER" \
            --force "$FORCE"

      - name: Commit batch progress
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_finmind_quarterly_financial_quality data_prediction_analysis/quarterly-financial-quality/batch-status
          if git diff --cached --quiet; then
            echo 'No quarterly financial quality changes'
            exit 0
          fi
          git commit -m "data: backfill FinMind financial quality batch ${{ inputs.batch_index }}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

      - name: Summarize next batch
        if: always()
        env:
          CORE_SCORE_THRESHOLD: ${{ inputs.core_score_threshold }}
          CORE_MIN_HITS: ${{ inputs.core_min_hits }}
          PERSISTENT_SCORE_THRESHOLD: ${{ inputs.persistent_score_threshold }}
          PERSISTENT_MIN_HITS: ${{ inputs.persistent_min_hits }}
          BATCH_INDEX: ${{ inputs.batch_index }}
          DELAY_MS: ${{ inputs.delay_ms }}
          JITTER_MS: ${{ inputs.jitter_ms }}
        run: |
          echo "## FinMind 季財報品質候選池分批回填" >> "$GITHUB_STEP_SUMMARY"
          echo "- 高強度軌：score >= $CORE_SCORE_THRESHOLD，至少 $CORE_MIN_HITS 個月" >> "$GITHUB_STEP_SUMMARY"
          echo "- 持續強度軌：score >= $PERSISTENT_SCORE_THRESHOLD，至少 $PERSISTENT_MIN_HITS 個月" >> "$GITHUB_STEP_SUMMARY"
          echo "- 請求節奏：每檔至少 ${DELAY_MS}ms + 0~${JITTER_MS}ms jitter" >> "$GITHUB_STEP_SUMMARY"
          echo "- 429/5xx/timeout：2s → 5s → 10s 退避重試" >> "$GITHUB_STEP_SUMMARY"
          echo "- 本批 batch_index：$BATCH_INDEX" >> "$GITHUB_STEP_SUMMARY"
          echo "- 下一批請使用 batch_index：$((BATCH_INDEX + 1))" >> "$GITHUB_STEP_SUMMARY"
