name: "[06 回填修復] VIX 指數－區間資料補齊"

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '起始美國市場日期 YYYYMMDD'
        required: true
        default: '20251103'
        type: string
      end_date:
        description: '結束美國市場日期 YYYYMMDD；留空依紐約時間判斷'
        required: false
        default: ''
        type: string
      batch_size:
        description: '每批市場日數'
        required: true
        default: '10'
        type: string
      force:
        description: '覆寫既有日期'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: backfill-vix-index-range
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --test tests/crawl_vix_index.test.js tests/refresh_dataset_indexes.test.js
      - id: plan
        shell: bash
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          end="$END_DATE"; [ -n "$end" ] || end=$(node scripts/crawl_vix_index.js --resolve-date)
          args=(--plan-only --start "$START_DATE" --end "$end" --batch-size "$BATCH_SIZE")
          [ "$FORCE" = true ] && args+=(--force)
          node scripts/crawl_vix_index.js "${args[@]}" > /tmp/plan.json
          cat /tmp/plan.json
          matrix=$(node -e "const p=require('/tmp/plan.json');process.stdout.write(JSON.stringify(p.matrix))")
          pending=$(node -e "const p=require('/tmp/plan.json');process.stdout.write(String(p.pending_date_count))")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "has_work=$([ "$pending" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backfill:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: 區間批次回填
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Crawl and safely push each VIX date
        env:
          BATCH_DATES: ${{ matrix.dates }}
          INPUT_FORCE: ${{ inputs.force }}
        run: bash scripts/run_vix_range_batch.sh
      - if: always()
        run: echo "batch ${{ matrix.batch_index }}/${{ matrix.batch_count }}：${{ matrix.first_date }} ～ ${{ matrix.last_date }}" >> "$GITHUB_STEP_SUMMARY"

  complete:
    needs: [plan, backfill]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "待補日期：${{ needs.plan.outputs.pending }}"
          if [ "${{ needs.plan.result }}" != success ]; then exit 1; fi
          if [ "${{ needs.plan.outputs.has_work }}" = true ] && [ "${{ needs.backfill.result }}" != success ]; then exit 1; fi
