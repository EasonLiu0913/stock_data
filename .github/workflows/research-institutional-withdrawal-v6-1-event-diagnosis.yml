name: "[07 研究] Institutional Withdrawal v6.1 Event Diagnosis"

on:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_institutional_withdrawal_v6_1_events.js'
      - 'data_research/institutional-flow/backtests/institutional-withdrawal-v6-distribution-absorption.json'
      - '.github/workflows/research-institutional-withdrawal-v6-1-event-diagnosis.yml'
  workflow_dispatch:

concurrency:
  group: institutional-withdrawal-v6-1-event-diagnosis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research slice
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            data_research/institutional-flow/backtests
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Validate analyzer
        run: node --check scripts/analyze_institutional_withdrawal_v6_1_events.js
      - name: Run v6.1 event diagnosis
        run: node scripts/analyze_institutional_withdrawal_v6_1_events.js
      - name: Validate diagnosis contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('data_research/institutional-flow/backtests/institutional-withdrawal-v6-1-event-diagnosis.json','utf8'));
          if(p.methodology!=='institutional-withdrawal-v6-1-event-diagnosis-v1') throw new Error('Unexpected methodology');
          if(p.fragile_event_count!==10) throw new Error(`Expected 10 fragile events, got ${p.fragile_event_count}`);
          if(!p.kyec_2449 || !Array.isArray(p.kyec_2449.timeline)) throw new Error('Missing 2449 timeline');
          if(!p.events.every(e=>Array.isArray(e.pre_anchor_history)&&e.pre_anchor_history.length>=1)) throw new Error('Missing pre-anchor history');
          NODE
      - name: Commit v6.1 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_research/institutional-flow/backtests/institutional-withdrawal-v6-1-event-diagnosis.json data_research/institutional-flow/backtests/institutional-withdrawal-v6-1-event-diagnosis.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: complete institutional withdrawal v6.1 diagnosis'
          git pull --rebase origin main
          git push origin HEAD:main

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
