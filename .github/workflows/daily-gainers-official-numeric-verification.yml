name: "[07 驗證] Daily Gainers Official Numeric Verification"
run-name: "Official numeric ${{ inputs.target_date }}"

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "TWSE trading date YYYYMMDD (historical backfill supported)"
        required: true
        type: string
        default: "20261104"
      refresh_facts:
        description: "Rebuild this date's deterministic Facts from its committed source snapshots before verification"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: official-numeric-${{ inputs.target_date }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1
      - name: Validate requested date
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          [[ "$TARGET_DATE" =~ ^20[0-9]{6}$ ]] || exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Rebuild dated Facts from committed official source snapshots
        if: inputs.refresh_facts
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          node --check scripts/build_daily_gainers_ai_facts.js
          node scripts/build_daily_gainers_ai_facts.js "$TARGET_DATE"
          node scripts/daily_gainers_ai_contract_cli.js assert-facts "data_daily_gain_over_5/analysis-facts/$TARGET_DATE.json"
      - name: Reconcile original official numeric data against stored Facts
        id: verify
        continue-on-error: true
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: node scripts/verify_daily_gainers_official_numeric.js "$TARGET_DATE"
      - name: Upload audit report even when validation fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-numeric-${{ inputs.target_date }}-${{ github.run_id }}
          path: data_daily_gain_over_5/verification/official-numeric/${{ inputs.target_date }}.json
          if-no-files-found: warn
      - name: Commit refreshed Facts and PASS receipt only
        if: steps.verify.outcome == 'success'
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          REFRESH_FACTS: ${{ inputs.refresh_facts }}
        run: |
          set -euo pipefail
          FILE="data_daily_gain_over_5/verification/official-numeric/$TARGET_DATE.json"
          FACTS="data_daily_gain_over_5/analysis-facts/$TARGET_DATE.json"
          validate_receipt() {
            node -e "const r=require('./'+process.argv[1]);if(r.status!=='PASS'||r.target_date!==process.argv[2])process.exit(1)" "$FILE" "$TARGET_DATE"
          }
          validate_receipt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$FACTS" "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "verification: official numeric PASS $TARGET_DATE [run ${{ github.run_id }}]"
          before_rebase="$(git rev-parse HEAD)"
          git fetch origin main
          git rebase origin/main
          if [ "$(git rev-parse HEAD)" != "$before_rebase" ]; then
            if [ "$REFRESH_FACTS" = "true" ]; then
              node scripts/build_daily_gainers_ai_facts.js "$TARGET_DATE"
              node scripts/daily_gainers_ai_contract_cli.js assert-facts "$FACTS"
            fi
            node scripts/verify_daily_gainers_official_numeric.js "$TARGET_DATE"
            validate_receipt
            git add -- "$FACTS" "$FILE"
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
      - name: Fail closed when source numeric reconciliation fails
        if: steps.verify.outcome != 'success'
        run: exit 1
