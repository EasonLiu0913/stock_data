name: "[03 市場環境] Refresh TSMC Equipment Demand Dashboard"

on:
  push:
    branches:
      - main
    paths:
      - "data_twse_market_chart/market_chart.json"
      - "data_twse_mi_index/**"
      - "data_history_sma/**"
      - "data_fubon/**"
      - "scripts/lib/stock_price_provider.js"
      - "scripts/build_tsmc_equipment_demand_dashboard_data.js"
      - "public/tsmc-equipment-demand-dashboard.html"
      - ".github/workflows/build-tsmc-equipment-demand-dashboard.yml"
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy Pages after refreshing the dashboard payload"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      deploy_pages:
        description: "Deploy Pages after refreshing the dashboard payload"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  DASHBOARD_PAYLOAD: data_prediction_analysis/tsmc-equipment-demand/dashboard.json

concurrency:
  group: tsmc-equipment-demand-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate dashboard builder
        run: |
          set -euo pipefail
          node --check scripts/build_tsmc_equipment_demand_dashboard_data.js
          node scripts/build_tsmc_equipment_demand_dashboard_data.js --self-test

      - name: Build daily dashboard payload
        run: |
          set -euo pipefail
          node scripts/build_tsmc_equipment_demand_dashboard_data.js
          test -s "$DASHBOARD_PAYLOAD"

      - name: Verify dashboard freshness before commit
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const market = JSON.parse(fs.readFileSync('data_twse_market_chart/market_chart.json', 'utf8'));
          const dashboard = JSON.parse(fs.readFileSync(process.env.DASHBOARD_PAYLOAD, 'utf8'));
          const latestMarketDate = (market.data || [])
            .map(row => String(row.date || ''))
            .filter(date => /^20\d{6}$/.test(date))
            .sort()
            .at(-1);
          if (!latestMarketDate) throw new Error('Unable to resolve latest TAIEX market date');
          if (dashboard.trading_date !== latestMarketDate) {
            throw new Error(`Dashboard stale: trading_date=${dashboard.trading_date}, latest_market_date=${latestMarketDate}`);
          }
          const staleStocks = (dashboard.stocks || []).filter(stock => (
            stock.trading_date !== latestMarketDate
            || !Number.isFinite(stock.close)
            || stock.close <= 0
            || !stock.source
            || !stock.source_file
          ));
          if (staleStocks.length) {
            throw new Error(`Dashboard latest prices incomplete for ${latestMarketDate}: ${staleStocks.map(stock => stock.code).join(', ')}`);
          }
          console.log(`Dashboard freshness verified for ${latestMarketDate}`);
          NODE

      - name: Commit generated payload
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DASHBOARD_PAYLOAD"
          if git diff --cached --quiet; then
            echo "Dashboard payload unchanged."
            exit 0
          fi
          git commit -m "data: refresh TSMC equipment demand dashboard"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; rebasing onto latest main."
            git fetch origin main
            git rebase origin/main
          done
          echo "Unable to push dashboard payload after retries." >&2
          exit 1

      - name: Verify payload is durable on remote main
        run: |
          set -euo pipefail
          git fetch origin main
          git cat-file -e "origin/main:${DASHBOARD_PAYLOAD}"
          remote_bytes=$(git show "origin/main:${DASHBOARD_PAYLOAD}" | wc -c | tr -d ' ')
          if [ "$remote_bytes" -le 0 ]; then
            echo "Remote main dashboard payload is empty: ${DASHBOARD_PAYLOAD}" >&2
            exit 1
          fi
          remote_date=$(git show "origin/main:${DASHBOARD_PAYLOAD}" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).trading_date || ''))")
          local_date=$(node -e "process.stdout.write(require('./${DASHBOARD_PAYLOAD}').trading_date || '')")
          if [ "$remote_date" != "$local_date" ]; then
            echo "Remote main dashboard date mismatch: remote=${remote_date}, local=${local_date}" >&2
            exit 1
          fi
          echo "Verified ${DASHBOARD_PAYLOAD} on origin/main (${remote_bytes} bytes, trading_date=${remote_date})."

  deploy-pages:
    name: Publish refreshed TSMC dashboard payload
    if: ${{ github.event_name == 'push' || inputs.deploy_pages == true }}
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

  verify-pages-artifact:
    name: Verify TSMC payload in Pages artifact
    if: ${{ github.event_name == 'push' || inputs.deploy_pages == true }}
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@v6
        with:
          name: github-pages-${{ github.run_attempt }}
          path: /tmp/pages-artifact

      - name: Verify dashboard payload is published
        shell: bash
        run: |
          set -euo pipefail
          artifact_tar=/tmp/pages-artifact/artifact.tar
          test -s "$artifact_tar" || {
            echo "Pages artifact tar is missing." >&2
            exit 1
          }

          # Materialize the archive listing before matching. Using `grep -q`
          # directly behind `tar | sed` under pipefail can close the pipe early
          # after a match and falsely turn tar/sed SIGPIPE into a failure.
          tar -tf "$artifact_tar" > /tmp/pages-artifact-files.txt
          sed 's#^\./##' /tmp/pages-artifact-files.txt > /tmp/pages-artifact-files-normalized.txt
          grep -Fx "$DASHBOARD_PAYLOAD" /tmp/pages-artifact-files-normalized.txt >/dev/null || {
            echo "Pages artifact is missing ${DASHBOARD_PAYLOAD}." >&2
            exit 1
          }

          size=$(tar -xOf "$artifact_tar" "$DASHBOARD_PAYLOAD" 2>/dev/null | wc -c | tr -d ' ' || true)
          if [ "${size:-0}" -le 0 ]; then
            size=$(tar -xOf "$artifact_tar" "./$DASHBOARD_PAYLOAD" 2>/dev/null | wc -c | tr -d ' ' || true)
          fi
          if [ "${size:-0}" -le 0 ]; then
            echo "Published dashboard payload exists but is empty or unreadable." >&2
            exit 1
          fi

          echo "Verified ${DASHBOARD_PAYLOAD} in Pages artifact (${size} bytes)."

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for schedule summary
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js

