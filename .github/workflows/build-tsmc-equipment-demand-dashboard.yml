name: "[03 市場環境] Refresh TSMC Equipment Demand Dashboard"

on:
  push:
    branches:
      - main
    paths:
      - "data_twse_market_chart/market_chart.json"
      - "data_twse_mi_index/**"
      - "data_history_sma/**"
      - "data_fubon/**"
      - "scripts/lib/stock_price_provider.js"
      - "scripts/build_tsmc_equipment_demand_dashboard_data.js"
      - "public/tsmc-equipment-demand-dashboard.html"
      - ".github/workflows/build-tsmc-equipment-demand-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DASHBOARD_PAYLOAD: data_prediction_analysis/tsmc-equipment-demand/dashboard.json

concurrency:
  group: tsmc-equipment-demand-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate dashboard builder
        run: |
          set -euo pipefail
          node --check scripts/build_tsmc_equipment_demand_dashboard_data.js
          node scripts/build_tsmc_equipment_demand_dashboard_data.js --self-test

      - name: Build daily dashboard payload
        run: |
          set -euo pipefail
          node scripts/build_tsmc_equipment_demand_dashboard_data.js
          test -s "$DASHBOARD_PAYLOAD"

      - name: Commit generated payload
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DASHBOARD_PAYLOAD"
          if git diff --cached --quiet; then
            echo "Dashboard payload unchanged."
            exit 0
          fi
          git commit -m "data: refresh TSMC equipment demand dashboard"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; rebasing onto latest main."
            git fetch origin main
            git rebase origin/main
          done
          echo "Unable to push dashboard payload after retries." >&2
          exit 1

      - name: Verify payload is durable on remote main
        run: |
          set -euo pipefail
          git fetch origin main
          git cat-file -e "origin/main:${DASHBOARD_PAYLOAD}"
          remote_bytes=$(git show "origin/main:${DASHBOARD_PAYLOAD}" | wc -c | tr -d ' ')
          if [ "$remote_bytes" -le 0 ]; then
            echo "Remote main dashboard payload is empty: ${DASHBOARD_PAYLOAD}" >&2
            exit 1
          fi
          echo "Verified ${DASHBOARD_PAYLOAD} on origin/main (${remote_bytes} bytes)."

  deploy-pages:
    name: Publish refreshed TSMC dashboard payload
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

  verify-pages-artifact:
    name: Verify TSMC payload in Pages artifact
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@v6
        with:
          name: github-pages-${{ github.run_attempt }}
          path: /tmp/pages-artifact

      - name: Verify dashboard payload is published
        shell: bash
        run: |
          set -euo pipefail
          artifact_tar=/tmp/pages-artifact/artifact.tar
          test -s "$artifact_tar" || {
            echo "Pages artifact tar is missing." >&2
            exit 1
          }

          # Materialize the archive listing before matching. Using `grep -q`
          # directly behind `tar | sed` under pipefail can close the pipe early
          # after a match and falsely turn tar/sed SIGPIPE into a failure.
          tar -tf "$artifact_tar" > /tmp/pages-artifact-files.txt
          sed 's#^\./##' /tmp/pages-artifact-files.txt > /tmp/pages-artifact-files-normalized.txt
          grep -Fx "$DASHBOARD_PAYLOAD" /tmp/pages-artifact-files-normalized.txt >/dev/null || {
            echo "Pages artifact is missing ${DASHBOARD_PAYLOAD}." >&2
            exit 1
          }

          size=$(tar -xOf "$artifact_tar" "$DASHBOARD_PAYLOAD" 2>/dev/null | wc -c | tr -d ' ' || true)
          if [ "${size:-0}" -le 0 ]; then
            size=$(tar -xOf "$artifact_tar" "./$DASHBOARD_PAYLOAD" 2>/dev/null | wc -c | tr -d ' ' || true)
          fi
          if [ "${size:-0}" -le 0 ]; then
            echo "Published dashboard payload exists but is empty or unreadable." >&2
            exit 1
          fi

          echo "Verified ${DASHBOARD_PAYLOAD} in Pages artifact (${size} bytes)."
