name: Apply Fear and Greed Dashboard Patch

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_fear_greed_dashboard_patch.js

permissions:
  contents: write

concurrency:
  group: apply-fear-greed-dashboard-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch dashboard
        run: node scripts/apply_fear_greed_dashboard_patch.js

      - name: Commit and push dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/prediction-dashboard.html

          if git diff --staged --quiet; then
            echo "No dashboard changes"
            exit 0
          fi

          git commit -m "feat: add CNN Fear and Greed dashboard card"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed, retry ${attempt}/5..."
            sleep 5
          done

          echo "Failed to push after 5 attempts."
          exit 1
