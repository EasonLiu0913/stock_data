name: Research Video Recovery Readonly
on:
  push:
    branches: [research/market-opening-master-a-20261015]
    paths: ['.github/workflows/research-video-recovery-readonly.yml', 'scripts/run_video_recovery_readonly_ci.sh', 'scripts/detect_video_data_recovery_gaps.js', 'scripts/plan_video_data_recovery.js', 'tests/video_data_recovery_*.test.js', 'scripts/research_market_opening_mi_index_breadth*.js']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            tests
            config/research
            data_daily_gain_over_5/market-opening
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash scripts/run_video_recovery_readonly_ci.sh
      - name: Verify MI_INDEX parser negative cases
        run: node scripts/research_market_opening_mi_index_breadth.test.js
      - name: Preserve read-only proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-recovery-readonly-proof
          path: /tmp/video-recovery-proof/
          if-no-files-found: error
          retention-days: 14
