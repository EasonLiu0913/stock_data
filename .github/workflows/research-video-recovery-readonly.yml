name: Research Video Recovery Readonly
on:
  push:
    branches: [research/market-opening-master-a-20261015]
    paths: ['.github/workflows/research-video-recovery-readonly.yml', 'scripts/run_video_recovery_readonly_ci.sh', 'scripts/research_date_to_video_d4_evidence_join.js', 'tests/research_date_to_video_d4_evidence_join.test.js', 'tests/research_date_to_video_d4_real_date.test.js', 'scripts/research_date_to_video_d4_claim_inventory.js', 'tests/research_date_to_video_d4_claim_inventory.test.js', 'scripts/research_date_to_video_d4_review_gate.js', 'tests/research_date_to_video_d4_review_gate.test.js', 'scripts/research_date_to_video_d4_orchestrator.js', 'scripts/research_date_to_video_bfi82u_v1.js', 'scripts/research_date_to_video_bfi82u_archive.js', 'tests/research_date_to_video_bfi82u_archive.test.js', 'tests/research_date_to_video_d4_orchestrator.test.js', 'scripts/research_date_to_video_d4_draft_gate.js', 'scripts/research_date_to_video_d4_candidate_preflight.js', 'tests/research_date_to_video_d4_draft_gate.test.js', 'scripts/detect_video_data_recovery_gaps.js', 'scripts/plan_video_data_recovery.js', 'scripts/parse_twse_official_stock_aggregate.js', 'tests/video_data_recovery_*.test.js', 'tests/twse_official_stock_aggregate.test.js', 'tests/ai_script_research_v3.test.js', 'tests/research_caption_numeric_parity_20261008.test.js', 'tests/research_caption_projection_full_20261008.test.js', 'tests/research_caption_sentence_parity_20261008.test.js', 'tests/build_research_caption_source_20261008.test.js', 'tests/inspect_research_caption_source_20261008.test.js', 'scripts/inspect_research_caption_source_20261008.js', 'scripts/build_research_caption_source_20261008.js', 'scripts/research_caption_sentence_parity_20261008.js', 'scripts/research_caption_projection_full_20261008.js', 'scripts/research_caption_numeric_parity_20261008.js', 'tests/research_dealer_total_20261008.test.js', 'tests/ai_editor_input_v3.test.js', 'scripts/research_ai_editor_input_real_20261008.test.js', 'data_research/m5/ai-script-generation/20261008-featured-editorial-research.md', 'data_research/m5/ai-script-generation/20261008-claim-review.md', 'data_research/m5/ai-script-generation/20261008-original-full-script-research.md', 'data_research/m5/ai-script-generation/20261008-d4-original-analysis-candidate.json', 'data_research/m5/ai-script-generation/20261008-original-script-v3-research.json', 'scripts/build_daily_gainers_ai_facts.js', 'scripts/build_ai_editor_input_v3_20261008.js', 'data_daily_gain_over_5/analysis-ai/20261008.json', 'scripts/validate_ai_script_research_v3.js', 'scripts/research_market_opening_mi_index_breadth*.js', 'scripts/verify_real_mi_index_20261008_readonly.js', 'scripts/verify_bfi82u_three_groups_20261008_readonly.js']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            tests
            config/research
            data_research/m5/ai-script-generation/20261008-featured-editorial-research.md
            data_research/m5/ai-script-generation/20261008-claim-review.md
            data_research/m5/ai-script-generation/20261008-original-full-script-research.md
            data_research/m5/ai-script-generation/20261008-d4-original-analysis-candidate.json
            data_research/m5/ai-script-generation/20261008-original-script-v3-research.json
            data_daily_gain_over_5/market-opening
            data_daily_gain_over_5/20261008.json
            data_daily_gain_over_5/20261013.json
            data_twse_market_chart/market_chart.json
            data_daily_gain_over_5/analysis-news/20261008.json
            data_daily_gain_over_5/analysis-news/20261013.json
            data_daily_gain_over_5/analysis-ai/20261013.json
            data_daily_gain_over_5/analysis-facts/20261013.json
            data_daily_gain_over_5/analysis-ai/20261008.json
            data_daily_gain_over_5/analysis-facts/20261008.json
            data_twse_mi_index/20261008_twse_mi_index.json
            data_twse_mi_index/20261013_twse_mi_index.json
            data_twse_institutional_investors/20261013_twse_institutional_investors.json
            data_twse_dealers/20261008_twse_dealers.json
            data_research/twse-market-opening/primary-archive/20261008/20261008-bfi82u.json
            data_research/twse-market-opening/primary-archive/20261008/20261008-bfi82u.manifest.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash scripts/run_video_recovery_readonly_ci.sh
      - name: Verify D4 date-scoped evidence join
        run: |
          node --check scripts/research_date_to_video_d4_evidence_join.js
          node tests/research_date_to_video_d4_evidence_join.test.js
          node tests/research_date_to_video_d4_real_date.test.js
          node --check scripts/research_date_to_video_d4_claim_inventory.js
          node tests/research_date_to_video_d4_claim_inventory.test.js
          node --check scripts/research_date_to_video_d4_review_gate.js
          node tests/research_date_to_video_d4_review_gate.test.js
          node --check scripts/research_date_to_video_d4_orchestrator.js
          node tests/research_date_to_video_d4_orchestrator.test.js
          node --check scripts/research_date_to_video_bfi82u_archive.js
          node --test tests/research_date_to_video_bfi82u_archive.test.js
          node --check scripts/research_date_to_video_d4_candidate_preflight.js
          node --check scripts/research_date_to_video_d4_draft_gate.js
          node tests/research_date_to_video_d4_draft_gate.test.js
      - name: Fetch and validate 20261013 official BFI82U into isolated artifact directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/date-to-video-bfi82u-20261013
          node scripts/research_date_to_video_bfi82u_archive.js 20261013 /tmp/date-to-video-bfi82u-20261013
          node -e "const r=require('./scripts/research_date_to_video_bfi82u_v1').inspect('/tmp/date-to-video-bfi82u-20261013','20261013');if(r.status!=='VERIFIED'||!r.final_six_rows_verified||r.publication_authorized!==false)process.exit(1);console.log(JSON.stringify({status:r.status,target_date:r.target_date,raw_sha256:r.raw_sha256,final_six_rows_verified:r.final_six_rows_verified,publication_authorized:r.publication_authorized}))"
      - name: Upload 20261013 verified official BFI82U research archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dated-bfi82u-20261013-research-only
          path: /tmp/date-to-video-bfi82u-20261013/data_research/twse-market-opening/primary-archive/20261013/
          if-no-files-found: error
          retention-days: 14
      - name: Verify 20261013 BFI82U reaches D4 without changing repository or publication state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data_research/twse-market-opening/primary-archive/20261013
          cp /tmp/date-to-video-bfi82u-20261013/data_research/twse-market-opening/primary-archive/20261013/* data_research/twse-market-opening/primary-archive/20261013/
          node scripts/research_date_to_video_d4_orchestrator.js 20261013 . /tmp/date-to-video-d4-20261013 || test -f /tmp/date-to-video-d4-20261013/institutional-evidence.json
          node -e "const fs=require('fs');const p='/tmp/date-to-video-d4-20261013/';const i=JSON.parse(fs.readFileSync(p+'institutional-evidence.json'));const s=JSON.parse(fs.readFileSync(p+'status.json'));if(i.status!=='VERIFIED'||i.target_date!=='20261013'||!i.final_six_rows_verified||i.publication_authorized!==false||s.publication_authorized!==false||s.render_authorized!==false)process.exit(1);console.log(JSON.stringify({institutional:i.status,date:i.target_date,raw_sha256:i.raw_sha256,d4_blockers:s.blockers,publication_authorized:s.publication_authorized}))"
      - name: Upload D4 20261013 research-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d4-20261013-bfi82u-diagnostics
          path: /tmp/date-to-video-d4-20261013/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify MI_INDEX parser negative cases
        run: node scripts/research_market_opening_mi_index_breadth.test.js
      - name: Verify real AI editor input and archive SHA
        run: |
          node --check scripts/research_ai_editor_input_real_20261008.test.js
          node scripts/research_ai_editor_input_real_20261008.test.js
          sha256sum -c /tmp/video-recovery-proof/SHA256SUMS
      - name: Verify editorial research does not repeat stale 2305 caveat
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('data_research/m5/ai-script-generation/20261008-featured-editorial-research.md','utf8');if(!s.includes('合計+41,283股')||s.includes('等待法人數字完成原始來源核對'))process.exit(1);console.log('EDITORIAL_2305_RECONCILED_PASS')"
      - name: Verify dated claim review reconciled
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('data_research/m5/ai-script-generation/20261008-claim-review.md','utf8');if(!s.includes('dealer +41')||s.includes('Full three-group gate FAILS CLOSED'))process.exit(1);console.log('CLAIM_REVIEW_2305_RECONCILED_PASS')"
      - name: Verify original full editorial research draft present
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('data_research/m5/ai-script-generation/20261008-original-full-script-research.md','utf8');for(const t of ['TAIWAN STOCK','騰輝電子','全友','台塑','四萬一千二百八十三股','publication_authorized=false'])if(!s.includes(t))process.exit(1);if(!s.includes('4. 那麼我們開始囉。')||s.includes('我們有提供中文 CC 字幕'))process.exit(1);console.log('ORIGINAL_FULL_SCRIPT_RESEARCH_DRAFT_PRESENT')"
      - name: Verify dated 2305 dealer total against corrected Facts
        run: node tests/research_dealer_total_20261008.test.js
      - name: Preserve read-only proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-recovery-readonly-proof
          path: /tmp/video-recovery-proof/
          if-no-files-found: error
          retention-days: 14
