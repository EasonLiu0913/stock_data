          node tests/research_date_to_video_sentence_parity_v1.test.js
          node --check scripts/research_date_to_video_narration_candidate_review_v1.js
          node tests/research_date_to_video_narration_candidate_review_v1.test.js
          node --check scripts/research_official_data_manifest_v1.js
          node --test tests/research_official_data_manifest_v1.test.js
          node --check scripts/research_official_data_recovery_v1.js
          node --test tests/research_official_data_recovery_v1.test.js
          node --check scripts/research_date_to_video_official_entry_v1.js
          node --test tests/research_date_to_video_official_entry_v1.test.js
          node --check scripts/research_official_manifest_master_gate_v1.js
          node --test tests/research_official_manifest_master_gate_v1.test.js
          node --check scripts/research_official_mi_index_provenance_v1.js
          node --test tests/research_official_mi_index_provenance_v1.test.js
          node --check scripts/research_official_fmtqik_provenance_v1.js
          node --test tests/research_official_fmtqik_provenance_v1.test.js
          node --check scripts/research_date_to_video_bfi82u_archive.js
          node --test tests/research_date_to_video_bfi82u_archive.test.js
          node --check scripts/research_date_to_video_d4_candidate_preflight.js
          node --check scripts/research_date_to_video_d4_draft_gate.js
          node tests/research_date_to_video_d4_draft_gate.test.js
      - name: Probe dated FMTQIK original response into isolated candidate evidence
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/fmtqik-research
          if node scripts/research_official_fmtqik_candidate_stage_v1.js 20261013 /tmp/fmtqik-research > /tmp/fmtqik-research/probe-output.json 2> /tmp/fmtqik-research/probe-error.txt; then
            echo "FMTQIK_STAGED_CANDIDATE_ONLY_NO_SOURCE_APPROVAL"
          else
            echo "FMTQIK_SOURCE_PROBE_PENDING_REVIEW"
            cat /tmp/fmtqik-research/probe-error.txt
          fi
          node -e "const fs=require('fs'),p='/tmp/fmtqik-research/fmtqik-candidate/20261013/candidate-manifest.json';if(fs.existsSync(p)){const m=JSON.parse(fs.readFileSync(p));if(m.master_authorized!==false||m.publication_authorized!==false||m.endpoint_approved!==false)process.exit(1);console.log(JSON.stringify({status:'STAGED_CANDIDATE_REVIEW_REQUIRED',sha256:m.sha256,fields:m.candidate_inspection.field_names,endpoint_approved:false}));}else console.log('FMTQIK_NOT_STAGED_SOURCE_REVIEW_REQUIRED');"
      - name: Crosscheck real FMTQIK candidate against dated derived chart without promotion
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const base='/tmp/fmtqik-research/fmtqik-candidate/20261013/';
          if(!fs.existsSync(base+'candidate-manifest.json')){console.error('FMTQIK_CANDIDATE_NOT_STAGED_FAIL_CLOSED');process.exit(1);}
          const raw=fs.readFileSync(base+'response.json'),m=JSON.parse(fs.readFileSync(base+'candidate-manifest.json'));
          assert.equal(crypto.createHash('sha256').update(raw).digest('hex'),m.sha256);
          const p=JSON.parse(raw),date='115/10/13',rows=p.data.filter(r=>r[0]===date);
          assert.equal(rows.length,1);const row=rows[0],chart=JSON.parse(fs.readFileSync('data_twse_market_chart/market_chart.json')).data.find(r=>r.date==='20261013');
          const read=k=>Number(row[p.fields.indexOf(k)].replaceAll(',',''));
          const checks={turnover_twd:read('成交金額')===chart.turnover,volume_shares:read('成交股數')===chart.volumeShares,transactions:read('成交筆數')===chart.transactions};
          const report={contract:'FMTQIK_RAW_TO_DERIVED_RESEARCH_CROSSCHECK_V1',target_date:'20261013',candidate_sha256:m.sha256,checks,status:Object.values(checks).every(Boolean)?'RAW_DERIVED_VALUES_MATCH_RESEARCH_ONLY':'RAW_DERIVED_MISMATCH_REVIEW_REQUIRED',endpoint_approved:false,master_authorized:false,publication_authorized:false};
          fs.writeFileSync('/tmp/fmtqik-research/raw-derived-crosscheck.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          if(report.status!=='RAW_DERIVED_VALUES_MATCH_RESEARCH_ONLY')process.exitCode=1;
          NODE
      - name: Upload isolated FMTQIK candidate probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmtqik-20261013-candidate-probe-research-only
          path: /tmp/fmtqik-research/
          if-no-files-found: warn
          retention-days: 14
      - name: Probe independent Golden Baseline date FMTQIK original response
        shell: bash
        run: |
          mkdir -p /tmp/fmtqik-20261008-research
          node scripts/research_official_fmtqik_candidate_stage_v1.js 20261008 /tmp/fmtqik-20261008-research > /tmp/fmtqik-20261008-research/probe-output.json
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const p='/tmp/fmtqik-20261008-research/fmtqik-candidate/20261008/',m=JSON.parse(fs.readFileSync(p+'candidate-manifest.json')),raw=fs.readFileSync(p+'response.json');
          assert.equal(crypto.createHash('sha256').update(raw).digest('hex'),m.sha256);
          const data=JSON.parse(raw),row=data.data.filter(r=>r[0]==='115/10/08');assert.equal(row.length,1);
          const chart=JSON.parse(fs.readFileSync('data_twse_market_chart/market_chart.json')).data.find(r=>r.date==='20261008');assert.ok(chart);
          const value=k=>Number(row[0][data.fields.indexOf(k)].replaceAll(',',''));
          const checks={turnover_twd:value('成交金額')===chart.turnover,volume_shares:value('成交股數')===chart.volumeShares,transactions:value('成交筆數')===chart.transactions};
          const result={target_date:'20261008',sha256:m.sha256,checks,status:Object.values(checks).every(Boolean)?'RAW_DERIVED_VALUES_MATCH_RESEARCH_ONLY':'RAW_DERIVED_MISMATCH_REVIEW_REQUIRED',endpoint_approved:false,master_authorized:false,publication_authorized:false};
          fs.writeFileSync('/tmp/fmtqik-20261008-research/crosscheck.json',JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result));
          if(result.status!=='RAW_DERIVED_VALUES_MATCH_RESEARCH_ONLY')process.exitCode=1;
          NODE
      - name: Upload Golden Baseline FMTQIK candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmtqik-20261008-candidate-probe-research-only
          path: /tmp/fmtqik-20261008-research/
          if-no-files-found: warn
          retention-days: 14
      - name: Probe third independent dated FMTQIK original response
        shell: bash
        run: |
          mkdir -p /tmp/fmtqik-20261014-research
          node scripts/research_official_fmtqik_candidate_stage_v1.js 20261014 /tmp/fmtqik-20261014-research > /tmp/fmtqik-20261014-research/probe-output.json
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const p='/tmp/fmtqik-20261014-research/fmtqik-candidate/20261014/',m=JSON.parse(fs.readFileSync(p+'candidate-manifest.json')),raw=fs.readFileSync(p+'response.json');
          assert.equal(crypto.createHash('sha256').update(raw).digest('hex'),m.sha256);
          const data=JSON.parse(raw),rows=data.data.filter(r=>r[0]==='115/10/14');assert.equal(rows.length,1);
          const chart=JSON.parse(fs.readFileSync('data_twse_market_chart/market_chart.json')).data.find(r=>r.date==='20261014');assert.ok(chart);
          const value=k=>Number(rows[0][data.fields.indexOf(k)].replaceAll(',',''));
          const checks={turnover_twd:value('成交金額')===chart.turnover,volume_shares:value('成交股數')===chart.volumeShares,transactions:value('成交筆數')===chart.transactions};
          const result={target_date:'20261014',sha256:m.sha256,checks,status:Object.values(checks).every(Boolean)?'RAW_DERIVED_VALUES_MATCH_RESEARCH_ONLY':'RAW_DERIVED_MISMATCH_REVIEW_REQUIRED',endpoint_approved:false,master_authorized:false,publication_authorized:false};
          fs.writeFileSync('/tmp/fmtqik-20261014-research/crosscheck.json',JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result));
          if(result.status!=='RAW_DERIVED_VALUES_MATCH_RESEARCH_ONLY')process.exitCode=1;
          NODE
      - name: Upload third-date FMTQIK candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmtqik-20261014-candidate-probe-research-only
          path: /tmp/fmtqik-20261014-research/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify three-date original FMTQIK candidate evidence matrix
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const specs=[['20261008','/tmp/fmtqik-20261008-research'],['20261013','/tmp/fmtqik-research'],['20261014','/tmp/fmtqik-20261014-research']];
          const rows=specs.map(([date,root])=>{
            const p=root+'/fmtqik-candidate/'+date+'/',m=JSON.parse(fs.readFileSync(p+'candidate-manifest.json')),raw=fs.readFileSync(p+'response.json');
            assert.equal(m.target_date,date);assert.equal(m.sha256,crypto.createHash('sha256').update(raw).digest('hex'));
            assert.equal(m.http_status,200);assert.equal(m.endpoint_approved,false);assert.equal(m.master_authorized,false);assert.equal(m.publication_authorized,false);
            const check=JSON.parse(fs.readFileSync(root+(date==='20261013'?'/raw-derived-crosscheck.json':'/crosscheck.json')));
            assert.equal(check.target_date,date);assert.equal(check.sha256||check.candidate_sha256,m.sha256);
            assert.equal(check.status,'RAW_DERIVED_VALUES_MATCH_RESEARCH_ONLY');
            assert.ok(Object.values(check.checks).every(Boolean));
            return {date,raw_sha256:m.sha256,checks:check.checks,status:check.status};
          });
          assert.equal(new Set(rows.map(r=>r.raw_sha256)).size,3);
          const matrix={contract:'FMTQIK_THREE_DATE_RESEARCH_EVIDENCE_MATRIX_V1',rows,status:'THREE_DATES_RAW_DERIVED_MATCH_RESEARCH_ONLY',source_contract_approved:false,master_authorized:false,publication_authorized:false};
          fs.mkdirSync('/tmp/fmtqik-evidence-matrix',{recursive:true});
          fs.writeFileSync('/tmp/fmtqik-evidence-matrix/matrix.json',JSON.stringify(matrix,null,2)+'\n');console.log(JSON.stringify(matrix));
          NODE
      - name: Upload FMTQIK three-date evidence matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmtqik-three-date-evidence-matrix-research-only
          path: /tmp/fmtqik-evidence-matrix/
          if-no-files-found: warn
          retention-days: 14
      - name: Fetch and validate 20261013 official BFI82U into isolated artifact directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/date-to-video-bfi82u-20261013
          node scripts/research_date_to_video_bfi82u_archive.js 20261013 /tmp/date-to-video-bfi82u-20261013
          node -e "const r=require('./scripts/research_date_to_video_bfi82u_v1').inspect('/tmp/date-to-video-bfi82u-20261013','20261013');if(r.status!=='VERIFIED'||!r.final_six_rows_verified||r.publication_authorized!==false)process.exit(1);console.log(JSON.stringify({status:r.status,target_date:r.target_date,raw_sha256:r.raw_sha256,final_six_rows_verified:r.final_six_rows_verified,publication_authorized:r.publication_authorized}))"
      - name: Upload 20261013 verified official BFI82U research archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dated-bfi82u-20261013-research-only
          path: /tmp/date-to-video-bfi82u-20261013/data_research/twse-market-opening/primary-archive/20261013/
          if-no-files-found: error
          retention-days: 14
      - name: Build dated 20261013 market base from chart and verified BFI82U
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/research_date_to_video_market_base.js
          mkdir -p data_research/twse-market-opening/primary-archive/20261013
          cp /tmp/date-to-video-bfi82u-20261013/data_research/twse-market-opening/primary-archive/20261013/* data_research/twse-market-opening/primary-archive/20261013/
          node scripts/research_date_to_video_market_base.js 20261013 . data_daily_gain_over_5/market-opening
          node -e "const b=require('./data_daily_gain_over_5/market-opening/20261013.json');if(b.target_date!=='20261013'||b.taiex.close!==48341.31||b.taiex.change_points!==-960.65||b.market_trading.turnover_twd!==1201861264942||b.publication_authorized!==false)process.exit(1);console.log('DATED_MARKET_BASE_CROSSCHECK_PASS')"
      - name: Upload 20261013 research-only market base
        uses: actions/upload-artifact@v4
        with:
          name: dated-market-base-20261013-research-only
          path: data_daily_gain_over_5/market-opening/20261013.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify 20261013 BFI82U reaches D4 without changing repository or publication state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data_research/twse-market-opening/primary-archive/20261013
          cp /tmp/date-to-video-bfi82u-20261013/data_research/twse-market-opening/primary-archive/20261013/* data_research/twse-market-opening/primary-archive/20261013/
          node scripts/research_date_to_video_d4_orchestrator.js 20261013 . /tmp/date-to-video-d4-20261013 || test -f /tmp/date-to-video-d4-20261013/institutional-evidence.json
          node -e "const p=require('./scripts/research_date_to_video_media_preflight_v1').inspect('/tmp/date-to-video-d4-20261013');if(p.status!=='BLOCKED'||p.render_authorized!==false||p.publication_authorized!==false||!p.issues.includes('EDITORIAL_CERTIFICATION_REQUIRED')||!p.issues.includes('DATED_MEDIA_BRIDGE_NOT_IMPLEMENTED'))process.exit(1);console.log('D4_MEDIA_PREFLIGHT_FAIL_CLOSED_PASS')"
          node -e "const fs=require('fs');const p='/tmp/date-to-video-d4-20261013/';const i=JSON.parse(fs.readFileSync(p+'institutional-evidence.json'));const s=JSON.parse(fs.readFileSync(p+'status.json'));const m=JSON.parse(fs.readFileSync(p+'market-master.json'));const b=JSON.parse(fs.readFileSync(p+'editorial-research-brief.json'));if(i.status!=='VERIFIED'||i.target_date!=='20261013'||!i.final_six_rows_verified||m.status!=='RESEARCH_MARKET_MASTER_SOURCE_CROSSCHECKED_EDITORIAL_PENDING'||m.target_date!=='20261013'||m.taiex.close!==48341.31||m.market_trading.turnover_twd!==1201861264942||b.status!=='OBSERVATIONS_READY_INDEPENDENT_ANALYSIS_REQUIRED'||b.observations.length!==3||i.publication_authorized!==false||s.publication_authorized!==false||s.render_authorized!==false)process.exit(1);console.log(JSON.stringify({institutional:i.status,market_master:m.status,editorial_brief:b.status,date:i.target_date,raw_sha256:i.raw_sha256,d4_blockers:s.blockers,publication_authorized:s.publication_authorized}))"
      - name: Verify dated original analysis candidate and independent review packet
        run: |
          node -e "const fs=require('fs');const p='/tmp/date-to-video-d4-20261013/';const a=JSON.parse(fs.readFileSync(p+'authored-candidate-preflight.json'));const o=JSON.parse(fs.readFileSync(p+'candidate-semantic-outline.json'));const w=JSON.parse(fs.readFileSync(p+'independent-review-worksheet.json'));const m=JSON.parse(fs.readFileSync(p+'m8vis-scene-adapter.json'));if(a.status==='REJECTED'||a.unknown_claim_ids.length||a.invalid_master_fields.length||a.missing_claim_reviews.length!==3||o.sections.length!==5||w.review_items.length!==3||JSON.stringify(m.scene_ids)!==JSON.stringify(['opening','market','6668','3406','6505','conclusion'])||m.render_authorized!==false||o.editorial_certified!==false||o.render_authorized!==false)process.exit(1);console.log(JSON.stringify({preflight:a.status,sections:o.sections.length,review_items:w.review_items.length,scene_ids:m.scene_ids,editorial_certified:o.editorial_certified}))"
      - name: Verify dated selected stock price evidence
