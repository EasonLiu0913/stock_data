name: Research Video Recovery Readonly
on:
  push:
    branches: [research/market-opening-master-a-20261015]
    paths: ['.github/workflows/research-video-recovery-readonly.yml', 'scripts/run_video_recovery_readonly_ci.sh', 'scripts/detect_video_data_recovery_gaps.js', 'scripts/plan_video_data_recovery.js', 'scripts/parse_twse_official_stock_aggregate.js', 'tests/video_data_recovery_*.test.js', 'tests/twse_official_stock_aggregate.test.js', 'tests/ai_script_research_v3.test.js', 'tests/research_caption_numeric_parity_20261008.test.js', 'tests/research_caption_projection_full_20261008.test.js', 'tests/research_caption_sentence_parity_20261008.test.js', 'tests/build_research_caption_source_20261008.test.js', 'tests/inspect_research_caption_source_20261008.test.js', 'scripts/inspect_research_caption_source_20261008.js', 'scripts/build_research_caption_source_20261008.js', 'scripts/research_caption_sentence_parity_20261008.js', 'scripts/research_caption_projection_full_20261008.js', 'scripts/research_caption_numeric_parity_20261008.js', 'tests/research_dealer_total_20261008.test.js', 'tests/ai_editor_input_v3.test.js', 'scripts/research_ai_editor_input_real_20261008.test.js', 'data_research/m5/ai-script-generation/20261008-featured-editorial-research.md', 'data_research/m5/ai-script-generation/20261008-claim-review.md', 'data_research/m5/ai-script-generation/20261008-original-full-script-research.md', 'data_research/m5/ai-script-generation/20261008-original-script-v3-research.json', 'scripts/build_daily_gainers_ai_facts.js', 'scripts/build_ai_editor_input_v3_20261008.js', 'data_daily_gain_over_5/analysis-ai/20261008.json', 'scripts/validate_ai_script_research_v3.js', 'scripts/research_market_opening_mi_index_breadth*.js', 'scripts/verify_real_mi_index_20261008_readonly.js', 'scripts/verify_bfi82u_three_groups_20261008_readonly.js']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            tests
            config/research
            data_research/m5/ai-script-generation/20261008-featured-editorial-research.md
            data_research/m5/ai-script-generation/20261008-claim-review.md
            data_research/m5/ai-script-generation/20261008-original-full-script-research.md
            data_research/m5/ai-script-generation/20261008-original-script-v3-research.json
            data_daily_gain_over_5/market-opening
            data_daily_gain_over_5/20261008.json
            data_daily_gain_over_5/analysis-news/20261008.json
            data_daily_gain_over_5/analysis-ai/20261008.json
            data_daily_gain_over_5/analysis-facts/20261008.json
            data_twse_mi_index/20261008_twse_mi_index.json
            data_twse_institutional_investors/20261013_twse_institutional_investors.json
            data_twse_dealers/20261008_twse_dealers.json
            data_research/twse-market-opening/primary-archive/20261008/20261008-bfi82u.json
            data_research/twse-market-opening/primary-archive/20261008/20261008-bfi82u.manifest.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash scripts/run_video_recovery_readonly_ci.sh
      - name: Verify MI_INDEX parser negative cases
        run: node scripts/research_market_opening_mi_index_breadth.test.js
      - name: Verify real AI editor input and archive SHA
        run: |
          node --check scripts/research_ai_editor_input_real_20261008.test.js
          node scripts/research_ai_editor_input_real_20261008.test.js
          sha256sum -c /tmp/video-recovery-proof/SHA256SUMS
      - name: Verify editorial research does not repeat stale 2305 caveat
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('data_research/m5/ai-script-generation/20261008-featured-editorial-research.md','utf8');if(!s.includes('合計+41,283股')||s.includes('等待法人數字完成原始來源核對'))process.exit(1);console.log('EDITORIAL_2305_RECONCILED_PASS')"
      - name: Verify dated claim review reconciled
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('data_research/m5/ai-script-generation/20261008-claim-review.md','utf8');if(!s.includes('dealer +41')||s.includes('Full three-group gate FAILS CLOSED'))process.exit(1);console.log('CLAIM_REVIEW_2305_RECONCILED_PASS')"
      - name: Verify original full editorial research draft present
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('data_research/m5/ai-script-generation/20261008-original-full-script-research.md','utf8');for(const t of ['TAIWAN STOCK','騰輝電子','全友','台塑','四萬一千二百八十三股','publication_authorized=false'])if(!s.includes(t))process.exit(1);console.log('ORIGINAL_FULL_SCRIPT_RESEARCH_DRAFT_PRESENT')"
      - name: Verify dated 2305 dealer total against corrected Facts
        run: node tests/research_dealer_total_20261008.test.js
      - name: Preserve read-only proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-recovery-readonly-proof
          path: /tmp/video-recovery-proof/
          if-no-files-found: error
          retention-days: 14
