name: Crawl Fubon Broker Details

on:
  schedule:
    # 台北 18:17 抓取全市場券商分點明細。
    - cron: '17 10 * * 1-5'
    # 台北 20:17 再檢查／重試一次；已有完整檔案時會立即跳過。
    - cron: '17 12 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '單日日期（YYYYMMDD）；和 start_date/end_date 擇一'
        required: false
        default: ''
      start_date:
        description: '長區間起日（YYYYMMDD 或 YYYY-MM-DD）；會自動每 5 個交易日分批'
        required: false
        default: ''
      end_date:
        description: '長區間迄日（YYYYMMDD 或 YYYY-MM-DD）'
        required: false
        default: ''
      concurrency:
        description: '同時爬取股票數（1-10；長區間建議 2）'
        required: false
        default: '2'
      retries:
        description: '每檔股票單輪重試次數（1-10）'
        required: false
        default: '3'
      min_delay_ms:
        description: '每次請求後最短隨機等待（毫秒）'
        required: false
        default: '800'
      max_delay_ms:
        description: '每次請求後最長隨機等待（毫秒）'
        required: false
        default: '2500'
      backoff_base_ms:
        description: '請求失敗指數退避基準（毫秒）'
        required: false
        default: '5000'
      checkpoint_size:
        description: '臨時工作檔每處理幾檔股票寫入一次進度'
        required: false
        default: '100'
      batch_pause_min_seconds:
        description: '每完成 5 個交易日後最短休息秒數'
        required: false
        default: '120'
      batch_pause_max_seconds:
        description: '每完成 5 個交易日後最長休息秒數'
        required: false
        default: '300'
      force:
        description: '重新下載已有完整檔案'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  FINAL_OUTPUT_DIR: data_fubon_broker_details

concurrency:
  group: fubon-broker-details-${{ github.event_name == 'workflow_dispatch' && (inputs.start_date != '' || inputs.end_date != '') && 'range' || 'daily' }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      start_date: ${{ steps.resolve.outputs.start_date }}
      end_date: ${{ steps.resolve.outputs.end_date }}
      target_date: ${{ steps.resolve.outputs.target_date }}
    steps:
      - name: Resolve mode and dates
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          date_input='${{ inputs.date }}'
          start_input='${{ inputs.start_date }}'
          end_input='${{ inputs.end_date }}'

          if [ -n "$date_input" ] && { [ -n "$start_input" ] || [ -n "$end_input" ]; }; then
            echo 'date 不能和 start_date/end_date 同時使用。'
            exit 1
          fi

          if [ -n "$start_input" ] || [ -n "$end_input" ]; then
            [ -z "$start_input" ] && start_input="$end_input"
            [ -z "$end_input" ] && end_input="$start_input"
            echo 'mode=range' >> "$GITHUB_OUTPUT"
            echo "start_date=$start_input" >> "$GITHUB_OUTPUT"
            echo "end_date=$end_input" >> "$GITHUB_OUTPUT"
            echo "Range mode: $start_input ~ $end_input"
          else
            if [ -n "$date_input" ]; then
              target_date="$date_input"
            else
              # 將台北時間往前移 8 小時，讓 00:00～07:59 仍歸屬前一交易日。
              target_date=$(TZ='Asia/Taipei' date -d '8 hours ago' '+%Y%m%d')
            fi
            echo 'mode=single' >> "$GITHUB_OUTPUT"
            echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
            echo "Single-date mode: $target_date"
          fi

  plan-range:
    needs: validate-inputs
    if: needs.validate-inputs.outputs.mode == 'range'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      pending_dates: ${{ steps.plan.outputs.pending_dates }}
      batches: ${{ steps.plan.outputs.batches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Plan five-trading-day batches
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --start '${{ needs.validate-inputs.outputs.start_date }}'
            --end '${{ needs.validate-inputs.outputs.end_date }}'
            --batch-size 5
          )
          if [ '${{ inputs.force }}' = 'true' ]; then args+=(--force); fi

          node scripts/plan_fubon_broker_batches.js "${args[@]}" > /tmp/fubon-plan.json
          cat /tmp/fubon-plan.json | node -e '
            const fs=require("node:fs");
            const plan=JSON.parse(fs.readFileSync(0,"utf8"));
            console.error(`交易日 ${plan.trading_date_count}；已完整略過 ${plan.skipped_complete_date_count}；待抓 ${plan.pending_date_count}；批次 ${plan.matrix.include.length}`);
          '
          matrix=$(node -e 'const p=require("/tmp/fubon-plan.json"); process.stdout.write(JSON.stringify(p.matrix))')
          pending=$(node -e 'const p=require("/tmp/fubon-plan.json"); process.stdout.write(String(p.pending_date_count))')
          batches=$(node -e 'const p=require("/tmp/fubon-plan.json"); process.stdout.write(String(p.matrix.include.length))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "pending_dates=$pending" >> "$GITHUB_OUTPUT"
          echo "batches=$batches" >> "$GITHUB_OUTPUT"
          if [ "$pending" -gt 0 ]; then echo 'has_work=true' >> "$GITHUB_OUTPUT"; else echo 'has_work=false' >> "$GITHUB_OUTPUT"; fi

      - name: Test batch planner and isolated publisher
        run: node --test tests/plan_fubon_broker_batches.test.js tests/crawl_fubon_broker_date_isolated.test.js

  crawl-range:
    needs: [validate-inputs, plan-range]
    if: needs.plan-range.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan-range.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    name: Fubon batch ${{ matrix.batch_index }}/${{ matrix.batch_count }} (${{ matrix.first_date }} ~ ${{ matrix.last_date }})
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Crawl, verify, and push each complete day immediately
        id: crawl
        shell: bash
        env:
          BATCH_DATES: ${{ matrix.dates }}
          HAS_NEXT_BATCH: ${{ matrix.has_next }}
          INPUT_CONCURRENCY: ${{ inputs.concurrency }}
          INPUT_RETRIES: ${{ inputs.retries }}
          INPUT_MIN_DELAY_MS: ${{ inputs.min_delay_ms }}
          INPUT_MAX_DELAY_MS: ${{ inputs.max_delay_ms }}
          INPUT_BACKOFF_BASE_MS: ${{ inputs.backoff_base_ms }}
          INPUT_CHECKPOINT_SIZE: ${{ inputs.checkpoint_size }}
          INPUT_FORCE: ${{ inputs.force }}
          BATCH_PAUSE_MIN: ${{ inputs.batch_pause_min_seconds }}
          BATCH_PAUSE_MAX: ${{ inputs.batch_pause_max_seconds }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/fubon-logs "$RUNNER_TEMP/fubon-complete"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          official_is_complete() {
            node -e 'const {isCompleteOutput}=require("./scripts/plan_fubon_broker_batches"); process.exit(isCompleteOutput(process.argv[1]) ? 0 : 1)' "$1"
          }

          remove_incomplete_day() {
            local iso_date="$1"
            local compact="${iso_date//-/}"
            local filename="fubon_${compact}_券商分點進出明細.json"
            local destination="$FINAL_OUTPUT_DIR/$filename"

            if [ ! -f "$destination" ] || official_is_complete "$destination"; then
              return 0
            fi

            echo "🧹 $iso_date 正式檔為未完成資料，先從 main 移除。"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              if [ ! -f "$destination" ] || official_is_complete "$destination"; then
                return 0
              fi
              rm -f "$destination"
              node scripts/generate_file_lists.js --only data_fubon_broker_details
              git add -A -- "$destination" "$FINAL_OUTPUT_DIR/files.json"
              if git diff --staged --quiet; then
                return 0
              fi
              git commit -m "🧹 Remove incomplete Fubon broker details ${compact}"
              if git push origin HEAD:main; then
                echo "✅ $iso_date 未完成正式檔已移除。"
                return 0
              fi
              echo "Delete push failed for $iso_date, retry $attempt/5..."
              sleep 5
            done
            return 1
          }

          persist_complete_day() {
            local iso_date="$1"
            local compact="${iso_date//-/}"
            local filename="fubon_${compact}_券商分點進出明細.json"
            local destination="$FINAL_OUTPUT_DIR/$filename"
            local saved="$RUNNER_TEMP/fubon-complete/$filename"
            cp "$destination" "$saved"

            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              rm -f "$destination"
              mkdir -p "$FINAL_OUTPUT_DIR"
              cp "$saved" "$destination.tmp"
              mv "$destination.tmp" "$destination"
              node scripts/generate_file_lists.js --only data_fubon_broker_details
              git add -- "$destination" "$FINAL_OUTPUT_DIR/files.json"

              if git diff --staged --quiet; then
                echo "ℹ️ $iso_date 已由其他執行寫入相同內容。"
                return 0
              fi

              git commit -m "🏦 Complete Fubon broker details ${compact}"
              if git push origin HEAD:main; then
                echo "✅ $iso_date 已獨立 commit 並推送。"
                return 0
              fi
              echo "Push failed for $iso_date, retry $attempt/5..."
              sleep 5
            done
            return 1
          }

          IFS=',' read -r -a dates <<< "$BATCH_DATES"
          failed_dates=()
          completed_dates=()

          for index in "${!dates[@]}"; do
            iso_date="${dates[$index]}"
            compact="${iso_date//-/}"
            log_file="/tmp/fubon-logs/${compact}.log"

            if ! remove_incomplete_day "$iso_date"; then
              echo "❌ $iso_date 無法先移除未完成正式檔，跳過本日。"
              failed_dates+=("$iso_date:cleanup")
              continue
            fi

            args=(
              --date "$iso_date"
              --final-output-dir "$FINAL_OUTPUT_DIR"
              --work-root "$RUNNER_TEMP/fubon-work"
              --concurrency "${INPUT_CONCURRENCY:-2}"
              --retries "${INPUT_RETRIES:-3}"
              --min-delay-ms "${INPUT_MIN_DELAY_MS:-800}"
              --max-delay-ms "${INPUT_MAX_DELAY_MS:-2500}"
              --backoff-base-ms "${INPUT_BACKOFF_BASE_MS:-5000}"
              --checkpoint-size "${INPUT_CHECKPOINT_SIZE:-100}"
            )
            if [ "$INPUT_FORCE" = 'true' ]; then args+=(--force); fi

            set +e
            node scripts/crawl_fubon_broker_date_isolated.js "${args[@]}" 2>&1 | tee "$log_file"
            crawl_status=${PIPESTATUS[0]}
            set -e

            if [ "$crawl_status" -eq 0 ]; then
              if persist_complete_day "$iso_date"; then
                completed_dates+=("$iso_date")
              else
                echo "❌ $iso_date 完整檔案已產生，但 push 失敗。"
                failed_dates+=("$iso_date:persist")
              fi
            else
              echo "❌ $iso_date 未完整完成；正式資料夾不會保留半成品。"
              failed_dates+=("$iso_date:crawl")
            fi

            if [ "$index" -lt "$((${#dates[@]} - 1))" ]; then
              day_pause=$((20 + RANDOM % 41))
              echo "⏳ 下一個交易日前等待 ${day_pause}s"
              sleep "$day_pause"
            fi
          done

          echo "completed_dates=${completed_dates[*]}" >> "$GITHUB_OUTPUT"
          echo "failed_dates=${failed_dates[*]}" >> "$GITHUB_OUTPUT"

          if [ "$HAS_NEXT_BATCH" = 'true' ]; then
            min_pause=${BATCH_PAUSE_MIN:-120}
            max_pause=${BATCH_PAUSE_MAX:-300}
            if [ "$max_pause" -lt "$min_pause" ]; then max_pause=$min_pause; fi
            batch_pause=$((min_pause + RANDOM % (max_pause - min_pause + 1)))
            echo "🛑 已處理本批最多 5 個交易日，長休息 ${batch_pause}s 後再進下一批。"
            sleep "$batch_pause"
          fi

          if [ "${#failed_dates[@]}" -gt 0 ]; then
            echo "未完成日期：${failed_dates[*]}"
            exit 1
          fi

      - name: Upload per-day crawl logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fubon-broker-range-${{ github.run_id }}-batch-${{ matrix.batch_index }}
          path: /tmp/fubon-logs
          if-no-files-found: warn
          retention-days: 7

  crawl-single:
    needs: validate-inputs
    if: needs.validate-inputs.outputs.mode == 'single'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Remove incomplete official single-day file
        shell: bash
        run: |
          set -euo pipefail
          raw_date='${{ needs.validate-inputs.outputs.target_date }}'
          compact=$(echo "$raw_date" | tr -d -- '-/')
          destination="$FINAL_OUTPUT_DIR/fubon_${compact}_券商分點進出明細.json"

          if [ ! -f "$destination" ] || node -e 'const {isCompleteOutput}=require("./scripts/plan_fubon_broker_batches"); process.exit(isCompleteOutput(process.argv[1]) ? 0 : 1)' "$destination"; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if [ ! -f "$destination" ] || node -e 'const {isCompleteOutput}=require("./scripts/plan_fubon_broker_batches"); process.exit(isCompleteOutput(process.argv[1]) ? 0 : 1)' "$destination"; then
              exit 0
            fi
            rm -f "$destination"
            node scripts/generate_file_lists.js --only data_fubon_broker_details
            git add -A -- "$destination" "$FINAL_OUTPUT_DIR/files.json"
            git commit -m "🧹 Remove incomplete Fubon broker details ${compact}"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Crawl single day in isolated work directory
        id: crawl
        shell: bash
        run: |
          set -o pipefail
          args=(
            --date '${{ needs.validate-inputs.outputs.target_date }}'
            --final-output-dir "$FINAL_OUTPUT_DIR"
            --work-root "$RUNNER_TEMP/fubon-work"
            --concurrency '${{ inputs.concurrency || '4' }}'
            --retries '${{ inputs.retries || '3' }}'
            --min-delay-ms '${{ inputs.min_delay_ms || '800' }}'
            --max-delay-ms '${{ inputs.max_delay_ms || '2500' }}'
            --backoff-base-ms '${{ inputs.backoff_base_ms || '5000' }}'
            --checkpoint-size '${{ inputs.checkpoint_size || '100' }}'
          )
          if [ '${{ inputs.force }}' = 'true' ]; then args+=(--force); fi
          node scripts/crawl_fubon_broker_date_isolated.js "${args[@]}" 2>&1 | tee /tmp/fubon-single.log

      - name: Commit and push verified complete day
        shell: bash
        run: |
          set -euo pipefail
          raw_date='${{ needs.validate-inputs.outputs.target_date }}'
          compact=$(echo "$raw_date" | tr -d -- '-/')
          filename="fubon_${compact}_券商分點進出明細.json"
          destination="$FINAL_OUTPUT_DIR/$filename"
          saved="$RUNNER_TEMP/$filename"
          cp "$destination" "$saved"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -f "$destination"
            cp "$saved" "$destination.tmp"
            mv "$destination.tmp" "$destination"
            node scripts/generate_file_lists.js --only data_fubon_broker_details
            git add -- "$destination" "$FINAL_OUTPUT_DIR/files.json"
            if git diff --staged --quiet; then
              echo 'No broker-detail changes to commit.'
              exit 0
            fi
            git commit -m "🏦 Complete Fubon broker details ${compact}"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push failed, retry $attempt/5..."
            sleep 5
          done
          exit 1

      - name: Upload single-day crawl log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fubon-broker-single-${{ github.run_id }}
          path: /tmp/fubon-single.log
          if-no-files-found: warn
          retention-days: 7
