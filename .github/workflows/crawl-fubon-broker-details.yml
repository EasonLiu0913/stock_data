name: Crawl Fubon Broker Details

on:
  schedule:
    # 台北 18:17 抓取全市場券商分點明細。
    - cron: '17 10 * * 1-5'
    # 台北 20:17 再檢查／重試一次；已有完整檔案時會立即跳過。
    - cron: '17 12 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '單日日期（YYYYMMDD）；和 start_date/end_date 擇一'
        required: false
        default: ''
      start_date:
        description: '區間起日（YYYY-MM-DD）'
        required: false
        default: ''
      end_date:
        description: '區間迄日（YYYY-MM-DD 或 yesterday）'
        required: false
        default: ''
      max_dates:
        description: '本次最多補抓幾個未完成交易日；建議 1，最多 5'
        required: false
        default: '5'
      concurrency:
        description: '同時爬取股票數（1-10；區間建議 1-2）'
        required: false
        default: '2'
      min_delay_ms:
        description: '每次請求後最短隨機等待（毫秒）'
        required: false
        default: '800'
      max_delay_ms:
        description: '每次請求後最長隨機等待（毫秒）'
        required: false
        default: '2500'
      date_min_delay_ms:
        description: '交易日之間最短隨機等待（毫秒）'
        required: false
        default: '5000'
      date_max_delay_ms:
        description: '交易日之間最長隨機等待（毫秒）'
        required: false
        default: '15000'
      backoff_base_ms:
        description: '請求失敗指數退避基準（毫秒）'
        required: false
        default: '5000'
      checkpoint_size:
        description: '每處理幾檔股票寫入一次 JSON 進度'
        required: false
        default: '100'
      force:
        description: '重新下載已有完整檔案'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: fubon-broker-details
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve crawler arguments
        id: args
        shell: bash
        run: |
          args="--concurrency ${{ inputs.concurrency || '4' }}"
          args="$args --min-delay-ms ${{ inputs.min_delay_ms || '800' }}"
          args="$args --max-delay-ms ${{ inputs.max_delay_ms || '2500' }}"
          args="$args --date-min-delay-ms ${{ inputs.date_min_delay_ms || '5000' }}"
          args="$args --date-max-delay-ms ${{ inputs.date_max_delay_ms || '15000' }}"
          args="$args --backoff-base-ms ${{ inputs.backoff_base_ms || '5000' }}"
          args="$args --checkpoint-size ${{ inputs.checkpoint_size || '100' }}"

          if [ -n "${{ inputs.date }}" ]; then
            args="$args --date ${{ inputs.date }}"
          elif [ -n "${{ inputs.start_date }}" ] || [ -n "${{ inputs.end_date }}" ]; then
            args="$args --start ${{ inputs.start_date || '2026-01-01' }}"
            args="$args --end ${{ inputs.end_date || 'yesterday' }}"
            args="$args --max-dates ${{ inputs.max_dates || '5' }}"
          else
            # 將台北時間往前移 8 小時，讓 00:00～07:59 仍歸屬前一交易日。
            target_date=$(TZ='Asia/Taipei' date -d '8 hours ago' '+%Y%m%d')
            args="$args --date $target_date"
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            args="$args --force"
          fi

          echo "value=$args" >> "$GITHUB_OUTPUT"
          echo "Crawler arguments: $args"

      - name: Crawl broker details with pending retry rounds
        id: crawl
        shell: bash
        run: |
          set -o pipefail
          set +e
          node scripts/crawl_fubon_broker_details_resumable.js ${{ steps.args.outputs.value }} \
            2>&1 | tee /tmp/fubon-broker-details-crawl.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "Crawler exit code: $status"
          exit 0

      - name: Verify generated data
        id: verify
        if: always() && inputs.start_date == '' && inputs.end_date == ''
        shell: bash
        run: |
          set -o pipefail
          set +e
          args="${{ steps.args.outputs.value }}"
          args="${args/ --force/}"
          node scripts/crawl_fubon_broker_details_resumable.js $args --check-only \
            2>&1 | tee /tmp/fubon-broker-details-verify.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "Verification exit code: $status"
          exit 0

      - name: Generate broker-details files.json only
        if: always()
        run: node scripts/generate_file_lists.js --only data_fubon_broker_details

      - name: Upload crawl logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fubon-broker-details-${{ github.run_id }}
          path: |
            /tmp/fubon-broker-details-crawl.log
            /tmp/fubon-broker-details-verify.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit and push changes
        id: persist
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_fubon_broker_details/

          if git diff --staged --quiet; then
            if [ -n "$(git status --porcelain)" ]; then
              echo "Unexpected uncommitted changes remain even though there are no broker-detail changes:"
              git status --short
              exit 1
            fi
            echo "result=no_changes" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
            exit 0
          fi

          current_date=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          if [ "${{ steps.crawl.outputs.exit_code }}" = "0" ] && \
             { [ "${{ steps.verify.outputs.exit_code }}" = "0" ] || [ -z "${{ steps.verify.outputs.exit_code }}" ]; }; then
            message="🏦 Complete Fubon broker details - ${current_date}"
          else
            message="🏦 Checkpoint Fubon broker details pending retry - ${current_date}"
          fi
          git commit -m "$message"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected uncommitted changes remain before rebase:"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "result=pushed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed, retry ${attempt}/5..."
            sleep 5
          done

          echo "Failed to push broker details after 5 attempts."
          exit 1

      - name: Mark incomplete broker details crawl as failed after saving progress
        if: always()
        shell: bash
        run: |
          crawl_status="${{ steps.crawl.outputs.exit_code }}"
          verify_status="${{ steps.verify.outputs.exit_code }}"
          persist_outcome="${{ steps.persist.outcome }}"
          persist_result="${{ steps.persist.outputs.result }}"

          if [ "$persist_outcome" != "success" ]; then
            echo "Fubon broker details persistence failed; generated progress was not confirmed on main."
            echo "Persistence outcome: ${persist_outcome:-unknown}"
            echo "Crawler exit code: ${crawl_status:-unknown}"
            echo "Verification exit code: ${verify_status:-not-run}"
            exit 1
          fi

          if [ "$crawl_status" != "0" ] || { [ -n "$verify_status" ] && [ "$verify_status" != "0" ]; }; then
            if [ "$persist_result" = "pushed" ]; then
              echo "Fubon broker details still has pending retry stocks; new checkpoint progress was committed and pushed."
            else
              echo "Fubon broker details still has pending retry stocks; persistence completed with no new file changes."
            fi
            echo "Crawler exit code: ${crawl_status:-unknown}"
            echo "Verification exit code: ${verify_status:-not-run}"
            exit 1
          fi

          echo "Fubon broker details crawl and verification completed successfully (${persist_result:-no_changes})."
