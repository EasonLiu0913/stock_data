name: "[07 研究] 5% 漲幅 AI Contract 一致性檢查"

on:
  push:
    branches: [main]
    paths:
      - 'config/daily-gainers-ai-contract.json'
      - 'config/daily-gainers-theme-taxonomy.json'
      - 'scripts/build_daily_gainers_ai_facts.js'
      - 'scripts/validate_daily_gainers_ai_analysis.js'
      - 'scripts/publish_daily_gainers_unified_analysis.js'
      - 'scripts/build_daily_gainers_market_summary.js'
      - 'scripts/validate_daily_gainers_market_summary.js'
      - 'scripts/lib/daily_gainers_ai_contract.js'
      - 'scripts/daily_gainers_ai_contract_cli.js'
      - 'scripts/check_daily_gainers_ai_contract_consistency.js'
      - '.github/workflows/daily-gainers-over-5.yml'
      - '.github/workflows/analyze-daily-gainers-margin-flow-2200.yml'
      - '.github/workflows/publish-daily-gainers-ai-analysis.yml'
      - '.github/workflows/publish-daily-gainers-unified-analysis.yml'
      - '.github/workflows/backfill-daily-gainers-research.yml'
      - '.github/workflows/check-daily-gainers-ai-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-consistency:
    name: 驗證 central contract 與執行元件一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check syntax, contract consistency and real repository sample
        run: |
          set -euo pipefail
          node --check scripts/lib/daily_gainers_ai_contract.js
          node --check scripts/daily_gainers_ai_contract_cli.js
          node --check scripts/build_daily_gainers_ai_facts.js
          node --check scripts/validate_daily_gainers_ai_analysis.js
          node --check scripts/publish_daily_gainers_unified_analysis.js
          node --check scripts/build_daily_gainers_market_summary.js
          node --check scripts/validate_daily_gainers_market_summary.js
          node --check scripts/check_daily_gainers_ai_contract_consistency.js
          node scripts/build_daily_gainers_market_summary.js --self-test
          node scripts/validate_daily_gainers_market_summary.js --self-test
          node scripts/check_daily_gainers_ai_contract_consistency.js

          latest="$(find data_daily_gain_over_5 -maxdepth 1 -type f -name '20??????.json' -printf '%f\n' | sed 's/\.json$//' | sort | tail -1)"
          [ -n "$latest" ] || { echo "No real daily-gainers sample found" >&2; exit 1; }
          echo "Testing real repository date: $latest"
          node scripts/build_daily_gainers_market_summary.js --date "$latest" --force
          node scripts/validate_daily_gainers_market_summary.js --date "$latest"
          node - "$latest" <<'NODE'
          const fs = require('node:fs');
          const date = process.argv[2];
          const summary = JSON.parse(fs.readFileSync(`data_daily_gain_over_5/market-summary/${date}.json`, 'utf8'));
          console.log(JSON.stringify({ date, status: summary.status, coverage: summary.coverage, breadth: summary.breadth, risk_signals: summary.risk_signals }, null, 2));
          NODE

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for schedule summary
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Write schedule timing summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js

