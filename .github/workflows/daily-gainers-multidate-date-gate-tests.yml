name: "[08 測試] Multi-date video scheduling safety gates"
on:
  push:
    branches: [main]
    paths:
      - "scripts/select_daily_gainers_pending_video_dates.js"
      - "scripts/reserve_daily_gainers_private_upload.sh"
      - "scripts/decide_daily_gainers_video_upload.sh"
      - "tests/select_daily_gainers_pending_video_dates.test.js"
      - ".github/workflows/daily-gainers-multidate-date-gate-tests.yml"
      - ".github/workflows/daily-gainers-video-upload-orchestrator.yml"
      - ".github/workflows/generate-upload-daily-gainers-video.yml"
      - ".github/workflows/retry-upload-daily-gainers-video.yml"
      - ".github/workflows/daily-gainers-date-render-only.yml"
      - ".github/workflows/taiwan-stock-date-recovery-dispatch.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/select_daily_gainers_pending_video_dates.js
            scripts/reserve_daily_gainers_private_upload.sh
            scripts/decide_daily_gainers_video_upload.sh
            tests/select_daily_gainers_pending_video_dates.test.js
            .github/workflows/daily-gainers-video-upload-orchestrator.yml
            .github/workflows/generate-upload-daily-gainers-video.yml
            .github/workflows/retry-upload-daily-gainers-video.yml
            .github/workflows/daily-gainers-date-render-only.yml
            .github/workflows/taiwan-stock-date-recovery-dispatch.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run date selection regression
        run: node --test tests/select_daily_gainers_pending_video_dates.test.js
      - name: Parse private upload reservation script (no external actions)
        run: bash -n scripts/reserve_daily_gainers_private_upload.sh
      - name: Audit upload concurrency and render isolation
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          for(const p of ['.github/workflows/generate-upload-daily-gainers-video.yml','.github/workflows/retry-upload-daily-gainers-video.yml']){
            const s=fs.readFileSync(p,'utf8');
            if(!s.includes('group: daily-gainers-video-upload-serial')||!s.includes('cancel-in-progress: false'))throw Error('unsafe upload mutex '+p);
            const reservation=s.indexOf('bash scripts/reserve_daily_gainers_private_upload.sh');
            const upload=s.indexOf('node scripts/upload_youtube.js');
            if(reservation<0||upload<0||reservation>=upload)throw Error('upload reservation not before API call '+p);
          }
          const router=fs.readFileSync('.github/workflows/daily-gainers-video-upload-orchestrator.yml','utf8');
          if(!router.includes('select_daily_gainers_pending_video_dates.js')||!router.includes('Explicit date is required')||!router.includes('video_upload_attempts'))throw Error('unsafe stale date fallback');
          const decision=fs.readFileSync('scripts/decide_daily_gainers_video_upload.sh','utf8');
          if(!decision.includes('decision=blocked_reconcile_upload'))throw Error('missing ambiguous replay blocker');
          const render=fs.readFileSync('.github/workflows/daily-gainers-date-render-only.yml','utf8');
          for(const value of ['workflow_dispatch:','required: true','group: daily-gainers-safe-render-only-','node scripts/validate_daily_gainers_video_script.js "$DATE"','metadata.json','thumbnail.jpg','-render-only']){
            if(!render.includes(value))throw Error('missing render prerequisite '+value);
          }
          if(/upload_youtube|YOUTUBE_CLIENT_SECRET|gh workflow run generate-upload/.test(render))throw Error('upload path in Render-only');
          if(render.includes('9.82%')||render.includes("q.target_date!=='20261103'"))throw Error('hardcoded Golden date');
          const recovery=fs.readFileSync('.github/workflows/taiwan-stock-date-recovery-dispatch.yml','utf8');
          const required=['recovery-requests/daily-gainers/*.json','concurrency:','group: taiwan-stock-date-recovery-serial','MAX_DISPATCHES','gh workflow run "$workflow" --ref main -f date="$TARGET"','REVIEW_FIRST','INPUT_DATE','jq -e --arg d "$TARGET"'];
          for(const part of required)if(!recovery.includes(part))throw Error('recovery dispatcher missing gate '+part);
          for(const workflow of ['daily-gainers-over-5.yml','crawl-twse-mi-index.yml','crawl-twse-institutional-summaries.yml','crawl-twse-margin-balance.yml','crawl-fubon-broker-details.yml']){
            if(!recovery.includes(workflow))throw Error('unmapped missing data '+workflow);
          }
          if(/upload_youtube\.js|generate-upload-daily-gainers-video\.yml|privacyStatus/.test(recovery))throw Error('unsafe recovery side effects');
          console.log('PASS safe multi-date selection, date-scoped missing-data recovery, render-only and upload mutex');
          NODE
