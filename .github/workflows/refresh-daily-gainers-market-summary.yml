name: "[06 回填修復] Refresh Daily Gainers Market Summary"

# Rebuild the latest summary whenever its runtime contract changes.
on:
  push:
    branches: [main]
    paths:
      - 'config/daily-gainers-ai-contract.json'
      - 'config/daily-gainers-theme-taxonomy.json'
      - 'scripts/lib/daily_gainers_ai_contract.js'
      - 'scripts/build_daily_gainers_market_summary.js'
      - 'scripts/validate_daily_gainers_market_summary.js'
      - '.github/workflows/refresh-daily-gainers-market-summary.yml'
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 YYYYMMDD；留空使用最新 5% 清單日期'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# All workflows that can write data_daily_gain_over_5/market-summary/YYYYMMDD.json
# must share this repository-wide concurrency group. Keep retry/regenerate logic below
# as a second line of defense against unrelated main-branch writers.
concurrency:
  group: daily-gainers-market-summary-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.date.outputs.date }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve target date
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          set -euo pipefail
          date="${INPUT_DATE:-}"
          if [ -z "$date" ]; then
            date="$(find data_daily_gain_over_5 -maxdepth 1 -type f -name '20??????.json' -printf '%f\n' | sed 's/\.json$//' | sort | tail -1)"
          fi
          [[ "$date" =~ ^20[0-9]{6}$ ]] || { echo "Invalid or missing date: $date" >&2; exit 1; }
          [ -s "data_daily_gain_over_5/${date}.json" ] || { echo "Missing raw list for $date" >&2; exit 1; }
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Build and validate market summary
        shell: bash
        run: |
          set -euo pipefail
          date="${{ steps.date.outputs.date }}"
          node --check scripts/lib/daily_gainers_ai_contract.js
          node --check scripts/build_daily_gainers_market_summary.js
          node --check scripts/validate_daily_gainers_market_summary.js
          node scripts/build_daily_gainers_market_summary.js --self-test
          node scripts/validate_daily_gainers_market_summary.js --self-test
          node scripts/build_daily_gainers_market_summary.js --date "$date"
          node scripts/validate_daily_gainers_market_summary.js --date "$date"
          node - "$date" <<'NODE'
          const fs = require('node:fs');
          const date = process.argv[2];
          const summary = JSON.parse(fs.readFileSync(`data_daily_gain_over_5/market-summary/${date}.json`, 'utf8'));
          console.log(JSON.stringify({ date, status: summary.status, coverage: summary.coverage, breadth: summary.breadth, risk_signals: summary.risk_signals }, null, 2));
          NODE

      - name: Commit refreshed summary
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          date="${{ steps.date.outputs.date }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}: rebuild from current origin/main"
            git fetch origin main
            git reset --hard origin/main

            node scripts/build_daily_gainers_market_summary.js --date "$date"
            node scripts/validate_daily_gainers_market_summary.js --date "$date"

            git add -- "data_daily_gain_over_5/market-summary/${date}.json" "data_daily_gain_over_5/market-summary/manifest.json"
            if git diff --cached --quiet; then
              echo "Remote main already contains an equivalent or newer summary for ${date}."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "analysis: refresh 5% market summary ${date}"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Remote main advanced during push; discard generated commit and regenerate from latest main."
            sleep 5
          done
          exit 1

  deploy:
    name: 發布最新 5% 市場總結到 GitHub Pages
    needs: refresh
    if: needs.refresh.result == 'success' && needs.refresh.outputs.changed == 'true' && needs.refresh.outputs.target_date != ''
    uses: ./.github/workflows/deploy-pages.yml
    with:
      target_date: ${{ needs.refresh.outputs.target_date }}

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
