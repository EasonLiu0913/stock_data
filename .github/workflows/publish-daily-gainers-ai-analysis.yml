name: "[07 研究] 5% 漲幅 AI 籌碼解讀驗證發布"

on:
  push:
    branches:
      - main
    paths:
      - 'research_pending/daily-gainers-ai/*.json'
      - '.github/workflows/publish-daily-gainers-ai-analysis.yml'
  schedule:
    # ChatGPT 22:45 產生當日 pending；23:00/23:30 為容錯驗證。
    - cron: '0 15 * * 1-5'
    - cron: '30 15 * * 1-5'
    # ChatGPT 次日 09:45 補查 unresolved institutional data；10:15/10:45 再容錯驗證最近 pending 日期。
    - cron: '15 2 * * 1-5'
    - cron: '45 2 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '分析日期 YYYYMMDD；留空時 push 取異動 pending 日期、晚間用台北當日、上午用最近 pending 日期'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-gainers-ai-publish
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: 驗證 AI JSON 並升級為正式研究資料
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve target date
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE:-}" ]; then
            target_date="$INPUT_DATE"
            mode="manual"
          elif [ "$EVENT_NAME" = "push" ]; then
            changed_path="$(jq -r '[.commits[]? | (.added[]?, .modified[]?)] | map(select(test("^research_pending/daily-gainers-ai/20[0-9]{6}\\.json$"))) | last // empty' "$GITHUB_EVENT_PATH")"
            if [ -n "$changed_path" ]; then
              target_date="$(basename "$changed_path" .json)"
              mode="pending_push"
            else
              target_date="$(find research_pending/daily-gainers-ai -maxdepth 1 -type f -name '20??????.json' -printf '%f\n' 2>/dev/null | sed 's/\.json$//' | sort | tail -1)"
              mode="workflow_upgrade"
              if [ -z "$target_date" ]; then
                echo "No pending AI synthesis exists for workflow-upgrade validation"
                echo "target_date=" >> "$GITHUB_OUTPUT"
                echo "mode=$mode" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          else
            hour="$(TZ='Asia/Taipei' date '+%H')"
            if [ "$hour" -lt 12 ]; then
              target_date="$(find research_pending/daily-gainers-ai -maxdepth 1 -type f -name '20??????.json' -printf '%f\n' 2>/dev/null | sed 's/\.json$//' | sort | tail -1)"
              mode="next_day_recheck"
              if [ -z "$target_date" ]; then
                echo "No pending AI synthesis exists for morning recheck"
                echo "target_date=" >> "$GITHUB_OUTPUT"
                echo "mode=$mode" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              target_date="$(TZ='Asia/Taipei' date '+%Y%m%d')"
              mode="same_day"
            fi
          fi
          [[ "$target_date" =~ ^20[0-9]{6}$ ]] || { echo "Invalid date: $target_date" >&2; exit 1; }
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Upgrade deterministic facts to latest methodology
        if: steps.date.outputs.target_date != ''
        id: facts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date="${{ steps.date.outputs.target_date }}"
          facts="data_daily_gain_over_5/analysis-facts/${date}.json"
          latest=false

          if [ -s "$facts" ]; then
            latest="$(node - "$facts" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          try {
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            process.stdout.write(String(payload.schema_version === 2 && payload.methodology_version === 'daily-gainers-ai-facts-v2'));
          } catch {
            process.stdout.write('false');
          }
          NODE
            )"
          fi

          if [ "$latest" != true ]; then
            echo "Facts are missing or outdated; regenerating ${date} with latest methodology"
            node --check scripts/build_daily_gainers_ai_facts.js
            node scripts/build_daily_gainers_ai_facts.js "$date"

            node - "$facts" "$date" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          const date = process.argv[3];
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (payload.schema_version !== 2) throw new Error('regenerated facts schema_version must be 2');
          if (payload.methodology_version !== 'daily-gainers-ai-facts-v2') throw new Error('regenerated facts methodology_version mismatch');
          if (payload.target_date !== date) throw new Error('regenerated facts target_date mismatch');
          NODE

            git add -- "$facts"
            if ! git diff --cached --quiet; then
              git commit -m "analysis: upgrade 5% AI facts ${date} to latest methodology"
              for attempt in 1 2 3 4 5; do
                if git push origin HEAD:main; then
                  break
                fi
                git fetch origin main
                git reset --hard origin/main
                node scripts/build_daily_gainers_ai_facts.js "$date"
                git add -- "$facts"
                if git diff --cached --quiet; then
                  break
                fi
                git commit -m "analysis: upgrade 5% AI facts ${date} to latest methodology"
                sleep 5
              done
            fi
          fi

          echo "latest=true" >> "$GITHUB_OUTPUT"

      - name: Check pending AI synthesis
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          date="${{ steps.date.outputs.target_date }}"
          if [ -z "$date" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          facts="data_daily_gain_over_5/analysis-facts/${date}.json"
          pending="research_pending/daily-gainers-ai/${date}.json"
          ready=true
          reason="ready"
          [ -s "$facts" ] || { ready=false; reason="facts_missing"; }
          [ -s "$pending" ] || { ready=false; reason="pending_missing"; }

          if [ "$ready" = true ]; then
            pending_latest="$(node - "$pending" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          try {
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            process.stdout.write(String(payload.schema_version === 2 && payload.methodology_version === 'daily-gainers-ai-synthesis-v2'));
          } catch {
            process.stdout.write('false');
          }
          NODE
            )"
            if [ "$pending_latest" != true ]; then
              ready=false
              reason="pending_outdated"
            fi
          fi

          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then
            echo "## AI 籌碼解讀尚未可發布" >> "$GITHUB_STEP_SUMMARY"
            echo "- 日期：$date" >> "$GITHUB_STEP_SUMMARY"
            echo "- 模式：${{ steps.date.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- 原因：$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "- facts 已自動升級至 latest-rules-only；若 pending_outdated，需由 ChatGPT 使用最新版 facts 重新產生 AI v2，不再驗證或發布舊 AI。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate pending AI schema against facts
        if: steps.pending.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          date="${{ steps.date.outputs.target_date }}"
          node --check scripts/validate_daily_gainers_ai_analysis.js
          node scripts/validate_daily_gainers_ai_analysis.js "$date" "research_pending/daily-gainers-ai/${date}.json"

      - name: Promote validated AI JSON to published data
        if: steps.pending.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date="${{ steps.date.outputs.target_date }}"
          pending="research_pending/daily-gainers-ai/${date}.json"
          published="data_daily_gain_over_5/analysis-ai/${date}.json"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if [ ! -s "$pending" ]; then
              echo "Pending AI file disappeared before publish: $pending" >&2
              exit 1
            fi
            node scripts/validate_daily_gainers_ai_analysis.js "$date" "$pending"
            mkdir -p "$(dirname "$published")"
            cp "$pending" "$published"
            git add -- "$published"
            if git diff --cached --quiet; then
              echo "Published AI analysis is already current"
              exit 0
            fi
            git commit -m "analysis: publish AI synthesis for 5% gainers ${date}"
            if git push origin HEAD:main; then
              echo "## AI 籌碼解讀已通過 schema 驗證並發布" >> "$GITHUB_STEP_SUMMARY"
              echo "- 日期：$date" >> "$GITHUB_STEP_SUMMARY"
              echo "- 模式：${{ steps.date.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
              echo "- 正式檔：$published" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "Failed to publish validated AI analysis after 5 attempts" >&2
          exit 1
