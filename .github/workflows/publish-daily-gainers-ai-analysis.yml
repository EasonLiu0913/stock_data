name: "[07 研究] 5% 漲幅 AI 籌碼解讀驗證發布"

on:
  push:
    branches:
      - main
    paths:
      - 'research_pending/daily-gainers-ai/*.json'
      - 'config/daily-gainers-ai-contract.json'
      - 'scripts/lib/daily_gainers_ai_contract.js'
      - 'scripts/daily_gainers_ai_contract_cli.js'
      - 'scripts/build_daily_gainers_ai_facts.js'
      - 'scripts/validate_daily_gainers_ai_analysis.js'
      - '.github/workflows/publish-daily-gainers-ai-analysis.yml'
  schedule:
    - cron: '0 15 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '15 2 * * 1-5'
    - cron: '45 2 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '分析日期 YYYYMMDD；留空時 push/升版取最近 pending 日期、晚間用台北當日、上午用最近 pending 日期'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-gainers-ai-publish
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: 驗證 AI JSON 並升級為正式研究資料
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate central contract
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/lib/daily_gainers_ai_contract.js
          node --check scripts/daily_gainers_ai_contract_cli.js
          node scripts/daily_gainers_ai_contract_cli.js print | jq .

      - name: Resolve target date
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE:-}" ]; then
            target_date="$INPUT_DATE"
            mode="manual"
          elif [ "$EVENT_NAME" = "push" ]; then
            changed_path="$(jq -r '[.commits[]? | (.added[]?, .modified[]?)] | map(select(test("^research_pending/daily-gainers-ai/20[0-9]{6}\\.json$"))) | last // empty' "$GITHUB_EVENT_PATH")"
            if [ -n "$changed_path" ]; then
              target_date="$(basename "$changed_path" .json)"
              mode="pending_push"
            else
              target_date="$(find research_pending/daily-gainers-ai -maxdepth 1 -type f -name '20??????.json' -printf '%f\n' 2>/dev/null | sed 's/\.json$//' | sort | tail -1)"
              mode="contract_or_workflow_upgrade"
              if [ -z "$target_date" ]; then
                echo "No pending AI synthesis exists for contract/workflow upgrade validation"
                echo "target_date=" >> "$GITHUB_OUTPUT"
                echo "mode=$mode" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          else
            hour="$(TZ='Asia/Taipei' date '+%H')"
            if [ "$hour" -lt 12 ]; then
              target_date="$(find research_pending/daily-gainers-ai -maxdepth 1 -type f -name '20??????.json' -printf '%f\n' 2>/dev/null | sed 's/\.json$//' | sort | tail -1)"
              mode="next_day_recheck"
              if [ -z "$target_date" ]; then
                echo "No pending AI synthesis exists for morning recheck"
                echo "target_date=" >> "$GITHUB_OUTPUT"
                echo "mode=$mode" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              target_date="$(TZ='Asia/Taipei' date '+%Y%m%d')"
              mode="same_day"
            fi
          fi
          [[ "$target_date" =~ ^20[0-9]{6}$ ]] || { echo "Invalid date: $target_date" >&2; exit 1; }
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Upgrade deterministic facts to current contract
        if: steps.date.outputs.target_date != ''
        id: facts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date="${{ steps.date.outputs.target_date }}"
          facts="data_daily_gain_over_5/analysis-facts/${date}.json"

          latest=false
          if [ -s "$facts" ] && node scripts/daily_gainers_ai_contract_cli.js facts-latest "$facts"; then
            latest=true
          fi

          if [ "$latest" != true ]; then
            echo "Facts are missing or outside current contract; regenerating ${date}"
            node --check scripts/build_daily_gainers_ai_facts.js
            node scripts/build_daily_gainers_ai_facts.js "$date"
            node scripts/daily_gainers_ai_contract_cli.js assert-facts "$facts"

            git add -- "$facts"
            if ! git diff --cached --quiet; then
              git commit -m "analysis: upgrade 5% AI facts ${date} to current contract"
              pushed=false
              for attempt in 1 2 3 4 5; do
                if git push origin HEAD:main; then
                  pushed=true
                  break
                fi
                git fetch origin main
                git reset --hard origin/main
                node scripts/build_daily_gainers_ai_facts.js "$date"
                node scripts/daily_gainers_ai_contract_cli.js assert-facts "$facts"
                git add -- "$facts"
                if git diff --cached --quiet; then
                  pushed=true
                  break
                fi
                git commit -m "analysis: upgrade 5% AI facts ${date} to current contract"
                sleep 5
              done
              [ "$pushed" = true ] || { echo "Failed to push upgraded facts" >&2; exit 1; }
            fi
          fi

          echo "latest=true" >> "$GITHUB_OUTPUT"

      - name: Check pending AI against current facts
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          date="${{ steps.date.outputs.target_date }}"
          if [ -z "$date" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          facts="data_daily_gain_over_5/analysis-facts/${date}.json"
          pending="research_pending/daily-gainers-ai/${date}.json"
          ready=true
          reason="ready"
          [ -s "$facts" ] || { ready=false; reason="facts_missing"; }
          [ -s "$pending" ] || { ready=false; reason="pending_missing"; }

          if [ "$ready" = true ] && ! node scripts/daily_gainers_ai_contract_cli.js ai-latest "$pending"; then
            ready=false
            reason="pending_outdated"
          fi

          if [ "$ready" = true ]; then
            node - "$facts" "$pending" <<'NODE' || { ready=false; reason="facts_changed_after_ai"; }
          const fs = require('node:fs');
          const facts = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const ai = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const factsTime = Date.parse(facts.generated_at || '');
          const aiTime = Date.parse(ai.generated_at || '');
          if (!Number.isFinite(factsTime) || !Number.isFinite(aiTime)) {
            throw new Error('generated_at missing or invalid');
          }
          if (factsTime > aiTime) {
            console.error(JSON.stringify({facts_generated_at:facts.generated_at, ai_generated_at:ai.generated_at}));
            process.exit(1);
          }
          if (Number(facts.stock_count) !== Number(ai.stock_count)) {
            console.error(JSON.stringify({facts_stock_count:facts.stock_count, ai_stock_count:ai.stock_count}));
            process.exit(1);
          }
          const factCodes = new Set((facts.stocks || []).map(x => String(x.code || '')).filter(Boolean));
          const aiCodes = new Set((ai.analyses || []).map(x => String(x.code || '')).filter(Boolean));
          const missing = [...factCodes].filter(code => !aiCodes.has(code));
          const extra = [...aiCodes].filter(code => !factCodes.has(code));
          if (missing.length || extra.length || factCodes.size !== aiCodes.size) {
            console.error(JSON.stringify({missing, extra, facts:factCodes.size, ai:aiCodes.size}));
            process.exit(1);
          }
          NODE
          fi

          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then
            echo "## AI 籌碼解讀尚未可發布" >> "$GITHUB_STEP_SUMMARY"
            echo "- 日期：$date" >> "$GITHUB_STEP_SUMMARY"
            echo "- 模式：${{ steps.date.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- 原因：$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "- 若為 facts_changed_after_ai，代表 AI 完成後 deterministic facts 又更新；禁止發布舊 AI，需依最新 facts 重新分析。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate pending AI schema against facts
        if: steps.pending.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          date="${{ steps.date.outputs.target_date }}"
          node --check scripts/validate_daily_gainers_ai_analysis.js
          node scripts/daily_gainers_ai_contract_cli.js assert-ai "research_pending/daily-gainers-ai/${date}.json"
          node scripts/validate_daily_gainers_ai_analysis.js "$date" "research_pending/daily-gainers-ai/${date}.json"

      - name: Promote validated AI JSON to published data
        if: steps.pending.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date="${{ steps.date.outputs.target_date }}"
          pending="research_pending/daily-gainers-ai/${date}.json"
          published="data_daily_gain_over_5/analysis-ai/${date}.json"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            [ -s "$pending" ] || { echo "Pending AI file disappeared before publish: $pending" >&2; exit 1; }
            node scripts/daily_gainers_ai_contract_cli.js assert-facts "data_daily_gain_over_5/analysis-facts/${date}.json"
            node scripts/daily_gainers_ai_contract_cli.js assert-ai "$pending"
            node scripts/validate_daily_gainers_ai_analysis.js "$date" "$pending"
            node - "data_daily_gain_over_5/analysis-facts/${date}.json" "$pending" <<'NODE'
          const fs = require('node:fs');
          const facts = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const ai = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          if (Date.parse(facts.generated_at || '') > Date.parse(ai.generated_at || '')) {
            throw new Error(`facts changed after AI synthesis: facts=${facts.generated_at}, ai=${ai.generated_at}`);
          }
          NODE
            mkdir -p "$(dirname "$published")"
            cp "$pending" "$published"
            git add -- "$published"
            if git diff --cached --quiet; then
              echo "Published AI analysis is already current"
              exit 0
            fi
            git commit -m "analysis: publish AI synthesis for 5% gainers ${date}"
            if git push origin HEAD:main; then
              echo "## AI 籌碼解讀已通過 current-facts 與 schema 驗證並發布" >> "$GITHUB_STEP_SUMMARY"
              echo "- 日期：$date" >> "$GITHUB_STEP_SUMMARY"
              echo "- 模式：${{ steps.date.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
              echo "- 正式檔：$published" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "Failed to publish validated AI analysis after 5 attempts" >&2
          exit 1
