name: '[04 預測覆盤] 驗證策略總覽與驗證中心'

on:
  push:
    branches: [main]
    paths:
      - 'config/strategy-tag-registry.json'
      - 'public/index.html'
      - 'public/strategy-review-center.html'
      - 'public/strategy-review-center.css'
      - 'public/strategy-review-center.js'
      - 'tests/strategy_review_center.test.js'
      - '.github/workflows/test-strategy-review-center.yml'
  pull_request:
    branches: [main]
    paths:
      - 'config/strategy-tag-registry.json'
      - 'public/index.html'
      - 'public/strategy-review-center.html'
      - 'public/strategy-review-center.css'
      - 'public/strategy-review-center.js'
      - 'tests/strategy_review_center.test.js'
      - '.github/workflows/test-strategy-review-center.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate registry-driven strategy review page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check JavaScript and tests
        run: |
          node --check public/strategy-review-center.js
          node --test tests/strategy_review_center.test.js
      - name: Confirm every current strategy is discoverable without hardcoded IDs
        run: |
          node - <<'NODE'
          'use strict';
          const registry = require('./config/strategy-tag-registry.json');
          const { buildDefinitions } = require('./public/strategy-review-center.js');
          const definitions = buildDefinitions(registry, {}, {});
          const strategyIds = new Set(definitions.filter(item => item.kind === 'strategy').map(item => item.id));
          const observationIds = new Set(definitions.filter(item => item.kind === 'observation').map(item => item.id));
          for (const strategy of registry.strategies || []) {
            if (strategy.enabled === false) continue;
            if (!strategyIds.has(strategy.strategy_id)) throw new Error(`Missing strategy: ${strategy.strategy_id}`);
          }
          for (const tag of registry.tags || []) {
            if (tag.enabled === false || tag.usage_role !== 'observation_only') continue;
            if (!observationIds.has(tag.tag_id)) throw new Error(`Missing observation tag: ${tag.tag_id}`);
          }
          console.log(`Discovered ${strategyIds.size} strategies and ${observationIds.size} observation tags.`);
          NODE
      - name: Guard workflow architecture
        run: |
          forbidden_pattern='^[[:space:]]*workflow[_]run:'
          if grep -ER "$forbidden_pattern" .github/workflows/test-strategy-review-center.yml; then
            echo 'Forbidden event-listener trigger found; use workflow_call and needs instead.' >&2
            exit 1
          fi

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for schedule summary
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Write schedule timing summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js

