name: "[07 研究] Expand Institutional Withdrawal Validation Coverage v1 [RETIRED]"

on:
  workflow_dispatch:

permissions:
  contents: read

# This file intentionally remains as a guard for old bookmarks/manual dispatches.
# The previous implementation ran TDCC and Broker logical batches inside one
# long-lived runner and used checkpoint patterns that are no longer allowed.
# Active collection lives in the Recovery physical-batch workflow:
#   plan -> frozen queue -> one TDCC stock/fresh runner -> Broker <=5 requests/fresh runner
#   -> jitter/cooldown -> checkpoint -> re-plan
# Never restore network collection here.

jobs:
  retired:
    name: Legacy runner retired
    runs-on: ubuntu-latest
    steps:
      - name: Explain the supported execution path
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Legacy institutional-withdrawal coverage runner is retired

          This workflow no longer performs network collection.

          Use **[07 研究] Expand Institutional Withdrawal Validation Coverage v1 Recovery** for coverage expansion. It uses the repository-mandated physical-batch architecture: planner-frozen work, fresh GitHub runner boundaries, bounded requests, jitter/cooldowns, checkpoints, and re-planning.

          Do not restore the previous single-runner TDCC/Broker loops or `git pull --rebase` checkpoint pattern here.
          EOF

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for schedule summary
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/write_workflow_schedule_summary.js

