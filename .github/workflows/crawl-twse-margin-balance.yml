name: "[01 台股資料] Crawl TWSE Margin Balance"

on:
  schedule:
    # 平日 20:17 台北時間 (12:17 UTC)
    - cron: '17 12 * * 1-5'
    # 平日 21:23 台北時間 (13:23 UTC)
    - cron: '23 13 * * 1-5'
    # 平日 22:29 台北時間 (14:29 UTC)
    - cron: '29 14 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Expected data date (YYYYMMDD). Leave empty for latest.'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl-twse-margin-balance:
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.existing.outputs.target_date }}
      pages_changed: ${{ steps.commit.outputs.pages_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing TWSE margin balance file
        id: existing
        run: |
          DATE_INPUT="${{ github.event.inputs.date }}"
          if [ -n "$DATE_INPUT" ]; then
            TARGET_DATE="$DATE_INPUT"
          else
            # Before 03:00 Taipei time, the market data still belongs to the previous day.
            TARGET_DATE=$(TZ='Asia/Taipei' date --date='3 hours ago' '+%Y%m%d')
          fi

          OUTPUT_FILE="data_twse_margin_balance/${TARGET_DATE}_twse_margin_balance.csv"
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "output_file=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"

          if [ -f "$OUTPUT_FILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "TWSE margin balance file already exists: $OUTPUT_FILE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        if: steps.existing.outputs.exists != 'true'
        run: npm ci

      - name: Crawl TWSE margin balance data
        id: crawl
        if: steps.existing.outputs.exists != 'true'
        continue-on-error: true
        run: |
          node scripts/crawl_twse_margin_balance.js --date "${{ steps.existing.outputs.target_date }}"

      - name: Explain TWSE margin crawl failure
        if: steps.crawl.outcome == 'failure'
        shell: bash
        env:
          TARGET_DATE: ${{ steps.existing.outputs.target_date }}
        run: |
          set -euo pipefail

          DIAGNOSTIC=$(node <<'NODE'
          const { fetchLatestCsv } = require('./scripts/crawl_twse_margin_balance');

          (async () => {
            const targetDate = process.env.TARGET_DATE || '';
            let officialDate = '';
            let probeError = '';

            try {
              const latest = await fetchLatestCsv();
              officialDate = latest.date || '';
            } catch (error) {
              probeError = error.message || String(error);
            }

            const dateMismatch = Boolean(targetDate && officialDate && targetDate !== officialDate);
            process.stdout.write(JSON.stringify({ targetDate, officialDate, dateMismatch, probeError }));
          })().catch(error => {
            process.stdout.write(JSON.stringify({
              targetDate: process.env.TARGET_DATE || '',
              officialDate: '',
              dateMismatch: false,
              probeError: error.message || String(error),
            }));
          });
          NODE
          )

          OFFICIAL_DATE=$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.officialDate || "")' "$DIAGNOSTIC")
          DATE_MISMATCH=$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(Boolean(x.dateMismatch)))' "$DIAGNOSTIC")
          PROBE_ERROR=$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.probeError || "")' "$DIAGNOSTIC")

          {
            echo '## 🔴 TWSE 融資融券資料擷取失敗'
            echo
            echo "<span style=\"color:#d1242f\"><strong>本次資料沒有擷取成功。</strong></span>"
            echo
            echo "- 預期擷取日期：\`${TARGET_DATE}\`"

            if [ "$DATE_MISMATCH" = 'true' ]; then
              echo "- 官方目前最新日期：\`${OFFICIAL_DATE}\`"
              echo '- 🔴 失敗原因：**日期不符，當天資料尚未更新。**'
              echo "- 判斷：workflow 要抓 \`${TARGET_DATE}\`，但 TWSE 官方目前只提供到 \`${OFFICIAL_DATE}\`，因此不接受舊日期資料，也不會寫成 \`${TARGET_DATE}\`。"
            elif [ -n "$OFFICIAL_DATE" ]; then
              echo "- 官方目前最新日期：\`${OFFICIAL_DATE}\`"
              echo '- 🔴 失敗原因：**官方最新日期已符合目標日期，但指定日期查詢仍失敗。**'
              echo '- 判斷：這不是日期尚未更新，請檢查 TWSE historical endpoint 或回傳格式。'
            else
              echo '- 官方目前最新日期：`無法判斷`'
              echo '- 🔴 失敗原因：**資料擷取失敗，且無法取得官方最新資料日期。**'
              [ -n "$PROBE_ERROR" ] && echo "- 日期探測錯誤：\`${PROBE_ERROR}\`"
            fi

            echo
            echo '> 此步驟刻意維持失敗狀態，讓 GitHub Actions 顯示紅燈；後續排程會再重新嘗試。'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "TWSE margin crawl failed. target_date=${TARGET_DATE} official_latest_date=${OFFICIAL_DATE:-unknown} date_mismatch=${DATE_MISMATCH}"
          exit 1

      - name: Refresh daily-gainers flow analysis when source list exists
        if: always() && steps.crawl.outcome != 'failure'
        run: |
          TARGET_DATE="${{ steps.existing.outputs.target_date }}"
          LIST_FILE="data_daily_gain_over_5/${TARGET_DATE}.json"
          MARGIN_FILE="data_twse_margin_balance/${TARGET_DATE}_twse_margin_balance.csv"

          if [ ! -f "$LIST_FILE" ]; then
            echo "Skip flow refresh: daily gainer list does not exist: $LIST_FILE"
            exit 0
          fi
          if [ ! -s "$MARGIN_FILE" ]; then
            echo "Skip flow refresh: margin file is not available yet: $MARGIN_FILE"
            exit 0
          fi

          echo "Refreshing flow analysis with margin data for $TARGET_DATE while preserving researched cause analysis"
          node scripts/refresh_daily_gainers_flow_preserve_cause.js "$TARGET_DATE"

      - name: Commit and push changes
        id: commit
        if: steps.crawl.outcome != 'failure'
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- data_twse_margin_balance/ data_daily_gain_over_5/analysis/ data_daily_gain_over_5/analysis-flow/

          if git diff --staged --quiet; then
            echo "No TWSE margin balance or flow-analysis changes"
            echo "pages_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_DATE=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          git commit -m "chore: update TWSE margin balance and flow analysis ${CURRENT_DATE}"

          git pull --rebase origin main
          git push origin main
          echo "pages_changed=true" >> "$GITHUB_OUTPUT"

  deploy-pages:
    name: 發布更新後分析到 GitHub Pages
    needs: crawl-twse-margin-balance
    if: needs.crawl-twse-margin-balance.result == 'success' && needs.crawl-twse-margin-balance.outputs.pages_changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      target_date: ${{ needs.crawl-twse-margin-balance.outputs.target_date }}

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
