name: "[01 台股資料] Crawl TWSE Margin Balance"

on:
  schedule:
    # 平日 20:17 台北時間 (12:17 UTC)
    - cron: '17 12 * * 1-5'
    # 平日 21:23 台北時間 (13:23 UTC)
    - cron: '23 13 * * 1-5'
    # 平日 22:29 台北時間 (14:29 UTC)
    - cron: '29 14 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Expected data date (YYYYMMDD). Leave empty for latest.'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl-twse-margin-balance:
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.existing.outputs.target_date }}
      pages_changed: ${{ steps.commit.outputs.pages_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js for date resolution
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check existing TWSE margin balance file
        id: existing
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule || '' }}
          INPUT_DATE: ${{ github.event.inputs.date || '' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_DATE" ]; then
            TARGET_DATE="$INPUT_DATE"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            resolved=$(node scripts/resolve_scheduled_collection_date.js \
              --event-name "$EVENT_NAME" \
              --schedule "$SCHEDULE_EXPR" \
              --policy same_trade_date \
              --json)
            TARGET_DATE=$(node -e 'const p=JSON.parse(process.argv[1]);process.stdout.write(p.target_date);' "$resolved")
            echo "Delay-safe scheduled date: $resolved"
          else
            # Preserve the legacy manual no-date behavior; scheduled runs no longer use runner time.
            TARGET_DATE=$(TZ='Asia/Taipei' date --date='3 hours ago' '+%Y%m%d')
          fi

          OUTPUT_FILE="data_twse_margin_balance/${TARGET_DATE}_twse_margin_balance.csv"
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "output_file=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"

          if [ -f "$OUTPUT_FILE" ] && node -e '
            const fs=require("node:fs");
            const {validateCsv}=require("./scripts/crawl_twse_margin_balance");
            validateCsv(fs.readFileSync(process.argv[1],"utf8"));
          ' "$OUTPUT_FILE"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "TWSE margin balance file already exists and is valid: $OUTPUT_FILE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        if: steps.existing.outputs.exists != 'true'
        run: npm ci

      - name: Crawl TWSE margin balance data
        id: crawl
        if: steps.existing.outputs.exists != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/crawl_twse_margin_balance.js --date "${{ steps.existing.outputs.target_date }}" 2>&1 | tee /tmp/twse-margin-crawl.log

      - name: Collect TWSE margin data status
        id: collect_status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workflow-data-status"
          crawl_outcome='${{ steps.existing.outputs.exists == 'true' && 'success' || steps.crawl.outcome }}'
          node scripts/collect_twse_margin_workflow_status.js \
            --expected-date "${{ steps.existing.outputs.target_date }}" \
            --output-file "${{ steps.existing.outputs.output_file }}" \
            --crawl-outcome "$crawl_outcome" \
            --error-log /tmp/twse-margin-crawl.log \
            --output "$RUNNER_TEMP/workflow-data-status/raw.json"
          node scripts/evaluate_workflow_data_completeness.js \
            --input "$RUNNER_TEMP/workflow-data-status/raw.json" \
            --output "$RUNNER_TEMP/workflow-data-status/evaluated.json"

      - name: Write TWSE margin data summary
        if: always() && steps.collect_status.outcome == 'success'
        run: node scripts/write_workflow_data_summary.js --input "$RUNNER_TEMP/workflow-data-status/evaluated.json"

      - name: Enforce TWSE margin completeness gate
        id: completeness_gate
        if: always() && steps.collect_status.outcome == 'success'
        run: node scripts/gate_workflow_data_completeness.js --input "$RUNNER_TEMP/workflow-data-status/evaluated.json"

      - name: Fail safely if completeness status could not be built
        if: always() && steps.collect_status.outcome != 'success'
        shell: bash
        run: |
          {
            echo '## 🔴 資料擷取完整性'
            echo '- 擷取結果：**無法確認資料完整性**'
            echo '- 原因：完整性狀態檔建立失敗。為避免誤判成功，本次維持紅燈。'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Refresh daily-gainers flow analysis when source list exists
        if: steps.completeness_gate.outcome == 'success'
        run: |
          TARGET_DATE="${{ steps.existing.outputs.target_date }}"
          LIST_FILE="data_daily_gain_over_5/${TARGET_DATE}.json"
          MARGIN_FILE="data_twse_margin_balance/${TARGET_DATE}_twse_margin_balance.csv"

          if [ ! -f "$LIST_FILE" ]; then
            echo "Skip flow refresh: daily gainer list does not exist: $LIST_FILE"
            exit 0
          fi
          if [ ! -s "$MARGIN_FILE" ]; then
            echo "Skip flow refresh: margin file is not available yet: $MARGIN_FILE"
            exit 0
          fi

          echo "Refreshing flow analysis with margin data for $TARGET_DATE while preserving researched cause analysis"
          node scripts/refresh_daily_gainers_flow_preserve_cause.js "$TARGET_DATE"

      - name: Commit and push changes
        id: commit
        if: steps.completeness_gate.outcome == 'success'
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- data_twse_margin_balance/ data_daily_gain_over_5/analysis/ data_daily_gain_over_5/analysis-flow/

          if git diff --staged --quiet; then
            echo "No TWSE margin balance or flow-analysis changes"
            echo "pages_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_DATE=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')
          git commit -m "chore: update TWSE margin balance and flow analysis ${CURRENT_DATE}"
          git pull --rebase origin main
          git push origin main
          echo "pages_changed=true" >> "$GITHUB_OUTPUT"

  deploy-pages:
    name: 發布更新後分析到 GitHub Pages
    needs: crawl-twse-margin-balance
    if: needs.crawl-twse-margin-balance.result == 'success' && needs.crawl-twse-margin-balance.outputs.pages_changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      target_date: ${{ needs.crawl-twse-margin-balance.outputs.target_date }}

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
