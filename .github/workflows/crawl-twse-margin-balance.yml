name: "[01 台股資料] Crawl TWSE Margin Balance"

on:
  schedule:
    # 平日 20:17 台北時間 (12:17 UTC)
    - cron: '17 12 * * 1-5'
    # 平日 21:23 台北時間 (13:23 UTC)
    - cron: '23 13 * * 1-5'
    # 平日 22:29 台北時間 (14:29 UTC)
    - cron: '29 14 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Expected data date (YYYYMMDD). Leave empty for latest.'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl-twse-margin-balance
  cancel-in-progress: false

jobs:
  crawl-twse-margin-balance:
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.existing.outputs.target_date }}
      pages_changed: ${{ steps.commit.outputs.pages_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js for date resolution
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check existing TWSE margin balance file
        id: existing
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule || '' }}
          INPUT_DATE: ${{ github.event.inputs.date || '' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_DATE" ]; then
            TARGET_DATE="$INPUT_DATE"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            resolved=$(node scripts/resolve_scheduled_collection_date.js \
              --event-name "$EVENT_NAME" \
              --schedule "$SCHEDULE_EXPR" \
              --policy same_trade_date \
              --json)
            TARGET_DATE=$(node -e 'const p=JSON.parse(process.argv[1]);process.stdout.write(p.target_date);' "$resolved")
            echo "Delay-safe scheduled date: $resolved"
          else
            # Preserve the legacy manual no-date behavior; scheduled runs no longer use runner time.
            TARGET_DATE=$(TZ='Asia/Taipei' date --date='3 hours ago' '+%Y%m%d')
          fi

          OUTPUT_FILE="data_twse_margin_balance/${TARGET_DATE}_twse_margin_balance.csv"
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "output_file=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"

          if [ -f "$OUTPUT_FILE" ] && node -e '
            const fs=require("node:fs");
            const {validateCsv}=require("./scripts/crawl_twse_margin_balance");
            validateCsv(fs.readFileSync(process.argv[1],"utf8"));
          ' "$OUTPUT_FILE"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "TWSE margin balance file already exists and is valid: $OUTPUT_FILE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        if: steps.existing.outputs.exists != 'true'
        run: npm ci

      - name: Crawl TWSE margin balance data
        id: crawl
        if: steps.existing.outputs.exists != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/crawl_twse_margin_balance.js --date "${{ steps.existing.outputs.target_date }}" 2>&1 | tee /tmp/twse-margin-crawl.log

      - name: Collect TWSE margin data status
        id: collect_status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workflow-data-status"
          crawl_outcome='${{ steps.existing.outputs.exists == 'true' && 'success' || steps.crawl.outcome }}'
          node scripts/collect_twse_margin_workflow_status.js \
            --expected-date "${{ steps.existing.outputs.target_date }}" \
            --output-file "${{ steps.existing.outputs.output_file }}" \
            --crawl-outcome "$crawl_outcome" \
            --error-log /tmp/twse-margin-crawl.log \
            --output "$RUNNER_TEMP/workflow-data-status/raw.json"
          node scripts/evaluate_workflow_data_completeness.js \
            --input "$RUNNER_TEMP/workflow-data-status/raw.json" \
            --output "$RUNNER_TEMP/workflow-data-status/evaluated.json"

      - name: Write TWSE margin data summary
        if: always() && steps.collect_status.outcome == 'success'
        run: node scripts/write_workflow_data_summary.js --input "$RUNNER_TEMP/workflow-data-status/evaluated.json"

      - name: Enforce TWSE margin completeness gate
        id: completeness_gate
        if: always() && steps.collect_status.outcome == 'success'
        run: node scripts/gate_workflow_data_completeness.js --input "$RUNNER_TEMP/workflow-data-status/evaluated.json"

      - name: Fail safely if completeness status could not be built
        if: always() && steps.collect_status.outcome != 'success'
        shell: bash
        run: |
          {
            echo '## 🔴 資料擷取完整性'
            echo '- 擷取結果：**無法確認資料完整性**'
            echo '- 原因：完整性狀態檔建立失敗。為避免誤判成功，本次維持紅燈。'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Snapshot validated TWSE margin artifact outside worktree
        id: snapshot
        if: steps.completeness_gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DATE="${{ steps.existing.outputs.target_date }}"
          MARGIN_FILE="${{ steps.existing.outputs.output_file }}"
          SNAPSHOT_DIR="$RUNNER_TEMP/twse-margin-publish"
          SNAPSHOT_FILE="$SNAPSHOT_DIR/${TARGET_DATE}_twse_margin_balance.csv"
          mkdir -p "$SNAPSHOT_DIR"
          cp "$MARGIN_FILE" "$SNAPSHOT_FILE"
          node -e '
            const fs=require("node:fs");
            const {validateCsv}=require("./scripts/crawl_twse_margin_balance");
            validateCsv(fs.readFileSync(process.argv[1],"utf8"));
          ' "$SNAPSHOT_FILE"
          echo "snapshot_file=$SNAPSHOT_FILE" >> "$GITHUB_OUTPUT"
          echo "Preserved validated raw margin artifact outside the repository worktree: $SNAPSHOT_FILE"

      - name: Commit and race-safe push changes
        id: commit
        if: steps.completeness_gate.outcome == 'success'
        shell: bash
        env:
          TARGET_DATE: ${{ steps.existing.outputs.target_date }}
          MARGIN_SNAPSHOT: ${{ steps.snapshot.outputs.snapshot_file }}
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          export MARGIN_FILE="data_twse_margin_balance/${TARGET_DATE}_twse_margin_balance.csv"
          export LIST_FILE="data_daily_gain_over_5/${TARGET_DATE}.json"
          export ANALYSIS_FILE="data_daily_gain_over_5/analysis/${TARGET_DATE}.json"
          export FLOW_FILE="data_daily_gain_over_5/analysis-flow/${TARGET_DATE}.json"

          PREPARE_SCRIPT="$RUNNER_TEMP/twse-margin-publish/prepare.sh"
          VALIDATE_SCRIPT="$RUNNER_TEMP/twse-margin-publish/validate.sh"

          cat > "$PREPARE_SCRIPT" <<'PREPARE'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$(dirname "$MARGIN_FILE")"
          cp "$MARGIN_SNAPSHOT" "$MARGIN_FILE"

          if [ -f "$LIST_FILE" ]; then
            echo "Refreshing flow analysis from latest main + validated margin snapshot for $TARGET_DATE"
            node scripts/refresh_daily_gainers_flow_preserve_cause.js "$TARGET_DATE"
          else
            echo "Skip flow refresh: daily gainer list does not exist on latest main: $LIST_FILE"
          fi
          PREPARE

          cat > "$VALIDATE_SCRIPT" <<'VALIDATE'
          #!/usr/bin/env bash
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const { validateCsv } = require('./scripts/crawl_twse_margin_balance');
          validateCsv(fs.readFileSync(process.env.MARGIN_FILE, 'utf8'));

          if (fs.existsSync(process.env.LIST_FILE)) {
            if (!fs.existsSync(process.env.FLOW_FILE)) {
              throw new Error(`Expected refreshed flow artifact: ${process.env.FLOW_FILE}`);
            }
            JSON.parse(fs.readFileSync(process.env.FLOW_FILE, 'utf8'));
            if (fs.existsSync(process.env.ANALYSIS_FILE)) {
              JSON.parse(fs.readFileSync(process.env.ANALYSIS_FILE, 'utf8'));
            }
          }
          NODE
          VALIDATE

          chmod +x "$PREPARE_SCRIPT" "$VALIDATE_SCRIPT"
          CURRENT_DATE=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S')

          scripts/race_safe_main_publish.sh \
            --prepare-script "$PREPARE_SCRIPT" \
            --validate-script "$VALIDATE_SCRIPT" \
            --commit-message "chore: update TWSE margin balance and flow analysis ${CURRENT_DATE}" \
            --add-path "$MARGIN_FILE" \
            --add-path "$ANALYSIS_FILE" \
            --add-path "$FLOW_FILE" \
            --max-attempts 5 \
            --output-key pages_changed

  deploy-pages:
    name: 發布更新後分析到 GitHub Pages
    needs: crawl-twse-margin-balance
    if: needs.crawl-twse-margin-balance.result == 'success' && needs.crawl-twse-margin-balance.outputs.pages_changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      target_date: ${{ needs.crawl-twse-margin-balance.outputs.target_date }}

  schedule-timing-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/EasonLiu0913/stock_data/main/scripts/write_workflow_schedule_summary.js | node
