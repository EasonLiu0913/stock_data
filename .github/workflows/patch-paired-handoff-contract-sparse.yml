name: "[07 維護更新] Patch Paired Handoff Contract Sparse"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-paired-handoff-contract-sparse.yml"

permissions:
  contents: write

concurrency:
  group: patch-paired-handoff-contract-sparse
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only handoff documents
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            AGENTS.md
            data_research/institutional-flow/institutional-withdrawal-validation-handoff.md

      - name: Patch paired handoff contract
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > "$RUNNER_TEMP/patch.py"
          python "$RUNNER_TEMP/patch.py"

      - name: Commit paired handoff contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md data_research/institutional-flow/institutional-withdrawal-validation-handoff.md
          git diff --cached --check
          git commit -m "docs: require paired implementation and closeout prompts"
          git push origin HEAD:main

  schedule-summary:
    # schedule-timing-summary:v1
    name: 排程時間摘要
    runs-on: ubuntu-latest
    steps:
      - name: Write schedule timing summary
        run: |
          echo '## Patch Paired Handoff Contract Sparse' >> "$GITHUB_STEP_SUMMARY"
          echo '- Trigger: one-time documentation maintenance push.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Purpose: patch only AGENTS.md and the canonical handoff.' >> "$GITHUB_STEP_SUMMARY"
